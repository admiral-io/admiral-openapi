    /api/v1/runs:
        get:
            tags:
                - Runs
            summary: List runs
            description: |-
                Common filter fields: `application_id`, `environment_id`, `status`.
                 Use to view run history for an environment.

                 Scope: `run:read`
            operationId: RunAPI_ListRuns
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                     (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                     STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                     Filterable fields:
                       - `application_id`: runs for a specific application (UUID).
                       - `environment_id`: runs to a specific environment (UUID).
                       - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                       - `change_set_id`: runs for a specific change set (UUID).

                     Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `application_id`: runs for a specific application (UUID).
                           - `environment_id`: runs to a specific environment (UUID).
                           - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                           - `change_set_id`: runs for a specific change set (UUID).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                - name: page_size
                  in: query
                  description: Maximum number of runs to return per page.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of runs to return per page.
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.run.v1.ListRunsResponse'
        post:
            tags:
                - Runs
            summary: Create a run
            description: |-
                The server resolves all components (with environment overrides applied),
                 builds the dependency DAG, and begins rendering and executing revisions.

                 To destroy all resources in an environment (e.g., before deleting the
                 environment), set `destroy` to true. This runs the engine's destroy
                 operation (e.g., `terraform destroy` / `tofu destroy`) for infrastructure
                 components and deletes workload resources from the cluster, in reverse
                 dependency order.

                 Concurrency: only one run can be active per application+environment
                 at a time. If a run is already in an active state (PENDING, QUEUED,
                 PLANNING, PLANNED, or APPLYING), the new run is queued and will start
                 automatically when the current run completes or is canceled.

                 Scope: `run:write`
            operationId: RunAPI_CreateRun
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.run.v1.CreateRunRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.run.v1.CreateRunResponse'

    /v1/sources/{source_id}/test:
        post:
            tags:
                - Sources
            summary: Test a source
            description: |-
                A credential in isolation cannot be meaningfully tested. A GitHub PAT is
                 just a string until a target URL is known. TestSource is where the
                 "attach credential, verify it works" flow lives.

                 This operation queries the external system in real time and may take
                 several seconds.

                 Scope: `source:write`
            operationId: SourceAPI_TestSource
            parameters:
                - name: source_id
                  in: path
                  description: Unique identifier of the source to test (UUID).
                  required: true
                  schema:
                    type: string
                    title: source_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                source_id:
                                    type: string
                                    title: source_id
                                    format: uuid
                                    description: Unique identifier of the source to test (UUID).
                            title: TestSourceRequest
                            required:
                                - source_id
                            additionalProperties: false

            additionalProperties: false
            description: RevokeApiKeyResponse contains the revoked agent API key metadata.
        admiral.api.agent.v1.SyncState:
            type: string
            title: SyncState
            enum:
                - SYNC_STATE_UNSPECIFIED
                - SYNC_STATE_SYNCED
                - SYNC_STATE_OUT_OF_SYNC
                - SYNC_STATE_UNKNOWN
                - SYNC_STATE_IGNORED
            description: |-
                SyncState describes whether the live cluster state matches the desired bundle
                 for a workload's current revision.
        admiral.api.agent.v1.TerraformAgentStatus:
            type: object
            properties:
                version:
                    type: string
                    title: version
                    description: The agent binary version (e.g., "1.2.0").
                active_jobs:
                    type: integer
                    title: active_jobs
                    format: int32
                    description: Number of jobs currently being executed by this agent.
                max_concurrent_jobs:
                    type: integer
                    title: max_concurrent_jobs
                    format: int32
                    description: Maximum number of concurrent jobs this agent supports.
                active_job_details:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ActiveJobInfo'
                    title: active_job_details
                    description: |-
                        Details of jobs currently being executed by this agent instance. The worker
                         thread updates job phase in shared memory; the heartbeat thread reads and
                         includes it on each tick. `len(active_job_details)` equals `active_jobs` on
                         every heartbeat (not capped or sampled).
            title: TerraformAgentStatus
            additionalProperties: false
            description: |-
                TerraformAgentStatus contains capacity and telemetry metrics for a TERRAFORM
                 agent, as reported via Heartbeat. Used in both the push payload
                 (HeartbeatRequest) and the read response (GetAgentStatusResponse).
        admiral.api.agent.v1.UpdateAgentRequest:
            type: object
            properties:
                agent:
                    title: agent
                    description: |-
                        The agent with updated fields. The `id` field is required. Only fields named
                         in `update_mask` are updated. `kind` is immutable and cannot be updated.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateAgentRequest
            required:
                - agent
            additionalProperties: false
            description: UpdateAgentRequest contains the agent fields to update.
        admiral.api.agent.v1.UpdateAgentResponse:
            type: object
            properties:
                agent:
                    title: agent
                    description: The updated agent.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
            title: UpdateAgentResponse
            additionalProperties: false
            description: UpdateAgentResponse contains the updated agent.
        admiral.api.agent.v1.Workload:

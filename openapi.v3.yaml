                 bound to a cluster.
        admiral.cluster.v1.CreateClusterTokenResponse:
            type: object
            properties:
                access_token:
                    title: access_token
                    description: The created token metadata. Scopes are auto-assigned for cluster SATs.
                    $ref: '#/components/schemas/admiral.common.v1.AccessToken'
                plain_text_token:
                    type: string
                    title: plain_text_token
                    description: |-
                        The raw token secret (e.g., "adms_pL2mN5oQ8rS1..."). This value is
                         shown exactly once and cannot be retrieved again. Store it securely.
            title: CreateClusterTokenResponse
            additionalProperties: false
            description: CreateClusterTokenResponse contains the newly created SAT.

                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the token (e.g., "ci-deploy-key").

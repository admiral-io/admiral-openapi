        post:
            tags:
                - Issuers
            summary: Set an issuer's keys
            description: 'Scope: `serviceaccount:write`'
            operationId: IssuerAPI_SetIssuerKeys
            parameters:
                - name: issuer_id
                  in: path
                  description: The issuer_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: issuer_id
                    pattern: ^iss-[0-9a-z]+$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            allOf:
                                - oneOf:
                                    - required:
                                        - keys
                                    - required:
                                        - accept_pending
                            anyOf:
                                - type: object
                                  properties:
                                    accept_pending:
                                        allOf:
                                            - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.SetIssuerKeysRequest.AcceptPending'
                                        title: accept_pending
                                        description: Trust the keys an agent last reported.
                                  title: accept_pending
                                - type: object
                                  properties:
                                    keys:
                                        allOf:
                                            - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.IssuerKeys'
                                        title: keys
                                        description: |-
                                            Replace where the keys come from. Switching to `reported` keeps the
                                             keys it has and stops fetching or expecting a paste.
                                  title: keys
                            unevaluatedProperties: false
                            not:
                                allOf:
                                    - anyOf:
                                        - required:
                                            - accept_pending
                                        - required:
                                            - keys
                                    - not:
                                        oneOf:
                                            - required:
                                                - accept_pending
                                            - required:
                                                - keys
                            title: SetIssuerKeysRequest
                required: true
            responses:
                "200":

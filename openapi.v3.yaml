                components:
                    type: array
                    items:
                        type: string
                    title: components
                assignment_id:
                    type: string
                    title: assignment_id
                    pattern: ^asg-[0-9a-z]+$
                    readOnly: true
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobStatus'
                    title: status
                    description: Where the job stands, and why it waits while QUEUED.
                    readOnly: true
                wait_reason:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.WaitReason'
                    title: wait_reason
                    readOnly: true
            title: RunJob
            additionalProperties: false
            description: |-
                RunJob is one agent job within a phase: the components it covers and the
                 assignment it ran on.
        admiral.api.serviceaccount.v1.CreateIssuerRequest:
            type: object
            properties:
                issuer:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.Issuer'
                    title: issuer
                    description: 'The issuer to create: `name`, `iss` and `keys`.'
            title: CreateIssuerRequest
            required:
                - issuer
            additionalProperties: false
            description: |
                create_issuer.keys // keys must be a jwks_uri or a jwks; reported keys come only from enrollment
        admiral.api.serviceaccount.v1.CreateIssuerResponse:
            type: object
            properties:
                issuer:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.Issuer'
                    title: issuer
            title: CreateIssuerResponse
            additionalProperties: false
        admiral.api.serviceaccount.v1.DeleteIssuerRequest:
            type: object
            properties:
                issuer_id:
                    type: string
                    title: issuer_id
                    pattern: ^iss-[0-9a-z]+$
            title: DeleteIssuerRequest
            required:
                - issuer_id
            additionalProperties: false
        admiral.api.serviceaccount.v1.DeleteIssuerResponse:
            type: object
            title: DeleteIssuerResponse
            additionalProperties: false
        admiral.api.serviceaccount.v1.GetIssuerRequest:
            type: object
            properties:
                issuer_id:
                    type: string
                    title: issuer_id
                    pattern: ^iss-[0-9a-z]+$
            title: GetIssuerRequest
            required:
                - issuer_id
            additionalProperties: false
        admiral.api.serviceaccount.v1.GetIssuerResponse:
            type: object
            properties:
                issuer:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.Issuer'
                    title: issuer
            title: GetIssuerResponse
            additionalProperties: false
        admiral.api.serviceaccount.v1.GetServiceAccountRequest:
            type: object
            properties:
                service_account_id:
                    type: string
                    title: service_account_id
                    pattern: ^sa-[0-9a-z]+$
            title: GetServiceAccountRequest
            required:
                - service_account_id
            additionalProperties: false
        admiral.api.serviceaccount.v1.GetServiceAccountResponse:
            type: object
            properties:
                service_account:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.ServiceAccount'
                    title: service_account
            title: GetServiceAccountResponse
            additionalProperties: false
        admiral.api.serviceaccount.v1.Issuer:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^iss-[0-9a-z]+$
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: One made at enrollment is named after the agent that enrolled it.
                iss:
                    type: string
                    title: iss
                    maxLength: 2048
                    minLength: 1
                    description: |-
                        (IMMUTABLE) The `iss` every token must carry, exactly, e.g.
                         `https://token.actions.githubusercontent.com`. One made at enrollment
                         takes it from the enrolling token. Fixed once set.
                keys:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.IssuerKeys'
                    title: keys
                key_ids:
                    type: array
                    items:
                        type: string
                        readOnly: true
                    title: key_ids
                    description: The key ids currently trusted.
                    readOnly: true
                keys_updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: keys_updated_at
                    readOnly: true
                pending_key_ids:
                    type: array
                    items:
                        type: string
                        readOnly: true
                    title: pending_key_ids
                    description: |-
                        Key ids an agent reported that are not trusted yet. They are never
                         applied on their own: an admin accepts them with SetIssuerKeys.
                    readOnly: true
                pending_keys_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: pending_keys_at
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
            title: Issuer
            required:
                - keys
            additionalProperties: false
            description: |-
                Issuer is a set of keys Admiral accepts tokens from. A token must carry
                 this `iss`, be issued for Admiral as its audience, and verify against the
                 issuer's keys.
        admiral.api.serviceaccount.v1.IssuerKeys:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - jwks_uri
                    - required:
                        - jwks
                    - required:
                        - reported
            anyOf:
                - type: object
                  properties:
                    jwks:
                        type: string
                        title: jwks
                        maxLength: 65536
                        minLength: 2
                        description: |-
                            A JSON Web Key Set, pasted in. It replaces the trusted set, so paste
                             the whole set the issuer serves: during a rotation that holds the old
                             key and the new one.
                  title: jwks
                - type: object
                  properties:
                    jwks_uri:
                        type: string
                        title: jwks_uri
                        maxLength: 2048
                        format: uri
                        description: |
                            Fetched and refreshed when a token names a key not yet seen. Rotation
                             needs no action.
                            string.prefix = "https://"
                  title: jwks_uri
                - type: object
                  properties:
                    reported:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.IssuerKeys.Reported'
                        title: reported
                        description: |-
                            The first keys arrive when an agent enrolls. Keys agents report after
                             that wait in `pending_key_ids` for an admin to accept. Never set on
                             create: an issuer with reported keys is made only by enrollment.
                  title: reported
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - jwks
                        - required:
                            - jwks_uri
                        - required:
                            - reported
                    - not:
                        oneOf:
                            - required:
                                - jwks
                            - required:
                                - jwks_uri
                            - required:
                                - reported
            title: IssuerKeys
            description: IssuerKeys is where Admiral gets the keys that verify an issuer's tokens.
        admiral.api.serviceaccount.v1.IssuerKeys.Reported:
            type: object
            title: Reported
            additionalProperties: false
            description: |-
                Reported marks keys the agents that trust the issuer report from inside
                 it, for an issuer Admiral cannot reach (kind, minikube, k3s, on-prem).
        admiral.api.serviceaccount.v1.ListIssuersRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by issuer name.

                         Example: `field['name'] = 'dev'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListIssuersRequest
            additionalProperties: false
        admiral.api.serviceaccount.v1.ListIssuersResponse:
            type: object
            properties:
                issuers:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.serviceaccount.v1.Issuer'
                    title: issuers
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListIssuersResponse
            additionalProperties: false
        admiral.api.serviceaccount.v1.ListServiceAccountsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `issuer_id`: service accounts that trust this issuer.
                           - `agent_id`: the service account this agent runs as.

                         Example: `field['issuer_id'] = 'iss-4m8q2x7k1p9c'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListServiceAccountsRequest
            additionalProperties: false
        admiral.api.serviceaccount.v1.ListServiceAccountsResponse:
            type: object
            properties:
                service_accounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.serviceaccount.v1.ServiceAccount'
                    title: service_accounts
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListServiceAccountsResponse
            additionalProperties: false
        admiral.api.serviceaccount.v1.ServiceAccount:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^sa-[0-9a-z]+$
                    readOnly: true
                agent_id:
                    type: string
                    title: agent_id
                    description: |-
                        `agt-`: the agent that runs as this service account. Empty for one that
                         runs no agent.
                    readOnly: true
                issuer_id:
                    type: string
                    title: issuer_id
                    description: |-
                        `iss-`: the issuer whose tokens it accepts. For an agent's, set when the
                         agent enrolls; empty before.
                    readOnly: true
                subject:
                    type: string
                    title: subject
                    description: |-
                        The `sub` a token must carry. For a Kubernetes service account,
                         `system:serviceaccount:<namespace>:<name>`. For an agent's, recorded from
                         its verified token when it enrolls and fixed from then on; empty before.
                    readOnly: true
                enrolled_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: enrolled_at
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
            title: ServiceAccount
            additionalProperties: false
            description: |-
                ServiceAccount is a non-human principal. With `issuer_id` and `subject` set
                 it signs in with a token from that issuer carrying that subject, matched
                 exactly; the exact match is what secures a shared issuer, which anyone can
                 get a token from.
        admiral.api.serviceaccount.v1.SetIssuerKeysRequest:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - keys
                    - required:
                        - accept_pending
            anyOf:
                - type: object
                  properties:
                    accept_pending:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.SetIssuerKeysRequest.AcceptPending'
                        title: accept_pending
                        description: Trust the keys an agent last reported.
                  title: accept_pending
                - type: object
                  properties:
                    keys:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.IssuerKeys'
                        title: keys
                        description: |-
                            Replace where the keys come from. Switching to `reported` keeps the
                             keys it has and stops fetching or expecting a paste.
                  title: keys
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - accept_pending
                        - required:
                            - keys
                    - not:
                        oneOf:
                            - required:
                                - accept_pending
                            - required:
                                - keys
            properties:
                issuer_id:
                    type: string
                    title: issuer_id
                    pattern: ^iss-[0-9a-z]+$
            title: SetIssuerKeysRequest
            required:
                - issuer_id
        admiral.api.serviceaccount.v1.SetIssuerKeysRequest.AcceptPending:
            type: object
            title: AcceptPending
            additionalProperties: false
            description: AcceptPending marks accepting the keys in `pending_key_ids`.
        admiral.api.serviceaccount.v1.SetIssuerKeysResponse:
            type: object
            properties:
                issuer:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.Issuer'
                    title: issuer
            title: SetIssuerKeysResponse
            additionalProperties: false
        admiral.api.tenant.v1.GetTenantRequest:
            type: object
            title: GetTenantRequest
            additionalProperties: false
            description: 'GetTenantRequest names nothing: the tenant is the caller''s own.'
        admiral.api.tenant.v1.GetTenantResponse:
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
                    title: tenant
            title: GetTenantResponse
            additionalProperties: false
        admiral.api.tenant.v1.Tenant:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^tnt-[0-9a-z]+$
                    description: Unique identifier.
                    readOnly: true
                slug:
                    type: string
                    title: slug
                    description: URL-safe identifier, unique across Admiral. Fixed at creation.
                    readOnly: true
                display_name:
                    type: string
                    title: display_name
                    maxLength: 256
                    description: Human-readable name.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant.Status'
                    title: status
                    description: Lifecycle state.
                    readOnly: true
                avatar_url:
                    type:
                        - string
                        - "null"
                    title: avatar_url
                    description: |-
                        The organization's logo, shown on its sign-in page and in the console.
                         Absent when none is set.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Tenant
            additionalProperties: false
            description: |-
                Tenant is the account as its own members see it: its identity, its lifecycle
                 state, and the settings they control. Operational detail about how the
                 account is run is not part of this view.
        admiral.api.tenant.v1.Tenant.Status:
            type: string
            title: Status
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_ACTIVE
                - STATUS_SUSPENDED
            description: |-
                Status is the account's lifecycle state. A caller sees it but cannot
                 set it: suspension and reactivation are imposed, not requested.
        admiral.api.tenant.v1.UpdateTenantRequest:
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
                    title: tenant
                    description: |-
                        The tenant with updated fields. Only fields named in `update_mask` are
                         applied.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Supported fields: `display_name`.
            title: UpdateTenantRequest
            required:
                - tenant
            additionalProperties: false
            description: UpdateTenantRequest updates the caller's own tenant, so it names no id.
        admiral.api.tenant.v1.UpdateTenantResponse:
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
                    title: tenant
            title: UpdateTenantResponse
            additionalProperties: false
        admiral.api.user.v1.GetMeRequest:
            type: object
            title: GetMeRequest
            additionalProperties: false
            description: |-
                GetMeRequest is the request message for GetMe.
                 No parameters are required as the user is identified by the auth token.
        admiral.api.user.v1.GetMeResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.User'
                    title: user
                    description: The user profile.
            title: GetMeResponse
            additionalProperties: false
            description: GetMeResponse contains the authenticated user's profile.
        admiral.api.user.v1.GetUserRequest:
            type: object
            properties:
                user_id:
                    type: string
                    title: user_id
                    pattern: ^usr-[0-9a-z]+$
                    description: The unique identifier of the user.
            title: GetUserRequest
            required:
                - user_id
            additionalProperties: false
            description: GetUserRequest identifies a user to retrieve by ID.
        admiral.api.user.v1.GetUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.User'
                    title: user
                    description: The user profile.
            title: GetUserResponse
            additionalProperties: false
            description: GetUserResponse contains the requested user's profile.
        admiral.api.user.v1.ListUsersRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `email`: filter by address.
                           - `status`: filter by status.

                         Example: `field['status'] = 'USER_STATUS_ACTIVE'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of users to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListUsersRequest
            additionalProperties: false
            description: |-
                ListUsersRequest pages through the members of the caller's tenant. The
                 tenant is never a parameter: it is the caller's own.
        admiral.api.user.v1.ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.user.v1.User'
                    title: users
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListUsersResponse
            additionalProperties: false
            description: ListUsersResponse contains a page of members.
        admiral.api.user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^usr-[0-9a-z]+$
                    description: Unique identifier for the user.
                    readOnly: true
                email:
                    type: string
                    title: email
                    description: User's email address.
                email_verified:
                    type: boolean
                    title: email_verified
                    description: Whether the email has been verified by the IdP.
                    readOnly: true
                display_name:
                    type:
                        - string
                        - "null"
                    title: display_name
                    description: User's display name for UI purposes.
                given_name:
                    type:
                        - string
                        - "null"
                    title: given_name
                    description: User's given (first) name.
                family_name:
                    type:
                        - string
                        - "null"
                    title: family_name
                    description: User's family (last) name.
                avatar_url:
                    type:
                        - string
                        - "null"
                    title: avatar_url
                    description: URL to the user's avatar image.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the user was created.
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the user was last updated.
                    readOnly: true
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    description: The user's standing in the tenant.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserStatus'
                    title: status
                    description: Whether the user can currently sign in.
                    readOnly: true
            title: User
            additionalProperties: false
            description: User represents a user's profile information.
            example:
                id: "usr-5k2m8q1x7p4c"
                email: "alex.chen@example.com"
                display_name: "Alex Chen"
                given_name: "Alex"
                family_name: "Chen"
                avatar_url: "https://avatars.example.com/alex-chen.jpg"
                created_at: "2025-06-01T09:00:00Z"
                updated_at: "2025-11-15T11:00:00Z"
        admiral.api.user.v1.UserRole:
            type: string
            title: UserRole
            enum:
                - USER_ROLE_UNSPECIFIED
                - USER_ROLE_OWNER
                - USER_ROLE_ADMIN
                - USER_ROLE_MEMBER
            description: |-
                UserRole is a member's standing in the tenant. The tiers imply one another
                 downward: an owner can do everything an administrator can, an administrator
                 everything a member can.
        admiral.api.user.v1.UserStatus:
            type: string
            title: UserStatus
            enum:
                - USER_STATUS_UNSPECIFIED
                - USER_STATUS_ACTIVE
                - USER_STATUS_SUSPENDED
            description: UserStatus is whether a member can currently sign in.
        admiral.common.v1.ActorRef:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: 'The actor''s typed id: a `usr-` user id or an `sa-` service account id.'
                display_name:
                    type: string
                    title: display_name
                    description: Human-readable name (e.g., "John Smith", "deploy-bot").
                email:
                    type: string
                    title: email
                    description: Email address (empty for non-human actors).
            title: ActorRef
            additionalProperties: false
            description: |-
                ActorRef is a lightweight reference to the user or agent that performed an action.
                 Server-populated on all resource responses. Clients should never send this.
        admiral.common.v1.ApiKeyStatus:
            type: string
            title: ApiKeyStatus
            enum:
                - API_KEY_STATUS_UNSPECIFIED
                - API_KEY_STATUS_ACTIVE
                - API_KEY_STATUS_REVOKED
            description: ApiKeyStatus represents the lifecycle state of an API key.
        google.protobuf.FieldMask:
            type: string
            description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
        google.protobuf.ListValue:
            type: array
            items:
                $ref: '#/components/schemas/google.protobuf.Value'
            description: A JSON array whose elements may be any JSON value.
        google.protobuf.NullValue:
            type: string
            title: NullValue
            enum:
                - NULL_VALUE
            description: |-
                `NullValue` is a singleton enumeration to represent the null value for the
                 `Value` type union.

                 The JSON representation for `NullValue` is JSON `null`.
        google.protobuf.Struct:
            type: object
            additionalProperties:
                $ref: '#/components/schemas/google.protobuf.Value'
            description: A JSON object whose property values may be any JSON value.
        google.protobuf.Timestamp:
            type: string
            examples:
                - "2023-01-15T01:30:15.01Z"
                - "2024-12-25T12:00:00Z"
            format: date-time
            description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
        google.protobuf.Value:
            oneOf:
                - type: "null"
                - type: number
                - type: string
                - type: boolean
                - type: array
                - type: object
                  additionalProperties: true
            description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: >-
                An API key, or an access token minted from one. Pass it in the Authorization header: `Bearer admp_...`
security: [{bearerAuth: []}]
tags:
    - name: Applications
      description: Manage application lifecycle and configuration.
    - name: Environments
      description: Manage deployment environments within an application, and view the components deployed to them.
    - name: ChangeSets
      description: 'Manage change sets: scoped, isolated proposals to mutate the deployed state of an application within a single environment.'
    - name: Runs
      description: Plan and apply change sets, check environments for drift, and reapply what they desire.
    - name: Components
      description: 'Publish, import and curate the component registry: components, their versions and tags.'
    - name: Tenant
      description: 'Your organization: its name, slug, status and logo.'
    - name: Credentials
      description: Manage credentials for accessing external systems.
    - name: Service Accounts
      description: The non-human principals your agents run as, and the issuer and subject each signs in with.
    - name: Issuers
      description: The token issuers your service accounts trust, by key URL, pasted keys, or keys agents report.
    - name: Agents
      description: Manage your agents, and who may use each.
    - name: Jobs
      description: Follow and cancel the work agents run.
    - name: User
      description: Retrieve user profiles and list the members of your tenant.
    - name: Invitations
      description: Invite people into your tenant, see what is outstanding, and withdraw an invitation.
    - name: API Keys
      description: Manage your own API keys for authenticating scripts and CI.
servers:
    - url: "{baseUrl}"
      description: Admiral API server

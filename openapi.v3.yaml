                          assignment_id: "asg-6t2k9m4q8x1p"
                          agent_id: "agt-2p7x4k9m1q3c"
                    plan_digest: "sha256:ab12f0c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f"
                apply:
                    jobs:
                        - job_id: "job-8p1c3k7q2m9x"
                          components: ["billing-api"]
                          assignment_id: "asg-6t2k9m4q8x1p"
                          agent_id: "agt-2p7x4k9m1q3c"
                    applied_by:
                        id: "usr-5k2m8q1x7p4c"
                        display_name: "Alex Chen"
                        email: "alex.chen@example.com"
                    generation: 15
                approvals:
                    - plan_digest: "sha256:ab12f0c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f"
                      approved_by:
                        id: "usr-8n3r6t1w4y9z"
                        display_name: "Sam Rivera"
                        email: "sam.rivera@example.com"
                created_at: "2025-11-20T14:00:00Z"
                finished_at: "2025-11-20T14:12:00Z"
        admiral.api.run.v1.Run.Status:
            type: string
            title: Status
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_PREPARING
                - STATUS_QUEUED
                - STATUS_PLANNING
                - STATUS_PLANNED
                - STATUS_NO_CHANGES
                - STATUS_APPLYING
                - STATUS_APPLIED
                - STATUS_PARTIAL
                - STATUS_SUPERSEDED
                - STATUS_FAILED
                - STATUS_CANCELLED

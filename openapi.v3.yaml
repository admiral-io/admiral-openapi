        admiral.api.run.v1.ListRunsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `id`: runs by id, for fetching several at once (`field['id'] IN [...]`).
                           - `environment_id`: runs of one environment.
                           - `change_set_id`: runs of one change set.
                           - `status`: filter by run status.
                           - `kind`: `change_set`, `drift_check` or `reapply`, which is what
                             started the run (a revision, or `desired` with its mode).

                         Example: `field['environment_id'] = 'env-7q2k9m4x8p1c' AND field['kind'] = 'change_set'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListRunsRequest
            additionalProperties: false
        admiral.api.run.v1.ListRunsResponse:
            type: object
            properties:
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: runs
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListRunsResponse
            additionalProperties: false
        admiral.api.run.v1.PlanPhase:
            type: object
            properties:
                jobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.RunJob'
                    title: jobs
                    description: |-
                        One per agent job; a change set touching an IAM component and an
                         ordinary one plans on two.
                plan_digest:
                    type: string
                    title: plan_digest
                    description: '`sha256:<hex>` of the changes: identical plans have identical digests.'
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ComponentPlan'
                    title: components
                message:
                    type: string
                    title: message
                    description: Why the plan failed, when it did.
                started_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: started_at
                finished_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: finished_at
            title: PlanPhase
            additionalProperties: false
            description: PlanPhase is a run's plan.
        admiral.api.run.v1.Run:
            type: object
            anyOf:
                - type: object
                  properties:
                    desired:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.run.v1.Desired'
                        title: desired
                        description: What the environment desires.
                  title: desired
                - type: object
                  properties:
                    revision_id:
                        type: string
                        title: revision_id
                        pattern: ^rev-[0-9a-z]+$
                        description: A change set revision.
                  title: revision_id
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - desired
                        - required:
                            - revision_id
                    - not:
                        oneOf:
                            - required:
                                - desired
                            - required:
                                - revision_id
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^run-[0-9a-z]+$
                    readOnly: true
                environment_id:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    readOnly: true
                change_set_id:
                    type: string
                    title: change_set_id
                    description: The change set of `revision_id`. Absent for a desired run.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run.Status'
                    title: status
                    readOnly: true
                trigger:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run.Trigger'
                    title: trigger
                    readOnly: true
                wait_reason:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.WaitReason'
                    title: wait_reason
                    description: |-
                        While QUEUED, the reason of the first job still waiting; each job in the
                         phases carries its own.
                    readOnly: true
                plan:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.PlanPhase'
                    title: plan
                    readOnly: true
                apply:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ApplyPhase'
                    title: apply
                    description: Absent until the run is applied.
                    readOnly: true
                approvals:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.Approval'
                    title: approvals
                    description: |-
                        Approvals of this run's plan, including ones carried from an earlier run
                         of the same revision.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                finished_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: finished_at
                    readOnly: true
                required_approval:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.ApprovalRule'
                    title: required_approval
                    description: |-
                        What an apply needs from people: the environment's rule combined with the
                         rule of every agent the run touches, fixed when the plan finishes so an
                         edited rule never changes a run under its reviewers. Absent before then,
                         and when nothing is required.
                    readOnly: true
            title: Run
            description: |-
                Run is one plan of an environment, and the apply of that plan when it is
                 approved and applied.
            example:
                id: "run-4h8k2p9x7m1q"
                environment_id: "env-7q2k9m4x8p1c"
                revision_id: "rev-9f2m4k7x1p3q"
                change_set_id: "cs-3k9x2m7qpl0a"
                status: "STATUS_APPLIED"
                trigger: "TRIGGER_USER"
                plan:
                    jobs:
                        - job_id: "job-2m7q4x9k1p8c"

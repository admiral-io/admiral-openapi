openapi: 3.1.0
info:
    title: Admiral API
    description: The Admiral REST API for managing applications, infrastructure, and runs. See https://admiral.io/docs for complete documentation.
paths:
    /api/v1/applications:
        get:
            tags:
                - Applications
            summary: List applications
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                     (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                     STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                     Filterable fields:
                       - `name`: filter by application name.
                       - `labels.key`: filter by label key.

                     Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `name`: filter by application name.
                           - `labels.key`: filter by label key.

                         Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                - name: page_size
                  in: query
                  description: Maximum number of applications to return per page.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of applications to return per page.
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.application.v1.ListApplicationsResponse'
        post:
            tags:
                - Applications
            summary: Create an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.application.v1.CreateApplicationRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.application.v1.CreateApplicationResponse'
    /api/v1/applications/{application.id}:
        patch:
            tags:
                - Applications
            summary: Update an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            parameters:
                - name: application.id
                  in: path
                  description: Unique identifier for the application (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the application (UUID).
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                application:
                                    title: application
                                    description: |-
                                        The application with updated fields.
                                         Only fields specified in `update_mask` are updated.
                                    $ref: '#/components/schemas/admiral.application.v1.Application'
                                update_mask:
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. If unset, all mutable fields are updated.
                                         Supported fields: `name`, `description`, `labels`.
                                    $ref: '#/components/schemas/google.protobuf.FieldMask'
                            title: UpdateApplicationRequest
                            required:
                                - application
                            additionalProperties: false
                            description: UpdateApplicationRequest contains the application fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.application.v1.UpdateApplicationResponse'
    /api/v1/applications/{application_id}:
        get:
            tags:
                - Applications
            summary: Retrieve an application
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application (UUID).
                  required: true
                  schema:
                    type: string
                    title: application_id
                    format: uuid
                    description: The unique identifier of the application (UUID).
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.application.v1.GetApplicationResponse'
        delete:
            tags:
                - Applications
            summary: Delete an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application to delete (UUID).
                  required: true
                  schema:
                    type: string
                    title: application_id
                    format: uuid
                    description: The unique identifier of the application to delete (UUID).
                - name: force
                  in: query
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                     environments and their runs (metadata records only).
                  schema:
                    type: boolean
                    title: force
                    description: |-
                        When true, bypass the children-exist check and cascade-delete all
                         environments and their runs (metadata records only).
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.application.v1.DeleteApplicationResponse'
    /api/v1/changesets:
        get:
            tags:
                - ChangeSets
            summary: List change sets
            description: |-
                Common filter fields: `application_id`, `environment_id`, `status`. The
                 returned `ChangeSet` records do not include entries or variable entries;
                 call GetChangeSet for the full record.

                 Scope: `app:read`
            operationId: ChangeSetAPI_ListChangeSets
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                     (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                     STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                     Filterable fields:
                       - `application_id`: change sets for a specific application (UUID).
                       - `environment_id`: change sets for a specific environment (UUID).
                       - `status`: filter by status (OPEN, DEPLOYED, DISCARDED).

                     Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'OPEN'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `application_id`: change sets for a specific application (UUID).
                           - `environment_id`: change sets for a specific environment (UUID).
                           - `status`: filter by status (OPEN, DEPLOYED, DISCARDED).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'OPEN'`
                - name: page_size
                  in: query
                  description: Maximum number of change sets to return per page.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of change sets to return per page.
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.ListChangeSetsResponse'
        post:
            tags:
                - ChangeSets
            summary: Create a change set
            description: |-
                Multiple change sets can be open against the same target simultaneously.
                 Conflicts are detected at deploy time, not at create time.

                 Scope: `app:write`
            operationId: ChangeSetAPI_CreateChangeSet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.changeset.v1.CreateChangeSetRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.CreateChangeSetResponse'
    /api/v1/changesets/{change_set.id}:
        patch:
            tags:
                - ChangeSets
            summary: Update a change set
            description: |-
                Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_UpdateChangeSet
            parameters:
                - name: change_set.id
                  in: path
                  description: Unique identifier for the change set (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the change set (UUID).
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set:
                                    title: change_set
                                    description: |-
                                        The change set with updated fields. Only fields listed in `update_mask`
                                         are applied.
                                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
                                update_mask:
                                    title: update_mask
                                    description: 'The set of fields to update. Supported fields: `title`, `description`.'
                                    $ref: '#/components/schemas/google.protobuf.FieldMask'
                            title: UpdateChangeSetRequest
                            required:
                                - change_set
                            additionalProperties: false
                            description: UpdateChangeSetRequest updates a change set's mutable metadata.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.UpdateChangeSetResponse'
    /api/v1/changesets/{change_set_id}:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a change set
            description: 'Scope: `app:read`'
            operationId: ChangeSetAPI_GetChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.GetChangeSetResponse'
    /api/v1/changesets/{change_set_id}/copy:
        post:
            tags:
                - ChangeSets
            summary: Copy a change set to another environment
            description: |-
                The target application is the source's application; only the environment
                 can be retargeted. After copying, the resulting change set can be
                 modified (entries added, removed, or rewritten) before being deployed.

                 Scope: `app:write`
            operationId: ChangeSetAPI_CopyChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the source change set to copy. Accepts either the short
                     ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the source change set to copy. Accepts either the short
                         ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the source change set to copy. Accepts either the short
                                         ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                                environment_id:
                                    type: string
                                    title: environment_id
                                    format: uuid
                                    description: |-
                                        The target environment for the new change set (UUID). Must belong to
                                         the source change set's application.
                                title:
                                    type: string
                                    title: title
                                    maxLength: 256
                                    description: Optional title override. Defaults to the source's title when empty.
                                description:
                                    type: string
                                    title: description
                                    maxLength: 4096
                                    description: |-
                                        Optional description override. Defaults to the source's description
                                         when empty.
                            title: CopyChangeSetRequest
                            additionalProperties: false
                            description: |-
                                CopyChangeSetRequest creates a new OPEN change set by copying an existing
                                 one to a target environment.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.CopyChangeSetResponse'
    /api/v1/changesets/{change_set_id}/diff:
        get:
            tags:
                - ChangeSets
            summary: Compute a change set diff
            description: |-
                Sensitive values are never returned. Changed-but-masked entries set
                 `sensitive=true` and omit `old`/`new` so the reviewer knows a change is
                 present without seeing the value.

                 Available for change sets in any status; for non-OPEN change sets the
                 result reflects the diff against the env's CURRENT HEAD, not the env's
                 state at the time the change set was deployed.

                 Scope: `app:read`
            operationId: ChangeSetAPI_DiffChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.DiffChangeSetResponse'
    /api/v1/changesets/{change_set_id}/discard:
        post:
            tags:
                - ChangeSets
            summary: Discard a change set
            description: 'Scope: `app:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set to discard. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set to discard. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the change set to discard. Accepts either the short ID
                                         (`cs-<suffix>`) or the canonical UUID.
                            title: DiscardChangeSetRequest
                            additionalProperties: false
                            description: DiscardChangeSetRequest abandons an OPEN change set.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.DiscardChangeSetResponse'
    /api/v1/changesets/{change_set_id}/entries/{component_name}:
        put:
            tags:
                - ChangeSets
            summary: Add or update an entry
            description: |-
                The `change_type` field selects the operation:
                   - CREATE: add a new component. Requires `module_id`. Rejects if a
                     component with the same name already exists in the application.
                   - UPDATE: change an existing component. The name must match an
                     existing component in the application. Only non-empty optional
                     fields are recorded as changes.
                   - DESTROY: schedule the component for terraform destroy at deploy.
                   - ORPHAN: detach from management without destroying infrastructure.

                 Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_SetEntry
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                - name: component_name
                  in: path
                  description: Component name (stable identifier set at creation). Required.
                  required: true
                  schema:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Component name (stable identifier set at creation). Required.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the change set. Accepts either the short ID
                                         (`cs-<suffix>`) or the canonical UUID.
                                component_name:
                                    type: string
                                    title: component_name
                                    maxLength: 63
                                    minLength: 1
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                    description: Component name (stable identifier set at creation). Required.
                                change_type:
                                    not:
                                        enum:
                                            - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
                                    title: change_type
                                    description: The change type.
                                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetEntryType'
                                module_id:
                                    type:
                                        - string
                                        - "null"
                                    title: module_id
                                    format: uuid
                                    description: |-
                                        The module to deploy (UUID). Required for CREATE; optional for UPDATE.
                                         Not allowed for DESTROY/ORPHAN.
                                version:
                                    type:
                                        - string
                                        - "null"
                                    title: version
                                    maxLength: 256
                                    description: Optional ref override.
                                values_template:
                                    type:
                                        - string
                                        - "null"
                                    title: values_template
                                    maxLength: 65536
                                    description: Values template for module inputs.
                                depends_on:
                                    type: array
                                    items:
                                        type: string
                                    title: depends_on
                                    description: Explicit dependencies (component names). Empty list clears.
                                description:
                                    type:
                                        - string
                                        - "null"
                                    title: description
                                    maxLength: 1024
                                    description: Optional description of the proposed change.
                            title: SetEntryRequest
                            additionalProperties: false
                            description: SetEntryRequest creates or replaces a component entry within a change set.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.SetEntryResponse'
        delete:
            tags:
                - ChangeSets
            summary: Remove an entry
            description: |-
                Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_RemoveEntry
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                - name: component_name
                  in: path
                  description: Component name of the entry to remove.
                  required: true
                  schema:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Component name of the entry to remove.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.RemoveEntryResponse'
    /api/v1/changesets/{change_set_id}/variables/{key}:
        put:
            tags:
                - ChangeSets
            summary: Set a variable
            description: |-
                To delete a variable on apply, use RemoveVariable; it writes a
                 tombstone entry on the change set so the apply phase removes the key.

                 Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_SetVariable
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                - name: key
                  in: path
                  description: The variable key.
                  required: true
                  schema:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the change set. Accepts either the short ID
                                         (`cs-<suffix>`) or the canonical UUID.
                                value:
                                    type: string
                                    title: value
                                    minLength: 1
                                    description: The value to set on apply. For COMPLEX type, must be valid JSON.
                                type:
                                    title: type
                                    description: How the value should be interpreted. Defaults to STRING when unspecified.
                                    $ref: '#/components/schemas/admiral.variable.v1.VariableType'
                                sensitive:
                                    type: boolean
                                    title: sensitive
                                    description: When true, the value is encrypted at rest and masked in API responses.
                            title: SetVariableRequest
                            additionalProperties: false
                            description: SetVariableRequest creates or replaces a variable entry within a change set.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.SetVariableResponse'
        delete:
            tags:
                - ChangeSets
            summary: Remove a variable on apply
            description: |-
                To withdraw the deletion intent before deploy, call SetVariable for the
                 same key with the desired value (which overwrites the tombstone).

                 Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_RemoveVariable
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                - name: key
                  in: path
                  description: The variable key to remove on apply.
                  required: true
                  schema:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key to remove on apply.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.changeset.v1.RemoveVariableResponse'
    /api/v1/clusters:
        get:
            tags:
                - Clusters
            summary: List clusters
            description: 'Scope: `cluster:read`'
            operationId: ClusterAPI_ListClusters
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                     (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                     STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                     Filterable fields:
                       - `name`: filter by cluster name.
                       - `health_status`: filter by health status.
                       - `labels.key`: filter by label key.

                     Example: `field['health_status'] = 'HEALTHY' AND field['labels.region'] = 'us-east-1'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `name`: filter by cluster name.
                           - `health_status`: filter by health status.
                           - `labels.key`: filter by label key.

                         Example: `field['health_status'] = 'HEALTHY' AND field['labels.region'] = 'us-east-1'`
                - name: page_size
                  in: query
                  description: Maximum number of clusters to return per page.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100

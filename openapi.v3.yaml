                    type: string
                    title: catalog_item_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.catalog.v1.GetCatalogItemResponse'
        delete:
            tags:
                - Catalog
            summary: Delete a catalog item
            description: 'Scope: `catalog:write`'
            operationId: CatalogAPI_DeleteCatalogItem
            parameters:
                - name: catalog_item_id
                  in: path
                  description: Unique identifier of the catalog item to delete (UUID).
                  required: true
                  schema:
                    type: string
                    title: catalog_item_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:

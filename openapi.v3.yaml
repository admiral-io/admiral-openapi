            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                digest:
                                    type: string
                                    title: digest
                                    pattern: ^sha256:[0-9a-f]{64}$
                                    description: The revision to name, as `sha256:<hex>`.
                            title: SetTagRequest
                            required:

                    title: environment
                    description: The created environment.
                    $ref: '#/components/schemas/admiral.environment.v1.Environment'
            title: CreateEnvironmentResponse
            additionalProperties: false
            description: CreateEnvironmentResponse contains the newly created environment.
        admiral.environment.v1.DeleteEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The unique identifier of the environment to delete (UUID).
                force:
                    type: boolean
                    title: force
                    description: |-
                        When true, bypass the children-exist check and cascade-delete all
                         run records (metadata only).
            title: DeleteEnvironmentRequest
            additionalProperties: false
            description: DeleteEnvironmentRequest identifies an environment to delete.
        admiral.environment.v1.DeleteEnvironmentResponse:
            type: object
            title: DeleteEnvironmentResponse
            additionalProperties: false
            description: DeleteEnvironmentResponse is empty on success.
        admiral.environment.v1.Environment:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the environment (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this environment belongs to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                         Unique within the application. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the environment's purpose
                         (e.g., "US East production serving live traffic" or
                         "Shared staging for QA validation before prod promotion").
                workload_targets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.environment.v1.WorkloadTarget'
                    title: workload_targets
                    description: |-
                        Workload runtime targets. Each entry binds this environment to a workload
                         runtime (e.g., Kubernetes cluster). At most one target per WorkloadType
                         is allowed; the server rejects duplicates.

                         Components with workload sources (Helm, Kustomize, manifests) are routed
                         to the matching target at deployment time. If no matching target exists,
                         the run fails with a clear error.
                infrastructure_targets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.environment.v1.InfrastructureTarget'
                    title: infrastructure_targets
                    description: |-
                        Infrastructure runtime targets. Each entry binds this environment to an
                         infrastructure provisioning tool (e.g., Terraform runner). At most one
                         target per InfrastructureType is allowed; the server rejects duplicates.

                         Components with infrastructure sources (Terraform modules) are routed to
                         the matching target at deployment time. If no matching target exists,
                         the run fails with a clear error.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering environments
                         (e.g., `{"region": "us-east-1", "tier": "production"}`).
                has_pending_changes:
                    type: boolean
                    title: has_pending_changes
                    description: |-
                        Whether the environment has configuration changes that have not yet been
                         deployed. Server-derived by comparing current resolved config (variables,
                         component settings, overrides, source versions) against the last
                         successful run's snapshot. False if no successful run exists yet (a
                         fresh environment with no runs returns false; use `last_deployed_at`
                         to distinguish "clean" from "never deployed").
                last_deployed_at:
                    title: last_deployed_at
                    description: |-
                        When the last successful run for this environment completed. Absent if
                         no successful run has occurred yet.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                created_by:
                    title: created_by
                    description: The user or agent who created this environment (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the environment was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the environment was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Environment
            additionalProperties: false
            description: |-
                Environment represents a named deployment target for an application. Each
                 environment binds an application to its workload and infrastructure runtimes.

                 An environment carries two independent sets of runtime bindings:
                   - **Workload targets**: where application workloads are deployed
                     (e.g., a Kubernetes cluster and namespace).
                   - **Infrastructure targets**: how infrastructure is provisioned
                     (e.g., Terraform executed by a runner).

                 Either or both can be configured depending on the application's components.
                 An application with only Helm charts needs a workload target; one with only
                 Terraform modules needs an infrastructure target; most applications need both.

                 At most one target per type is allowed per environment. The run engine
                 routes each component to the matching target based on its source type.
            example:
                id: "e5f6a7b8-9012-3cde-f456-789012345678"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                name: "staging"
                description: "Shared staging environment for QA validation before production promotion."
                runtime_type: "RUNTIME_TYPE_KUBERNETES"
                labels:
                    region: "us-east-1"
                    tier: "staging"
                infrastructure:
                    runner_id: "b2c3d4e5-6789-0abc-def1-234567890abc"
                kubernetes:
                    cluster_id: "c3d4e5f6-7890-1abc-def0-abcdef012345"
                    namespace: "inventory-staging"
                has_pending_changes: true
                last_deployed_at: "2025-11-01T09:15:00Z"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-09-15T11:00:00Z"
                updated_at: "2025-11-02T14:30:00Z"
        admiral.environment.v1.Environment.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.environment.v1.EnvironmentComponent:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: Component name (stable identifier set at creation).
                desired_state:
                    title: desired_state
                    description: The component's current desired state.
                    $ref: '#/components/schemas/admiral.component.v1.ComponentDesiredState'
                module_id:
                    type: string
                    title: module_id
                    description: Module the component is bound to (UUID).
                module_name:
                    type: string
                    title: module_name
                    description: Module name. Denormalized for display.
                module_type:
                    title: module_type
                    description: Module type the component renders against (TERRAFORM, HELM, etc).
                    $ref: '#/components/schemas/admiral.module.v1.ModuleType'
                version:
                    type: string
                    title: version
                    description: Optional ref / version override the component pins.
                last_revision_id:
                    type: string
                    title: last_revision_id
                    description: |-
                        ID of the last-succeeded revision for this component in this env, if
                         any (UUID). Empty when the component has never reached SUCCEEDED.
                last_revision_status:
                    title: last_revision_status
                    description: |-
                        Status of the last revision (SUCCEEDED when populated). UNSPECIFIED
                         means the component has no last-succeeded revision yet.
                    $ref: '#/components/schemas/admiral.run.v1.RevisionStatus'
                last_deployed_at:
                    title: last_deployed_at
                    description: When the last-succeeded revision completed.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: EnvironmentComponent
            additionalProperties: false
            description: |-
                EnvironmentComponent is a denormalized view of a deployed component for
                 `ListEnvironmentComponents`. It joins the component's HEAD with the
                 component's last-succeeded revision so the CLI can render an at-a-glance
                 status row without follow-up calls.
        admiral.environment.v1.GetEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The unique identifier of the environment (UUID).
            title: GetEnvironmentRequest
            additionalProperties: false
            description: GetEnvironmentRequest identifies an environment to retrieve.
        admiral.environment.v1.GetEnvironmentResponse:
            type: object
            properties:
                environment:
                    title: environment
                    description: The environment record.
                    $ref: '#/components/schemas/admiral.environment.v1.Environment'
            title: GetEnvironmentResponse
            additionalProperties: false
            description: GetEnvironmentResponse contains the environment record.
        admiral.environment.v1.InfrastructureTarget:
            type: object
            oneOf:
                - type: object
                  properties:
                    terraform:
                        title: terraform
                        description: Terraform/OpenTofu runner assignment (references a Runner entity).
                        $ref: '#/components/schemas/admiral.environment.v1.TerraformConfig'
                  title: terraform
                  required:
                    - terraform
            title: InfrastructureTarget
            additionalProperties: false
            description: |-
                InfrastructureTarget binds an environment to an infrastructure provisioning
                 runtime. Each target carries type-specific configuration that references a
                 managed entity (e.g., a Runner for Terraform/OpenTofu).

                 At most one target per InfrastructureType is allowed per environment.
        admiral.environment.v1.InfrastructureType:
            type: string
            title: InfrastructureType
            enum:
                - INFRASTRUCTURE_TYPE_UNSPECIFIED
                - INFRASTRUCTURE_TYPE_TERRAFORM
            description: |-
                InfrastructureType identifies the kind of infrastructure provisioning tool
                 a target uses.
        admiral.environment.v1.KubernetesConfig:

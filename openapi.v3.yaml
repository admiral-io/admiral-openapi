                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.serviceaccount.v1.ListServiceAccountsResponse'
    /v1/service-accounts/{service_account_id}:
        get:
            tags:
                - Service Accounts
            summary: Retrieve a service account
            description: 'Scope: `serviceaccount:read`'
            operationId: ServiceAccountAPI_GetServiceAccount
            parameters:
                - name: service_account_id
                  in: path
                  description: The service_account_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: service_account_id
                    pattern: ^sa-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.serviceaccount.v1.GetServiceAccountResponse'
    /v1/tenant:
        get:
            tags:
                - Tenant
            summary: Get the current tenant
            description: 'Scope: `tenant:read`'
            operationId: TenantAPI_GetTenant
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.tenant.v1.GetTenantResponse'
        patch:
            tags:
                - Tenant
            summary: Update the current tenant
            description: |-
                Only `display_name` is mutable. `slug` is part of the account's identity
                 and `status` is set by lifecycle operations, neither of which a tenant
                 performs on itself. The logo is set in the console.

                 Scope: `tenant:write`
            operationId: TenantAPI_UpdateTenant
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.tenant.v1.UpdateTenantRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.tenant.v1.UpdateTenantResponse'
    /v1/user/me:
        get:
            tags:
                - User
            summary: Retrieve current user profile
            description: 'Scope: any authenticated key (no specific scope required).'
            operationId: UserAPI_GetMe
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.GetMeResponse'
    /v1/users:
        get:
            tags:
                - User
            summary: List the members of the current tenant
            description: 'Scope: `user:read`'
            operationId: UserAPI_ListUsers
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `email`: filter by address.
                       - `status`: filter by status.

                     Example: `field['status'] = 'USER_STATUS_ACTIVE'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of users to return per page. Defaults to 50 when omitted
                     or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.ListUsersResponse'
    /v1/users/{user_id}:
        get:
            tags:
                - User
            summary: Retrieve a user by ID
            description: 'Scope: `user:read`'
            operationId: UserAPI_GetUser
            parameters:
                - name: user_id
                  in: path
                  description: The unique identifier of the user.
                  required: true
                  schema:
                    type: string
                    title: user_id
                    pattern: ^usr-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.GetUserResponse'
components:
    schemas:
        admiral.api.agent.v1.Agent:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^agt-[0-9a-z]+$
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                health:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent.Health'
                    title: health
                    readOnly: true
                report:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentReport'
                    title: report
                    description: What the agent last reported. Absent until it does.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent.Kind'
                    not:
                        enum:
                            - KIND_UNSPECIFIED
                    title: kind
                    description: |
                        (IMMUTABLE) enum.defined_only = true
                settings:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentSettings'
                    title: settings
                approval:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.ApprovalRule'
                    title: approval
                    description: |-
                        What every apply on this agent needs from people, in every environment
                         that uses it, on top of the environment's own rule. Only the agent's
                         owner sets it, so a team using the agent cannot loosen it.
                allowed_component_ids:
                    type: array
                    items:
                        type: string
                        pattern: ^cmp-[0-9a-z]+$
                    title: allowed_component_ids
                    maxItems: 256
                    uniqueItems: true
                    description: |-
                        The components that may run on this agent, as `cmp-` ids. Empty allows
                         any. Only the agent's owner sets it; Admiral refuses to place a component
                         outside it and checks again before each job.
                service_account_id:
                    type: string
                    title: service_account_id
                    description: '`sa-`: the service account the agent runs as, made with it.'
                    readOnly: true
            title: Agent
            additionalProperties: false
        admiral.api.agent.v1.Agent.Health:
            type: string
            title: Health
            enum:
                - HEALTH_UNSPECIFIED
                - HEALTH_NEW
                - HEALTH_ONLINE
                - HEALTH_OFFLINE
        admiral.api.agent.v1.Agent.Kind:
            type: string
            title: Kind
            enum:
                - KIND_UNSPECIFIED
                - KIND_KUBERNETES
                - KIND_INFRA
            description: Kind is what an agent deploys, never where it runs.
        admiral.api.agent.v1.AgentGrant:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - organization
                    - required:
                        - group_id
                    - required:
                        - application_id
                    - required:
                        - environment_id
            anyOf:
                - type: object
                  properties:
                    application_id:
                        type: string
                        title: application_id
                        pattern: ^app-[0-9a-z]+$
                  title: application_id
                - type: object
                  properties:
                    environment_id:
                        type: string
                        title: environment_id
                        pattern: ^env-[0-9a-z]+$
                  title: environment_id
                - type: object
                  properties:
                    group_id:
                        type: string
                        title: group_id
                        pattern: ^grp-[0-9a-z]+$
                        description: |-
                            Any member of the group can assign the agent to an environment they
                             can edit.
                  title: group_id
                - type: object
                  properties:
                    organization:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant.Organization'
                        title: organization
                        description: Every environment in the organization.
                  title: organization
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - application_id
                        - required:
                            - environment_id
                        - required:
                            - group_id
                        - required:
                            - organization
                    - not:
                        oneOf:
                            - required:
                                - application_id
                            - required:
                                - environment_id
                            - required:
                                - group_id
                            - required:
                                - organization
            properties:
                profiles:
                    type: array
                    items:
                        type: string
                        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    title: profiles
                    maxItems: 64
                    uniqueItems: true
                    description: |-
                        The agent profiles this grant covers, by name. Empty covers every
                         profile; otherwise `default` is covered only when listed. Grants reaching
                         one environment add up.
            title: AgentGrant
            description: |-
                AgentGrant lets environments be assigned an agent, and which of its
                 profiles they may name. Set exactly one target; an agent can hold several
                 grants, one per target.
        admiral.api.agent.v1.AgentGrant.Organization:
            type: object
            title: Organization
            additionalProperties: false
            description: Organization marks a grant to every environment in the organization.
        admiral.api.agent.v1.AgentReport:
            type: object
            anyOf:
                - type: object
                  properties:
                    kubernetes:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesReport'
                        title: kubernetes
                  title: kubernetes
            unevaluatedProperties: false
            properties:
                agent_version:
                    type: string
                    title: agent_version
                protocol_version:
                    type: integer
                    title: protocol_version
                    format: int32
                profiles:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ProfileReport'
                    title: profiles
                    maxItems: 256
                    description: |-
                        The profiles the agent defines and what each serves. Names and
                         provider addresses only, never values.
                reported_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: reported_at
            title: AgentReport
        admiral.api.agent.v1.AgentSettings:
            type: object
            anyOf:
                - type: object
                  properties:
                    infra:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.agent.v1.InfraAgentSettings'
                        title: infra
                  title: infra
                - type: object
                  properties:
                    kubernetes:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesAgentSettings'
                        title: kubernetes
                  title: kubernetes
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - infra
                        - required:
                            - kubernetes
                    - not:
                        oneOf:
                            - required:
                                - infra
                            - required:
                                - kubernetes
            title: AgentSettings
            description: |-
                AgentSettings is what the agent's owner allows it, one block per kind.
                 Environments that use the agent choose within these; they cannot exceed
                 them.
        admiral.api.agent.v1.AppendJobLogRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
                offset:
                    type: string
                    title: offset
                    minimum: 0
                    format: int64
                    description: Where this chunk starts, in bytes from the start of the log.
                chunk:
                    type: string
                    title: chunk
                    maxLength: 262144
                    minLength: 1
                    format: byte
                    description: Output, already masked. At most 256 KiB per chunk.
            title: AppendJobLogRequest
            required:
                - attempt
            additionalProperties: false
        admiral.api.agent.v1.AppendJobLogResponse:
            type: object
            properties:
                next_offset:
                    type: string
                    title: next_offset
                    format: int64
                    description: Where the next chunk starts.
            title: AppendJobLogResponse
            additionalProperties: false
        admiral.api.agent.v1.Attempt:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    pattern: ^job-[0-9a-z]+$
                attempt:
                    type: integer
                    title: attempt
                    minimum: 1
                    format: int32
                lease_token:
                    type: string
                    title: lease_token
                    maxLength: 128
                    minLength: 16
            title: Attempt
            required:
                - job_id
            additionalProperties: false
            description: Attempt names the attempt a call belongs to.
        admiral.api.agent.v1.CancelJobRequest:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    pattern: ^job-[0-9a-z]+$
            title: CancelJobRequest
            required:
                - job_id
            additionalProperties: false
        admiral.api.agent.v1.CancelJobResponse:
            type: object
            properties:
                job:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Job'
                    title: job
            title: CancelJobResponse
            additionalProperties: false
        admiral.api.agent.v1.CheckJobPlanRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
                plan:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.PlanResult'
                    title: plan
            title: CheckJobPlanRequest
            required:
                - attempt
                - plan
            additionalProperties: false
        admiral.api.agent.v1.CheckJobPlanResponse:
            type: object
            properties:
                proceed:
                    type: boolean
                    title: proceed
                message:
                    type: string
                    title: message
                    description: Why not, when `proceed` is false.
            title: CheckJobPlanResponse
            additionalProperties: false
        admiral.api.agent.v1.ClaimJobRequest:
            type: object
            properties:
                claim_request_id:
                    type: string
                    title: claim_request_id
                    maxLength: 64
                    minLength: 22
                    description: |-
                        Chosen by the agent per claim, with at least 128 random bits (22
                         base64url characters); a retry with the same id returns the same offer.
                         The lease token derives from it, so it is as secret as the token.
                protocol_version:
                    type: integer
                    title: protocol_version
                    minimum: 1
                    format: int32
                artifact_schema:
                    type: integer
                    title: artifact_schema
                    minimum: 1
                    format: int32
                    description: The newest artifact schema the agent reads.
                slots:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Slots'
                    title: slots
                    maxItems: 8
                    minItems: 1
                wait_seconds:
                    type: integer
                    title: wait_seconds
                    maximum: 20
                    minimum: 0
                    format: int32
                    description: How long to wait for work. At most 20; the server may answer sooner.
            title: ClaimJobRequest
            additionalProperties: false
        admiral.api.agent.v1.ClaimJobResponse:
            type: object
            properties:
                offer:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Offer'
                    title: offer
                    description: Absent when there was nothing to offer.
            title: ClaimJobResponse
            additionalProperties: false
        admiral.api.agent.v1.ComponentInventory:
            type: object
            properties:
                component:
                    type: string
                    title: component
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ResourceRef'
                    title: resources
            title: ComponentInventory
            additionalProperties: false
            description: |-
                ComponentInventory is what the last apply of a component left in the
                 cluster.
        admiral.api.agent.v1.ComponentPlan:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ResourceChange'
                    title: changes
                    maxItems: 5000
            title: ComponentPlan
            additionalProperties: false
        admiral.api.agent.v1.CreateAgentRequest:
            type: object
            properties:
                agent:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agent
                    description: |-
                        The agent to create: `name`, `kind`, and optionally
                         `settings`, `approval` and `allowed_component_ids`.
                grants:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                    title: grants
                    maxItems: 64
                    description: |-
                        Who may use it. Absent grants the organization when this is its first
                         agent, and nobody otherwise.
            title: CreateAgentRequest
            required:
                - agent
            additionalProperties: false
        admiral.api.agent.v1.CreateAgentResponse:
            type: object
            properties:
                agent:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agent
                grants:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                    title: grants
                enrollment_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.EnrollmentKey'
                    title: enrollment_key
                    description: The single-use key the agent enrolls with. Shown once.
            title: CreateAgentResponse
            additionalProperties: false
        admiral.api.agent.v1.CreateEnrollmentKeyRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            title: CreateEnrollmentKeyRequest
            required:
                - agent_id
            additionalProperties: false
        admiral.api.agent.v1.CreateEnrollmentKeyResponse:
            type: object
            properties:
                enrollment_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.EnrollmentKey'
                    title: enrollment_key
            title: CreateEnrollmentKeyResponse
            additionalProperties: false
        admiral.api.agent.v1.DeleteAgentRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            title: DeleteAgentRequest
            required:
                - agent_id
            additionalProperties: false
        admiral.api.agent.v1.DeleteAgentResponse:
            type: object
            title: DeleteAgentResponse
            additionalProperties: false
        admiral.api.agent.v1.EngineSupport:
            type: object
            properties:
                engine:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.EngineSupport.Engine'
                    not:
                        enum:
                            - ENGINE_UNSPECIFIED
                    title: engine
                    description: |
                        enum.defined_only = true
                versions:
                    type: string
                    title: versions
                    maxLength: 128
                    description: |-
                        A version constraint in Terraform's syntax, e.g. `>= 1.8, < 2.0`. Empty
                         allows every version.
            title: EngineSupport
            additionalProperties: false
            description: EngineSupport is one engine an infra agent runs, and which versions.
        admiral.api.agent.v1.EngineSupport.Engine:
            type: string
            title: Engine
            enum:
                - ENGINE_UNSPECIFIED
                - ENGINE_TERRAFORM
                - ENGINE_OPENTOFU
            description: Engine is a Terraform-compatible binary.
        admiral.api.agent.v1.EnrollRequest:
            type: object
            anyOf:
                - type: object
                  properties:
                    kubernetes:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesEnrollment'
                        title: kubernetes
                  title: kubernetes
            unevaluatedProperties: false
            properties:
                jwks:
                    type: string
                    title: jwks
                    maxLength: 65536
                    minLength: 2
                    description: |-
                        The issuer's keys, as the agent sees them from inside (for Kubernetes,
                         served at /openid/v1/jwks; for an agent that is its own issuer, its
                         public key).
                token:
                    type: string
                    title: token
                    maxLength: 16384
                    minLength: 16
                    description: |-
                        A token the issuer issued this agent, audience Admiral, verified against
                         `jwks`. Its `sub` becomes the service account's subject; its `iss` the
                         new issuer's, when one is made.
            title: EnrollRequest
        admiral.api.agent.v1.EnrollResponse:
            type: object
            properties:
                agent:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agent
                service_account:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.ServiceAccount'
                    title: service_account
                    description: The service account the agent signs in as from now on.
                issuer:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.serviceaccount.v1.Issuer'
                    title: issuer
                    description: The issuer it was attached to, or the one made from its keys.
            title: EnrollResponse
            additionalProperties: false
        admiral.api.agent.v1.EnrollmentKey:
            type: object
            properties:
                secret:
                    type: string
                    title: secret
                    description: Shown once. Spent the moment an agent enrolls with it.
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
            title: EnrollmentKey
            additionalProperties: false
        admiral.api.agent.v1.FinishJobRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
                finish_request_id:
                    type: string
                    title: finish_request_id
                    maxLength: 64
                    minLength: 8
                    description: Chosen by the agent; a retry with the same id returns the first answer.
                result:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobResult'
                    title: result
            title: FinishJobRequest
            required:
                - attempt
                - result
            additionalProperties: false
        admiral.api.agent.v1.FinishJobResponse:
            type: object
            properties:
                outcome:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.FinishJobResponse.Outcome'
                    title: outcome
            title: FinishJobResponse
            additionalProperties: false
        admiral.api.agent.v1.FinishJobResponse.Outcome:
            type: string
            title: Outcome
            enum:
                - OUTCOME_UNSPECIFIED
                - OUTCOME_ACCEPTED
                - OUTCOME_DUPLICATE
                - OUTCOME_LATE
        admiral.api.agent.v1.GetAgentRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            title: GetAgentRequest
            required:
                - agent_id
            additionalProperties: false
        admiral.api.agent.v1.GetAgentResponse:
            type: object
            properties:
                agent:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agent
            title: GetAgentResponse
            additionalProperties: false
        admiral.api.agent.v1.GetJobArtifactRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
            title: GetJobArtifactRequest
            required:
                - attempt
            additionalProperties: false
        admiral.api.agent.v1.GetJobArtifactResponse:
            type: object
            properties:
                artifact_digest:
                    type: string
                    title: artifact_digest
                artifact:
                    type: string
                    title: artifact
                    format: byte
                previous_inventory:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ComponentInventory'
                    title: previous_inventory
                    description: |-
                        What the environment's last apply of each component left: a PLAN finds
                         destroys in it, an APPLY prunes from it.
            title: GetJobArtifactResponse
            additionalProperties: false
        admiral.api.agent.v1.GetJobLogRequest:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    pattern: ^job-[0-9a-z]+$
                offset:
                    type: string
                    title: offset
                    minimum: 0
                    format: int64
                    description: Read from here, in bytes. 0 reads from the start.
                max_bytes:
                    type: integer
                    title: max_bytes
                    maximum: 4194304
                    minimum: 0
                    format: int32
                    description: Return at most this many bytes. Defaults to 1 MiB when 0.
            title: GetJobLogRequest
            required:
                - job_id
            additionalProperties: false
        admiral.api.agent.v1.GetJobLogResponse:
            type: object
            properties:
                chunk:
                    type: string
                    title: chunk
                    format: byte
                next_offset:
                    type: string
                    title: next_offset
                    format: int64
                    description: Where the next read should start.
                complete:
                    type: boolean
                    title: complete
                    description: The job has finished and the log will not grow.
                truncated:
                    type: boolean
                    title: truncated
                    description: The log reached its cap and the server dropped part of the middle.
            title: GetJobLogResponse
            additionalProperties: false
        admiral.api.agent.v1.GetJobRequest:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    pattern: ^job-[0-9a-z]+$
            title: GetJobRequest
            required:
                - job_id
            additionalProperties: false
        admiral.api.agent.v1.GetJobResponse:
            type: object
            properties:
                job:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Job'
                    title: job
            title: GetJobResponse
            additionalProperties: false
        admiral.api.agent.v1.GrantAgentUseRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                grant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                    title: grant
            title: GrantAgentUseRequest
            required:
                - agent_id
                - grant
            additionalProperties: false
        admiral.api.agent.v1.GrantAgentUseResponse:
            type: object
            title: GrantAgentUseResponse
            additionalProperties: false
        admiral.api.agent.v1.HeartbeatRequest:
            type: object
            anyOf:
                - type: object
                  properties:
                    kubernetes:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesReport'
                        title: kubernetes
                  title: kubernetes
            unevaluatedProperties: false
            properties:
                agent_version:
                    type: string
                    title: agent_version
                    maxLength: 64
                protocol_version:
                    type: integer
                    title: protocol_version
                    minimum: 1
                    format: int32
                jwks:
                    type: string
                    title: jwks
                    maxLength: 65536
                    description: |-
                        The issuer's current keys, when the agent can see them (for Kubernetes,
                         /openid/v1/jwks). Never applied: one stolen agent token could otherwise
                         plant a key. A set that differs from the trusted one is recorded in the
                         issuer's `pending_key_ids` for an admin; ignored for a `jwks_uri`
                         issuer, whose keys come from the issuer alone.
                profiles:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ProfileReport'
                    title: profiles
                    maxItems: 256
                    description: |-
                        The profiles the agent defines and what each serves, read from its
                         config. Names and provider addresses only, never values. An assignment
                         naming a profile the agent has not reported is refused.
            title: HeartbeatRequest
        admiral.api.agent.v1.HeartbeatResponse:
            type: object
            properties:
                next_report_seconds:
                    type: integer
                    title: next_report_seconds
                    format: int32
                keys:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.HeartbeatResponse.Keys'
                    title: keys
            title: HeartbeatResponse
            additionalProperties: false
        admiral.api.agent.v1.HeartbeatResponse.Keys:
            type: string
            title: Keys
            enum:
                - KEYS_UNSPECIFIED
                - KEYS_TRUSTED
                - KEYS_PENDING
                - KEYS_FROM_ISSUER
            description: Keys is how Admiral treated the keys the agent reported.
        admiral.api.agent.v1.InfraAgentSettings:
            type: object
            properties:
                engines:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.EngineSupport'
                    title: engines
                    maxItems: 8
                    description: |-
                        The engines this agent runs. Placing a component that needs an engine or
                         version outside them is refused when the change set is edited, naming an
                         agent that runs it, so no job waits on it.
            title: InfraAgentSettings
            additionalProperties: false
            description: InfraAgentSettings is what an infra agent will run.
        admiral.api.agent.v1.Job:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^job-[0-9a-z]+$
                    readOnly: true
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobKind'
                    title: kind
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobStatus'
                    title: status
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                    readOnly: true
                environment_id:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    readOnly: true
                run_id:
                    type: string
                    title: run_id
                    pattern: ^run-[0-9a-z]+$
                    description: The run this job plans or applies; empty for a PROBE.
                    readOnly: true
                assignment_id:
                    type: string
                    title: assignment_id
                    pattern: ^asg-[0-9a-z]+$
                    description: The environment assignment it runs on, and the components it covers.
                    readOnly: true
                components:
                    type: array
                    items:
                        type: string
                    title: components
                profile:
                    type: string
                    title: profile
                    description: |-
                        The profile the agent loads for this job, resolved for its phase from
                         the assignment; `default` when the assignment names none. The job starts
                         with a clean environment holding only this profile.
                artifact_digest:
                    type: string
                    title: artifact_digest
                    description: '`sha256:<hex>` of the artifact the job runs.'
                attempt:
                    type: integer
                    title: attempt
                    format: int32
                wait_reason:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.WaitReason'
                    title: wait_reason
                    description: Set while QUEUED.
                result:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobResult'
                    title: result
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                started_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: started_at
                finished_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: finished_at
            title: Job
            additionalProperties: false
        admiral.api.agent.v1.JobKind:
            type: string
            title: JobKind
            enum:
                - JOB_KIND_UNSPECIFIED
                - JOB_KIND_PROBE
                - JOB_KIND_PLAN
                - JOB_KIND_APPLY
        admiral.api.agent.v1.JobResult:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobStatus'
                    title: status
                    enum:
                        - JOB_STATUS_SUCCEEDED
                        - JOB_STATUS_FAILED
                        - JOB_STATUS_CANCELLED
                    description: SUCCEEDED, FAILED or CANCELLED.
                message:
                    type: string
                    title: message
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Step'
                    title: steps
                plan:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.PlanResult'
                    title: plan
                    description: Set by a PLAN.
                inventory:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ComponentInventory'
                    title: inventory
                    description: |-
                        Set by an APPLY: what each component it reached left in the cluster,
                         including one that failed partway.
            title: JobResult
            additionalProperties: false
        admiral.api.agent.v1.JobStatus:
            type: string
            title: JobStatus
            enum:
                - JOB_STATUS_UNSPECIFIED
                - JOB_STATUS_QUEUED
                - JOB_STATUS_OFFERED
                - JOB_STATUS_RUNNING
                - JOB_STATUS_SUCCEEDED
                - JOB_STATUS_FAILED
                - JOB_STATUS_CANCELLED
        admiral.api.agent.v1.KubernetesAgentSettings:
            type: object
            properties:
                allowed_namespaces:
                    type: array
                    items:
                        type: string
                        maxLength: 63
                        minLength: 1
                    title: allowed_namespaces
                    maxItems: 64
                    description: Glob patterns; empty allows every namespace.
                denied_namespaces:
                    type: array
                    items:
                        type: string
                        maxLength: 63
                        minLength: 1
                    title: denied_namespaces
                    maxItems: 64
                    description: |-
                        Glob patterns. A namespace that matches is refused even when
                         `allowed_namespaces` matches it too.
                allow_namespace_creation:
                    type: boolean
                    title: allow_namespace_creation
            title: KubernetesAgentSettings
            additionalProperties: false
            description: |-
                KubernetesAgentSettings limits where a Kubernetes agent may deploy,
                 whatever its RBAC allows. The plan refuses what falls outside them.
        admiral.api.agent.v1.KubernetesCapabilities:
            type: object
            properties:
                can_create_namespaces:
                    type: boolean
                    title: can_create_namespaces
                writable_namespaces:
                    type: array
                    items:
                        type: string
                    title: writable_namespaces
                    description: Namespaces it may write. Empty when `all_namespaces` is set.
                all_namespaces:
                    type: boolean
                    title: all_namespaces
                can_write_cluster_scoped:
                    type: boolean
                    title: can_write_cluster_scoped
            title: KubernetesCapabilities
            additionalProperties: false
            description: KubernetesCapabilities is what the agent's own RBAC lets it do, as it measured.
        admiral.api.agent.v1.KubernetesEnrollment:
            type: object
            properties:
                cluster_uid:
                    type: string
                    title: cluster_uid
                    maxLength: 64
                    description: 'The kube-system namespace UID: an accident detector, not a proof.'
            title: KubernetesEnrollment
            additionalProperties: false
            description: KubernetesEnrollment is what a Kubernetes agent reports when it enrolls.
        admiral.api.agent.v1.KubernetesReport:
            type: object
            properties:
                kube_version:
                    type: string
                    title: kube_version
                    maxLength: 64
                api_versions:
                    type: array
                    items:
                        type: string
                    title: api_versions
                    maxItems: 2048
                capabilities:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesCapabilities'
                    title: capabilities
                cluster_uid:
                    type: string
                    title: cluster_uid
                    maxLength: 64
                    description: 'The kube-system namespace UID: an accident detector, not a proof.'
            title: KubernetesReport
            additionalProperties: false
            description: KubernetesReport is what a Kubernetes agent reports about where it runs.
        admiral.api.agent.v1.ListAgentGrantsRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListAgentGrantsRequest
            required:
                - agent_id
            additionalProperties: false
        admiral.api.agent.v1.ListAgentGrantsResponse:
            type: object
            properties:
                grants:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                    title: grants
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListAgentGrantsResponse
            additionalProperties: false
        admiral.api.agent.v1.ListAgentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by agent name.
                           - `kind`: filter by agent kind.
                           - `assignable_to`: agents an application's environments may be assigned (an application id).

                         Example: `field['kind'] = 'KIND_KUBERNETES' AND field['assignable_to'] = 'app-4m8q2x7k1p9c'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListAgentsRequest
            additionalProperties: false
        admiral.api.agent.v1.ListAgentsResponse:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agents
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListAgentsResponse
            additionalProperties: false
        admiral.api.agent.v1.ListJobsRequest:
            type: object
            properties:
                agent_id:
                    type:
                        - string
                        - "null"
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                    description: The agent whose queue to list. Name this, `environment_id`, or both.
                environment_id:
                    type:
                        - string
                        - "null"
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    description: The environment whose jobs to list.
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `status`: filter by job status.
                           - `kind`: filter by job kind.

                         Example: `field['status'] = 'JOB_STATUS_QUEUED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListJobsRequest
            additionalProperties: false
            description: |
                list_jobs.scope // name an agent or an environment
        admiral.api.agent.v1.ListJobsResponse:
            type: object
            properties:
                jobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Job'
                    title: jobs
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListJobsResponse
            additionalProperties: false
        admiral.api.agent.v1.Offer:
            type: object
            properties:
                job:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Job'
                    title: job
                attempt:
                    type: integer
                    title: attempt
                    format: int32
                lease_token:
                    type: string
                    title: lease_token
                    description: Presented on every later call for this attempt. Shown once.
                offer_ttl_seconds:
                    type: integer
                    title: offer_ttl_seconds
                    format: int32
            title: Offer
            additionalProperties: false
            description: Offer is work claimed for an agent, not yet started.
        admiral.api.agent.v1.PlanDiff:
            type: object
            properties:
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ResourceDiff'
                    title: resources
                    maxItems: 5000
            title: PlanDiff
            additionalProperties: false
            description: PlanDiff is a plan's full diffs, stored apart from the job.
        admiral.api.agent.v1.PlanResult:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.ComponentPlan'
                    title: components
                    maxItems: 256
                diff_digest:
                    type: string
                    title: diff_digest
                    maxLength: 71
                    description: '`sha256:<hex>` of the PlanDiff uploaded for this attempt.'
            title: PlanResult
            additionalProperties: false
            description: |-
                PlanResult is a PLAN job's typed outcome. Its digest is the plan's
                 identity: two plans with the same changes have the same digest.
        admiral.api.agent.v1.ProfileReport:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                serves:
                    type: array
                    items:
                        type: string
                        pattern: ^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$
                    title: serves
                    maxItems: 128
                    uniqueItems: true
                    description: |-
                        The providers this profile can authenticate, as `namespace/type`
                         addresses without a registry host, such as `cloudflare/cloudflare`. A
                         provider becomes a need once some agent in the tenant serves it; a
                         component that needs one is placed only where the profiles serve it.
            title: ProfileReport
            additionalProperties: false
            description: ProfileReport is one profile an agent defines, as its config declares it.
        admiral.api.agent.v1.Progress:
            type: object
            properties:
                completed_steps:
                    type: integer
                    title: completed_steps
                    format: int32
                total_steps:
                    type: integer
                    title: total_steps
                    format: int32
                current_component:
                    type: string
                    title: current_component
                    maxLength: 63
            title: Progress
            additionalProperties: false
        admiral.api.agent.v1.RenewJobRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
                progress:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Progress'
                    title: progress
            title: RenewJobRequest
            required:
                - attempt
            additionalProperties: false
        admiral.api.agent.v1.RenewJobResponse:
            type: object
            properties:
                lease_ttl_seconds:
                    type: integer
                    title: lease_ttl_seconds
                    format: int32
                cancel_requested:
                    type: boolean
                    title: cancel_requested
                    description: Stop, clean up, and report CANCELLED. The lease stays valid meanwhile.
            title: RenewJobResponse
            additionalProperties: false
        admiral.api.agent.v1.ResourceChange:
            type: object
            properties:
                resource:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.ResourceRef'
                    title: resource
                action:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.ResourceChange.Action'
                    not:
                        enum:
                            - ACTION_UNSPECIFIED
                    title: action
                    description: |
                        enum.defined_only = true
                diff_digest:
                    type: string
                    title: diff_digest
                    maxLength: 71
                    description: '`sha256:<hex>` of this resource''s diff in the PlanDiff. Empty for ACTION_NO_OP.'
            title: ResourceChange
            additionalProperties: false
        admiral.api.agent.v1.ResourceChange.Action:
            type: string
            title: Action
            enum:
                - ACTION_UNSPECIFIED
                - ACTION_NO_OP
                - ACTION_CREATE
                - ACTION_UPDATE
                - ACTION_REPLACE
                - ACTION_DESTROY
                - ACTION_ORPHAN
            description: Action is what applying a plan does to one object.
        admiral.api.agent.v1.ResourceDiff:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                resource:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.ResourceRef'
                    title: resource
                diff:
                    type: string
                    title: diff
                    maxLength: 1048576
                    description: |-
                        Unified diff from the live object to the desired one, both normalized.
                         A Secret's data shows each key as added, changed or removed, never a
                         value.
            title: ResourceDiff
            additionalProperties: false
        admiral.api.agent.v1.ResourceRef:
            type: object
            properties:
                api_version:
                    type: string
                    title: api_version
                    maxLength: 253
                kind:
                    type: string
                    title: kind
                    maxLength: 63
                namespace:
                    type: string
                    title: namespace
                    maxLength: 63
                    description: Empty for a cluster-scoped object.
                name:
                    type: string
                    title: name
                    maxLength: 253
            title: ResourceRef
            additionalProperties: false
            description: ResourceRef names one Kubernetes object.
        admiral.api.agent.v1.RevokeAgentUseRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                grant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                    title: grant
            title: RevokeAgentUseRequest
            required:
                - agent_id
                - grant
            additionalProperties: false
        admiral.api.agent.v1.RevokeAgentUseResponse:
            type: object
            title: RevokeAgentUseResponse
            additionalProperties: false
        admiral.api.agent.v1.Slots:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobKind'
                    not:
                        enum:
                            - JOB_KIND_UNSPECIFIED
                    title: kind
                    description: |
                        enum.defined_only = true
                free:
                    type: integer
                    title: free
                    maximum: 64
                    minimum: 0
                    format: int32
                capacity:
                    type: integer
                    title: capacity
                    maximum: 64
                    minimum: 0
                    format: int32
                    description: |-
                        The most of this kind the agent runs at once. The server offers no more
                         than this, whatever `free` says.
            title: Slots
            additionalProperties: false
            description: Slots is how many more jobs of a kind the agent will take now.
        admiral.api.agent.v1.StartJobRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
            title: StartJobRequest
            required:
                - attempt
            additionalProperties: false
        admiral.api.agent.v1.StartJobResponse:
            type: object
            properties:
                lease_ttl_seconds:
                    type: integer
                    title: lease_ttl_seconds
                    format: int32
                    description: Renew before this passes, measured from when the request was sent.
                max_run_seconds:
                    type: integer
                    title: max_run_seconds
                    format: int32
                    description: The job is failed once it has run this long, renewed or not.
            title: StartJobResponse
            additionalProperties: false
        admiral.api.agent.v1.Step:
            type: object
            properties:
                component:
                    type: string
                    title: component
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.JobStatus'
                    title: status
                    description: |
                        enum.defined_only = true
                message:
                    type: string
                    title: message
            title: Step
            additionalProperties: false
            description: Step is one component's part of a job.
        admiral.api.agent.v1.UpdateAgentRequest:
            type: object
            properties:
                agent:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agent
                    description: |-
                        The agent with updated fields. Its `id` identifies the agent; only fields

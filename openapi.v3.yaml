        post:
            tags:
                - Components
            summary: Set a component's status
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_SetComponentStatus
            parameters:
                - name: component_id
                  in: path
                  description: The component_id path parameter.
                  required: true

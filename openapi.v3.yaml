                    type: string
                    title: kind
                    description: Kubernetes resource kind (e.g., "Deployment", "StatefulSet").
                labels:
                    type: object
                    title: labels
                    additionalProperties:
                        type: string
                        title: value
                    description: Kubernetes labels on the workload.
                replicas_desired:
                    type: integer
                    title: replicas_desired

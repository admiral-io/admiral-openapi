        admiral.api.changeset.v1.GetRevisionRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                revision:
                    type: string
                    title: revision
                    pattern: ^([1-9][0-9]{0,8}|rev-[0-9a-z]+)$
                    description: 'The revision: its number, or its `rev-` id.'
            title: GetRevisionRequest
            required:
                - change_set_id
                - revision
            additionalProperties: false
        admiral.api.changeset.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revision
            title: GetRevisionResponse
            additionalProperties: false
        admiral.api.changeset.v1.KubernetesComponentSettings:
            type: object
            properties:

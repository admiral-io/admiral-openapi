                    readOnly: true
                application_id:
                    type: string
                    title: application_id
                    readOnly: true
                environment_id:
                    type: string
                    title: environment_id
                    readOnly: true
                title:
                    type: string
                    title: title
                    maxLength: 256
                description:
                    type: string
                    title: description
                    maxLength: 4096
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet.Status'
                    title: status
                    readOnly: true
                head_revision:
                    type: integer
                    title: head_revision
                    format: int32
                    description: 0 until the first edit.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
                reverts_change_set_id:
                    type: string
                    title: reverts_change_set_id
                    description: |-

                    format: uuid
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                                         `description`, `url`, `credential_id`, `source_config`, `labels`.
                                    $ref: '#/components/schemas/google.protobuf.FieldMask'
                            title: UpdateSourceRequest
                            additionalProperties: false
                            description: UpdateSourceRequest contains the source fields to update.
                required: true
            responses:
                "200":

                scopes:
                    type: array
                    items:
                        type: string
                    title: scopes
                    description: |-
                        The scopes granted to this token. For PATs, these are user-selected.
                         For SATs, these are auto-assigned based on the resource type.
                status:
                    title: status
                    description: Current lifecycle status of the token.
                    $ref: '#/components/schemas/admiral.common.v1.AccessTokenStatus'
                binding_type:
                    title: binding_type
                    description: The kind of resource this token is bound to.
                    $ref: '#/components/schemas/admiral.common.v1.BindingType'
                binding_id:
                    type: string
                    title: binding_id
                    description: The ID of the resource this token is bound to (UUID).
                expires_at:
                    title: expires_at
                    description: When the token expires. If unset, the token does not expire.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                last_used_at:
                    title: last_used_at
                    description: When the token was last used to authenticate an API request.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                revoked_at:
                    title: revoked_at
                    description: When the token was revoked. Only set when status is REVOKED.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                created_by:
                    title: created_by
                    description: |-
                        The user who created this token. For PATs, this is the token owner.
                         For SATs, this is the administrator who issued the token.
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the token was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: AccessToken
            additionalProperties: false
            description: |-
                AccessToken contains metadata for an opaque access token issued by Admiral.

                 Admiral issues two kinds of tokens, distinguished by `token_type`:

                   - **Personal Access Tokens (PATs)**: bound to a user, created by that
                     user via UserAPI. Scopes are user-selected at creation time. Intended
                     for CLI, CI, and human-driven automation.
                   - **Service Access Tokens (SATs)**: bound to a cluster or runner,
                     created by administrators via ClusterAPI / RunnerAPI. Scopes are
                     auto-assigned from the resource type. Intended for long-lived agents
                     that authenticate as the cluster or runner itself.

                 The raw token secret is returned exactly once, in the `plain_text_token`
                 field of the Create response. This message carries only metadata; the
                 original secret is never retrievable after creation. The non-secret
                 `token_prefix` is safe to log and display.

                 Token CRUD is managed by each parent resource's API:
                   - PATs:         UserAPI    (/v1/user/tokens)
                   - Cluster SATs: ClusterAPI (/v1/clusters/{id}/tokens)
                   - Runner SATs:  RunnerAPI  (/v1/runners/{id}/tokens)

                 IDP-issued JWTs (OAuth2/OIDC sessions) are not represented here; they are
                 resolved by separate middleware.
            example:
                id: "9f8e7d6c-5b4a-3210-fedc-ba0987654321"
                name: "ci-deploy-key"
                token_type: "TOKEN_TYPE_PAT"
                scopes:
                    - "run:write"
                    - "app:read"
                    - "env:read"
                status: "ACCESS_TOKEN_STATUS_ACTIVE"
                binding_type: "BINDING_TYPE_USER"
                binding_id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                expires_at: "2026-06-01T00:00:00Z"
                last_used_at: "2025-11-20T14:30:00Z"
                created_at: "2025-09-01T10:00:00Z"
        admiral.common.v1.AccessTokenStatus:
            type: string
            title: AccessTokenStatus
            enum:
                - ACCESS_TOKEN_STATUS_UNSPECIFIED
                - ACCESS_TOKEN_STATUS_ACTIVE
                - ACCESS_TOKEN_STATUS_REVOKED
                - ACCESS_TOKEN_STATUS_ROTATING
            description: AccessTokenStatus represents the lifecycle state of an access token.
        admiral.common.v1.ActorRef:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: UUID of the user or service access token.
                display_name:
                    type: string
                    title: display_name
                    description: Human-readable name (e.g., "John Smith", "cluster-prod-agent").
                email:
                    type: string
                    title: email
                    description: Email address (empty for non-human actors).
            title: ActorRef
            additionalProperties: false
            description: |-
                ActorRef is a lightweight reference to the user or agent that performed an action.
                 Server-populated on all resource responses. Clients should never send this;
                 use the plain string `created_by` UUID on request messages instead.
        admiral.common.v1.AuthRule:
            type: object
            properties:
                scope:
                    type: string
                    title: scope
                    description: |-
                        The scope required to call this RPC (e.g., "cluster:read").
                         Empty string means any valid token is sufficient; no specific scope required.
                allowed_token_types:
                    type: array
                    items:
                        type: string
                    title: allowed_token_types
                    description: |-
                        Restrict to specific token types ("pat", "sat", "session").
                         Empty means all token types are allowed.
            title: AuthRule
            additionalProperties: false
            description: |-
                AuthRule defines the authorization requirements for an RPC method.
                 Applied as a custom method option and enforced at runtime by a Connect interceptor.

                 The presence of the option means the RPC requires authentication.
                 An empty scope means any authenticated request is sufficient.
        admiral.common.v1.BindingType:
            type: string
            title: BindingType
            enum:
                - BINDING_TYPE_UNSPECIFIED
                - BINDING_TYPE_USER
                - BINDING_TYPE_CLUSTER
                - BINDING_TYPE_RUNNER
            description: BindingType identifies the kind of resource an access token is bound to.
        admiral.common.v1.TokenType:
            type: string
            title: TokenType
            enum:
                - TOKEN_TYPE_UNSPECIFIED
                - TOKEN_TYPE_PAT
                - TOKEN_TYPE_SAT
            description: |-
                TokenType identifies the category of an access token issued by Admiral's token system.
                 IDP-issued JWTs (OAuth2/OIDC sessions) are NOT represented here. They are
                 resolved by separate middleware and can be referenced as "session" in
                 AuthRule.allowed_token_types when needed.
        admiral.component.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the component (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this component belongs to (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this component is scoped to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        Component identifier within the (application, environment) pair (e.g.,
                         "vpc", "redis", "api-server"). Set at creation; no rename path today.
                         Referenced from peer components' template expressions
                         (`{{ .component.<name>.<output> }}`), `depends_on` lists, and the
                         variable namespace for outputs.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the component's purpose
                         (e.g., "Primary VPC for all environments" or "Redis cache layer").
                kind:
                    title: kind
                    description: |-
                        Whether this is an infrastructure or workload component. Derived from
                         the referenced module's type when the component is created, but stored
                         explicitly for filtering and to determine execution behavior.
                    $ref: '#/components/schemas/admiral.component.v1.ComponentKind'
                desired_state:
                    title: desired_state
                    description: The desired lifecycle state of this component.
                    $ref: '#/components/schemas/admiral.component.v1.ComponentDesiredState'
                deletion_protection:
                    type: boolean
                    title: deletion_protection
                    description: When true, DESTROY operations are rejected for this component.
                module_id:
                    type: string
                    title: module_id
                    format: uuid
                    description: |-
                        The module this component deploys (UUID). References a Module defined
                         via the ModuleAPI. The module's source, ref, root, and path are inherited.
                version:
                    type: string
                    title: version
                    maxLength: 256
                    description: |-
                        Optional ref override for the module's default ref. When empty, the
                         module's ref is used. When set, overrides the module's ref at deploy time
                         (e.g., pin a specific tag, branch, or commit SHA for this component).
                values_template:
                    type: string
                    title: values_template
                    maxLength: 65536
                    description: |-
                        Values template that maps configuration into the module's expected inputs.
                         This is a JSON-encoded object where keys are the module input names and
                         values are either literal values or template expressions.

                         Template expressions can reference:
                           - Variables: `{{ .var.DATABASE_URL }}`
                           - Component outputs: `{{ .component.vpc.vpc_id }}`
                           - Environment metadata: `{{ .env.name }}`

                         Example for a Terraform RDS module:
                           {
                             "vpc_id": "{{ .component.vpc.vpc_id }}",
                             "subnet_ids": "{{ .component.vpc.private_subnet_ids }}",
                             "instance_class": "{{ .var.RDS_INSTANCE_CLASS }}",
                             "engine_version": "15.4"
                           }

                         Example for a Helm chart:
                           {
                             "replicaCount": "{{ .var.REPLICA_COUNT }}",
                             "image.repository": "myorg/api-server",
                             "image.tag": "{{ .var.IMAGE_TAG }}"
                           }

                         The rendering engine resolves all expressions at deployment time using
                         the environment's variables and the outputs of upstream components.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component names that must complete successfully before this component
                         can be deployed. Must reference components within the same environment.
                         The run engine uses these, combined with implicit dependencies from
                         template expressions, to build the execution DAG.

                         Explicit depends_on is useful when there is a deployment-order dependency
                         that is not captured by output references (e.g., cert-manager must be
                         installed before any workload that uses TLS certificates).
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.component.v1.ComponentOutput'
                    title: outputs
                    description: |-
                        Declared outputs for this component. For infrastructure components
                         (Terraform), outputs are auto-discovered from the module and this field
                         is ignored. For workload components, outputs must be declared here to
                         be available for template expressions in other components.

                         See ComponentOutput for examples.
                created_by:
                    title: created_by
                    description: The user or agent who created this component (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the component was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the component was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Component
            additionalProperties: false
            description: |-
                Component represents a named, deployable unit within an application+environment
                 pair. It binds a module to a specific environment with configuration (values
                 template) that maps variables and other component outputs into the module's
                 expected inputs.

                 Components are scoped to (application, environment): each environment has
                 its own set of components. The same name may exist in multiple environments
                 with different module/version/values, supporting both the uniform-fleet case
                 (identical components stamped across envs) and the divergent case (Postgres
                 in cluster for dev, managed service for prod).

                 Components are the nodes in Admiral's dependency graph. Infrastructure
                 components produce auto-discovered outputs (Terraform outputs). Workload
                 components declare outputs explicitly. Other components consume these via
                 template expressions. The run engine resolves this DAG to determine
                 execution order.
            example:
                id: "d4e5f6a7-8901-2bcd-ef34-567890123456"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                name: "api-server"
                description: "Main API server deployed via Helm chart."
                kind: "COMPONENT_KIND_WORKLOAD"
                source_id: "f6a7b8c9-0123-4def-5678-901234567890"
                version: "2.4.1"
                values_template: "{\"replicaCount\": \"{{ .var.REPLICA_COUNT }}\", \"image.tag\": \"{{ .var.IMAGE_TAG }}\"}"
                labels:
                    component-type: "service"
                depends_on:
                    - "vpc"
                    - "redis"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-09-16T09:00:00Z"
                updated_at: "2025-10-28T11:30:00Z"
        admiral.component.v1.ComponentDesiredState:
            type: string
            title: ComponentDesiredState
            enum:
                - COMPONENT_DESIRED_STATE_UNSPECIFIED
                - COMPONENT_DESIRED_STATE_ACTIVE
                - COMPONENT_DESIRED_STATE_DESTROY
                - COMPONENT_DESIRED_STATE_ORPHAN
                - COMPONENT_DESIRED_STATE_DESTROYED
            description: |-
                ComponentDesiredState is the lifecycle state operators can drive a
                 component into. ACTIVE is the steady-state; DESTROY/ORPHAN are operator
                 intent recorded by a change set entry; DESTROYED is the terminal state
                 reached after a successful destroy revision applies.
        admiral.component.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - COMPONENT_KIND_INFRASTRUCTURE
                - COMPONENT_KIND_WORKLOAD
            description: |-
                ComponentKind indicates whether the component provisions infrastructure
                 or deploys workloads. This is derived from the referenced module's type but
                 stored explicitly for filtering and to determine rendering and execution
                 behavior.
        admiral.component.v1.ComponentOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Output name used in template references. Must be a valid identifier
                         (lowercase alphanumeric and underscores, e.g., "service_host",
                         "connection_string"). Other components reference this as
                         `{{ .component.<component_name>.<output_name> }}`.
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that resolves to the output value after deployment.
                         Can reference environment metadata and the component's own release info.

                         Examples:
                           "{{ .release.name }}-redis-master.{{ .env.namespace }}.svc.cluster.local"
                           "{{ .release.name }}-redis:6379"
                           "http://{{ .release.name }}-grafana.{{ .env.namespace }}:3000"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the output's purpose.
            title: ComponentOutput
            additionalProperties: false
            description: |-
                ComponentOutput declares a named output value produced by a component.

                 For infrastructure components (Terraform), outputs are auto-discovered from
                 the module's output blocks and this field is ignored. Do not declare
                 outputs manually for Terraform components.

                 For workload components (Helm, Kustomize, manifests), outputs must be
                 declared explicitly here to make them available for template expressions
                 in other components (e.g., `{{ .component.cache.service_host }}`).

                 Output values are template expressions resolved after the component is
                 deployed. They typically reference well-known patterns from the deployed
                 resources (e.g., Kubernetes service DNS names, ConfigMap keys).
        admiral.credential.v1.AuthConfig:
            type: object
            oneOf:
                - type: object
                  properties:
                    basic_auth:
                        title: basic_auth
                        $ref: '#/components/schemas/admiral.credential.v1.BasicAuth'
                  title: basic_auth
                  required:
                    - basic_auth
                - type: object
                  properties:
                    bearer_token:
                        title: bearer_token
                        $ref: '#/components/schemas/admiral.credential.v1.BearerTokenAuth'
                  title: bearer_token
                  required:
                    - bearer_token
                - type: object
                  properties:
                    ssh_key:
                        title: ssh_key
                        $ref: '#/components/schemas/admiral.credential.v1.SSHKeyAuth'
                  title: ssh_key
                  required:
                    - ssh_key
            title: AuthConfig
            additionalProperties: false
            description: |-
                AuthConfig is the polymorphic auth configuration attached to a Credential.
                 Exactly one variant is populated, corresponding to the credential's type.
                 Sensitive fields within each variant are write-only.
        admiral.credential.v1.BasicAuth:
            type: object
            properties:
                username:
                    type: string
                    title: username
                    minLength: 1
                    description: Username for authentication.
                password:
                    type: string
                    title: password
                    description: |-
                        Password (or PAT / registry-scoped token / app password).
                         Write-only: masked in responses.
            title: BasicAuth
            additionalProperties: false
            description: |-
                BasicAuth holds HTTP Basic credentials (username + password). Reused across
                 any Source type that accepts HTTP Basic (Helm, OCI, HTTP archive, Git
                 HTTPS).
        admiral.credential.v1.BearerTokenAuth:
            type: object
            properties:
                token:
                    type: string
                    title: token
                    description: |-
                        Token value.
                         Write-only: masked in responses.
            title: BearerTokenAuth
            additionalProperties: false
            description: |-
                BearerTokenAuth holds a single token value. Presentation is per target
                 protocol:
                   - Terraform registries, Helm bearer, OCI bearer, HTTP archives:
                     `Authorization: Bearer <token>`
                   - Git HTTPS (GitHub PAT, GitLab PAT): HTTP Basic with the token as
                     password and a dummy username
        admiral.credential.v1.CreateCredentialRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "github-org", "ecr-prod").
                         Must be unique within the tenant.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the credential's purpose.
                type:
                    not:
                        enum:
                            - CREDENTIAL_TYPE_UNSPECIFIED
                    title: type
                    description: The type of external system and authentication mechanism.
                    $ref: '#/components/schemas/admiral.credential.v1.CredentialType'
                auth_config:
                    title: auth_config
                    description: Auth material corresponding to `type`.
                    $ref: '#/components/schemas/admiral.credential.v1.AuthConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering credentials.
            title: CreateCredentialRequest
            additionalProperties: false
            description: CreateCredentialRequest contains the parameters for creating a new credential.
        admiral.credential.v1.CreateCredentialRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.credential.v1.CreateCredentialResponse:
            type: object
            properties:
                credential:
                    title: credential
                    description: The created credential. Auth config sensitive fields are masked.
                    $ref: '#/components/schemas/admiral.credential.v1.Credential'
            title: CreateCredentialResponse
            additionalProperties: false
            description: CreateCredentialResponse contains the newly created credential.
        admiral.credential.v1.Credential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the credential (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "github-org", "ecr-prod").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of what this credential is for
                         (e.g., "Read-only access to the platform team's GitHub org").
                type:
                    title: type
                    description: The type of external system and authentication mechanism.
                    $ref: '#/components/schemas/admiral.credential.v1.CredentialType'
                auth_config:
                    title: auth_config
                    description: |-
                        Auth material corresponding to `type`. Sensitive fields are write-only
                         and masked in responses.
                    $ref: '#/components/schemas/admiral.credential.v1.AuthConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering credentials
                         (e.g., `{"team": "platform", "environment": "prod"}`).
                created_by:
                    title: created_by
                    description: The user or agent who created this credential (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the credential was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the credential was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Credential
            additionalProperties: false
            description: |-
                Credential represents stored authentication configuration for accessing an
                 external system. Credentials are tenant-scoped and referenced by sources
                 when fetching artifacts.

                 Sensitive fields within auth_config are write-only: accepted on create and
                 update but never returned in API responses.
        admiral.credential.v1.Credential.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.credential.v1.CredentialType:
            type: string
            title: CredentialType
            enum:
                - CREDENTIAL_TYPE_UNSPECIFIED
                - CREDENTIAL_TYPE_SSH_KEY
                - CREDENTIAL_TYPE_BASIC_AUTH
                - CREDENTIAL_TYPE_BEARER_TOKEN
            description: |-
                CredentialType identifies the shape of the stored auth material (the
                 mechanism), not the system it targets. The target system is determined by
                 the Source that references the credential. One credential can be reused
                 across multiple Sources of different types, provided the Source accepts
                 that credential type (see the Source compatibility matrix).
        admiral.credential.v1.DeleteCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    format: uuid
                    description: |-
                        The unique identifier of the credential to delete (UUID).
                         Fails if any sources still reference this credential.
            title: DeleteCredentialRequest
            additionalProperties: false
            description: DeleteCredentialRequest identifies a credential to delete.
        admiral.credential.v1.DeleteCredentialResponse:
            type: object
            title: DeleteCredentialResponse
            additionalProperties: false
            description: DeleteCredentialResponse is empty on success.
        admiral.credential.v1.GetCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    format: uuid
                    description: The unique identifier of the credential (UUID).
            title: GetCredentialRequest
            additionalProperties: false
            description: GetCredentialRequest identifies a credential to retrieve.
        admiral.credential.v1.GetCredentialResponse:
            type: object
            properties:
                credential:
                    title: credential
                    description: The credential record. Sensitive fields are masked.
                    $ref: '#/components/schemas/admiral.credential.v1.Credential'
            title: GetCredentialResponse
            additionalProperties: false
            description: GetCredentialResponse contains the credential record.
        admiral.credential.v1.ListCredentialsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by credential name.
                           - `type`: filter by credential type (SSH_KEY, BASIC_AUTH, BEARER_TOKEN).
                           - `labels.key`: filter by label key.

                         Example: `field['type'] = 'BEARER_TOKEN'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of credentials to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListCredentialsRequest
            additionalProperties: false
            description: ListCredentialsRequest contains pagination and filter parameters.
        admiral.credential.v1.ListCredentialsResponse:
            type: object
            properties:
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.credential.v1.Credential'
                    title: credentials
                    description: The list of credentials. Sensitive fields are masked.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListCredentialsResponse
            additionalProperties: false
            description: ListCredentialsResponse contains a page of credentials.
        admiral.credential.v1.SSHKeyAuth:
            type: object
            properties:
                private_key:
                    type: string
                    title: private_key
                    description: |-
                        PEM-encoded SSH private key.
                         Write-only: masked in responses.
                passphrase:
                    type: string
                    title: passphrase
                    description: |-
                        Optional passphrase for the private key.
                         Write-only: masked in responses.
            title: SSHKeyAuth
            additionalProperties: false
            description: SSHKeyAuth holds an SSH private key and optional passphrase.
        admiral.credential.v1.UpdateCredentialRequest:
            type: object
            properties:
                credential:
                    title: credential
                    description: |-
                        The credential with updated fields.
                         Only fields specified in `update_mask` are updated.

                         When updating auth_config, the entire auth config is replaced.
                         Omitting auth_config from the update_mask leaves credentials unchanged.
                    $ref: '#/components/schemas/admiral.credential.v1.Credential'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. If unset, all mutable fields are updated.
                         Supported fields: `name`, `description`, `auth_config`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateCredentialRequest
            required:
                - credential
            additionalProperties: false
            description: UpdateCredentialRequest contains the credential fields to update.
        admiral.credential.v1.UpdateCredentialResponse:
            type: object
            properties:
                credential:
                    title: credential
                    description: The updated credential. Sensitive fields are masked.
                    $ref: '#/components/schemas/admiral.credential.v1.Credential'
            title: UpdateCredentialResponse
            additionalProperties: false
            description: UpdateCredentialResponse contains the updated credential.
        admiral.environment.v1.CreateEnvironmentRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application to create this environment for (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                         Must be unique within the application. Lowercase alphanumeric and hyphens only.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the environment's purpose.
                workload_targets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.environment.v1.WorkloadTarget'
                    title: workload_targets
                    description: |-
                        Workload runtime targets. Optional; can be added later via
                         UpdateEnvironment. At most one target per WorkloadType.
                infrastructure_targets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.environment.v1.InfrastructureTarget'
                    title: infrastructure_targets
                    description: |-
                        Infrastructure runtime targets. Optional; can be added later via
                         UpdateEnvironment. At most one target per InfrastructureType.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering environments.
            title: CreateEnvironmentRequest
            additionalProperties: false
            description: CreateEnvironmentRequest contains the parameters for creating a new environment.
        admiral.environment.v1.CreateEnvironmentRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.environment.v1.CreateEnvironmentResponse:
            type: object

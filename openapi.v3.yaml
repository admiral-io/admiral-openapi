                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ValueOp'
                    title: ops
                placement:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Placement'
                    title: placement
                    description: Where the component goes after this change set. Empty on DESTROY.
            title: Entry
            additionalProperties: false
            description: Entry is what one revision does to one component.
        admiral.api.changeset.v1.EntryAction:
            type: string
            title: EntryAction
            enum:
                - ENTRY_ACTION_UNSPECIFIED
                - CREATE
                - UPDATE
                - DESTROY
        admiral.api.changeset.v1.Finding:
            type: object
            properties:
                component:
                    type: string
                    title: component
                code:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.FindingCode'
                    title: code
                message:
                    type: string
                    title: message
                details:
                    type: array
                    items:
                        type: string
                    title: details
                    description: For NONDETERMINISTIC, each `Kind/namespace/name field` that differs.
            title: Finding
            additionalProperties: false
            description: Finding is something a prepare noticed about one component.
        admiral.api.changeset.v1.FindingCode:
            type: string
            title: FindingCode
            enum:
                - FINDING_CODE_UNSPECIFIED
                - LOOKUP_USED
                - NONDETERMINISTIC
                - NO_CAPABILITIES
                - SCOPE_GUESSED
            description: FindingCode names something a prepare noticed but did not refuse.
        admiral.api.changeset.v1.GetArtifactRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                revision:
                    type: integer
                    title: revision
                    minimum: 1
                    format: int32
            title: GetArtifactRequest
            required:
                - change_set_id
                - revision
            additionalProperties: false
        admiral.api.changeset.v1.GetArtifactResponse:
            type: object
            properties:
                artifact_digest:
                    type: string
                    title: artifact_digest
                    description: '`sha256:<hex>` of the artifact as stored, before masking.'
                artifact:
                    type: string
                    title: artifact
                    format: byte
                    description: The run artifact, a gzipped tar, with Secret values masked.
            title: GetArtifactResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            title: GetChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.GetChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                head:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: head
                    description: Absent before the first edit.
                latest_prepare:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Prepare'
                    title: latest_prepare
                    description: The latest revision asked to be planned; absent when none was.
                plan_stale:
                    type: boolean
                    title: plan_stale
                    description: True when the head is newer than latest_prepare's revision.
            title: GetChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetComponentValuesRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
            title: GetComponentValuesRequest
            required:
                - change_set_id
                - component
            additionalProperties: false
        admiral.api.changeset.v1.GetComponentValuesResponse:
            type: object
            properties:
                tree_json:
                    type: string
                    title: tree_json
                    description: A JSON object.
                base_digest:
                    type: string
                    title: base_digest
                    description: The values the change set started from; empty for a component it adds.
                result_digest:
                    type: string
                    title: result_digest
                head_revision:
                    type: integer
                    title: head_revision
                    format: int32
            title: GetComponentValuesResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetPrepareRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                revision:
                    type: integer
                    title: revision
                    minimum: 1
                    format: int32
            title: GetPrepareRequest
            required:
                - change_set_id
                - revision
            additionalProperties: false
        admiral.api.changeset.v1.GetPrepareResponse:
            type: object
            properties:
                prepare:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Prepare'
                    title: prepare
            title: GetPrepareResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetRevisionRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                number:
                    type: integer
                    title: number
                    minimum: 1
                    format: int32
            title: GetRevisionRequest
            required:
                - change_set_id
                - number
            additionalProperties: false
        admiral.api.changeset.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revision
            title: GetRevisionResponse
            additionalProperties: false
        admiral.api.changeset.v1.KubernetesPlacement:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    maxLength: 63
                    pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: Empty means the environment's default namespace.
                extra_namespaces:
                    type: array
                    items:
                        type: string
                        maxLength: 63
                        pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                    title: extra_namespaces
                    maxItems: 16
                    uniqueItems: true
                    description: |-
                        Namespaces the component may also write to, such as `kube-system` for a
                         chart's leader-election Role. The plan refuses an object in any other.
            title: KubernetesPlacement
            additionalProperties: false
            description: KubernetesPlacement is a workload component's namespace.
        admiral.api.changeset.v1.ListChangeSetsRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetStatus'
                    title: status
                    description: UNSPECIFIED lists every status.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListChangeSetsRequest
            required:
                - environment_id
            additionalProperties: false
        admiral.api.changeset.v1.ListChangeSetsResponse:
            type: object
            properties:
                change_sets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_sets
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListChangeSetsResponse
            additionalProperties: false
        admiral.api.changeset.v1.ListRevisionsRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListRevisionsRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revisions
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListRevisionsResponse
            additionalProperties: false
        admiral.api.changeset.v1.PathDiff:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                display_path:
                    type: string
                    title: display_path
                before_present:
                    type: boolean
                    title: before_present
                before_json:
                    type: string
                    title: before_json
                after_present:
                    type: boolean
                    title: after_present
                after_json:
                    type: string
                    title: after_json
            title: PathDiff
            additionalProperties: false
            description: 'PathDiff is one changed path: absent, null or a value on each side.'
        admiral.api.changeset.v1.PathSegment:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - key
            anyOf:
                - type: object
                  properties:
                    key:
                        type: string
                        title: key
                        maxLength: 256
                        minLength: 1
                  title: key
            unevaluatedProperties: false
            title: PathSegment
            description: PathSegment is one step into a values tree. Only map keys exist.
        admiral.api.changeset.v1.Pin:
            type: object
            properties:
                revision_id:
                    type: string
                    title: revision_id
                digest:
                    type: string
                    title: digest
                    description: '`sha256:<hex>` of the bundle.'
                namespace:
                    type: string
                    title: namespace
                name:
                    type: string
                    title: name
            title: Pin
            additionalProperties: false
            description: Pin is a registry revision, named the ways a person reads it.
        admiral.api.changeset.v1.Placement:
            type: object
            properties:
                kubernetes:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.KubernetesPlacement'
                    title: kubernetes
            title: Placement
            additionalProperties: false
            description: |-
                Placement is where a component's objects go, per kind of target. A
                 component carries at most the block for its kind.
        admiral.api.changeset.v1.PlanChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                if_revision:
                    type:
                        - integer
                        - "null"
                    title: if_revision
                    minimum: 1
                    format: int32
                    description: When set, refused unless the head is this revision.
            title: PlanChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.PlanChangeSetResponse:
            type: object
            properties:
                prepare:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Prepare'
                    title: prepare
            title: PlanChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.Prepare:
            type: object
            properties:
                revision:
                    type: integer
                    title: revision
                    format: int32
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.PrepareStatus'
                    title: status
                artifact_digest:
                    type: string
                    title: artifact_digest
                    description: '`sha256:<hex>` of the run artifact; set once PREPARED.'
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Finding'
                    title: findings
                error:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.PrepareError'
                    title: error
                    description: Set when FAILED.
                requested_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: requested_by
                requested_by_kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ActorKind'
                    title: requested_by_kind
                requested_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: requested_at
                finished_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: finished_at
                attempts:
                    type: integer
                    title: attempts
                    format: int32
            title: Prepare
            additionalProperties: false
            description: Prepare is a revision's render into its run artifact.
        admiral.api.changeset.v1.PrepareError:
            type: object
            properties:
                class:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.PrepareErrorClass'
                    title: class
                component:
                    type: string
                    title: component
                    description: Empty when the failure is not one component's.
                message:
                    type: string
                    title: message
            title: PrepareError
            additionalProperties: false
            description: PrepareError is why a prepare failed.
        admiral.api.changeset.v1.PrepareErrorClass:
            type: string
            title: PrepareErrorClass
            enum:
                - PREPARE_ERROR_CLASS_UNSPECIFIED
                - RENDER
                - INFRA
            description: PrepareErrorClass says whether asking again can help.
        admiral.api.changeset.v1.PrepareStatus:
            type: string
            title: PrepareStatus
            enum:
                - PREPARE_STATUS_UNSPECIFIED
                - QUEUED
                - RUNNING
                - PREPARED
                - FAILED
                - SUPERSEDED
            description: PrepareStatus is where a revision's prepare stands.
        admiral.api.changeset.v1.RegistryRef:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: Empty means the default namespace.
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: A tag or a `sha256:` digest.
            title: RegistryRef
            required:
                - name
                - reference
            additionalProperties: false
            description: |-
                RegistryRef is a registry component and a tag or digest in it. A tag is
                 resolved when the edit is made; only the revision is stored.
        admiral.api.changeset.v1.RemoveComponent:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
            title: RemoveComponent
            required:
                - component
            additionalProperties: false
            description: |-
                RemoveComponent drops a component this draft adds, or destroys a live
                 one.
        admiral.api.changeset.v1.ReplaceValues:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                tree_json:
                    type: string
                    title: tree_json
                    maxLength: 1048576
                    minLength: 2
                    description: A JSON object.
                from_revision:
                    type: integer
                    title: from_revision
                    minimum: 0
                    format: int32
                    description: The head revision GetComponentValues reported; 0 for a draft with none.
            title: ReplaceValues
            required:
                - component
                - tree_json
            additionalProperties: false
            description: |-
                ReplaceValues makes a component's values exactly this tree: an upload.
                 Refused unless `from_revision` is the head the tree was downloaded at.
        admiral.api.changeset.v1.Revision:
            type: object
            properties:
                number:
                    type: integer
                    title: number
                    format: int32
                change_set_id:
                    type: string
                    title: change_set_id
                base_generation:
                    type: string
                    title: base_generation
                    format: int64
                    description: The environment's generation when the base was taken.
                cause:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.RevisionCause'
                    title: cause
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Violation'
                    title: violations
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                created_by_kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ActorKind'
                    title: created_by_kind
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Entry'
                    title: entries
                    description: Empty in a listing.
            title: Revision
            additionalProperties: false
        admiral.api.changeset.v1.RevisionCause:
            type: string
            title: RevisionCause
            enum:
                - REVISION_CAUSE_UNSPECIFIED
                - EDIT
                - REBASE
            description: |-
                RevisionCause says why a revision was cut. Only EDIT is written until
                 rebase exists.
        admiral.api.changeset.v1.SetNull:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
            title: SetNull
            required:
                - component
            additionalProperties: false
            description: SetNull writes null at a path, which clears a chart default.
        admiral.api.changeset.v1.SetPin:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: A tag or a `sha256:` digest.
            title: SetPin
            required:
                - component
                - reference
            additionalProperties: false
            description: |-
                SetPin moves a component to another revision of the same registry
                 component.
        admiral.api.changeset.v1.SetPlacement:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                placement:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Placement'
                    title: placement
            title: SetPlacement
            required:
                - component
                - placement
            additionalProperties: false
            description: SetPlacement replaces where a component goes.
        admiral.api.changeset.v1.SetValue:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
                value_json:
                    type: string
                    title: value_json
                    maxLength: 1048576
                    minLength: 1
                    description: 'JSON text, not null: null is SetNull.'
            title: SetValue
            required:
                - component
                - value_json
            additionalProperties: false
            description: |-
                SetValue writes a value at a path, creating maps on the way, as
                 `helm --set` does. A map value replaces what was there.
        admiral.api.changeset.v1.UnsetValue:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
            title: UnsetValue
            required:
                - component
            additionalProperties: false
            description: UnsetValue removes a path, so the default applies.
        admiral.api.changeset.v1.ValueOp:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                op:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ValueOpKind'
                    title: op
                value_json:
                    type: string
                    title: value_json
                    description: JSON text; empty unless op is SET.
                from_present:
                    type: boolean
                    title: from_present
                    description: Whether the base had the key; a null there is present.
                from_value_json:
                    type: string
                    title: from_value_json
                    description: JSON text; empty when from_present is false.
            title: ValueOp
            additionalProperties: false
            description: ValueOp is one change at one path, with what the base held there.
        admiral.api.changeset.v1.ValueOpKind:
            type: string
            title: ValueOpKind
            enum:
                - VALUE_OP_KIND_UNSPECIFIED
                - SET
                - SET_NULL
                - REMOVE
        admiral.api.changeset.v1.Violation:
            type: object
            properties:
                component:
                    type: string
                    title: component
                path:
                    type: string
                    title: path
                    description: 'Display form: `image.tag`, `ingress."a.b"`.'
                message:
                    type: string
                    title: message
            title: Violation
            additionalProperties: false
            description: |-
                Violation is one way a component's values fail its pinned revision's
                 contract.
        admiral.api.component.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the component (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this component belongs to (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this component is scoped to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        Component identifier within the (application, environment) pair (e.g.,
                         "vpc", "redis", "api-server"). Set at creation; no rename path today.
                         Referenced from peer components' template expressions
                         (`{{ .component.<name>.<output> }}`), `depends_on` lists, and the
                         variable namespace for outputs.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the component's purpose
                         (e.g., "Primary VPC for all environments" or "Redis cache layer").
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.component.v1.ComponentKind'
                    title: kind
                    description: |-
                        Whether this is an infrastructure or workload component. Derived from
                         the referenced module's type when the component is created, but stored
                         explicitly for filtering and to determine execution behavior.
                deletion_protection:
                    type: boolean
                    title: deletion_protection
                    description: When true, destroy operations are rejected for this component.
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: |-
                        The git ref / version selector this component deploys (branch, tag, or
                         commit SHA for git; version string for package sources). Seeded from the
                         catalog item's ref at create time and owned thereafter (copy-not-link).
                values_template:
                    type: string
                    title: values_template
                    maxLength: 65536
                    description: |-
                        Values template that maps configuration into the module's expected inputs.
                         This is a JSON-encoded object where keys are the module input names and
                         values are either literal values or template expressions.

                         Template expressions can reference:
                           - Variables: `{{ .var.DATABASE_URL }}`
                           - Component outputs: `{{ .component.vpc.vpc_id }}`
                           - Environment metadata: `{{ .env.name }}`

                         Example for a Terraform RDS module:
                           {
                             "vpc_id": "{{ .component.vpc.vpc_id }}",
                             "subnet_ids": "{{ .component.vpc.private_subnet_ids }}",
                             "instance_class": "{{ .var.RDS_INSTANCE_CLASS }}",
                             "engine_version": "15.4"
                           }

                         Example for a Helm chart:
                           {
                             "replicaCount": "{{ .var.REPLICA_COUNT }}",
                             "image.repository": "myorg/api-server",
                             "image.tag": "{{ .var.IMAGE_TAG }}"
                           }

                         The rendering engine resolves all expressions at deployment time using
                         the environment's variables and the outputs of upstream components.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component names that must complete successfully before this component
                         can be deployed. Must reference components within the same environment.
                         The run engine uses these, combined with implicit dependencies from
                         template expressions, to build the execution DAG.

                         Explicit depends_on is useful when there is a deployment-order dependency
                         that is not captured by output references (e.g., cert-manager must be
                         installed before any workload that uses TLS certificates).
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.component.v1.ComponentOutput'
                    title: outputs
                    description: |-
                        Declared outputs for this component. For infrastructure components
                         (Terraform), outputs are auto-discovered from the module and this field
                         is ignored. For workload components, outputs must be declared here to
                         be available for template expressions in other components.

                         See ComponentOutput for examples.
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this component (server-populated from token).
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the component was created.
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the component was last updated.
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.component.v1.ComponentInput'
                    title: inputs
                    description: |-
                        Declared inputs this component consumes -- the symmetric half of outputs.
                         Additive: the edge spec the impact-scoping work reads. Binding still flows
                         through values_template today.
                target:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.component.v1.ComponentTarget'
                    title: target
                    description: |-
                        Resolved placement: where this component deploys. Copied onto the component
                         from the reviewed Change at deploy time (copy-not-link); the run snapshots
                         it onto the revision. Exactly one shape is populated, by `kind`.
            title: Component
            additionalProperties: false
            description: |-
                Component represents a named, deployable unit within an application+environment
                 pair. It binds a module to a specific environment with configuration (values
                 template) that maps variables and other component outputs into the module's
                 expected inputs.

                 Components are scoped to (application, environment): each environment has
                 its own set of components. The same name may exist in multiple environments
                 with different module/version/values, supporting both the uniform-fleet case
                 (identical components stamped across envs) and the divergent case (Postgres
                 in cluster for dev, managed service for prod).

                 Components are the nodes in Admiral's dependency graph. Infrastructure
                 components produce auto-discovered outputs (Terraform outputs). Workload
                 components declare outputs explicitly. Other components consume these via
                 template expressions. The run engine resolves this DAG to determine
                 execution order.
            example:
                id: "d4e5f6a7-8901-2bcd-ef34-567890123456"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                name: "api-server"
                description: "Main API server deployed via Helm chart."
                kind: "COMPONENT_KIND_WORKLOAD"
                ref: "2.4.1"
                values_template: "{\"replicaCount\": \"{{ .var.REPLICA_COUNT }}\", \"image.tag\": \"{{ .var.IMAGE_TAG }}\"}"
                depends_on:
                    - "vpc"
                    - "redis"
                target:
                    agent_id: "1f2e3d4c-5b6a-7980-1234-567890abcdef"
                    namespace: "inventory-staging"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-16T09:00:00Z"
                updated_at: "2025-10-28T11:30:00Z"
        admiral.api.component.v1.ComponentInput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Input name. Must be a valid identifier (lowercase alphanumeric and
                         underscores, e.g. "database_url", "region").
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that binds this input's value -- typically a reference
                         to an environment variable or an upstream component's output, e.g.
                           "{{ .var.region }}"
                           "{{ .component.db.outputs.connection_string }}"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the input's purpose.
            title: ComponentInput
            additionalProperties: false
            description: |-
                ComponentInput is the symmetric half of ComponentOutput: a declared input
                 the component consumes, with the template expression that binds its value.
                 The declared inputs are the edge spec of the dependency DAG -- they make
                 impact scoping precise (which components reference a changed variable or an
                 upstream output). Today component inputs are bound through the single
                 values_template; this typed declaration is additive.
        admiral.api.component.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - COMPONENT_KIND_INFRASTRUCTURE
                - COMPONENT_KIND_WORKLOAD
            description: |-
                ComponentKind indicates whether the component provisions infrastructure
                 or deploys workloads. This is derived from the referenced module's type but
                 stored explicitly for filtering and to determine rendering and execution
                 behavior.
        admiral.api.component.v1.ComponentOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Output name used in template references. Must be a valid identifier
                         (lowercase alphanumeric and underscores, e.g., "service_host",
                         "connection_string"). Other components reference this as
                         `{{ .component.<component_name>.<output_name> }}`.
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that resolves to the output value after deployment.
                         Can reference environment metadata and the component's own release info.

                         Examples:
                           "{{ .release.name }}-redis-master.{{ .env.namespace }}.svc.cluster.local"
                           "{{ .release.name }}-redis:6379"
                           "http://{{ .release.name }}-grafana.{{ .env.namespace }}:3000"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the output's purpose.
            title: ComponentOutput
            additionalProperties: false
            description: |-
                ComponentOutput declares a named output value produced by a component.

                 For infrastructure components (Terraform), outputs are auto-discovered from
                 the module's output blocks and this field is ignored. Do not declare
                 outputs manually for Terraform components.

                 For workload components (Helm, Kustomize, manifests), outputs must be
                 declared explicitly here to make them available for template expressions
                 in other components (e.g., `{{ .component.cache.service_host }}`).

                 Output values are template expressions resolved after the component is
                 deployed. They typically reference well-known patterns from the deployed
                 resources (e.g., Kubernetes service DNS names, ConfigMap keys).
        admiral.api.component.v1.ComponentTarget:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    description: |-
                        The agent this component is placed on (UUID). A KUBERNETES agent for
                         WORKLOAD components; a TERRAFORM agent for INFRASTRUCTURE components.
                namespace:
                    type: string
                    title: namespace
                    description: |-
                        WORKLOAD only: the target namespace (defaults to the environment name
                         when empty).
            title: ComponentTarget
            additionalProperties: false
            description: |-
                ComponentTarget is a component's resolved placement on an agent, selected by
                 the component's kind. Authored on a Changeset Change and copied onto the
                 component (it is the source of truth at runtime, not the environment).
        admiral.api.credential.v1.AuthConfig:
            type: object
            anyOf:
                - type: object
                  properties:
                    basic_auth:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.BasicAuth'
                        title: basic_auth
                  title: basic_auth
                - type: object
                  properties:
                    bearer_token:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.BearerTokenAuth'
                        title: bearer_token
                  title: bearer_token
                - type: object
                  properties:
                    github_app:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.GitHubAppAuth'
                        title: github_app
                  title: github_app
                - type: object
                  properties:
                    ssh_key:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.SSHKeyAuth'
                        title: ssh_key
                  title: ssh_key
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - basic_auth
                        - required:
                            - bearer_token
                        - required:
                            - github_app
                        - required:
                            - ssh_key
                    - not:
                        oneOf:
                            - required:
                                - basic_auth
                            - required:
                                - bearer_token
                            - required:
                                - github_app
                            - required:
                                - ssh_key
            title: AuthConfig
            description: AuthConfig is the secret, one variant matching the credential's type.
        admiral.api.credential.v1.BasicAuth:
            type: object
            properties:
                username:
                    type: string
                    title: username
                    maxLength: 256
                    minLength: 1
                password:
                    type: string
                    title: password
                    maxLength: 4096
                    description: Write-only.
                    writeOnly: true
            title: BasicAuth
            additionalProperties: false
            description: |-
                BasicAuth is a username and password, or a username and a token that the
                 host takes as a password (a registry-scoped token, an app password).
        admiral.api.credential.v1.BearerTokenAuth:
            type: object
            properties:
                token:
                    type: string
                    title: token
                    maxLength: 4096
                    description: Write-only.
                    writeOnly: true
            title: BearerTokenAuth
            additionalProperties: false
            description: BearerTokenAuth is one token.
        admiral.api.credential.v1.CreateCredentialRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                description:
                    type: string
                    title: description
                    maxLength: 1024
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                    not:
                        enum:
                            - CREDENTIAL_TYPE_UNSPECIFIED
                    title: type
                auth_config:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                    title: auth_config
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                allowed_hosts:
                    type: array
                    items:
                        type: string
                        maxLength: 270
                        pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)*(:[0-9]{1,5})?$
                    title: allowed_hosts
                    maxItems: 32
                    uniqueItems: true
            title: CreateCredentialRequest
            required:
                - name
                - type
                - auth_config
            additionalProperties: false
        admiral.api.credential.v1.CreateCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: CreateCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.Credential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Unique within the tenant.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                    title: type
                    description: (IMMUTABLE) Immutable after creation.
                auth_config:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                    title: auth_config
                    description: Write-only. Empty in every response.
                    writeOnly: true
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
                allowed_hosts:
                    type: array
                    items:
                        type: string
                        maxLength: 270
                        pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)*(:[0-9]{1,5})?$
                    title: allowed_hosts
                    maxItems: 32
                    uniqueItems: true
                    description: |-
                        Hosts this credential may be presented to, as a guard: empty means any
                         host its type fits; set means the platform refuses to present it
                         anywhere else, whatever it is attached to. Hostnames, optionally with
                         a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                         no path.
            title: Credential
            additionalProperties: false
            description: |-
                Credential is a registered credential's metadata. The secret is set
                 through `auth_config` and never read back; responses carry it empty.
        admiral.api.credential.v1.CredentialType:
            type: string
            title: CredentialType
            enum:
                - CREDENTIAL_TYPE_UNSPECIFIED
                - CREDENTIAL_TYPE_SSH_KEY
                - CREDENTIAL_TYPE_BASIC_AUTH
                - CREDENTIAL_TYPE_BEARER_TOKEN
                - CREDENTIAL_TYPE_GITHUB_APP
            description: |-
                CredentialType is the protocol family a credential is presented as. Each
                 fetch takes the families its protocol speaks: a module registry, an
                 archive and an OCI token take a bearer token; git over https, a Helm
                 repository and an OCI login take basic auth; git over ssh takes a key.
        admiral.api.credential.v1.DeleteCredentialRequest:
            type: object

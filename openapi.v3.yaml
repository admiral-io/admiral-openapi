            tags:
                - Personal Access Tokens
            summary: Update a personal access token
            description: 'Scope: `token:write`'
            operationId: UserAPI_UpdateApiKey
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the key to update (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                token_id:
                                    type: string
                                    title: token_id
                                    format: uuid
                                    description: The unique identifier of the key to update (UUID).
                                name:
                                    type:
                                        - string
                                        - "null"
                                    title: name
                                    maxLength: 63
                                    minLength: 1
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                    description: |-
                                        New name for the key. Must follow the same naming rules as creation.
                                         Omit to leave the name unchanged.
                                scopes:
                                    type: array
                                    items:
                                        type: string
                                        maxLength: 64
                                        minLength: 1
                                    title: scopes
                                    maxItems: 255
                                    description: |-
                                        New scopes for the key. Replaces all existing scopes.
                                         The server enforces that issued scopes are a subset of the caller's own
                                         scopes. A key cannot grant more access than the user holds.
                                         Omit to leave scopes unchanged.
                            title: UpdateApiKeyRequest
                            required:
                                - token_id
                            additionalProperties: false
                            description: |-
                                UpdateApiKeyRequest contains the fields to update on an API key.
                                 Only provided fields are updated; omitted fields remain unchanged.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.UpdateApiKeyResponse'
    /v1/user/tokens/{token_id}/revoke:
        post:
            tags:
                - Personal Access Tokens
            summary: Revoke a personal access token
            description: 'Scope: `token:write`'
            operationId: UserAPI_RevokeApiKey
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the key to revoke (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                token_id:
                                    type: string
                                    title: token_id
                                    format: uuid
                                    description: The unique identifier of the key to revoke (UUID).
                            title: RevokeApiKeyRequest
                            required:
                                - token_id
                            additionalProperties: false
                            description: RevokeApiKeyRequest identifies an API key to revoke.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.RevokeApiKeyResponse'
    /v1/users/{user_id}:
        get:
            tags:
                - User
            summary: Retrieve a user by ID
            description: 'Scope: `user:read`'
            operationId: UserAPI_GetUser
            parameters:
                - name: user_id
                  in: path
                  description: The unique identifier of the user (UUID).
                  required: true
                  schema:
                    type: string
                    title: user_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.GetUserResponse'
    /api/v1/state/{component_id}/env/{environment_id}:
        parameters:
            - name: component_id
              in: path
              required: true
              description: The infrastructure component (UUID).
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              description: The environment the state is scoped to (UUID).
              schema:
                type: string
                format: uuid
        get:
            tags:
                - State Backend
            summary: Fetch current Terraform state
            description: >-
                Returns the current `.tfstate` document for the component+environment, or 204 when no state exists yet. Maps to the Terraform HTTP backend GET. Authenticate with a PAT/SAT (HTTP Basic password or Bearer token); requires the `state:read` scope.
            responses:
                "200":
                    description: The current Terraform state document.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                "204":
                    description: No state exists yet.
                "401":
                    description: Unauthorized.
                "404":
                    description: Component or environment not found.
        post:
            tags:
                - State Backend
            summary: Push Terraform state
            description: >-
                Stores a new state version; the body is the full `.tfstate` document. Maps to the Terraform HTTP backend POST. Authenticate with a PAT/SAT; requires the `state:write` scope.
            parameters:
                - name: ID
                  in: query
                  required: false
                  description: The held lock ID, when the state is locked.
                  schema:
                    type: string
                    format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true
            responses:
                "200":
                    description: State stored.
                "400":
                    description: Invalid state document.
                "413":
                    description: State document too large.
                "423":
                    description: State is locked by a different lock ID.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StateLockInfo"
    /api/v1/state/{component_id}/env/{environment_id}/lock:
        description: >-
            Locks and unlocks the component+environment state using Terraform's custom `LOCK` and `UNLOCK` HTTP methods (which OpenAPI cannot express as operations) with a `StateLockInfo` body. Returns 200 on success or 423 (with the currently-held `StateLockInfo`) on conflict. Authenticate with a PAT/SAT; requires the `state:write` scope.
        parameters:
            - name: component_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
components:
    schemas:
        admiral.api.agent.v1.ActiveJobInfo:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    format: uuid
                    description: The job being executed (UUID).
                phase:
                    title: phase
                    description: Current execution phase reported by the worker thread.
                    $ref: '#/components/schemas/admiral.api.agent.v1.JobPhase'
                started_at:
                    title: started_at
                    description: When execution of this job started (when the agent claimed it).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ActiveJobInfo
            additionalProperties: false
            description: |-
                ActiveJobInfo summarizes a job currently being executed by a TERRAFORM agent
                 instance. Included in TerraformAgentStatus to provide real-time job progress.
        admiral.api.agent.v1.Agent:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the agent (UUID).
                    readOnly: true
                kind:
                    title: kind
                    description: |-
                        (IMMUTABLE) The execution plane this agent serves. Set at creation and immutable
                         (CreateAgentRequest.kind carries the not_in:[0] requirement). Not validated
                         here so a partial Agent in UpdateAgentRequest (which omits kind) passes.
                    $ref: '#/components/schemas/admiral.api.agent.v1.AgentKind'
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod-terraform" or "prod-us-east-1").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must start
                         with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the agent's purpose.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering agents
                         (e.g., `{"cloud": "aws", "team": "platform"}`).
                health_status:
                    title: health_status
                    description: Derived health status based on reporting recency and kind-specific signals.
                    readOnly: true
                    $ref: '#/components/schemas/admiral.api.agent.v1.AgentHealthStatus'
                cluster_uid:
                    type: string
                    title: cluster_uid
                    description: |-
                        (KUBERNETES only) The Kubernetes kube-system namespace UID, bound at agent
                         registration using a first-write-wins strategy. Used to detect when a key
                         is accidentally deployed to a different physical cluster. Empty for TERRAFORM
                         agents.
                    readOnly: true
                created_by:
                    title: created_by
                    description: The user or agent who created this agent (server-populated from key).
                    readOnly: true
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the agent record was created.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: |-
                        When the agent record was last updated via UpdateAgent. Reports/heartbeats
                         do not bump this field; liveness is exposed separately via GetAgentStatus
                         and health_status.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Agent
            additionalProperties: false
            description: |-
                Agent represents a registered execution agent within a tenant. The `kind`
                 selects its execution plane: TERRAFORM agents claim and execute infrastructure
                 jobs; KUBERNETES agents report Kubernetes telemetry and apply manifest revisions.
        admiral.api.agent.v1.Agent.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.agent.v1.AgentHealthStatus:
            type: string
            title: AgentHealthStatus
            enum:
                - AGENT_HEALTH_STATUS_UNSPECIFIED
                - AGENT_HEALTH_STATUS_PENDING
                - AGENT_HEALTH_STATUS_HEALTHY
                - AGENT_HEALTH_STATUS_DEGRADED
                - AGENT_HEALTH_STATUS_ERROR
                - AGENT_HEALTH_STATUS_UNREACHABLE
            description: |-
                AgentHealthStatus represents the derived health state of an agent. The status
                 is computed from reporting recency and kind-specific signals (capacity for
                 TERRAFORM; node readiness and workload health for KUBERNETES). The ERROR state is
                 only emitted by KUBERNETES agents.
        admiral.api.agent.v1.AgentKind:
            type: string
            title: AgentKind
            enum:
                - AGENT_KIND_UNSPECIFIED
                - AGENT_KIND_TERRAFORM
                - AGENT_KIND_KUBERNETES
            description: |-
                AgentKind names the execution contract an agent serves, by its canonical tool.
                 The engine is a sub-axis within a kind (TERRAFORM runs terraform/tofu;
                 KUBERNETES runs helm/kustomize/raw), so a new tool is a new value, not a refactor.
        admiral.api.agent.v1.ApplicationRef:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    description: Kubernetes namespace of the Application.
                name:
                    type: string
                    title: name
                    description: Application name.
            title: ApplicationRef
            additionalProperties: false
            description: |-
                ApplicationRef is a lightweight (namespace, name) reference to an Admiral
                 Application, used to tag workload metrics with their owning Application.
        admiral.api.agent.v1.ClaimJobRequest:
            type: object
            title: ClaimJobRequest
            additionalProperties: false
            description: |-
                ClaimJobRequest is sent by a TERRAFORM agent to poll for available work. The
                 agent is identified by the SAT's binding; no agent_id is required.
        admiral.api.agent.v1.ClaimJobResponse:
            type: object
            properties:
                job:
                    title: job
                    description: |-
                        The job to execute. Absent if no work is available; the agent should wait and
                         poll again after its configured interval.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Job'
            title: ClaimJobResponse
            additionalProperties: false
            description: ClaimJobResponse contains the next job to execute, if any.
        admiral.api.agent.v1.ClearAgentIdentityBindingRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The Admiral agent record ID (UUID), not the kube-system UID.
                reason:
                    type: string
                    title: reason
                    minLength: 1
                    description: Free-text audit reason for the rebind (e.g. "DR rebuild 2026-05-30").
                grace_window:
                    title: grace_window
                    description: How long the grace window stays open. Defaults to 1h server-side if unset.
                    $ref: '#/components/schemas/google.protobuf.Duration'
            title: ClearAgentIdentityBindingRequest
            required:
                - agent_id
            additionalProperties: false
            description: |-
                ClearAgentIdentityBindingRequest opens a rebind grace window for a KUBERNETES
                 agent.
        admiral.api.agent.v1.ClearAgentIdentityBindingResponse:
            type: object
            properties:
                accepted:
                    type: boolean
                    title: accepted
                    description: Whether the rebind grace window was opened.
                expires_at:
                    title: expires_at
                    description: When the grace window expires.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ClearAgentIdentityBindingResponse
            additionalProperties: false
            description: ClearAgentIdentityBindingResponse acknowledges the rebind window.
        admiral.api.agent.v1.Condition:
            type: object
            properties:
                type:
                    type: string
                    title: type
                    description: Condition type (e.g., "Ready", "Healthy").
                status:
                    type: string
                    title: status
                    description: 'Condition status: "True", "False", or "Unknown".'
                observed_generation:
                    type:
                        - integer
                        - string
                    title: observed_generation
                    format: int64
                    description: The .metadata.generation the condition was set against.
                reason:
                    type: string
                    title: reason
                    description: Short machine-readable reason for the condition's last transition.
                message:
                    type: string
                    title: message
                    description: Human-readable detail for the condition's last transition.
                last_transition_time:
                    title: last_transition_time
                    description: When the condition last transitioned.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Condition
            additionalProperties: false
            description: |-
                Condition mirrors the standard Kubernetes condition shape, carried explicitly
                 so the wire shape stays stable across SDK versions.
        admiral.api.agent.v1.ContainerStatus:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: Container name within the pod spec.
                image:
                    type: string
                    title: image
                    description: Container image reference (e.g., "registry.example.com/api:v2.1.4").
                restart_count:
                    type: integer
                    title: restart_count
                    format: int32
                    description: Cumulative number of container restarts.
                state:
                    type: string
                    title: state
                    description: Current container state (e.g., "running", "waiting", "terminated").
                ready:
                    type: boolean
                    title: ready
                    description: Whether the container's readiness probe is passing.
            title: ContainerStatus
            additionalProperties: false
            description: ContainerStatus describes the current state of a single container.
        admiral.api.agent.v1.CreateAgentRequest:
            type: object
            properties:
                kind:
                    not:
                        enum:
                            - AGENT_KIND_UNSPECIFIED
                    title: kind
                    description: |-
                        The execution plane this agent serves (TERRAFORM or KUBERNETES). Selects the
                         key's auto-assigned scopes and is immutable.
                    $ref: '#/components/schemas/admiral.api.agent.v1.AgentKind'
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod-terraform"). Unique within
                         the tenant. Lowercase alphanumeric and hyphens only, must start with a
                         letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the agent's purpose.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering agents.
            title: CreateAgentRequest
            required:
                - kind
                - name
            additionalProperties: false
            description: CreateAgentRequest contains the parameters for creating a new agent.
        admiral.api.agent.v1.CreateAgentRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.agent.v1.CreateAgentResponse:
            type: object
            properties:
                agent:
                    title: agent
                    description: The created agent. Health status will be PENDING until it begins reporting.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                plain_text_key:
                    type: string
                    title: plain_text_key
                    description: |-
                        The raw API key secret (e.g., "adms_pL2mN5oQ8rS1..."). Shown exactly once
                         and cannot be retrieved again. Deploy this key to the agent binary for
                         authentication. For additional keys, use CreateApiKey.
            title: CreateAgentResponse
            additionalProperties: false
            description: CreateAgentResponse contains the newly created agent and its initial API key.
        admiral.api.agent.v1.CreateApiKeyRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent to bind this key to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the key (e.g., "prod-agent-key").
                         Unique within the agent's keys. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                expires_at:
                    title: expires_at
                    description: Optional expiration time. If unset, the key does not expire.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: CreateApiKeyRequest
            required:
                - agent_id
                - name
            additionalProperties: false
            description: |-
                CreateApiKeyRequest contains the parameters for creating a new API key bound to
                 an agent.
        admiral.api.agent.v1.CreateApiKeyResponse:
            type: object
            properties:
                api_key:
                    title: api_key
                    description: The created key metadata. Scopes are auto-assigned from the agent's kind.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                plain_text_key:
                    type: string
                    title: plain_text_key
                    description: The raw secret. Shown exactly once and cannot be retrieved again.
            title: CreateApiKeyResponse
            additionalProperties: false
            description: CreateApiKeyResponse contains the newly created API key.
        admiral.api.agent.v1.DeleteAgentRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: |-
                        The unique identifier of the agent to delete (UUID). All API keys bound to
                         its service account are revoked.
            title: DeleteAgentRequest
            required:
                - agent_id
            additionalProperties: false
            description: DeleteAgentRequest identifies an agent to delete.
        admiral.api.agent.v1.DeleteAgentResponse:
            type: object
            title: DeleteAgentResponse
            additionalProperties: false
            description: DeleteAgentResponse is empty on success.
        admiral.api.agent.v1.Engine:
            type: string
            title: Engine
            enum:
                - ENGINE_UNSPECIFIED
                - ENGINE_TERRAFORM
                - ENGINE_TOFU
            description: |-
                Engine identifies which infrastructure-as-code binary executes the job.
                 Deliberately narrow: only the terraform-semantic engines Admiral manages as
                 first-class citizens. Wrapper tools (e.g., terragrunt) and non-terraform-
                 semantic engines (Pulumi, CDK) are intentionally out of scope; users shell
                 out to them via hooks if needed.
        admiral.api.agent.v1.GetAgentRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The unique identifier of the agent (UUID).
            title: GetAgentRequest
            required:
                - agent_id
            additionalProperties: false
            description: GetAgentRequest identifies an agent to retrieve.
        admiral.api.agent.v1.GetAgentResponse:
            type: object
            properties:
                agent:
                    title: agent
                    description: The retrieved agent, including its server-derived health_status.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
            title: GetAgentResponse
            additionalProperties: false
            description: GetAgentResponse contains the agent record.
        admiral.api.agent.v1.GetAgentStatusRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The unique identifier of the agent (UUID).
            title: GetAgentStatusRequest
            required:
                - agent_id
            additionalProperties: false
            description: GetAgentStatusRequest identifies an agent whose status to retrieve.
        admiral.api.agent.v1.GetAgentStatusResponse:
            type: object
            allOf:
                - properties:
                    health_status:
                        title: health_status
                        description: Server-derived health status based on reporting recency and kind signals.
                        $ref: '#/components/schemas/admiral.api.agent.v1.AgentHealthStatus'
                    reported_at:
                        title: reported_at
                        description: When the latest report was received.
                        $ref: '#/components/schemas/google.protobuf.Timestamp'
                - oneOf:
                    - type: object
                      properties:
                        kubernetes:
                            title: kubernetes
                            description: Cluster telemetry snapshot for a KUBERNETES agent.
                            $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesAgentStatus'
                      title: kubernetes
                      required:
                        - kubernetes
                    - type: object
                      properties:
                        terraform:
                            title: terraform
                            description: Capacity snapshot for a TERRAFORM agent.
                            $ref: '#/components/schemas/admiral.api.agent.v1.TerraformAgentStatus'
                      title: terraform
                      required:
                        - terraform
            title: GetAgentStatusResponse
            additionalProperties: false
            description: |-
                GetAgentStatusResponse contains the server-derived health status and the latest
                 kind-specific status snapshot. If the agent has not reported yet, health_status
                 will be PENDING and status will be absent.
        admiral.api.agent.v1.GetApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key (UUID).
            title: GetApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: |-
                GetApiKeyRequest identifies an agent API key to retrieve. Key IDs are globally
                 unique; the server resolves the parent agent from the key ID.
        admiral.api.agent.v1.GetApiKeyResponse:
            type: object
            properties:
                api_key:
                    title: api_key
                    description: The key metadata. The key secret is never included.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKey'
            title: GetApiKeyResponse
            additionalProperties: false
            description: GetApiKeyResponse contains the requested agent API key metadata.
        admiral.api.agent.v1.GetJobBundleRequest:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    format: uuid
                    description: The job to fetch the bundle for (UUID).
            title: GetJobBundleRequest
            required:
                - job_id
            additionalProperties: false
            description: GetJobBundleRequest identifies a job whose artifact bundle to fetch.
        admiral.api.agent.v1.GetJobBundleResponse:
            type: object
            properties:
                bundle:
                    title: bundle
                    description: The artifact bundle with everything needed to execute the operation.
                    $ref: '#/components/schemas/admiral.api.agent.v1.JobBundle'
            title: GetJobBundleResponse
            additionalProperties: false
            description: GetJobBundleResponse contains the rendered artifacts for execution.
        admiral.api.agent.v1.GetRevisionBundleRequest:
            type: object
            properties:
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision to fetch the bundle for (UUID).
            title: GetRevisionBundleRequest
            required:
                - revision_id
            additionalProperties: false
            description: GetRevisionBundleRequest identifies a revision whose artifact bundle to fetch.
        admiral.api.agent.v1.GetRevisionBundleResponse:
            type: object
            properties:
                bundle:
                    title: bundle
                    description: The artifact bundle with everything needed to apply the workload.
                    $ref: '#/components/schemas/admiral.api.agent.v1.RevisionBundle'
            title: GetRevisionBundleResponse
            additionalProperties: false
            description: GetRevisionBundleResponse contains the rendered manifests for the revision.
        admiral.api.agent.v1.GetWorkloadRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent (cluster) the workload belongs to (UUID).
                workload_id:
                    type: string
                    title: workload_id
                    format: uuid
                    description: The workload to retrieve (UUID).
            title: GetWorkloadRequest
            required:
                - agent_id
                - workload_id
            additionalProperties: false
            description: GetWorkloadRequest identifies a workload to retrieve with full detail.
        admiral.api.agent.v1.GetWorkloadResponse:
            type: object
            properties:
                workload:
                    title: workload
                    description: The workload with full detail.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Workload'
            title: GetWorkloadResponse
            additionalProperties: false
            description: GetWorkloadResponse contains the workload with full detail.
        admiral.api.agent.v1.HeartbeatRequest:
            type: object
            properties:
                status:
                    title: status
                    description: Current capacity and telemetry metrics.
                    $ref: '#/components/schemas/admiral.api.agent.v1.TerraformAgentStatus'
                instance_id:
                    type: string
                    title: instance_id
                    format: uuid
                    description: |-
                        Random UUID generated at process startup to distinguish multiple agent
                         instances sharing the same SAT. The server tracks heartbeats per instance and
                         aggregates capacity across instances. Not persisted across restarts.
            title: HeartbeatRequest
            required:
                - status
            additionalProperties: false
            description: |-
                HeartbeatRequest contains a TERRAFORM agent's alive signal and current capacity.
                 The agent is identified by the SAT's binding; no agent_id is required.
        admiral.api.agent.v1.HeartbeatResponse:
            type: object
            properties:
                ack:
                    type: boolean
                    title: ack
                    description: Whether the heartbeat was accepted.
                next_heartbeat_seconds:
                    type: integer
                    title: next_heartbeat_seconds
                    format: int32
                    description: Server-controlled interval (seconds) before the next heartbeat.
            title: HeartbeatResponse
            additionalProperties: false
            description: HeartbeatResponse acknowledges the heartbeat.
        admiral.api.agent.v1.Hook:
            type: object
            properties:
                script:
                    type: string
                    title: script
                    maxLength: 65536
                    minLength: 1
                    description: |-
                        The script body to execute, passed to the selected interpreter. The agent
                         closes stdin (/dev/null) so interactive prompts cannot block execution.
                timeout_seconds:
                    type: integer
                    title: timeout_seconds
                    maximum: 3600
                    minimum: 0
                    format: int32
                    description: |-
                        Per-script timeout in seconds. If 0, the agent applies its built-in default
                         (currently 300s). A hook that exceeds its timeout is killed and fails.
                name:
                    type: string
                    title: name
                    maxLength: 128
                    description: |-
                        Optional human-friendly name used in log lines (e.g., "vault-login"). Not
                         required to be unique.
                interpreter:
                    not:
                        enum:
                            - HOOK_INTERPRETER_UNSPECIFIED
                    title: interpreter
                    description: |-
                        Required. Which interpreter runs `script`. Server populates from the hook
                         config; UNSPECIFIED is rejected.
                    $ref: '#/components/schemas/admiral.api.agent.v1.HookInterpreter'
            title: Hook
            additionalProperties: false
            description: |-
                Hook is a single script hook delivered with a JobBundle. Scripts are inlined by
                 the server; the agent never fetches them from elsewhere.
        admiral.api.agent.v1.HookInterpreter:
            type: string
            title: HookInterpreter
            enum:
                - HOOK_INTERPRETER_UNSPECIFIED
                - HOOK_INTERPRETER_BASH
            description: |-
                HookInterpreter selects which language the agent uses to execute a hook's
                 script body. Deliberately narrow today; the enum exists primarily as forward
                 plumbing so non-shell interpreters (Python, Node, etc.) can be added without a
                 breaking change. A hook created with the field unset defaults to
                 HOOK_INTERPRETER_BASH; UNSPECIFIED on the wire is rejected.
        admiral.api.agent.v1.Hooks:
            type: object
            properties:
                before_init:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: before_init
                    description: Scripts to run before the init phase. Fail-fast.
                after_init:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: after_init
                    description: Scripts to run after init succeeded. Run-all; skipped if init failed.
                before_plan:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: before_plan
                    description: Scripts to run before the plan phase. Fail-fast.
                after_plan:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: after_plan
                    description: Scripts to run after plan succeeded. Run-all; skipped if plan failed.
                before_apply:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: before_apply
                    description: Scripts to run before the apply phase. Fail-fast.
                after_apply:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: after_apply
                    description: Scripts to run after apply succeeded. Run-all; skipped if apply failed.
                after_run:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Hook'
                    title: after_run
                    description: |-
                        Scripts to run after the job completes, regardless of outcome. Always
                         executed (finally-semantics). Run-all.
            title: Hooks
            additionalProperties: false
            description: |-
                Hooks groups the seven lifecycle extension points. Scripts within a list run in
                 list order. Failure behavior differs by phase:
                   - `before_*` hooks are fail-fast: the first non-zero exit aborts the phase.
                   - `after_*` hooks run ONLY when the corresponding engine command succeeded;
                     they are run-all (individual failures are logged, not fatal).
                   - `after_run` always runs (the agent's `finally`). Also run-all.
        admiral.api.agent.v1.Job:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the job (UUID).
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent this job is assigned to (UUID).
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision this job belongs to (UUID).
                run_id:
                    type: string
                    title: run_id
                    format: uuid
                    description: The run this job belongs to (UUID). Denormalized for convenience.
                job_type:
                    title: job_type
                    description: The type of infrastructure operation to execute.
                    $ref: '#/components/schemas/admiral.api.agent.v1.JobType'
                status:
                    title: status
                    description: Current lifecycle status of the job.
                    $ref: '#/components/schemas/admiral.api.agent.v1.JobStatus'
                started_at:
                    title: started_at
                    description: When the agent started executing the job.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                completed_at:
                    title: completed_at
                    description: When the job finished (succeeded, failed, or canceled).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                created_at:
                    title: created_at
                    description: When the job was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Job
            additionalProperties: false
            description: |-
                Job represents an infrastructure execution job assigned to a TERRAFORM agent.
                 Jobs bridge the Run/Revision system and the agent execution plane.
        admiral.api.agent.v1.JobBundle:
            type: object
            properties:
                artifact_url:
                    type: string
                    title: artifact_url
                    description: |-
                        Signed URL to download the rendered artifact bundle (tar.gz of the rendered
                         infrastructure source tree). Time-limited.
                artifact_checksum:
                    type: string
                    title: artifact_checksum
                    description: SHA-256 checksum of the artifact bundle for integrity verification.
                variables:
                    type: object
                    title: variables
                    additionalProperties:
                        type: string
                        title: value
                    description: |-
                        Resolved variable values written to the workspace as an auto-loaded tfvars
                         file. Sensitive values are included (the agent is a trusted execution
                         context). Encoding contract: the agent writes the map verbatim as HCL
                         `key = value` lines; the server produces the correct HCL literal per type.
                provider_configs:
                    type: object
                    title: provider_configs
                    additionalProperties:
                        type: string
                        title: value
                    description: |-
                        Provider configuration blocks (JSON-encoded). Keys are provider names, values
                         are JSON objects with provider config.
                backend_config:
                    type: string
                    title: backend_config
                    description: |-
                        Backend configuration (JSON-encoded). Contains the backend type and its
                         configuration for state storage. Engine-agnostic in shape.
                engine:
                    not:
                        enum:
                            - ENGINE_UNSPECIFIED
                    title: engine
                    description: |-
                        Required. The infrastructure-as-code engine the agent should execute. Server
                         populates from the catalog item's declared engine; UNSPECIFIED is rejected.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Engine'
                engine_version:
                    type: string
                    title: engine_version
                    description: |-
                        Version of the selected engine (e.g., "1.7.5"). Empty means the agent uses
                         its pre-installed default. When set, the agent writes the appropriate version
                         file so tfenv/tofuenv dispatches to the matching binary. If it cannot provide
                         the requested version, the job fails fast; the server does not re-route.
                working_directory:
                    type: string
                    title: working_directory
                    description: |-
                        Subdirectory within the extracted archive where the executor should run
                         (e.g., "modules/cloudsql"). Empty means the archive root. The broader tree is
                         preserved so relative module references resolve.
                plan_file_url:
                    type: string
                    title: plan_file_url
                    description: |-
                        (Apply/destroy-apply jobs only) URL to download the binary plan file produced
                         by the preceding plan job, passed to `apply <plan_file>` so the exact reviewed
                         plan is applied. Empty for plan jobs.
                hooks:
                    title: hooks
                    description: |-
                        Shell-script hooks that run before and after each engine phase. The agent
                         invokes each hook via its selected interpreter in the execution directory.
                    $ref: '#/components/schemas/admiral.api.agent.v1.Hooks'
            title: JobBundle
            additionalProperties: false
            description: |-
                JobBundle contains everything a TERRAFORM agent needs to execute an
                 infrastructure operation. Fetched separately from ClaimJob to keep the claim
                 response light.
        admiral.api.agent.v1.JobBundle.ProviderConfigsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: ProviderConfigsEntry
            additionalProperties: false
        admiral.api.agent.v1.JobBundle.VariablesEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: VariablesEntry
            additionalProperties: false
        admiral.api.agent.v1.JobPhase:
            type: string
            title: JobPhase
            enum:
                - JOB_PHASE_UNSPECIFIED
                - JOB_PHASE_INITIALIZING
                - JOB_PHASE_PLANNING
                - JOB_PHASE_APPLYING
                - JOB_PHASE_FINALIZING
            description: |-
                JobPhase represents the current execution phase of a job as reported by the
                 TERRAFORM agent's worker thread. Used in heartbeat payloads to give the server
                 visibility into job progress between ClaimJob and ReportJobResult.
        admiral.api.agent.v1.JobStatus:
            type: string
            title: JobStatus
            enum:
                - JOB_STATUS_UNSPECIFIED
                - JOB_STATUS_PENDING
                - JOB_STATUS_ASSIGNED
                - JOB_STATUS_RUNNING
                - JOB_STATUS_SUCCEEDED
                - JOB_STATUS_FAILED
                - JOB_STATUS_CANCELED
            description: JobStatus represents the lifecycle state of a TERRAFORM agent job.
        admiral.api.agent.v1.JobType:
            type: string
            title: JobType
            enum:
                - JOB_TYPE_UNSPECIFIED
                - JOB_TYPE_PLAN
                - JOB_TYPE_APPLY
                - JOB_TYPE_DESTROY_PLAN
                - JOB_TYPE_DESTROY_APPLY
            description: |-
                JobType identifies the kind of infrastructure operation a job executes. The
                 concrete engine (Terraform or OpenTofu) is selected per job via
                 JobBundle.engine; the semantics of each type are identical across engines.
        admiral.api.agent.v1.KubernetesAgentStatus:
            type: object
            properties:
                k8s_version:
                    type: string
                    title: k8s_version
                    description: Kubernetes version reported by the agent (e.g., "1.29.2").
                node_count:
                    type: integer
                    title: node_count
                    format: int32
                    description: Total number of nodes in the cluster.
                nodes_ready:
                    type: integer
                    title: nodes_ready
                    format: int32
                    description: Number of nodes in Ready condition.
                pod_capacity:
                    type: integer
                    title: pod_capacity
                    format: int32
                    description: Maximum number of pods the cluster can schedule.
                pod_count:
                    type: integer
                    title: pod_count
                    format: int32
                    description: Total number of pods across all namespaces.
                pods_running:
                    type: integer
                    title: pods_running
                    format: int32
                    description: Number of pods in Running phase.
                pods_pending:
                    type: integer
                    title: pods_pending
                    format: int32
                    description: Number of pods in Pending phase.
                pods_failed:
                    type: integer
                    title: pods_failed
                    format: int32
                    description: Number of pods in Failed phase.
                cpu_capacity_millicores:
                    type:
                        - integer
                        - string
                    title: cpu_capacity_millicores
                    format: int64
                    description: Total CPU capacity across all nodes, in millicores.
                cpu_used_millicores:
                    type:
                        - integer
                        - string
                    title: cpu_used_millicores
                    format: int64
                    description: Current CPU usage across all nodes, in millicores.
                memory_capacity_bytes:
                    type:
                        - integer
                        - string
                    title: memory_capacity_bytes
                    format: int64
                    description: Total memory capacity across all nodes, in bytes.
                memory_used_bytes:
                    type:
                        - integer
                        - string
                    title: memory_used_bytes
                    format: int64
                    description: Current memory usage across all nodes, in bytes.
                workloads_total:
                    type: integer
                    title: workloads_total
                    format: int32
                    description: Total number of tracked workloads.
                workloads_healthy:
                    type: integer
                    title: workloads_healthy
                    format: int32
                    description: Number of workloads in healthy state.
                workloads_degraded:
                    type: integer
                    title: workloads_degraded
                    format: int32
                    description: Number of workloads in degraded state.
                workloads_error:
                    type: integer
                    title: workloads_error
                    format: int32
                    description: Number of workloads in error state.
                metrics_available:
                    type: boolean
                    title: metrics_available
                    description: |-
                        Whether the metrics.k8s.io API is available in this cluster. When false,
                         per-workload CPU/memory collection is disabled and the UI can surface an
                         "install metrics-server" affordance.
                namespace_count:
                    type: integer
                    title: namespace_count
                    format: int32
                    description: Total number of namespaces in the cluster.
            title: KubernetesAgentStatus
            additionalProperties: false
            description: |-
                KubernetesAgentStatus contains cluster-level telemetry for a KUBERNETES agent,
                 as reported via ReportAgentStatus. Used in both the push payload and the read
                 response (GetAgentStatusResponse).
        admiral.api.agent.v1.ListAgentJobsRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent whose jobs to list (UUID).
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `status`: filter by job status (PENDING, ASSIGNED, RUNNING, etc.).
                           - `job_type`: filter by job type (PLAN, APPLY, DESTROY_PLAN, DESTROY_APPLY).
                           - `run_id`: jobs for a specific run (UUID).
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of jobs to return per page. Defaults to 50 when omitted or
                         0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListAgentJobsRequest
            required:
                - agent_id
            additionalProperties: false
            description: |-
                ListAgentJobsRequest contains pagination and filter parameters for listing jobs
                 assigned to a specific TERRAFORM agent.
        admiral.api.agent.v1.ListAgentJobsResponse:
            type: object
            properties:
                jobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Job'
                    title: jobs
                    description: The list of jobs, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListAgentJobsResponse
            additionalProperties: false
            description: ListAgentJobsResponse contains a page of jobs.
        admiral.api.agent.v1.ListAgentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `kind`: filter by agent kind (TERRAFORM, KUBERNETES).
                           - `name`: filter by agent name.
                           - `health_status`: filter by health status.
                           - `labels.key`: filter by label key.

                         Example: `field['kind'] = 'KUBERNETES' AND field['health_status'] = 'HEALTHY'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of agents to return per page. Defaults to 50 when omitted or
                         0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListAgentsRequest
            additionalProperties: false
            description: ListAgentsRequest contains pagination and filter parameters.
        admiral.api.agent.v1.ListAgentsResponse:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agents
                    description: The list of agents.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListAgentsResponse
            additionalProperties: false
            description: ListAgentsResponse contains a page of agents.
        admiral.api.agent.v1.ListApiKeysRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent to list keys for (UUID).
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by key name.
                           - `status`: filter by key status (ACTIVE, REVOKED).
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of keys to return per page. Defaults to 50 when omitted or
                         0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListApiKeysRequest
            required:
                - agent_id
            additionalProperties: false
            description: ListApiKeysRequest contains pagination and filter parameters.
        admiral.api.agent.v1.ListApiKeysResponse:
            type: object
            properties:
                api_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_keys
                    description: The list of keys. Secrets are never included.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListApiKeysResponse
            additionalProperties: false
            description: ListApiKeysResponse contains a page of agent API key metadata.
        admiral.api.agent.v1.ListWorkloadEventsRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent (cluster) whose events to list (UUID).
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `type`: filter by event type (Normal, Warning).
                           - `reason`: filter by event reason.
                           - `component`: filter by reporting component.
                           - `host`: filter by node.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of events to return per page. Defaults to 50 when omitted or
                         0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListWorkloadEventsRequest
            required:
                - agent_id
            additionalProperties: false
            description: |-
                ListWorkloadEventsRequest contains pagination and filter parameters for listing
                 a KUBERNETES agent's observed Kubernetes events.
        admiral.api.agent.v1.ListWorkloadEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.WorkloadEvent'
                    title: events
                    description: The list of events.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListWorkloadEventsResponse
            additionalProperties: false
            description: ListWorkloadEventsResponse contains a page of events.
        admiral.api.agent.v1.ListWorkloadsRequest:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: The agent (cluster) whose workloads to list (UUID).
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `namespace`: filter by Kubernetes namespace.
                           - `kind`: filter by workload kind (Deployment, StatefulSet, DaemonSet).
                           - `name`: filter by workload name.
                           - `health_status`: filter by workload health status.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of workloads to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListWorkloadsRequest
            required:
                - agent_id
            additionalProperties: false
            description: |-
                ListWorkloadsRequest contains pagination and filter parameters for listing
                 workloads on a KUBERNETES agent's cluster.
        admiral.api.agent.v1.ListWorkloadsResponse:
            type: object
            properties:
                workloads:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.Workload'
                    title: workloads
                    description: The list of workloads.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListWorkloadsResponse
            additionalProperties: false
            description: ListWorkloadsResponse contains a page of workloads.
        admiral.api.agent.v1.ObjectReference:
            type: object
            properties:
                kind:
                    type: string
                    title: kind
                    description: Kubernetes resource kind (e.g., "Pod", "ReplicaSet").
                namespace:
                    type: string
                    title: namespace
                    description: Kubernetes namespace.
                name:
                    type: string
                    title: name
                    description: Object name.
                api_version:
                    type: string
                    title: api_version
                    description: Kubernetes apiVersion (e.g., "v1", "apps/v1"). Empty when unknown.
                uid:
                    type: string
                    title: uid
                    description: |-
                        Object UID, used to disambiguate references across recreations. Empty when
                         unknown.
            title: ObjectReference
            additionalProperties: false
            description: ObjectReference is a lightweight reference to a Kubernetes object.
        admiral.api.agent.v1.ReportAgentStatusRequest:
            type: object
            properties:
                status:
                    title: status
                    description: Cluster-level telemetry snapshot.
                    $ref: '#/components/schemas/admiral.api.agent.v1.KubernetesAgentStatus'
                workloads:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.WorkloadStatus'
                    title: workloads
                    description: Per-workload status snapshots.
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.agent.v1.WorkloadEvent'
                    title: events
                    description: Kubernetes events observed since the last push.
                reported_at:
                    title: reported_at
                    description: When the agent generated this report.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                cluster_uid:
                    type: string
                    title: cluster_uid
                    description: |-
                        The Kubernetes kube-system namespace UID, used by the server to verify this
                         token is still bound to the same physical cluster. Empty until resolved.
            title: ReportAgentStatusRequest
            required:
                - status
            additionalProperties: false
            description: |-
                ReportAgentStatusRequest contains a combined telemetry payload from a KUBERNETES
                 agent. Admiral splits this into storage tiers: current snapshot, time-series
                 metrics, and events. The agent is identified by the SAT's binding; the optional
                 cluster_uid lets the server verify the token is still bound to the same physical
                 cluster (trust-on-first-use).
        admiral.api.agent.v1.ReportAgentStatusResponse:
            type: object
            properties:
                ack:
                    type: boolean
                    title: ack
                    description: Whether the report was accepted.
                next_push_seconds:
                    type: integer
                    title: next_push_seconds
                    format: int32
                    description: Server-controlled interval (seconds) before the next status push.
                pending_revision_ids:
                    type: array
                    items:
                        type: string
                    title: pending_revision_ids
                    description: |-
                        IDs of workload revisions currently awaiting apply on this agent's cluster.
                         The agent fetches each via GetRevisionBundle, applies it, and reports via
                         ReportRevisionResult. Piggybacked on the telemetry heartbeat so the agent
                         needs no separate poll loop.
            title: ReportAgentStatusResponse
            additionalProperties: false
            description: ReportAgentStatusResponse acknowledges a telemetry push.
        admiral.api.agent.v1.ReportJobResultRequest:
            type: object

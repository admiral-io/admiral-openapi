        admiral.environment.v1.ListEnvironmentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `application_id`: filter by parent application (UUID).
                           - `name`: filter by environment name.
                           - `workload_type`: filter by workload target type (KUBERNETES).
                             Matches environments that have a workload target of the given type.
                           - `infrastructure_type`: filter by infrastructure target type (TERRAFORM).
                             Matches environments that have an infrastructure target of the given type.
                           - `labels.key`: filter by label key.

                         Example: `field['application_id'] = '<uuid>' AND field['name'] = 'prod'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of environments to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentsRequest
            additionalProperties: false
            description: ListEnvironmentsRequest contains pagination and filter parameters.
        admiral.environment.v1.ListEnvironmentsResponse:
            type: object
            properties:
                environments:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.environment.v1.Environment'
                    title: environments
                    description: The list of environments.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListEnvironmentsResponse
            additionalProperties: false
            description: ListEnvironmentsResponse contains a page of environments.
        admiral.environment.v1.TerraformConfig:

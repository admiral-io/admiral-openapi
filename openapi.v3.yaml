                         When updating target lists, the entire list is replaced. There is no
                         partial merge of individual targets within the list.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateEnvironmentRequest
            required:
                - environment
            additionalProperties: false
            description: UpdateEnvironmentRequest contains the environment fields to update.
        admiral.environment.v1.UpdateEnvironmentResponse:
            type: object
            properties:

                  required: true
                  schema:
                    type: string
                    title: component_id
                    format: uuid
                - name: name
                  in: path
                  description: The name path parameter.
                  required: true
                  schema:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.DeleteTagResponse'
    /v1/components/{name}:

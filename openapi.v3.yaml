                            additionalProperties: false
                            description: |
                                SetComponentStatusRequest names a component, its new status, and why.
                                set_component_status.reason // a deprecated component needs a reason
                                set_component_status.successor // only a deprecated component names a successor
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.SetComponentStatusResponse'
    /v1/components/{component_id}/tags/{name}:
        put:
            tags:

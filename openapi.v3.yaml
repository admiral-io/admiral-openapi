                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.CreateApiKeyResponse'
    /v1/user/tokens/{token_id}:
        get:
            tags:
                - Personal Access Tokens
            summary: Retrieve a personal access token
            description: 'Scope: `token:read`'
            operationId: UserAPI_GetApiKey
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the key (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.GetApiKeyResponse'
        patch:
            tags:
                - Personal Access Tokens
            summary: Update a personal access token
            description: 'Scope: `token:write`'
            operationId: UserAPI_UpdateApiKey
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the key to update (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type:
                                        - string
                                        - "null"
                                    title: name
                                    maxLength: 63
                                    minLength: 1
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                    description: |-
                                        New name for the key. Must follow the same naming rules as creation.
                                         Omit to leave the name unchanged.
                                scopes:
                                    type: array
                                    items:
                                        type: string
                                        maxLength: 64
                                        minLength: 1
                                    title: scopes
                                    maxItems: 255
                                    description: |-
                                        New scopes for the key. Replaces all existing scopes.
                                         The server enforces that issued scopes are a subset of the caller's own
                                         scopes. A key cannot grant more access than the user holds.
                                         Omit to leave scopes unchanged.
                            title: UpdateApiKeyRequest
                            additionalProperties: false
                            description: |-
                                UpdateApiKeyRequest contains the fields to update on an API key.
                                 Only provided fields are updated; omitted fields remain unchanged.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.user.v1.UpdateApiKeyResponse'
    /v1/user/tokens/{token_id}/revoke:
        post:
            tags:

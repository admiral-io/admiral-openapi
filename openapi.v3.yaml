        admiral.api.changeset.v1.Finding:
            type: object
            properties:
                component:
                    type: string
                    title: component
                code:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Finding.Code'
                    title: code
                message:
                    type: string
                    title: message
                details:
                    type: array
                    items:
                        type: string
                    title: details
                    description: For CODE_NONDETERMINISTIC, each `Kind/namespace/name field` that differs.
            title: Finding
            additionalProperties: false
            description: Finding is something a prepare noticed about one component.
        admiral.api.changeset.v1.Finding.Code:
            type: string
            title: Code
            enum:
                - CODE_UNSPECIFIED
                - CODE_LOOKUP_USED
                - CODE_NONDETERMINISTIC
                - CODE_NO_CAPABILITIES
                - CODE_SCOPE_GUESSED
            description: Code names something a prepare noticed but did not refuse.
        admiral.api.changeset.v1.GetArtifactRequest:
            type: object

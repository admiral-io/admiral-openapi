                                        The source with updated fields. Only fields specified in `update_mask`
                                         are updated.
                                    $ref: '#/components/schemas/admiral.source.v1.Source'
                                update_mask:
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. If unset, all mutable fields are updated.
                                         Supported fields: `name`, `description`, `url`, `credential_id`, `catalog`,
                                         `source_config`, `labels`.
                                    $ref: '#/components/schemas/google.protobuf.FieldMask'
                            title: UpdateSourceRequest
                            required:
                                - source
                            additionalProperties: false
                            description: UpdateSourceRequest contains the source fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.source.v1.UpdateSourceResponse'
    /api/v1/sources/{source_id}:
        get:
            tags:
                - Sources
            summary: Retrieve a source
            description: 'Scope: `source:read`'
            operationId: SourceAPI_GetSource
            parameters:
                - name: source_id
                  in: path
                  description: Unique identifier of the source (UUID).
                  required: true
                  schema:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source (UUID).
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.source.v1.GetSourceResponse'
        delete:
            tags:
                - Sources
            summary: Delete a source
            description: 'Scope: `source:write`'
            operationId: SourceAPI_DeleteSource
            parameters:
                - name: source_id
                  in: path
                  description: |-
                    Unique identifier of the source to delete (UUID).
                     Fails if any modules still reference this source.
                  required: true
                  schema:
                    type: string
                    title: source_id
                    format: uuid
                    description: |-
                        Unique identifier of the source to delete (UUID).
                         Fails if any modules still reference this source.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.source.v1.DeleteSourceResponse'
    /api/v1/sources/{source_id}/test:
        post:
            tags:
                - Sources
            summary: Test a source
            description: |-
                A credential in isolation cannot be meaningfully tested. A GitHub PAT is
                 just a string until a target URL is known. TestSource is where the
                 "attach credential, verify it works" flow lives.

                 This operation queries the external system in real time and may take
                 several seconds.

                 Scope: `source:write`
            operationId: SourceAPI_TestSource
            parameters:
                - name: source_id
                  in: path
                  description: Unique identifier of the source to test (UUID).
                  required: true
                  schema:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source to test (UUID).
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                source_id:
                                    type: string
                                    title: source_id
                                    format: uuid
                                    description: Unique identifier of the source to test (UUID).
                            title: TestSourceRequest
                            additionalProperties: false
                            description: TestSourceRequest identifies a source to test.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.source.v1.TestSourceResponse'
    /api/v1/sources/{source_id}/versions:
        get:
            tags:
                - Sources
            summary: List source versions
            description: |-
                For Terraform registry sources, this calls the Module Registry Protocol's
                 version listing endpoint. For Helm repositories, it parses the index.yaml.
                 For OCI sources, it lists tags. For Git sources, it lists tags via
                 ls-remote.

                 This operation queries the external system in real time and may take
                 several seconds.

                 Scope: `source:read`
            operationId: SourceAPI_ListSourceVersions
            parameters:
                - name: source_id
                  in: path
                  description: Unique identifier of the source to query versions for (UUID).
                  required: true
                  schema:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source to query versions for (UUID).
                - name: page_size
                  in: query
                  description: Maximum number of versions to return. Defaults to 50.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of versions to return. Defaults to 50.
                - name: page_token
                  in: query
                  description: Opaque pagination token for fetching additional versions.
                  schema:
                    type: string
                    title: page_token
                    description: Opaque pagination token for fetching additional versions.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.source.v1.ListSourceVersionsResponse'
    /api/v1/user/me:
        get:
            tags:
                - User
            summary: Retrieve current user profile
            description: 'Scope: any authenticated token (no specific scope required).'
            operationId: UserAPI_GetMe
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.GetMeResponse'
    /api/v1/user/tokens:
        get:
            tags:
                - Personal Access Tokens
            summary: List personal access tokens
            description: 'Scope: `token:read`'
            operationId: UserAPI_ListPersonalAccessTokens
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Filterable fields:
                       - `name`: filter by token name.
                       - `status`: filter by token status (ACTIVE, REVOKED, EXPIRED).

                     Example: `field['status'] = 'ACTIVE'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by token name.
                           - `status`: filter by token status (ACTIVE, REVOKED, EXPIRED).

                         Example: `field['status'] = 'ACTIVE'`
                - name: page_size
                  in: query
                  description: Maximum number of tokens to return per page.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of tokens to return per page.
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.ListPersonalAccessTokensResponse'
        post:
            tags:
                - Personal Access Tokens
            summary: Create a personal access token
            description: 'Scope: `token:write`'
            operationId: UserAPI_CreatePersonalAccessToken
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.user.v1.CreatePersonalAccessTokenRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.CreatePersonalAccessTokenResponse'
    /api/v1/user/tokens/{token_id}:
        get:
            tags:
                - Personal Access Tokens
            summary: Retrieve a personal access token
            description: 'Scope: `token:read`'
            operationId: UserAPI_GetPersonalAccessToken
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the token (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the token (UUID).
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.GetPersonalAccessTokenResponse'
        patch:
            tags:
                - Personal Access Tokens
            summary: Update a personal access token
            description: 'Scope: `token:write`'
            operationId: UserAPI_UpdatePersonalAccessToken
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the token to update (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the token to update (UUID).
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                token_id:
                                    type: string
                                    title: token_id
                                    format: uuid
                                    description: The unique identifier of the token to update (UUID).
                                name:
                                    type:
                                        - string
                                        - "null"
                                    title: name
                                    maxLength: 63
                                    minLength: 1
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                    description: |-
                                        New name for the token. Must follow the same naming rules as creation.
                                         Omit to leave the name unchanged.
                                scopes:
                                    type: array
                                    items:
                                        type: string
                                        maxLength: 64
                                        minLength: 1
                                    title: scopes
                                    maxItems: 255
                                    description: |-
                                        New scopes for the token. Replaces all existing scopes.
                                         The server enforces that issued scopes are a subset of the caller's own
                                         scopes. A token cannot grant more access than the user holds.
                                         Omit to leave scopes unchanged.
                            title: UpdatePersonalAccessTokenRequest
                            additionalProperties: false
                            description: |-
                                UpdatePersonalAccessTokenRequest contains the fields to update on a PAT.
                                 Only provided fields are updated; omitted fields remain unchanged.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.UpdatePersonalAccessTokenResponse'
    /api/v1/user/tokens/{token_id}/revoke:
        post:
            tags:
                - Personal Access Tokens
            summary: Revoke a personal access token
            description: 'Scope: `token:write`'
            operationId: UserAPI_RevokePersonalAccessToken
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the token to revoke (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the token to revoke (UUID).
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                token_id:
                                    type: string
                                    title: token_id
                                    format: uuid
                                    description: The unique identifier of the token to revoke (UUID).
                            title: RevokePersonalAccessTokenRequest
                            additionalProperties: false
                            description: RevokePersonalAccessTokenRequest identifies a PAT to revoke.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.RevokePersonalAccessTokenResponse'
    /api/v1/users/{user_id}:
        get:
            tags:
                - User
            summary: Retrieve a user by ID
            description: 'Scope: `user:read`'
            operationId: UserAPI_GetUser
            parameters:
                - name: user_id
                  in: path
                  description: The unique identifier of the user (UUID).
                  required: true
                  schema:
                    type: string
                    title: user_id
                    format: uuid
                    description: The unique identifier of the user (UUID).
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.user.v1.GetUserResponse'
components:
    schemas:
        admiral.application.v1.Application:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the application (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                         the tenant. Lowercase alphanumeric and hyphens only, must start with a
                         letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the application's purpose
                         (e.g., "Core inventory service tracking warehouse stock and fulfillment").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering applications
                         (e.g., `{"team": "logistics", "tier": "critical"}`).
                created_by:
                    title: created_by
                    description: The user or agent who created this application (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the application was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the application was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Application
            additionalProperties: false
            description: |-
                Application represents a deployable unit within a tenant. An application
                 groups manifests, dependencies, and environment configuration into a single
                 entity that Admiral orchestrates across environments.
            example:
                id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                name: "inventory-api"
                description: "Core inventory management service for tracking warehouse stock levels and fulfillment."
                labels:
                    team: "logistics"
                    tier: "critical"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-09-15T10:30:00Z"
                updated_at: "2025-11-02T14:22:00Z"
        admiral.application.v1.Application.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.application.v1.CreateApplicationRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "inventory-api"). Must be unique
                         within the tenant. Lowercase alphanumeric and hyphens only.
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the application's purpose.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering applications.
            title: CreateApplicationRequest
            additionalProperties: false
            description: CreateApplicationRequest contains the parameters for creating a new application.
        admiral.application.v1.CreateApplicationRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.application.v1.CreateApplicationResponse:
            type: object
            properties:
                application:
                    title: application
                    description: The created application.
                    $ref: '#/components/schemas/admiral.application.v1.Application'
            title: CreateApplicationResponse
            additionalProperties: false
            description: CreateApplicationResponse contains the newly created application.
        admiral.application.v1.DeleteApplicationRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The unique identifier of the application to delete (UUID).
                force:
                    type: boolean
                    title: force
                    description: |-
                        When true, bypass the children-exist check and cascade-delete all
                         environments and their runs (metadata records only).
            title: DeleteApplicationRequest
            additionalProperties: false
            description: DeleteApplicationRequest identifies an application to delete.
        admiral.application.v1.DeleteApplicationResponse:
            type: object
            title: DeleteApplicationResponse
            additionalProperties: false
            description: DeleteApplicationResponse is empty on success.
        admiral.application.v1.GetApplicationRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The unique identifier of the application (UUID).
            title: GetApplicationRequest
            additionalProperties: false
            description: GetApplicationRequest identifies an application to retrieve.
        admiral.application.v1.GetApplicationResponse:
            type: object
            properties:
                application:
                    title: application
                    description: The application record.
                    $ref: '#/components/schemas/admiral.application.v1.Application'
            title: GetApplicationResponse
            additionalProperties: false
            description: GetApplicationResponse contains the application record.
        admiral.application.v1.ListApplicationsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `name`: filter by application name.
                           - `labels.key`: filter by label key.

                         Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of applications to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListApplicationsRequest
            additionalProperties: false
            description: ListApplicationsRequest contains pagination and filter parameters.
        admiral.application.v1.ListApplicationsResponse:
            type: object
            properties:
                applications:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.application.v1.Application'
                    title: applications
                    description: The list of applications.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListApplicationsResponse
            additionalProperties: false
            description: ListApplicationsResponse contains a page of applications.
        admiral.application.v1.UpdateApplicationRequest:
            type: object
            properties:
                application:
                    title: application
                    description: |-
                        The application with updated fields.
                         Only fields specified in `update_mask` are updated.
                    $ref: '#/components/schemas/admiral.application.v1.Application'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. If unset, all mutable fields are updated.
                         Supported fields: `name`, `description`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateApplicationRequest
            required:
                - application
            additionalProperties: false
            description: UpdateApplicationRequest contains the application fields to update.
        admiral.application.v1.UpdateApplicationResponse:
            type: object
            properties:
                application:
                    title: application
                    description: The updated application.
                    $ref: '#/components/schemas/admiral.application.v1.Application'
            title: UpdateApplicationResponse
            additionalProperties: false
            description: UpdateApplicationResponse contains the updated application.
        admiral.changeset.v1.ChangeSet:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the change set (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this change set targets (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this change set targets (UUID).
                status:
                    title: status
                    description: Lifecycle status of this change set.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetStatus'
                copied_from_id:
                    type: string
                    title: copied_from_id
                    description: |-
                        If this change set was created via CopyChangeSet, the UUID of the source
                         change set. Forms the promotion chain (e.g., dev -> staging -> prod).
                         Empty for change sets created directly via CreateChangeSet.
                title:
                    type: string
                    title: title
                    maxLength: 256
                    description: Human-readable title for the change set (e.g., "Bump database version").
                description:
                    type: string
                    title: description
                    maxLength: 4096
                    description: Optional longer description of what the change set proposes.
                run_id:
                    type: string
                    title: run_id
                    description: |-
                        The run that closed this change set (UUID). Populated when status
                         transitions to DEPLOYED. Empty otherwise.
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetEntry'
                    title: entries
                    description: |-
                        Component entries proposed by this change set. Populated by GetChangeSet;
                         empty in ListChangeSets responses.
                variable_entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetVariableEntry'
                    title: variable_entries
                    description: |-
                        Variable entries proposed by this change set. Populated by GetChangeSet;
                         empty in ListChangeSets responses.
                display_id:
                    type: string
                    title: display_id
                    description: |-
                        Typed display identifier of the form `cs-<12-char-suffix>` (e.g.,
                         `cs-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                         over `id` for user-facing references; lookups accept either form.
                application_name:
                    type: string
                    title: application_name
                    description: |-
                        Display name of the parent application. Denormalized for display.
                         Read-only; ignored on writes.
                environment_name:
                    type: string
                    title: environment_name
                    description: |-
                        Display name of the parent environment. Denormalized for display.
                         Read-only; ignored on writes.
                created_by:
                    title: created_by
                    description: |-
                        The user or agent that created this change set
                         (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the change set was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: |-
                        When the change set was last updated (metadata, entries, variable
                         entries, or status).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ChangeSet
            additionalProperties: false
            description: |-
                ChangeSet is a scoped, isolated proposal to mutate the deployed state of an
                 application within a single environment.

                 The change set holds two kinds of proposals:
                   - Component entries: per-name deltas (CREATE/UPDATE/DESTROY/ORPHAN).
                   - Variable entries: per-key set or delete-on-apply.
        admiral.changeset.v1.ChangeSetDiff:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.EntryDiff'
                    title: entries
                    description: Per-component entry deltas, ordered by component name.
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.VariableDiff'
                    title: variables
                    description: Per-key variable deltas, ordered by key.
                downstream:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.DownstreamImpact'
                    title: downstream
                    description: |-
                        Deployed components affected by changes to the entries above (static
                         graph walk over `values_template` references).
            title: ChangeSetDiff
            additionalProperties: false
            description: |-
                ChangeSetDiff describes what a change set would change relative to current
                 environment HEAD: per-component entries, per-key variable changes, and the
                 deployed components whose `values_template` references a name touched by
                 this change set.
        admiral.changeset.v1.ChangeSetEntry:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the entry (UUID).
                change_set_id:
                    type: string
                    title: change_set_id
                    format: uuid
                    description: The change set this entry belongs to (UUID).
                component_id:
                    type: string
                    title: component_id
                    description: |-
                        The component this entry targets (UUID). Absent for CREATE entries
                         (the component does not exist yet).
                component_name:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        Component name (stable identifier set at creation). Required for all
                         entries. For CREATE entries, this is the name of the component to be
                         created. For UPDATE/DESTROY/ORPHAN entries, this matches an existing
                         component in the application.
                change_type:
                    title: change_type
                    description: The change type.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetEntryType'
                module_id:
                    type:
                        - string
                        - "null"
                    title: module_id
                    format: uuid
                    description: |-
                        The module to deploy (UUID). Required for CREATE; optional for UPDATE
                         (if changing the module); not allowed for DESTROY/ORPHAN.
                version:
                    type:
                        - string
                        - "null"
                    title: version
                    maxLength: 256
                    description: |-
                        Optional ref override (e.g., tag, branch, or commit SHA). For UPDATE
                         entries, absent means "no change to version."
                values_template:
                    type:
                        - string
                        - "null"
                    title: values_template
                    maxLength: 65536
                    description: |-
                        Values template for module inputs. For UPDATE entries, absent means
                         "no change to values_template."
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Explicit dependencies (component names). Whatever the client sends is
                         recorded; an empty list clears existing dependencies. Not allowed for
                         DESTROY/ORPHAN entries. Names may reference components materialized
                         earlier in the same change set (their UUIDs do not exist until apply).
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description for the proposed change (e.g., "Bump to v2.1.0
                         for performance fix"). For UPDATE entries, absent means "no change."
                module_name:
                    type: string
                    title: module_name
                    description: |-
                        Display name of the referenced module. Denormalized for display.
                         Read-only; ignored on writes.
                created_at:
                    title: created_at
                    description: When the entry was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the entry was last replaced.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ChangeSetEntry
            additionalProperties: false
            description: |-
                ChangeSetEntry is a per-component proposal within a change set.

                 Patch semantics: optional fields that are absent mean "no change relative
                 to the component's current state at deploy time." Required fields per
                 `change_type`:
                   - CREATE: `module_id` required; `component_id` must be empty.
                   - UPDATE: `component_id` required; at least one optional field set.
                   - DESTROY / ORPHAN: `component_id` required; no patch fields allowed.
        admiral.changeset.v1.ChangeSetEntryType:
            type: string
            title: ChangeSetEntryType
            enum:
                - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
                - CHANGE_SET_ENTRY_TYPE_CREATE
                - CHANGE_SET_ENTRY_TYPE_UPDATE
                - CHANGE_SET_ENTRY_TYPE_DESTROY
                - CHANGE_SET_ENTRY_TYPE_ORPHAN
            description: ChangeSetEntryType selects what the entry does to the targeted component.
        admiral.changeset.v1.ChangeSetStatus:
            type: string
            title: ChangeSetStatus
            enum:
                - CHANGE_SET_STATUS_UNSPECIFIED
                - CHANGE_SET_STATUS_OPEN
                - CHANGE_SET_STATUS_DEPLOYED
                - CHANGE_SET_STATUS_DISCARDED
            description: |-
                ChangeSetStatus is the lifecycle state of a change set. Only OPEN change
                 sets can be mutated. DEPLOYED is reached when a run referencing the change
                 set succeeds; DISCARDED is reached via DiscardChangeSet.
        admiral.changeset.v1.ChangeSetVariableEntry:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the variable entry (UUID).
                change_set_id:
                    type: string
                    title: change_set_id
                    format: uuid
                    description: The change set this entry belongs to (UUID).
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key (e.g., "TF_VAR_region", "IMAGE_TAG").
                value:
                    type:
                        - string
                        - "null"
                    title: value
                    description: |-
                        The value to set on apply. Absent means "delete this key on apply"
                         (tombstone). Masked in responses when `sensitive` is true.
                type:
                    title: type
                    description: |-
                        How the value should be interpreted by the rendering engine and
                         displayed in the UI.
                    $ref: '#/components/schemas/admiral.variable.v1.VariableType'
                sensitive:
                    type: boolean
                    title: sensitive
                    description: When true, the value is encrypted at rest and masked in API responses.
                created_at:
                    title: created_at
                    description: When the variable entry was created or last replaced.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ChangeSetVariableEntry
            additionalProperties: false
            description: |-
                ChangeSetVariableEntry is a per-key variable proposal within a change set.

                 At deploy time, each variable entry is applied to the change set's
                 environment: an entry with `value` set upserts the key, and an entry with
                 `value` absent (a tombstone) removes the key.
        admiral.changeset.v1.CopyChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the source change set to copy. Accepts either the short
                         ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: |-
                        The target environment for the new change set (UUID). Must belong to
                         the source change set's application.
                title:
                    type: string
                    title: title
                    maxLength: 256
                    description: Optional title override. Defaults to the source's title when empty.
                description:
                    type: string
                    title: description
                    maxLength: 4096
                    description: |-
                        Optional description override. Defaults to the source's description
                         when empty.
            title: CopyChangeSetRequest
            additionalProperties: false
            description: |-
                CopyChangeSetRequest creates a new OPEN change set by copying an existing
                 one to a target environment.
        admiral.changeset.v1.CopyChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The new change set with `copied_from_id` set to the source.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
            title: CopyChangeSetResponse
            additionalProperties: false
            description: CopyChangeSetResponse contains the newly created change set.
        admiral.changeset.v1.CreateChangeSetRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this change set targets (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this change set targets (UUID).
                title:
                    type: string
                    title: title
                    maxLength: 256
                    description: Optional human-readable title (e.g., "Bump database version").
                description:
                    type: string
                    title: description
                    maxLength: 4096
                    description: Optional longer description of what the change set proposes.
            title: CreateChangeSetRequest
            additionalProperties: false
            description: |-
                CreateChangeSetRequest opens a new change set for an (application,
                 environment) pair.
        admiral.changeset.v1.CreateChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: |-
                        The created change set. Status is OPEN; entries and variable entries
                         are empty.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
            title: CreateChangeSetResponse
            additionalProperties: false
            description: CreateChangeSetResponse contains the newly created change set.
        admiral.changeset.v1.DiffChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            title: DiffChangeSetRequest
            additionalProperties: false
            description: DiffChangeSetRequest identifies the change set to diff.
        admiral.changeset.v1.DiffChangeSetResponse:
            type: object
            properties:
                diff:
                    title: diff
                    description: |-
                        The structural diff. Empty `entries`, `variables`, and `downstream` lists
                         mean the change set proposes no changes relative to current state.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetDiff'
            title: DiffChangeSetResponse
            additionalProperties: false
            description: DiffChangeSetResponse contains the computed diff.
        admiral.changeset.v1.DiffChangeType:
            type: string
            title: DiffChangeType
            enum:
                - DIFF_CHANGE_TYPE_UNSPECIFIED
                - DIFF_CHANGE_TYPE_ADDED
                - DIFF_CHANGE_TYPE_CHANGED
                - DIFF_CHANGE_TYPE_REMOVED
            description: |-
                DiffChangeType classifies a single change inside a ChangeSetDiff:
                 per-key value changes inside an entry's values_template, or per-key
                 variable changes.
        admiral.changeset.v1.DiscardChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set to discard. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            title: DiscardChangeSetRequest
            additionalProperties: false
            description: DiscardChangeSetRequest abandons an OPEN change set.
        admiral.changeset.v1.DiscardChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The change set with status set to DISCARDED.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
            title: DiscardChangeSetResponse
            additionalProperties: false
            description: DiscardChangeSetResponse contains the discarded change set.
        admiral.changeset.v1.DownstreamImpact:
            type: object
            properties:
                component_name:
                    type: string
                    title: component_name
                    description: Name of the deployed component that will be affected.
                affected_by:
                    type: array
                    items:
                        type: string
                    title: affected_by
                    description: |-
                        Names in this change set whose outputs the deployed component
                         references.
            title: DownstreamImpact
            additionalProperties: false
            description: |-
                DownstreamImpact lists deployed components whose `values_template`
                 references the outputs of a component touched by this change set. Surfaces
                 the "if you apply this, these other components will also re-plan" set.
        admiral.changeset.v1.EntryDiff:
            type: object
            properties:
                component_name:
                    type: string
                    title: component_name
                    description: Component name this entry targets.
                change_type:
                    title: change_type
                    description: Change kind.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetEntryType'
                module:
                    oneOf:
                        - $ref: '#/components/schemas/admiral.changeset.v1.ModuleVersionDiff'
                        - type: "null"
                    title: module
                    description: Module / version delta. Absent when neither field changes.
                values:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.ValueDiff'
                    title: values
                    description: |-
                        Per-key value-template deltas. Today this contains a single ValueDiff
                         keyed `values_template` carrying the full template text so reviewers
                         can read the new template.
                depends_on_added:
                    type: array
                    items:
                        type: string
                    title: depends_on_added
                    description: Names added to depends_on by this entry.
                depends_on_removed:
                    type: array
                    items:
                        type: string
                    title: depends_on_removed
                    description: Names removed from depends_on by this entry.
                description_old:
                    type:
                        - string
                        - "null"
                    title: description_old
                    description: Old description (UPDATE only, when the entry sets description).
                description_new:
                    type:
                        - string
                        - "null"
                    title: description_new
                    description: New description (CREATE/UPDATE only).
            title: EntryDiff
            additionalProperties: false
            description: |-
                EntryDiff describes a single component entry's effect.

                 For CREATE entries, `module`/`values`/`depends_on_added` describe the
                 proposed new component; the `_old` halves are absent.
                 For UPDATE entries, only fields the entry actually changes appear; absent
                 patch fields mean "no change."
                 For DESTROY/ORPHAN entries, `module`/`values`/`depends_on_*` are absent.
        admiral.changeset.v1.GetChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            title: GetChangeSetRequest
            additionalProperties: false
            description: GetChangeSetRequest identifies a change set to retrieve.
        admiral.changeset.v1.GetChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The change set, with `entries` and `variable_entries` populated.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
            title: GetChangeSetResponse
            additionalProperties: false
            description: GetChangeSetResponse contains the change set with all entries inline.
        admiral.changeset.v1.ListChangeSetsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `application_id`: change sets for a specific application (UUID).
                           - `environment_id`: change sets for a specific environment (UUID).
                           - `status`: filter by status (OPEN, DEPLOYED, DISCARDED).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'OPEN'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of change sets to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListChangeSetsRequest
            additionalProperties: false
            description: ListChangeSetsRequest contains pagination and filter parameters.
        admiral.changeset.v1.ListChangeSetsResponse:
            type: object
            properties:
                change_sets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
                    title: change_sets
                    description: |-
                        The list of change sets, ordered from newest to oldest. Each record
                         omits `entries` and `variable_entries`; call GetChangeSet for the
                         full record.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListChangeSetsResponse
            additionalProperties: false
            description: ListChangeSetsResponse contains a page of change sets.
        admiral.changeset.v1.ModuleVersionDiff:
            type: object
            properties:
                module_id_old:
                    type:
                        - string
                        - "null"
                    title: module_id_old
                    description: Module UUID before the change.
                module_id_new:
                    type:
                        - string
                        - "null"
                    title: module_id_new
                    description: Module UUID after the change.
                module_name_old:
                    type:
                        - string
                        - "null"
                    title: module_name_old
                    description: Module name before the change (denormalized for display).
                module_name_new:
                    type:
                        - string
                        - "null"
                    title: module_name_new
                    description: Module name after the change (denormalized for display).
                version_old:
                    type:
                        - string
                        - "null"
                    title: version_old
                    description: Version (ref override) before the change.
                version_new:
                    type:
                        - string
                        - "null"
                    title: version_new
                    description: Version (ref override) after the change.
            title: ModuleVersionDiff
            additionalProperties: false
            description: |-
                ModuleVersionDiff describes a module-id and/or version change on an entry.
                 Absent halves mean "unset." Both halves can be absent for CREATE entries
                 whose module fields aren't being changed (caller still emits the new
                 values).
        admiral.changeset.v1.RemoveEntryRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                component_name:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Component name of the entry to remove.
            title: RemoveEntryRequest
            additionalProperties: false
            description: RemoveEntryRequest deletes a single entry from an OPEN change set.
        admiral.changeset.v1.RemoveEntryResponse:
            type: object
            title: RemoveEntryResponse
            additionalProperties: false
            description: RemoveEntryResponse is empty on success.
        admiral.changeset.v1.RemoveVariableRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key to remove on apply.
            title: RemoveVariableRequest
            additionalProperties: false
            description: |-
                RemoveVariableRequest writes a tombstone variable entry that, when the
                 change set is deployed, removes the key from the target environment.
        admiral.changeset.v1.RemoveVariableResponse:
            type: object
            properties:
                variable_entry:
                    title: variable_entry
                    description: The tombstone entry (value absent, marking the key for deletion on apply).
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetVariableEntry'
            title: RemoveVariableResponse
            additionalProperties: false
            description: RemoveVariableResponse contains the tombstone variable entry.
        admiral.changeset.v1.SetEntryRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                component_name:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Component name (stable identifier set at creation). Required.
                change_type:
                    not:
                        enum:
                            - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
                    title: change_type
                    description: The change type.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetEntryType'
                module_id:
                    type:
                        - string
                        - "null"
                    title: module_id
                    format: uuid
                    description: |-
                        The module to deploy (UUID). Required for CREATE; optional for UPDATE.
                         Not allowed for DESTROY/ORPHAN.
                version:
                    type:
                        - string
                        - "null"
                    title: version
                    maxLength: 256
                    description: Optional ref override.
                values_template:
                    type:
                        - string
                        - "null"
                    title: values_template
                    maxLength: 65536
                    description: Values template for module inputs.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: Explicit dependencies (component names). Empty list clears.
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                    description: Optional description of the proposed change.
            title: SetEntryRequest
            additionalProperties: false
            description: SetEntryRequest creates or replaces a component entry within a change set.
        admiral.changeset.v1.SetEntryResponse:
            type: object
            properties:
                entry:
                    title: entry
                    description: The entry as recorded on the change set.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetEntry'
            title: SetEntryResponse
            additionalProperties: false
            description: SetEntryResponse contains the created or replaced entry.
        admiral.changeset.v1.SetVariableRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key.
                value:
                    type: string
                    title: value
                    minLength: 1
                    description: The value to set on apply. For COMPLEX type, must be valid JSON.
                type:
                    title: type
                    description: How the value should be interpreted. Defaults to STRING when unspecified.
                    $ref: '#/components/schemas/admiral.variable.v1.VariableType'
                sensitive:
                    type: boolean
                    title: sensitive
                    description: When true, the value is encrypted at rest and masked in API responses.
            title: SetVariableRequest
            additionalProperties: false
            description: SetVariableRequest creates or replaces a variable entry within a change set.
        admiral.changeset.v1.SetVariableResponse:
            type: object
            properties:
                variable_entry:
                    title: variable_entry
                    description: The variable entry as recorded on the change set.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSetVariableEntry'
            title: SetVariableResponse
            additionalProperties: false
            description: SetVariableResponse contains the created or replaced variable entry.
        admiral.changeset.v1.UpdateChangeSetRequest:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: |-
                        The change set with updated fields. Only fields listed in `update_mask`
                         are applied.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
                update_mask:
                    title: update_mask
                    description: 'The set of fields to update. Supported fields: `title`, `description`.'
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateChangeSetRequest
            required:
                - change_set
            additionalProperties: false
            description: UpdateChangeSetRequest updates a change set's mutable metadata.
        admiral.changeset.v1.UpdateChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The updated change set.
                    $ref: '#/components/schemas/admiral.changeset.v1.ChangeSet'
            title: UpdateChangeSetResponse
            additionalProperties: false
            description: |-
                UpdateChangeSetResponse contains the updated change set (metadata only;
                 entries are not returned; call GetChangeSet for the full record).
        admiral.changeset.v1.ValueDiff:
            type: object
            properties:
                key:
                    type: string
                    title: key
                    description: Key inside the values_template. Always `values_template` today.
                change_type:
                    title: change_type
                    description: The change type (ADDED, CHANGED, REMOVED).
                    $ref: '#/components/schemas/admiral.changeset.v1.DiffChangeType'
                old:
                    type:
                        - string
                        - "null"
                    title: old
                    description: Previous value (absent for ADDED, sensitive, or when not tracked).
                new:
                    type:
                        - string
                        - "null"
                    title: new
                    description: New value (absent for REMOVED, sensitive, or when not tracked).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: True when the underlying value is sensitive; old/new must be omitted.
            title: ValueDiff
            additionalProperties: false
            description: |-
                ValueDiff describes a single value change inside an entry's
                 `values_template`. EntryDiff emits at most one ValueDiff per entry, keyed
                 `values_template`, carrying the full template text.

                 Sensitive values are masked: when `sensitive=true`, both `old` and `new`
                 are absent.
        admiral.changeset.v1.VariableDiff:
            type: object
            properties:
                key:
                    type: string
                    title: key
                    description: The variable key.
                change_type:
                    title: change_type
                    description: The change type (ADDED, CHANGED, REMOVED).
                    $ref: '#/components/schemas/admiral.changeset.v1.DiffChangeType'
                old:
                    type:
                        - string
                        - "null"
                    title: old
                    description: Previous value (absent for ADDED or sensitive).
                new:
                    type:
                        - string
                        - "null"
                    title: new
                    description: New value (absent for REMOVED or sensitive).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: True when either side is sensitive; old/new must be omitted.
            title: VariableDiff
            additionalProperties: false
            description: |-
                VariableDiff describes a per-key change to environment variables.

                 ADDED: the change set sets a key not currently present in the env.
                 CHANGED: the change set sets a key with a different value/type/sensitivity.
                 REMOVED: the change set carries a tombstone (delete-on-apply) for a key
                 that exists in the env.
        admiral.cluster.v1.Cluster:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the cluster (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod-us-east-1"). Unique
                         within the tenant. Lowercase alphanumeric and hyphens only, must start
                         with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the cluster's purpose
                         (e.g., "Primary production cluster serving US East traffic").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering clusters
                         (e.g., `{"region": "us-east-1", "cloud": "aws"}`).
                cluster_uid:
                    type: string
                    title: cluster_uid
                    description: |-
                        The Kubernetes kube-system namespace UID, bound at agent registration
                         using a first-write-wins strategy. Used to detect when a token is
                         accidentally deployed to a different physical cluster.
                health_status:
                    title: health_status
                    description: Derived health status based on agent connectivity and workload state.
                    $ref: '#/components/schemas/admiral.cluster.v1.ClusterHealthStatus'
                created_by:
                    title: created_by
                    description: The user or agent who created this cluster (server-populated from token).

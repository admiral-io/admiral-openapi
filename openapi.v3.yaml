                                status:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version.Status'
                                    not:
                                        enum:
                                            - STATUS_UNSPECIFIED
                                    title: status
                                    description: |
                                        enum.defined_only = true
                                reason:
                                    type: string
                                    title: reason
                                    maxLength: 1024
                                    minLength: 1
                                    description: |-
                                        Shown to anyone who adopts or tries to adopt the version, and to every
                                         environment running it.
                            title: SetVersionStatusRequest
                            required:
                                - status
                                - reason
                            additionalProperties: false
                            description: |-
                                SetVersionStatusRequest names a version by digest, its new status, and
                                 why.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.SetVersionStatusResponse'

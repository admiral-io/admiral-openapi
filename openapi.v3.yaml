            additionalProperties: false
            description: RevokeRunnerTokenResponse contains the revoked runner SAT metadata.
        admiral.runner.v1.Runner:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the runner (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod-terraform-runner").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the runner's purpose
                         (e.g., "Terraform runner for production AWS infrastructure").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering runners
                         (e.g., `{"cloud": "aws", "team": "platform"}`).
                health_status:
                    title: health_status
                    description: Derived health status based on heartbeat recency and capacity.
                    $ref: '#/components/schemas/admiral.runner.v1.RunnerHealthStatus'
                created_by:
                    title: created_by
                    description: The user or agent who created this runner (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the runner record was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: |-
                        When the runner record was last updated via UpdateRunner. Heartbeats do
                         not bump this field; liveness state is exposed separately via
                         RunnerStatus and health_status.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Runner
            additionalProperties: false
            description: |-
                Runner represents a registered infrastructure execution runner within a
                 tenant. Runners claim and execute infrastructure operations (plan, apply,
                 destroy) dispatched by the run engine, using the terraform-semantic
                 engine selected per job (Terraform or OpenTofu).
            example:
                id: "b2c3d4e5-6789-0abc-def1-234567890abc"
                name: "prod-terraform-runner"
                description: "Terraform runner for production AWS infrastructure provisioning."
                kind: "RUNNER_KIND_TERRAFORM"
                labels:
                    cloud: "aws"
                    team: "platform"
                health_status: "RUNNER_HEALTH_STATUS_HEALTHY"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-07-15T10:00:00Z"
                updated_at: "2025-11-18T08:30:00Z"
        admiral.runner.v1.Runner.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.runner.v1.RunnerHealthStatus:
            type: string
            title: RunnerHealthStatus
            enum:
                - RUNNER_HEALTH_STATUS_UNSPECIFIED
                - RUNNER_HEALTH_STATUS_PENDING
                - RUNNER_HEALTH_STATUS_HEALTHY
                - RUNNER_HEALTH_STATUS_DEGRADED
                - RUNNER_HEALTH_STATUS_UNREACHABLE
            description: |-
                RunnerHealthStatus represents the derived health state of a runner.
                 The status is computed from heartbeat recency and capacity metrics.
        admiral.runner.v1.RunnerStatus:
            type: object
            properties:
                version:
                    type: string
                    title: version
                    description: The runner binary version (e.g., "1.2.0").
                active_jobs:
                    type: integer
                    title: active_jobs
                    format: int32
                    description: Number of jobs currently being executed by this runner.
                max_concurrent_jobs:
                    type: integer
                    title: max_concurrent_jobs
                    format: int32
                    description: Maximum number of concurrent jobs this runner supports.
                active_job_details:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.runner.v1.ActiveJobInfo'
                    title: active_job_details
                    description: |-
                        Details of jobs currently being executed by this runner instance. The
                         worker thread updates job phase in shared memory; the heartbeat thread
                         reads and includes it on each tick. Gives the server visibility into
                         job progress for stuck-job detection and admin dashboards.

                         This is the complete set of jobs currently in flight on the instance;
                         the runner does not cap or sample this list. `len(active_job_details)`
                         equals `active_jobs` on every heartbeat.
            title: RunnerStatus
            additionalProperties: false
            description: |-
                RunnerStatus contains capacity and telemetry metrics for a runner, as
                 reported via Heartbeat. This message is used in both the push payload
                 (HeartbeatRequest) and the read response (GetRunnerStatusResponse).

                 Server-derived fields (health_status) are NOT included here. They live
                 on the Runner record and are returned alongside this message in
                 GetRunnerStatusResponse.

                 Runner capabilities (which engines are installed, which credentials are
                 available, etc.) are operator-declared on the Runner record at registration
                 time; they are NOT self-reported here. Heartbeat is purely for liveness
                 and capacity signals that change at runtime.
        admiral.runner.v1.UpdateRunnerRequest:
            type: object
            properties:
                runner:
                    title: runner
                    description: |-
                        The runner with updated fields. The `id` field is required.
                         Only fields specified in `update_mask` are updated.
                    $ref: '#/components/schemas/admiral.runner.v1.Runner'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. If unset, all mutable fields are updated.
                         Supported fields: `name`, `description`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateRunnerRequest
            required:
                - runner
            additionalProperties: false
            description: UpdateRunnerRequest contains the runner fields to update.
        admiral.runner.v1.UpdateRunnerResponse:
            type: object
            properties:
                runner:
                    title: runner
                    description: The updated runner.
                    $ref: '#/components/schemas/admiral.runner.v1.Runner'
            title: UpdateRunnerResponse
            additionalProperties: false
            description: UpdateRunnerResponse contains the updated runner.
        admiral.source.v1.CreateSourceRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: URL-safe, human-readable identifier. Must be unique within the tenant.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the source's purpose.
                type:
                    not:
                        enum:
                            - SOURCE_TYPE_UNSPECIFIED
                    title: type
                    description: The kind of artifact and fetch protocol.
                    $ref: '#/components/schemas/admiral.source.v1.SourceType'
                url:
                    type: string
                    title: url
                    minLength: 1
                    description: Base URL for the source (see Source.url for per-type semantics).
                credential_id:
                    type:
                        - string
                        - "null"
                    title: credential_id
                    format: uuid
                    description: |-
                        Reference to the credential providing authentication (UUID). Optional for
                         public sources.
                catalog:
                    type: boolean
                    title: catalog
                    description: Whether this is a curated catalog entry.
                source_config:
                    title: source_config
                    description: |-
                        Type-specific configuration. Only required for TERRAFORM and HELM;
                         omit for GIT, OCI, HTTP.
                    $ref: '#/components/schemas/admiral.source.v1.SourceConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels.
            title: CreateSourceRequest
            additionalProperties: false
            description: CreateSourceRequest contains the parameters for creating a new source.
        admiral.source.v1.CreateSourceRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.source.v1.CreateSourceResponse:
            type: object
            properties:
                source:
                    title: source
                    description: The created source.
                    $ref: '#/components/schemas/admiral.source.v1.Source'
            title: CreateSourceResponse
            additionalProperties: false
            description: CreateSourceResponse contains the newly created source.
        admiral.source.v1.DeleteSourceRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: |-
                        Unique identifier of the source to delete (UUID).
                         Fails if any modules still reference this source.
            title: DeleteSourceRequest
            additionalProperties: false
            description: DeleteSourceRequest identifies a source to delete.
        admiral.source.v1.DeleteSourceResponse:
            type: object
            title: DeleteSourceResponse
            additionalProperties: false
            description: DeleteSourceResponse is empty on success.
        admiral.source.v1.GetSourceRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source (UUID).
            title: GetSourceRequest
            additionalProperties: false
            description: GetSourceRequest identifies a source to retrieve.
        admiral.source.v1.GetSourceResponse:
            type: object
            properties:
                source:
                    title: source
                    description: The source record.
                    $ref: '#/components/schemas/admiral.source.v1.Source'
            title: GetSourceResponse
            additionalProperties: false
            description: GetSourceResponse contains the source record.
        admiral.source.v1.HelmConfig:
            type: object
            properties:
                chart_name:
                    type: string
                    title: chart_name
                    minLength: 1
                    description: The chart name within the repository (e.g., "nginx-ingress", "redis").
            title: HelmConfig
            additionalProperties: false
            description: |-
                HelmConfig identifies which chart within a Helm HTTP repository the source
                 points to. A single Helm repository hosts many charts; the chart name
                 selects one.
        admiral.source.v1.ListSourceVersionsRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source to query versions for (UUID).
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of versions to return. Defaults to 50.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token for fetching additional versions.
            title: ListSourceVersionsRequest
            additionalProperties: false
            description: ListSourceVersionsRequest queries available versions for a source.
        admiral.source.v1.ListSourceVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.source.v1.SourceVersion'
                    title: versions
                    description: Available versions, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListSourceVersionsResponse
            additionalProperties: false
            description: ListSourceVersionsResponse contains available versions from the external system.
        admiral.source.v1.ListSourcesRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `name`: filter by source name.
                           - `type`: filter by source type (GIT, TERRAFORM, HELM, OCI, HTTP).
                           - `catalog`: filter by catalog status (true/false).
                           - `labels.key`: filter by label key.

                         Example: `field['type'] = 'TERRAFORM' AND field['catalog'] = 'true'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of sources to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListSourcesRequest
            additionalProperties: false
            description: ListSourcesRequest contains pagination and filter parameters.
        admiral.source.v1.ListSourcesResponse:
            type: object
            properties:
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.source.v1.Source'
                    title: sources
                    description: The list of sources.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListSourcesResponse
            additionalProperties: false
            description: ListSourcesResponse contains a page of sources.
        admiral.source.v1.Source:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the source (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "corporate-rds", "nginx-chart").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the source's purpose
                         (e.g., "Corporate-approved RDS module with encryption and backups").
                type:
                    title: type
                    description: The kind of artifact and fetch protocol.
                    $ref: '#/components/schemas/admiral.source.v1.SourceType'
                url:
                    type: string
                    title: url
                    minLength: 1
                    description: |-
                        Base URL for the source. The meaning varies by source type:
                           - GIT: Git repo URL (https:// or git@host:...)
                           - TERRAFORM: registry hostname (e.g., "registry.terraform.io")
                           - HELM: chart repo URL (e.g., "https://charts.bitnami.com/bitnami")
                           - OCI: OCI repository URL (e.g., "oci://ghcr.io/myorg/charts/my-app")
                           - HTTP: full HTTP(S) URL to the archive (tar/zip). Covers plain
                             HTTP hosts and presigned S3/GCS/Azure Blob URLs.
                credential_id:
                    type:
                        - string
                        - "null"
                    title: credential_id
                    format: uuid
                    description: |-
                        Reference to the credential providing authentication for this source (UUID).
                         Optional. Null for public sources that require no authentication
                         (e.g., public Terraform registry, public Helm repos).
                catalog:
                    type: boolean
                    title: catalog
                    description: |-
                        Whether this source is a curated catalog entry. Catalog sources are managed
                         by platform engineers and may be the only sources available to developers
                         if the organization enforces catalog-only policy.
                source_config:
                    title: source_config
                    description: |-
                        Type-specific configuration. Only set for source types whose location is
                         not fully expressed by `url` alone (currently TERRAFORM and HELM, which
                         both host multiple artifacts and need a selector). Other source types
                         (GIT, OCI, HTTP) carry all location information in `url`.
                    $ref: '#/components/schemas/admiral.source.v1.SourceConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering sources
                         (e.g., `{"team": "platform", "category": "database"}`).
                last_test_status:
                    oneOf:
                        - $ref: '#/components/schemas/admiral.source.v1.SourceTestStatus'
                        - type: "null"
                    title: last_test_status
                    description: |-
                        Outcome of the most recent TestSource invocation. Reflects whether the
                         attached credential successfully authenticated against `url` the last time
                         a test was run. Absent if the source has never been tested.
                last_test_error:
                    type: string
                    title: last_test_error
                    description: |-
                        Human-readable error message from the most recent failed TestSource.
                         Empty when `last_test_status` is SUCCESS or unset.
                last_tested_at:
                    title: last_tested_at
                    description: |-
                        When TestSource was last invoked against this source. Absent if never
                         tested.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                credential_name:
                    type: string
                    title: credential_name
                    description: |-
                        Display name of the attached credential. Denormalized for display.
                         Empty when `credential_id` is unset (public sources). Read-only;
                         ignored on writes.
                created_by:
                    title: created_by
                    description: The user or agent who created this source (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the source was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the source was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Source
            additionalProperties: false
            description: |-
                Source represents a fetchable artifact definition: a pointer to an external
                 module, chart, or manifest set that Admiral can fetch, inspect, and render
                 into deployment snapshots.

                 Sources are tenant-scoped and optionally marked as catalog entries (curated,
                 pre-approved artifacts managed by platform engineers).
            example:
                id: "f6a7b8c9-0123-4def-5678-901234567890"
                name: "nginx-ingress"
                description: "NGINX Ingress Controller Helm chart from the official repository."
                type: "SOURCE_TYPE_HELM_REPOSITORY"
                url: "https://kubernetes.github.io/ingress-nginx"
                catalog: true
                labels:
                    category: "networking"
                    team: "platform"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-08-01T12:00:00Z"
                updated_at: "2025-10-20T09:00:00Z"
        admiral.source.v1.Source.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.source.v1.SourceConfig:
            type: object
            oneOf:
                - type: object
                  properties:
                    helm:
                        title: helm
                        description: Helm HTTP repository config (for SOURCE_TYPE_HELM).
                        $ref: '#/components/schemas/admiral.source.v1.HelmConfig'
                  title: helm
                  required:
                    - helm
                - type: object
                  properties:
                    terraform:
                        title: terraform
                        description: Terraform Registry Protocol config (for SOURCE_TYPE_TERRAFORM).
                        $ref: '#/components/schemas/admiral.source.v1.TerraformConfig'
                  title: terraform
                  required:
                    - terraform
            title: SourceConfig
            additionalProperties: false
            description: |-
                SourceConfig is the type-specific configuration attached to a Source. Only
                 source types whose location is not fully expressed by `url` alone (TERRAFORM,
                 HELM) populate a variant. Source types whose URL is self-contained (GIT, OCI,
                 HTTP) leave this message unset.
        admiral.source.v1.SourceTestStatus:
            type: string
            title: SourceTestStatus
            enum:
                - SOURCE_TEST_STATUS_UNSPECIFIED
                - SOURCE_TEST_STATUS_SUCCESS
                - SOURCE_TEST_STATUS_FAILURE
            description: SourceTestStatus reports the outcome of the last TestSource invocation.
        admiral.source.v1.SourceType:
            type: string
            title: SourceType
            enum:
                - SOURCE_TYPE_UNSPECIFIED
                - SOURCE_TYPE_GIT
                - SOURCE_TYPE_TERRAFORM
                - SOURCE_TYPE_HELM
                - SOURCE_TYPE_OCI
                - SOURCE_TYPE_HTTP
            description: |-
                SourceType identifies the fetch protocol: how Admiral's Fetcher layer
                 retrieves content from the source URL. Types are carved by wire protocol,
                 not by content semantics. "This is a Terraform module" vs "this is a Helm
                 chart" is a Module/Component concern, not a Source concern.
        admiral.source.v1.SourceVersion:
            type: object
            properties:
                version:
                    type: string
                    title: version
                    description: |-
                        Version identifier. For registry sources, this is a semver string
                         (e.g., "1.2.3"). For Git sources, this is a tag name (e.g., "v1.2.3").
                         For OCI, this is a tag.
                published_at:
                    title: published_at
                    description: |-
                        When this version was published or tagged. May not be available for all
                         source types.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                description:
                    type: string
                    title: description
                    description: |-
                        Optional description or release notes for this version. Typically only
                         available from registry sources.
            title: SourceVersion
            additionalProperties: false
            description: |-
                SourceVersion represents an available version of a source artifact, as
                 reported by the external system (registry, repository, Git tags).
        admiral.source.v1.TerraformConfig:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    minLength: 1
                    description: Module namespace in the registry (e.g., "hashicorp", "myorg").
                module_name:
                    type: string
                    title: module_name
                    minLength: 1
                    description: Module name in the registry (e.g., "consul", "rds").
                system:
                    type: string
                    title: system
                    minLength: 1
                    description: Target system / provider (e.g., "aws", "azurerm", "google").
            title: TerraformConfig
            additionalProperties: false
            description: TerraformConfig identifies a module within a Terraform registry.
        admiral.source.v1.TestSourceRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source to test (UUID).
            title: TestSourceRequest
            additionalProperties: false
            description: TestSourceRequest identifies a source to test.
        admiral.source.v1.TestSourceResponse:
            type: object
            properties:
                status:
                    title: status
                    description: The outcome of the test.
                    $ref: '#/components/schemas/admiral.source.v1.SourceTestStatus'
                error:
                    type: string
                    title: error
                    description: Human-readable error message when `status` is FAILURE. Empty on success.
                source:
                    title: source
                    description: The source with test status fields refreshed.
                    $ref: '#/components/schemas/admiral.source.v1.Source'
            title: TestSourceResponse
            additionalProperties: false
            description: |-
                TestSourceResponse reports the outcome of the test against the external
                 system. The same outcome is persisted on the Source (`last_test_status`,
                 `last_test_error`, `last_tested_at`).
        admiral.source.v1.UpdateSourceRequest:
            type: object
            properties:
                source:
                    title: source
                    description: |-
                        The source with updated fields. Only fields specified in `update_mask`
                         are updated.
                    $ref: '#/components/schemas/admiral.source.v1.Source'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. If unset, all mutable fields are updated.
                         Supported fields: `name`, `description`, `url`, `credential_id`, `catalog`,
                         `source_config`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateSourceRequest
            required:
                - source
            additionalProperties: false
            description: UpdateSourceRequest contains the source fields to update.
        admiral.source.v1.UpdateSourceResponse:
            type: object
            properties:
                source:
                    title: source
                    description: The updated source.
                    $ref: '#/components/schemas/admiral.source.v1.Source'
            title: UpdateSourceResponse
            additionalProperties: false
            description: UpdateSourceResponse contains the updated source.
        admiral.state.v1.DeleteStateRequest:
            type: object
            properties:
                state_id:
                    type: string
                    title: state_id
                    format: uuid
                    description: |-
                        The unique identifier of the state record to delete (UUID).
                         Fails if the state is currently locked. Force-unlock first.
            title: DeleteStateRequest
            additionalProperties: false
            description: DeleteStateRequest identifies a state record to permanently delete.
        admiral.state.v1.DeleteStateResponse:
            type: object
            title: DeleteStateResponse
            additionalProperties: false
            description: DeleteStateResponse is empty on success.
        admiral.state.v1.ForceUnlockStateRequest:
            type: object
            properties:
                state_id:
                    type: string
                    title: state_id
                    format: uuid
                    description: The state record to force-unlock (UUID).
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    description: |-
                        Reason for force-unlocking (audited). Recommended to provide context
                         for why the lock is being broken (e.g., "runner crashed during apply").
            title: ForceUnlockStateRequest
            additionalProperties: false
            description: ForceUnlockStateRequest identifies a state to force-unlock.
        admiral.state.v1.ForceUnlockStateResponse:
            type: object
            title: ForceUnlockStateResponse
            additionalProperties: false
            description: ForceUnlockStateResponse confirms the lock was forcefully released.
        admiral.state.v1.GetCurrentStateRequest:
            type: object
            properties:
                state_id:
                    type: string
                    title: state_id
                    format: uuid
                    description: The unique identifier of the state record (UUID).
            title: GetCurrentStateRequest
            additionalProperties: false
            description: GetCurrentStateRequest identifies a state record to retrieve.
        admiral.state.v1.GetCurrentStateResponse:
            type: object
            properties:
                state:
                    title: state
                    description: The state record including current data and any active lock.
                    $ref: '#/components/schemas/admiral.state.v1.State'
            title: GetCurrentStateResponse
            additionalProperties: false
            description: |-
                GetCurrentStateResponse contains the state record with current data and
                 lock info.
        admiral.state.v1.GetStateVersionRequest:
            type: object
            properties:
                state_id:
                    type: string
                    title: state_id
                    format: uuid
                    description: The state record (UUID).
                serial:
                    type:
                        - integer
                        - string
                    title: serial
                    format: int64
                    description: The serial number of the version to retrieve.
            title: GetStateVersionRequest
            additionalProperties: false
            description: GetStateVersionRequest identifies a specific historical state version.
        admiral.state.v1.GetStateVersionResponse:
            type: object
            properties:
                version:
                    title: version
                    description: The state version metadata.
                    $ref: '#/components/schemas/admiral.state.v1.StateVersion'
                data:
                    type: string
                    title: data
                    format: byte
                    description: The raw Terraform state data (JSON-encoded) at this serial.
            title: GetStateVersionResponse
            additionalProperties: false
            description: |-
                GetStateVersionResponse contains the full state data at a historical serial.
                 Returns both the version metadata and the raw data separately. The
                 StateVersion message intentionally omits data to keep ListStateVersions
                 lightweight.
        admiral.state.v1.ListStateVersionsRequest:
            type: object
            properties:
                state_id:
                    type: string
                    title: state_id
                    format: uuid
                    description: The state record to list versions for (UUID).
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of versions to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListStateVersionsRequest
            additionalProperties: false
            description: ListStateVersionsRequest contains pagination parameters for version history.
        admiral.state.v1.ListStateVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.state.v1.StateVersion'
                    title: versions
                    description: The list of state versions, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListStateVersionsResponse
            additionalProperties: false
            description: ListStateVersionsResponse contains a page of state version metadata.
        admiral.state.v1.ListStatesRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `component_id`: states for a specific component (UUID).
                           - `environment_id`: states for a specific environment (UUID).
                           - `application_id`: states for all components belonging to an
                             application (UUID). The server resolves the application's components
                             and returns states for all of them. Can be combined with
                             `environment_id`.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of states to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListStatesRequest
            additionalProperties: false
            description: ListStatesRequest contains pagination and filter parameters.
        admiral.state.v1.ListStatesResponse:
            type: object
            properties:
                states:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.state.v1.StateSummary'
                    title: states
                    description: |-
                        The list of state summaries (metadata only, no state data blob).
                         Use GetCurrentState to fetch full data for a specific record.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListStatesResponse
            additionalProperties: false
            description: ListStatesResponse contains a page of state metadata.
        admiral.state.v1.State:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the state record (UUID, server-generated).
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                    description: The infrastructure component this state belongs to (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this state is scoped to (UUID).
                serial:
                    type:
                        - integer
                        - string
                    title: serial
                    format: int64
                    description: |-
                        Terraform state serial number. Monotonically increasing with each
                         successful apply. Used for optimistic concurrency control.
                data:
                    type: string
                    title: data
                    format: byte
                    description: |-
                        The raw Terraform state data (JSON-encoded). This is the opaque
                         `.tfstate` blob managed by Terraform. Can be several megabytes for
                         large workspaces.
                md5:
                    type: string
                    title: md5
                    description: |-
                        MD5 hash of the state data. Used by Terraform for integrity checks
                         and conditional updates.
                lineage:
                    type: string
                    title: lineage
                    description: |-
                        Terraform state lineage. A UUID generated on first init. All
                         subsequent writes must match this lineage to prevent cross-state
                         contamination.
                lock:
                    title: lock
                    description: Active lock on this state, if any. Absent when the state is unlocked.
                    $ref: '#/components/schemas/admiral.state.v1.StateLock'
                created_at:
                    title: created_at
                    description: When the state record was first created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the state data was last updated (last successful PushState).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: State
            additionalProperties: false
            description: |-
                State represents the full Terraform state for an infrastructure component
                 in a specific environment, including the raw state data blob. Each
                 component + environment combination has at most one state record. The
                 server creates the record on first PushState.

                 This message is returned by GetCurrentState. For list operations, see
                 StateSummary which omits the data blob.
        admiral.state.v1.StateLock:
            type: object
            properties:
                lock_id:
                    type: string
                    title: lock_id
                    format: uuid
                    description: Unique identifier for the lock (UUID, generated by Terraform/OpenTofu).
                operation:
                    type: string
                    title: operation
                    description: |-
                        The Terraform operation holding the lock. Common values:
                           - "OperationTypePlan"
                           - "OperationTypeApply"
                         This value is set by the Terraform client and is informational only.
                who:
                    type: string
                    title: who
                    description: |-
                        Identifier of who holds the lock. Populated by Terraform; typically
                         the format "username@hostname" (e.g., "deploy@prod-runner-01").
                         This field is informational only; its format is controlled by Terraform.
                version:
                    type: string
                    title: version
                    description: |-
                        Terraform/OpenTofu version string of the client holding the lock
                         (e.g., "1.7.5").
                acquired_at:
                    title: acquired_at
                    description: When the lock was acquired.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: StateLock
            additionalProperties: false
            description: |-
                StateLock represents an exclusive lock on a state record. Terraform acquires
                 locks before plan/apply to prevent concurrent modifications. The lock_id is
                 generated by Terraform (as a UUID) and included in all lock/unlock requests.
        admiral.state.v1.StateSummary:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the state record (UUID).
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                    description: The infrastructure component this state belongs to (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this state is scoped to (UUID).
                serial:
                    type:
                        - integer
                        - string
                    title: serial
                    format: int64
                    description: Terraform state serial number.
                md5:
                    type: string
                    title: md5
                    description: MD5 hash of the current state data.
                lineage:
                    type: string
                    title: lineage
                    description: Terraform state lineage.
                size_bytes:
                    type:
                        - integer
                        - string
                    title: size_bytes
                    format: int64
                    description: Size of the current state data in bytes.
                lock:
                    title: lock
                    description: Active lock on this state, if any. Absent when the state is unlocked.
                    $ref: '#/components/schemas/admiral.state.v1.StateLock'
                created_at:
                    title: created_at
                    description: When the state record was first created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the state data was last updated (last successful PushState).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: StateSummary
            additionalProperties: false
            description: |-
                StateSummary contains state metadata without the raw data blob. Used in
                 ListStates to keep list responses lightweight. Use GetCurrentState to
                 fetch the full state data for a specific record.
        admiral.state.v1.StateVersion:
            type: object
            properties:
                serial:
                    type:
                        - integer
                        - string
                    title: serial
                    format: int64
                    description: Terraform state serial number for this version.
                md5:
                    type: string
                    title: md5
                    description: MD5 hash of the state data at this version.
                lineage:
                    type: string
                    title: lineage
                    description: Terraform state lineage.
                size_bytes:
                    type:
                        - integer
                        - string
                    title: size_bytes
                    format: int64
                    description: Size of the state data in bytes.
                job_id:
                    type:
                        - string
                        - "null"
                    title: job_id
                    format: uuid
                    description: |-
                        The job that produced this state version (UUID). Absent for state that
                         was written outside the normal job lifecycle. For example, state
                         uploaded directly via an admin migration tool, or state that existed
                         before Admiral began managing the component.
                created_at:
                    title: created_at
                    description: When this state version was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: StateVersion
            additionalProperties: false
            description: |-
                StateVersion contains metadata about a historical state version. Used in
                 ListStateVersions to provide version history without the full state data
                 blob.
        admiral.user.v1.CreatePersonalAccessTokenRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the token (e.g., "postman-testing").
                         Must be unique per user within the tenant. Lowercase alphanumeric and
                         hyphens only.
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        The scopes to grant this token. Must be valid scopes allowed for PATs.
                         The server enforces that issued scopes are a subset of the caller's own
                         scopes. A token cannot grant more access than the user holds.
                expires_at:
                    title: expires_at
                    description: |-
                        Optional expiration time. If unset, the token does not expire.
                         Tenant policies may enforce a maximum lifetime.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: CreatePersonalAccessTokenRequest
            additionalProperties: false
            description: CreatePersonalAccessTokenRequest contains the parameters for creating a new PAT.
        admiral.user.v1.CreatePersonalAccessTokenResponse:
            type: object
            properties:
                access_token:
                    title: access_token
                    description: The created token metadata.
                    $ref: '#/components/schemas/admiral.common.v1.AccessToken'
                plain_text_token:
                    type: string
                    title: plain_text_token
                    description: |-
                        The raw token secret (e.g., "adm_pat_7kH3mNqR2xFb..."). This value is
                         shown exactly once and cannot be retrieved again. Store it securely.
            title: CreatePersonalAccessTokenResponse
            additionalProperties: false
            description: CreatePersonalAccessTokenResponse contains the newly created PAT.
        admiral.user.v1.GetMeRequest:
            type: object
            title: GetMeRequest
            additionalProperties: false
            description: |-
                GetMeRequest is the request message for GetMe.
                 No parameters are required as the user is identified by the auth token.
        admiral.user.v1.GetMeResponse:
            type: object
            properties:
                user:
                    title: user
                    description: The user profile.
                    $ref: '#/components/schemas/admiral.user.v1.User'
            title: GetMeResponse
            additionalProperties: false
            description: GetMeResponse contains the authenticated user's profile.
        admiral.user.v1.GetPersonalAccessTokenRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the token (UUID).
            title: GetPersonalAccessTokenRequest
            additionalProperties: false
            description: GetPersonalAccessTokenRequest identifies a PAT to retrieve.
        admiral.user.v1.GetPersonalAccessTokenResponse:
            type: object
            properties:
                access_token:
                    title: access_token
                    description: The token metadata. The token secret is never included.
                    $ref: '#/components/schemas/admiral.common.v1.AccessToken'
            title: GetPersonalAccessTokenResponse
            additionalProperties: false
            description: GetPersonalAccessTokenResponse contains the requested PAT metadata.
        admiral.user.v1.GetUserRequest:
            type: object
            properties:
                user_id:
                    type: string
                    title: user_id
                    format: uuid
                    description: The unique identifier of the user (UUID).
            title: GetUserRequest
            additionalProperties: false
            description: GetUserRequest identifies a user to retrieve by ID.
        admiral.user.v1.GetUserResponse:
            type: object
            properties:
                user:
                    title: user
                    description: The user profile.
                    $ref: '#/components/schemas/admiral.user.v1.User'
            title: GetUserResponse
            additionalProperties: false
            description: GetUserResponse contains the requested user's profile.
        admiral.user.v1.ListPersonalAccessTokensRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by token name.
                           - `status`: filter by token status (ACTIVE, REVOKED, EXPIRED).

                         Example: `field['status'] = 'ACTIVE'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of tokens to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListPersonalAccessTokensRequest
            additionalProperties: false
            description: ListPersonalAccessTokensRequest contains pagination and filter parameters.
        admiral.user.v1.ListPersonalAccessTokensResponse:
            type: object
            properties:
                access_tokens:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.common.v1.AccessToken'
                    title: access_tokens
                    description: The list of tokens. Token secrets are never included.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListPersonalAccessTokensResponse
            additionalProperties: false
            description: ListPersonalAccessTokensResponse contains a page of PAT metadata.
        admiral.user.v1.RevokePersonalAccessTokenRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the token to revoke (UUID).
            title: RevokePersonalAccessTokenRequest
            additionalProperties: false
            description: RevokePersonalAccessTokenRequest identifies a PAT to revoke.
        admiral.user.v1.RevokePersonalAccessTokenResponse:
            type: object
            properties:
                access_token:
                    title: access_token
                    description: The token metadata with updated status.
                    $ref: '#/components/schemas/admiral.common.v1.AccessToken'
            title: RevokePersonalAccessTokenResponse
            additionalProperties: false
            description: RevokePersonalAccessTokenResponse contains the revoked PAT metadata.
        admiral.user.v1.UpdatePersonalAccessTokenRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the token to update (UUID).
                name:
                    type:
                        - string
                        - "null"
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        New name for the token. Must follow the same naming rules as creation.
                         Omit to leave the name unchanged.
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        New scopes for the token. Replaces all existing scopes.
                         The server enforces that issued scopes are a subset of the caller's own
                         scopes. A token cannot grant more access than the user holds.
                         Omit to leave scopes unchanged.
            title: UpdatePersonalAccessTokenRequest
            additionalProperties: false
            description: |-
                UpdatePersonalAccessTokenRequest contains the fields to update on a PAT.
                 Only provided fields are updated; omitted fields remain unchanged.
        admiral.user.v1.UpdatePersonalAccessTokenResponse:
            type: object
            properties:
                access_token:
                    title: access_token
                    description: The updated token metadata.
                    $ref: '#/components/schemas/admiral.common.v1.AccessToken'
            title: UpdatePersonalAccessTokenResponse
            additionalProperties: false
            description: UpdatePersonalAccessTokenResponse contains the updated PAT metadata.
        admiral.user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the user (UUID).
                email:
                    type: string
                    title: email
                    description: User's email address.
                email_verified:
                    type: boolean
                    title: email_verified
                    description: Whether the email has been verified by the IdP.
                display_name:
                    type:
                        - string
                        - "null"
                    title: display_name
                    description: User's display name for UI purposes.
                given_name:
                    type:
                        - string
                        - "null"
                    title: given_name
                    description: User's given (first) name.
                family_name:
                    type:
                        - string
                        - "null"
                    title: family_name
                    description: User's family (last) name.
                avatar_url:
                    type:
                        - string
                        - "null"
                    title: avatar_url
                    description: URL to the user's avatar image.
                created_at:
                    title: created_at
                    description: When the user was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the user was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: User
            additionalProperties: false
            description: User represents a user's profile information.
            example:
                id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                email: "alex.chen@example.com"
                display_name: "Alex Chen"
                given_name: "Alex"
                family_name: "Chen"
                avatar_url: "https://avatars.example.com/alex-chen.jpg"
                created_at: "2025-06-01T09:00:00Z"
                updated_at: "2025-11-15T11:00:00Z"
        admiral.variable.v1.Variable:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the variable (UUID).
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_.]{0,62}$
                    description: |-
                        The variable name. For user-created variables, must be a valid
                         environment variable identifier (e.g., "DATABASE_URL", "API_KEY").
                         Infrastructure output variables use dot-namespaced keys
                         (e.g., "vpc.vpc_id", "database.endpoint") and are system-managed.
                value:
                    type: string
                    title: value
                    description: |-
                        The variable value. Always stored as a string; use `type` to indicate
                         how to interpret it. Masked or empty for sensitive variables in responses.

                         For COMPLEX type, this is a JSON-encoded string (e.g., '["a","b"]' or
                         '{"key":"value"}'). The rendering engine converts it to the target format
                         (HCL for Terraform, YAML for Helm).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: Whether the variable value is encrypted at rest and masked in API responses.
                type:
                    title: type
                    description: |-
                        How the value should be interpreted by the rendering engine and displayed
                         in the UI. Defaults to STRING if not specified.
                    $ref: '#/components/schemas/admiral.variable.v1.VariableType'
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the variable's purpose (e.g., "Maximum replica
                         count for production scaling" or "RDS instance class per environment").
                application_id:
                    type:
                        - string
                        - "null"
                    title: application_id
                    format: uuid
                    description: |-
                        The application this variable belongs to (UUID). Always set; variables
                         are env-scoped and inherit their app from the environment.
                environment_id:
                    type:
                        - string
                        - "null"
                    title: environment_id
                    format: uuid
                    description: |-
                        The environment this variable is scoped to (UUID). Always set; variables
                         are env-scoped.
                source:
                    title: source
                    description: |-
                        How the variable was created. USER for change-set-managed variables,
                         INFRASTRUCTURE for variables produced by engine output capture (Terraform
                         or OpenTofu). Server-populated.
                    $ref: '#/components/schemas/admiral.variable.v1.VariableSource'
                created_by:
                    title: created_by
                    description: The user or agent who created this variable (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the variable was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the variable was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Variable
            additionalProperties: false
            description: |-
                Variable represents a configuration key-value pair scoped to a specific
                 environment within an application. Variables are user-managed configuration
                 values, distinct from infrastructure outputs which are system-managed values
                 produced by apply (e.g., Terraform outputs, namespaced as
                 `<component_name>.<output_name>`).

                 Variables are mutated exclusively through change sets (ChangeSetAPI.SetVariable
                 / RemoveVariable). They are read via EnvironmentAPI.ListEnvironmentVariables.

                 Sensitive variables have their values masked in API responses.
            example:
                id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                key: "DATABASE_URL"
                value: "postgresql://db.internal:5432/inventory"
                sensitive: false
                type: "VARIABLE_TYPE_STRING"
                scope: "VARIABLE_SCOPE_ENVIRONMENT"
                description: "Primary database connection string for the inventory service."
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-09-16T12:00:00Z"
                updated_at: "2025-10-30T15:00:00Z"
        admiral.variable.v1.VariableSource:
            type: string
            title: VariableSource
            enum:
                - VARIABLE_SOURCE_UNSPECIFIED
                - VARIABLE_SOURCE_USER
                - VARIABLE_SOURCE_INFRASTRUCTURE
            description: VariableSource indicates how the variable was created.
        admiral.variable.v1.VariableType:
            type: string
            title: VariableType
            enum:
                - VARIABLE_TYPE_UNSPECIFIED
                - VARIABLE_TYPE_STRING
                - VARIABLE_TYPE_NUMBER
                - VARIABLE_TYPE_BOOLEAN
                - VARIABLE_TYPE_COMPLEX
            description: |-
                VariableType indicates how the variable value should be interpreted by the
                 rendering engine and displayed in the UI. The value is always stored as a
                 string regardless of type.
        google.protobuf.Duration:
            type: string
            format: duration
            description: |-
                A Duration represents a signed, fixed-length span of time represented
                 as a count of seconds and fractions of seconds at nanosecond
                 resolution. It is independent of any calendar and concepts like "day"
                 or "month". It is related to Timestamp in that the difference between
                 two Timestamp values is a Duration and it can be added or subtracted
                 from a Timestamp. Range is approximately +-10,000 years.

                 # Examples

                 Example 1: Compute Duration from two Timestamps in pseudo code.

                     Timestamp start = ...;
                     Timestamp end = ...;
                     Duration duration = ...;

                     duration.seconds = end.seconds - start.seconds;
                     duration.nanos = end.nanos - start.nanos;

                     if (duration.seconds < 0 && duration.nanos > 0) {
                       duration.seconds += 1;
                       duration.nanos -= 1000000000;
                     } else if (duration.seconds > 0 && duration.nanos < 0) {
                       duration.seconds -= 1;
                       duration.nanos += 1000000000;
                     }

                 Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

                     Timestamp start = ...;
                     Duration duration = ...;
                     Timestamp end = ...;

                     end.seconds = start.seconds + duration.seconds;
                     end.nanos = start.nanos + duration.nanos;

                     if (end.nanos < 0) {
                       end.seconds -= 1;
                       end.nanos += 1000000000;
                     } else if (end.nanos >= 1000000000) {
                       end.seconds += 1;
                       end.nanos -= 1000000000;
                     }

                 Example 3: Compute Duration from datetime.timedelta in Python.

                     td = datetime.timedelta(days=3, minutes=10)
                     duration = Duration()
                     duration.FromTimedelta(td)

                 # JSON Mapping

                 In JSON format, the Duration type is encoded as a string rather than an
                 object, where the string ends in the suffix "s" (indicating seconds) and
                 is preceded by the number of seconds, with nanoseconds expressed as
                 fractional seconds. For example, 3 seconds with 0 nanoseconds should be
                 encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
                 be expressed in JSON format as "3.000000001s", and 3 seconds and 1
                 microsecond should be expressed in JSON format as "3.000001s".
        google.protobuf.FieldMask:
            type: string
            description: |-
                `FieldMask` represents a set of symbolic field paths, for example:

                     paths: "f.a"
                     paths: "f.b.d"

                 Here `f` represents a field in some root message, `a` and `b`
                 fields in the message found in `f`, and `d` a field found in the
                 message in `f.b`.

                 Field masks are used to specify a subset of fields that should be
                 returned by a get operation or modified by an update operation.
                 Field masks also have a custom JSON encoding (see below).

                 # Field Masks in Projections

                 When used in the context of a projection, a response message or
                 sub-message is filtered by the API to only contain those fields as
                 specified in the mask. For example, if the mask in the previous
                 example is applied to a response message as follows:

                     f {
                       a : 22
                       b {
                         d : 1
                         x : 2
                       }
                       y : 13
                     }
                     z: 8

                 The result will not contain specific values for fields x,y and z
                 (their value will be set to the default, and omitted in proto text
                 output):


                     f {
                       a : 22
                       b {
                         d : 1
                       }
                     }

                 A repeated field is not allowed except at the last position of a
                 paths string.

                 If a FieldMask object is not present in a get operation, the
                 operation applies to all fields (as if a FieldMask of all fields
                 had been specified).

                 Note that a field mask does not necessarily apply to the
                 top-level response message. In case of a REST get operation, the
                 field mask applies directly to the response, but in case of a REST
                 list operation, the mask instead applies to each individual message
                 in the returned resource list. In case of a REST custom method,
                 other definitions may be used. Where the mask applies will be
                 clearly documented together with its declaration in the API.  In
                 any case, the effect on the returned resource/resources is required
                 behavior for APIs.

                 # Field Masks in Update Operations

                 A field mask in update operations specifies which fields of the
                 targeted resource are going to be updated. The API is required
                 to only change the values of the fields as specified in the mask
                 and leave the others untouched. If a resource is passed in to
                 describe the updated values, the API ignores the values of all
                 fields not covered by the mask.

                 If a repeated field is specified for an update operation, new values will
                 be appended to the existing repeated field in the target resource. Note that
                 a repeated field is only allowed in the last position of a `paths` string.

                 If a sub-message is specified in the last position of the field mask for an
                 update operation, then new value will be merged into the existing sub-message
                 in the target resource.

                 For example, given the target message:

                     f {
                       b {
                         d: 1
                         x: 2
                       }
                       c: [1]
                     }

                 And an update message:

                     f {
                       b {
                         d: 10
                       }
                       c: [2]
                     }

                 then if the field mask is:

                  paths: ["f.b", "f.c"]

                 then the result will be:

                     f {
                       b {
                         d: 10
                         x: 2
                       }
                       c: [1, 2]
                     }

                 An implementation may provide options to override this default behavior for
                 repeated and message fields.

                 In order to reset a field's value to the default, the field must
                 be in the mask and set to the default value in the provided resource.
                 Hence, in order to reset all fields of a resource, provide a default
                 instance of the resource and set all fields in the mask, or do
                 not provide a mask as described below.

                 If a field mask is not present on update, the operation applies to
                 all fields (as if a field mask of all fields has been specified).
                 Note that in the presence of schema evolution, this may mean that
                 fields the client does not know and has therefore not filled into
                 the request will be reset to their default. If this is unwanted
                 behavior, a specific service may require a client to always specify
                 a field mask, producing an error if not.

                 As with get operations, the location of the resource which
                 describes the updated values in the request message depends on the
                 operation kind. In any case, the effect of the field mask is
                 required to be honored by the API.

                 ## Considerations for HTTP REST

                 The HTTP kind of an update operation which uses a field mask must
                 be set to PATCH instead of PUT in order to satisfy HTTP semantics
                 (PUT must only be used for full updates).

                 # JSON Encoding of Field Masks

                 In JSON, a field mask is encoded as a single string where paths are
                 separated by a comma. Fields name in each path are converted
                 to/from lower-camel naming conventions.

                 As an example, consider the following message declarations:

                     message Profile {
                       User user = 1;
                       Photo photo = 2;
                     }
                     message User {
                       string display_name = 1;
                       string address = 2;
                     }

                 In proto a field mask for `Profile` may look as such:

                     mask {
                       paths: "user.display_name"
                       paths: "photo"
                     }

                 In JSON, the same mask is represented as below:

                     {
                       mask: "user.displayName,photo"
                     }

                 # Field Masks and Oneof Fields

                 Field masks treat fields in oneofs just as regular fields. Consider the
                 following message:

                     message SampleMessage {
                       oneof test_oneof {
                         string name = 4;
                         SubMessage sub_message = 9;
                       }
                     }

                 The field mask can be:

                     mask {
                       paths: "name"
                     }

                 Or:

                     mask {
                       paths: "sub_message"
                     }

                 Note that oneof type names ("test_oneof" in this case) cannot be used in
                 paths.

                 ## Field Mask Verification

                 The implementation of any API method which has a FieldMask type field in the
                 request should verify the included field paths, and return an
                 `INVALID_ARGUMENT` error if any path is unmappable.
        google.protobuf.Timestamp:
            type: string
            examples:
                - "2023-01-15T01:30:15.01Z"
                - "2024-12-25T12:00:00Z"
            format: date-time
            description: |-
                A Timestamp represents a point in time independent of any time zone or local
                 calendar, encoded as a count of seconds and fractions of seconds at
                 nanosecond resolution. The count is relative to an epoch at UTC midnight on
                 January 1, 1970, in the proleptic Gregorian calendar which extends the
                 Gregorian calendar backwards to year one.

                 All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
                 second table is needed for interpretation, using a [24-hour linear
                 smear](https://developers.google.com/time/smear).

                 The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
                 restricting to that range, we ensure that we can convert to and from [RFC
                 3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

                 # Examples

                 Example 1: Compute Timestamp from POSIX `time()`.

                     Timestamp timestamp;
                     timestamp.set_seconds(time(NULL));
                     timestamp.set_nanos(0);

                 Example 2: Compute Timestamp from POSIX `gettimeofday()`.

                     struct timeval tv;
                     gettimeofday(&tv, NULL);

                     Timestamp timestamp;
                     timestamp.set_seconds(tv.tv_sec);
                     timestamp.set_nanos(tv.tv_usec * 1000);

                 Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

                     FILETIME ft;
                     GetSystemTimeAsFileTime(&ft);
                     UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

                     // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
                     // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
                     Timestamp timestamp;
                     timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
                     timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

                 Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

                     long millis = System.currentTimeMillis();

                     Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                         .setNanos((int) ((millis % 1000) * 1000000)).build();

                 Example 5: Compute Timestamp from Java `Instant.now()`.

                     Instant now = Instant.now();

                     Timestamp timestamp =
                         Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                             .setNanos(now.getNano()).build();

                 Example 6: Compute Timestamp from current time in Python.

                     timestamp = Timestamp()
                     timestamp.GetCurrentTime()

                 # JSON Mapping

                 In JSON format, the Timestamp type is encoded as a string in the
                 [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
                 format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
                 where {year} is always expressed using four digits while {month}, {day},
                 {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
                 seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
                 are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
                 is required. A proto3 JSON serializer should always use UTC (as indicated by
                 "Z") when printing the Timestamp type and a proto3 JSON parser should be
                 able to accept both UTC and other timezones (as indicated by an offset).

                 For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
                 01:30 UTC on January 15, 2017.

                 In JavaScript, one can convert a Date object to this format using the
                 standard
                 [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
                 method. In Python, a standard `datetime.datetime` object can be converted
                 to this format using
                 [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
                 the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
                 the Joda Time's [`ISODateTimeFormat.dateTime()`](
                 http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
                 ) to obtain a formatter capable of generating timestamps in this format.
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: PAT
            description: >-
                Personal Access Token (PAT) or Service Access Token (SAT). Pass the token in the Authorization header: `Bearer adm_pat_...`
security: [{bearerAuth: []}]
tags:
    - name: Applications
      description: Manage application lifecycle and configuration.
    - name: Clusters
      description: Manage Kubernetes clusters, service access tokens, and workload telemetry.
    - name: Cluster Tokens
      description: Manage service access tokens for cluster agents.
    - name: Cluster Workloads
      description: View workloads running on registered clusters.
    - name: Credentials
      description: Manage credentials for accessing external systems.
    - name: Modules
      description: Manage module definitions and resolve module content.
    - name: ChangeSets
      description: 'Manage change sets: scoped, isolated proposals to mutate the deployed state of an application within a single environment.'
    - name: Runs
      description: Manage runs across components in an environment.
    - name: Run Revisions
      description: Retrieve and retry per-component revisions within a run.
    - name: Environments
      description: Manage target environments for runs.
    - name: Sources
      description: Manage source definitions for external artifacts.
    - name: User
      description: Retrieve user profiles.
    - name: Personal Access Tokens
      description: Manage personal access tokens for API authentication.
servers:
    - url: "{baseUrl}"
      description: Admiral API server
      variables:
        baseUrl:

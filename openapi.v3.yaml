                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
            title: OrphanComponent
            required:
                - component
            additionalProperties: false
            description: OrphanComponent stops managing a live component without tearing it down.
        admiral.api.changeset.v1.PathDiff:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                display_path:
                    type: string
                    title: display_path
                before_present:
                    type: boolean
                    title: before_present
                before_json:
                    type: string
                    title: before_json
                after_present:
                    type: boolean
                    title: after_present
                after_json:
                    type: string
                    title: after_json
            title: PathDiff
            additionalProperties: false
            description: 'PathDiff is one changed path: absent, null or a value on each side.'
        admiral.api.changeset.v1.PathSegment:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - key
            anyOf:
                - type: object
                  properties:
                    key:
                        type: string
                        title: key
                        maxLength: 256
                        minLength: 1
                  title: key
            unevaluatedProperties: false
            title: PathSegment
            description: PathSegment is one step into a values tree. Only map keys exist.
        admiral.api.changeset.v1.Prepare:
            type: object
            properties:
                revision:
                    type: integer
                    title: revision
                    format: int32
                    description: 'The revision prepared: its number and its `rev-` id.'
                revision_id:
                    type: string
                    title: revision_id
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Prepare.Status'
                    title: status
                artifact_digest:
                    type: string
                    title: artifact_digest
                    description: '`sha256:<hex>` of the artifact; set once STATUS_PREPARED.'
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Finding'
                    title: findings
                error:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.PrepareError'
                    title: error
                    description: Set when STATUS_FAILED.
                requested_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: requested_by
                requested_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: requested_at
                finished_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: finished_at
                attempts:
                    type: integer
                    title: attempts
                    format: int32
            title: Prepare
            additionalProperties: false
            description: Prepare is a revision's render into its artifact.
        admiral.api.changeset.v1.Prepare.Status:
            type: string
            title: Status
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_QUEUED
                - STATUS_RUNNING
                - STATUS_PREPARED
                - STATUS_FAILED
                - STATUS_SUPERSEDED
            description: Status is where a revision's prepare stands.
        admiral.api.changeset.v1.PrepareError:
            type: object
            properties:
                class:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.PrepareError.Class'
                    title: class
                component:
                    type: string
                    title: component
                    description: Empty when the failure is not one component's.
                message:
                    type: string
                    title: message
            title: PrepareError
            additionalProperties: false
            description: PrepareError is why a prepare failed.
        admiral.api.changeset.v1.PrepareError.Class:
            type: string
            title: Class
            enum:
                - CLASS_UNSPECIFIED
                - CLASS_INPUT
                - CLASS_INTERNAL
            description: Class says whose problem it is, and so whether asking again can help.
        admiral.api.changeset.v1.RebaseChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                if_revision:
                    type:
                        - integer
                        - "null"
                    title: if_revision
                    minimum: 0
                    format: int32
                    description: When set, refused unless the head is this revision.
                resolutions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Resolution'
                    title: resolutions
                    maxItems: 1000
                    description: One for each conflict GetChangeSet lists.
            title: RebaseChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.RebaseChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revision
                warnings:
                    type: array
                    items:
                        type: string
                    title: warnings
            title: RebaseChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.RegistryRef:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: The component's name in the registry.
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: A tag or a `sha256:` digest.
            title: RegistryRef
            required:
                - name
                - reference
            additionalProperties: false
            description: |-
                RegistryRef is a registry component and a tag or digest in it. A tag is
                 resolved when the edit is made; the change set keeps the digest and the
                 reference as given (VersionRef).
        admiral.api.changeset.v1.RemoveComponent:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
            title: RemoveComponent
            required:
                - component
            additionalProperties: false
            description: |-
                RemoveComponent drops a component this change set adds, or destroys a live
                 one.
        admiral.api.changeset.v1.ReplaceValues:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                tree_json:
                    type: string
                    title: tree_json
                    maxLength: 1048576
                    minLength: 2
                    description: A JSON object.
            title: ReplaceValues
            required:
                - component
                - tree_json
            additionalProperties: false
            description: |-
                ReplaceValues makes a component's values exactly this tree: an upload.
                 The request must carry `if_revision`, the head the tree was downloaded at.
        admiral.api.changeset.v1.Resolution:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Conflict.Kind'
                    not:
                        enum:
                            - KIND_UNSPECIFIED
                    title: kind
                    description: |
                        enum.defined_only = true
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                keep:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Resolution.Keep'
                    not:
                        enum:
                            - KEEP_UNSPECIFIED
                    title: keep
                    description: |
                        enum.defined_only = true
            title: Resolution
            required:
                - component
            additionalProperties: false
            description: |
                Resolution settles one Conflict, matched by component, kind and path.
                resolution.removed // a removed component can only keep the environment
        admiral.api.changeset.v1.Resolution.Keep:
            type: string
            title: Keep
            enum:
                - KEEP_UNSPECIFIED
                - KEEP_CHANGE_SET
                - KEEP_ENVIRONMENT
        admiral.api.changeset.v1.RevertChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                    description: |-
                        The new change set's title and description. An empty title becomes
                         "Revert" and the reverted change set's title.
            title: RevertChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.RevertChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
            title: RevertChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^rev-[0-9a-z]+$
                    description: |-
                        `rev-` and twelve base36 characters. `number` is the human ordinal
                         within its change set.
                    readOnly: true
                number:
                    type: integer
                    title: number
                    format: int32
                change_set_id:
                    type: string
                    title: change_set_id
                base_generation:
                    type: string
                    title: base_generation
                    format: int64
                    description: The environment's generation when the base was taken.
                cause:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision.Cause'
                    title: cause
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Violation'
                    title: violations
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Entry'
                    title: entries
                    description: Empty in a listing.
            title: Revision
            additionalProperties: false
        admiral.api.changeset.v1.Revision.Cause:
            type: string
            title: Cause
            enum:
                - CAUSE_UNSPECIFIED
                - CAUSE_EDIT
                - CAUSE_REBASE
            description: |-
                Cause is why a revision was cut: an edit, or a rebase onto the
                 environment as it now is.
        admiral.api.changeset.v1.SetDependsOn:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                depends_on:
                    type: array
                    items:
                        type: string
                        pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                    title: depends_on
                    maxItems: 32
                    uniqueItems: true
            title: SetDependsOn
            required:
                - component
            additionalProperties: false
            description: |-
                SetDependsOn replaces the components a component applies after. Empty
                 clears it. A cycle is refused.
        admiral.api.changeset.v1.SetSettings:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                settings:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ComponentSettings'
                    title: settings
            title: SetSettings
            required:
                - component
                - settings
            additionalProperties: false
            description: |-
                SetSettings replaces how a component is deployed. FAILED_PRECONDITION
                 when the settings are for another kind than the component's.
        admiral.api.changeset.v1.SetValue:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
                value_json:
                    type: string
                    title: value_json
                    maxLength: 1048576
                    minLength: 1
                    description: |-
                        JSON text. `null` clears a chart default, as a values file's
                         `key: null` does; UnsetValue makes the key absent so the default applies.
            title: SetValue
            required:
                - component
                - value_json
            additionalProperties: false
            description: |-
                SetValue writes a value at a path, creating maps on the way, as
                 `helm --set` does. A map value replaces what was there.
        admiral.api.changeset.v1.SetVersion:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: A tag or a `sha256:` digest.
            title: SetVersion
            required:
                - component
                - reference
            additionalProperties: false
            description: |-
                SetVersion moves a component to another version of the same registry
                 component. The reference resolves to a digest when the edit is made.
        admiral.api.changeset.v1.UnsetValue:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
            title: UnsetValue
            required:
                - component
            additionalProperties: false
            description: UnsetValue removes a path, so the default applies.
        admiral.api.changeset.v1.UpdateChangeSetRequest:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                    description: |-
                        The change set with updated fields. Its `id` identifies it; only fields
                         named in `update_mask` are applied.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        The fields to update. Optional; if omitted, all populated fields are
                         updated. Supported fields: `title`, `description`.

                         `environment_id` is not updatable: a change set never moves between
                         environments.
            title: UpdateChangeSetRequest
            required:
                - change_set
            additionalProperties: false
        admiral.api.changeset.v1.UpdateChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
            title: UpdateChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.ValueOp:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                op:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ValueOp.Kind'
                    title: op
                value_json:
                    type: string
                    title: value_json
                    description: JSON text; empty unless op is KIND_SET.
                from_present:
                    type: boolean
                    title: from_present
                    description: Whether the base had the key; a null there is present.
                from_value_json:
                    type: string
                    title: from_value_json
                    description: JSON text; empty when from_present is false.
            title: ValueOp
            additionalProperties: false
            description: ValueOp is one change at one path, with what the base held there.
        admiral.api.changeset.v1.ValueOp.Kind:
            type: string
            title: Kind
            enum:
                - KIND_UNSPECIFIED
                - KIND_SET
                - KIND_UNSET
        admiral.api.changeset.v1.ValueSource:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                origin:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ValueSource.Origin'
                    title: origin
            title: ValueSource
            additionalProperties: false
            description: ValueSource says where one value in an effective tree came from.
        admiral.api.changeset.v1.ValueSource.Origin:
            type: string
            title: Origin
            enum:
                - ORIGIN_UNSPECIFIED
                - ORIGIN_COMPONENT_DEFAULT
                - ORIGIN_BASELINE
                - ORIGIN_ENVIRONMENT
                - ORIGIN_CHANGE_SET
            description: |-
                Origin is the layer a value came from, lowest first: each layer is laid
                 over the ones before it.
        admiral.api.changeset.v1.VersionRef:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                    description: The registry component.
                version_id:
                    type: string
                    title: version_id
                    pattern: ^ver-[0-9a-z]+$
                    description: The registry version.
                digest:
                    type: string
                    title: digest
                    description: '`sha256:<hex>` of the bundle.'
                reference:
                    type: string
                    title: reference
                    description: The tag or `sha256:` digest as given, such as `5.5.0` or `latest`.
            title: VersionRef
            additionalProperties: false
            description: |-
                VersionRef is one registry version, as a change set or an environment
                 holds it: the digest it resolved to, and the reference a person asked for.
                 A tag is resolved once, when the edit is made; if it moves later, nothing
                 changes until the version is set again.
        admiral.api.changeset.v1.Violation:
            type: object
            properties:
                component:
                    type: string
                    title: component
                path:
                    type: string
                    title: path
                    description: 'Display form: `image.tag`, `ingress."a.b"`.'
                message:
                    type: string
                    title: message
            title: Violation
            additionalProperties: false
            description: |-
                Violation is one way a component's values fail its version's
                 contract.
        admiral.api.credential.v1.AuthConfig:
            type: object
            anyOf:
                - type: object
                  properties:
                    basic_auth:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.BasicAuth'
                        title: basic_auth
                  title: basic_auth
                - type: object
                  properties:
                    bearer_token:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.BearerTokenAuth'
                        title: bearer_token
                  title: bearer_token
                - type: object
                  properties:
                    github_app:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.GitHubAppAuth'
                        title: github_app
                  title: github_app
                - type: object
                  properties:
                    ssh_key:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.SSHKeyAuth'
                        title: ssh_key
                  title: ssh_key
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - basic_auth
                        - required:
                            - bearer_token
                        - required:
                            - github_app
                        - required:
                            - ssh_key
                    - not:
                        oneOf:
                            - required:
                                - basic_auth
                            - required:
                                - bearer_token
                            - required:
                                - github_app
                            - required:
                                - ssh_key
            title: AuthConfig
            description: AuthConfig is the secret, one variant matching the credential's type.
        admiral.api.credential.v1.BasicAuth:
            type: object
            properties:
                username:
                    type: string
                    title: username
                    maxLength: 256
                    minLength: 1
                password:
                    type: string
                    title: password
                    maxLength: 4096
                    description: Write-only.
                    writeOnly: true
            title: BasicAuth
            additionalProperties: false
            description: |-
                BasicAuth is a username and password, or a username and a token that the
                 host takes as a password (a registry-scoped token, an app password).
        admiral.api.credential.v1.BearerTokenAuth:
            type: object
            properties:
                token:
                    type: string
                    title: token
                    maxLength: 4096
                    description: Write-only.
                    writeOnly: true
            title: BearerTokenAuth
            additionalProperties: false
            description: BearerTokenAuth is one token.
        admiral.api.credential.v1.CreateCredentialRequest:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
                    description: |-
                        The credential to create: `name`, `type`, `auth_config`, and optionally
                         `description`, `labels` and `allowed_hosts`. `type` and the populated
                         `auth_config` variant must agree.
            title: CreateCredentialRequest
            required:
                - credential
            additionalProperties: false
            description: CreateCredentialRequest registers a credential in the caller's tenant.
        admiral.api.credential.v1.CreateCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: CreateCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.Credential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^cred-[0-9a-z]+$
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Unique within the tenant.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential.Type'
                    title: type
                    description: (IMMUTABLE) Immutable after creation.
                auth_config:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                    title: auth_config
                    description: Write-only. Empty in every response.
                    writeOnly: true
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
                allowed_hosts:
                    type: array
                    items:
                        type: string
                        maxLength: 270
                        pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)*(:[0-9]{1,5})?$
                    title: allowed_hosts
                    maxItems: 32
                    uniqueItems: true
                    description: |-
                        Hosts this credential may be presented to, as a guard: empty means any
                         host its type fits; set means the platform refuses to present it
                         anywhere else, whatever it is attached to. Hostnames, optionally with
                         a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                         no path.
                last_used_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_used_at
                    description: |-
                        When a publish last decrypted this credential to present to a host,
                         whether or not the host accepted it. Updated at most every few minutes.
                         Absent if it has never been used.
                    readOnly: true
            title: Credential
            additionalProperties: false
            description: |-
                Credential is a registered credential's metadata. The secret is set
                 through `auth_config` and never read back; responses carry it empty.
        admiral.api.credential.v1.Credential.Type:
            type: string
            title: Type
            enum:
                - TYPE_UNSPECIFIED
                - TYPE_SSH_KEY
                - TYPE_BASIC_AUTH
                - TYPE_BEARER_TOKEN
                - TYPE_GITHUB_APP
            description: |-
                Type is the protocol family a credential is presented as. Each
                 fetch takes the families its protocol speaks: a module registry, an
                 archive and an OCI token take a bearer token; git over https, a Helm
                 repository and an OCI login take basic auth; git over ssh takes a key.
        admiral.api.credential.v1.DeleteCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    pattern: ^cred-[0-9a-z]+$
            title: DeleteCredentialRequest
            required:
                - credential_id
            additionalProperties: false
        admiral.api.credential.v1.DeleteCredentialResponse:
            type: object
            title: DeleteCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.GetCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    pattern: ^cred-[0-9a-z]+$
            title: GetCredentialRequest
            required:
                - credential_id
            additionalProperties: false
        admiral.api.credential.v1.GetCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: GetCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.GitHubAppAuth:
            type: object
            properties:
                app_id:
                    exclusiveMinimum: 0
                    type: string
                    title: app_id
                    format: int64
                    description: The app's numeric id, from the app's settings page.
                installation_id:
                    exclusiveMinimum: 0
                    type: string
                    title: installation_id
                    format: int64
                    description: The installation's numeric id, from the installation's URL.
                private_key:
                    type: string
                    title: private_key
                    maxLength: 16384
                    description: The app's PEM-encoded RSA private key. Write-only.
                    writeOnly: true
                api_url:
                    type: string
                    title: api_url
                    maxLength: 512
                    format: uri
                    description: |-
                        The REST API base, for GitHub Enterprise Server:
                         `https://github.acme.example/api/v3`. Empty is `https://api.github.com`.
            title: GitHubAppAuth
            additionalProperties: false
            description: |-
                GitHubAppAuth identifies a GitHub App installation and holds the app's
                 private key, from which the platform mints installation tokens.
        admiral.api.credential.v1.ListCredentialsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by credential name.
                           - `type`: filter by credential type.
                           - `labels.key`: filter by label key.

                         Example: `field['type'] = 'TYPE_GITHUB_APP'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListCredentialsRequest
            additionalProperties: false
        admiral.api.credential.v1.ListCredentialsResponse:
            type: object
            properties:
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credentials
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListCredentialsResponse
            additionalProperties: false
        admiral.api.credential.v1.SSHKeyAuth:
            type: object
            properties:
                private_key:
                    type: string
                    title: private_key
                    maxLength: 16384
                    description: Write-only.
                    writeOnly: true
                passphrase:
                    type: string
                    title: passphrase
                    maxLength: 1024
                    description: Write-only.
                    writeOnly: true
            title: SSHKeyAuth
            additionalProperties: false
            description: SSHKeyAuth is a PEM-encoded private key and its passphrase, if any.
        admiral.api.credential.v1.UpdateCredentialRequest:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        Paths from `description`, `labels`, `allowed_hosts`, `auth_config`.
                         Empty means every updatable field the message carries.
            title: UpdateCredentialRequest
            required:
                - credential
            additionalProperties: false
        admiral.api.credential.v1.UpdateCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: UpdateCredentialResponse
            additionalProperties: false
        admiral.api.environment.v1.AgentAssignment:
            type: object
            anyOf:
                - type: object
                  properties:
                    kubernetes:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.environment.v1.KubernetesSettings'
                        title: kubernetes
                  title: kubernetes
            unevaluatedProperties: false
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                    description: |-
                        The agent. Its owner must have granted it to the organization, a team,
                         this application or this environment.
                id:
                    type: string
                    title: id
                    pattern: ^asg-[0-9a-z]+$
                    description: |-
                        `asg-` and twelve base36 characters, what a component's settings name to
                         run on this assignment. Empty on an assignment being added, which gets
                         one; send it back unchanged when updating the list, or the assignment is
                         treated as new and components placed on the old one are refused.
                plan_profile:
                    type: string
                    title: plan_profile
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: |-
                        The agent profiles a plan and an apply get: named sets of environment
                         variables, with an optional identity to assume, that the agent's owner
                         defines in the agent's own config, such as a read-only and an edit
                         Cloudflare token. Admiral holds the names, never the values. Empty means
                         the agent's `default` profile. A profile must be one the agent reports
                         and its grants cover for this environment.
                apply_profile:
                    type: string
                    title: apply_profile
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
            title: AgentAssignment
            required:
                - agent_id
            description: |-
                AgentAssignment binds an agent to an environment, with the settings for
                 how this environment uses it.
        admiral.api.environment.v1.ApprovalRule:
            type: object
            properties:
                required_approvals:
                    type: integer
                    title: required_approvals
                    minimum: 0
                    format: int32
                    description: |-
                        Distinct people who must approve the planned revision, from anyone
                         allowed to. 0 needs none.
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.ApprovalRule.GroupApproval'
                    title: groups
                    maxItems: 16
                    description: |
                        Groups that must each approve, all of them. One person's approval counts
                         for every group they belong to; to need two people, also set
                         required_approvals to 2.
                        approval_rule.unique_groups // a group appears at most once
            title: ApprovalRule
            additionalProperties: false
            description: |-
                ApprovalRule is what an apply needs from people before it runs. A plan
                 that changes dismisses its approvals, and the author never counts. When an
                 environment's and its agents' rules all apply, their groups add up (the
                 higher count for a group named twice) and the largest required_approvals
                 wins.
        admiral.api.environment.v1.ApprovalRule.GroupApproval:
            type: object
            properties:
                group_id:
                    type: string
                    title: group_id
                    pattern: ^grp-[0-9a-z]+$
                approvals:
                    type: integer
                    title: approvals
                    minimum: 1
                    format: int32
            title: GroupApproval
            required:
                - group_id
            additionalProperties: false
            description: GroupApproval is how many members of one group must approve.
        admiral.api.environment.v1.CreateEnvironmentRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    pattern: ^app-[0-9a-z]+$
                    description: The application the environment belongs to.
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The environment to create. Server-populated fields are ignored.
            title: CreateEnvironmentRequest
            required:
                - application_id
                - environment
            additionalProperties: false
            description: CreateEnvironmentRequest creates an environment under an application.
        admiral.api.environment.v1.CreateEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The created environment.
            title: CreateEnvironmentResponse
            additionalProperties: false
            description: CreateEnvironmentResponse contains the newly created environment.
        admiral.api.environment.v1.DeleteEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    description: The unique identifier of the environment to delete.
            title: DeleteEnvironmentRequest
            required:
                - environment_id
            additionalProperties: false
            description: DeleteEnvironmentRequest identifies an environment to delete.
        admiral.api.environment.v1.DeleteEnvironmentResponse:
            type: object
            title: DeleteEnvironmentResponse
            additionalProperties: false
            description: DeleteEnvironmentResponse is empty on success.
        admiral.api.environment.v1.Environment:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^env-[0-9a-z]+$
                    description: Unique identifier for the environment.
                    readOnly: true
                application_id:
                    type: string
                    title: application_id
                    pattern: ^app-[0-9a-z]+$
                    description: The application this environment belongs to.
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                         Unique within the application. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the environment's purpose
                         (e.g., "US East production serving live traffic" or
                         "Shared staging for QA validation before prod promotion").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering environments
                         (e.g., `{"region": "us-east-1", "tier": "production"}`).
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this environment (server-populated from token).
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the environment was created.
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the environment was last updated.
                    readOnly: true
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.AgentAssignment'
                    title: agents
                    description: |-
                        The agents this environment deploys through, each with how this
                         environment uses it. Several of one kind are allowed: an IAM agent beside
                         an ordinary one, say. A component runs on the assignment its settings
                         name, or on the only one of its kind. Two environments can share an agent
                         and differ in settings, such as dev and staging in one cluster under
                         different namespaces.
                approval:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.ApprovalRule'
                    title: approval
                    description: What an apply here needs before it runs. Unset needs nothing.
                generation:
                    type: string
                    title: generation
                    format: int64
                    description: |-
                        Moves each time an apply changes the environment. A change set records
                         the generation it was cut from.
                    readOnly: true
                hold:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Hold'
                    title: hold
                    description: |-
                        Set while a partial apply holds the environment. Nothing else applies
                         until the holding change set is reverted or accepted.
                    readOnly: true
                last_apply:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.LastApply'
                    title: last_apply
                    description: |-
                        The apply that produced the current generation. Absent until the first
                         apply changes the environment.
                    readOnly: true
            title: Environment
            additionalProperties: false
            description: |-
                Environment is a named place an application deploys to (dev, staging,
                 prod).
            example:
                id: "env-7q2k9m4x8p1c"
                application_id: "app-4m8q2x7k1p9c"
                name: "staging"
                description: "Shared staging environment for QA validation before production promotion."
                labels:
                    region: "us-east-1"
                    tier: "staging"
                agents:
                    - id: "asg-6t2k9m4q8x1p"
                      agent_id: "agt-2p7x4k9m1q3c"
                      kubernetes:
                        default_namespace: "inventory-staging"
                        create_namespaces: true
                        prune: true
                approval:
                    required_approvals: 1
                generation: 14
                last_apply:
                    change_set_id: "cs-3k9x2m7qpl0a"
                    revision_id: "rev-9f2m4k7x1p3q"
                    applied_at: "2025-11-01T09:15:00Z"
                created_by:
                    id: "usr-5k2m8q1x7p4c"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-15T11:00:00Z"
                updated_at: "2025-11-02T14:30:00Z"
        admiral.api.environment.v1.EnvironmentComponent:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: Component name, unique within the environment.
                environment_id:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    description: The environment it is live in.
                    readOnly: true
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    description: 'What its version is: Terraform, Helm or manifests.'
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.VersionRef'
                    title: version
                    description: The registry version it runs.
                last_apply:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.LastApply'
                    title: last_apply
                    description: The apply that last changed this component.
            title: EnvironmentComponent
            additionalProperties: false
            description: |-
                EnvironmentComponent is one component live in an environment: the version
                 it runs and the apply that last changed it.
        admiral.api.environment.v1.GetEnvironmentComponentValuesRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                effective:
                    type: boolean
                    title: effective
                    description: Return the whole tree it receives, not only the values set on it.
            title: GetEnvironmentComponentValuesRequest
            required:
                - environment_id
                - component
            additionalProperties: false
            description: GetEnvironmentComponentValuesRequest names one live component.
        admiral.api.environment.v1.GetEnvironmentComponentValuesResponse:
            type: object
            properties:
                tree_json:
                    type: string
                    title: tree_json
                    description: A JSON object.
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ValueSource'
                    title: sources
                    description: With `effective`, where each leaf came from; empty otherwise.
                last_apply:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.LastApply'
                    title: last_apply
                    description: The apply that last changed it.
            title: GetEnvironmentComponentValuesResponse
            additionalProperties: false
            description: GetEnvironmentComponentValuesResponse is the component's values tree.
        admiral.api.environment.v1.GetEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    description: The unique identifier of the environment.
            title: GetEnvironmentRequest
            required:
                - environment_id
            additionalProperties: false
            description: GetEnvironmentRequest identifies an environment to retrieve.
        admiral.api.environment.v1.GetEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The retrieved environment.
            title: GetEnvironmentResponse
            additionalProperties: false
            description: GetEnvironmentResponse contains the environment record.
        admiral.api.environment.v1.Hold:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                    description: The change set whose partial apply holds the environment.
                held_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: held_at
                    description: When the partial apply finished.
            title: Hold
            additionalProperties: false
            description: Hold is the state a partial apply leaves an environment in.
        admiral.api.environment.v1.KubernetesSettings:
            type: object
            properties:
                default_namespace:
                    type: string
                    title: default_namespace
                    maxLength: 63
                    pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: |-
                        The namespace a component renders into unless it names its own. Set to
                         `<application>-<environment>` when the environment is created if left
                         empty; at most 63 characters.
                create_namespaces:
                    type:
                        - boolean
                        - "null"
                    title: create_namespaces
                    description: |-
                        Whether a missing namespace is created at apply. The agent's own
                         setting and its RBAC can still refuse. Defaults to true on create.
                prune:
                    type:
                        - boolean
                        - "null"
                    title: prune
                    description: |-
                        Whether an apply deletes objects a component no longer renders, and the
                         objects of a component it removes. Off, they are orphaned: left in the
                         cluster and no longer managed. An object annotated
                         `admiral.io/prune: "false"` is orphaned either way. Defaults to true on
                         create.
            title: KubernetesSettings
            additionalProperties: false
            description: KubernetesSettings is how an environment uses a Kubernetes agent.
        admiral.api.environment.v1.LastApply:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                    description: The change set that was applied.
                revision_id:
                    type: string
                    title: revision_id
                    pattern: ^rev-[0-9a-z]+$
                    description: The change set revision that was applied.
                applied_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: applied_at
                    description: When the apply finished.
            title: LastApply
            additionalProperties: false
            description: |-
                LastApply points at the apply that produced an environment's current
                 generation.
        admiral.api.environment.v1.ListEnvironmentComponentsRequest:
            type: object
            properties:
                environment_id:
                    type:
                        - string
                        - "null"
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                    description: The environment to list. Omitted lists across every environment.
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Filterable fields:
                           - `name`: filter by component name.
                           - `kind`: filter by component kind.
                           - `component_id`: the registry component (`cmp-`) it runs.
                           - `version_id`: the registry version (`ver-`) it runs.

                         Example: `field['component_id'] = 'cmp-7q2k9m4x8p1c' AND field['version_id'] = 'ver-3k9x2m7qpl0a'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of components to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentComponentsRequest
            additionalProperties: false
            description: |-
                ListEnvironmentComponentsRequest lists live components in one environment
                 or across all of them.
        admiral.api.environment.v1.ListEnvironmentComponentsResponse:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.EnvironmentComponent'
                    title: components
                    description: Live components, sorted by environment and then name.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
                unreadable_environments:
                    type: integer
                    title: unreadable_environments
                    format: int32
                    description: |-
                        Across environments only: how many more environments match that the
                         caller cannot read.
            title: ListEnvironmentComponentsResponse
            additionalProperties: false
            description: ListEnvironmentComponentsResponse is a page of live components.
        admiral.api.environment.v1.ListEnvironmentsRequest:
            type: object
            properties:
                application_id:
                    type:
                        - string
                        - "null"
                    title: application_id
                    pattern: ^app-[0-9a-z]+$
                    description: |-
                        The application to list environments of. Omitted lists every
                         environment the caller can see, across applications.
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by environment name.
                           - `labels.key`: filter by label key.

                         Example: `field['name'] = 'prod' AND field['labels.region'] = 'us-east-1'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of environments to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentsRequest
            additionalProperties: false
            description: ListEnvironmentsRequest contains pagination and filter parameters.
        admiral.api.environment.v1.ListEnvironmentsResponse:
            type: object
            properties:
                environments:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environments
                    description: The list of environments.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListEnvironmentsResponse
            additionalProperties: false
            description: ListEnvironmentsResponse contains a page of environments.
        admiral.api.environment.v1.UpdateEnvironmentRequest:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: |-
                        The environment with updated fields.
                         Only fields specified in `update_mask` are updated.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `labels`, `agents`, `approval`.
            title: UpdateEnvironmentRequest
            required:
                - environment
            additionalProperties: false
            description: UpdateEnvironmentRequest contains the environment fields to update.
        admiral.api.environment.v1.UpdateEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The updated environment.
            title: UpdateEnvironmentResponse
            additionalProperties: false
            description: UpdateEnvironmentResponse contains the updated environment.
        admiral.api.healthcheck.v1.HealthcheckResponse:
            type: object
            title: HealthcheckResponse
            additionalProperties: false
            description: |-
                Empty response indicating the service is healthy.
        admiral.api.invitation.v1.CreateInvitationRequest:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
                    description: 'The invitation to issue: `email` and `role`.'
            title: CreateInvitationRequest
            required:
                - invitation
            additionalProperties: false
            description: CreateInvitationRequest invites one address into the caller's tenant.
        admiral.api.invitation.v1.CreateInvitationResponse:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
            title: CreateInvitationResponse
            additionalProperties: false
            description: CreateInvitationResponse carries the invitation, without its link.
        admiral.api.invitation.v1.Invitation:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^inv-[0-9a-z]+$
                    description: Unique identifier.
                    readOnly: true
                email:
                    type: string
                    title: email
                    maxLength: 254
                    format: email
                    description: (IMMUTABLE) Where the mail goes, and the address the user will be created with.
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    enum:
                        - USER_ROLE_ADMIN
                        - USER_ROLE_MEMBER
                    description: |
                        (IMMUTABLE) The role the person holds once they join. ADMIN or MEMBER.
                        enum.defined_only = true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation.Status'
                    title: status
                    readOnly: true
                invited_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: invited_by
                    description: |-
                        The member who issued it. Absent when it was issued by an operator from
                         outside the tenant.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
                    description: After this instant the link no longer works.
                    readOnly: true
                accepted_at:
                    oneOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                        - type: "null"
                    title: accepted_at
                    description: |-
                        When it was redeemed, and the member it became. Both set together, only
                         on ACCEPTED.
                    readOnly: true
                accepted_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: accepted_by
                    readOnly: true
                revoked_at:
                    oneOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                        - type: "null"
                    title: revoked_at
                    description: When it was withdrawn or retired. Only on REVOKED.
                    readOnly: true
            title: Invitation
            additionalProperties: false
            description: |-
                Invitation is one person invited into the caller's tenant. Never carries
                 the link or its token.
        admiral.api.invitation.v1.Invitation.Status:
            type: string
            title: Status
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_PENDING
                - STATUS_ACCEPTED
                - STATUS_EXPIRED
                - STATUS_REVOKED
            description: Status is where an invitation is in its life.
        admiral.api.invitation.v1.ListInvitationsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `email`: filter by address.
                           - `status`: filter by lifecycle status.

                         Example: `field['status'] = 'STATUS_PENDING'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of invitations to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListInvitationsRequest
            additionalProperties: false
            description: ListInvitationsRequest pages through the caller's tenant's invitations.
        admiral.api.invitation.v1.ListInvitationsResponse:
            type: object
            properties:
                invitations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitations
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListInvitationsResponse
            additionalProperties: false
            description: ListInvitationsResponse contains a page of invitations.
        admiral.api.invitation.v1.RevokeInvitationRequest:
            type: object
            properties:
                invitation_id:
                    type: string
                    title: invitation_id
                    pattern: ^inv-[0-9a-z]+$
                    description: The invitation, from CreateInvitation or ListInvitations.
            title: RevokeInvitationRequest
            required:
                - invitation_id
            additionalProperties: false
            description: RevokeInvitationRequest names one invitation in the caller's tenant.
        admiral.api.invitation.v1.RevokeInvitationResponse:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
            title: RevokeInvitationResponse
            additionalProperties: false
            description: RevokeInvitationResponse carries the invitation as it now stands.
        admiral.api.registry.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^cmp-[0-9a-z]+$
                    description: Unique identifier.
                    readOnly: true
                name:
                    type: string
                    title: name
                    description: |-
                        Unique within the tenant, never changed: `cloud-sql`. Team grouping,
                         when it lands, is a `team/` segment of the name (`payments/cloud-sql`);
                         moving a component means publishing under the new name and deprecating
                         the old one with it as the successor.
                    readOnly: true
                description:
                    type: string
                    title: description
                    maxLength: 1024
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Key-value metadata for filtering (e.g. `{"team": "payments",
                         "runtime": "terraform"}`), the same labels every Admiral resource carries.
                tags:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Tag'
                    title: tags
                    description: Every tag on the component, by name.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component.Status'
                    title: status
                    readOnly: true
                status_reason:
                    type: string
                    title: status_reason
                    description: |-
                        Why, and when, the status last changed. Unset on a component that has
                         only ever been ACTIVE.
                    readOnly: true
                status_changed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: status_changed_at
                    readOnly: true
                successor_component_id:
                    type: string
                    title: successor_component_id
                    description: The component to use instead, `cmp-`; set only while DEPRECATED.
                    readOnly: true
            title: Component
            additionalProperties: false
            description: |-
                Component is a registry entry: a name, and the versions and tags beneath
                 it.
        admiral.api.registry.v1.Component.Status:
            type: string
            title: Status
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_ACTIVE
                - STATUS_DEPRECATED
            description: |-
                Status is whether a component is still recommended. Removing one is
                 DeleteComponent.
        admiral.api.registry.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - COMPONENT_KIND_TERRAFORM
                - COMPONENT_KIND_HELM
                - COMPONENT_KIND_MANIFESTS
            description: |-
                ComponentKind is what a version's bundle is, detected by inspection at
                 publish: a Chart.yaml means HELM, .tf files mean TERRAFORM, anything else
                 that is Kubernetes YAML means MANIFESTS.
        admiral.api.registry.v1.Contract:
            type: object
            properties:
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractInput'
                    title: inputs
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractOutput'
                    title: outputs
            title: Contract
            additionalProperties: false
            description: |-
                Contract is what a bundle takes and gives. The shape here is what static
                 inspection can produce from any Terraform module or Helm chart; the curated
                 format adds to it without removing anything.
        admiral.api.registry.v1.ContractInput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                type:
                    type: string
                    title: type
                    description: |-
                        The type as the bundle declares it: a Terraform type expression, or for a
                         chart one of bool, number, string, list, object or null. A chart's full
                         constraint is in schema.
                description:
                    type: string
                    title: description
                required:
                    type: boolean
                    title: required
                    description: True when the bundle gives it no default.
                default:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    title: default
                    description: The declared default, when there is one.
                sensitive:
                    type: boolean
                    title: sensitive
                    description: |-
                        The bundle marks the value sensitive: it is masked in artifacts and
                         review, as GetArtifact describes.
                ephemeral:
                    type: boolean
                    title: ephemeral
                    description: |-
                        The value must not land in plan or state (Terraform 1.10+ ephemeral
                         inputs). Implies sensitive.
                nullable:
                    type:
                        - boolean
                        - "null"
                    title: nullable
                    description: |-
                        Whether null is an accepted value. Unset when the bundle does not say,
                         which is a chart input with no schema.
                deprecated:
                    type: string
                    title: deprecated
                    description: The bundle's own deprecation message for this input.
                validations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractValidation'
                    title: validations
                    description: A Terraform variable's validation blocks, in declaration order.
                schema:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Struct'
                    title: schema
                    description: |-
                        The JSON Schema a chart's values.schema.json declares for this input,
                         verbatim, so a value can be checked the way Helm will check it.
            title: ContractInput
            additionalProperties: false
            description: ContractInput is one value the bundle accepts.
        admiral.api.registry.v1.ContractOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                description:
                    type: string
                    title: description
                sensitive:
                    type: boolean
                    title: sensitive
            title: ContractOutput
            additionalProperties: false
            description: ContractOutput is one value the bundle produces.
        admiral.api.registry.v1.ContractValidation:
            type: object
            properties:
                condition:
                    type: string
                    title: condition
                error_message:
                    type: string
                    title: error_message
            title: ContractValidation
            additionalProperties: false
            description: |-
                ContractValidation is one validation block on a Terraform variable, as
                 written. Evaluating the condition needs the Terraform language runtime,
                 which the registry does not run.
        admiral.api.registry.v1.DeleteComponentRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
            title: DeleteComponentRequest
            required:
                - component_id
            additionalProperties: false
            description: DeleteComponentRequest identifies the component to delete.
        admiral.api.registry.v1.DeleteComponentResponse:
            type: object
            title: DeleteComponentResponse
            additionalProperties: false
            description: DeleteComponentResponse is empty.
        admiral.api.registry.v1.DeleteTagRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                name:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: DeleteTagRequest
            required:
                - component_id
                - name
            additionalProperties: false
            description: DeleteTagRequest identifies a floating tag to remove.
        admiral.api.registry.v1.DeleteTagResponse:
            type: object
            title: DeleteTagResponse
            additionalProperties: false
            description: DeleteTagResponse is empty.
        admiral.api.registry.v1.Dependency:
            type: object
            properties:
                source:
                    type: string
                    title: source
                    description: The source as the bundle declared it, before rewriting.
                constraint:
                    type: string
                    title: constraint
                    description: The constraint that was asked for, when any.
                resolved:
                    type: string
                    title: resolved
                    description: 'What it resolved to: an exact version or commit.'
            title: Dependency
            additionalProperties: false
            description: |-
                Dependency is one remote module or chart the closure step resolved and
                 copied into the bundle.
        admiral.api.registry.v1.Finding:
            type: object
            properties:
                severity:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.FindingSeverity'
                    title: severity
                source:
                    type: string
                    title: source
                    description: 'What produced it: `provider-constraint`, `checkov`, `trivy`, `image-ref`.'
                code:
                    type: string
                    title: code
                    description: |-
                        The producer's own identifier for the rule, when it has one
                         (e.g. `CKV_AWS_18`).
                message:
                    type: string
                    title: message
                path:
                    type: string
                    title: path
                    description: Where in the bundle, when it applies.
            title: Finding
            additionalProperties: false
            description: Finding is one thing the publish gate noticed.
        admiral.api.registry.v1.FindingSeverity:
            type: string
            title: FindingSeverity
            enum:
                - FINDING_SEVERITY_UNSPECIFIED
                - FINDING_SEVERITY_INFO
                - FINDING_SEVERITY_LOW
                - FINDING_SEVERITY_MEDIUM
                - FINDING_SEVERITY_HIGH
                - FINDING_SEVERITY_CRITICAL
            description: FindingSeverity ranks what the publish gate found.
        admiral.api.registry.v1.GetComponentRequest:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: '`cloud-sql`, or `cmp-7q2k9m4x8p1c`.'
            title: GetComponentRequest
            required:
                - component
            additionalProperties: false
            description: GetComponentRequest identifies a component by name or by id.
        admiral.api.registry.v1.GetComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: GetComponentResponse
            additionalProperties: false
            description: GetComponentResponse contains the component with its tags.
        admiral.api.registry.v1.GetVersionRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|ver-[0-9a-z]+|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: |-
                        A tag (`v1.2.0`, `latest`), a digest (`sha256:<hex>`) or a version id
                         (`ver-…`). A digest and an id are recognised by their prefix; anything
                         else is a tag, and no tag starts with `ver-`.
            title: GetVersionRequest
            required:
                - component_id
                - reference
            additionalProperties: false
            description: GetVersionRequest identifies a version by reference.
        admiral.api.registry.v1.GetVersionResponse:
            type: object
            properties:
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version'
                    title: version
            title: GetVersionResponse
            additionalProperties: false
            description: GetVersionResponse contains the version.
        admiral.api.registry.v1.ImportComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: |-
                        Empty means the artifact's own name: the chart's, the module's, the
                         repository's or directory's.
                source:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ImportSource'
                    title: source
                credential_ids:
                    type: array
                    items:
                        type: string
                        pattern: ^cred-[0-9a-z]+$
                    title: credential_ids
                    maxItems: 16
                    uniqueItems: true
                    description: |-
                        The credentials this import may present, chosen by the caller. Each is
                         presented only where its type fits and its `allowed_hosts` permit. A
                         fetch that reaches a host none of them covers fails naming the host.
                tags:
                    type: array
                    items:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                    title: tags
                    maxItems: 16
                    description: |-
                        Tags to set on the resulting version. A chart's version and a
                         module's version are applied as tags whether or not named.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Applied when the import creates the component; ignored otherwise.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                baseline_values_json:
                    type: string
                    title: baseline_values_json
                    maxLength: 1048576
                    description: |-
                        The organization's defaults for this artifact, as a JSON object: values
                         laid over the artifact's own defaults (a chart's values.yaml, a module's
                         variable defaults) before any environment's values. Stored with the
                         artifact as one version under one digest, so changing them is a new
                         version, which environments move to like any other. Empty means the
                         artifact's own defaults.
            title: ImportComponentRequest
            required:
                - source
            additionalProperties: false
            description: |
                import_component.name_not_an_id // a component name cannot start with cmp-, which marks an id
                import_component.tags.tag_not_an_id // a tag cannot start with ver-, which marks a version id
        admiral.api.registry.v1.ImportComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version'
                    title: version
                unchanged:
                    type: boolean
                    title: unchanged
                    description: The resolution was already published under this name; nothing was written.
            title: ImportComponentResponse
            additionalProperties: false
        admiral.api.registry.v1.ImportSource:
            type: object
            anyOf:
                - type: object
                  properties:
                    archive:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.ImportSource.Archive'
                        title: archive
                  title: archive
                - type: object
                  properties:
                    git_tree:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.ImportSource.GitTree'
                        title: git_tree
                  title: git_tree
                - type: object
                  properties:
                    helm_chart:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.ImportSource.HelmChart'
                        title: helm_chart
                  title: helm_chart
                - type: object
                  properties:
                    oci_chart:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.ImportSource.OCIChart'
                        title: oci_chart
                  title: oci_chart
                - type: object
                  properties:
                    registry_module:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.ImportSource.RegistryModule'
                        title: registry_module
                  title: registry_module
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - archive
                        - required:
                            - git_tree
                        - required:
                            - helm_chart
                        - required:
                            - oci_chart
                        - required:
                            - registry_module
                    - not:
                        oneOf:
                            - required:
                                - archive
                            - required:
                                - git_tree
                            - required:
                                - helm_chart
                            - required:
                                - oci_chart
                            - required:
                                - registry_module
            title: ImportSource
            description: |-
                ImportSource names an artifact to import. One variant. The kind of the
                 resulting component follows from it: a chart from OCI or a Helm
                 repository, a module from a module registry, whatever inspection finds in
                 a git tree or an archive.
        admiral.api.registry.v1.ImportSource.Archive:
            type: object
            properties:
                url:
                    type: string
                    title: url
                    maxLength: 512
                    format: uri
            title: Archive
            required:
                - url
            additionalProperties: false
            description: An archive at a URL, unpacked by its extension.
        admiral.api.registry.v1.ImportSource.GitTree:
            type: object
            properties:
                url:
                    type: string
                    title: url
                    maxLength: 512
                    format: uri
                    description: '`https://github.com/acme/infra.git`, `ssh://git@github.com/acme/infra.git`.'
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: A branch, tag or commit. Empty is the default branch.
                path:
                    type: string
                    title: path
                    maxLength: 512
                    description: |
                        A directory within the repository. Empty is the root.
                        string.not_contains = ".."
            title: GitTree
            required:
                - url
            additionalProperties: false
            description: A git repository at a ref, optionally a directory of it.
        admiral.api.registry.v1.ImportSource.HelmChart:
            type: object
            properties:
                repository:
                    type: string
                    title: repository
                    maxLength: 512
                    format: uri
                chart:
                    type: string
                    title: chart
                    maxLength: 63
                    pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: HelmChart
            required:
                - repository
                - chart
                - version
            additionalProperties: false
            description: |-
                A chart in an HTTP repository: the repository URL, the chart's name in
                 its index, and an exact version.
        admiral.api.registry.v1.ImportSource.OCIChart:
            type: object
            properties:
                reference:
                    type: string
                    title: reference
                    maxLength: 512
                    minLength: 7
                    description: |
                        string.prefix = "oci://"
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: OCIChart
            required:
                - reference
                - version
            additionalProperties: false
            description: |-
                A chart in an OCI registry: `oci://ghcr.io/argoproj/argo-helm/argo-cd`
                 at a version, which is its tag.
        admiral.api.registry.v1.ImportSource.RegistryModule:
            type: object
            properties:
                address:
                    type: string
                    title: address
                    maxLength: 512
                    minLength: 5
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: RegistryModule
            required:
                - address
                - version
            additionalProperties: false
            description: |-
                A module in a module registry: the address as a module call would
                 write it (`GoogleCloudPlatform/cloud-armor/google`, optionally
                 host-qualified, optionally `//subdir`) and an exact version. A range is
                 what a Source tracks, not what an import takes.
        admiral.api.registry.v1.ListComponentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by name.
                           - `description`: filter by description.
                           - `labels`: filter by label key/value.
                           - `status`: STATUS_ACTIVE, STATUS_DEPRECATED.

                         Example: `field['labels']['team'] = 'payments'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of components to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListComponentsRequest
            additionalProperties: false
            description: ListComponentsRequest pages through the registry.
        admiral.api.registry.v1.ListComponentsResponse:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: components
                    description: Listed without their tags; GetComponent carries those.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListComponentsResponse
            additionalProperties: false
            description: ListComponentsResponse contains a page of components.
        admiral.api.registry.v1.ListVersionsRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression. Filterable fields:
                           - `kind`: COMPONENT_KIND_TERRAFORM, COMPONENT_KIND_HELM,
                             COMPONENT_KIND_MANIFESTS.
                           - `status`: STATUS_PUBLISHED, STATUS_DEPRECATED, STATUS_REVOKED.

                         Example: `field['status'] = 'STATUS_PUBLISHED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListVersionsRequest
            required:
                - component_id
            additionalProperties: false
            description: ListVersionsRequest pages through one component's versions.
        admiral.api.registry.v1.ListVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Version'
                    title: versions
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListVersionsResponse
            additionalProperties: false
            description: ListVersionsResponse contains a page of versions, newest first.
        admiral.api.registry.v1.PresentedCredential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^cred-[0-9a-z]+$
                name:
                    type: string
                    title: name
                hosts:
                    type: array
                    items:
                        type: string
                    title: hosts
                    description: The hosts it was presented to during this import.
            title: PresentedCredential
            additionalProperties: false
            description: |-
                PresentedCredential is one credential an import presented, as it was named at
                 the time; the credential may since have been renamed or deleted.
        admiral.api.registry.v1.Provenance:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance.Kind'
                    title: kind
                uri:
                    type: string
                    title: uri
                    description: |-
                        The repository or location the bytes were read from: a git remote URL, a
                         Helm repository URL, an OCI reference. For a push, as the publisher
                         reported it; empty when it named no remote.
                ref:
                    type: string
                    title: ref
                    description: The ref that was asked for (tag, branch, chart version), when any.
                commit:
                    type: string
                    title: commit
                    description: 'What the ref resolved to: a commit SHA, or the exact chart version.'
                path:
                    type: string
                    title: path
                    description: |-
                        The path within the source the bundle was taken from. Empty means the
                         root.
                dependencies:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Dependency'
                    title: dependencies
                    description: |-
                        Every remote module or chart the closure step copied into the bundle,
                         at what it resolved to.
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.PresentedCredential'
                    title: credentials
                    description: |-
                        The credentials the platform presented while fetching, for IMPORT: which
                         secret reached which hosts. Lineage, not a grant; a later import attaches
                         its own. Set by the server; ignored on a publish request.
                    readOnly: true
                commit_message:
                    type: string
                    title: commit_message
                    maxLength: 4096
                    description: |-
                        The message of the commit that produced these bytes, as written, so a
                         reader deciding whether to move to this version can see what changed.
                         Captured at publish because it cannot be recovered after a force-push or
                         once the source is gone. Empty when there is no commit, or upstream
                         carried no notes.
                commit_author:
                    type: string
                    title: commit_author
                    maxLength: 256
                    description: Who wrote that commit, by name. Not the email address.
            title: Provenance
            additionalProperties: false
            description: |-
                Provenance is where a version's bytes came from: the audit trail behind
                 the digest.
        admiral.api.registry.v1.Provenance.Kind:
            type: string
            title: Kind
            enum:
                - KIND_UNSPECIFIED
                - KIND_PUSH
                - KIND_IMPORT
            description: |-
                Kind is the on-ramp a version arrived by: whose code it is and who
                 triggered the publish, not which way the bytes travelled.
        admiral.api.registry.v1.PublishComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: The component name to publish under. Created on first use.
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    description: |-
                        The kind, when the caller knows better than inspection. UNSPECIFIED
                         means detect.
                tags:
                    type: array
                    items:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                    title: tags
                    maxItems: 16
                    description: Tags to set on the resulting version (e.g. `v1.2.0`, `latest`).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Description and labels for the component. Applied when the publish
                         creates the component; ignored when it already exists, since a publish is
                         not the place to edit metadata. UpdateComponent is.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                provenance:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance'
                    title: provenance
                    description: |-
                        What the caller knows about where the bytes came from. The server
                         records the kind as PUSH whatever is claimed here; the uri, ref,
                         commit and path are kept as the caller's assertion.
                bundle:
                    type: string
                    title: bundle
                    maxLength: 67108864
                    minLength: 1
                    format: byte
                    description: 'The bundle: a gzipped tar of the component root. At most 64 MiB.'
            title: PublishComponentRequest
            required:
                - name
                - bundle
            additionalProperties: false
            description: |
                PublishComponentRequest carries what is being published and the bytes.
                publish_component.name_not_an_id // a component name cannot start with cmp-, which marks an id
                publish_component.tags.tag_not_an_id // a tag cannot start with ver-, which marks a version id
        admiral.api.registry.v1.PublishComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version'
                    title: version
                unchanged:
                    type: boolean
                    title: unchanged
                    description: |-
                        True when the digest was already published under this name and nothing
                         was written. Tags in the request were still applied.
            title: PublishComponentResponse
            additionalProperties: false
            description: PublishComponentResponse is the recorded version.
        admiral.api.registry.v1.SetComponentStatusRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component.Status'
                    not:
                        enum:
                            - STATUS_UNSPECIFIED
                    title: status
                    description: |
                        enum.defined_only = true
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    description: Shown wherever the status warns. Required unless the status is ACTIVE.
                successor_component_id:
                    type: string
                    title: successor_component_id
                    pattern: ^cmp-[0-9a-z]+$
                    description: The component to use instead, for DEPRECATED.
            title: SetComponentStatusRequest
            required:
                - component_id
                - status
            additionalProperties: false
            description: |
                SetComponentStatusRequest names a component, its new status, and why.
                set_component_status.reason // a deprecated component needs a reason
                set_component_status.successor // only a deprecated component names a successor
        admiral.api.registry.v1.SetComponentStatusResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: SetComponentStatusResponse
            additionalProperties: false
            description: SetComponentStatusResponse contains the component with its new status.
        admiral.api.registry.v1.SetTagRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                name:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                digest:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
                    description: The version to name, as `sha256:<hex>`.
            title: SetTagRequest
            required:
                - component_id
                - name
                - digest
            additionalProperties: false
            description: |
                SetTagRequest points a tag at a version.
                set_tag.tag_not_an_id // a tag cannot start with ver-, which marks a version id
        admiral.api.registry.v1.SetTagResponse:
            type: object
            properties:
                tag:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Tag'
                    title: tag
            title: SetTagResponse
            additionalProperties: false
            description: SetTagResponse contains the tag as it now stands.
        admiral.api.registry.v1.SetVersionStatusRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                digest:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
                    description: |-
                        `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                         a floating tag might name different bytes by the time anyone reads the
                         reason.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version.Status'
                    not:
                        enum:
                            - STATUS_UNSPECIFIED
                    title: status
                    description: |
                        enum.defined_only = true
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    minLength: 1
                    description: |-
                        Shown to anyone who adopts or tries to adopt the version, and to every
                         environment running it.
            title: SetVersionStatusRequest
            required:
                - component_id
                - digest
                - status
                - reason
            additionalProperties: false
            description: |-
                SetVersionStatusRequest names a version by digest, its new status, and
                 why.
        admiral.api.registry.v1.SetVersionStatusResponse:
            type: object
            properties:
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version'
                    title: version
            title: SetVersionStatusResponse
            additionalProperties: false
            description: SetVersionStatusResponse contains the version with its new status.
        admiral.api.registry.v1.Tag:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: As written after the colon in `cloud-sql:v1.2.0`.
                    readOnly: true
                digest:
                    type: string
                    title: digest
                    description: The version it names, as `sha256:<hex>`.
                    readOnly: true
                immutable:
                    type: boolean
                    title: immutable
                    description: |-
                        True for a semver tag: it never moves once assigned. Decided from the
                         name, so two tags with the same name are always the same class.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Tag
            additionalProperties: false
            description: Tag is a name pointing at a version.
        admiral.api.registry.v1.UpdateComponentRequest:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                    description: |-
                        The component with updated fields. Its `id` identifies it; only fields
                         named in `update_mask` are applied.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        Supported fields: `description`, `labels`. An empty mask updates what
                         the request populates.
            title: UpdateComponentRequest
            required:
                - component
            additionalProperties: false
            description: |-
                UpdateComponentRequest carries the fields to change. Omitted fields are
                 left as they are.
        admiral.api.registry.v1.UpdateComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: UpdateComponentResponse
            additionalProperties: false
            description: UpdateComponentResponse contains the updated component.
        admiral.api.registry.v1.Version:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^ver-[0-9a-z]+$
                    description: |-
                        `ver-` and twelve base36 characters. A change set holds it beside the
                         digest, which is the identity of the bytes.
                    readOnly: true
                component_id:
                    type: string
                    title: component_id
                    description: The component this version belongs to, `cmp-`.
                    readOnly: true
                digest:
                    type: string
                    title: digest
                    description: 'The identity: SHA-256 of the normalized bundle, as `sha256:<hex>`.'
                    readOnly: true
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    readOnly: true
                size_bytes:
                    type: string
                    title: size_bytes
                    format: int64
                    description: Size of the stored bundle in bytes.
                    readOnly: true
                contract:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Contract'
                    title: contract
                    description: |-
                        The inputs and outputs the bundle exposes. Inferred from the bundle at
                         publish; curated by a publisher once the contract format lands.
                    readOnly: true
                provenance:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance'
                    title: provenance
                    description: Where the bytes came from.
                    readOnly: true
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Finding'
                    title: findings
                    description: |-
                        What the publish gate found. Informational findings do not block a
                         publish; a version with findings is published with them attached, and
                         the findings delta between two versions is what an upgrade review reads.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Version.Status'
                    title: status
                    readOnly: true
                status_changed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: status_changed_at
                    description: |-
                        When and why the status last changed. Unset on a version that has only
                         ever been PUBLISHED.
                    readOnly: true
                status_reason:
                    type: string
                    title: status_reason
                    readOnly: true
                tags:
                    type: array
                    items:
                        type: string
                        readOnly: true
                    title: tags
                    description: The tags currently naming this version.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                providers:
                    type: array
                    items:
                        type: string
                        readOnly: true
                    title: providers
                    description: |-
                        The Terraform providers the bundle's root and vendored modules require,
                         as `namespace/type` addresses without a registry host, read offline at
                         publish. Empty for a Kubernetes component. A provider some agent in the
                         tenant serves is a need: adding the component, setting its version or
                         settings, or changing an assignment is refused unless the plan and apply
                         profiles serve every need.
                    readOnly: true
                baseline_values_json:
                    type: string
                    title: baseline_values_json
                    description: |-
                        The organization's defaults stored with this version, as a JSON object;
                         empty when there are none. The contract's defaults already include them.
                    readOnly: true
            title: Version
            additionalProperties: false
            description: Version is one published artifact. Immutable except for its status.
        admiral.api.registry.v1.Version.Status:
            type: string
            title: Status
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_PUBLISHED
                - STATUS_DEPRECATED
                - STATUS_REVOKED
            description: Status is a version's lifecycle. There is no deleted state.

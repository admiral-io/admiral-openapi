            description: 'Scope: `component:read`'
            operationId: RegistryAPI_GetVersion
            parameters:
                - name: component_id
                  in: path
                  description: The component_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                - name: reference
                  in: path
                  description: |-

                        Accepted, but worth saying: a deprecated pin, a check the contract could
                         not make.
            title: CreateChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.DiffChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            title: DiffChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.DiffChangeSetResponse:
            type: object
            properties:
                revision:
                    type: integer
                    title: revision
                    format: int32
                    description: The head revision diffed; 0 when there is none.
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ComponentDiff'
                    title: components
            title: DiffChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.DiscardChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            title: DiscardChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.DiscardChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
            title: DiscardChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.Edit:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - add_component
                    - required:
                        - set_value
                    - required:
                        - set_null
                    - required:
                        - unset_value
                    - required:
                        - set_pin
                    - required:
                        - replace_values
                    - required:
                        - remove_component
            anyOf:
                - type: object
                  properties:
                    add_component:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.AddComponent'
                        title: add_component
                  title: add_component
                - type: object
                  properties:
                    remove_component:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.RemoveComponent'
                        title: remove_component
                  title: remove_component
                - type: object
                  properties:
                    replace_values:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.ReplaceValues'
                        title: replace_values
                  title: replace_values
                - type: object
                  properties:
                    set_null:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.SetNull'
                        title: set_null
                  title: set_null
                - type: object
                  properties:
                    set_pin:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.SetPin'
                        title: set_pin
                  title: set_pin
                - type: object
                  properties:
                    set_value:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.SetValue'
                        title: set_value
                  title: set_value
                - type: object
                  properties:
                    unset_value:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.changeset.v1.UnsetValue'
                        title: unset_value
                  title: unset_value
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - add_component
                        - required:
                            - remove_component
                        - required:
                            - replace_values
                        - required:
                            - set_null
                        - required:
                            - set_pin
                        - required:
                            - set_value
                        - required:
                            - unset_value
                    - not:
                        oneOf:
                            - required:
                                - add_component
                            - required:
                                - remove_component
                            - required:
                                - replace_values
                            - required:
                                - set_null
                            - required:
                                - set_pin
                            - required:
                                - set_value
                            - required:
                                - unset_value
            title: Edit
            description: |-
                Edit is one change a request makes. A request's edits apply in order and
                 become one revision.
        admiral.api.changeset.v1.EditChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                if_revision:
                    type:
                        - integer
                        - "null"
                    title: if_revision
                    minimum: 0
                    format: int32
                    description: When set, refused unless the head is this revision.
                edits:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Edit'
                    title: edits
                    maxItems: 100
                    minItems: 1
            title: EditChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.EditChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revision
                warnings:
                    type: array
                    items:
                        type: string
                    title: warnings
            title: EditChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.Entry:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                component:
                    type: string
                    title: component
                action:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.EntryAction'
                    title: action
                pin:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Pin'
                    title: pin
                    description: |-
                        The revision the component is pinned to after this change set: set on
                         CREATE and when the pin moves.
                base_digest:
                    type: string
                    title: base_digest
                    description: Empty on CREATE.
                result_digest:
                    type: string
                    title: result_digest
                    description: Empty on DESTROY.
                ops:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ValueOp'
                    title: ops
            title: Entry
            additionalProperties: false
            description: Entry is what one revision does to one component.
        admiral.api.changeset.v1.EntryAction:
            type: string
            title: EntryAction
            enum:
                - ENTRY_ACTION_UNSPECIFIED
                - CREATE
                - UPDATE
                - DESTROY
        admiral.api.changeset.v1.GetChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            title: GetChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.GetChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                head:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: head
                    description: Absent before the first edit.
            title: GetChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetComponentValuesRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
            title: GetComponentValuesRequest
            required:
                - change_set_id
                - component
            additionalProperties: false
        admiral.api.changeset.v1.GetComponentValuesResponse:
            type: object
            properties:
                tree_json:
                    type: string
                    title: tree_json
                    description: A JSON object.
                base_digest:
                    type: string
                    title: base_digest
                    description: The values the change set started from; empty for a component it adds.
                result_digest:
                    type: string
                    title: result_digest
                head_revision:
                    type: integer
                    title: head_revision
                    format: int32
            title: GetComponentValuesResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetRevisionRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                number:
                    type: integer
                    title: number
                    minimum: 1
                    format: int32
            title: GetRevisionRequest
            required:
                - change_set_id
                - number
            additionalProperties: false
        admiral.api.changeset.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revision
            title: GetRevisionResponse
            additionalProperties: false
        admiral.api.changeset.v1.ListChangeSetsRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetStatus'
                    title: status
                    description: UNSPECIFIED lists every status.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListChangeSetsRequest
            required:
                - environment_id
            additionalProperties: false
        admiral.api.changeset.v1.ListChangeSetsResponse:
            type: object
            properties:
                change_sets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_sets
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListChangeSetsResponse
            additionalProperties: false
        admiral.api.changeset.v1.ListRevisionsRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListRevisionsRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revisions
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListRevisionsResponse
            additionalProperties: false
        admiral.api.changeset.v1.PathDiff:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                display_path:
                    type: string
                    title: display_path
                before_present:
                    type: boolean
                    title: before_present
                before_json:
                    type: string
                    title: before_json
                after_present:
                    type: boolean
                    title: after_present
                after_json:
                    type: string
                    title: after_json
            title: PathDiff
            additionalProperties: false
            description: 'PathDiff is one changed path: absent, null or a value on each side.'
        admiral.api.changeset.v1.PathSegment:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - key
            anyOf:
                - type: object
                  properties:
                    key:
                        type: string
                        title: key
                        maxLength: 256
                        minLength: 1
                  title: key
            unevaluatedProperties: false
            title: PathSegment
            description: PathSegment is one step into a values tree. Only map keys exist.
        admiral.api.changeset.v1.Pin:
            type: object
            properties:
                revision_id:
                    type: string
                    title: revision_id
                digest:
                    type: string
                    title: digest
                    description: '`sha256:<hex>` of the bundle.'
                namespace:
                    type: string
                    title: namespace
                name:
                    type: string
                    title: name
            title: Pin
            additionalProperties: false
            description: Pin is a registry revision, named the ways a person reads it.
        admiral.api.changeset.v1.RegistryRef:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: Empty means the default namespace.
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: A tag or a `sha256:` digest.
            title: RegistryRef
            required:
                - name
                - reference
            additionalProperties: false
            description: |-
                RegistryRef is a registry component and a tag or digest in it. A tag is
                 resolved when the edit is made; only the revision is stored.
        admiral.api.changeset.v1.RemoveComponent:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
            title: RemoveComponent
            required:
                - component
            additionalProperties: false
            description: |-
                RemoveComponent drops a component this draft adds, or destroys a live
                 one.
        admiral.api.changeset.v1.ReplaceValues:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                tree_json:
                    type: string
                    title: tree_json
                    maxLength: 1048576
                    minLength: 2
                    description: A JSON object.
                from_revision:
                    type: integer
                    title: from_revision
                    minimum: 0
                    format: int32
                    description: The head revision GetComponentValues reported; 0 for a draft with none.
            title: ReplaceValues
            required:
                - component
                - tree_json
            additionalProperties: false
            description: |-
                ReplaceValues makes a component's values exactly this tree: an upload.
                 Refused unless `from_revision` is the head the tree was downloaded at.
        admiral.api.changeset.v1.Revision:
            type: object
            properties:
                number:
                    type: integer
                    title: number
                    format: int32
                change_set_id:
                    type: string
                    title: change_set_id
                base_generation:
                    type: string
                    title: base_generation
                    format: int64
                    description: The environment's generation when the base was taken.
                cause:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.RevisionCause'
                    title: cause
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Violation'
                    title: violations
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                created_by_kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ActorKind'
                    title: created_by_kind
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Entry'
                    title: entries
                    description: Empty in a listing.
            title: Revision
            additionalProperties: false
        admiral.api.changeset.v1.RevisionCause:
            type: string
            title: RevisionCause
            enum:
                - REVISION_CAUSE_UNSPECIFIED
                - EDIT
                - REBASE
            description: |-
                RevisionCause says why a revision was cut. Only EDIT is written until
                 rebase exists.
        admiral.api.changeset.v1.SetNull:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
            title: SetNull
            required:
                - component
            additionalProperties: false
            description: SetNull writes null at a path, which clears a chart default.
        admiral.api.changeset.v1.SetPin:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: A tag or a `sha256:` digest.
            title: SetPin
            required:
                - component
                - reference
            additionalProperties: false
            description: |-
                SetPin moves a component to another revision of the same registry
                 component.
        admiral.api.changeset.v1.SetValue:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
                value_json:
                    type: string
                    title: value_json
                    maxLength: 1048576
                    minLength: 1
                    description: 'JSON text, not null: null is SetNull.'
            title: SetValue
            required:
                - component
                - value_json
            additionalProperties: false
            description: |-
                SetValue writes a value at a path, creating maps on the way, as
                 `helm --set` does. A map value replaces what was there.
        admiral.api.changeset.v1.UnsetValue:
            type: object
            properties:
                component:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                    maxItems: 32
                    minItems: 1
            title: UnsetValue
            required:
                - component
            additionalProperties: false
            description: UnsetValue removes a path, so the default applies.
        admiral.api.changeset.v1.ValueOp:
            type: object
            properties:
                path:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.PathSegment'
                    title: path
                op:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ValueOpKind'
                    title: op
                value_json:
                    type: string
                    title: value_json
                    description: JSON text; empty unless op is SET.
                from_present:
                    type: boolean
                    title: from_present
                    description: Whether the base had the key; a null there is present.
                from_value_json:
                    type: string
                    title: from_value_json
                    description: JSON text; empty when from_present is false.
            title: ValueOp
            additionalProperties: false
            description: ValueOp is one change at one path, with what the base held there.
        admiral.api.changeset.v1.ValueOpKind:
            type: string
            title: ValueOpKind
            enum:
                - VALUE_OP_KIND_UNSPECIFIED
                - SET
                - SET_NULL
                - REMOVE
        admiral.api.changeset.v1.Violation:
            type: object
            properties:
                component:
                    type: string
                    title: component
                path:
                    type: string
                    title: path
                    description: 'Display form: `image.tag`, `ingress."a.b"`.'
                message:
                    type: string
                    title: message
            title: Violation
            additionalProperties: false
            description: |-
                Violation is one way a component's values fail its pinned revision's
                 contract.
        admiral.api.component.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the component (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this component belongs to (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this component is scoped to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        Component identifier within the (application, environment) pair (e.g.,
                         "vpc", "redis", "api-server"). Set at creation; no rename path today.
                         Referenced from peer components' template expressions
                         (`{{ .component.<name>.<output> }}`), `depends_on` lists, and the
                         variable namespace for outputs.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the component's purpose
                         (e.g., "Primary VPC for all environments" or "Redis cache layer").
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.component.v1.ComponentKind'
                    title: kind
                    description: |-
                        Whether this is an infrastructure or workload component. Derived from
                         the referenced module's type when the component is created, but stored
                         explicitly for filtering and to determine execution behavior.
                deletion_protection:
                    type: boolean
                    title: deletion_protection
                    description: When true, destroy operations are rejected for this component.
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: |-
                        The git ref / version selector this component deploys (branch, tag, or
                         commit SHA for git; version string for package sources). Seeded from the
                         catalog item's ref at create time and owned thereafter (copy-not-link).
                values_template:
                    type: string
                    title: values_template
                    maxLength: 65536
                    description: |-
                        Values template that maps configuration into the module's expected inputs.
                         This is a JSON-encoded object where keys are the module input names and
                         values are either literal values or template expressions.

                         Template expressions can reference:
                           - Variables: `{{ .var.DATABASE_URL }}`
                           - Component outputs: `{{ .component.vpc.vpc_id }}`
                           - Environment metadata: `{{ .env.name }}`

                         Example for a Terraform RDS module:
                           {
                             "vpc_id": "{{ .component.vpc.vpc_id }}",
                             "subnet_ids": "{{ .component.vpc.private_subnet_ids }}",
                             "instance_class": "{{ .var.RDS_INSTANCE_CLASS }}",
                             "engine_version": "15.4"
                           }

                         Example for a Helm chart:
                           {
                             "replicaCount": "{{ .var.REPLICA_COUNT }}",
                             "image.repository": "myorg/api-server",
                             "image.tag": "{{ .var.IMAGE_TAG }}"
                           }

                         The rendering engine resolves all expressions at deployment time using
                         the environment's variables and the outputs of upstream components.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component names that must complete successfully before this component
                         can be deployed. Must reference components within the same environment.
                         The run engine uses these, combined with implicit dependencies from
                         template expressions, to build the execution DAG.

                         Explicit depends_on is useful when there is a deployment-order dependency
                         that is not captured by output references (e.g., cert-manager must be
                         installed before any workload that uses TLS certificates).
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.component.v1.ComponentOutput'
                    title: outputs
                    description: |-
                        Declared outputs for this component. For infrastructure components
                         (Terraform), outputs are auto-discovered from the module and this field
                         is ignored. For workload components, outputs must be declared here to
                         be available for template expressions in other components.

                         See ComponentOutput for examples.
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this component (server-populated from token).
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the component was created.
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the component was last updated.
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.component.v1.ComponentInput'
                    title: inputs
                    description: |-
                        Declared inputs this component consumes -- the symmetric half of outputs.
                         Additive: the edge spec the impact-scoping work reads. Binding still flows
                         through values_template today.
                target:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.component.v1.ComponentTarget'
                    title: target
                    description: |-
                        Resolved placement: where this component deploys. Copied onto the component
                         from the reviewed Change at deploy time (copy-not-link); the run snapshots
                         it onto the revision. Exactly one shape is populated, by `kind`.
            title: Component
            additionalProperties: false
            description: |-
                Component represents a named, deployable unit within an application+environment
                 pair. It binds a module to a specific environment with configuration (values
                 template) that maps variables and other component outputs into the module's
                 expected inputs.

                 Components are scoped to (application, environment): each environment has
                 its own set of components. The same name may exist in multiple environments
                 with different module/version/values, supporting both the uniform-fleet case
                 (identical components stamped across envs) and the divergent case (Postgres
                 in cluster for dev, managed service for prod).

                 Components are the nodes in Admiral's dependency graph. Infrastructure
                 components produce auto-discovered outputs (Terraform outputs). Workload
                 components declare outputs explicitly. Other components consume these via
                 template expressions. The run engine resolves this DAG to determine
                 execution order.
            example:
                id: "d4e5f6a7-8901-2bcd-ef34-567890123456"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                name: "api-server"
                description: "Main API server deployed via Helm chart."
                kind: "COMPONENT_KIND_WORKLOAD"
                ref: "2.4.1"
                values_template: "{\"replicaCount\": \"{{ .var.REPLICA_COUNT }}\", \"image.tag\": \"{{ .var.IMAGE_TAG }}\"}"
                depends_on:
                    - "vpc"
                    - "redis"
                target:
                    agent_id: "1f2e3d4c-5b6a-7980-1234-567890abcdef"
                    namespace: "inventory-staging"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-16T09:00:00Z"
                updated_at: "2025-10-28T11:30:00Z"
        admiral.api.component.v1.ComponentInput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Input name. Must be a valid identifier (lowercase alphanumeric and
                         underscores, e.g. "database_url", "region").
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that binds this input's value -- typically a reference
                         to an environment variable or an upstream component's output, e.g.
                           "{{ .var.region }}"
                           "{{ .component.db.outputs.connection_string }}"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the input's purpose.
            title: ComponentInput
            additionalProperties: false
            description: |-
                ComponentInput is the symmetric half of ComponentOutput: a declared input
                 the component consumes, with the template expression that binds its value.
                 The declared inputs are the edge spec of the dependency DAG -- they make
                 impact scoping precise (which components reference a changed variable or an
                 upstream output). Today component inputs are bound through the single
                 values_template; this typed declaration is additive.
        admiral.api.component.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - COMPONENT_KIND_INFRASTRUCTURE
                - COMPONENT_KIND_WORKLOAD
            description: |-
                ComponentKind indicates whether the component provisions infrastructure
                 or deploys workloads. This is derived from the referenced module's type but
                 stored explicitly for filtering and to determine rendering and execution
                 behavior.
        admiral.api.component.v1.ComponentOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Output name used in template references. Must be a valid identifier
                         (lowercase alphanumeric and underscores, e.g., "service_host",
                         "connection_string"). Other components reference this as
                         `{{ .component.<component_name>.<output_name> }}`.
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that resolves to the output value after deployment.
                         Can reference environment metadata and the component's own release info.

                         Examples:
                           "{{ .release.name }}-redis-master.{{ .env.namespace }}.svc.cluster.local"
                           "{{ .release.name }}-redis:6379"
                           "http://{{ .release.name }}-grafana.{{ .env.namespace }}:3000"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the output's purpose.
            title: ComponentOutput
            additionalProperties: false
            description: |-
                ComponentOutput declares a named output value produced by a component.

                 For infrastructure components (Terraform), outputs are auto-discovered from
                 the module's output blocks and this field is ignored. Do not declare
                 outputs manually for Terraform components.

                 For workload components (Helm, Kustomize, manifests), outputs must be
                 declared explicitly here to make them available for template expressions
                 in other components (e.g., `{{ .component.cache.service_host }}`).

                 Output values are template expressions resolved after the component is
                 deployed. They typically reference well-known patterns from the deployed
                 resources (e.g., Kubernetes service DNS names, ConfigMap keys).
        admiral.api.component.v1.ComponentTarget:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    description: |-
                        The agent this component is placed on (UUID). A KUBERNETES agent for
                         WORKLOAD components; a TERRAFORM agent for INFRASTRUCTURE components.
                namespace:
                    type: string
                    title: namespace
                    description: |-
                        WORKLOAD only: the target namespace (defaults to the environment name
                         when empty).
            title: ComponentTarget
            additionalProperties: false
            description: |-
                ComponentTarget is a component's resolved placement on an agent, selected by
                 the component's kind. Authored on a Changeset Change and copied onto the
                 component (it is the source of truth at runtime, not the environment).
        admiral.api.credential.v1.AuthConfig:
            type: object
            anyOf:
                - type: object
                  properties:
                    basic_auth:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.BasicAuth'
                        title: basic_auth
                  title: basic_auth
                - type: object
                  properties:
                    bearer_token:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.BearerTokenAuth'
                        title: bearer_token
                  title: bearer_token
                - type: object
                  properties:
                    github_app:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.GitHubAppAuth'
                        title: github_app
                  title: github_app
                - type: object
                  properties:
                    ssh_key:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.credential.v1.SSHKeyAuth'
                        title: ssh_key
                  title: ssh_key
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - basic_auth
                        - required:
                            - bearer_token
                        - required:
                            - github_app
                        - required:
                            - ssh_key
                    - not:
                        oneOf:
                            - required:
                                - basic_auth
                            - required:
                                - bearer_token
                            - required:
                                - github_app
                            - required:
                                - ssh_key
            title: AuthConfig
            description: AuthConfig is the secret, one variant matching the credential's type.
        admiral.api.credential.v1.BasicAuth:
            type: object
            properties:
                username:
                    type: string
                    title: username
                    maxLength: 256
                    minLength: 1
                password:
                    type: string
                    title: password
                    maxLength: 4096
                    description: Write-only.
                    writeOnly: true
            title: BasicAuth
            additionalProperties: false
            description: |-
                BasicAuth is a username and password, or a username and a token that the
                 host takes as a password (a registry-scoped token, an app password).
        admiral.api.credential.v1.BearerTokenAuth:
            type: object
            properties:
                token:
                    type: string
                    title: token
                    maxLength: 4096
                    description: Write-only.
                    writeOnly: true
            title: BearerTokenAuth
            additionalProperties: false
            description: BearerTokenAuth is one token.
        admiral.api.credential.v1.CreateCredentialRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                description:
                    type: string
                    title: description
                    maxLength: 1024
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                    not:
                        enum:
                            - CREDENTIAL_TYPE_UNSPECIFIED
                    title: type
                auth_config:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                    title: auth_config
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                allowed_hosts:
                    type: array
                    items:
                        type: string
                        maxLength: 270
                        pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)*(:[0-9]{1,5})?$
                    title: allowed_hosts
                    maxItems: 32
                    uniqueItems: true
            title: CreateCredentialRequest
            required:
                - name
                - type
                - auth_config
            additionalProperties: false
        admiral.api.credential.v1.CreateCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: CreateCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.Credential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Unique within the tenant.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                    title: type
                    description: (IMMUTABLE) Immutable after creation.
                auth_config:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                    title: auth_config
                    description: Write-only. Empty in every response.
                    writeOnly: true
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
                allowed_hosts:
                    type: array
                    items:
                        type: string
                        maxLength: 270
                        pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?)*(:[0-9]{1,5})?$
                    title: allowed_hosts
                    maxItems: 32
                    uniqueItems: true
                    description: |-
                        Hosts this credential may be presented to, as a guard: empty means any
                         host its type fits; set means the platform refuses to present it
                         anywhere else, whatever it is attached to. Hostnames, optionally with
                         a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                         no path.
            title: Credential
            additionalProperties: false
            description: |-
                Credential is a registered credential's metadata. The secret is set
                 through `auth_config` and never read back; responses carry it empty.
        admiral.api.credential.v1.CredentialType:
            type: string
            title: CredentialType
            enum:
                - CREDENTIAL_TYPE_UNSPECIFIED
                - CREDENTIAL_TYPE_SSH_KEY
                - CREDENTIAL_TYPE_BASIC_AUTH
                - CREDENTIAL_TYPE_BEARER_TOKEN
                - CREDENTIAL_TYPE_GITHUB_APP
            description: |-
                CredentialType is the protocol family a credential is presented as. Each
                 fetch takes the families its protocol speaks: a module registry, an
                 archive and an OCI token take a bearer token; git over https, a Helm
                 repository and an OCI login take basic auth; git over ssh takes a key.
        admiral.api.credential.v1.DeleteCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    format: uuid
            title: DeleteCredentialRequest
            required:
                - credential_id
            additionalProperties: false
        admiral.api.credential.v1.DeleteCredentialResponse:
            type: object
            title: DeleteCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.GetCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    format: uuid
            title: GetCredentialRequest
            required:
                - credential_id
            additionalProperties: false
        admiral.api.credential.v1.GetCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: GetCredentialResponse
            additionalProperties: false
        admiral.api.credential.v1.GitHubAppAuth:
            type: object
            properties:
                app_id:
                    exclusiveMinimum: 0
                    type: string
                    title: app_id
                    format: int64
                    description: The app's numeric id, from the app's settings page.
                installation_id:
                    exclusiveMinimum: 0
                    type: string
                    title: installation_id
                    format: int64
                    description: The installation's numeric id, from the installation's URL.
                private_key:
                    type: string
                    title: private_key
                    maxLength: 16384
                    description: The app's PEM-encoded RSA private key. Write-only.
                    writeOnly: true
                api_url:
                    type: string
                    title: api_url
                    maxLength: 512
                    format: uri
                    description: |-
                        The REST API base, for GitHub Enterprise Server:
                         `https://github.acme.example/api/v3`. Empty is `https://api.github.com`.
            title: GitHubAppAuth
            additionalProperties: false
            description: |-
                GitHubAppAuth identifies a GitHub App installation and holds the app's
                 private key, from which the platform mints installation tokens.
        admiral.api.credential.v1.ListCredentialsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: Reserved for a filter expression; nothing reads it yet.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                    title: type
                    description: Only credentials of this type, when set.
            title: ListCredentialsRequest
            additionalProperties: false
        admiral.api.credential.v1.ListCredentialsResponse:
            type: object
            properties:
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credentials
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListCredentialsResponse
            additionalProperties: false
        admiral.api.credential.v1.SSHKeyAuth:
            type: object
            properties:
                private_key:
                    type: string
                    title: private_key
                    maxLength: 16384
                    description: Write-only.
                    writeOnly: true
                passphrase:
                    type: string
                    title: passphrase
                    maxLength: 1024
                    description: Write-only.
                    writeOnly: true
            title: SSHKeyAuth
            additionalProperties: false
            description: SSHKeyAuth is a PEM-encoded private key and its passphrase, if any.
        admiral.api.credential.v1.UpdateCredentialRequest:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        Paths from `description`, `labels`, `allowed_hosts`, `auth_config`.
                         Empty means every updatable field the message carries.
            title: UpdateCredentialRequest
            required:
                - credential
            additionalProperties: false
        admiral.api.credential.v1.UpdateCredentialResponse:
            type: object
            properties:
                credential:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credential
            title: UpdateCredentialResponse
            additionalProperties: false
        admiral.api.environment.v1.CreateEnvironmentRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application to create this environment for (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                         Unique within the application. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the environment's purpose.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering environments.
            title: CreateEnvironmentRequest
            required:
                - application_id
                - name
            additionalProperties: false
            description: CreateEnvironmentRequest contains the parameters for creating a new environment.
        admiral.api.environment.v1.CreateEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The created environment.
            title: CreateEnvironmentResponse
            additionalProperties: false
            description: CreateEnvironmentResponse contains the newly created environment.
        admiral.api.environment.v1.DeleteEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The unique identifier of the environment to delete (UUID).
                force:
                    type: boolean
                    title: force
                    description: |-
                        When true, bypass the children-exist check and cascade-delete all
                         run records (metadata only).
            title: DeleteEnvironmentRequest
            required:
                - environment_id
            additionalProperties: false
            description: DeleteEnvironmentRequest identifies an environment to delete.
        admiral.api.environment.v1.DeleteEnvironmentResponse:
            type: object
            title: DeleteEnvironmentResponse
            additionalProperties: false
            description: DeleteEnvironmentResponse is empty on success.
        admiral.api.environment.v1.Environment:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the environment (UUID).
                    readOnly: true
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this environment belongs to (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                         Unique within the application. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the environment's purpose
                         (e.g., "US East production serving live traffic" or
                         "Shared staging for QA validation before prod promotion").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering environments
                         (e.g., `{"region": "us-east-1", "tier": "production"}`).
                has_pending_changes:
                    type: boolean
                    title: has_pending_changes
                    description: |-
                        Whether the environment has configuration changes that have not yet been
                         deployed. Server-derived by comparing current resolved config (variables,
                         component settings, overrides, source versions) against the last
                         successful run's snapshot. False if no successful run exists yet (a
                         fresh environment with no runs returns false; use `last_deployed_at`
                         to distinguish "clean" from "never deployed").
                    readOnly: true
                last_deployed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_deployed_at
                    description: |-
                        When the last successful run for this environment completed. Absent if
                         no successful run has occurred yet.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this environment (server-populated from token).
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the environment was created.
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the environment was last updated.
                    readOnly: true
            title: Environment
            additionalProperties: false
            description: |-
                Environment represents a named deployment target for an application
                 (e.g., dev, staging, prod). Each environment carries its own configuration
                 and variables; promotion between environments is explicit.
            example:
                id: "e5f6a7b8-9012-3cde-f456-789012345678"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                name: "staging"
                description: "Shared staging environment for QA validation before production promotion."
                labels:
                    region: "us-east-1"
                    tier: "staging"
                has_pending_changes: true
                last_deployed_at: "2025-11-01T09:15:00Z"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-15T11:00:00Z"
                updated_at: "2025-11-02T14:30:00Z"
        admiral.api.environment.v1.EnvironmentComponent:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: Component name (stable identifier set at creation).
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    description: |-
                        What the component's pinned revision is (TERRAFORM, HELM, MANIFESTS),
                         denormalized from the registry.
                ref:
                    type: string
                    title: ref
                    description: The git ref / version selector the component deploys.
                last_revision_id:
                    type: string
                    title: last_revision_id
                    description: |-
                        ID of the last-succeeded revision for this component in this env, if
                         any (UUID). Empty when the component has never reached SUCCEEDED.
                last_revision_status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionStatus'
                    title: last_revision_status
                    description: |-
                        Status of the last revision (SUCCEEDED when populated). UNSPECIFIED
                         means the component has no last-succeeded revision yet.
                last_deployed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_deployed_at
                    description: When the last-succeeded revision completed.
            title: EnvironmentComponent
            additionalProperties: false
            description: |-
                EnvironmentComponent is a denormalized view of a deployed component for
                 `ListEnvironmentComponents`. It joins the component's HEAD with the
                 component's last-succeeded revision so the CLI can render an at-a-glance
                 status row without follow-up calls.
        admiral.api.environment.v1.GetEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The unique identifier of the environment (UUID).
            title: GetEnvironmentRequest
            required:
                - environment_id
            additionalProperties: false
            description: GetEnvironmentRequest identifies an environment to retrieve.
        admiral.api.environment.v1.GetEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The retrieved environment.
            title: GetEnvironmentResponse
            additionalProperties: false
            description: GetEnvironmentResponse contains the environment record.
        admiral.api.environment.v1.ListEnvironmentComponentsRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment whose components should be listed (UUID).
            title: ListEnvironmentComponentsRequest
            required:
                - environment_id
            additionalProperties: false
            description: |-
                ListEnvironmentComponentsRequest identifies the environment whose
                 components should be listed.
        admiral.api.environment.v1.ListEnvironmentComponentsResponse:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.EnvironmentComponent'
                    title: components
                    description: |-
                        Active (not soft-deleted) components attached to the environment, sorted
                         by name.
            title: ListEnvironmentComponentsResponse
            additionalProperties: false
            description: |-
                ListEnvironmentComponentsResponse returns every active component for the
                 environment, ordered by name.
        admiral.api.environment.v1.ListEnvironmentVariablesRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment whose variables should be listed (UUID).
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `key`: filter by variable key (supports prefix matching via ~=).
                           - `sensitive`: filter by sensitivity flag.
                           - `type`: filter by variable type (STRING, NUMBER, BOOLEAN, COMPLEX).
                           - `source`: filter by source (USER, INFRASTRUCTURE).

                         Example: `field['source'] = 'USER' AND field['sensitive'] = false`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of variables to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentVariablesRequest
            required:
                - environment_id
            additionalProperties: false
            description: |-
                ListEnvironmentVariablesRequest contains the environment ID, filters, and
                 pagination parameters.
        admiral.api.environment.v1.ListEnvironmentVariablesResponse:
            type: object
            properties:
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.variable.v1.Variable'
                    title: variables
                    description: The variables scoped to this environment. Sensitive values are masked.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListEnvironmentVariablesResponse
            additionalProperties: false
            description: ListEnvironmentVariablesResponse contains a page of variables.
        admiral.api.environment.v1.ListEnvironmentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `application_id`: filter by parent application (UUID).
                           - `name`: filter by environment name.
                           - `labels.key`: filter by label key.

                         Example: `field['application_id'] = '<uuid>' AND field['name'] = 'prod'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of environments to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentsRequest
            additionalProperties: false
            description: ListEnvironmentsRequest contains pagination and filter parameters.
        admiral.api.environment.v1.ListEnvironmentsResponse:
            type: object
            properties:
                environments:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environments
                    description: The list of environments.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListEnvironmentsResponse
            additionalProperties: false
            description: ListEnvironmentsResponse contains a page of environments.
        admiral.api.environment.v1.UpdateEnvironmentRequest:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: |-
                        The environment with updated fields.
                         Only fields specified in `update_mask` are updated.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `labels`.
            title: UpdateEnvironmentRequest
            required:
                - environment
            additionalProperties: false
            description: UpdateEnvironmentRequest contains the environment fields to update.
        admiral.api.environment.v1.UpdateEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The updated environment.
            title: UpdateEnvironmentResponse
            additionalProperties: false
            description: UpdateEnvironmentResponse contains the updated environment.
        admiral.api.healthcheck.v1.HealthcheckResponse:
            type: object
            title: HealthcheckResponse
            additionalProperties: false
            description: |-
                HealthcheckResponse is returned when the service is healthy.
                 An empty response indicates the service is operating normally.
        admiral.api.invitation.v1.CreateInvitationRequest:
            type: object
            properties:
                email:
                    type: string
                    title: email
                    maxLength: 254
                    format: email
                    description: Where the mail goes, and the address the user will be created with.
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    enum:
                        - USER_ROLE_ADMIN
                        - USER_ROLE_MEMBER
                    description: The role to hold on joining. ADMIN or MEMBER.
            title: CreateInvitationRequest
            required:
                - email
                - role
            additionalProperties: false
            description: CreateInvitationRequest invites one address into the caller's tenant.
        admiral.api.invitation.v1.CreateInvitationResponse:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
            title: CreateInvitationResponse
            additionalProperties: false
            description: CreateInvitationResponse carries the invitation, without its link.
        admiral.api.invitation.v1.Invitation:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID).
                    readOnly: true
                email:
                    type: string
                    title: email
                    description: The address the invitation was sent to.
                    readOnly: true
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    description: The role the person holds once they join. ADMIN or MEMBER.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.InvitationStatus'
                    title: status
                    readOnly: true
                invited_by:
                    type:
                        - string
                        - "null"
                    title: invited_by
                    description: |-
                        The member who issued it (UUID). Absent when it was issued by an operator
                         from outside the tenant.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
                    description: After this instant the link no longer works.
                    readOnly: true
                accepted_at:
                    oneOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                        - type: "null"
                    title: accepted_at
                    description: |-
                        When it was redeemed, and who it became. Both set together, only on
                         ACCEPTED.
                    readOnly: true
                accepted_user_id:
                    type:
                        - string
                        - "null"
                    title: accepted_user_id
                    readOnly: true
                revoked_at:
                    oneOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                        - type: "null"
                    title: revoked_at
                    description: When it was withdrawn or retired. Only on REVOKED.
                    readOnly: true
            title: Invitation
            additionalProperties: false
            description: |-
                Invitation is one person invited into the caller's tenant. Never carries
                 the link or its token.
        admiral.api.invitation.v1.InvitationStatus:
            type: string
            title: InvitationStatus
            enum:
                - INVITATION_STATUS_UNSPECIFIED
                - INVITATION_STATUS_PENDING
                - INVITATION_STATUS_ACCEPTED
                - INVITATION_STATUS_EXPIRED
                - INVITATION_STATUS_REVOKED
            description: InvitationStatus is where an invitation is in its life.
        admiral.api.invitation.v1.ListInvitationsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `email`: filter by address.
                           - `status`: filter by lifecycle status.

                         Example: `field['status'] = 'PENDING'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of invitations to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListInvitationsRequest
            additionalProperties: false
            description: ListInvitationsRequest pages through the caller's tenant's invitations.
        admiral.api.invitation.v1.ListInvitationsResponse:
            type: object
            properties:
                invitations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitations
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListInvitationsResponse
            additionalProperties: false
            description: ListInvitationsResponse contains a page of invitations.
        admiral.api.invitation.v1.RevokeInvitationRequest:
            type: object
            properties:
                invitation_id:
                    type: string
                    title: invitation_id
                    format: uuid
                    description: The invitation (UUID), from CreateInvitation or ListInvitations.
            title: RevokeInvitationRequest
            required:
                - invitation_id
            additionalProperties: false
            description: RevokeInvitationRequest names one invitation in the caller's tenant.
        admiral.api.invitation.v1.RevokeInvitationResponse:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
            title: RevokeInvitationResponse
            additionalProperties: false
            description: RevokeInvitationResponse carries the invitation as it now stands.
        admiral.api.registry.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    description: |-
                        The name as it is written: `cloud-sql`, or `payments/cloud-sql` once
                         team namespaces exist. Unique within the tenant. Immutable.
                    readOnly: true
                description:
                    type: string
                    title: description
                    maxLength: 1024
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Key-value metadata for filtering (e.g. `{"team": "payments",
                         "runtime": "terraform"}`), the same labels every Admiral resource carries.
                tags:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Tag'
                    title: tags
                    description: Every tag on the component, by name.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Component
            additionalProperties: false
            description: |-
                Component is a registry entry: a name, and the revisions and tags beneath
                 it.
        admiral.api.registry.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - TERRAFORM
                - HELM
                - MANIFESTS
            description: |-
                ComponentKind is what a revision's bundle is, detected by inspection at
                 publish: a Chart.yaml means HELM, .tf files mean TERRAFORM, anything else
                 that is Kubernetes YAML means MANIFESTS.
        admiral.api.registry.v1.ComponentLabels:
            type: object
            properties:
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
            title: ComponentLabels
            additionalProperties: false
            description: |-
                ComponentLabels wraps a label map so its presence in an update can be told
                 from an empty map: present and empty clears the labels.
        admiral.api.registry.v1.Contract:
            type: object
            properties:
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractInput'
                    title: inputs
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractOutput'
                    title: outputs
            title: Contract
            additionalProperties: false
            description: |-
                Contract is what a bundle takes and gives. The shape here is what static
                 inspection can produce from any Terraform module or Helm chart; the curated
                 format adds to it without removing anything.
        admiral.api.registry.v1.ContractInput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                type:
                    type: string
                    title: type
                    description: |-
                        The type as the bundle declares it: a Terraform type expression, or for a
                         chart one of bool, number, string, list, object or null. A chart's full
                         constraint is in schema.
                description:
                    type: string
                    title: description
                required:
                    type: boolean
                    title: required
                    description: True when the bundle gives it no default.
                default:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    title: default
                    description: The declared default, when there is one.
                sensitive:
                    type: boolean
                    title: sensitive
                    description: |-
                        The value is a secret: never rendered in review, and resolved by the
                         runner from a reference rather than stored in the change set.
                ephemeral:
                    type: boolean
                    title: ephemeral
                    description: |-
                        The value must not land in plan or state (Terraform 1.10+ ephemeral
                         inputs). Implies sensitive.
                nullable:
                    type:
                        - boolean
                        - "null"
                    title: nullable
                    description: |-
                        Whether null is an accepted value. Unset when the bundle does not say,
                         which is a chart input with no schema.
                deprecated:
                    type: string
                    title: deprecated
                    description: The bundle's own deprecation message for this input.
                validations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractValidation'
                    title: validations
                    description: A Terraform variable's validation blocks, in declaration order.
                schema:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Struct'
                    title: schema
                    description: |-
                        The JSON Schema a chart's values.schema.json declares for this input,
                         verbatim, so a value can be checked the way Helm will check it.
            title: ContractInput
            additionalProperties: false
            description: ContractInput is one value the bundle accepts.
        admiral.api.registry.v1.ContractOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                description:
                    type: string
                    title: description
                sensitive:
                    type: boolean
                    title: sensitive
            title: ContractOutput
            additionalProperties: false
            description: ContractOutput is one value the bundle produces.
        admiral.api.registry.v1.ContractValidation:
            type: object
            properties:
                condition:
                    type: string
                    title: condition
                error_message:
                    type: string
                    title: error_message
            title: ContractValidation
            additionalProperties: false
            description: |-
                ContractValidation is one validation block on a Terraform variable, as
                 written. Evaluating the condition needs the Terraform language runtime,
                 which the registry does not run.
        admiral.api.registry.v1.DeleteComponentRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
            title: DeleteComponentRequest
            required:
                - component_id
            additionalProperties: false
            description: DeleteComponentRequest identifies the component to retire.
        admiral.api.registry.v1.DeleteComponentResponse:
            type: object
            title: DeleteComponentResponse
            additionalProperties: false
            description: DeleteComponentResponse is empty.
        admiral.api.registry.v1.DeleteTagRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                name:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: DeleteTagRequest
            required:
                - component_id
                - name
            additionalProperties: false
            description: DeleteTagRequest identifies a floating tag to remove.
        admiral.api.registry.v1.DeleteTagResponse:
            type: object
            title: DeleteTagResponse
            additionalProperties: false
            description: DeleteTagResponse is empty.
        admiral.api.registry.v1.Finding:
            type: object
            properties:
                severity:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.FindingSeverity'
                    title: severity
                source:
                    type: string
                    title: source
                    description: 'What produced it: `provider-constraint`, `checkov`, `trivy`, `image-ref`.'
                code:
                    type: string
                    title: code
                    description: |-
                        The producer's own identifier for the rule, when it has one
                         (e.g. `CKV_AWS_18`).
                message:
                    type: string
                    title: message
                path:
                    type: string
                    title: path
                    description: Where in the bundle, when it applies.
            title: Finding
            additionalProperties: false
            description: Finding is one thing the publish gate noticed.
        admiral.api.registry.v1.FindingSeverity:
            type: string
            title: FindingSeverity
            enum:
                - FINDING_SEVERITY_UNSPECIFIED
                - INFO
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
            description: FindingSeverity ranks what the publish gate found.
        admiral.api.registry.v1.GetComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 127
                    minLength: 1
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?/)?[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: '`cloud-sql`, or `namespace/cloud-sql`.'
            title: GetComponentRequest
            required:
                - name
            additionalProperties: false
            description: GetComponentRequest identifies a component by name.
        admiral.api.registry.v1.GetComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: GetComponentResponse
            additionalProperties: false
            description: GetComponentResponse contains the component with its tags.
        admiral.api.registry.v1.GetRevisionRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: |-
                        A tag name (`v1.2.0`, `latest`) or a digest (`sha256:<hex>`). A digest
                         is recognised by its prefix; everything else is looked up as a tag.
            title: GetRevisionRequest
            required:
                - component_id
                - reference
            additionalProperties: false
            description: GetRevisionRequest identifies a revision by reference.
        admiral.api.registry.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
            title: GetRevisionResponse
            additionalProperties: false
            description: GetRevisionResponse contains the revision.
        admiral.api.registry.v1.ListComponentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by name.
                           - `description`: filter by description.
                           - `labels`: filter by label key/value.

                         Example: `field['labels']['team'] = 'payments'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of components to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListComponentsRequest
            additionalProperties: false
            description: ListComponentsRequest pages through the registry.
        admiral.api.registry.v1.ListComponentsResponse:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: components
                    description: Listed without their tags; GetComponent carries those.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListComponentsResponse
            additionalProperties: false
            description: ListComponentsResponse contains a page of components.
        admiral.api.registry.v1.ListRevisionsRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression. Filterable fields:
                           - `kind`: TERRAFORM, HELM, MANIFESTS.
                           - `status`: PUBLISHED, DEPRECATED, REVOKED.

                         Example: `field['status'] = 'PUBLISHED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListRevisionsRequest
            required:
                - component_id
            additionalProperties: false
            description: ListRevisionsRequest pages through one component's revisions.
        admiral.api.registry.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revisions
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListRevisionsResponse
            additionalProperties: false
            description: ListRevisionsResponse contains a page of revisions, newest first.
        admiral.api.registry.v1.Pin:
            type: object
            properties:
                source:
                    type: string
                    title: source
                    description: The source as the bundle declared it, before rewriting.
                constraint:
                    type: string
                    title: constraint
                    description: The constraint that was asked for, when any.
                resolved:
                    type: string
                    title: resolved
                    description: 'What it resolved to: an exact version or commit.'
            title: Pin
            additionalProperties: false
            description: Pin is one dependency the closure step resolved and vendored.
        admiral.api.registry.v1.PresentedCredential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                name:
                    type: string
                    title: name
                hosts:
                    type: array
                    items:
                        type: string
                    title: hosts
                    description: The hosts it was presented to during this pull.
            title: PresentedCredential
            additionalProperties: false
            description: |-
                PresentedCredential is one credential a pull presented, as it was named at
                 the time; the credential may since have been renamed or deleted.
        admiral.api.registry.v1.Provenance:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ProvenanceKind'
                    title: kind
                uri:
                    type: string
                    title: uri
                    description: |-
                        The repository or location the bytes were read from: a git remote URL, a
                         Helm repository URL, an OCI reference. Empty for a local publish with no
                         remote.
                ref:
                    type: string
                    title: ref
                    description: The ref that was asked for (tag, branch, chart version), when any.
                commit:
                    type: string
                    title: commit
                    description: 'What the ref resolved to: a commit SHA, or the exact chart version.'
                path:
                    type: string
                    title: path
                    description: |-
                        The path within the source the bundle was taken from. Empty means the
                         root.
                dirty:
                    type: boolean
                    title: dirty
                    description: |-
                        The working copy carried uncommitted changes when it was published.
                         Only meaningful for LOCAL, and only ever true when the CLI said so.
                pins:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Pin'
                    title: pins
                    description: |-
                        Every remote module or chart the closure step vendored into the bundle,
                         pinned to what it resolved.
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.PresentedCredential'
                    title: credentials
                    description: |-
                        The credentials the platform presented while fetching, for PULL: which
                         secret reached which hosts. Lineage, not a grant; a later pull attaches
                         its own. Set by the server; ignored on a publish request.
                    readOnly: true
                commit_message:
                    type: string
                    title: commit_message
                    maxLength: 4096
                    description: |-
                        The message of the commit that produced these bytes, as written, so a
                         reader deciding whether to move to this revision can see what changed.
                         Captured at publish because it cannot be recovered after a force-push or
                         once the source is gone. Empty when there is no commit, or upstream
                         carried no notes.
                commit_author:
                    type: string
                    title: commit_author
                    maxLength: 256
                    description: Who wrote that commit, by name. Not the email address.
            title: Provenance
            additionalProperties: false
            description: |-
                Provenance is where a revision's bytes came from: the audit trail behind
                 the digest.
        admiral.api.registry.v1.ProvenanceKind:
            type: string
            title: ProvenanceKind
            enum:
                - PROVENANCE_KIND_UNSPECIFIED
                - LOCAL
                - GIT
                - PULL
            description: ProvenanceKind is how the bytes arrived.
        admiral.api.registry.v1.PublishComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        The component name to publish under. Created on first use. Bare
                         (`cloud-sql`), which resolves to the default namespace.
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    description: |-
                        The kind, when the caller knows better than inspection. UNSPECIFIED
                         means detect.
                tags:
                    type: array
                    items:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                    title: tags
                    maxItems: 16
                    description: Tags to set on the resulting revision (e.g. `v1.2.0`, `latest`).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Description and labels for the component. Applied when the publish
                         creates the component; ignored when it already exists, since a publish is
                         not the place to edit metadata. UpdateComponent is.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                provenance:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance'
                    title: provenance
                    description: |-
                        What the caller knows about where the bytes came from. The server
                         records the kind as LOCAL for a CLI upload whatever is claimed here; the
                         uri, ref, commit, path and dirty flag are kept as the caller's
                         assertion.
                bundle:
                    type: string
                    title: bundle
                    maxLength: 67108864
                    minLength: 1
                    format: byte
                    description: 'The bundle: a gzipped tar of the component root. At most 64 MiB.'
            title: PublishComponentRequest
            required:
                - name
                - bundle
            additionalProperties: false
            description: PublishComponentRequest carries what is being published and the bytes.
        admiral.api.registry.v1.PublishComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
                unchanged:
                    type: boolean
                    title: unchanged
                    description: |-
                        True when the digest was already published under this name and nothing
                         was written. Tags in the request were still applied.
            title: PublishComponentResponse
            additionalProperties: false
            description: PublishComponentResponse is the recorded revision.
        admiral.api.registry.v1.PullComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: |-
                        Empty means the artifact's own name: the chart's, the module's, the
                         repository's or directory's. Bare, which resolves to the default
                         namespace.
                source:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource'
                    title: source
                credential_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                    title: credential_ids
                    maxItems: 16
                    uniqueItems: true
                    description: |-
                        The credentials this pull may present, chosen by the caller. Each is
                         presented only where its type fits and its `allowed_hosts` permit. A
                         fetch that reaches a host none of them covers fails naming the host.
                tags:
                    type: array
                    items:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                    title: tags
                    maxItems: 16
                    description: |-
                        Tags to set on the resulting revision. A chart's version and a
                         module's resolved version are applied as tags whether or not named.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Applied when the pull creates the component; ignored otherwise.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
            title: PullComponentRequest
            required:
                - source
            additionalProperties: false
        admiral.api.registry.v1.PullComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
                unchanged:
                    type: boolean
                    title: unchanged
                    description: The resolution was already published under this name; nothing was written.
            title: PullComponentResponse
            additionalProperties: false
        admiral.api.registry.v1.PullSource:
            type: object
            anyOf:
                - type: object
                  properties:
                    archive:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.Archive'
                        title: archive
                  title: archive
                - type: object
                  properties:
                    git_tree:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.GitTree'
                        title: git_tree
                  title: git_tree
                - type: object
                  properties:
                    helm_chart:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.HelmChart'
                        title: helm_chart
                  title: helm_chart
                - type: object
                  properties:
                    oci_chart:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.OCIChart'
                        title: oci_chart
                  title: oci_chart
                - type: object
                  properties:
                    registry_module:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.RegistryModule'
                        title: registry_module
                  title: registry_module
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - archive
                        - required:
                            - git_tree
                        - required:
                            - helm_chart
                        - required:
                            - oci_chart
                        - required:
                            - registry_module
                    - not:
                        oneOf:
                            - required:
                                - archive
                            - required:
                                - git_tree
                            - required:
                                - helm_chart
                            - required:
                                - oci_chart
                            - required:
                                - registry_module
            title: PullSource
            description: |-
                PullSource names an artifact to pull. One variant. The kind of the
                 resulting component follows from it: a chart from OCI or a Helm
                 repository, a module from a module registry, whatever inspection finds in
                 a git tree or an archive.
        admiral.api.registry.v1.PullSource.Archive:
            type: object
            properties:
                url:
                    type: string
                    title: url
                    maxLength: 512
                    format: uri
            title: Archive
            required:
                - url
            additionalProperties: false
            description: An archive at a URL, unpacked by its extension.
        admiral.api.registry.v1.PullSource.GitTree:
            type: object
            properties:
                url:
                    type: string
                    title: url
                    maxLength: 512
                    format: uri
                    description: '`https://github.com/acme/infra.git`, `ssh://git@github.com/acme/infra.git`.'
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: A branch, tag or commit. Empty is the default branch.
                path:
                    type: string
                    title: path
                    maxLength: 512
                    description: |
                        A directory within the repository. Empty is the root.
                        string.not_contains = ".."
            title: GitTree
            required:
                - url
            additionalProperties: false
            description: A git repository at a ref, optionally a directory of it.
        admiral.api.registry.v1.PullSource.HelmChart:
            type: object
            properties:
                repository:
                    type: string
                    title: repository
                    maxLength: 512
                    format: uri
                chart:
                    type: string
                    title: chart
                    maxLength: 63
                    pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: HelmChart
            required:
                - repository
                - chart
                - version
            additionalProperties: false
            description: |-
                A chart in an HTTP repository: the repository URL, the chart's name in
                 its index, and an exact version.
        admiral.api.registry.v1.PullSource.OCIChart:
            type: object
            properties:
                reference:
                    type: string
                    title: reference
                    maxLength: 512
                    minLength: 7
                    description: |
                        string.prefix = "oci://"
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: OCIChart
            required:
                - reference
                - version
            additionalProperties: false
            description: |-
                A chart in an OCI registry: `oci://ghcr.io/argoproj/argo-helm/argo-cd`
                 at a version, which is its tag.
        admiral.api.registry.v1.PullSource.RegistryModule:
            type: object
            properties:
                address:
                    type: string
                    title: address
                    maxLength: 512
                    minLength: 5
                version:
                    type: string
                    title: version
                    maxLength: 128
            title: RegistryModule
            required:
                - address
            additionalProperties: false
            description: |-
                A module in a module registry: the address as a module call would
                 write it (`GoogleCloudPlatform/cloud-armor/google`, optionally
                 host-qualified, optionally `//subdir`) and a version constraint, which
                 resolves to the newest version satisfying it at pull time, or exactly
                 one version.
        admiral.api.registry.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID). Internal handle; references use the digest.
                    readOnly: true
                component_id:
                    type: string
                    title: component_id
                    description: The component this revision belongs to (UUID).
                    readOnly: true
                digest:
                    type: string
                    title: digest
                    description: 'The identity: SHA-256 of the normalized bundle, as `sha256:<hex>`.'
                    readOnly: true
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    readOnly: true
                size_bytes:
                    type: string
                    title: size_bytes
                    format: int64
                    description: Size of the stored bundle in bytes.
                    readOnly: true
                contract:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Contract'
                    title: contract
                    description: |-
                        The inputs and outputs the bundle exposes. Inferred from the bundle at
                         publish; curated by a publisher once the contract format lands.
                    readOnly: true
                provenance:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance'
                    title: provenance
                    description: Where the bytes came from.
                    readOnly: true
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Finding'
                    title: findings
                    description: |-
                        What the publish gate found. Informational findings do not block a
                         publish; a revision with findings is published with them attached, and
                         the findings delta between two revisions is what an upgrade review reads.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.RevisionStatus'
                    title: status
                    readOnly: true
                status_changed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: status_changed_at
                    description: |-
                        When and why the status last changed. Unset on a revision that has only
                         ever been PUBLISHED.
                    readOnly: true
                status_reason:
                    type: string
                    title: status_reason
                    readOnly: true
                tags:
                    type: array
                    items:
                        type: string
                        readOnly: true
                    title: tags
                    description: The tags currently naming this revision.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
            title: Revision
            additionalProperties: false
            description: Revision is one published artifact. Immutable except for its status.
        admiral.api.registry.v1.RevisionStatus:
            type: string
            title: RevisionStatus
            enum:
                - REVISION_STATUS_UNSPECIFIED
                - PUBLISHED
                - DEPRECATED
                - REVOKED
            description: RevisionStatus is a revision's lifecycle. There is no deleted state.
        admiral.api.registry.v1.SetRevisionStatusRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                digest:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
                    description: |-
                        `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                         a floating tag might name different bytes by the time anyone reads the
                         reason.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.RevisionStatus'
                    not:
                        enum:
                            - REVISION_STATUS_UNSPECIFIED
                    title: status
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    minLength: 1
                    description: |-
                        Shown to anyone who adopts or tries to adopt the revision, and to every
                         environment running it.
            title: SetRevisionStatusRequest
            required:
                - component_id
                - digest
                - status
                - reason
            additionalProperties: false
            description: |-
                SetRevisionStatusRequest names a revision by digest, its new status, and
                 why.
        admiral.api.registry.v1.SetRevisionStatusResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
            title: SetRevisionStatusResponse
            additionalProperties: false
            description: SetRevisionStatusResponse contains the revision with its new status.
        admiral.api.registry.v1.SetTagRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                name:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                digest:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
                    description: The revision to name, as `sha256:<hex>`.
            title: SetTagRequest
            required:
                - component_id
                - name
                - digest
            additionalProperties: false
            description: SetTagRequest points a tag at a revision.
        admiral.api.registry.v1.SetTagResponse:
            type: object
            properties:
                tag:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Tag'
                    title: tag
            title: SetTagResponse
            additionalProperties: false
            description: SetTagResponse contains the tag as it now stands.
        admiral.api.registry.v1.Tag:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: As written after the colon in `cloud-sql:v1.2.0`.
                    readOnly: true
                digest:
                    type: string
                    title: digest
                    description: The revision it names, as `sha256:<hex>`.
                    readOnly: true
                immutable:
                    type: boolean
                    title: immutable
                    description: |-
                        True for a semver tag: it never moves once assigned. Decided from the
                         name, so two tags with the same name are always the same class.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Tag
            additionalProperties: false
            description: Tag is a name pointing at a revision.
        admiral.api.registry.v1.UpdateComponentRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                labels:
                    oneOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentLabels'
                        - type: "null"
                    title: labels
                    description: Replaces the label set entirely when present.
            title: UpdateComponentRequest
            required:
                - component_id
            additionalProperties: false
            description: |-
                UpdateComponentRequest carries the fields to change. Omitted fields are
                 left as they are.
        admiral.api.registry.v1.UpdateComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: UpdateComponentResponse
            additionalProperties: false
            description: UpdateComponentResponse contains the updated component.
        admiral.api.run.v1.ApplyRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run to apply. UUID or `run-<suffix>` display ID.
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: Optional message describing the apply (e.g., "Approved by @martin").
            title: ApplyRunRequest
            required:
                - run_id
            additionalProperties: false
            description: ApplyRunRequest transitions a planned run to apply phase.
        admiral.api.run.v1.ApplyRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: |-
                        The run with status advanced to APPLYING. Revisions that were
                         PLANNED are now APPLYING.
            title: ApplyRunResponse
            additionalProperties: false
            description: ApplyRunResponse contains the run after apply jobs are dispatched.
        admiral.api.run.v1.ArtifactKind:
            type: string
            title: ArtifactKind
            enum:
                - ARTIFACT_KIND_UNSPECIFIED
                - ARTIFACT_KIND_SOURCE_BUNDLE
                - ARTIFACT_KIND_PLAN
                - ARTIFACT_KIND_MANIFEST_BUNDLE
            description: ArtifactKind types an artifact a phase produces or consumes.
        admiral.api.run.v1.ArtifactRef:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ArtifactKind'
                    title: kind
                    description: The kind of artifact.
                key:
                    type: string
                    title: key
                    description: Storage key (object-storage path) where the artifact bytes live.
                checksum:
                    type: string
                    title: checksum
                    description: |-
                        SHA-256 checksum of the artifact for integrity verification. May be empty
                         for artifacts not yet verified.
            title: ArtifactRef
            additionalProperties: false
            description: |-
                ArtifactRef addresses one artifact an execution produced: its kind, the
                 storage key where the bytes live, and a checksum for fail-closed
                 verification.
        admiral.api.run.v1.CancelRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run to cancel. UUID or `run-<suffix>` display ID.
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    description: Optional reason for cancellation.
            title: CancelRunRequest
            required:
                - run_id
            additionalProperties: false
            description: CancelRunRequest cancels an in-progress run.
        admiral.api.run.v1.CancelRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: The canceled run.
            title: CancelRunResponse
            additionalProperties: false
            description: CancelRunResponse contains the updated run.
        admiral.api.run.v1.ChangeSummary:
            type: object
            properties:
                creates:
                    type: integer
                    title: creates
                    format: int32
                    description: Number of resources to be created.
                updates:
                    type: integer
                    title: updates
                    format: int32
                    description: Number of resources to be updated in place.
                deletes:
                    type: integer
                    title: deletes
                    format: int32
                    description: Number of resources to be deleted.
                noops:
                    type: integer
                    title: noops
                    format: int32
                    description: Number of resources left unchanged (no-op).
            title: ChangeSummary
            additionalProperties: false
            description: |-
                ChangeSummary is the normalized, executor-agnostic count of what an
                 execution does: creates, updates, deletes, and no-ops. Every executor maps
                 its native result onto this shape -- terraform's +/~/- plan counts and
                 kubernetes server-side-apply created/configured/deleted.
        admiral.api.run.v1.CreateRunRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application to run (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: Optional message describing this run.
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        Optional: run from a prior run's configuration snapshots instead of
                         from the current component HEAD. When set, each revision is seeded
                         from the source run's revision for the same component (catalog_item_id,
                         version, resolved_values, source_id, working_directory). This is the
                         rollback mechanism: re-plan and re-apply a known-good configuration
                         against the current infrastructure state.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        Optional: run the entries and variable changes captured in a change
                         set. When set, the component set and variable overlay are sourced from
                         the change set instead of the application's full component list. The
                         change set must be OPEN and target the same (application, environment).
            title: CreateRunRequest
            required:
                - application_id
                - environment_id
            additionalProperties: false
            description: CreateRunRequest triggers a new run.
        admiral.api.run.v1.CreateRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: The created run. Status will be PENDING initially.
            title: CreateRunResponse
            additionalProperties: false
            description: CreateRunResponse contains the newly created run.
        admiral.api.run.v1.EngineOutput:
            type: object
            properties:
                value:
                    type: string
                    title: value
                    description: |-
                        The output value, serialized as a string. Complex values (lists, maps)
                         are JSON-encoded.
                type:
                    type: string
                    title: type
                    description: Engine type descriptor (e.g. "string", "number", "list(string)").
                sensitive:
                    type: boolean
                    title: sensitive
                    description: Whether the executor marked this output as sensitive.
            title: EngineOutput
            additionalProperties: false
            description: |-
                EngineOutput is a single output value captured from an executor after a
                 successful apply (e.g. `terraform output -json`). Engine-agnostic: the
                 (value, type, sensitive) shape generalizes across executors. Lives in run/v1
                 so it can be shared by the TERRAFORM and KUBERNETES agent report paths via
                 ExecutionReport.
        admiral.api.run.v1.ExecutionReport:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ExecutionStatus'
                    title: status
                    description: Terminal status of the phase.
                error_message:
                    type: string
                    title: error_message
                    description: Error message if the phase failed. Empty on success.
                summary:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ChangeSummary'
                    title: summary
                    description: Normalized change counts (create/update/delete/noop).
                outputs:
                    type: object
                    title: outputs
                    additionalProperties:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.run.v1.EngineOutput'
                        title: value
                    description: Outputs captured after a successful apply. Keys are output names.
                artifact:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ArtifactRef'
                    title: artifact
                    description: |-
                        Optional reference to an artifact this phase produced (e.g. a terraform
                         PLAN). Recorded into the revision's artifact set when present.
                transcript:
                    type: string
                    title: transcript
                    description: |-
                        The phase's human-readable execution log (e.g. terraform plan/apply
                         output). Persisted as the phase transcript. (Interim: live log streaming
                         moves to a dedicated channel in a later phase.)
                detail:
                    type: string
                    title: detail
                    format: byte
                    description: |-
                        Opaque, per-executor richness, never branched on by the orchestration
                         layer. JSON-encoded.
            title: ExecutionReport
            additionalProperties: false
            description: |-
                ExecutionReport is the executor-agnostic outcome of one revision phase --
                 the single report shape every executor maps its native result onto. The
                 TERRAFORM and KUBERNETES agents both report via this message.
        admiral.api.run.v1.ExecutionStatus:
            type: string
            title: ExecutionStatus
            enum:
                - EXECUTION_STATUS_UNSPECIFIED
                - EXECUTION_STATUS_SUCCEEDED
                - EXECUTION_STATUS_FAILED
            description: |-
                ExecutionStatus is the terminal outcome an executor reports for a phase.
                 Non-terminal progress (RUNNING) is observed server-side, not reported here.
        admiral.api.run.v1.GetRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision (UUID).
            title: GetRevisionRequest
            required:
                - run_id
                - revision_id
            additionalProperties: false
            description: GetRevisionRequest identifies a revision within a run.
        admiral.api.run.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Revision'
                    title: revision
                    description: The revision record with current status and artifacts.
            title: GetRevisionResponse
            additionalProperties: false
            description: GetRevisionResponse contains the revision record.
        admiral.api.run.v1.GetRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run. Either a UUID or a `run-<suffix>` display ID.
            title: GetRunRequest
            required:
                - run_id
            additionalProperties: false
            description: GetRunRequest identifies a run to retrieve.
        admiral.api.run.v1.GetRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: The run record with current status.
            title: GetRunResponse
            additionalProperties: false
            description: GetRunResponse contains the run record.
        admiral.api.run.v1.ListRevisionsRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run. UUID or `run-<suffix>` display ID.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of revisions to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListRevisionsRequest
            required:
                - run_id
            additionalProperties: false
            description: ListRevisionsRequest lists all revisions for a run.
        admiral.api.run.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.Revision'
                    title: revisions
                    description: The list of revisions, ordered by dependency graph (upstream first).
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListRevisionsResponse
            additionalProperties: false
            description: ListRevisionsResponse contains all revisions for a run.
        admiral.api.run.v1.ListRunsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `application_id`: runs for a specific application (UUID).
                           - `environment_id`: runs to a specific environment (UUID).
                           - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                           - `change_set_id`: runs for a specific change set (UUID).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of runs to return per page. Defaults to 50 when omitted or
                         0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListRunsRequest
            additionalProperties: false
            description: ListRunsRequest contains pagination and filter parameters.
        admiral.api.run.v1.ListRunsResponse:
            type: object
            properties:
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: runs
                    description: The list of runs, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListRunsResponse
            additionalProperties: false
            description: ListRunsResponse contains a page of runs.
        admiral.api.run.v1.RetryRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision to retry (UUID). Must be in FAILED status.
            title: RetryRevisionRequest
            required:
                - run_id
                - revision_id
            additionalProperties: false
            description: RetryRevisionRequest retries a failed revision.
        admiral.api.run.v1.RetryRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Revision'
                    title: revision
                    description: |-
                        The retried revision. Status resets and retry_count is incremented.
                         Downstream revisions that were BLOCKED will automatically unblock
                         if this revision succeeds.
            title: RetryRevisionResponse
            additionalProperties: false
            description: RetryRevisionResponse contains the updated revision.
        admiral.api.run.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the revision (UUID).
                run_id:
                    type: string
                    title: run_id
                    format: uuid
                    description: The run this revision belongs to (UUID).
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                    description: The component this revision is for (UUID).
                component_name:
                    type: string
                    title: component_name
                    description: Component name at the time of run (immutable semantic key).
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionKind'
                    title: kind
                    description: Component kind at the time of run (after override resolution).
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionStatus'
                    title: status
                    description: Lifecycle status of this revision.
                change_type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionChangeType'
                    title: change_type
                    description: |-
                        What type of change this revision represents relative to the previously
                         deployed state.
                previous_revision_id:
                    type: string
                    title: previous_revision_id
                    description: |-
                        The last succeeded revision for this (component, environment) at the
                         time this revision was created. Null for CREATE revisions.
                source_id:
                    type: string
                    title: source_id
                    description: |-
                        The source the module pointed to at the time of this revision (UUID).
                         Snapshotted so a rollback can re-fetch from the original source even if
                         the module's source binding is later edited. Execution today resolves
                         fetch location through the live module; this field is the audit anchor.
                ref:
                    type: string
                    title: ref
                    description: The git ref / version selector deployed (the component's ref at snapshot).
                resolved_values:
                    type: string
                    title: resolved_values
                    description: |-
                        The resolved values template snapshot: the values_template with all
                         variable references and component output references fully resolved.
                         Stored for audit: shows exactly what inputs were used. Sensitive
                         variable values are masked in API responses.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component IDs that this revision depends on. Populated from the resolved
                         depends_on list plus implicit dependencies from template expressions.
                blocked_by:
                    type: array
                    items:
                        type: string
                    title: blocked_by
                    description: |-
                        Component IDs that are blocking this revision. Only populated when
                         status is BLOCKED; indicates which upstream components failed.
                plan_summary:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ChangeSummary'
                    title: plan_summary
                    description: |-
                        The normalized change counts (creates/updates/deletes/noops) this
                         revision's plan computed. Populated after planning. Engine-agnostic.
                available_phases:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.RevisionPhase'
                    title: available_phases
                    description: |-
                        Phase labels for which a transcript has been stored, in the order they
                         ran. Populated as each phase completes (a revision that planned and then
                         applied carries `[REVISION_PHASE_PLAN, REVISION_PHASE_APPLY]`). Fetch a
                         phase's transcript via
                         `GET /api/v1/runs/{run_id}/revisions/{revision_id}/{phase}`.
                error_message:
                    type: string
                    title: error_message
                    description: Error message if the revision failed. Empty on success.
                retry_count:
                    type: integer
                    title: retry_count
                    format: int32
                    description: Number of retry attempts. Starts at 0 for the initial attempt.
                started_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: started_at
                    description: When the revision started execution (transitioned from PENDING/QUEUED).
                completed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: completed_at
                    description: When the revision finished (succeeded, failed, or canceled).
                working_directory:
                    type: string
                    title: working_directory
                    description: |-
                        Subdirectory within the delivered archive where the executor runs.
                         Empty means the archive root. Populated from the catalog item's path field
                         at snapshot time so that relative references resolve correctly.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the revision was created (same as run created_at).
                resolved_commit:
                    type: string
                    title: resolved_commit
                    description: |-
                        The concrete commit this revision resolved its ref to and pinned -- the
                         reproducibility anchor. `ref` is the intent (e.g. `main`); this is what
                         actually deployed. Populated when resolution is wired (a later WP).
                type:
                    type: string
                    title: type
                    description: |-
                        The deploy/engine type this revision runs (TERRAFORM/HELM/KUSTOMIZE/
                         MANIFEST), denormalized from the component at snapshot. Selects the
                         executor: the orchestration layer routes by this type, not by kind.
            title: Revision
            additionalProperties: false
            description: |-
                Revision represents an immutable, rendered artifact for a single component
                 within a run. Each revision tracks the full lifecycle from rendering
                 through execution, and stores references to the produced artifacts
                 (rendered manifests, binary plan files, etc.).

                 For infrastructure components (terraform-semantic engine, Terraform or
                 OpenTofu):
                   - Rendering produces the infrastructure source tree (.tf files and
                     auto-loaded tfvars) with resolved variable values.
                   - The engine's plan and apply phases are executed by the assigned
                     TERRAFORM agent (see JobBundle.engine for engine selection).
                   - The plan output is stored for visibility.
                   - Each component has its own state, stored via the configured backend.

                 For workload components (Helm, Kustomize, manifests):
                   - Rendering produces Kubernetes manifests (via helm template, kustomize
                     build, or raw file collection).
                   - Manifests are ordered (CRDs before resources, namespaces first).
                   - The rendered bundle is sent to the K8s agent for application.
        admiral.api.run.v1.RevisionChangeType:
            type: string
            title: RevisionChangeType
            enum:
                - REVISION_CHANGE_TYPE_UNSPECIFIED
                - REVISION_CHANGE_TYPE_CREATE
                - REVISION_CHANGE_TYPE_UPDATE
                - REVISION_CHANGE_TYPE_DESTROY
                - REVISION_CHANGE_TYPE_RECREATE
                - REVISION_CHANGE_TYPE_IMPORT
                - REVISION_CHANGE_TYPE_NO_CHANGE
            description: |-
                RevisionChangeType classifies the change a revision represents relative to
                 the previously deployed state for the same component.
        admiral.api.run.v1.RevisionKind:
            type: string
            title: RevisionKind
            enum:
                - REVISION_KIND_UNSPECIFIED
                - REVISION_KIND_INFRASTRUCTURE
                - REVISION_KIND_WORKLOAD
            description: |-
                RevisionKind mirrors ComponentKind but is stored on the revision to capture
                 the effective kind at run time (may differ from the component default
                 if an environment override changed the source type).
        admiral.api.run.v1.RevisionPhase:
            type: string
            title: RevisionPhase
            enum:
                - REVISION_PHASE_UNSPECIFIED
                - REVISION_PHASE_PLAN
                - REVISION_PHASE_APPLY
            description: |-
                RevisionPhase labels which phase of a revision's lifecycle produced a
                 retrievable transcript. Plan and apply are the only phases today; future
                 phases (e.g., import) extend this enum without changing the storage shape.
        admiral.api.run.v1.RevisionStatus:
            type: string
            title: RevisionStatus
            enum:
                - REVISION_STATUS_UNSPECIFIED
                - REVISION_STATUS_PENDING
                - REVISION_STATUS_QUEUED
                - REVISION_STATUS_PLANNING
                - REVISION_STATUS_PLANNED
                - REVISION_STATUS_APPLYING
                - REVISION_STATUS_SUCCEEDED
                - REVISION_STATUS_FAILED
                - REVISION_STATUS_BLOCKED
                - REVISION_STATUS_CANCELED
                - REVISION_STATUS_SUPERSEDED
                - REVISION_STATUS_DEFERRED
                - REVISION_STATUS_STALE
                - REVISION_STATUS_AWAITING_APPROVAL
            description: |-
                RevisionStatus represents the lifecycle status of a single component
                 revision within a run.
        admiral.api.run.v1.RevisionSummary:
            type: object
            properties:
                total:
                    type: integer
                    title: total
                    format: int32
                    description: Total number of component revisions in this run.
                succeeded:
                    type: integer
                    title: succeeded
                    format: int32
                    description: Number of revisions that completed successfully.
                failed:
                    type: integer
                    title: failed
                    format: int32
                    description: Number of revisions that failed.
                blocked:
                    type: integer
                    title: blocked
                    format: int32
                    description: Number of revisions that are blocked by upstream failures.
                running:
                    type: integer
                    title: running
                    format: int32
                    description: Number of revisions currently running (planning or applying).
                canceled:
                    type: integer
                    title: canceled
                    format: int32
                    description: Number of revisions that were canceled.
                pending:
                    type: integer
                    title: pending
                    format: int32
                    description: Number of revisions that have not started yet.
            title: RevisionSummary
            additionalProperties: false
            description: |-
                RevisionSummary provides aggregate counts of revision statuses within a
                 run, enabling quick status display without loading all revisions.
        admiral.api.run.v1.Run:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the run (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application being deployed (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RunStatus'
                    title: status
                    description: Composite status derived from all component revisions.
                triggered_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: triggered_by
                    description: The user or agent that triggered the run (server-populated from token).
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: |-
                        Optional message describing the run (e.g., "Deploying v2.1.0
                         with new caching layer" or "Rolling back to stable after API errors").
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        If this run was created as a rollback from a prior run, this field
                         contains the source run's UUID. Empty for normal runs.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        The changeset that was deployed (UUID). Absent for pre-changeset runs
                         and reconcile (no-changeset) runs.
                revision_summary:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionSummary'
                    title: revision_summary
                    description: Summary counts for quick status display.
                completed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: completed_at
                    description: |-
                        When the run finished (all revisions completed, failed, or canceled).
                         Absent while the run is in progress.
                display_id:
                    type: string
                    title: display_id
                    description: |-
                        Typed display identifier of the form `run-<12-char-suffix>` (e.g.,
                         `run-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                         over `id` for user-facing references; lookups accept either form.
                application_name:
                    type: string
                    title: application_name
                    description: |-
                        Display name of the parent application. Denormalized for display.
                         Read-only; ignored on writes.
                environment_name:
                    type: string
                    title: environment_name
                    description: |-
                        Display name of the parent environment. Denormalized for display.
                         Read-only; ignored on writes.
                change_set_display_id:
                    type: string
                    title: change_set_display_id
                    description: |-
                        Display ID of the changeset this run deployed (`cs-<suffix>`).
                         Denormalized for display. Empty when `change_set_id` is empty
                         (pre-changeset runs, reconcile runs). Read-only.
                change_set_title:
                    type: string
                    title: change_set_title
                    description: |-
                        Title of the changeset this run deployed. Denormalized for display.
                         Empty when `change_set_id` is empty. Read-only.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the run was created.
            title: Run
            additionalProperties: false
            description: |-
                Run represents a single execution against an application+environment.
                 Each run produces one Revision per component. The run tracks the composite
                 status across all revisions and provides the audit trail for what was
                 executed, when, and by whom.

                 Run records are immutable once created. There is no UpdateRun RPC and no
                 `updated_at` field. The composite `status`, `revision_summary`, and
                 `completed_at` fields are server-maintained as revisions progress;
                 everything else is fixed at creation time. To change what is deployed,
                 create a new run.
            example:
                id: "7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b"
                display_id: "run-3k7m9p2q4rvw"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                status: "RUN_STATUS_SUCCEEDED"
                message: "Deploy v2.4.1 with updated ingress rules"
                triggered_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                revision_summary:
                    total: 3
                    succeeded: 3
                created_at: "2025-11-20T14:00:00Z"
                completed_at: "2025-11-20T14:12:00Z"
        admiral.api.run.v1.RunStatus:
            type: string
            title: RunStatus
            enum:
                - RUN_STATUS_UNSPECIFIED
                - RUN_STATUS_PENDING
                - RUN_STATUS_QUEUED
                - RUN_STATUS_PLANNING
                - RUN_STATUS_PLANNED
                - RUN_STATUS_APPLYING
                - RUN_STATUS_SUCCEEDED
                - RUN_STATUS_PARTIALLY_FAILED
                - RUN_STATUS_FAILED
                - RUN_STATUS_CANCELED
                - RUN_STATUS_SUPERSEDED
                - RUN_STATUS_STALE
                - RUN_STATUS_AWAITING_APPROVAL
            description: |-
                RunStatus represents the composite status of a run, derived from the
                 statuses of all its component revisions.
        admiral.api.tenant.v1.GetTenantRequest:
            type: object
            title: GetTenantRequest
            additionalProperties: false
            description: 'GetTenantRequest names nothing: the tenant is the caller''s own.'
        admiral.api.tenant.v1.GetTenantResponse:
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
                    title: tenant
            title: GetTenantResponse
            additionalProperties: false
        admiral.api.tenant.v1.Tenant:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID).
                    readOnly: true
                slug:
                    type: string
                    title: slug
                    description: URL-safe identifier, unique across Admiral. Fixed at creation.
                    readOnly: true
                display_name:
                    type: string
                    title: display_name
                    maxLength: 256
                    description: Human-readable name.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.TenantStatus'
                    title: status
                    description: Lifecycle state.
                    readOnly: true
                labels:
                    type: object
                    title: labels
                    additionalProperties:
                        type: string
                        title: value
                    description: Free-form labels for the customer's own use.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Tenant
            additionalProperties: false
            description: |-
                Tenant is the account as its own members see it: its identity, its lifecycle
                 state, and the settings they control. Operational detail about how the
                 account is run is not part of this view.
        admiral.api.tenant.v1.TenantStatus:
            type: string
            title: TenantStatus
            enum:
                - TENANT_STATUS_UNSPECIFIED
                - TENANT_STATUS_PENDING
                - TENANT_STATUS_ACTIVE
                - TENANT_STATUS_SUSPENDED
            description: |-
                TenantStatus is the account's lifecycle state. A caller sees it but cannot
                 set it: suspension and reactivation are imposed, not requested.
        admiral.api.tenant.v1.UpdateTenantRequest:
            type: object
            properties:
                display_name:
                    type:
                        - string
                        - "null"
                    title: display_name
                    maxLength: 256
                    description: New display name. Omit to leave unchanged.
                labels:
                    type: object
                    title: labels
                    additionalProperties:
                        type: string
                        title: value
                    description: Replaces all labels when present. Omit to leave unchanged.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        Which fields to apply. Present for forward compatibility as the mutable
                         surface grows.
            title: UpdateTenantRequest
            additionalProperties: false
            description: |-
                UpdateTenantRequest carries only the mutable fields. The tenant is the
                 caller's own, so there is no id here.
        admiral.api.tenant.v1.UpdateTenantResponse:
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
                    title: tenant
            title: UpdateTenantResponse
            additionalProperties: false
        admiral.api.user.v1.CreateApiKeyRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the key (e.g., "postman-testing").
                         Unique per user within the tenant. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        The scopes to grant this key. Must be scopes assignable to a user-bound key.
                         The server enforces that issued scopes are a subset of the caller's own
                         scopes. A key cannot grant more access than the user holds.
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
                    description: |-
                        Optional expiration time. If unset, the key does not expire.
                         Tenant policies may enforce a maximum lifetime.
            title: CreateApiKeyRequest
            required:
                - name
            additionalProperties: false
            description: CreateApiKeyRequest contains the parameters for creating a new API key.
        admiral.api.user.v1.CreateApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_key
                    description: The created key metadata.
                plain_text_key:
                    type: string
                    title: plain_text_key
                    description: |-
                        The raw secret (e.g., "admp_7kH3mNqR2xFb..."). This value is
                         shown exactly once and cannot be retrieved again. Store it securely.
            title: CreateApiKeyResponse
            additionalProperties: false
            description: CreateApiKeyResponse contains the newly created API key.
        admiral.api.user.v1.GetApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key (UUID).
            title: GetApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: GetApiKeyRequest identifies an API key to retrieve.
        admiral.api.user.v1.GetApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_key
                    description: The key metadata. The key secret is never included.
            title: GetApiKeyResponse
            additionalProperties: false
            description: GetApiKeyResponse contains the requested API key metadata.
        admiral.api.user.v1.GetMeRequest:
            type: object
            title: GetMeRequest
            additionalProperties: false
            description: |-
                GetMeRequest is the request message for GetMe.
                 No parameters are required as the user is identified by the auth token.
        admiral.api.user.v1.GetMeResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.User'
                    title: user
                    description: The user profile.
            title: GetMeResponse
            additionalProperties: false
            description: GetMeResponse contains the authenticated user's profile.
        admiral.api.user.v1.GetUserRequest:
            type: object
            properties:
                user_id:
                    type: string
                    title: user_id
                    format: uuid
                    description: The unique identifier of the user (UUID).
            title: GetUserRequest
            required:
                - user_id
            additionalProperties: false
            description: GetUserRequest identifies a user to retrieve by ID.
        admiral.api.user.v1.GetUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.User'
                    title: user
                    description: The user profile.
            title: GetUserResponse
            additionalProperties: false
            description: GetUserResponse contains the requested user's profile.
        admiral.api.user.v1.ListApiKeysRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by key name.
                           - `status`: filter by key status (ACTIVE, REVOKED).

                         Example: `field['status'] = 'ACTIVE'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of keys to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListApiKeysRequest
            additionalProperties: false
            description: ListApiKeysRequest contains pagination and filter parameters.
        admiral.api.user.v1.ListApiKeysResponse:
            type: object
            properties:
                api_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_keys
                    description: The list of keys. Secrets are never included.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListApiKeysResponse
            additionalProperties: false
            description: ListApiKeysResponse contains a page of API key metadata.
        admiral.api.user.v1.ListUsersRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `email`: filter by address.
                           - `status`: filter by status.

                         Example: `field['status'] = 'ACTIVE'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of users to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListUsersRequest
            additionalProperties: false
            description: |-
                ListUsersRequest pages through the members of the caller's tenant. The
                 tenant is never a parameter: it is the caller's own.
        admiral.api.user.v1.ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.user.v1.User'
                    title: users
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListUsersResponse
            additionalProperties: false
            description: ListUsersResponse contains a page of members.
        admiral.api.user.v1.RevokeApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key to revoke (UUID).
            title: RevokeApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: RevokeApiKeyRequest identifies an API key to revoke.
        admiral.api.user.v1.RevokeApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_key
                    description: The key metadata with updated status.
            title: RevokeApiKeyResponse
            additionalProperties: false
            description: RevokeApiKeyResponse contains the revoked API key metadata.
        admiral.api.user.v1.UpdateApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key to update (UUID).
                name:
                    type:
                        - string
                        - "null"
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        New name for the key. Must follow the same naming rules as creation.
                         Omit to leave the name unchanged.
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        New scopes for the key. Replaces all existing scopes.
                         The server enforces that issued scopes are a subset of the caller's own
                         scopes. A key cannot grant more access than the user holds.
                         Omit to leave scopes unchanged.
            title: UpdateApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: |-
                UpdateApiKeyRequest contains the fields to update on an API key.
                 Only provided fields are updated; omitted fields remain unchanged.
        admiral.api.user.v1.UpdateApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_key
                    description: The updated key metadata.
            title: UpdateApiKeyResponse
            additionalProperties: false
            description: UpdateApiKeyResponse contains the updated API key metadata.
        admiral.api.user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the user (UUID).
                email:
                    type: string
                    title: email
                    description: User's email address.
                email_verified:
                    type: boolean
                    title: email_verified
                    description: Whether the email has been verified by the IdP.
                display_name:
                    type:
                        - string
                        - "null"
                    title: display_name
                    description: User's display name for UI purposes.
                given_name:
                    type:
                        - string
                        - "null"
                    title: given_name
                    description: User's given (first) name.
                family_name:
                    type:
                        - string
                        - "null"
                    title: family_name
                    description: User's family (last) name.
                avatar_url:
                    type:
                        - string
                        - "null"
                    title: avatar_url
                    description: URL to the user's avatar image.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the user was created.
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the user was last updated.
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    description: The user's standing in the tenant.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserStatus'
                    title: status
                    description: Whether the user can currently sign in.
                    readOnly: true
            title: User
            additionalProperties: false
            description: User represents a user's profile information.
            example:
                id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                email: "alex.chen@example.com"
                display_name: "Alex Chen"
                given_name: "Alex"
                family_name: "Chen"
                avatar_url: "https://avatars.example.com/alex-chen.jpg"
                created_at: "2025-06-01T09:00:00Z"
                updated_at: "2025-11-15T11:00:00Z"
        admiral.api.user.v1.UserRole:
            type: string
            title: UserRole
            enum:
                - USER_ROLE_UNSPECIFIED
                - USER_ROLE_OWNER
                - USER_ROLE_ADMIN
                - USER_ROLE_MEMBER
                - USER_ROLE_APP_CREATOR
            description: |-
                UserRole is a member's standing in the tenant. The tiers imply one another
                 downward: an owner can do everything an administrator can, an administrator
                 everything a member can.
        admiral.api.user.v1.UserStatus:
            type: string
            title: UserStatus
            enum:
                - USER_STATUS_UNSPECIFIED
                - USER_STATUS_ACTIVE
                - USER_STATUS_SUSPENDED
            description: UserStatus is whether a member can currently sign in.
        admiral.api.variable.v1.Variable:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the variable (UUID).
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_.]{0,62}$
                    description: |-
                        The variable name. For user-created variables, must be a valid
                         environment variable identifier (e.g., "DATABASE_URL", "API_KEY").
                         Infrastructure output variables use dot-namespaced keys
                         (e.g., "vpc.vpc_id", "database.endpoint") and are system-managed.
                value:
                    type: string
                    title: value
                    description: |-
                        The variable value. Always stored as a string; use `type` to indicate
                         how to interpret it. Masked or empty for sensitive variables in responses.

                         For COMPLEX type, this is a JSON-encoded string (e.g., '["a","b"]' or
                         '{"key":"value"}'). The rendering engine converts it to the target format
                         (HCL for Terraform, YAML for Helm).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: Whether the variable value is encrypted at rest and masked in API responses.
                type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.variable.v1.VariableType'
                    title: type
                    description: |-
                        How the value should be interpreted by the rendering engine and displayed
                         in the UI. Defaults to STRING if not specified.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the variable's purpose (e.g., "Maximum replica
                         count for production scaling" or "RDS instance class per environment").
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: |-
                        The application this variable belongs to (UUID). Always set; variables
                         are env-scoped and inherit their app from the environment.
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: |-
                        The environment this variable is scoped to (UUID). Always set; variables
                         are env-scoped.
                source:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.variable.v1.VariableSource'
                    title: source
                    description: |-
                        How the variable was created. USER for change-set-managed variables,
                         INFRASTRUCTURE for variables produced by engine output capture (Terraform
                         or OpenTofu). Server-populated.
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this variable (server-populated from token).
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the variable was created.
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the variable was last updated.
            title: Variable
            additionalProperties: false
            description: |-
                Variable represents a configuration key-value pair scoped to a specific
                 environment within an application. Variables are user-managed configuration
                 values, distinct from infrastructure outputs which are system-managed values
                 produced by apply (e.g., Terraform outputs, namespaced as
                 `<component_name>.<output_name>`).

                 Variables are mutated exclusively through change sets (ChangeSetAPI.SetVariable
                 / RemoveVariable). They are read via EnvironmentAPI.ListEnvironmentVariables.

                 Sensitive variables have their values masked in API responses.
            example:
                id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                key: "DATABASE_URL"
                value: "postgresql://db.internal:5432/inventory"
                sensitive: false
                type: "VARIABLE_TYPE_STRING"
                description: "Primary database connection string for the inventory service."
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                source: "VARIABLE_SOURCE_USER"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-16T12:00:00Z"
                updated_at: "2025-10-30T15:00:00Z"
        admiral.api.variable.v1.VariableSource:
            type: string
            title: VariableSource
            enum:
                - VARIABLE_SOURCE_UNSPECIFIED
                - VARIABLE_SOURCE_USER
                - VARIABLE_SOURCE_INFRASTRUCTURE
            description: VariableSource indicates how the variable was created.
        admiral.api.variable.v1.VariableType:
            type: string
            title: VariableType
            enum:
                - VARIABLE_TYPE_UNSPECIFIED
                - VARIABLE_TYPE_STRING
                - VARIABLE_TYPE_NUMBER
                - VARIABLE_TYPE_BOOLEAN
                - VARIABLE_TYPE_COMPLEX
            description: |-
                VariableType indicates how the variable value should be interpreted by the
                 rendering engine and displayed in the UI. The value is always stored as a
                 string regardless of type.
        admiral.common.v1.ActorRef:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: UUID of the user or service access token.
                display_name:
                    type: string
                    title: display_name
                    description: Human-readable name (e.g., "John Smith", "cluster-prod-agent").
                email:
                    type: string
                    title: email
                    description: Email address (empty for non-human actors).
            title: ActorRef
            additionalProperties: false
            description: |-
                ActorRef is a lightweight reference to the user or agent that performed an action.
                 Server-populated on all resource responses. Clients should never send this;
                 use the plain string `created_by` UUID on request messages instead.
        admiral.common.v1.ApiKey:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the key (UUID).
                tenant_id:
                    type: string
                    title: tenant_id
                    format: uuid
                    description: |-
                        The tenant this key belongs to (UUID), and the `tid` of every access token
                         minted from it.

                         Load-bearing on the resolve path and an echo everywhere else: resolving a
                         raw key is the one lookup that has no tenant in hand and must return one,
                         where every lifecycle call already knows the tenant from the caller. The
                         key belongs to one tenant for its whole life, so the two can never disagree.
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the key (e.g., "ci-deploy-key").
                         Unique within the parent resource. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                key_prefix:
                    type: string
                    title: key_prefix
                    description: |-
                        Non-secret prefix of the key. The five-character brand (`admp_` when bound
                         to a user, `adms_` when bound to a service account) followed by a short
                         sample of characters from the secret body (e.g., "adms_pL2m"). URL-safe and
                         safe to log and display. Use for incident response and audit trails without
                         exposing the secret.
                scopes:
                    type: array
                    items:
                        type: string
                    title: scopes
                    description: |-
                        The scopes granted to this key, and the ceiling on any access token minted
                         from it. A mint request may narrow them and may never widen them.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ApiKeyStatus'
                    title: status
                    description: Current lifecycle status of the key.
                binding_type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.BindingType'
                    title: binding_type
                    description: The kind of resource this key is bound to.
                binding_id:
                    type: string
                    title: binding_id
                    description: |-
                        The ID of the resource this key is bound to (UUID): a user id or a service
                         account id, per `binding_type`. Access tokens minted from this key carry it
                         as their `sub`.
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
                    description: When the key expires. If unset, the key does not expire.
                last_used_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_used_at
                    description: |-
                        When this key was last exchanged for an access token.

                         NOT the time of the last API request made with it: minted tokens are cached
                         and reused for their lifetime, so a key in continuous use is exchanged only
                         when the token minted from it runs out. Reads as "still in use", at a
                         granularity of the access-token lifetime, which is the question this field
                         exists to answer before revoking one.
                revoked_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: revoked_at
                    description: When the key was revoked. Only set when status is REVOKED.
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: |-
                        The user who created this key. When bound to a user, this is the key's
                         owner; when bound to a service account, the administrator who issued it.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the key was created.
            title: ApiKey
            additionalProperties: false
            description: |-
                ApiKey contains metadata for an opaque, long-lived credential issued by
                 Admiral and presented by a caller to authenticate.

                 A key is bound to exactly one subject for its whole life -- see
                 `binding_type` and `binding_id` -- and to exactly one tenant. Presenting one
                 is exchanged for a short-lived access token whose `sub` is the binding and
                 whose scopes are bounded by this key's.

                 The raw secret is returned exactly once, in the `plain_text_key` field of the
                 Create response. This message carries only metadata; the secret is never
                 retrievable afterwards. The non-secret `key_prefix` is safe to log and
                 display.

                 Key lifecycle is managed by each parent resource's API:
                   - user-bound:            UserAPI  (/v1/user/tokens)
                   - service-account-bound: AgentAPI (/v1/agents/{id}/tokens)
            example:
                id: "9f8e7d6c-5b4a-3210-fedc-ba0987654321"
                name: "ci-deploy-key"
                key_prefix: "admp_pL2m"
                scopes:
                    - "run:write"
                    - "app:read"
                    - "env:read"
                status: "API_KEY_STATUS_ACTIVE"
                binding_type: "BINDING_TYPE_USER"
                binding_id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                tenant_id: "2047b6c4-434b-424d-8987-5532eaca2f0e"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                expires_at: "2026-06-01T00:00:00Z"
                last_used_at: "2025-11-20T14:30:00Z"
                created_at: "2025-09-01T10:00:00Z"
        admiral.common.v1.ApiKeyStatus:
            type: string
            title: ApiKeyStatus
            enum:
                - API_KEY_STATUS_UNSPECIFIED
                - API_KEY_STATUS_ACTIVE
                - API_KEY_STATUS_REVOKED
            description: ApiKeyStatus represents the lifecycle state of an API key.
        admiral.common.v1.BindingType:
            type: string
            title: BindingType
            enum:
                - BINDING_TYPE_UNSPECIFIED
                - BINDING_TYPE_USER
                - BINDING_TYPE_SERVICE_ACCOUNT
            description: |-
                BindingType identifies the kind of resource an API key is bound to.

                 This is the ONLY discriminator the contract carries. What a key is bound to
                 decides the subject it authenticates as, and every other distinction that used
                 to be modelled separately -- which surface created it, which brand its prefix
                 carries, whether its scopes were chosen or assigned -- follows from the
                 binding rather than varying independently of it.
        google.protobuf.Duration:
            type: string
            format: duration
            description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
        google.protobuf.FieldMask:
            type: string
            description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
        google.protobuf.ListValue:
            type: array
            items:
                $ref: '#/components/schemas/google.protobuf.Value'
            description: A JSON array whose elements may be any JSON value.
        google.protobuf.NullValue:
            type: string
            title: NullValue
            enum:
                - NULL_VALUE
            description: |-
                `NullValue` is a singleton enumeration to represent the null value for the
                 `Value` type union.

                 The JSON representation for `NullValue` is JSON `null`.
        google.protobuf.Struct:
            type: object
            additionalProperties:
                $ref: '#/components/schemas/google.protobuf.Value'
            description: A JSON object whose property values may be any JSON value.
        google.protobuf.Timestamp:
            type: string
            examples:
                - "2023-01-15T01:30:15.01Z"
                - "2024-12-25T12:00:00Z"
            format: date-time
            description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
        google.protobuf.Value:
            oneOf:
                - type: "null"
                - type: number
                - type: string
                - type: boolean
                - type: array
                - type: object
                  additionalProperties: true
            description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
        admiral.healthcheck.v1.HealthcheckResponse:
            type: object
            description: Empty response indicating the service is healthy.
        StateLockInfo:
            type: object
            description: >-
                Terraform/OpenTofu lock-info payload. Sent as the LOCK/UNLOCK request body and returned (HTTP 423) when a lock is already held.
            properties:
                ID:
                    type: string
                    description: Lock identifier (UUID), generated by the Terraform client.
                Operation:
                    type: string
                    description: Terraform operation holding the lock (informational).
                Info:
                    type: string
                Who:
                    type: string
                    description: Holder identity, typically "user@host" (informational).
                Version:
                    type: string
                    description: Terraform/OpenTofu client version (informational).
                Created:
                    type: string
                    format: date-time
                Path:
                    type: string
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: PAT
            description: >-
                Personal Access Token (PAT) or Service Access Token (SAT). Pass the token in the Authorization header: `Bearer admp_...`
security: [{bearerAuth: []}]
tags:
    - name: Applications
      description: Manage application lifecycle and configuration.
    - name: Environments
      description: Manage deployment environments within an application, and view the components deployed to them.
    - name: ChangeSets
      description: 'Manage change sets: scoped, isolated proposals to mutate the deployed state of an application within a single environment.'
    - name: Runs
      description: Manage runs across components in an environment.
    - name: Run Revisions
      description: Retrieve and retry per-component revisions within a run.
    - name: Catalog
      description: 'Manage catalog items: named, reusable references to a slice of content within a source.'
    - name: Sources
      description: Manage source definitions for external artifacts.
    - name: Credentials
      description: Manage credentials for accessing external systems.
    - name: Agents
      description: Manage agents (Terraform and Kubernetes) and their lifecycle.
    - name: Agent Tokens
      description: Manage service access tokens bound to a service account.
    - name: User
      description: Retrieve user profiles and list the members of your tenant.
    - name: Invitations
      description: Invite people into your tenant, see what is outstanding, and withdraw an invitation.
    - name: Personal Access Tokens
      description: Manage personal access tokens for API authentication.
    - name: State Backend
      description: Terraform/OpenTofu HTTP state backend, consumed by the terraform CLI during job execution (authenticated with a PAT or SAT).
servers:
    - url: "{baseUrl}"
      description: Admiral API server
      variables:
        baseUrl:
            default: https://api.admiral.io
            description: The base URL of your Admiral instance.
host: api.admiral.io
schemes:
    - https
    - http
x-tagGroups:
    - name: Applications
      tags:
        - Applications
        - Environments
    - name: Deployments
      tags:
        - ChangeSets
        - Runs
        - Run Revisions
    - name: Catalog & Sources
      tags:
        - Catalog
        - Sources
        - Credentials
    - name: Agents
      tags:
        - Agents
        - Agent Tokens
    - name: Identity & Access
      tags:
        - User
        - Personal Access Tokens
    - name: Integrations
      tags:
        - State Backend

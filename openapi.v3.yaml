                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: 'Supported fields: `name`, `settings`, `approval`, `allowed_component_ids`.'
            title: UpdateAgentRequest
            required:
                - agent
            additionalProperties: false
        admiral.api.agent.v1.UpdateAgentResponse:
            type: object
            properties:
                agent:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Agent'
                    title: agent
            title: UpdateAgentResponse
            additionalProperties: false
        admiral.api.agent.v1.UploadJobPlanDiffRequest:
            type: object
            properties:
                attempt:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.Attempt'
                    title: attempt
                diff:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.PlanDiff'
                    title: diff
            title: UploadJobPlanDiffRequest
            required:
                - attempt
                - diff
            additionalProperties: false
        admiral.api.agent.v1.UploadJobPlanDiffResponse:
            type: object
            properties:
                diff_digest:
                    type: string
                    title: diff_digest
                    description: '`sha256:<hex>` of the diff as stored.'
            title: UploadJobPlanDiffResponse
            additionalProperties: false
        admiral.api.agent.v1.WaitReason:
            type: string
            title: WaitReason
            enum:
                - WAIT_REASON_UNSPECIFIED
                - WAIT_REASON_NO_AGENT_ASSIGNED
                - WAIT_REASON_AGENT_NOT_GRANTED
                - WAIT_REASON_AGENT_OFFLINE
                - WAIT_REASON_AGENT_AT_CAPACITY
                - WAIT_REASON_AGENT_TOO_OLD
                - WAIT_REASON_ENVIRONMENT_BUSY
                - WAIT_REASON_BACKOFF
                - WAIT_REASON_AGENT_NOT_ENROLLED
                - WAIT_REASON_PROFILE_MISSING
                - WAIT_REASON_COMPONENT_NOT_ALLOWED
            description: WaitReason says why a queued job is not running.
        admiral.api.apikey.v1.ApiKey:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^key-[0-9a-z]+$
                    description: Unique identifier for the key.
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "ci-deploy-key"), unique among
                         the caller's keys.
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        The scopes granted to this key, and the ceiling on any access token minted
                         from it. Must be a subset of the caller's own scopes.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ApiKeyStatus'
                    title: status
                    readOnly: true
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
                    description: |-
                        (IMMUTABLE) When the key expires. Unset never expires. Fixed at creation; tenant
                         policy may cap it.
                last_used_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_used_at
                    description: |-
                        When the key was last exchanged for an access token. Minted tokens are
                         reused for their lifetime, so this reads as "still in use" at that
                         granularity, not as the time of the last request.
                    readOnly: true
                revoked_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: revoked_at
                    description: Set when the key was revoked.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
            title: ApiKey
            additionalProperties: false
            description: |-
                ApiKey is one of the caller's own API keys. The secret itself is returned
                 once, by CreateApiKey, and never again.
            example:
                id: "key-8r3t6w1y4n9z"
                name: "ci-deploy-key"
                scopes:
                    - "changeset:write"
                    - "app:read"
                    - "env:read"
                status: "API_KEY_STATUS_ACTIVE"
                created_by:
                    id: "usr-5k2m8q1x7p4c"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                expires_at: "2026-06-01T00:00:00Z"
                last_used_at: "2025-11-20T14:30:00Z"
                created_at: "2025-09-01T10:00:00Z"
        admiral.api.apikey.v1.CreateApiKeyRequest:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_key
                    description: 'The key to create: `name`, `scopes`, and optionally `expires_at`.'
            title: CreateApiKeyRequest
            required:
                - api_key
            additionalProperties: false
            description: CreateApiKeyRequest creates an API key for the caller.
        admiral.api.apikey.v1.CreateApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_key
                    description: The created key metadata.
                secret:
                    type: string
                    title: secret
                    description: |-
                        The raw secret, shown exactly once and never again. It reads
                         `admp_<id suffix>_<secret>`: the key `key-8r3t6w1y4n9z` has a secret
                         starting `admp_8r3t6w1y4n9z_`, so a secret found anywhere names its key.
            title: CreateApiKeyResponse
            additionalProperties: false
            description: CreateApiKeyResponse contains the newly created API key.
        admiral.api.apikey.v1.GetApiKeyRequest:
            type: object
            properties:
                api_key_id:
                    type: string
                    title: api_key_id
                    pattern: ^key-[0-9a-z]+$
                    description: The unique identifier of the key.
            title: GetApiKeyRequest
            required:
                - api_key_id
            additionalProperties: false
            description: GetApiKeyRequest identifies an API key to retrieve.
        admiral.api.apikey.v1.GetApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_key
                    description: The key metadata. The key secret is never included.
            title: GetApiKeyResponse
            additionalProperties: false
            description: GetApiKeyResponse contains the requested API key metadata.
        admiral.api.apikey.v1.ListApiKeysRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by key name.
                           - `status`: filter by key status (API_KEY_STATUS_ACTIVE,
                             API_KEY_STATUS_REVOKED).

                         Example: `field['status'] = 'API_KEY_STATUS_ACTIVE'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of keys to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListApiKeysRequest
            additionalProperties: false
            description: ListApiKeysRequest contains pagination and filter parameters.
        admiral.api.apikey.v1.ListApiKeysResponse:
            type: object
            properties:
                api_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_keys
                    description: The list of keys. Secrets are never included.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListApiKeysResponse
            additionalProperties: false
            description: ListApiKeysResponse contains a page of API key metadata.
        admiral.api.apikey.v1.RevokeApiKeyRequest:
            type: object
            properties:
                api_key_id:
                    type: string
                    title: api_key_id
                    pattern: ^key-[0-9a-z]+$
                    description: The unique identifier of the key to revoke.
            title: RevokeApiKeyRequest
            required:
                - api_key_id
            additionalProperties: false
            description: RevokeApiKeyRequest identifies an API key to revoke.
        admiral.api.apikey.v1.RevokeApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_key
                    description: The key metadata with updated status.
            title: RevokeApiKeyResponse
            additionalProperties: false
            description: RevokeApiKeyResponse contains the revoked API key metadata.
        admiral.api.apikey.v1.UpdateApiKeyRequest:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_key
                    description: |-
                        The key with updated fields. Its `id` identifies the key; only fields
                         named in `update_mask` are applied.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: 'The set of fields to update. Supported fields: `name`, `scopes`.'
            title: UpdateApiKeyRequest
            required:
                - api_key
            additionalProperties: false
            description: UpdateApiKeyRequest updates one of the caller's keys.
        admiral.api.apikey.v1.UpdateApiKeyResponse:
            type: object
            properties:
                api_key:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.apikey.v1.ApiKey'
                    title: api_key
                    description: The updated key metadata.
            title: UpdateApiKeyResponse
            additionalProperties: false
            description: UpdateApiKeyResponse contains the updated API key metadata.
        admiral.api.application.v1.Application:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    pattern: ^app-[0-9a-z]+$
                    description: Unique identifier for the application.
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                         the tenant. Lowercase alphanumeric and hyphens only, must start with a
                         letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the application's purpose
                         (e.g., "Core inventory service tracking warehouse stock and fulfillment").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering applications
                         (e.g., `{"team": "logistics", "tier": "critical"}`).
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this application (server-populated from token).
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the application was created.
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the application was last updated.
                    readOnly: true
            title: Application
            additionalProperties: false
            description: |-
                Application represents a deployable unit within a tenant. An application
                 groups environments.
            example:
                id: "app-4m8q2x7k1p9c"
                name: "inventory-api"
                description: "Core inventory management service for tracking warehouse stock levels and fulfillment."
                labels:
                    team: "logistics"
                    tier: "critical"
                created_by:
                    id: "usr-5k2m8q1x7p4c"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-15T10:30:00Z"
                updated_at: "2025-11-02T14:22:00Z"
        admiral.api.application.v1.CreateApplicationRequest:

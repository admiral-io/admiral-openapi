openapi: 3.1.0
info:
    title: Admiral API
    description: The Admiral REST API for managing applications, infrastructure, and runs. See https://admiral.io/docs for complete documentation.
    version: v1
paths:
    /v1/agents:
        get:
            tags:
                - Agents
            summary: List agents
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgents
            parameters:
                - name: cluster_id
                  in: query
                  description: The cluster_id query parameter.
                  schema:
                    type: string
                    title: cluster_id
                    format: uuid
                - name: application_id
                  in: query
                  description: Only agents this application's environments may select.
                  schema:
                    type: string
                    title: application_id
                    format: uuid
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListAgentsResponse'
        post:
            tags:
                - Agents
            summary: Create an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateAgent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.agent.v1.CreateAgentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateAgentResponse'
    /v1/agents/{agent_id}:
        get:
            tags:
                - Agents
            summary: Retrieve an agent
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetAgent
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetAgentResponse'
        delete:
            tags:
                - Agents
            summary: Delete an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteAgent
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.DeleteAgentResponse'
        patch:
            tags:
                - Agents
            summary: Update an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_UpdateAgent
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type:
                                        - string
                                        - "null"
                                    title: name
                                    maxLength: 63
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                ceiling:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentCeiling'
                                    title: ceiling
                                    description: Replaces the ceiling when set.
                            title: UpdateAgentRequest
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.UpdateAgentResponse'
    /v1/agents/{agent_id}/enrollment-keys:
        post:
            tags:
                - Agents
            summary: Issue an enrollment key
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateEnrollmentKey
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateEnrollmentKeyResponse'
    /v1/agents/{agent_id}/grants:
        get:
            tags:
                - Agents
            summary: List who may use an agent
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentGrants
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListAgentGrantsResponse'
        post:
            tags:
                - Agents
            summary: Grant use of an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_GrantAgentUse
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                grant:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                                    title: grant
                            title: GrantAgentUseRequest
                            required:
                                - grant
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GrantAgentUseResponse'
    /v1/agents/{agent_id}/grants/revoke:
        post:
            tags:
                - Agents
            summary: Revoke use of an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_RevokeAgentUse
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                grant:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                                    title: grant
                            title: RevokeAgentUseRequest
                            required:
                                - grant
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.RevokeAgentUseResponse'
    /v1/applications:
        get:
            tags:
                - Applications
            summary: List applications
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by application name.
                       - `labels.key`: filter by label key.

                     Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of applications to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.ListApplicationsResponse'
        post:
            tags:
                - Applications
            summary: Create an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.application.v1.CreateApplicationRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.CreateApplicationResponse'
    /v1/applications/{application.id}:
        patch:
            tags:
                - Applications
            summary: Update an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            parameters:
                - name: application.id
                  in: path
                  description: Unique identifier for the application (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                                         `description`, `labels`.
                            title: UpdateApplicationRequest
                            additionalProperties: false
                            description: UpdateApplicationRequest contains the application fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.UpdateApplicationResponse'
    /v1/applications/{application_id}:
        get:
            tags:
                - Applications
            summary: Retrieve an application
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application (UUID).
                  required: true
                  schema:
                    type: string
                    title: application_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.GetApplicationResponse'
        delete:
            tags:
                - Applications
            summary: Delete an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application to delete (UUID).
                  required: true
                  schema:
                    type: string
                    title: application_id
                    format: uuid
                - name: force
                  in: query
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                     environments and their runs (metadata records only).
                  schema:
                    type: boolean
                    title: force
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.DeleteApplicationResponse'
    /v1/changesets:
        get:
            tags:
                - ChangeSets
            summary: List change sets
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListChangeSets
            parameters:
                - name: environment_id
                  in: query
                  description: The environment_id query parameter.
                  required: true
                  schema:
                    type: string
                    title: environment_id
                    format: uuid
                - name: status
                  in: query
                  description: UNSPECIFIED lists every status.
                  schema:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetStatus'
                    title: status
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.ListChangeSetsResponse'
        post:
            tags:
                - ChangeSets
            summary: Create a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_CreateChangeSet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetResponse'
    /v1/changesets/{change_set_id}:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a change set
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetChangeSetResponse'
    /v1/changesets/{change_set_id}/components/{component}/values:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a component's values
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetComponentValues
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                - name: component
                  in: path
                  description: The component path parameter.
                  required: true
                  schema:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetComponentValuesResponse'
    /v1/changesets/{change_set_id}/diff:
        get:
            tags:
                - ChangeSets
            summary: Diff a change set
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_DiffChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiffChangeSetResponse'
    /v1/changesets/{change_set_id}/discard:
        post:
            tags:
                - ChangeSets
            summary: Discard a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiscardChangeSetResponse'
    /v1/changesets/{change_set_id}/edit:
        post:
            tags:
                - ChangeSets
            summary: Edit a change set
            description: |-
                FAILED_PRECONDITION when `if_revision` or an upload's `from_revision` is
                 not the head (the message names the head), when the change set is not a
                 draft, and when a pin names a revoked revision (the message carries the
                 recorded reason). ALREADY_EXISTS when a component name is live or held
                 by another draft (the message names which). A contract violation is
                 accepted: it is stored on the revision and returned.

                 Scope: `changeset:write`
            operationId: ChangeSetAPI_EditChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                if_revision:
                                    type:
                                        - integer
                                        - "null"
                                    title: if_revision
                                    minimum: 0
                                    format: int32
                                    description: When set, refused unless the head is this revision.
                                edits:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/admiral.api.changeset.v1.Edit'
                                    title: edits
                                    maxItems: 100
                                    minItems: 1
                                plan:
                                    type: boolean
                                    title: plan
                                    description: Ask for a plan of the revision this cuts, as PlanChangeSet does.
                            title: EditChangeSetRequest
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.EditChangeSetResponse'
    /v1/changesets/{change_set_id}/plan:
        post:
            tags:
                - ChangeSets
            summary: Plan a change set
            description: |-
                FAILED_PRECONDITION when the change set is not a draft, has no revision,
                 or `if_revision` is not the head (the message names the head).

                 Scope: `changeset:write`
            operationId: ChangeSetAPI_PlanChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                if_revision:
                                    type:
                                        - integer
                                        - "null"
                                    title: if_revision
                                    minimum: 1
                                    format: int32
                                    description: When set, refused unless the head is this revision.
                            title: PlanChangeSetRequest
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.PlanChangeSetResponse'
    /v1/changesets/{change_set_id}/revisions:
        get:
            tags:
                - ChangeSets
            summary: List a change set's revisions
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListRevisions
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.ListRevisionsResponse'
    /v1/changesets/{change_set_id}/revisions/{number}:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a change set revision
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetRevision
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                - name: number
                  in: path
                  description: The number path parameter.
                  required: true
                  schema:
                    type: integer
                    title: number
                    minimum: 1
                    format: int32
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetRevisionResponse'
    /v1/changesets/{change_set_id}/revisions/{revision}/artifact:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a revision's rendered artifact
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetArtifact
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                - name: revision
                  in: path
                  description: The revision path parameter.
                  required: true
                  schema:
                    type: integer
                    title: revision
                    minimum: 1
                    format: int32
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetArtifactResponse'
    /v1/changesets/{change_set_id}/revisions/{revision}/prepare:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a revision's prepare
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetPrepare
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                - name: revision
                  in: path
                  description: The revision path parameter.
                  required: true
                  schema:
                    type: integer
                    title: revision
                    minimum: 1
                    format: int32
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetPrepareResponse'
    /v1/clusters:
        get:
            tags:
                - Clusters
            summary: List clusters
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListClusters
            parameters:
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListClustersResponse'
        post:
            tags:
                - Clusters
            summary: Connect a cluster
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateCluster
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.agent.v1.CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateClusterResponse'
    /v1/clusters/{cluster_id}:
        get:
            tags:
                - Clusters
            summary: Retrieve a cluster
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetCluster
            parameters:
                - name: cluster_id
                  in: path
                  description: The cluster_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: cluster_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetClusterResponse'
        delete:
            tags:
                - Clusters
            summary: Delete a cluster
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteCluster
            parameters:
                - name: cluster_id
                  in: path
                  description: The cluster_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: cluster_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.DeleteClusterResponse'
    /v1/clusters/{cluster_id}/trust:
        post:
            tags:
                - Clusters

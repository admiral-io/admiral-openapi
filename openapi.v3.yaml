        admiral.api.run.v1.RetryRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision to retry (UUID). Must be in FAILED status.
            title: RetryRevisionRequest
            required:
                - run_id
                - revision_id
            additionalProperties: false
            description: RetryRevisionRequest retries a failed revision.
        admiral.api.run.v1.RetryRevisionResponse:
            type: object
            properties:
                revision:
                    title: revision
                    description: |-
                        The retried revision. Status resets and retry_count is incremented.
                         Downstream revisions that were BLOCKED will automatically unblock
                         if this revision succeeds.
                    $ref: '#/components/schemas/admiral.api.run.v1.Revision'
            title: RetryRevisionResponse
            additionalProperties: false
            description: RetryRevisionResponse contains the updated revision.
        admiral.api.run.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the revision (UUID).
                run_id:
                    type: string
                    title: run_id
                    format: uuid
                    description: The run this revision belongs to (UUID).
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                    description: The component this revision is for (UUID).
                component_name:
                    type: string
                    title: component_name
                    description: Component name at the time of run (immutable semantic key).
                kind:
                    title: kind
                    description: Component kind at the time of run (after override resolution).
                    $ref: '#/components/schemas/admiral.api.run.v1.RevisionKind'
                status:
                    title: status
                    description: Lifecycle status of this revision.
                    $ref: '#/components/schemas/admiral.api.run.v1.RevisionStatus'
                change_type:
                    title: change_type
                    description: |-
                        What type of change this revision represents relative to the previously
                         deployed state.
                    $ref: '#/components/schemas/admiral.api.run.v1.RevisionChangeType'
                previous_revision_id:
                    type: string
                    title: previous_revision_id
                    description: |-
                        The last succeeded revision for this (component, environment) at the
                         time this revision was created. Null for CREATE revisions.
                source_id:
                    type: string
                    title: source_id
                    description: |-
                        The source the module pointed to at the time of this revision (UUID).
                         Snapshotted so a rollback can re-fetch from the original source even if
                         the module's source binding is later edited. Execution today resolves
                         fetch location through the live module; this field is the audit anchor.
                ref:
                    type: string
                    title: ref
                    description: The git ref / version selector deployed (the component's ref at snapshot).
                resolved_values:
                    type: string
                    title: resolved_values
                    description: |-
                        The resolved values template snapshot: the values_template with all
                         variable references and component output references fully resolved.
                         Stored for audit: shows exactly what inputs were used. Sensitive
                         variable values are masked in API responses.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component IDs that this revision depends on. Populated from the resolved
                         depends_on list plus implicit dependencies from template expressions.
                blocked_by:
                    type: array
                    items:
                        type: string
                    title: blocked_by
                    description: |-
                        Component IDs that are blocking this revision. Only populated when
                         status is BLOCKED; indicates which upstream components failed.
                plan_summary:
                    title: plan_summary
                    description: |-
                        The normalized change counts (creates/updates/deletes/noops) this
                         revision's plan computed. Populated after planning. Engine-agnostic.
                    $ref: '#/components/schemas/admiral.api.run.v1.ChangeSummary'
                available_phases:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.RevisionPhase'
                    title: available_phases
                    description: |-
                        Phase labels for which a transcript has been stored, in the order they
                         ran. Populated as each phase completes (a revision that planned and then
                         applied carries `[REVISION_PHASE_PLAN, REVISION_PHASE_APPLY]`). Fetch a
                         phase's transcript via
                         `GET /api/v1/runs/{run_id}/revisions/{revision_id}/{phase}`.
                error_message:
                    type: string
                    title: error_message
                    description: Error message if the revision failed. Empty on success.
                retry_count:
                    type: integer
                    title: retry_count
                    format: int32
                    description: Number of retry attempts. Starts at 0 for the initial attempt.
                started_at:
                    title: started_at
                    description: When the revision started execution (transitioned from PENDING/QUEUED).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                completed_at:
                    title: completed_at
                    description: When the revision finished (succeeded, failed, or canceled).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                working_directory:
                    type: string
                    title: working_directory
                    description: |-
                        Subdirectory within the delivered archive where the executor runs.
                         Empty means the archive root. Populated from the catalog item's path field
                         at snapshot time so that relative references resolve correctly.
                created_at:
                    title: created_at
                    description: When the revision was created (same as run created_at).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                resolved_commit:
                    type: string
                    title: resolved_commit
                    description: |-
                        The concrete commit this revision resolved its ref to and pinned -- the
                         reproducibility anchor. `ref` is the intent (e.g. `main`); this is what
                         actually deployed. Populated when resolution is wired (a later WP).
                type:
                    type: string
                    title: type
                    description: |-
                        The deploy/engine type this revision runs (TERRAFORM/HELM/KUSTOMIZE/
                         MANIFEST), denormalized from the component at snapshot. Selects the
                         executor: the orchestration layer routes by this type, not by kind.
            title: Revision
            additionalProperties: false
            description: |-
                Revision represents an immutable, rendered artifact for a single component
                 within a run. Each revision tracks the full lifecycle from rendering
                 through execution, and stores references to the produced artifacts
                 (rendered manifests, binary plan files, etc.).

                 For infrastructure components (terraform-semantic engine, Terraform or
                 OpenTofu):
                   - Rendering produces the infrastructure source tree (.tf files and
                     auto-loaded tfvars) with resolved variable values.
                   - The engine's plan and apply phases are executed by the assigned
                     TERRAFORM agent (see JobBundle.engine for engine selection).
                   - The plan output is stored for visibility.
                   - Each component has its own state, stored via the configured backend.

                 For workload components (Helm, Kustomize, manifests):
                   - Rendering produces Kubernetes manifests (via helm template, kustomize
                     build, or raw file collection).
                   - Manifests are ordered (CRDs before resources, namespaces first).
                   - The rendered bundle is sent to the K8s agent for application.
        admiral.api.run.v1.RevisionChangeType:
            type: string
            title: RevisionChangeType
            enum:
                - REVISION_CHANGE_TYPE_UNSPECIFIED
                - REVISION_CHANGE_TYPE_CREATE
                - REVISION_CHANGE_TYPE_UPDATE
                - REVISION_CHANGE_TYPE_DESTROY
                - REVISION_CHANGE_TYPE_RECREATE
                - REVISION_CHANGE_TYPE_IMPORT
                - REVISION_CHANGE_TYPE_NO_CHANGE
            description: |-
                RevisionChangeType classifies the change a revision represents relative to
                 the previously deployed state for the same component.
        admiral.api.run.v1.RevisionKind:
            type: string
            title: RevisionKind
            enum:
                - REVISION_KIND_UNSPECIFIED
                - REVISION_KIND_INFRASTRUCTURE
                - REVISION_KIND_WORKLOAD
            description: |-
                RevisionKind mirrors ComponentKind but is stored on the revision to capture
                 the effective kind at run time (may differ from the component default
                 if an environment override changed the source type).
        admiral.api.run.v1.RevisionPhase:
            type: string
            title: RevisionPhase
            enum:
                - REVISION_PHASE_UNSPECIFIED
                - REVISION_PHASE_PLAN
                - REVISION_PHASE_APPLY
            description: |-
                RevisionPhase labels which phase of a revision's lifecycle produced a
                 retrievable transcript. Plan and apply are the only phases today; future
                 phases (e.g., import) extend this enum without changing the storage shape.
        admiral.api.run.v1.RevisionStatus:
            type: string
            title: RevisionStatus
            enum:
                - REVISION_STATUS_UNSPECIFIED
                - REVISION_STATUS_PENDING
                - REVISION_STATUS_QUEUED
                - REVISION_STATUS_PLANNING
                - REVISION_STATUS_PLANNED
                - REVISION_STATUS_APPLYING
                - REVISION_STATUS_SUCCEEDED
                - REVISION_STATUS_FAILED
                - REVISION_STATUS_BLOCKED
                - REVISION_STATUS_CANCELED
                - REVISION_STATUS_SUPERSEDED
                - REVISION_STATUS_DEFERRED
                - REVISION_STATUS_STALE
                - REVISION_STATUS_AWAITING_APPROVAL
            description: |-
                RevisionStatus represents the lifecycle status of a single component
                 revision within a run.
        admiral.api.run.v1.RevisionSummary:
            type: object
            properties:
                total:
                    type: integer
                    title: total
                    format: int32
                    description: Total number of component revisions in this run.
                succeeded:
                    type: integer
                    title: succeeded
                    format: int32
                    description: Number of revisions that completed successfully.
                failed:
                    type: integer
                    title: failed
                    format: int32
                    description: Number of revisions that failed.
                blocked:
                    type: integer
                    title: blocked
                    format: int32
                    description: Number of revisions that are blocked by upstream failures.
                running:
                    type: integer
                    title: running
                    format: int32
                    description: Number of revisions currently running (planning or applying).
                canceled:
                    type: integer
                    title: canceled
                    format: int32
                    description: Number of revisions that were canceled.
                pending:
                    type: integer
                    title: pending
                    format: int32
                    description: Number of revisions that have not started yet.
            title: RevisionSummary
            additionalProperties: false
            description: |-
                RevisionSummary provides aggregate counts of revision statuses within a
                 run, enabling quick status display without loading all revisions.
        admiral.api.run.v1.Run:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the run (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application being deployed (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                status:
                    title: status
                    description: Composite status derived from all component revisions.
                    $ref: '#/components/schemas/admiral.api.run.v1.RunStatus'
                triggered_by:
                    title: triggered_by
                    description: The user or agent that triggered the run (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: |-
                        Optional message describing the run (e.g., "Deploying v2.1.0
                         with new caching layer" or "Rolling back to stable after API errors").
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        If this run was created as a rollback from a prior run, this field
                         contains the source run's UUID. Empty for normal runs.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        The changeset that was deployed (UUID). Absent for pre-changeset runs
                         and reconcile (no-changeset) runs.
                revision_summary:
                    title: revision_summary
                    description: Summary counts for quick status display.
                    $ref: '#/components/schemas/admiral.api.run.v1.RevisionSummary'
                completed_at:
                    title: completed_at
                    description: |-
                        When the run finished (all revisions completed, failed, or canceled).
                         Absent while the run is in progress.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                display_id:
                    type: string
                    title: display_id
                    description: |-
                        Typed display identifier of the form `run-<12-char-suffix>` (e.g.,
                         `run-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                         over `id` for user-facing references; lookups accept either form.
                application_name:
                    type: string
                    title: application_name
                    description: |-
                        Display name of the parent application. Denormalized for display.
                         Read-only; ignored on writes.
                environment_name:
                    type: string
                    title: environment_name
                    description: |-
                        Display name of the parent environment. Denormalized for display.
                         Read-only; ignored on writes.
                change_set_display_id:
                    type: string
                    title: change_set_display_id
                    description: |-
                        Display ID of the changeset this run deployed (`cs-<suffix>`).
                         Denormalized for display. Empty when `change_set_id` is empty
                         (pre-changeset runs, reconcile runs). Read-only.
                change_set_title:
                    type: string
                    title: change_set_title
                    description: |-
                        Title of the changeset this run deployed. Denormalized for display.
                         Empty when `change_set_id` is empty. Read-only.
                created_at:
                    title: created_at
                    description: When the run was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Run
            additionalProperties: false
            description: |-
                Run represents a single execution against an application+environment.
                 Each run produces one Revision per component. The run tracks the composite
                 status across all revisions and provides the audit trail for what was
                 executed, when, and by whom.

                 Run records are immutable once created. There is no UpdateRun RPC and no
                 `updated_at` field. The composite `status`, `revision_summary`, and
                 `completed_at` fields are server-maintained as revisions progress;
                 everything else is fixed at creation time. To change what is deployed,
                 create a new run.
            example:
                id: "7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b"
                display_id: "run-3k7m9p2q4rvw"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                status: "RUN_STATUS_SUCCEEDED"
                message: "Deploy v2.4.1 with updated ingress rules"
                triggered_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                revision_summary:
                    total: 3
                    succeeded: 3
                created_at: "2025-11-20T14:00:00Z"
                completed_at: "2025-11-20T14:12:00Z"
        admiral.api.run.v1.RunStatus:
            type: string
            title: RunStatus
            enum:
                - RUN_STATUS_UNSPECIFIED
                - RUN_STATUS_PENDING
                - RUN_STATUS_QUEUED
                - RUN_STATUS_PLANNING
                - RUN_STATUS_PLANNED
                - RUN_STATUS_APPLYING
                - RUN_STATUS_SUCCEEDED
                - RUN_STATUS_PARTIALLY_FAILED
                - RUN_STATUS_FAILED
                - RUN_STATUS_CANCELED
                - RUN_STATUS_SUPERSEDED
                - RUN_STATUS_STALE
                - RUN_STATUS_AWAITING_APPROVAL
            description: |-
                RunStatus represents the composite status of a run, derived from the
                 statuses of all its component revisions.
        admiral.api.source.v1.CreateSourceRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "corporate-rds", "nginx-chart").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the source's purpose.
                type:
                    not:
                        enum:
                            - SOURCE_TYPE_UNSPECIFIED
                    title: type
                    description: The kind of artifact and fetch protocol.
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceType'
                url:
                    type: string
                    title: url
                    minLength: 1
                    description: Base URL for the source (see Source.url for per-type semantics).
                credential_id:
                    type:
                        - string
                        - "null"
                    title: credential_id
                    format: uuid
                    description: |-
                        Reference to the credential providing authentication (UUID). Optional for
                         public sources.
                source_config:
                    title: source_config
                    description: |-
                        Type-specific configuration. Only required for TERRAFORM and HELM;
                         omit for GIT, OCI, HTTP.
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels.
            title: CreateSourceRequest
            required:
                - name
                - type
                - url
            additionalProperties: false
            description: CreateSourceRequest contains the parameters for creating a new source.
        admiral.api.source.v1.CreateSourceRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.source.v1.CreateSourceResponse:
            type: object
            properties:
                source:
                    title: source
                    description: The created source.
                    $ref: '#/components/schemas/admiral.api.source.v1.Source'
            title: CreateSourceResponse
            additionalProperties: false
            description: CreateSourceResponse contains the newly created source.
        admiral.api.source.v1.DeleteSourceRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: |-
                        Unique identifier of the source to delete (UUID).
                         Fails if any components still reference this source.
            title: DeleteSourceRequest
            required:
                - source_id
            additionalProperties: false
            description: DeleteSourceRequest identifies a source to delete.
        admiral.api.source.v1.DeleteSourceResponse:
            type: object
            title: DeleteSourceResponse
            additionalProperties: false
            description: DeleteSourceResponse is empty on success.
        admiral.api.source.v1.GetSourceRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source (UUID).
            title: GetSourceRequest
            required:
                - source_id
            additionalProperties: false
            description: GetSourceRequest identifies a source to retrieve.
        admiral.api.source.v1.GetSourceResponse:
            type: object
            properties:
                source:
                    title: source
                    description: The retrieved source.
                    $ref: '#/components/schemas/admiral.api.source.v1.Source'
            title: GetSourceResponse
            additionalProperties: false
            description: GetSourceResponse contains the source record.
        admiral.api.source.v1.HelmConfig:
            type: object
            properties:
                chart_name:
                    type: string
                    title: chart_name
                    minLength: 1
                    description: The chart name within the repository (e.g., "nginx-ingress", "redis").
            title: HelmConfig
            required:
                - chart_name
            additionalProperties: false
            description: |-
                HelmConfig identifies which chart within a Helm HTTP repository the source
                 points to. A single Helm repository hosts many charts; the chart name
                 selects one.
        admiral.api.source.v1.ListSourceVersionsRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source to query versions for (UUID).
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of versions to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token for fetching additional versions.
            title: ListSourceVersionsRequest
            required:
                - source_id
            additionalProperties: false
            description: ListSourceVersionsRequest queries available versions for a source.
        admiral.api.source.v1.ListSourceVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.source.v1.SourceVersion'
                    title: versions
                    description: Available versions, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListSourceVersionsResponse
            additionalProperties: false
            description: ListSourceVersionsResponse contains available versions from the external system.
        admiral.api.source.v1.ListSourcesRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by source name.
                           - `type`: filter by source type (GIT, TERRAFORM, HELM, OCI, HTTP).
                           - `labels.key`: filter by label key.

                         Example: `field['type'] = 'TERRAFORM' AND field['labels.team'] = 'platform'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of sources to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListSourcesRequest
            additionalProperties: false
            description: ListSourcesRequest contains pagination and filter parameters.
        admiral.api.source.v1.ListSourcesResponse:
            type: object
            properties:
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.source.v1.Source'
                    title: sources
                    description: The list of sources.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListSourcesResponse
            additionalProperties: false
            description: ListSourcesResponse contains a page of sources.
        admiral.api.source.v1.Source:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the source (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "corporate-rds", "nginx-chart").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the source's purpose
                         (e.g., "Corporate-approved RDS module with encryption and backups").
                type:
                    title: type
                    description: (IMMUTABLE) The kind of artifact and fetch protocol. Immutable after creation.
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceType'
                url:
                    type: string
                    title: url
                    minLength: 1
                    description: |-
                        Base URL for the source. The meaning varies by source type:
                           - GIT: Git repo URL (https:// or git@host:...)
                           - TERRAFORM: registry hostname (e.g., "registry.terraform.io")
                           - HELM: chart repo URL (e.g., "https://charts.bitnami.com/bitnami")
                           - OCI: OCI repository URL (e.g., "oci://ghcr.io/myorg/charts/my-app")
                           - HTTP: full HTTP(S) URL to the archive (tar/zip). Covers plain
                             HTTP hosts and presigned S3/GCS/Azure Blob URLs.
                credential_id:
                    type:
                        - string
                        - "null"
                    title: credential_id
                    format: uuid
                    description: |-
                        Reference to the credential providing authentication for this source (UUID).
                         Optional. Null for public sources that require no authentication
                         (e.g., public Terraform registry, public Helm repos).
                source_config:
                    title: source_config
                    description: |-
                        Type-specific configuration. Only set for source types whose location is
                         not fully expressed by `url` alone (currently TERRAFORM and HELM, which
                         both host multiple artifacts and need a selector). Other source types
                         (GIT, OCI, HTTP) carry all location information in `url`.
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering sources
                         (e.g., `{"team": "platform", "category": "database"}`).
                last_test_status:
                    title: last_test_status
                    description: |-
                        Outcome of the most recent TestSource invocation. Reflects whether the
                         attached credential successfully authenticated against `url` the last time
                         a test was run. UNSPECIFIED if the source has never been tested.
                    readOnly: true
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceTestStatus'
                last_test_error:
                    type: string
                    title: last_test_error
                    description: |-
                        Human-readable error message from the most recent failed TestSource.
                         Empty when `last_test_status` is SUCCESS or unset.
                    readOnly: true
                last_tested_at:
                    title: last_tested_at
                    description: |-
                        When TestSource was last explicitly invoked against this source. Absent if
                         never tested. This reflects the last on-demand test, not the last time the
                         source was used in a deployment fetch/render.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                credential_name:
                    type: string
                    title: credential_name
                    description: |-
                        Display name of the attached credential. Denormalized for display.
                         Empty when `credential_id` is unset (public sources).
                    readOnly: true
                created_by:
                    title: created_by
                    description: The user or agent who created this source (server-populated from token).
                    readOnly: true
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the source was created.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the source was last updated.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Source
            additionalProperties: false
            description: |-
                Source represents a fetchable artifact definition: a pointer to an external
                 module, chart, or manifest set that Admiral can fetch, inspect, and render
                 into deployment snapshots.

                 Sources are tenant-scoped.
            example:
                id: "f6a7b8c9-0123-4def-5678-901234567890"
                name: "nginx-ingress"
                description: "NGINX Ingress Controller Helm chart from the official repository."
                type: "SOURCE_TYPE_HELM"
                url: "https://kubernetes.github.io/ingress-nginx"
                source_config:
                    helm:
                        chart_name: "ingress-nginx"
                labels:
                    category: "networking"
                    team: "platform"
                last_test_status: "SOURCE_TEST_STATUS_SUCCESS"
                last_tested_at: "2025-11-01T08:00:00Z"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-08-01T12:00:00Z"
                updated_at: "2025-10-20T09:00:00Z"
        admiral.api.source.v1.Source.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.source.v1.SourceConfig:
            type: object
            oneOf:
                - type: object
                  properties:
                    helm:
                        title: helm
                        description: Helm HTTP repository config (for SOURCE_TYPE_HELM).
                        $ref: '#/components/schemas/admiral.api.source.v1.HelmConfig'
                  title: helm
                  required:
                    - helm
                - type: object
                  properties:
                    terraform:
                        title: terraform
                        description: Terraform Registry Protocol config (for SOURCE_TYPE_TERRAFORM).
                        $ref: '#/components/schemas/admiral.api.source.v1.TerraformConfig'
                  title: terraform
                  required:
                    - terraform
            title: SourceConfig
            additionalProperties: false
            description: |-
                SourceConfig is the type-specific configuration attached to a Source. Only
                 source types whose location is not fully expressed by `url` alone (TERRAFORM,
                 HELM) populate a variant. Source types whose URL is self-contained (GIT, OCI,
                 HTTP) leave this message unset.
        admiral.api.source.v1.SourceRefKind:
            type: string
            title: SourceRefKind
            enum:
                - SOURCE_REF_KIND_UNSPECIFIED
                - SOURCE_REF_KIND_TAG
                - SOURCE_REF_KIND_BRANCH
                - SOURCE_REF_KIND_SEMVER
                - SOURCE_REF_KIND_DIGEST
            description: |-
                SourceRefKind classifies a discovered ref by what it is, so a single
                 version list can carry branches, tags, and registry versions together and
                 the consumer can bucket them. The kind also signals mutability: BRANCH is a
                 moving pointer that re-resolves over time, while TAG, SEMVER, and DIGEST are
                 conventionally stable.
        admiral.api.source.v1.SourceTestStatus:
            type: string
            title: SourceTestStatus
            enum:
                - SOURCE_TEST_STATUS_UNSPECIFIED
                - SOURCE_TEST_STATUS_SUCCESS
                - SOURCE_TEST_STATUS_FAILURE
            description: SourceTestStatus reports the outcome of the last TestSource invocation.
        admiral.api.source.v1.SourceType:
            type: string
            title: SourceType
            enum:
                - SOURCE_TYPE_UNSPECIFIED
                - SOURCE_TYPE_GIT
                - SOURCE_TYPE_TERRAFORM
                - SOURCE_TYPE_HELM
                - SOURCE_TYPE_OCI
                - SOURCE_TYPE_HTTP
            description: |-
                SourceType identifies the fetch protocol: how Admiral retrieves content from
                 the source URL. Types are carved by wire protocol, not by content semantics.
                 "This is a Terraform module" vs "this is a Helm chart" is a Catalog/Component
                 concern, not a Source concern.
        admiral.api.source.v1.SourceVersion:
            type: object
            properties:
                version:
                    type: string
                    title: version
                    description: |-
                        Version identifier. For registry sources, this is a semver string
                         (e.g., "1.2.3"). For Git sources, this is a branch or tag name
                         (e.g., "main", "v1.2.3"). For OCI, this is a tag.
                published_at:
                    title: published_at
                    description: |-
                        When this version was published or tagged. May not be available for all
                         source types.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                description:
                    type: string
                    title: description
                    description: |-
                        Optional description or release notes for this version. Typically only
                         available from registry sources.
                kind:
                    title: kind
                    description: |-
                        What kind of ref this is. Lets a single list carry mixed kinds (branches,
                         tags, registry versions) so consumers can bucket them.
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceRefKind'
                resolved:
                    type: string
                    title: resolved
                    description: |-
                        The immutable handle this ref currently points to: a Git commit SHA for
                         BRANCH and TAG, an OCI digest for a tag. Empty when not applicable (registry
                         SEMVER, where `version` is already the immutable identifier) or not cheaply
                         resolvable. For a BRANCH this is a snapshot that changes as the branch
                         moves; pinning by `resolved` captures an exact, reproducible point.
            title: SourceVersion
            additionalProperties: false
            description: |-
                SourceVersion represents an available ref of a source artifact, as reported
                 by the external system (registry versions, Git branches and tags, OCI tags).
        admiral.api.source.v1.TerraformConfig:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    minLength: 1
                    description: Module namespace in the registry (e.g., "hashicorp", "myorg").
                module_name:
                    type: string
                    title: module_name
                    minLength: 1
                    description: Module name in the registry (e.g., "consul", "rds").
                system:
                    type: string
                    title: system
                    minLength: 1
                    description: Target system / provider (e.g., "aws", "azurerm", "google").
            title: TerraformConfig
            required:
                - namespace
                - module_name
                - system
            additionalProperties: false
            description: TerraformConfig identifies a module within a Terraform registry.
        admiral.api.source.v1.TestSourceRequest:
            type: object
            properties:
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Unique identifier of the source to test (UUID).
            title: TestSourceRequest
            required:
                - source_id
            additionalProperties: false
            description: TestSourceRequest identifies a source to test.
        admiral.api.source.v1.TestSourceResponse:
            type: object
            properties:
                status:
                    title: status
                    description: The outcome of the test.
                    $ref: '#/components/schemas/admiral.api.source.v1.SourceTestStatus'
                error:
                    type: string
                    title: error
                    description: Human-readable error message when `status` is FAILURE. Empty on success.
                source:
                    title: source
                    description: The source with test status fields refreshed.
                    $ref: '#/components/schemas/admiral.api.source.v1.Source'
            title: TestSourceResponse
            additionalProperties: false
            description: |-
                TestSourceResponse reports the outcome of the test against the external
                 system. The same outcome is persisted on the Source (`last_test_status`,
                 `last_test_error`, `last_tested_at`).
        admiral.api.source.v1.UpdateSourceRequest:
            type: object
            properties:
                source:
                    title: source
                    description: |-
                        The source with updated fields. Only fields specified in `update_mask`
                         are updated.
                    $ref: '#/components/schemas/admiral.api.source.v1.Source'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `url`, `credential_id`, `source_config`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateSourceRequest
            required:
                - source
            additionalProperties: false
            description: UpdateSourceRequest contains the source fields to update.
        admiral.api.source.v1.UpdateSourceResponse:
            type: object
            properties:
                source:
                    title: source
                    description: The updated source.
                    $ref: '#/components/schemas/admiral.api.source.v1.Source'
            title: UpdateSourceResponse
            additionalProperties: false
            description: UpdateSourceResponse contains the updated source.
        admiral.api.tenant.v1.GetTenantRequest:
            type: object
            title: GetTenantRequest
            additionalProperties: false
            description: 'GetTenantRequest names nothing: the tenant is the caller''s own.'
        admiral.api.tenant.v1.GetTenantResponse:
            type: object
            properties:
                tenant:
                    title: tenant
                    $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
            title: GetTenantResponse
            additionalProperties: false
        admiral.api.tenant.v1.Tenant:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID).
                    readOnly: true
                slug:
                    type: string
                    title: slug
                    description: URL-safe identifier, unique across Admiral. Fixed at creation.
                    readOnly: true
                display_name:
                    type: string
                    title: display_name
                    maxLength: 256
                    description: Human-readable name.
                status:
                    title: status
                    description: Lifecycle state.
                    readOnly: true
                    $ref: '#/components/schemas/admiral.api.tenant.v1.TenantStatus'
                labels:
                    type: object
                    title: labels
                    additionalProperties:
                        type: string
                        title: value
                    description: Free-form labels for the customer's own use.
                created_at:
                    title: created_at
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Tenant
            additionalProperties: false
            description: |-
                Tenant is the account as its own members see it: its identity, its lifecycle
                 state, and the settings they control. Operational detail about how the
                 account is run is not part of this view.
        admiral.api.tenant.v1.Tenant.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.tenant.v1.TenantStatus:
            type: string
            title: TenantStatus
            enum:
                - TENANT_STATUS_UNSPECIFIED
                - TENANT_STATUS_PENDING
                - TENANT_STATUS_ACTIVE
                - TENANT_STATUS_SUSPENDED
            description: |-
                TenantStatus is the account's lifecycle state. A caller sees it but cannot
                 set it: suspension and reactivation are imposed, not requested.
        admiral.api.tenant.v1.UpdateTenantRequest:
            type: object
            properties:
                display_name:
                    type:
                        - string
                        - "null"
                    title: display_name
                    maxLength: 256
                    description: New display name. Omit to leave unchanged.
                labels:
                    type: object
                    title: labels
                    additionalProperties:
                        type: string
                        title: value
                    description: Replaces all labels when present. Omit to leave unchanged.
                update_mask:
                    title: update_mask
                    description: |-
                        Which fields to apply. Present for forward compatibility as the mutable
                         surface grows.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateTenantRequest
            additionalProperties: false
            description: |-
                UpdateTenantRequest carries only the mutable fields. The tenant is the
                 caller's own, so there is no id here.
        admiral.api.tenant.v1.UpdateTenantRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.tenant.v1.UpdateTenantResponse:
            type: object
            properties:
                tenant:
                    title: tenant
                    $ref: '#/components/schemas/admiral.api.tenant.v1.Tenant'
            title: UpdateTenantResponse
            additionalProperties: false
        admiral.api.user.v1.CreateApiKeyRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the key (e.g., "postman-testing").
                         Unique per user within the tenant. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        The scopes to grant this key. Must be scopes assignable to a user-bound key.
                         The server enforces that issued scopes are a subset of the caller's own
                         scopes. A key cannot grant more access than the user holds.
                expires_at:
                    title: expires_at
                    description: |-
                        Optional expiration time. If unset, the key does not expire.
                         Tenant policies may enforce a maximum lifetime.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: CreateApiKeyRequest
            required:
                - name
            additionalProperties: false
            description: CreateApiKeyRequest contains the parameters for creating a new API key.
        admiral.api.user.v1.CreateApiKeyResponse:
            type: object
            properties:
                api_key:
                    title: api_key
                    description: The created key metadata.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                plain_text_key:
                    type: string
                    title: plain_text_key
                    description: |-
                        The raw secret (e.g., "admp_7kH3mNqR2xFb..."). This value is
                         shown exactly once and cannot be retrieved again. Store it securely.
            title: CreateApiKeyResponse
            additionalProperties: false
            description: CreateApiKeyResponse contains the newly created API key.
        admiral.api.user.v1.GetApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key (UUID).
            title: GetApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: GetApiKeyRequest identifies an API key to retrieve.
        admiral.api.user.v1.GetApiKeyResponse:
            type: object
            properties:
                api_key:
                    title: api_key
                    description: The key metadata. The key secret is never included.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKey'
            title: GetApiKeyResponse
            additionalProperties: false
            description: GetApiKeyResponse contains the requested API key metadata.
        admiral.api.user.v1.GetMeRequest:
            type: object
            title: GetMeRequest
            additionalProperties: false
            description: |-
                GetMeRequest is the request message for GetMe.
                 No parameters are required as the user is identified by the auth token.
        admiral.api.user.v1.GetMeResponse:
            type: object
            properties:
                user:
                    title: user
                    description: The user profile.
                    $ref: '#/components/schemas/admiral.api.user.v1.User'
            title: GetMeResponse
            additionalProperties: false
            description: GetMeResponse contains the authenticated user's profile.
        admiral.api.user.v1.GetUserRequest:
            type: object
            properties:
                user_id:
                    type: string
                    title: user_id
                    format: uuid
                    description: The unique identifier of the user (UUID).
            title: GetUserRequest
            required:
                - user_id
            additionalProperties: false
            description: GetUserRequest identifies a user to retrieve by ID.
        admiral.api.user.v1.GetUserResponse:
            type: object
            properties:
                user:
                    title: user
                    description: The user profile.
                    $ref: '#/components/schemas/admiral.api.user.v1.User'
            title: GetUserResponse
            additionalProperties: false
            description: GetUserResponse contains the requested user's profile.
        admiral.api.user.v1.ListApiKeysRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by key name.
                           - `status`: filter by key status (ACTIVE, REVOKED).

                         Example: `field['status'] = 'ACTIVE'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of keys to return per page. Defaults to 50 when omitted
                         or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListApiKeysRequest
            additionalProperties: false
            description: ListApiKeysRequest contains pagination and filter parameters.
        admiral.api.user.v1.ListApiKeysResponse:
            type: object
            properties:
                api_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.common.v1.ApiKey'
                    title: api_keys
                    description: The list of keys. Secrets are never included.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListApiKeysResponse
            additionalProperties: false
            description: ListApiKeysResponse contains a page of API key metadata.
        admiral.api.user.v1.RevokeApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key to revoke (UUID).
            title: RevokeApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: RevokeApiKeyRequest identifies an API key to revoke.
        admiral.api.user.v1.RevokeApiKeyResponse:
            type: object
            properties:
                api_key:
                    title: api_key
                    description: The key metadata with updated status.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKey'
            title: RevokeApiKeyResponse
            additionalProperties: false
            description: RevokeApiKeyResponse contains the revoked API key metadata.
        admiral.api.user.v1.UpdateApiKeyRequest:
            type: object
            properties:
                token_id:
                    type: string
                    title: token_id
                    format: uuid
                    description: The unique identifier of the key to update (UUID).
                name:
                    type:
                        - string
                        - "null"
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        New name for the key. Must follow the same naming rules as creation.
                         Omit to leave the name unchanged.
                scopes:
                    type: array
                    items:
                        type: string
                        maxLength: 64
                        minLength: 1
                    title: scopes
                    maxItems: 255
                    description: |-
                        New scopes for the key. Replaces all existing scopes.
                         The server enforces that issued scopes are a subset of the caller's own
                         scopes. A key cannot grant more access than the user holds.
                         Omit to leave scopes unchanged.
            title: UpdateApiKeyRequest
            required:
                - token_id
            additionalProperties: false
            description: |-
                UpdateApiKeyRequest contains the fields to update on an API key.
                 Only provided fields are updated; omitted fields remain unchanged.
        admiral.api.user.v1.UpdateApiKeyResponse:
            type: object
            properties:
                api_key:
                    title: api_key
                    description: The updated key metadata.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKey'
            title: UpdateApiKeyResponse
            additionalProperties: false
            description: UpdateApiKeyResponse contains the updated API key metadata.
        admiral.api.user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the user (UUID).
                email:
                    type: string
                    title: email
                    description: User's email address.
                email_verified:
                    type: boolean
                    title: email_verified
                    description: Whether the email has been verified by the IdP.
                display_name:
                    type:
                        - string
                        - "null"
                    title: display_name
                    description: User's display name for UI purposes.
                given_name:
                    type:
                        - string
                        - "null"
                    title: given_name
                    description: User's given (first) name.
                family_name:
                    type:
                        - string
                        - "null"
                    title: family_name
                    description: User's family (last) name.
                avatar_url:
                    type:
                        - string
                        - "null"
                    title: avatar_url
                    description: URL to the user's avatar image.
                created_at:
                    title: created_at
                    description: When the user was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the user was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: User
            additionalProperties: false
            description: User represents a user's profile information.
            example:
                id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                email: "alex.chen@example.com"
                display_name: "Alex Chen"
                given_name: "Alex"
                family_name: "Chen"
                avatar_url: "https://avatars.example.com/alex-chen.jpg"
                created_at: "2025-06-01T09:00:00Z"
                updated_at: "2025-11-15T11:00:00Z"
        admiral.api.variable.v1.Variable:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the variable (UUID).
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_.]{0,62}$
                    description: |-
                        The variable name. For user-created variables, must be a valid
                         environment variable identifier (e.g., "DATABASE_URL", "API_KEY").
                         Infrastructure output variables use dot-namespaced keys
                         (e.g., "vpc.vpc_id", "database.endpoint") and are system-managed.
                value:
                    type: string
                    title: value
                    description: |-
                        The variable value. Always stored as a string; use `type` to indicate
                         how to interpret it. Masked or empty for sensitive variables in responses.

                         For COMPLEX type, this is a JSON-encoded string (e.g., '["a","b"]' or
                         '{"key":"value"}'). The rendering engine converts it to the target format
                         (HCL for Terraform, YAML for Helm).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: Whether the variable value is encrypted at rest and masked in API responses.
                type:
                    title: type
                    description: |-
                        How the value should be interpreted by the rendering engine and displayed
                         in the UI. Defaults to STRING if not specified.
                    $ref: '#/components/schemas/admiral.api.variable.v1.VariableType'
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the variable's purpose (e.g., "Maximum replica
                         count for production scaling" or "RDS instance class per environment").
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: |-
                        The application this variable belongs to (UUID). Always set; variables
                         are env-scoped and inherit their app from the environment.
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: |-
                        The environment this variable is scoped to (UUID). Always set; variables
                         are env-scoped.
                source:
                    title: source
                    description: |-
                        How the variable was created. USER for change-set-managed variables,
                         INFRASTRUCTURE for variables produced by engine output capture (Terraform
                         or OpenTofu). Server-populated.
                    $ref: '#/components/schemas/admiral.api.variable.v1.VariableSource'
                created_by:
                    title: created_by
                    description: The user or agent who created this variable (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the variable was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the variable was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Variable
            additionalProperties: false
            description: |-
                Variable represents a configuration key-value pair scoped to a specific
                 environment within an application. Variables are user-managed configuration
                 values, distinct from infrastructure outputs which are system-managed values
                 produced by apply (e.g., Terraform outputs, namespaced as
                 `<component_name>.<output_name>`).

                 Variables are mutated exclusively through change sets (ChangeSetAPI.SetVariable
                 / RemoveVariable). They are read via EnvironmentAPI.ListEnvironmentVariables.

                 Sensitive variables have their values masked in API responses.
            example:
                id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                key: "DATABASE_URL"
                value: "postgresql://db.internal:5432/inventory"
                sensitive: false
                type: "VARIABLE_TYPE_STRING"
                description: "Primary database connection string for the inventory service."
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                source: "VARIABLE_SOURCE_USER"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-16T12:00:00Z"
                updated_at: "2025-10-30T15:00:00Z"
        admiral.api.variable.v1.VariableSource:
            type: string
            title: VariableSource
            enum:
                - VARIABLE_SOURCE_UNSPECIFIED
                - VARIABLE_SOURCE_USER
                - VARIABLE_SOURCE_INFRASTRUCTURE
            description: VariableSource indicates how the variable was created.
        admiral.api.variable.v1.VariableType:
            type: string
            title: VariableType
            enum:
                - VARIABLE_TYPE_UNSPECIFIED
                - VARIABLE_TYPE_STRING
                - VARIABLE_TYPE_NUMBER
                - VARIABLE_TYPE_BOOLEAN
                - VARIABLE_TYPE_COMPLEX
            description: |-
                VariableType indicates how the variable value should be interpreted by the
                 rendering engine and displayed in the UI. The value is always stored as a
                 string regardless of type.
        admiral.common.v1.ActorRef:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: UUID of the user or service access token.
                display_name:
                    type: string
                    title: display_name
                    description: Human-readable name (e.g., "John Smith", "cluster-prod-agent").
                email:
                    type: string
                    title: email
                    description: Email address (empty for non-human actors).
            title: ActorRef
            additionalProperties: false
            description: |-
                ActorRef is a lightweight reference to the user or agent that performed an action.
                 Server-populated on all resource responses. Clients should never send this;
                 use the plain string `created_by` UUID on request messages instead.
        admiral.common.v1.ApiKey:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the key (UUID).
                tenant_id:
                    type: string
                    title: tenant_id
                    format: uuid
                    description: |-
                        The tenant this key belongs to (UUID), and the `tid` of every access token
                         minted from it.

                         Load-bearing on the resolve path and an echo everywhere else: resolving a
                         raw key is the one lookup that has no tenant in hand and must return one,
                         where every lifecycle call already knows the tenant from the caller. The
                         key belongs to one tenant for its whole life, so the two can never disagree.
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the key (e.g., "ci-deploy-key").
                         Unique within the parent resource. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                key_prefix:
                    type: string
                    title: key_prefix
                    description: |-
                        Non-secret prefix of the key. The five-character brand (`admp_` when bound
                         to a user, `adms_` when bound to a service account) followed by a short
                         sample of characters from the secret body (e.g., "adms_pL2m"). URL-safe and
                         safe to log and display. Use for incident response and audit trails without
                         exposing the secret.
                scopes:
                    type: array
                    items:
                        type: string
                    title: scopes
                    description: |-
                        The scopes granted to this key, and the ceiling on any access token minted
                         from it. A mint request may narrow them and may never widen them.
                status:
                    title: status
                    description: Current lifecycle status of the key.
                    $ref: '#/components/schemas/admiral.common.v1.ApiKeyStatus'
                binding_type:
                    title: binding_type
                    description: The kind of resource this key is bound to.
                    $ref: '#/components/schemas/admiral.common.v1.BindingType'
                binding_id:
                    type: string
                    title: binding_id
                    description: |-
                        The ID of the resource this key is bound to (UUID): a user id or a service
                         account id, per `binding_type`. Access tokens minted from this key carry it
                         as their `sub`.
                expires_at:
                    title: expires_at
                    description: When the key expires. If unset, the key does not expire.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                last_used_at:
                    title: last_used_at
                    description: |-
                        When this key was last exchanged for an access token.

                         NOT the time of the last API request made with it: minted tokens are cached
                         and reused for their lifetime, so a key in continuous use is exchanged only
                         when the token minted from it runs out. Reads as "still in use", at a
                         granularity of the access-token lifetime, which is the question this field
                         exists to answer before revoking one.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                revoked_at:
                    title: revoked_at
                    description: When the key was revoked. Only set when status is REVOKED.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                created_by:
                    title: created_by
                    description: |-
                        The user who created this key. When bound to a user, this is the key's
                         owner; when bound to a service account, the administrator who issued it.
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the key was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ApiKey
            additionalProperties: false
            description: |-
                ApiKey contains metadata for an opaque, long-lived credential issued by
                 Admiral and presented by a caller to authenticate.

                 A key is bound to exactly one subject for its whole life -- see
                 `binding_type` and `binding_id` -- and to exactly one tenant. Presenting one
                 is exchanged for a short-lived access token whose `sub` is the binding and
                 whose scopes are bounded by this key's.

                 The raw secret is returned exactly once, in the `plain_text_key` field of the
                 Create response. This message carries only metadata; the secret is never
                 retrievable afterwards. The non-secret `key_prefix` is safe to log and
                 display.

                 Key lifecycle is managed by each parent resource's API:
                   - user-bound:            UserAPI  (/v1/user/tokens)
                   - service-account-bound: AgentAPI (/v1/agents/{id}/tokens)
            example:
                id: "9f8e7d6c-5b4a-3210-fedc-ba0987654321"
                name: "ci-deploy-key"
                key_prefix: "admp_pL2m"
                scopes:
                    - "run:write"
                    - "app:read"
                    - "env:read"
                status: "API_KEY_STATUS_ACTIVE"
                binding_type: "BINDING_TYPE_USER"
                binding_id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                tenant_id: "2047b6c4-434b-424d-8987-5532eaca2f0e"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                expires_at: "2026-06-01T00:00:00Z"
                last_used_at: "2025-11-20T14:30:00Z"
                created_at: "2025-09-01T10:00:00Z"
        admiral.common.v1.ApiKeyStatus:
            type: string
            title: ApiKeyStatus
            enum:
                - API_KEY_STATUS_UNSPECIFIED
                - API_KEY_STATUS_ACTIVE
                - API_KEY_STATUS_REVOKED
            description: ApiKeyStatus represents the lifecycle state of an API key.
        admiral.common.v1.BindingType:
            type: string
            title: BindingType
            enum:
                - BINDING_TYPE_UNSPECIFIED
                - BINDING_TYPE_USER
                - BINDING_TYPE_SERVICE_ACCOUNT
            description: |-
                BindingType identifies the kind of resource an API key is bound to.

                 This is the ONLY discriminator the contract carries. What a key is bound to
                 decides the subject it authenticates as, and every other distinction that used
                 to be modelled separately -- which surface created it, which brand its prefix
                 carries, whether its scopes were chosen or assigned -- follows from the
                 binding rather than varying independently of it.
        google.protobuf.Duration:
            type: string
            format: duration
            description: |-
                A Duration represents a signed, fixed-length span of time represented
                 as a count of seconds and fractions of seconds at nanosecond
                 resolution. It is independent of any calendar and concepts like "day"
                 or "month". It is related to Timestamp in that the difference between
                 two Timestamp values is a Duration and it can be added or subtracted
                 from a Timestamp. Range is approximately +-10,000 years.

                 # Examples

                 Example 1: Compute Duration from two Timestamps in pseudo code.

                     Timestamp start = ...;
                     Timestamp end = ...;
                     Duration duration = ...;

                     duration.seconds = end.seconds - start.seconds;
                     duration.nanos = end.nanos - start.nanos;

                     if (duration.seconds < 0 && duration.nanos > 0) {
                       duration.seconds += 1;
                       duration.nanos -= 1000000000;
                     } else if (duration.seconds > 0 && duration.nanos < 0) {
                       duration.seconds -= 1;
                       duration.nanos += 1000000000;
                     }

                 Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

                     Timestamp start = ...;
                     Duration duration = ...;
                     Timestamp end = ...;

                     end.seconds = start.seconds + duration.seconds;
                     end.nanos = start.nanos + duration.nanos;

                     if (end.nanos < 0) {
                       end.seconds -= 1;
                       end.nanos += 1000000000;
                     } else if (end.nanos >= 1000000000) {
                       end.seconds += 1;
                       end.nanos -= 1000000000;
                     }

                 Example 3: Compute Duration from datetime.timedelta in Python.

                     td = datetime.timedelta(days=3, minutes=10)
                     duration = Duration()
                     duration.FromTimedelta(td)

                 # JSON Mapping

                 In JSON format, the Duration type is encoded as a string rather than an
                 object, where the string ends in the suffix "s" (indicating seconds) and
                 is preceded by the number of seconds, with nanoseconds expressed as
                 fractional seconds. For example, 3 seconds with 0 nanoseconds should be
                 encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
                 be expressed in JSON format as "3.000000001s", and 3 seconds and 1
                 microsecond should be expressed in JSON format as "3.000001s".
        google.protobuf.FieldMask:
            type: string
            description: |-
                `FieldMask` represents a set of symbolic field paths, for example:

                     paths: "f.a"
                     paths: "f.b.d"

                 Here `f` represents a field in some root message, `a` and `b`
                 fields in the message found in `f`, and `d` a field found in the
                 message in `f.b`.

                 Field masks are used to specify a subset of fields that should be
                 returned by a get operation or modified by an update operation.
                 Field masks also have a custom JSON encoding (see below).

                 # Field Masks in Projections

                 When used in the context of a projection, a response message or
                 sub-message is filtered by the API to only contain those fields as
                 specified in the mask. For example, if the mask in the previous
                 example is applied to a response message as follows:

                     f {
                       a : 22
                       b {
                         d : 1
                         x : 2
                       }
                       y : 13
                     }
                     z: 8

                 The result will not contain specific values for fields x,y and z
                 (their value will be set to the default, and omitted in proto text
                 output):


                     f {
                       a : 22
                       b {
                         d : 1
                       }
                     }

                 A repeated field is not allowed except at the last position of a
                 paths string.

                 If a FieldMask object is not present in a get operation, the
                 operation applies to all fields (as if a FieldMask of all fields
                 had been specified).

                 Note that a field mask does not necessarily apply to the
                 top-level response message. In case of a REST get operation, the
                 field mask applies directly to the response, but in case of a REST
                 list operation, the mask instead applies to each individual message
                 in the returned resource list. In case of a REST custom method,
                 other definitions may be used. Where the mask applies will be
                 clearly documented together with its declaration in the API.  In
                 any case, the effect on the returned resource/resources is required
                 behavior for APIs.

                 # Field Masks in Update Operations

                 A field mask in update operations specifies which fields of the
                 targeted resource are going to be updated. The API is required
                 to only change the values of the fields as specified in the mask
                 and leave the others untouched. If a resource is passed in to
                 describe the updated values, the API ignores the values of all
                 fields not covered by the mask.

                 If a repeated field is specified for an update operation, new values will
                 be appended to the existing repeated field in the target resource. Note that
                 a repeated field is only allowed in the last position of a `paths` string.

                 If a sub-message is specified in the last position of the field mask for an
                 update operation, then new value will be merged into the existing sub-message
                 in the target resource.

                 For example, given the target message:

                     f {
                       b {
                         d: 1
                         x: 2
                       }
                       c: [1]
                     }

                 And an update message:

                     f {
                       b {
                         d: 10
                       }
                       c: [2]
                     }

                 then if the field mask is:

                  paths: ["f.b", "f.c"]

                 then the result will be:

                     f {
                       b {
                         d: 10
                         x: 2
                       }
                       c: [1, 2]
                     }

                 An implementation may provide options to override this default behavior for
                 repeated and message fields.

                 In order to reset a field's value to the default, the field must
                 be in the mask and set to the default value in the provided resource.
                 Hence, in order to reset all fields of a resource, provide a default
                 instance of the resource and set all fields in the mask, or do
                 not provide a mask as described below.

                 If a field mask is not present on update, the operation applies to
                 all fields (as if a field mask of all fields has been specified).
                 Note that in the presence of schema evolution, this may mean that
                 fields the client does not know and has therefore not filled into
                 the request will be reset to their default. If this is unwanted
                 behavior, a specific service may require a client to always specify
                 a field mask, producing an error if not.

                 As with get operations, the location of the resource which
                 describes the updated values in the request message depends on the
                 operation kind. In any case, the effect of the field mask is
                 required to be honored by the API.

                 ## Considerations for HTTP REST

                 The HTTP kind of an update operation which uses a field mask must
                 be set to PATCH instead of PUT in order to satisfy HTTP semantics
                 (PUT must only be used for full updates).

                 # JSON Encoding of Field Masks

                 In JSON, a field mask is encoded as a single string where paths are
                 separated by a comma. Fields name in each path are converted
                 to/from lower-camel naming conventions.

                 As an example, consider the following message declarations:

                     message Profile {
                       User user = 1;
                       Photo photo = 2;
                     }
                     message User {
                       string display_name = 1;
                       string address = 2;
                     }

                 In proto a field mask for `Profile` may look as such:

                     mask {
                       paths: "user.display_name"
                       paths: "photo"
                     }

                 In JSON, the same mask is represented as below:

                     {
                       mask: "user.displayName,photo"
                     }

                 # Field Masks and Oneof Fields

                 Field masks treat fields in oneofs just as regular fields. Consider the
                 following message:

                     message SampleMessage {
                       oneof test_oneof {
                         string name = 4;
                         SubMessage sub_message = 9;
                       }
                     }

                 The field mask can be:

                     mask {
                       paths: "name"
                     }

                 Or:

                     mask {
                       paths: "sub_message"
                     }

                 Note that oneof type names ("test_oneof" in this case) cannot be used in
                 paths.

                 ## Field Mask Verification

                 The implementation of any API method which has a FieldMask type field in the
                 request should verify the included field paths, and return an
                 `INVALID_ARGUMENT` error if any path is unmappable.
        google.protobuf.Timestamp:
            type: string
            examples:
                - "2023-01-15T01:30:15.01Z"
                - "2024-12-25T12:00:00Z"
            format: date-time
            description: |-
                A Timestamp represents a point in time independent of any time zone or local
                 calendar, encoded as a count of seconds and fractions of seconds at
                 nanosecond resolution. The count is relative to an epoch at UTC midnight on
                 January 1, 1970, in the proleptic Gregorian calendar which extends the
                 Gregorian calendar backwards to year one.

                 All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
                 second table is needed for interpretation, using a [24-hour linear
                 smear](https://developers.google.com/time/smear).

                 The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
                 restricting to that range, we ensure that we can convert to and from [RFC
                 3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

                 # Examples

                 Example 1: Compute Timestamp from POSIX `time()`.

                     Timestamp timestamp;
                     timestamp.set_seconds(time(NULL));
                     timestamp.set_nanos(0);

                 Example 2: Compute Timestamp from POSIX `gettimeofday()`.

                     struct timeval tv;
                     gettimeofday(&tv, NULL);

                     Timestamp timestamp;
                     timestamp.set_seconds(tv.tv_sec);
                     timestamp.set_nanos(tv.tv_usec * 1000);

                 Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

                     FILETIME ft;
                     GetSystemTimeAsFileTime(&ft);
                     UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

                     // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
                     // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
                     Timestamp timestamp;
                     timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
                     timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

                 Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

                     long millis = System.currentTimeMillis();

                     Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                         .setNanos((int) ((millis % 1000) * 1000000)).build();

                 Example 5: Compute Timestamp from Java `Instant.now()`.

                     Instant now = Instant.now();

                     Timestamp timestamp =
                         Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                             .setNanos(now.getNano()).build();

                 Example 6: Compute Timestamp from current time in Python.

                     timestamp = Timestamp()
                     timestamp.GetCurrentTime()

                 # JSON Mapping

                 In JSON format, the Timestamp type is encoded as a string in the
                 [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
                 format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
                 where {year} is always expressed using four digits while {month}, {day},
                 {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
                 seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
                 are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
                 is required. A proto3 JSON serializer should always use UTC (as indicated by
                 "Z") when printing the Timestamp type and a proto3 JSON parser should be
                 able to accept both UTC and other timezones (as indicated by an offset).

                 For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
                 01:30 UTC on January 15, 2017.

                 In JavaScript, one can convert a Date object to this format using the
                 standard
                 [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
                 method. In Python, a standard `datetime.datetime` object can be converted
                 to this format using
                 [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
                 the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
                 the Joda Time's [`ISODateTimeFormat.dateTime()`](
                 http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
                 ) to obtain a formatter capable of generating timestamps in this format.
        admiral.healthcheck.v1.HealthcheckResponse:
            type: object
            description: Empty response indicating the service is healthy.
        StateLockInfo:
            type: object
            description: >-
                Terraform/OpenTofu lock-info payload. Sent as the LOCK/UNLOCK request body and returned (HTTP 423) when a lock is already held.
            properties:
                ID:
                    type: string
                    description: Lock identifier (UUID), generated by the Terraform client.
                Operation:
                    type: string
                    description: Terraform operation holding the lock (informational).
                Info:
                    type: string
                Who:
                    type: string
                    description: Holder identity, typically "user@host" (informational).
                Version:
                    type: string
                    description: Terraform/OpenTofu client version (informational).
                Created:
                    type: string
                    format: date-time
                Path:
                    type: string
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: PAT
            description: >-
                Personal Access Token (PAT) or Service Access Token (SAT). Pass the token in the Authorization header: `Bearer admp_...`
security: [{bearerAuth: []}]
tags:
    - name: Applications
      description: Manage application lifecycle and configuration.
    - name: Environments
      description: Manage deployment environments within an application, and view the components deployed to them.
    - name: ChangeSets
      description: 'Manage change sets: scoped, isolated proposals to mutate the deployed state of an application within a single environment.'
    - name: Runs
      description: Manage runs across components in an environment.
    - name: Run Revisions
      description: Retrieve and retry per-component revisions within a run.
    - name: Catalog
      description: 'Manage catalog items: named, reusable references to a slice of content within a source.'
    - name: Sources
      description: Manage source definitions for external artifacts.
    - name: Credentials
      description: Manage credentials for accessing external systems.
    - name: Agents
      description: Manage agents (Terraform and Kubernetes) and their lifecycle.
    - name: Agent Tokens
      description: Manage service access tokens bound to a service account.
    - name: User
      description: Retrieve user profiles.
    - name: Personal Access Tokens
      description: Manage personal access tokens for API authentication.
    - name: State Backend
      description: Terraform/OpenTofu HTTP state backend, consumed by the terraform CLI during job execution (authenticated with a PAT or SAT).
servers:
    - url: "{baseUrl}"
      description: Admiral API server
      variables:
        baseUrl:
            default: https://api.admiral.io
            description: The base URL of your Admiral instance.
host: api.admiral.io
schemes:
    - https
    - http
x-tagGroups:
    - name: Applications
      tags:
        - Applications
        - Environments
    - name: Deployments
      tags:
        - ChangeSets
        - Runs
        - Run Revisions
    - name: Catalog & Sources
      tags:
        - Catalog
        - Sources
        - Credentials
    - name: Agents
      tags:
        - Agents
        - Agent Tokens
    - name: Identity & Access
      tags:
        - User
        - Personal Access Tokens
    - name: Integrations
      tags:
        - State Backend

                  required: true
                  schema:
                    type: string
                    title: environment_id
                    format: uuid
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `key`: filter by variable key (supports prefix matching via ~=).
                       - `sensitive`: filter by sensitivity flag.
                       - `type`: filter by variable type (STRING, NUMBER, BOOLEAN, COMPLEX).
                       - `source`: filter by source (USER, INFRASTRUCTURE).

                     Example: `field['source'] = 'USER' AND field['sensitive'] = false`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of variables to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.environment.v1.ListEnvironmentVariablesResponse'
    /v1/invitations:
        get:
            tags:
                - Invitations
            summary: List invitations
            description: 'Scope: `user:read`'
            operationId: InvitationAPI_ListInvitations
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `email`: filter by address.
                       - `status`: filter by lifecycle status.

                     Example: `field['status'] = 'PENDING'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of invitations to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.

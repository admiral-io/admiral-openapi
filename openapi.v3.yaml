                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of components to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32

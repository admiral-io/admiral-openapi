        admiral.api.changeset.v1.AddComponent:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.RegistryRef'

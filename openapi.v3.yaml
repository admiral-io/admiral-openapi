                                $ref: '#/components/schemas/admiral.api.catalog.v1.DeleteCatalogItemResponse'
    /v1/catalog-items/{catalog_item_id}/resolve:
        post:
            tags:
                - Catalog
            summary: Resolve a catalog item
            description: |-
                This operation fetches from the external system in real time and may take
                 several seconds depending on the source type and size.

                 Scope: `catalog:read`
            operationId: CatalogAPI_ResolveCatalogItem
            parameters:
                - name: catalog_item_id
                  in: path
                  description: Unique identifier of the catalog item to resolve (UUID).
                  required: true
                  schema:
                    type: string
                    title: catalog_item_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                catalog_item_id:
                                    type: string
                                    title: catalog_item_id
                                    format: uuid
                                    description: Unique identifier of the catalog item to resolve (UUID).
                                ref_override:
                                    type: string
                                    title: ref_override
                                    maxLength: 256
                                    description: |-
                                        Optional ref override. When set, this ref is used instead of the item's
                                         default ref. Useful for previewing a different version without modifying
                                         the catalog item definition.
                            title: ResolveCatalogItemRequest
                            required:
                                - catalog_item_id
                            additionalProperties: false
                            description: ResolveCatalogItemRequest identifies a catalog item to resolve.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.catalog.v1.ResolveCatalogItemResponse'
    /v1/changesets:
        get:
            tags:
                - ChangeSets
            summary: List change sets
            description: |-
                Common filter fields: `application_id`, `environment_id`, `status`. The
                 returned `ChangeSet` records do not include entries or variable entries;
                 call GetChangeSet for the full record.

                 Scope: `app:read`
            operationId: ChangeSetAPI_ListChangeSets
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `application_id`: change sets for a specific application (UUID).
                       - `environment_id`: change sets for a specific environment (UUID).
                       - `status`: filter by status (OPEN, DEPLOYED, DISCARDED).

                     Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'OPEN'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of change sets to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.ListChangeSetsResponse'
        post:
            tags:
                - ChangeSets
            summary: Create a change set
            description: |-
                Multiple change sets can be open against the same target simultaneously.
                 Conflicts are detected at deploy time, not at create time.

                 Scope: `app:write`
            operationId: ChangeSetAPI_CreateChangeSet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetResponse'
    /v1/changesets/{change_set.id}:
        patch:
            tags:
                - ChangeSets
            summary: Update a change set
            description: |-
                Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_UpdateChangeSet
            parameters:
                - name: change_set.id
                  in: path
                  description: Unique identifier for the change set (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `title`,
                                         `description`.
                                    $ref: '#/components/schemas/google.protobuf.FieldMask'
                            title: UpdateChangeSetRequest
                            additionalProperties: false
                            description: UpdateChangeSetRequest updates a change set's mutable metadata.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.UpdateChangeSetResponse'
    /v1/changesets/{change_set_id}:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a change set
            description: 'Scope: `app:read`'
            operationId: ChangeSetAPI_GetChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetChangeSetResponse'
    /v1/changesets/{change_set_id}/copy:
        post:
            tags:
                - ChangeSets
            summary: Copy a change set to another environment
            description: |-
                The target application is the source's application; only the environment
                 can be retargeted. After copying, the resulting change set can be
                 modified (entries added, removed, or rewritten) before being deployed.

                 Scope: `app:write`
            operationId: ChangeSetAPI_CopyChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the source change set to copy. Accepts either the short
                     ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the source change set to copy. Accepts either the short
                                         ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                                environment_id:
                                    type: string
                                    title: environment_id
                                    format: uuid
                                    description: |-
                                        The target environment for the new change set (UUID). Must belong to
                                         the source change set's application.
                                title:
                                    type: string
                                    title: title
                                    maxLength: 256
                                    description: Optional title override. Defaults to the source's title when empty.
                                description:
                                    type: string
                                    title: description
                                    maxLength: 4096
                                    description: |-
                                        Optional description override. Defaults to the source's description
                                         when empty.
                            title: CopyChangeSetRequest
                            required:
                                - change_set_id
                                - environment_id
                            additionalProperties: false
                            description: |-
                                CopyChangeSetRequest creates a new OPEN change set by copying an existing
                                 one to a target environment.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.CopyChangeSetResponse'
    /v1/changesets/{change_set_id}/diff:
        get:
            tags:
                - ChangeSets
            summary: Compute a change set diff
            description: |-
                Sensitive values are never returned. Changed-but-masked entries set
                 `sensitive=true` and omit `old`/`new` so the reviewer knows a change is
                 present without seeing the value.

                 Available for change sets in any status; for non-OPEN change sets the
                 result reflects the diff against the env's CURRENT HEAD, not the env's
                 state at the time the change set was deployed.

                 Scope: `app:read`
            operationId: ChangeSetAPI_DiffChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiffChangeSetResponse'
    /v1/changesets/{change_set_id}/discard:
        post:
            tags:
                - ChangeSets
            summary: Discard a change set
            description: 'Scope: `app:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set to discard. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the change set to discard. Accepts either the short ID
                                         (`cs-<suffix>`) or the canonical UUID.
                            title: DiscardChangeSetRequest
                            required:
                                - change_set_id
                            additionalProperties: false
                            description: DiscardChangeSetRequest abandons an OPEN change set.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiscardChangeSetResponse'
    /v1/changesets/{change_set_id}/entries/{component_name}:
        put:
            tags:
                - ChangeSets
            summary: Add or update an entry
            description: |-
                The `change_type` field selects the operation:
                   - CREATE: add a new component. Requires `catalog_item_id`. Rejects if a
                     component with the same name already exists in the application.
                   - UPDATE: change an existing component. The name must match an
                     existing component in the application. Only non-empty optional
                     fields are recorded as changes.
                   - DESTROY: schedule the component for terraform destroy at deploy.
                   - ORPHAN: detach from management without destroying infrastructure.

                 Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_SetEntry
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                - name: component_name
                  in: path
                  description: Component name (stable identifier set at creation). Required.
                  required: true
                  schema:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the change set. Accepts either the short ID
                                         (`cs-<suffix>`) or the canonical UUID.
                                component_name:
                                    type: string
                                    title: component_name
                                    maxLength: 63
                                    minLength: 1
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                    description: Component name (stable identifier set at creation). Required.
                                change_type:
                                    not:
                                        enum:
                                            - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
                                    title: change_type
                                    description: The change type.
                                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetEntryType'
                                catalog_item_id:
                                    type:
                                        - string
                                        - "null"
                                    title: catalog_item_id
                                    format: uuid
                                    description: |-
                                        The catalog item to deploy (UUID). Required for CREATE; optional for UPDATE.
                                         Not allowed for DESTROY/ORPHAN.
                                ref:
                                    type:
                                        - string
                                        - "null"
                                    title: ref
                                    maxLength: 256
                                    description: The git ref / version selector to deploy.
                                values_template:
                                    type:
                                        - string
                                        - "null"
                                    title: values_template
                                    maxLength: 65536
                                    description: Values template for catalog item inputs.
                                depends_on:
                                    type: array
                                    items:
                                        type: string
                                    title: depends_on
                                    description: Explicit dependencies (component names). Empty list clears.
                                description:
                                    type:
                                        - string
                                        - "null"
                                    title: description
                                    maxLength: 1024
                                    description: Optional description of the proposed change.
                                target:
                                    title: target
                                    description: |-
                                        Resolved placement for the component, by kind. Required for CREATE (the
                                         component needs a placement); for UPDATE, absent means "no change to
                                         placement."
                                    $ref: '#/components/schemas/admiral.api.component.v1.ComponentTarget'
                            title: SetEntryRequest
                            required:
                                - change_set_id
                                - component_name
                                - change_type
                            additionalProperties: false
                            description: SetEntryRequest creates or replaces a component entry within a change set.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.SetEntryResponse'
        delete:
            tags:
                - ChangeSets
            summary: Remove an entry
            description: |-
                Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_RemoveEntry
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                - name: component_name
                  in: path
                  description: Component name of the entry to remove.
                  required: true
                  schema:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.RemoveEntryResponse'
    /v1/changesets/{change_set_id}/variables/{key}:
        put:
            tags:
                - ChangeSets
            summary: Set a variable
            description: |-
                To delete a variable on apply, use RemoveVariable; it writes a
                 tombstone entry on the change set so the apply phase removes the key.

                 Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_SetVariable
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                - name: key
                  in: path
                  description: The variable key.
                  required: true
                  schema:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                change_set_id:
                                    type: string
                                    title: change_set_id
                                    minLength: 1
                                    description: |-
                                        Identifier of the change set. Accepts either the short ID
                                         (`cs-<suffix>`) or the canonical UUID.
                                value:
                                    type: string
                                    title: value
                                    minLength: 1
                                    description: The value to set on apply. For COMPLEX type, must be valid JSON.
                                type:
                                    title: type
                                    description: How the value should be interpreted. Defaults to STRING when unspecified.
                                    $ref: '#/components/schemas/admiral.api.variable.v1.VariableType'
                                sensitive:
                                    type: boolean
                                    title: sensitive
                                    description: When true, the value is encrypted at rest and masked in API responses.
                            title: SetVariableRequest
                            required:
                                - change_set_id
                                - value
                            additionalProperties: false
                            description: SetVariableRequest creates or replaces a variable entry within a change set.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.SetVariableResponse'
        delete:
            tags:
                - ChangeSets
            summary: Remove a variable on apply
            description: |-
                To withdraw the deletion intent before deploy, call SetVariable for the
                 same key with the desired value (which overwrites the tombstone).

                 Rejected when the change set is not OPEN.

                 Scope: `app:write`
            operationId: ChangeSetAPI_RemoveVariable
            parameters:
                - name: change_set_id
                  in: path
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                     (`cs-<suffix>`) or the canonical UUID.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    minLength: 1
                - name: key
                  in: path
                  description: The variable key to remove on apply.
                  required: true
                  schema:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.RemoveVariableResponse'
    /v1/credentials:
        get:
            tags:
                - Credentials
            summary: List credentials
            description: 'Scope: `credential:read`'
            operationId: CredentialAPI_ListCredentials
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by credential name.
                       - `type`: filter by credential type (SSH_KEY, BASIC_AUTH, BEARER_TOKEN).
                       - `labels.key`: filter by label key.

                     Example: `field['type'] = 'BEARER_TOKEN'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of credentials to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.credential.v1.ListCredentialsResponse'
        post:
            tags:
                - Credentials
            summary: Create a credential
            description: |-
                The credential type and auth config must match. For example, a GIT_TOKEN
                 credential requires a matching auth_config (e.g. BEARER_TOKEN → bearer_token).

                 Scope: `credential:write`
            operationId: CredentialAPI_CreateCredential
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.credential.v1.CreateCredentialRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.credential.v1.CreateCredentialResponse'
    /v1/credentials/{credential.id}:
        patch:
            tags:
                - Credentials
            summary: Update a credential
            description: |-
                When updating auth_config, the entire auth config is replaced. Partial
                 updates within the auth config oneof are not supported. Omitting auth_config
                 from the update_mask leaves credentials unchanged.

                 Scope: `credential:write`
            operationId: CredentialAPI_UpdateCredential
            parameters:
                - name: credential.id
                  in: path
                  description: Unique identifier for the credential (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                                         `description`, `auth_config`, `labels`.
                                    $ref: '#/components/schemas/google.protobuf.FieldMask'
                            title: UpdateCredentialRequest
                            additionalProperties: false
                            description: UpdateCredentialRequest contains the credential fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.credential.v1.UpdateCredentialResponse'
    /v1/credentials/{credential_id}:
        get:
            tags:
                - Credentials
            summary: Retrieve a credential
            description: |-
                Returns credential metadata only. Sensitive fields are never included
                 in the response.

                 Scope: `credential:read`
            operationId: CredentialAPI_GetCredential
            parameters:
                - name: credential_id
                  in: path
                  description: The unique identifier of the credential (UUID).
                  required: true
                  schema:
                    type: string
                    title: credential_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.credential.v1.GetCredentialResponse'
        delete:
            tags:
                - Credentials
            summary: Delete a credential
            description: 'Scope: `credential:write`'
            operationId: CredentialAPI_DeleteCredential
            parameters:
                - name: credential_id
                  in: path
                  description: |-
                    The unique identifier of the credential to delete (UUID).
                     Fails if any sources still reference this credential.
                  required: true
                  schema:
                    type: string
                    title: credential_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.credential.v1.DeleteCredentialResponse'
    /v1/environments:
        get:
            tags:
                - Environments
            summary: List environments
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_ListEnvironments
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `application_id`: filter by parent application (UUID).
                       - `name`: filter by environment name.
                       - `labels.key`: filter by label key.


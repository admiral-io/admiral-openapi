        post:
            tags:
                - Components
            summary: Set a version's status
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_SetVersionStatus
            parameters:
                - name: component_id
                  in: path
                  description: The component_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: component_id
                    pattern: ^cmp-[0-9a-z]+$
                - name: digest
                  in: path
                  description: |-
                    `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                     a floating tag might name different bytes by the time anyone reads the
                     reason.
                  required: true
                  schema:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object

                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the environment's purpose.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering environments.
                kubernetes:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.KubernetesTarget'
                    title: kubernetes
                    description: Where workload components go.
            title: CreateEnvironmentRequest
            required:
                - application_id
                - name
            additionalProperties: false
            description: CreateEnvironmentRequest contains the parameters for creating a new environment.
        admiral.api.environment.v1.CreateEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The created environment.
            title: CreateEnvironmentResponse
            additionalProperties: false
            description: CreateEnvironmentResponse contains the newly created environment.
        admiral.api.environment.v1.DeleteEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The unique identifier of the environment to delete (UUID).
                force:
                    type: boolean
                    title: force
                    description: |-
                        When true, bypass the children-exist check and cascade-delete all
                         run records (metadata only).
            title: DeleteEnvironmentRequest
            required:
                - environment_id
            additionalProperties: false
            description: DeleteEnvironmentRequest identifies an environment to delete.
        admiral.api.environment.v1.DeleteEnvironmentResponse:
            type: object
            title: DeleteEnvironmentResponse
            additionalProperties: false
            description: DeleteEnvironmentResponse is empty on success.
        admiral.api.environment.v1.Environment:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the environment (UUID).
                    readOnly: true
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this environment belongs to (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                         Unique within the application. Lowercase alphanumeric and hyphens only,
                         must start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the environment's purpose
                         (e.g., "US East production serving live traffic" or
                         "Shared staging for QA validation before prod promotion").
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering environments
                         (e.g., `{"region": "us-east-1", "tier": "production"}`).
                has_pending_changes:
                    type: boolean
                    title: has_pending_changes
                    description: |-
                        Whether the environment has configuration changes that have not yet been
                         deployed. Server-derived by comparing current resolved config (variables,
                         component settings, overrides, source versions) against the last
                         successful run's snapshot. False if no successful run exists yet (a
                         fresh environment with no runs returns false; use `last_deployed_at`
                         to distinguish "clean" from "never deployed").
                    readOnly: true
                last_deployed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_deployed_at
                    description: |-
                        When the last successful run for this environment completed. Absent if
                         no successful run has occurred yet.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    description: The user or agent who created this environment (server-populated from token).
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the environment was created.
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    description: When the environment was last updated.
                    readOnly: true
                kubernetes:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.KubernetesTarget'
                    title: kubernetes
                    description: Where workload components go. Omitted fields keep their defaults.
            title: Environment
            additionalProperties: false
            description: |-
                Environment represents a named deployment target for an application
                 (e.g., dev, staging, prod). Each environment carries its own configuration
                 and variables; promotion between environments is explicit.
            example:
                id: "e5f6a7b8-9012-3cde-f456-789012345678"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                name: "staging"
                description: "Shared staging environment for QA validation before production promotion."
                labels:
                    region: "us-east-1"
                    tier: "staging"
                has_pending_changes: true
                last_deployed_at: "2025-11-01T09:15:00Z"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-15T11:00:00Z"
                updated_at: "2025-11-02T14:30:00Z"
        admiral.api.environment.v1.EnvironmentComponent:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: Component name (stable identifier set at creation).
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    description: |-
                        What the component's pinned revision is (TERRAFORM, HELM, MANIFESTS),
                         denormalized from the registry.
                ref:
                    type: string
                    title: ref
                    description: The git ref / version selector the component deploys.
                last_revision_id:
                    type: string
                    title: last_revision_id
                    description: |-
                        ID of the last-succeeded revision for this component in this env, if
                         any (UUID). Empty when the component has never reached SUCCEEDED.
                last_revision_status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionStatus'
                    title: last_revision_status
                    description: |-
                        Status of the last revision (SUCCEEDED when populated). UNSPECIFIED
                         means the component has no last-succeeded revision yet.
                last_deployed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: last_deployed_at
                    description: When the last-succeeded revision completed.
            title: EnvironmentComponent
            additionalProperties: false
            description: |-
                EnvironmentComponent is a denormalized view of a deployed component for
                 `ListEnvironmentComponents`. It joins the component's HEAD with the
                 component's last-succeeded revision so the CLI can render an at-a-glance
                 status row without follow-up calls.
        admiral.api.environment.v1.GetEnvironmentRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The unique identifier of the environment (UUID).
            title: GetEnvironmentRequest
            required:
                - environment_id
            additionalProperties: false
            description: GetEnvironmentRequest identifies an environment to retrieve.
        admiral.api.environment.v1.GetEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The retrieved environment.
            title: GetEnvironmentResponse
            additionalProperties: false
            description: GetEnvironmentResponse contains the environment record.
        admiral.api.environment.v1.KubernetesCapabilities:
            type: object
            properties:
                kube_version:
                    type: string
                    title: kube_version
                    description: e.g. `v1.31.2`.
                api_versions:
                    type: array
                    items:
                        type: string
                    title: api_versions
                    description: Group/version strings, e.g. `monitoring.coreos.com/v1`.
                reported_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: reported_at
            title: KubernetesCapabilities
            additionalProperties: false
            description: KubernetesCapabilities is a cluster's version and installed API groups.
        admiral.api.environment.v1.KubernetesTarget:
            type: object
            properties:
                namespace:
                    type: string
                    title: namespace
                    maxLength: 63
                    pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: |-
                        The namespace a component renders into unless it names its own. Set to
                         `<application>-<environment>` when the environment is created if left
                         empty; at most 63 characters.
                create_namespaces:
                    type:
                        - boolean
                        - "null"
                    title: create_namespaces
                    description: |-
                        Whether a missing namespace is created at apply. The agent's own
                         setting and its RBAC can still refuse. Defaults to true on create.
                capabilities:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.KubernetesCapabilities'
                    title: capabilities
                    description: |-
                        What the cluster reported, rendered against at prepare. Absent until an
                         agent reports.
                    readOnly: true
                agent_id:
                    type: string
                    title: agent_id
                    format: uuid
                    description: |-
                        The agent this environment deploys through. It must be one the agent's
                         owner granted to the tenant, a team, or this application. Empty selects
                         none; capabilities then come from no cluster.
            title: KubernetesTarget
            additionalProperties: false
            description: KubernetesTarget is where an environment's workload components go.
        admiral.api.environment.v1.ListEnvironmentComponentsRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment whose components should be listed (UUID).
            title: ListEnvironmentComponentsRequest
            required:
                - environment_id
            additionalProperties: false
            description: |-
                ListEnvironmentComponentsRequest identifies the environment whose
                 components should be listed.
        admiral.api.environment.v1.ListEnvironmentComponentsResponse:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.EnvironmentComponent'
                    title: components
                    description: |-
                        Active (not soft-deleted) components attached to the environment, sorted
                         by name.
            title: ListEnvironmentComponentsResponse
            additionalProperties: false
            description: |-
                ListEnvironmentComponentsResponse returns every active component for the
                 environment, ordered by name.
        admiral.api.environment.v1.ListEnvironmentVariablesRequest:
            type: object
            properties:
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment whose variables should be listed (UUID).
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `key`: filter by variable key (supports prefix matching via ~=).
                           - `sensitive`: filter by sensitivity flag.
                           - `type`: filter by variable type (STRING, NUMBER, BOOLEAN, COMPLEX).
                           - `source`: filter by source (USER, INFRASTRUCTURE).

                         Example: `field['source'] = 'USER' AND field['sensitive'] = false`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of variables to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentVariablesRequest
            required:
                - environment_id
            additionalProperties: false
            description: |-
                ListEnvironmentVariablesRequest contains the environment ID, filters, and
                 pagination parameters.
        admiral.api.environment.v1.ListEnvironmentVariablesResponse:
            type: object
            properties:
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.variable.v1.Variable'
                    title: variables
                    description: The variables scoped to this environment. Sensitive values are masked.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListEnvironmentVariablesResponse
            additionalProperties: false
            description: ListEnvironmentVariablesResponse contains a page of variables.
        admiral.api.environment.v1.ListEnvironmentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `application_id`: filter by parent application (UUID).
                           - `name`: filter by environment name.
                           - `labels.key`: filter by label key.

                         Example: `field['application_id'] = '<uuid>' AND field['name'] = 'prod'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of environments to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentsRequest
            additionalProperties: false
            description: ListEnvironmentsRequest contains pagination and filter parameters.
        admiral.api.environment.v1.ListEnvironmentsResponse:
            type: object
            properties:
                environments:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environments
                    description: The list of environments.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListEnvironmentsResponse
            additionalProperties: false
            description: ListEnvironmentsResponse contains a page of environments.
        admiral.api.environment.v1.UpdateEnvironmentRequest:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: |-
                        The environment with updated fields.
                         Only fields specified in `update_mask` are updated.
                update_mask:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `labels`, `kubernetes.namespace`,
                         `kubernetes.create_namespaces`, `kubernetes.agent_id`.
            title: UpdateEnvironmentRequest
            required:
                - environment
            additionalProperties: false
            description: UpdateEnvironmentRequest contains the environment fields to update.
        admiral.api.environment.v1.UpdateEnvironmentResponse:
            type: object
            properties:
                environment:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.environment.v1.Environment'
                    title: environment
                    description: The updated environment.
            title: UpdateEnvironmentResponse
            additionalProperties: false
            description: UpdateEnvironmentResponse contains the updated environment.
        admiral.api.healthcheck.v1.HealthcheckResponse:
            type: object
            title: HealthcheckResponse
            additionalProperties: false
            description: |-
                HealthcheckResponse is returned when the service is healthy.
                 An empty response indicates the service is operating normally.
        admiral.api.invitation.v1.CreateInvitationRequest:
            type: object
            properties:
                email:
                    type: string
                    title: email
                    maxLength: 254
                    format: email
                    description: Where the mail goes, and the address the user will be created with.
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    enum:
                        - USER_ROLE_ADMIN
                        - USER_ROLE_MEMBER
                    description: The role to hold on joining. ADMIN or MEMBER.
            title: CreateInvitationRequest
            required:
                - email
                - role
            additionalProperties: false
            description: CreateInvitationRequest invites one address into the caller's tenant.
        admiral.api.invitation.v1.CreateInvitationResponse:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
            title: CreateInvitationResponse
            additionalProperties: false
            description: CreateInvitationResponse carries the invitation, without its link.
        admiral.api.invitation.v1.Invitation:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID).
                    readOnly: true
                email:
                    type: string
                    title: email
                    description: The address the invitation was sent to.
                    readOnly: true
                role:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.user.v1.UserRole'
                    title: role
                    description: The role the person holds once they join. ADMIN or MEMBER.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.InvitationStatus'
                    title: status
                    readOnly: true
                invited_by:
                    type:
                        - string
                        - "null"
                    title: invited_by
                    description: |-
                        The member who issued it (UUID). Absent when it was issued by an operator
                         from outside the tenant.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                expires_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: expires_at
                    description: After this instant the link no longer works.
                    readOnly: true
                accepted_at:
                    oneOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                        - type: "null"
                    title: accepted_at
                    description: |-
                        When it was redeemed, and who it became. Both set together, only on
                         ACCEPTED.
                    readOnly: true
                accepted_user_id:
                    type:
                        - string
                        - "null"
                    title: accepted_user_id
                    readOnly: true
                revoked_at:
                    oneOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                        - type: "null"
                    title: revoked_at
                    description: When it was withdrawn or retired. Only on REVOKED.
                    readOnly: true
            title: Invitation
            additionalProperties: false
            description: |-
                Invitation is one person invited into the caller's tenant. Never carries
                 the link or its token.
        admiral.api.invitation.v1.InvitationStatus:
            type: string
            title: InvitationStatus
            enum:
                - INVITATION_STATUS_UNSPECIFIED
                - INVITATION_STATUS_PENDING
                - INVITATION_STATUS_ACCEPTED
                - INVITATION_STATUS_EXPIRED
                - INVITATION_STATUS_REVOKED
            description: InvitationStatus is where an invitation is in its life.
        admiral.api.invitation.v1.ListInvitationsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `email`: filter by address.
                           - `status`: filter by lifecycle status.

                         Example: `field['status'] = 'PENDING'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of invitations to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListInvitationsRequest
            additionalProperties: false
            description: ListInvitationsRequest pages through the caller's tenant's invitations.
        admiral.api.invitation.v1.ListInvitationsResponse:
            type: object
            properties:
                invitations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitations
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListInvitationsResponse
            additionalProperties: false
            description: ListInvitationsResponse contains a page of invitations.
        admiral.api.invitation.v1.RevokeInvitationRequest:
            type: object
            properties:
                invitation_id:
                    type: string
                    title: invitation_id
                    format: uuid
                    description: The invitation (UUID), from CreateInvitation or ListInvitations.
            title: RevokeInvitationRequest
            required:
                - invitation_id
            additionalProperties: false
            description: RevokeInvitationRequest names one invitation in the caller's tenant.
        admiral.api.invitation.v1.RevokeInvitationResponse:
            type: object
            properties:
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.invitation.v1.Invitation'
                    title: invitation
            title: RevokeInvitationResponse
            additionalProperties: false
            description: RevokeInvitationResponse carries the invitation as it now stands.
        admiral.api.registry.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    description: |-
                        The name as it is written: `cloud-sql`, or `payments/cloud-sql` once
                         team namespaces exist. Unique within the tenant. Immutable.
                    readOnly: true
                description:
                    type: string
                    title: description
                    maxLength: 1024
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Key-value metadata for filtering (e.g. `{"team": "payments",
                         "runtime": "terraform"}`), the same labels every Admiral resource carries.
                tags:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Tag'
                    title: tags
                    description: Every tag on the component, by name.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Component
            additionalProperties: false
            description: |-
                Component is a registry entry: a name, and the revisions and tags beneath
                 it.
        admiral.api.registry.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - TERRAFORM
                - HELM
                - MANIFESTS
            description: |-
                ComponentKind is what a revision's bundle is, detected by inspection at
                 publish: a Chart.yaml means HELM, .tf files mean TERRAFORM, anything else
                 that is Kubernetes YAML means MANIFESTS.
        admiral.api.registry.v1.ComponentLabels:
            type: object
            properties:
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
            title: ComponentLabels
            additionalProperties: false
            description: |-
                ComponentLabels wraps a label map so its presence in an update can be told
                 from an empty map: present and empty clears the labels.
        admiral.api.registry.v1.Contract:
            type: object
            properties:
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractInput'
                    title: inputs
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractOutput'
                    title: outputs
            title: Contract
            additionalProperties: false
            description: |-
                Contract is what a bundle takes and gives. The shape here is what static
                 inspection can produce from any Terraform module or Helm chart; the curated
                 format adds to it without removing anything.
        admiral.api.registry.v1.ContractInput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                type:
                    type: string
                    title: type
                    description: |-
                        The type as the bundle declares it: a Terraform type expression, or for a
                         chart one of bool, number, string, list, object or null. A chart's full
                         constraint is in schema.
                description:
                    type: string
                    title: description
                required:
                    type: boolean
                    title: required
                    description: True when the bundle gives it no default.
                default:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    title: default
                    description: The declared default, when there is one.
                sensitive:
                    type: boolean
                    title: sensitive
                    description: |-
                        The value is a secret: never rendered in review, and resolved by the
                         runner from a reference rather than stored in the change set.
                ephemeral:
                    type: boolean
                    title: ephemeral
                    description: |-
                        The value must not land in plan or state (Terraform 1.10+ ephemeral
                         inputs). Implies sensitive.
                nullable:
                    type:
                        - boolean
                        - "null"
                    title: nullable
                    description: |-
                        Whether null is an accepted value. Unset when the bundle does not say,
                         which is a chart input with no schema.
                deprecated:
                    type: string
                    title: deprecated
                    description: The bundle's own deprecation message for this input.
                validations:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.ContractValidation'
                    title: validations
                    description: A Terraform variable's validation blocks, in declaration order.
                schema:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Struct'
                    title: schema
                    description: |-
                        The JSON Schema a chart's values.schema.json declares for this input,
                         verbatim, so a value can be checked the way Helm will check it.
            title: ContractInput
            additionalProperties: false
            description: ContractInput is one value the bundle accepts.
        admiral.api.registry.v1.ContractOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                description:
                    type: string
                    title: description
                sensitive:
                    type: boolean
                    title: sensitive
            title: ContractOutput
            additionalProperties: false
            description: ContractOutput is one value the bundle produces.
        admiral.api.registry.v1.ContractValidation:
            type: object
            properties:
                condition:
                    type: string
                    title: condition
                error_message:
                    type: string
                    title: error_message
            title: ContractValidation
            additionalProperties: false
            description: |-
                ContractValidation is one validation block on a Terraform variable, as
                 written. Evaluating the condition needs the Terraform language runtime,
                 which the registry does not run.
        admiral.api.registry.v1.DeleteComponentRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
            title: DeleteComponentRequest
            required:
                - component_id
            additionalProperties: false
            description: DeleteComponentRequest identifies the component to retire.
        admiral.api.registry.v1.DeleteComponentResponse:
            type: object
            title: DeleteComponentResponse
            additionalProperties: false
            description: DeleteComponentResponse is empty.
        admiral.api.registry.v1.DeleteTagRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                name:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: DeleteTagRequest
            required:
                - component_id
                - name
            additionalProperties: false
            description: DeleteTagRequest identifies a floating tag to remove.
        admiral.api.registry.v1.DeleteTagResponse:
            type: object
            title: DeleteTagResponse
            additionalProperties: false
            description: DeleteTagResponse is empty.
        admiral.api.registry.v1.Finding:
            type: object
            properties:
                severity:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.FindingSeverity'
                    title: severity
                source:
                    type: string
                    title: source
                    description: 'What produced it: `provider-constraint`, `checkov`, `trivy`, `image-ref`.'
                code:
                    type: string
                    title: code
                    description: |-
                        The producer's own identifier for the rule, when it has one
                         (e.g. `CKV_AWS_18`).
                message:
                    type: string
                    title: message
                path:
                    type: string
                    title: path
                    description: Where in the bundle, when it applies.
            title: Finding
            additionalProperties: false
            description: Finding is one thing the publish gate noticed.
        admiral.api.registry.v1.FindingSeverity:
            type: string
            title: FindingSeverity
            enum:
                - FINDING_SEVERITY_UNSPECIFIED
                - INFO
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
            description: FindingSeverity ranks what the publish gate found.
        admiral.api.registry.v1.GetComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 127
                    minLength: 1
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?/)?[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: '`cloud-sql`, or `namespace/cloud-sql`.'
            title: GetComponentRequest
            required:
                - name
            additionalProperties: false
            description: GetComponentRequest identifies a component by name.
        admiral.api.registry.v1.GetComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: GetComponentResponse
            additionalProperties: false
            description: GetComponentResponse contains the component with its tags.
        admiral.api.registry.v1.GetRevisionRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                reference:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
                    description: |-
                        A tag name (`v1.2.0`, `latest`) or a digest (`sha256:<hex>`). A digest
                         is recognised by its prefix; everything else is looked up as a tag.
            title: GetRevisionRequest
            required:
                - component_id
                - reference
            additionalProperties: false
            description: GetRevisionRequest identifies a revision by reference.
        admiral.api.registry.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
            title: GetRevisionResponse
            additionalProperties: false
            description: GetRevisionResponse contains the revision.
        admiral.api.registry.v1.ListComponentsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by name.
                           - `description`: filter by description.
                           - `labels`: filter by label key/value.

                         Example: `field['labels']['team'] = 'payments'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of components to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListComponentsRequest
            additionalProperties: false
            description: ListComponentsRequest pages through the registry.
        admiral.api.registry.v1.ListComponentsResponse:
            type: object
            properties:
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: components
                    description: Listed without their tags; GetComponent carries those.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListComponentsResponse
            additionalProperties: false
            description: ListComponentsResponse contains a page of components.
        admiral.api.registry.v1.ListRevisionsRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression. Filterable fields:
                           - `kind`: TERRAFORM, HELM, MANIFESTS.
                           - `status`: PUBLISHED, DEPRECATED, REVOKED.

                         Example: `field['status'] = 'PUBLISHED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListRevisionsRequest
            required:
                - component_id
            additionalProperties: false
            description: ListRevisionsRequest pages through one component's revisions.
        admiral.api.registry.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revisions
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListRevisionsResponse
            additionalProperties: false
            description: ListRevisionsResponse contains a page of revisions, newest first.
        admiral.api.registry.v1.Pin:
            type: object
            properties:
                source:
                    type: string
                    title: source
                    description: The source as the bundle declared it, before rewriting.
                constraint:
                    type: string
                    title: constraint
                    description: The constraint that was asked for, when any.
                resolved:
                    type: string
                    title: resolved
                    description: 'What it resolved to: an exact version or commit.'
            title: Pin
            additionalProperties: false
            description: Pin is one dependency the closure step resolved and vendored.
        admiral.api.registry.v1.PresentedCredential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                name:
                    type: string
                    title: name
                hosts:
                    type: array
                    items:
                        type: string
                    title: hosts
                    description: The hosts it was presented to during this pull.
            title: PresentedCredential
            additionalProperties: false
            description: |-
                PresentedCredential is one credential a pull presented, as it was named at
                 the time; the credential may since have been renamed or deleted.
        admiral.api.registry.v1.Provenance:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ProvenanceKind'
                    title: kind
                uri:
                    type: string
                    title: uri
                    description: |-
                        The repository or location the bytes were read from: a git remote URL, a
                         Helm repository URL, an OCI reference. Empty for a local publish with no
                         remote.
                ref:
                    type: string
                    title: ref
                    description: The ref that was asked for (tag, branch, chart version), when any.
                commit:
                    type: string
                    title: commit
                    description: 'What the ref resolved to: a commit SHA, or the exact chart version.'
                path:
                    type: string
                    title: path
                    description: |-
                        The path within the source the bundle was taken from. Empty means the
                         root.
                dirty:
                    type: boolean
                    title: dirty
                    description: |-
                        The working copy carried uncommitted changes when it was published.
                         Only meaningful for LOCAL, and only ever true when the CLI said so.
                pins:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Pin'
                    title: pins
                    description: |-
                        Every remote module or chart the closure step vendored into the bundle,
                         pinned to what it resolved.
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.PresentedCredential'
                    title: credentials
                    description: |-
                        The credentials the platform presented while fetching, for PULL: which
                         secret reached which hosts. Lineage, not a grant; a later pull attaches
                         its own. Set by the server; ignored on a publish request.
                    readOnly: true
                commit_message:
                    type: string
                    title: commit_message
                    maxLength: 4096
                    description: |-
                        The message of the commit that produced these bytes, as written, so a
                         reader deciding whether to move to this revision can see what changed.
                         Captured at publish because it cannot be recovered after a force-push or
                         once the source is gone. Empty when there is no commit, or upstream
                         carried no notes.
                commit_author:
                    type: string
                    title: commit_author
                    maxLength: 256
                    description: Who wrote that commit, by name. Not the email address.
            title: Provenance
            additionalProperties: false
            description: |-
                Provenance is where a revision's bytes came from: the audit trail behind
                 the digest.
        admiral.api.registry.v1.ProvenanceKind:
            type: string
            title: ProvenanceKind
            enum:
                - PROVENANCE_KIND_UNSPECIFIED
                - LOCAL
                - GIT
                - PULL
            description: ProvenanceKind is how the bytes arrived.
        admiral.api.registry.v1.PublishComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        The component name to publish under. Created on first use. Bare
                         (`cloud-sql`), which resolves to the default namespace.
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    description: |-
                        The kind, when the caller knows better than inspection. UNSPECIFIED
                         means detect.
                tags:
                    type: array
                    items:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                    title: tags
                    maxItems: 16
                    description: Tags to set on the resulting revision (e.g. `v1.2.0`, `latest`).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Description and labels for the component. Applied when the publish
                         creates the component; ignored when it already exists, since a publish is
                         not the place to edit metadata. UpdateComponent is.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                provenance:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance'
                    title: provenance
                    description: |-
                        What the caller knows about where the bytes came from. The server
                         records the kind as LOCAL for a CLI upload whatever is claimed here; the
                         uri, ref, commit, path and dirty flag are kept as the caller's
                         assertion.
                bundle:
                    type: string
                    title: bundle
                    maxLength: 67108864
                    minLength: 1
                    format: byte
                    description: 'The bundle: a gzipped tar of the component root. At most 64 MiB.'
            title: PublishComponentRequest
            required:
                - name
                - bundle
            additionalProperties: false
            description: PublishComponentRequest carries what is being published and the bytes.
        admiral.api.registry.v1.PublishComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
                unchanged:
                    type: boolean
                    title: unchanged
                    description: |-
                        True when the digest was already published under this name and nothing
                         was written. Tags in the request were still applied.
            title: PublishComponentResponse
            additionalProperties: false
            description: PublishComponentResponse is the recorded revision.
        admiral.api.registry.v1.PullComponentRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    pattern: ^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$
                    description: |-
                        Empty means the artifact's own name: the chart's, the module's, the
                         repository's or directory's. Bare, which resolves to the default
                         namespace.
                source:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource'
                    title: source
                credential_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                    title: credential_ids
                    maxItems: 16
                    uniqueItems: true
                    description: |-
                        The credentials this pull may present, chosen by the caller. Each is
                         presented only where its type fits and its `allowed_hosts` permit. A
                         fetch that reaches a host none of them covers fails naming the host.
                tags:
                    type: array
                    items:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                    title: tags
                    maxItems: 16
                    description: |-
                        Tags to set on the resulting revision. A chart's version and a
                         module's resolved version are applied as tags whether or not named.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Applied when the pull creates the component; ignored otherwise.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
            title: PullComponentRequest
            required:
                - source
            additionalProperties: false
        admiral.api.registry.v1.PullComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
                unchanged:
                    type: boolean
                    title: unchanged
                    description: The resolution was already published under this name; nothing was written.
            title: PullComponentResponse
            additionalProperties: false
        admiral.api.registry.v1.PullSource:
            type: object
            anyOf:
                - type: object
                  properties:
                    archive:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.Archive'
                        title: archive
                  title: archive
                - type: object
                  properties:
                    git_tree:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.GitTree'
                        title: git_tree
                  title: git_tree
                - type: object
                  properties:
                    helm_chart:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.HelmChart'
                        title: helm_chart
                  title: helm_chart
                - type: object
                  properties:
                    oci_chart:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.OCIChart'
                        title: oci_chart
                  title: oci_chart
                - type: object
                  properties:
                    registry_module:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.registry.v1.PullSource.RegistryModule'
                        title: registry_module
                  title: registry_module
            unevaluatedProperties: false
            not:
                allOf:
                    - anyOf:
                        - required:
                            - archive
                        - required:
                            - git_tree
                        - required:
                            - helm_chart
                        - required:
                            - oci_chart
                        - required:
                            - registry_module
                    - not:
                        oneOf:
                            - required:
                                - archive
                            - required:
                                - git_tree
                            - required:
                                - helm_chart
                            - required:
                                - oci_chart
                            - required:
                                - registry_module
            title: PullSource
            description: |-
                PullSource names an artifact to pull. One variant. The kind of the
                 resulting component follows from it: a chart from OCI or a Helm
                 repository, a module from a module registry, whatever inspection finds in
                 a git tree or an archive.
        admiral.api.registry.v1.PullSource.Archive:
            type: object
            properties:
                url:
                    type: string
                    title: url
                    maxLength: 512
                    format: uri
            title: Archive
            required:
                - url
            additionalProperties: false
            description: An archive at a URL, unpacked by its extension.
        admiral.api.registry.v1.PullSource.GitTree:
            type: object
            properties:
                url:
                    type: string
                    title: url
                    maxLength: 512
                    format: uri
                    description: '`https://github.com/acme/infra.git`, `ssh://git@github.com/acme/infra.git`.'
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: A branch, tag or commit. Empty is the default branch.
                path:
                    type: string
                    title: path
                    maxLength: 512
                    description: |
                        A directory within the repository. Empty is the root.
                        string.not_contains = ".."
            title: GitTree
            required:
                - url
            additionalProperties: false
            description: A git repository at a ref, optionally a directory of it.
        admiral.api.registry.v1.PullSource.HelmChart:
            type: object
            properties:
                repository:
                    type: string
                    title: repository
                    maxLength: 512
                    format: uri
                chart:
                    type: string
                    title: chart
                    maxLength: 63
                    pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: HelmChart
            required:
                - repository
                - chart
                - version
            additionalProperties: false
            description: |-
                A chart in an HTTP repository: the repository URL, the chart's name in
                 its index, and an exact version.
        admiral.api.registry.v1.PullSource.OCIChart:
            type: object
            properties:
                reference:
                    type: string
                    title: reference
                    maxLength: 512
                    minLength: 7
                    description: |
                        string.prefix = "oci://"
                version:
                    type: string
                    title: version
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
            title: OCIChart
            required:
                - reference
                - version
            additionalProperties: false
            description: |-
                A chart in an OCI registry: `oci://ghcr.io/argoproj/argo-helm/argo-cd`
                 at a version, which is its tag.
        admiral.api.registry.v1.PullSource.RegistryModule:
            type: object
            properties:
                address:
                    type: string
                    title: address
                    maxLength: 512
                    minLength: 5
                version:
                    type: string
                    title: version
                    maxLength: 128
            title: RegistryModule
            required:
                - address
            additionalProperties: false
            description: |-
                A module in a module registry: the address as a module call would
                 write it (`GoogleCloudPlatform/cloud-armor/google`, optionally
                 host-qualified, optionally `//subdir`) and a version constraint, which
                 resolves to the newest version satisfying it at pull time, or exactly
                 one version.
        admiral.api.registry.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    description: Unique identifier (UUID). Internal handle; references use the digest.
                    readOnly: true
                component_id:
                    type: string
                    title: component_id
                    description: The component this revision belongs to (UUID).
                    readOnly: true
                digest:
                    type: string
                    title: digest
                    description: 'The identity: SHA-256 of the normalized bundle, as `sha256:<hex>`.'
                    readOnly: true
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentKind'
                    title: kind
                    readOnly: true
                size_bytes:
                    type: string
                    title: size_bytes
                    format: int64
                    description: Size of the stored bundle in bytes.
                    readOnly: true
                contract:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Contract'
                    title: contract
                    description: |-
                        The inputs and outputs the bundle exposes. Inferred from the bundle at
                         publish; curated by a publisher once the contract format lands.
                    readOnly: true
                provenance:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Provenance'
                    title: provenance
                    description: Where the bytes came from.
                    readOnly: true
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.registry.v1.Finding'
                    title: findings
                    description: |-
                        What the publish gate found. Informational findings do not block a
                         publish; a revision with findings is published with them attached, and
                         the findings delta between two revisions is what an upgrade review reads.
                    readOnly: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.RevisionStatus'
                    title: status
                    readOnly: true
                status_changed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: status_changed_at
                    description: |-
                        When and why the status last changed. Unset on a revision that has only
                         ever been PUBLISHED.
                    readOnly: true
                status_reason:
                    type: string
                    title: status_reason
                    readOnly: true
                tags:
                    type: array
                    items:
                        type: string
                        readOnly: true
                    title: tags
                    description: The tags currently naming this revision.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
            title: Revision
            additionalProperties: false
            description: Revision is one published artifact. Immutable except for its status.
        admiral.api.registry.v1.RevisionStatus:
            type: string
            title: RevisionStatus
            enum:
                - REVISION_STATUS_UNSPECIFIED
                - PUBLISHED
                - DEPRECATED
                - REVOKED
            description: RevisionStatus is a revision's lifecycle. There is no deleted state.
        admiral.api.registry.v1.SetRevisionStatusRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                digest:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
                    description: |-
                        `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                         a floating tag might name different bytes by the time anyone reads the
                         reason.
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.RevisionStatus'
                    not:
                        enum:
                            - REVISION_STATUS_UNSPECIFIED
                    title: status
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    minLength: 1
                    description: |-
                        Shown to anyone who adopts or tries to adopt the revision, and to every
                         environment running it.
            title: SetRevisionStatusRequest
            required:
                - component_id
                - digest
                - status
                - reason
            additionalProperties: false
            description: |-
                SetRevisionStatusRequest names a revision by digest, its new status, and
                 why.
        admiral.api.registry.v1.SetRevisionStatusResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Revision'
                    title: revision
            title: SetRevisionStatusResponse
            additionalProperties: false
            description: SetRevisionStatusResponse contains the revision with its new status.
        admiral.api.registry.v1.SetTagRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                name:
                    type: string
                    title: name
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
                digest:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
                    description: The revision to name, as `sha256:<hex>`.
            title: SetTagRequest
            required:
                - component_id
                - name
                - digest
            additionalProperties: false
            description: SetTagRequest points a tag at a revision.
        admiral.api.registry.v1.SetTagResponse:
            type: object
            properties:
                tag:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Tag'
                    title: tag
            title: SetTagResponse
            additionalProperties: false
            description: SetTagResponse contains the tag as it now stands.
        admiral.api.registry.v1.Tag:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    description: As written after the colon in `cloud-sql:v1.2.0`.
                    readOnly: true
                digest:
                    type: string
                    title: digest
                    description: The revision it names, as `sha256:<hex>`.
                    readOnly: true
                immutable:
                    type: boolean
                    title: immutable
                    description: |-
                        True for a semver tag: it never moves once assigned. Decided from the
                         name, so two tags with the same name are always the same class.
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
                updated_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: updated_at
                    readOnly: true
            title: Tag
            additionalProperties: false
            description: Tag is a name pointing at a revision.
        admiral.api.registry.v1.UpdateComponentRequest:
            type: object
            properties:
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                labels:
                    oneOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.ComponentLabels'
                        - type: "null"
                    title: labels
                    description: Replaces the label set entirely when present.
            title: UpdateComponentRequest
            required:
                - component_id
            additionalProperties: false
            description: |-
                UpdateComponentRequest carries the fields to change. Omitted fields are
                 left as they are.
        admiral.api.registry.v1.UpdateComponentResponse:
            type: object
            properties:
                component:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component'
                    title: component
            title: UpdateComponentResponse
            additionalProperties: false
            description: UpdateComponentResponse contains the updated component.
        admiral.api.run.v1.ApplyRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run to apply. UUID or `run-<suffix>` display ID.
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: Optional message describing the apply (e.g., "Approved by @martin").
            title: ApplyRunRequest
            required:
                - run_id
            additionalProperties: false
            description: ApplyRunRequest transitions a planned run to apply phase.
        admiral.api.run.v1.ApplyRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: |-
                        The run with status advanced to APPLYING. Revisions that were
                         PLANNED are now APPLYING.
            title: ApplyRunResponse
            additionalProperties: false
            description: ApplyRunResponse contains the run after apply jobs are dispatched.
        admiral.api.run.v1.ArtifactKind:
            type: string
            title: ArtifactKind
            enum:
                - ARTIFACT_KIND_UNSPECIFIED
                - ARTIFACT_KIND_SOURCE_BUNDLE
                - ARTIFACT_KIND_PLAN
                - ARTIFACT_KIND_MANIFEST_BUNDLE
            description: ArtifactKind types an artifact a phase produces or consumes.
        admiral.api.run.v1.ArtifactRef:
            type: object
            properties:
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ArtifactKind'
                    title: kind
                    description: The kind of artifact.
                key:
                    type: string
                    title: key
                    description: Storage key (object-storage path) where the artifact bytes live.
                checksum:
                    type: string
                    title: checksum
                    description: |-
                        SHA-256 checksum of the artifact for integrity verification. May be empty
                         for artifacts not yet verified.
            title: ArtifactRef
            additionalProperties: false
            description: |-
                ArtifactRef addresses one artifact an execution produced: its kind, the
                 storage key where the bytes live, and a checksum for fail-closed
                 verification.
        admiral.api.run.v1.CancelRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run to cancel. UUID or `run-<suffix>` display ID.
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    description: Optional reason for cancellation.
            title: CancelRunRequest
            required:
                - run_id
            additionalProperties: false
            description: CancelRunRequest cancels an in-progress run.
        admiral.api.run.v1.CancelRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: The canceled run.
            title: CancelRunResponse
            additionalProperties: false
            description: CancelRunResponse contains the updated run.
        admiral.api.run.v1.ChangeSummary:
            type: object
            properties:
                creates:
                    type: integer
                    title: creates
                    format: int32
                    description: Number of resources to be created.
                updates:
                    type: integer
                    title: updates
                    format: int32
                    description: Number of resources to be updated in place.
                deletes:
                    type: integer
                    title: deletes
                    format: int32
                    description: Number of resources to be deleted.
                noops:
                    type: integer
                    title: noops
                    format: int32
                    description: Number of resources left unchanged (no-op).
            title: ChangeSummary
            additionalProperties: false
            description: |-
                ChangeSummary is the normalized, executor-agnostic count of what an
                 execution does: creates, updates, deletes, and no-ops. Every executor maps
                 its native result onto this shape -- terraform's +/~/- plan counts and
                 kubernetes server-side-apply created/configured/deleted.
        admiral.api.run.v1.CreateRunRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application to run (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: Optional message describing this run.
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        Optional: run from a prior run's configuration snapshots instead of
                         from the current component HEAD. When set, each revision is seeded
                         from the source run's revision for the same component (catalog_item_id,
                         version, resolved_values, source_id, working_directory). This is the
                         rollback mechanism: re-plan and re-apply a known-good configuration
                         against the current infrastructure state.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        Optional: run the entries and variable changes captured in a change
                         set. When set, the component set and variable overlay are sourced from
                         the change set instead of the application's full component list. The
                         change set must be OPEN and target the same (application, environment).
            title: CreateRunRequest
            required:
                - application_id
                - environment_id
            additionalProperties: false
            description: CreateRunRequest triggers a new run.
        admiral.api.run.v1.CreateRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: The created run. Status will be PENDING initially.
            title: CreateRunResponse
            additionalProperties: false
            description: CreateRunResponse contains the newly created run.
        admiral.api.run.v1.EngineOutput:
            type: object
            properties:
                value:
                    type: string
                    title: value
                    description: |-
                        The output value, serialized as a string. Complex values (lists, maps)
                         are JSON-encoded.
                type:
                    type: string
                    title: type
                    description: Engine type descriptor (e.g. "string", "number", "list(string)").
                sensitive:
                    type: boolean
                    title: sensitive
                    description: Whether the executor marked this output as sensitive.
            title: EngineOutput
            additionalProperties: false
            description: |-
                EngineOutput is a single output value captured from an executor after a
                 successful apply (e.g. `terraform output -json`). Engine-agnostic: the
                 (value, type, sensitive) shape generalizes across executors. Lives in run/v1
                 so it can be shared by the TERRAFORM and KUBERNETES agent report paths via
                 ExecutionReport.
        admiral.api.run.v1.ExecutionReport:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ExecutionStatus'
                    title: status
                    description: Terminal status of the phase.
                error_message:
                    type: string
                    title: error_message
                    description: Error message if the phase failed. Empty on success.
                summary:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ChangeSummary'
                    title: summary
                    description: Normalized change counts (create/update/delete/noop).
                outputs:
                    type: object
                    title: outputs
                    additionalProperties:
                        allOf:
                            - $ref: '#/components/schemas/admiral.api.run.v1.EngineOutput'
                        title: value
                    description: Outputs captured after a successful apply. Keys are output names.
                artifact:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ArtifactRef'
                    title: artifact
                    description: |-
                        Optional reference to an artifact this phase produced (e.g. a terraform
                         PLAN). Recorded into the revision's artifact set when present.
                transcript:
                    type: string
                    title: transcript
                    description: |-
                        The phase's human-readable execution log (e.g. terraform plan/apply
                         output). Persisted as the phase transcript. (Interim: live log streaming
                         moves to a dedicated channel in a later phase.)
                detail:
                    type: string
                    title: detail
                    format: byte
                    description: |-
                        Opaque, per-executor richness, never branched on by the orchestration
                         layer. JSON-encoded.
            title: ExecutionReport
            additionalProperties: false
            description: |-
                ExecutionReport is the executor-agnostic outcome of one revision phase --
                 the single report shape every executor maps its native result onto. The
                 TERRAFORM and KUBERNETES agents both report via this message.
        admiral.api.run.v1.ExecutionStatus:
            type: string
            title: ExecutionStatus
            enum:
                - EXECUTION_STATUS_UNSPECIFIED
                - EXECUTION_STATUS_SUCCEEDED
                - EXECUTION_STATUS_FAILED
            description: |-
                ExecutionStatus is the terminal outcome an executor reports for a phase.
                 Non-terminal progress (RUNNING) is observed server-side, not reported here.
        admiral.api.run.v1.GetRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision (UUID).
            title: GetRevisionRequest
            required:
                - run_id
                - revision_id
            additionalProperties: false
            description: GetRevisionRequest identifies a revision within a run.
        admiral.api.run.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Revision'
                    title: revision
                    description: The revision record with current status and artifacts.
            title: GetRevisionResponse
            additionalProperties: false
            description: GetRevisionResponse contains the revision record.
        admiral.api.run.v1.GetRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run. Either a UUID or a `run-<suffix>` display ID.
            title: GetRunRequest
            required:
                - run_id
            additionalProperties: false
            description: GetRunRequest identifies a run to retrieve.
        admiral.api.run.v1.GetRunResponse:
            type: object
            properties:
                run:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: run
                    description: The run record with current status.
            title: GetRunResponse
            additionalProperties: false
            description: GetRunResponse contains the run record.
        admiral.api.run.v1.ListRevisionsRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run. UUID or `run-<suffix>` display ID.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of revisions to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListRevisionsRequest
            required:
                - run_id
            additionalProperties: false
            description: ListRevisionsRequest lists all revisions for a run.
        admiral.api.run.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.Revision'
                    title: revisions
                    description: The list of revisions, ordered by dependency graph (upstream first).
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListRevisionsResponse
            additionalProperties: false
            description: ListRevisionsResponse contains all revisions for a run.
        admiral.api.run.v1.ListRunsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `application_id`: runs for a specific application (UUID).
                           - `environment_id`: runs to a specific environment (UUID).
                           - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                           - `change_set_id`: runs for a specific change set (UUID).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of runs to return per page. Defaults to 50 when omitted or
                         0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListRunsRequest
            additionalProperties: false
            description: ListRunsRequest contains pagination and filter parameters.
        admiral.api.run.v1.ListRunsResponse:
            type: object
            properties:
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.Run'
                    title: runs
                    description: The list of runs, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListRunsResponse
            additionalProperties: false
            description: ListRunsResponse contains a page of runs.
        admiral.api.run.v1.RetryRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision to retry (UUID). Must be in FAILED status.
            title: RetryRevisionRequest
            required:
                - run_id
                - revision_id
            additionalProperties: false
            description: RetryRevisionRequest retries a failed revision.
        admiral.api.run.v1.RetryRevisionResponse:
            type: object
            properties:
                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.Revision'
                    title: revision
                    description: |-
                        The retried revision. Status resets and retry_count is incremented.
                         Downstream revisions that were BLOCKED will automatically unblock
                         if this revision succeeds.
            title: RetryRevisionResponse
            additionalProperties: false
            description: RetryRevisionResponse contains the updated revision.
        admiral.api.run.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the revision (UUID).
                run_id:
                    type: string
                    title: run_id
                    format: uuid
                    description: The run this revision belongs to (UUID).
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                    description: The component this revision is for (UUID).
                component_name:
                    type: string
                    title: component_name
                    description: Component name at the time of run (immutable semantic key).
                kind:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionKind'
                    title: kind
                    description: Component kind at the time of run (after override resolution).
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionStatus'
                    title: status
                    description: Lifecycle status of this revision.
                change_type:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionChangeType'
                    title: change_type
                    description: |-
                        What type of change this revision represents relative to the previously
                         deployed state.
                previous_revision_id:
                    type: string
                    title: previous_revision_id
                    description: |-
                        The last succeeded revision for this (component, environment) at the
                         time this revision was created. Null for CREATE revisions.
                source_id:
                    type: string
                    title: source_id
                    description: |-
                        The source the module pointed to at the time of this revision (UUID).
                         Snapshotted so a rollback can re-fetch from the original source even if
                         the module's source binding is later edited. Execution today resolves
                         fetch location through the live module; this field is the audit anchor.
                ref:
                    type: string
                    title: ref
                    description: The git ref / version selector deployed (the component's ref at snapshot).
                resolved_values:
                    type: string
                    title: resolved_values
                    description: |-
                        The resolved values template snapshot: the values_template with all
                         variable references and component output references fully resolved.
                         Stored for audit: shows exactly what inputs were used. Sensitive
                         variable values are masked in API responses.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component IDs that this revision depends on. Populated from the resolved
                         depends_on list plus implicit dependencies from template expressions.
                blocked_by:
                    type: array
                    items:
                        type: string
                    title: blocked_by
                    description: |-
                        Component IDs that are blocking this revision. Only populated when
                         status is BLOCKED; indicates which upstream components failed.
                plan_summary:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.ChangeSummary'
                    title: plan_summary
                    description: |-
                        The normalized change counts (creates/updates/deletes/noops) this
                         revision's plan computed. Populated after planning. Engine-agnostic.
                available_phases:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.run.v1.RevisionPhase'
                    title: available_phases
                    description: |-
                        Phase labels for which a transcript has been stored, in the order they
                         ran. Populated as each phase completes (a revision that planned and then
                         applied carries `[REVISION_PHASE_PLAN, REVISION_PHASE_APPLY]`). Fetch a
                         phase's transcript via
                         `GET /api/v1/runs/{run_id}/revisions/{revision_id}/{phase}`.
                error_message:
                    type: string
                    title: error_message
                    description: Error message if the revision failed. Empty on success.
                retry_count:
                    type: integer
                    title: retry_count
                    format: int32
                    description: Number of retry attempts. Starts at 0 for the initial attempt.
                started_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: started_at
                    description: When the revision started execution (transitioned from PENDING/QUEUED).
                completed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: completed_at
                    description: When the revision finished (succeeded, failed, or canceled).
                working_directory:
                    type: string
                    title: working_directory
                    description: |-
                        Subdirectory within the delivered archive where the executor runs.
                         Empty means the archive root. Populated from the catalog item's path field
                         at snapshot time so that relative references resolve correctly.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the revision was created (same as run created_at).
                resolved_commit:
                    type: string
                    title: resolved_commit
                    description: |-
                        The concrete commit this revision resolved its ref to and pinned -- the
                         reproducibility anchor. `ref` is the intent (e.g. `main`); this is what
                         actually deployed. Populated when resolution is wired (a later WP).
                type:
                    type: string
                    title: type
                    description: |-
                        The deploy/engine type this revision runs (TERRAFORM/HELM/KUSTOMIZE/
                         MANIFEST), denormalized from the component at snapshot. Selects the
                         executor: the orchestration layer routes by this type, not by kind.
            title: Revision
            additionalProperties: false
            description: |-
                Revision represents an immutable, rendered artifact for a single component
                 within a run. Each revision tracks the full lifecycle from rendering
                 through execution, and stores references to the produced artifacts
                 (rendered manifests, binary plan files, etc.).

                 For infrastructure components (terraform-semantic engine, Terraform or
                 OpenTofu):
                   - Rendering produces the infrastructure source tree (.tf files and
                     auto-loaded tfvars) with resolved variable values.
                   - The engine's plan and apply phases are executed by the assigned
                     TERRAFORM agent (see JobBundle.engine for engine selection).
                   - The plan output is stored for visibility.
                   - Each component has its own state, stored via the configured backend.

                 For workload components (Helm, Kustomize, manifests):
                   - Rendering produces Kubernetes manifests (via helm template, kustomize
                     build, or raw file collection).
                   - Manifests are ordered (CRDs before resources, namespaces first).
                   - The rendered bundle is sent to the K8s agent for application.
        admiral.api.run.v1.RevisionChangeType:
            type: string
            title: RevisionChangeType
            enum:
                - REVISION_CHANGE_TYPE_UNSPECIFIED
                - REVISION_CHANGE_TYPE_CREATE
                - REVISION_CHANGE_TYPE_UPDATE
                - REVISION_CHANGE_TYPE_DESTROY
                - REVISION_CHANGE_TYPE_RECREATE
                - REVISION_CHANGE_TYPE_IMPORT
                - REVISION_CHANGE_TYPE_NO_CHANGE
            description: |-
                RevisionChangeType classifies the change a revision represents relative to
                 the previously deployed state for the same component.
        admiral.api.run.v1.RevisionKind:
            type: string
            title: RevisionKind
            enum:
                - REVISION_KIND_UNSPECIFIED
                - REVISION_KIND_INFRASTRUCTURE
                - REVISION_KIND_WORKLOAD
            description: |-
                RevisionKind mirrors ComponentKind but is stored on the revision to capture
                 the effective kind at run time (may differ from the component default
                 if an environment override changed the source type).
        admiral.api.run.v1.RevisionPhase:
            type: string
            title: RevisionPhase
            enum:
                - REVISION_PHASE_UNSPECIFIED
                - REVISION_PHASE_PLAN
                - REVISION_PHASE_APPLY
            description: |-
                RevisionPhase labels which phase of a revision's lifecycle produced a
                 retrievable transcript. Plan and apply are the only phases today; future
                 phases (e.g., import) extend this enum without changing the storage shape.
        admiral.api.run.v1.RevisionStatus:
            type: string
            title: RevisionStatus
            enum:
                - REVISION_STATUS_UNSPECIFIED
                - REVISION_STATUS_PENDING
                - REVISION_STATUS_QUEUED
                - REVISION_STATUS_PLANNING
                - REVISION_STATUS_PLANNED
                - REVISION_STATUS_APPLYING
                - REVISION_STATUS_SUCCEEDED
                - REVISION_STATUS_FAILED
                - REVISION_STATUS_BLOCKED
                - REVISION_STATUS_CANCELED
                - REVISION_STATUS_SUPERSEDED
                - REVISION_STATUS_DEFERRED
                - REVISION_STATUS_STALE
                - REVISION_STATUS_AWAITING_APPROVAL
            description: |-
                RevisionStatus represents the lifecycle status of a single component
                 revision within a run.
        admiral.api.run.v1.RevisionSummary:
            type: object
            properties:
                total:
                    type: integer
                    title: total
                    format: int32
                    description: Total number of component revisions in this run.
                succeeded:
                    type: integer
                    title: succeeded
                    format: int32
                    description: Number of revisions that completed successfully.
                failed:
                    type: integer
                    title: failed
                    format: int32
                    description: Number of revisions that failed.
                blocked:
                    type: integer
                    title: blocked
                    format: int32
                    description: Number of revisions that are blocked by upstream failures.
                running:
                    type: integer
                    title: running
                    format: int32
                    description: Number of revisions currently running (planning or applying).
                canceled:
                    type: integer
                    title: canceled
                    format: int32
                    description: Number of revisions that were canceled.
                pending:
                    type: integer
                    title: pending
                    format: int32
                    description: Number of revisions that have not started yet.
            title: RevisionSummary
            additionalProperties: false
            description: |-
                RevisionSummary provides aggregate counts of revision statuses within a
                 run, enabling quick status display without loading all revisions.
        admiral.api.run.v1.Run:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the run (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application being deployed (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                status:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RunStatus'
                    title: status
                    description: Composite status derived from all component revisions.
                triggered_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: triggered_by
                    description: The user or agent that triggered the run (server-populated from token).
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: |-
                        Optional message describing the run (e.g., "Deploying v2.1.0
                         with new caching layer" or "Rolling back to stable after API errors").
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        If this run was created as a rollback from a prior run, this field
                         contains the source run's UUID. Empty for normal runs.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        The changeset that was deployed (UUID). Absent for pre-changeset runs
                         and reconcile (no-changeset) runs.
                revision_summary:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.run.v1.RevisionSummary'
                    title: revision_summary
                    description: Summary counts for quick status display.
                completed_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: completed_at
                    description: |-
                        When the run finished (all revisions completed, failed, or canceled).
                         Absent while the run is in progress.
                display_id:
                    type: string
                    title: display_id
                    description: |-
                        Typed display identifier of the form `run-<12-char-suffix>` (e.g.,
                         `run-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                         over `id` for user-facing references; lookups accept either form.
                application_name:
                    type: string
                    title: application_name
                    description: |-
                        Display name of the parent application. Denormalized for display.
                         Read-only; ignored on writes.
                environment_name:
                    type: string
                    title: environment_name
                    description: |-
                        Display name of the parent environment. Denormalized for display.
                         Read-only; ignored on writes.
                change_set_display_id:
                    type: string
                    title: change_set_display_id
                    description: |-
                        Display ID of the changeset this run deployed (`cs-<suffix>`).
                         Denormalized for display. Empty when `change_set_id` is empty
                         (pre-changeset runs, reconcile runs). Read-only.
                change_set_title:
                    type: string
                    title: change_set_title
                    description: |-
                        Title of the changeset this run deployed. Denormalized for display.
                         Empty when `change_set_id` is empty. Read-only.
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    description: When the run was created.
            title: Run
            additionalProperties: false
            description: |-
                Run represents a single execution against an application+environment.
                 Each run produces one Revision per component. The run tracks the composite
                 status across all revisions and provides the audit trail for what was
                 executed, when, and by whom.

                 Run records are immutable once created. There is no UpdateRun RPC and no
                 `updated_at` field. The composite `status`, `revision_summary`, and
                 `completed_at` fields are server-maintained as revisions progress;
                 everything else is fixed at creation time. To change what is deployed,
                 create a new run.
            example:
                id: "7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b"
                display_id: "run-3k7m9p2q4rvw"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                status: "RUN_STATUS_SUCCEEDED"
                message: "Deploy v2.4.1 with updated ingress rules"
                triggered_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"

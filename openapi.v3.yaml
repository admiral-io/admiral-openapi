    /v1/components/{component_id}/revisions/{digest}/set-status:
        post:
            tags:
                - Components
            summary: Set a revision's status
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_SetRevisionStatus
            parameters:
                - name: component_id
                  in: path
                  description: The component_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: component_id
                    format: uuid
                - name: digest
                  in: path
                  description: |-
                    `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                     a floating tag might name different bytes by the time anyone reads the
                     reason.
                  required: true
                  schema:
                    type: string
                    title: digest
                    pattern: ^sha256:[0-9a-f]{64}$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.registry.v1.RevisionStatus'
                                    not:
                                        enum:
                                            - REVISION_STATUS_UNSPECIFIED
                                    title: status
                                reason:
                                    type: string
                                    title: reason
                                    maxLength: 1024
                                    minLength: 1
                                    description: |-
                                        Shown to anyone who adopts or tries to adopt the revision, and to every
                                         environment running it.
                            title: SetRevisionStatusRequest
                            required:
                                - status
                                - reason
                            additionalProperties: false
                            description: |-
                                SetRevisionStatusRequest names a revision by digest, its new status, and
                                 why.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.SetRevisionStatusResponse'
    /v1/components/{component_id}/revisions/{reference}:
        get:
            tags:
                - Components
            summary: Retrieve a revision
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_GetRevision
            parameters:
                - name: component_id
                  in: path
                  description: The component_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: component_id
                    format: uuid
                - name: reference
                  in: path
                  description: |-
                    A tag name (`v1.2.0`, `latest`) or a digest (`sha256:<hex>`). A digest
                     is recognised by its prefix; everything else is looked up as a tag.
                  required: true
                  schema:
                    type: string
                    title: reference
                    maxLength: 128
                    minLength: 1
                    pattern: ^(sha256:[0-9a-f]{64}|[A-Za-z0-9][A-Za-z0-9._+-]{0,127})$
            responses:
                "200":
                    description: Success
                    content:

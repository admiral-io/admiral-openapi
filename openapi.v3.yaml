                    title: updated_at
                    description: When the module was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Module
            additionalProperties: false
            description: |-
                Module represents a named reference to a slice of content within a Source at
                 a specific ref. One Source can back many Modules (different refs, different
                 subtrees, different working directories).

                 The module type identifies what the content is (Terraform, Helm, Kustomize,
                 raw manifests) independently of how it is fetched (the Source type). This
                 separation allows a single Git source to back Terraform, Helm, and manifest
                 modules in different subdirectories.
        admiral.module.v1.Module.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.module.v1.ModuleType:
            type: string
            title: ModuleType
            enum:
                - MODULE_TYPE_UNSPECIFIED
                - MODULE_TYPE_TERRAFORM
                - MODULE_TYPE_HELM
                - MODULE_TYPE_KUSTOMIZE
                - MODULE_TYPE_MANIFEST
            description: |-
                ModuleType identifies the content semantics: what the fetched content is and
                 how it should be executed. This is orthogonal to SourceType, which identifies
                 the fetch protocol. A single GIT source can back TERRAFORM, HELM, KUSTOMIZE,
                 and MANIFEST modules in different subdirectories.
        admiral.module.v1.ResolveModuleRequest:
            type: object
            properties:
                module_id:
                    type: string
                    title: module_id
                    format: uuid
                    description: Unique identifier of the module to resolve (UUID).
                ref_override:
                    type: string
                    title: ref_override
                    maxLength: 256
                    description: |-
                        Optional ref override. When set, this ref is used instead of the module's
                         default ref. Useful for previewing a different version without modifying
                         the module definition.
            title: ResolveModuleRequest
            additionalProperties: false
            description: ResolveModuleRequest identifies a module to resolve.
        admiral.module.v1.ResolveModuleResponse:
            type: object
            properties:
                revision:
                    type: string
                    title: revision
                    description: |-
                        The resolved revision identifier. For Git sources, this is the commit SHA.
                         For registry sources, the canonical version string. For HTTP, a content hash.
                digest:
                    type: string
                    title: digest
                    description: |-
                        Content-addressing digest of the fetched content (e.g., "sha1:<commit>",
                         "sha256:<hash>").
                module:
                    title: module
                    description: The module that was resolved, with current field values.
                    $ref: '#/components/schemas/admiral.module.v1.Module'
            title: ResolveModuleResponse
            additionalProperties: false
            description: |-
                ResolveModuleResponse contains the resolved metadata from fetching the
                 module's content via its Source.
        admiral.module.v1.UpdateModuleRequest:
            type: object
            properties:
                module:
                    title: module
                    description: |-
                        The module with updated fields. Only fields specified in `update_mask`
                         are updated.
                    $ref: '#/components/schemas/admiral.module.v1.Module'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. Required. The server rejects updates
                         without a mask to prevent accidental full-replace.
                         Supported fields: `name`, `description`, `source_id`, `ref`, `root`,
                         `path`, `labels`.
                         Immutable: `type` (returns InvalidArgument if included).
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateModuleRequest
            required:
                - module
            additionalProperties: false
            description: UpdateModuleRequest contains the module fields to update.
        admiral.module.v1.UpdateModuleResponse:
            type: object
            properties:
                module:
                    title: module
                    description: The updated module.
                    $ref: '#/components/schemas/admiral.module.v1.Module'
            title: UpdateModuleResponse
            additionalProperties: false
            description: UpdateModuleResponse contains the updated module.
        admiral.run.v1.ApplyRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run to apply. UUID or `run-<suffix>` display ID.
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: Optional message describing the apply (e.g., "Approved by @martin").
            title: ApplyRunRequest
            additionalProperties: false
            description: ApplyRunRequest transitions a planned run to apply phase.
        admiral.run.v1.ApplyRunResponse:
            type: object
            properties:
                run:
                    title: run
                    description: |-
                        The run with status advanced to APPLYING. Revisions that were
                         AWAITING_APPROVAL are now APPLYING.
                    $ref: '#/components/schemas/admiral.run.v1.Run'
            title: ApplyRunResponse
            additionalProperties: false
            description: ApplyRunResponse contains the run after apply jobs are dispatched.
        admiral.run.v1.CancelRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run to cancel. UUID or `run-<suffix>` display ID.
                reason:
                    type: string
                    title: reason
                    maxLength: 1024
                    description: Optional reason for cancellation.
            title: CancelRunRequest
            additionalProperties: false
            description: CancelRunRequest cancels an in-progress run.
        admiral.run.v1.CancelRunResponse:
            type: object
            properties:
                run:
                    title: run
                    description: The canceled run.
                    $ref: '#/components/schemas/admiral.run.v1.Run'
            title: CancelRunResponse
            additionalProperties: false
            description: CancelRunResponse contains the updated run.
        admiral.run.v1.ChangeSummary:
            type: object
            properties:
                additions:
                    type: integer
                    title: additions
                    format: int32
                    description: Number of resources to be created.
                changes:
                    type: integer
                    title: changes
                    format: int32
                    description: Number of resources to be updated in place.
                destructions:
                    type: integer
                    title: destructions
                    format: int32
                    description: Number of resources to be destroyed.
            title: ChangeSummary
            additionalProperties: false
            description: |-
                ChangeSummary provides resource change counts from an infrastructure plan.
                 Engine-agnostic. The "+N / ~N / -N" shape is universal across Terraform,
                 OpenTofu, and similar engines.
        admiral.run.v1.CreateRunRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application to run (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: Optional message describing this run.
                destroy:
                    type: boolean
                    title: destroy
                    description: |-
                        Destroy all resources in the environment. Runs the engine's destroy
                         phase (`terraform destroy` / `tofu destroy`) for infra components and
                         deletes workload resources from the cluster, in reverse dependency
                         order. Required before deleting an environment that has active resources.
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        Optional: run from a prior run's configuration snapshots instead of
                         from the current component HEAD. When set, each revision is seeded
                         from the source run's revision for the same component (module_id,
                         version, resolved_values, source_id, working_directory). This is the
                         rollback mechanism: re-plan and re-apply a known-good configuration
                         against the current infrastructure state.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        Optional: run the entries and variable changes captured in a change
                         set. When set, the component set and variable overlay are sourced from
                         the change set instead of the application's full component list. The
                         change set must be OPEN and target the same (application, environment).
            title: CreateRunRequest
            additionalProperties: false
            description: CreateRunRequest triggers a new run.
        admiral.run.v1.CreateRunResponse:
            type: object
            properties:
                run:
                    title: run
                    description: The created run. Status will be PENDING initially.
                    $ref: '#/components/schemas/admiral.run.v1.Run'
            title: CreateRunResponse
            additionalProperties: false
            description: CreateRunResponse contains the newly created run.
        admiral.run.v1.GetRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision (UUID).
            title: GetRevisionRequest
            additionalProperties: false
            description: GetRevisionRequest identifies a revision within a run.
        admiral.run.v1.GetRevisionResponse:
            type: object
            properties:
                revision:
                    title: revision
                    description: The revision record with current status and artifacts.
                    $ref: '#/components/schemas/admiral.run.v1.Revision'
            title: GetRevisionResponse
            additionalProperties: false
            description: GetRevisionResponse contains the revision record.
        admiral.run.v1.GetRunRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run. Either a UUID or a `run-<suffix>` display ID.
            title: GetRunRequest
            additionalProperties: false
            description: GetRunRequest identifies a run to retrieve.
        admiral.run.v1.GetRunResponse:
            type: object
            properties:
                run:
                    title: run
                    description: The run record with current status.
                    $ref: '#/components/schemas/admiral.run.v1.Run'
            title: GetRunResponse
            additionalProperties: false
            description: GetRunResponse contains the run record.
        admiral.run.v1.ListRevisionsRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: Identifier of the run. UUID or `run-<suffix>` display ID.
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of revisions to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListRevisionsRequest
            additionalProperties: false
            description: ListRevisionsRequest lists all revisions for a run.
        admiral.run.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.run.v1.Revision'
                    title: revisions
                    description: The list of revisions, ordered by dependency graph (upstream first).
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListRevisionsResponse
            additionalProperties: false
            description: ListRevisionsResponse contains all revisions for a run.
        admiral.run.v1.ListRunsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL.

                         Syntax: `field['name'] = 'value'` with AND/OR/NOT, comparison operators
                         (=, !=, <, >, <=, >=, ~=), and predicates (IN, BETWEEN, CONTAINS,
                         STARTS_WITH, ENDS_WITH, IS NULL, EXISTS).

                         Filterable fields:
                           - `application_id`: runs for a specific application (UUID).
                           - `environment_id`: runs to a specific environment (UUID).
                           - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                           - `change_set_id`: runs for a specific change set (UUID).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: Maximum number of runs to return per page.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListRunsRequest
            additionalProperties: false
            description: ListRunsRequest contains pagination and filter parameters.
        admiral.run.v1.ListRunsResponse:
            type: object
            properties:
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.run.v1.Run'
                    title: runs
                    description: The list of runs, ordered from newest to oldest.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListRunsResponse
            additionalProperties: false
            description: ListRunsResponse contains a page of runs.
        admiral.run.v1.RetryRevisionRequest:
            type: object
            properties:
                run_id:
                    type: string
                    title: run_id
                    minLength: 1
                    description: The run. UUID or `run-<suffix>` display ID.
                revision_id:
                    type: string
                    title: revision_id
                    format: uuid
                    description: The revision to retry (UUID). Must be in FAILED status.
            title: RetryRevisionRequest
            additionalProperties: false
            description: RetryRevisionRequest retries a failed revision.
        admiral.run.v1.RetryRevisionResponse:
            type: object
            properties:
                revision:
                    title: revision
                    description: |-
                        The retried revision. Status resets and retry_count is incremented.
                         Downstream revisions that were BLOCKED will automatically unblock
                         if this revision succeeds.
                    $ref: '#/components/schemas/admiral.run.v1.Revision'
            title: RetryRevisionResponse
            additionalProperties: false
            description: RetryRevisionResponse contains the updated revision.
        admiral.run.v1.Revision:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the revision (UUID).
                run_id:
                    type: string
                    title: run_id
                    format: uuid
                    description: The run this revision belongs to (UUID).
                component_id:
                    type: string
                    title: component_id
                    format: uuid
                    description: The component this revision is for (UUID).
                component_name:
                    type: string
                    title: component_name
                    description: Component name at the time of run (immutable semantic key).
                kind:
                    title: kind
                    description: Component kind at the time of run (after override resolution).
                    $ref: '#/components/schemas/admiral.run.v1.RevisionKind'
                status:
                    title: status
                    description: Lifecycle status of this revision.
                    $ref: '#/components/schemas/admiral.run.v1.RevisionStatus'
                change_type:
                    title: change_type
                    description: |-
                        What type of change this revision represents relative to the previously
                         deployed state.
                    $ref: '#/components/schemas/admiral.run.v1.RevisionChangeType'
                previous_revision_id:
                    type: string
                    title: previous_revision_id
                    description: |-
                        The last succeeded revision for this (component, environment) at the
                         time this revision was created. Null for CREATE revisions.
                source_id:
                    type: string
                    title: source_id
                    description: |-
                        The source the module pointed to at the time of this revision (UUID).
                         Snapshotted so a rollback can re-fetch from the original source even if
                         the module's source binding is later edited. Execution today resolves
                         fetch location through the live module; this field is the audit anchor.
                version:
                    type: string
                    title: version
                    description: The version deployed (after override resolution).
                resolved_values:
                    type: string
                    title: resolved_values
                    description: |-
                        The resolved values template snapshot: the values_template with all
                         variable references and component output references fully resolved.
                         Stored for audit: shows exactly what inputs were used. Sensitive
                         variable values are masked in API responses.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component IDs that this revision depends on. Populated from the resolved
                         depends_on list plus implicit dependencies from template expressions.
                blocked_by:
                    type: array
                    items:
                        type: string
                    title: blocked_by
                    description: |-
                        Component IDs that are blocking this revision. Only populated when
                         status is BLOCKED; indicates which upstream components failed.
                artifact_checksum:
                    type: string
                    title: artifact_checksum
                    description: SHA-256 checksum of the rendered artifact bundle (tar.gz).
                artifact_url:
                    type: string
                    title: artifact_url
                    description: |-
                        Storage location of the rendered artifact bundle. Internal reference
                         used by agents/runners to fetch the bundle.
                plan_summary:
                    title: plan_summary
                    description: |-
                        (Infrastructure only) The number of resources the plan will add,
                         change, and destroy. Populated after planning completes. Engine-agnostic:
                         applies to Terraform, OpenTofu, or any future engine that models changes
                         as create/update/delete counts.
                    $ref: '#/components/schemas/admiral.run.v1.ChangeSummary'
                available_phases:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.run.v1.RevisionPhase'
                    title: available_phases
                    description: |-
                        Phase labels for which a transcript has been stored, in the order they
                         ran. Populated as each phase completes (a revision that planned and then
                         applied carries `[REVISION_PHASE_PLAN, REVISION_PHASE_APPLY]`). Fetch a
                         phase's transcript via
                         `GET /api/v1/runs/{run_id}/revisions/{revision_id}/{phase}`.
                error_message:
                    type: string
                    title: error_message
                    description: Error message if the revision failed. Empty on success.
                retry_count:
                    type: integer
                    title: retry_count
                    format: int32
                    description: Number of retry attempts. Starts at 0 for the initial attempt.
                started_at:
                    title: started_at
                    description: When the revision started execution (transitioned from PENDING/QUEUED).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                completed_at:
                    title: completed_at
                    description: When the revision finished (succeeded, failed, or canceled).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                module_id:
                    type: string
                    title: module_id
                    description: |-
                        The module used for this revision (UUID, after override resolution).
                         Captures which module produced the source_id and version, needed for
                         rollback (re-deploying from a prior revision's snapshot).
                working_directory:
                    type: string
                    title: working_directory
                    description: |-
                        Subdirectory within the delivered archive where the executor runs.
                         Empty means the archive root. Populated from the module's path field
                         at snapshot time so that relative module references resolve correctly.
                created_at:
                    title: created_at
                    description: When the revision was created (same as run created_at).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Revision
            additionalProperties: false
            description: |-
                Revision represents an immutable, rendered artifact for a single component
                 within a run. Each revision tracks the full lifecycle from rendering
                 through execution, and stores references to the produced artifacts
                 (rendered manifests, binary plan files, etc.).

                 For infrastructure components (terraform-semantic engine, Terraform or
                 OpenTofu):
                   - Rendering produces the infrastructure source tree (.tf files and
                     auto-loaded tfvars) with resolved variable values.
                   - The engine's plan and apply phases are executed by the assigned
                     runner (see JobBundle.engine for engine selection).
                   - The plan output is stored for visibility.
                   - Each component has its own state, stored via the configured backend.

                 For workload components (Helm, Kustomize, manifests):
                   - Rendering produces Kubernetes manifests (via helm template, kustomize
                     build, or raw file collection).
                   - Manifests are ordered (CRDs before resources, namespaces first).
                   - The rendered bundle is sent to the K8s agent for application.
        admiral.run.v1.RevisionChangeType:
            type: string
            title: RevisionChangeType
            enum:
                - REVISION_CHANGE_TYPE_UNSPECIFIED
                - REVISION_CHANGE_TYPE_CREATE
                - REVISION_CHANGE_TYPE_UPDATE
                - REVISION_CHANGE_TYPE_DESTROY
                - REVISION_CHANGE_TYPE_RECREATE
                - REVISION_CHANGE_TYPE_IMPORT
                - REVISION_CHANGE_TYPE_NO_CHANGE
            description: |-
                RevisionChangeType classifies the change a revision represents relative to
                 the previously deployed state for the same component.
        admiral.run.v1.RevisionKind:
            type: string
            title: RevisionKind
            enum:
                - REVISION_KIND_UNSPECIFIED
                - REVISION_KIND_INFRASTRUCTURE
                - REVISION_KIND_WORKLOAD
            description: |-
                RevisionKind mirrors ComponentKind but is stored on the revision to capture
                 the effective kind at run time (may differ from the component default
                 if an environment override changed the source type).
        admiral.run.v1.RevisionPhase:
            type: string
            title: RevisionPhase
            enum:
                - REVISION_PHASE_UNSPECIFIED
                - REVISION_PHASE_PLAN
                - REVISION_PHASE_APPLY
            description: |-
                RevisionPhase labels which phase of a revision's lifecycle produced a
                 retrievable transcript. Plan and apply are the only phases today; future
                 phases (e.g., import) extend this enum without changing the storage shape.
        admiral.run.v1.RevisionStatus:
            type: string
            title: RevisionStatus
            enum:
                - REVISION_STATUS_UNSPECIFIED
                - REVISION_STATUS_PENDING
                - REVISION_STATUS_QUEUED
                - REVISION_STATUS_PLANNING
                - REVISION_STATUS_AWAITING_APPROVAL
                - REVISION_STATUS_APPLYING
                - REVISION_STATUS_SUCCEEDED
                - REVISION_STATUS_FAILED
                - REVISION_STATUS_BLOCKED
                - REVISION_STATUS_CANCELED
                - REVISION_STATUS_SUPERSEDED
            description: |-
                RevisionStatus represents the lifecycle status of a single component
                 revision within a run.
        admiral.run.v1.RevisionSummary:
            type: object
            properties:
                total:
                    type: integer
                    title: total
                    format: int32
                    description: Total number of component revisions in this run.
                succeeded:
                    type: integer
                    title: succeeded
                    format: int32
                    description: Number of revisions that completed successfully.
                failed:
                    type: integer
                    title: failed
                    format: int32
                    description: Number of revisions that failed.
                blocked:
                    type: integer
                    title: blocked
                    format: int32
                    description: Number of revisions that are blocked by upstream failures.
                running:
                    type: integer
                    title: running
                    format: int32
                    description: Number of revisions currently running (planning or applying).
                canceled:
                    type: integer
                    title: canceled
                    format: int32
                    description: Number of revisions that were canceled.
                pending:
                    type: integer
                    title: pending
                    format: int32
                    description: Number of revisions that have not started yet.
            title: RevisionSummary
            additionalProperties: false
            description: |-
                RevisionSummary provides aggregate counts of revision statuses within a
                 run, enabling quick status display without loading all revisions.
        admiral.run.v1.Run:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the run (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application being deployed (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The target environment (UUID).
                status:
                    title: status
                    description: Composite status derived from all component revisions.
                    $ref: '#/components/schemas/admiral.run.v1.RunStatus'
                triggered_by:
                    title: triggered_by
                    description: The user or agent that triggered the run (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                message:
                    type: string
                    title: message
                    maxLength: 1024
                    description: |-
                        Optional message describing the run (e.g., "Deploying v2.1.0
                         with new caching layer" or "Rolling back to stable after API errors").
                destroy:
                    type: boolean
                    title: destroy
                    description: |-
                        Whether this is a destroy run. Destroy runs tear down all resources in
                         the environment: the engine's destroy phase for infra components
                         (`terraform destroy` / `tofu destroy`), resource deletion for workload
                         components. Executed in reverse dependency order. Required before an
                         environment with active resources can be deleted.
                source_run_id:
                    type: string
                    title: source_run_id
                    description: |-
                        If this run was created as a rollback from a prior run, this field
                         contains the source run's UUID. Empty for normal runs.
                change_set_id:
                    type: string
                    title: change_set_id
                    description: |-
                        The changeset that was deployed (UUID). Absent for pre-changeset runs
                         and reconcile (no-changeset) runs.
                revision_summary:
                    title: revision_summary
                    description: Summary counts for quick status display.
                    $ref: '#/components/schemas/admiral.run.v1.RevisionSummary'
                completed_at:
                    title: completed_at
                    description: |-
                        When the run finished (all revisions completed, failed, or canceled).
                         Absent while the run is in progress.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                display_id:
                    type: string
                    title: display_id
                    description: |-
                        Typed display identifier of the form `run-<12-char-suffix>` (e.g.,
                         `run-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                         over `id` for user-facing references; lookups accept either form.
                application_name:
                    type: string
                    title: application_name
                    description: |-
                        Display name of the parent application. Denormalized for display.
                         Read-only; ignored on writes.
                environment_name:
                    type: string
                    title: environment_name
                    description: |-
                        Display name of the parent environment. Denormalized for display.
                         Read-only; ignored on writes.
                change_set_display_id:
                    type: string
                    title: change_set_display_id
                    description: |-
                        Display ID of the changeset this run deployed (`cs-<suffix>`).
                         Denormalized for display. Empty when `change_set_id` is empty
                         (pre-changeset runs, reconcile runs). Read-only.
                change_set_title:
                    type: string
                    title: change_set_title
                    description: |-
                        Title of the changeset this run deployed. Denormalized for display.
                         Empty when `change_set_id` is empty. Read-only.
                created_at:
                    title: created_at
                    description: When the run was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Run
            additionalProperties: false
            description: |-
                Run represents a single execution against an application+environment.
                 Each run produces one Revision per component. The run tracks the composite
                 status across all revisions and provides the audit trail for what was
                 executed, when, and by whom.

                 Run records are immutable once created. There is no UpdateRun RPC and no
                 `updated_at` field. The composite `status`, `revision_summary`, and
                 `completed_at` fields are server-maintained as revisions progress;
                 everything else is fixed at creation time. To change what is deployed,
                 create a new run.
            example:
                id: "7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                status: "RUN_STATUS_SUCCEEDED"
                version: "42"
                description: "Deploy v2.4.1 with updated ingress rules"
                created_by: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                created_at: "2025-11-20T14:00:00Z"
                updated_at: "2025-11-20T14:12:00Z"
                completed_at: "2025-11-20T14:12:00Z"
        admiral.run.v1.RunStatus:
            type: string
            title: RunStatus
            enum:
                - RUN_STATUS_UNSPECIFIED
                - RUN_STATUS_PENDING
                - RUN_STATUS_QUEUED
                - RUN_STATUS_PLANNING
                - RUN_STATUS_PLANNED
                - RUN_STATUS_APPLYING
                - RUN_STATUS_SUCCEEDED
                - RUN_STATUS_PARTIALLY_FAILED
                - RUN_STATUS_FAILED
                - RUN_STATUS_CANCELED
                - RUN_STATUS_SUPERSEDED
            description: |-
                RunStatus represents the composite status of a run, derived from the
                 statuses of all its component revisions.
        admiral.runner.v1.ActiveJobInfo:
            type: object
            properties:
                job_id:
                    type: string
                    title: job_id
                    format: uuid
                    description: The job being executed (UUID).
                phase:
                    title: phase
                    description: Current execution phase reported by the worker thread.
                    $ref: '#/components/schemas/admiral.runner.v1.JobPhase'
                started_at:
                    title: started_at
                    description: When execution of this job started (when the runner claimed it).
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ActiveJobInfo
            additionalProperties: false
            description: |-
                ActiveJobInfo summarizes a job currently being executed by a runner instance.
                 Included in RunnerStatus to provide real-time job progress via heartbeat.
        admiral.runner.v1.CreateRunnerRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "prod-terraform-runner").
                         Must be unique within the tenant. Lowercase alphanumeric and hyphens only.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional longer-form description of the runner's purpose.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering runners.
            title: CreateRunnerRequest
            additionalProperties: false
            description: CreateRunnerRequest contains the parameters for creating a new runner.
        admiral.runner.v1.CreateRunnerRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.runner.v1.CreateRunnerResponse:
            type: object
            properties:
                runner:
                    title: runner
                    description: |-
                        The created runner. Health status will be PENDING until the runner
                         begins heartbeating.
                    $ref: '#/components/schemas/admiral.runner.v1.Runner'
                plain_text_token:
                    type: string
                    title: plain_text_token
                    description: |-
                        The raw Service Access Token secret (e.g., "adms_pL2mN5oQ8rS1...").
                         This value is shown exactly once and cannot be retrieved again. Deploy
                         this token to the runner binary for authentication.

                         To create additional tokens (e.g., for rotation), use
                         CreateRunnerToken (POST /v1/runners/{runner_id}/tokens).
            title: CreateRunnerResponse
            additionalProperties: false
            description: |-
                CreateRunnerResponse contains the newly created runner and its initial
                 Service Access Token (SAT).
        admiral.runner.v1.CreateRunnerTokenRequest:
            type: object
            properties:
                runner_id:
                    type: string
                    title: runner_id
                    format: uuid
                    description: The runner to bind this token to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier for the token (e.g., "prod-runner-key").

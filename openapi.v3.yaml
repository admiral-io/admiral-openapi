            title: GetArtifactRequest
            required:
                - change_set_id
                - revision
            additionalProperties: false
        admiral.api.changeset.v1.GetArtifactResponse:
            type: object
            properties:
                artifact_digest:
                    type: string
                    title: artifact_digest
                    description: '`sha256:<hex>` of the artifact as stored, before masking.'
                artifact:
                    type: string
                    title: artifact
                    format: byte
                    description: The artifact, a gzipped tar, with sensitive values masked.
            title: GetArtifactResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
            title: GetChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.GetChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_set
                head:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: head
                    description: Absent before the first edit.
                conflicts:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Conflict'
                    title: conflicts
                    description: While behind, the settings a rebase must resolve; empty when none.
            title: GetChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetComponentValuesRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                component:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                effective:
                    type: boolean
                    title: effective
                    description: |-
                        Return the whole tree the component will receive: its own defaults, the
                         organization's baseline, what the environment runs with, then this
                         change set's edits. An upload never uses this view.
            title: GetComponentValuesRequest
            required:
                - change_set_id
                - component
            additionalProperties: false
        admiral.api.changeset.v1.GetComponentValuesResponse:
            type: object
            properties:
                tree_json:
                    type: string
                    title: tree_json
                    description: A JSON object.
                base_digest:
                    type: string
                    title: base_digest
                    description: The values the change set started from; empty for a component it adds.
                result_digest:
                    type: string
                    title: result_digest
                head_revision:
                    type: integer
                    title: head_revision
                    format: int32
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ValueSource'
                    title: sources
                    description: With `effective`, where each leaf came from; empty otherwise.
            title: GetComponentValuesResponse
            additionalProperties: false
        admiral.api.changeset.v1.GetPrepareRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                revision:
                    type: string
                    title: revision

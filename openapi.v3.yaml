    /api/v1/state/{component_id}/env/{environment_id}:
        parameters:
            - name: component_id
              in: path
              required: true
              description: The infrastructure component (UUID).
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              description: The environment the state is scoped to (UUID).
              schema:
                type: string
                format: uuid
        get:
            tags:
                - State Backend
            summary: Fetch current Terraform state
            description: >-
                Returns the current `.tfstate` document for the component+environment, or 204 when no state exists yet. Maps to the Terraform HTTP backend GET. Authenticate with a PAT/SAT (HTTP Basic password or Bearer token); requires the `state:read` scope.
            responses:
                "200":
                    description: The current Terraform state document.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                "204":
                    description: No state exists yet.
                "401":
                    description: Unauthorized.
                "404":
                    description: Component or environment not found.
        post:
            tags:
                - State Backend
            summary: Push Terraform state
            description: >-
                Stores a new state version; the body is the full `.tfstate` document. Maps to the Terraform HTTP backend POST. Authenticate with a PAT/SAT; requires the `state:write` scope.
            parameters:
                - name: ID
                  in: query
                  required: false
                  description: The held lock ID, when the state is locked.
                  schema:
                    type: string
                    format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true
            responses:
                "200":
                    description: State stored.
                "400":
                    description: Invalid state document.
                "413":
                    description: State document too large.
                "423":
                    description: State is locked by a different lock ID.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StateLockInfo"
    /api/v1/state/{component_id}/env/{environment_id}/lock:
        description: >-
            Locks and unlocks the component+environment state using Terraform's custom `LOCK` and `UNLOCK` HTTP methods (which OpenAPI cannot express as operations) with a `StateLockInfo` body. Returns 200 on success or 423 (with the currently-held `StateLockInfo`) on conflict. Authenticate with a PAT/SAT; requires the `state:write` scope.
        parameters:
            - name: component_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
components:
    schemas:
        admiral.api.agent.v1.Agent:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    readOnly: true
                cluster_id:
                    type: string
                    title: cluster_id
                    readOnly: true
                name:
                    type: string
                    title: name
                namespace:
                    type: string
                    title: namespace
                    readOnly: true
                service_account:
                    type: string
                    title: service_account
                    readOnly: true
                ceiling:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentCeiling'
                    title: ceiling
                health:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentHealth'
                    title: health
                    readOnly: true
                report:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentReport'
                    title: report
                    description: What the agent last reported. Absent until it does.
                    readOnly: true
                created_by:
                    allOf:
                        - $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                    title: created_by
                    readOnly: true
                created_at:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                    title: created_at
                    readOnly: true
            title: Agent
            additionalProperties: false
        admiral.api.agent.v1.AgentCapabilities:
            type: object
            properties:
                can_create_namespaces:
                    type: boolean
                    title: can_create_namespaces
                writable_namespaces:
                    type: array
                    items:
                        type: string
                    title: writable_namespaces
                    description: Namespaces it may write; empty with `all_namespaces` means everywhere.
                all_namespaces:
                    type: boolean
                    title: all_namespaces
                can_write_cluster_scoped:
                    type: boolean
                    title: can_write_cluster_scoped
            title: AgentCapabilities
            additionalProperties: false
            description: AgentCapabilities is what the agent's own RBAC lets it do, as it measured.
        admiral.api.agent.v1.AgentCeiling:
            type: object
            properties:
                allow_namespace_creation:
                    type: boolean
                    title: allow_namespace_creation
                allowed_namespaces:
                    type: array
                    items:
                        type: string
                        maxLength: 63
                        minLength: 1
                    title: allowed_namespaces
                    maxItems: 64
                    description: Glob patterns; empty allows every namespace.
                denied_namespaces:
                    type: array
                    items:
                        type: string
                        maxLength: 63
                        minLength: 1
                    title: denied_namespaces
                    maxItems: 64
            title: AgentCeiling
            additionalProperties: false
            description: |-
                AgentCeiling is what the agent's owner allows it, whatever its RBAC allows.
                 The plan refuses what falls outside it.
        admiral.api.agent.v1.AgentGrant:
            type: object
            allOf:
                - oneOf:
                    - required:
                        - tenant
                    - required:
                        - group_id
                    - required:
                        - application_id
            anyOf:
                - type: object
                  properties:
                    application_id:
                        type: string
                        title: application_id
                        format: uuid
                  title: application_id
                - type: object
                  properties:
                    group_id:
                        type: string
                        title: group_id
                        format: uuid
                  title: group_id
                - type: object
                  properties:
                    tenant:

            summary: List components
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_ListComponents
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by name.
                       - `description`: filter by description.
                       - `labels`: filter by label key/value.

                     Example: `field['labels']['team'] = 'payments'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of components to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.ListComponentsResponse'
    /v1/components/publish:
        post:
            tags:
                - Components
            summary: Publish a component revision
            description: |-
                The bundle is a gzipped tar of the component root, carried inline and
                 capped at 64 MiB; a fully vendored tree that exceeds it will get a
                 resumable upload path of its own. The server normalizes the bytes
                 (strips `.git`, canonicalizes entry order and timestamps), digests them,
                 runs the publish gate, stores the blob and answers with the revision. If
                 the digest already exists under the name, the existing revision is
                 returned with `unchanged` set and nothing is written, which is what makes
                 a publish-everything CI recipe safe.

                 Any tags named in the request are set on the resulting revision.
                 Repointing a semver tag is refused with FAILED_PRECONDITION and the whole
                 publish fails; the bytes are not kept.

                 Scope: `component:publish`
            operationId: RegistryAPI_PublishComponent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.registry.v1.PublishComponentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.PublishComponentResponse'
    /v1/components/pull:
        post:
            tags:
                - Components
            summary: Pull and publish an artifact from a registry, repository or URL
            description: 'Scope: `component:publish`'
            operationId: RegistryAPI_PullComponent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.registry.v1.PullComponentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:

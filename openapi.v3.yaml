        admiral.api.catalog.v1.CatalogItem:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the catalog item (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "billing-vpc", "rds-standard").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of the catalog item's purpose
                         (e.g., "Standard VPC module for billing workloads").
                type:
                    title: type
                    description: |-
                        (IMMUTABLE) The content type: what this item contains and how it should be executed.
                         Immutable after creation.
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItemType'
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Reference to the Source this catalog item fetches from (UUID).
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: |-
                        Git ref, registry version, chart version, or OCI tag to fetch.
                         Optional. When empty, the backend uses its default (e.g., HEAD for Git,
                         latest for registries). This is the default a component copies at create
                         time; the component owns its ref thereafter.
                root:
                    type: string
                    title: root
                    maxLength: 512
                    description: |-
                        Subdirectory within the fetched tree to treat as the item root.
                         Optional. When empty, the entire fetched tree is the root.
                         Example: "modules/vpc" within a monorepo.
                path:
                    type: string
                    title: path
                    maxLength: 512
                    description: |-
                        Working directory within root for execution (e.g., "environments/prod").
                         Optional. When empty, defaults to root itself.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering catalog items
                         (e.g., `{"team": "platform", "stack": "networking"}`).
                source_name:
                    type: string
                    title: source_name
                    description: Display name of the parent source. Denormalized for display.
                    readOnly: true
                created_by:
                    title: created_by
                    description: The user or agent who created this catalog item (server-populated from token).
                    readOnly: true
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the catalog item was created.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the catalog item was last updated.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: CatalogItem
            additionalProperties: false
            description: |-
                CatalogItem represents a named, reusable reference to a slice of content
                 within a Source at a specific ref. One Source can back many catalog items
                 (different refs, different subtrees, different working directories).

                 The catalog item type identifies what the content is (Terraform, Helm,
                 Kustomize, raw manifests) independently of how it is fetched (the Source
                 type). This separation allows a single Git source to back Terraform, Helm,
                 and manifest items in different subdirectories.

                 A catalog item is a starting point: components are instantiated FROM it as
                 self-contained copies (copy-not-link), so editing or deleting an item never
                 mutates already-placed components.
        admiral.api.catalog.v1.CatalogItem.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.catalog.v1.CatalogItemType:
            type: string
            title: CatalogItemType
            enum:
                - CATALOG_ITEM_TYPE_UNSPECIFIED
                - CATALOG_ITEM_TYPE_TERRAFORM
                - CATALOG_ITEM_TYPE_HELM
                - CATALOG_ITEM_TYPE_KUSTOMIZE
                - CATALOG_ITEM_TYPE_MANIFEST
            description: |-
                CatalogItemType identifies the content semantics: what the fetched content is
                 and how it should be executed. This is orthogonal to SourceType, which
                 identifies the fetch protocol. A single GIT source can back TERRAFORM, HELM,
                 KUSTOMIZE, and MANIFEST items in different subdirectories.
        admiral.api.catalog.v1.CreateCatalogItemRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "billing-vpc", "rds-standard").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the catalog item's purpose.
                type:
                    not:
                        enum:
                            - CATALOG_ITEM_TYPE_UNSPECIFIED
                    title: type
                    description: 'The content type: what this item contains and how it should be executed.'
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItemType'
                source_id:
                    type: string
                    title: source_id
                    format: uuid
                    description: Reference to the Source this catalog item fetches from (UUID).
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: |-
                        Git ref, registry version, chart version, or OCI tag to fetch.
                         Optional. When empty, the backend uses its default (e.g., HEAD for Git,
                         latest for registries). This is the default a component copies at create
                         time; the component owns its ref thereafter.
                root:
                    type: string
                    title: root
                    maxLength: 512
                    description: |-
                        Subdirectory within the fetched tree to treat as the item root.
                         Optional. When empty, the entire fetched tree is the root.
                         Example: "modules/vpc" within a monorepo.
                path:
                    type: string
                    title: path
                    maxLength: 512
                    description: |-
                        Working directory within root for execution (e.g., "environments/prod").
                         Optional. When empty, defaults to root itself.
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels.
            title: CreateCatalogItemRequest
            required:
                - name
                - type
                - source_id
            additionalProperties: false
            description: CreateCatalogItemRequest contains the parameters for creating a new item.
        admiral.api.catalog.v1.CreateCatalogItemRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.catalog.v1.CreateCatalogItemResponse:
            type: object
            properties:
                catalog_item:
                    title: catalog_item
                    description: The created catalog item.
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItem'
            title: CreateCatalogItemResponse
            additionalProperties: false
            description: CreateCatalogItemResponse contains the newly created catalog item.
        admiral.api.catalog.v1.DeleteCatalogItemRequest:
            type: object
            properties:
                catalog_item_id:
                    type: string
                    title: catalog_item_id
                    format: uuid
                    description: Unique identifier of the catalog item to delete (UUID).
            title: DeleteCatalogItemRequest
            required:
                - catalog_item_id
            additionalProperties: false
            description: DeleteCatalogItemRequest identifies a catalog item to delete.
        admiral.api.catalog.v1.DeleteCatalogItemResponse:
            type: object
            title: DeleteCatalogItemResponse
            additionalProperties: false
            description: DeleteCatalogItemResponse is empty on success.
        admiral.api.catalog.v1.GetCatalogItemRequest:
            type: object
            properties:
                catalog_item_id:
                    type: string
                    title: catalog_item_id
                    format: uuid
                    description: Unique identifier of the catalog item (UUID).
            title: GetCatalogItemRequest
            required:
                - catalog_item_id
            additionalProperties: false
            description: GetCatalogItemRequest identifies a catalog item to retrieve.
        admiral.api.catalog.v1.GetCatalogItemResponse:
            type: object
            properties:
                catalog_item:
                    title: catalog_item
                    description: The retrieved catalog item.
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItem'
            title: GetCatalogItemResponse
            additionalProperties: false
            description: GetCatalogItemResponse contains the catalog item record.
        admiral.api.catalog.v1.ListCatalogItemsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by catalog item name.
                           - `type`: filter by item type (TERRAFORM, HELM, KUSTOMIZE, MANIFEST).
                           - `source_id`: filter by source reference.

                         Example: `field['type'] = 'TERRAFORM'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of catalog items to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListCatalogItemsRequest
            additionalProperties: false
            description: ListCatalogItemsRequest contains pagination and filter parameters.
        admiral.api.catalog.v1.ListCatalogItemsResponse:
            type: object
            properties:
                catalog_items:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItem'
                    title: catalog_items
                    description: The list of catalog items.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListCatalogItemsResponse
            additionalProperties: false
            description: ListCatalogItemsResponse contains a page of catalog items.
        admiral.api.catalog.v1.ResolveCatalogItemRequest:
            type: object
            properties:
                catalog_item_id:
                    type: string
                    title: catalog_item_id
                    format: uuid
                    description: Unique identifier of the catalog item to resolve (UUID).
                ref_override:
                    type: string
                    title: ref_override
                    maxLength: 256
                    description: |-
                        Optional ref override. When set, this ref is used instead of the item's
                         default ref. Useful for previewing a different version without modifying
                         the catalog item definition.
            title: ResolveCatalogItemRequest
            required:
                - catalog_item_id
            additionalProperties: false
            description: ResolveCatalogItemRequest identifies a catalog item to resolve.
        admiral.api.catalog.v1.ResolveCatalogItemResponse:
            type: object
            properties:
                revision:
                    type: string
                    title: revision
                    description: |-
                        The resolved revision identifier. For Git sources, this is the commit SHA.
                         For registry sources, the canonical version string. For HTTP, a content hash.
                digest:
                    type: string
                    title: digest
                    description: |-
                        Content-addressing digest of the fetched content (e.g., "sha1:<commit>",
                         "sha256:<hash>").
                catalog_item:
                    title: catalog_item
                    description: The catalog item that was resolved, with current field values.
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItem'
            title: ResolveCatalogItemResponse
            additionalProperties: false
            description: |-
                ResolveCatalogItemResponse contains the resolved metadata from fetching the
                 catalog item's content via its Source.
        admiral.api.catalog.v1.UpdateCatalogItemRequest:
            type: object
            properties:
                catalog_item:
                    title: catalog_item
                    description: |-
                        The catalog item with updated fields. Its `id` identifies the item; only
                         fields named in `update_mask` are applied.
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItem'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `source_id`, `ref`, `root`, `path`, `labels`. `type` is
                         immutable and cannot be updated.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateCatalogItemRequest
            required:
                - catalog_item
            additionalProperties: false
            description: UpdateCatalogItemRequest contains the catalog item fields to update.
        admiral.api.catalog.v1.UpdateCatalogItemResponse:
            type: object
            properties:
                catalog_item:
                    title: catalog_item
                    description: The updated catalog item.
                    $ref: '#/components/schemas/admiral.api.catalog.v1.CatalogItem'
            title: UpdateCatalogItemResponse
            additionalProperties: false
            description: UpdateCatalogItemResponse contains the updated catalog item.
        admiral.api.changeset.v1.CatalogItemVersionDiff:
            type: object
            properties:
                catalog_item_id_old:
                    type:
                        - string
                        - "null"
                    title: catalog_item_id_old
                    description: Catalog item UUID before the change.
                catalog_item_id_new:
                    type:
                        - string
                        - "null"
                    title: catalog_item_id_new
                    description: Catalog item UUID after the change.
                catalog_item_name_old:
                    type:
                        - string
                        - "null"
                    title: catalog_item_name_old
                    description: Catalog item name before the change (denormalized for display).
                catalog_item_name_new:
                    type:
                        - string
                        - "null"
                    title: catalog_item_name_new
                    description: Catalog item name after the change (denormalized for display).
                ref_old:
                    type:
                        - string
                        - "null"
                    title: ref_old
                    description: Ref (git ref / version selector) before the change.
                ref_new:
                    type:
                        - string
                        - "null"
                    title: ref_new
                    description: Ref (git ref / version selector) after the change.
            title: CatalogItemVersionDiff
            additionalProperties: false
            description: |-
                CatalogItemVersionDiff describes a catalog-item-id and/or version change on
                 an entry. Absent halves mean "unset." Both halves can be absent for CREATE
                 entries whose catalog item fields aren't being changed (caller still emits
                 the new values).
        admiral.api.changeset.v1.ChangeSet:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the change set (UUID).
                    readOnly: true
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this change set targets (UUID).
                    readOnly: true
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this change set targets (UUID).
                    readOnly: true
                status:
                    title: status
                    description: Lifecycle status of this change set.
                    readOnly: true
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetStatus'
                copied_from_id:
                    type: string
                    title: copied_from_id
                    description: |-
                        If this change set was created via CopyChangeSet, the UUID of the source
                         change set. Forms the promotion chain (e.g., dev -> staging -> prod).
                         Empty for change sets created directly via CreateChangeSet.
                    readOnly: true
                title:
                    type: string
                    title: title
                    maxLength: 256
                    description: Human-readable title for the change set (e.g., "Bump database version").
                description:
                    type: string
                    title: description
                    maxLength: 4096
                    description: Optional longer description of what the change set proposes.
                deploy_run_id:
                    type: string
                    title: deploy_run_id
                    description: |-
                        The run that deployed this change set (UUID). Populated when status
                         transitions to DEPLOYED. Empty otherwise. Note: many runs may target a
                         change set over its life (via runs.change_set_id); this is the single run
                         that closed it.
                    readOnly: true
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetEntry'
                    title: entries
                    description: |-
                        Component entries proposed by this change set. Populated by GetChangeSet;
                         empty in ListChangeSets responses.
                    readOnly: true
                variable_entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetVariableEntry'
                    title: variable_entries
                    description: |-
                        Variable entries proposed by this change set. Populated by GetChangeSet;
                         empty in ListChangeSets responses.
                    readOnly: true
                display_id:
                    type: string
                    title: display_id
                    description: |-
                        Typed display identifier of the form `cs-<12-char-suffix>` (e.g.,
                         `cs-3k7m9p2q4rvw`). Server-generated and stable. Prefer this
                         over `id` for user-facing references; lookups accept either form.
                    readOnly: true
                application_name:
                    type: string
                    title: application_name
                    description: Display name of the parent application. Denormalized for display.
                    readOnly: true
                environment_name:
                    type: string
                    title: environment_name
                    description: Display name of the parent environment. Denormalized for display.
                    readOnly: true
                created_by:
                    title: created_by
                    description: |-
                        The user or agent that created this change set
                         (server-populated from token).
                    readOnly: true
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the change set was created.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: |-
                        When the change set was last updated (metadata, entries, variable
                         entries, or status).
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ChangeSet
            additionalProperties: false
            description: |-
                ChangeSet is a scoped, isolated proposal to mutate the deployed state of an
                 application within a single environment.

                 The change set holds two kinds of proposals:
                   - Component entries: per-name deltas (CREATE/UPDATE/DESTROY/ORPHAN).
                   - Variable entries: per-key set or delete-on-apply.
        admiral.api.changeset.v1.ChangeSetDiff:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.EntryDiff'
                    title: entries
                    description: Per-component entry deltas, ordered by component name.
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.VariableDiff'
                    title: variables
                    description: Per-key variable deltas, ordered by key.
                downstream:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.DownstreamImpact'
                    title: downstream
                    description: |-
                        Deployed components affected by changes to the entries above (static
                         graph walk over `values_template` references).
            title: ChangeSetDiff
            additionalProperties: false
            description: |-
                ChangeSetDiff describes what a change set would change relative to current
                 environment HEAD: per-component entries, per-key variable changes, and the
                 deployed components whose `values_template` references a name touched by
                 this change set.
        admiral.api.changeset.v1.ChangeSetEntry:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the entry (UUID).
                change_set_id:
                    type: string
                    title: change_set_id
                    format: uuid
                    description: The change set this entry belongs to (UUID).
                component_id:
                    type: string
                    title: component_id
                    description: |-
                        The component this entry targets (UUID). Absent for CREATE entries
                         (the component does not exist yet).
                component_name:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        Component name (stable identifier set at creation). Required for all
                         entries. For CREATE entries, this is the name of the component to be
                         created. For UPDATE/DESTROY/ORPHAN entries, this matches an existing
                         component in the application.
                change_type:
                    title: change_type
                    description: The change type.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetEntryType'
                catalog_item_id:
                    type:
                        - string
                        - "null"
                    title: catalog_item_id
                    format: uuid
                    description: |-
                        The catalog item to deploy (UUID). Required for CREATE; optional for UPDATE
                         (if changing the catalog item); not allowed for DESTROY/ORPHAN.
                ref:
                    type:
                        - string
                        - "null"
                    title: ref
                    maxLength: 256
                    description: |-
                        The git ref / version selector to deploy (e.g., tag, branch, or commit SHA).
                         On CREATE, defaults to the catalog item's ref when absent. For UPDATE
                         entries, absent means "no change to ref."
                values_template:
                    type:
                        - string
                        - "null"
                    title: values_template
                    maxLength: 65536
                    description: |-
                        Values template for catalog item inputs. For UPDATE entries, absent means
                         "no change to values_template."
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Explicit dependencies (component names). Whatever the client sends is
                         recorded; an empty list clears existing dependencies. Not allowed for
                         DESTROY/ORPHAN entries. Names may reference components materialized
                         earlier in the same change set (their UUIDs do not exist until apply).
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description for the proposed change (e.g., "Bump to v2.1.0
                         for performance fix"). For UPDATE entries, absent means "no change."
                catalog_item_name:
                    type: string
                    title: catalog_item_name
                    description: |-
                        Display name of the referenced catalog item. Denormalized for display.
                         Read-only; ignored on writes.
                created_at:
                    title: created_at
                    description: When the entry was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the entry was last replaced.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                target:
                    title: target
                    description: |-
                        Resolved placement for the component: the agent it deploys on (plus a
                         namespace for WORKLOAD components). Copied onto the component at deploy
                         time, and the component is the source of truth for placement at runtime.
                    $ref: '#/components/schemas/admiral.api.component.v1.ComponentTarget'
            title: ChangeSetEntry
            additionalProperties: false
            description: |-
                ChangeSetEntry is a per-component proposal within a change set.

                 Patch semantics: optional fields that are absent mean "no change relative
                 to the component's current state at deploy time." Required fields per
                 `change_type`:
                   - CREATE: `catalog_item_id` required; `component_id` must be empty.
                   - UPDATE: `component_id` required; at least one optional field set.
                   - DESTROY / ORPHAN: `component_id` required; no patch fields allowed.
        admiral.api.changeset.v1.ChangeSetEntryType:
            type: string
            title: ChangeSetEntryType
            enum:
                - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
                - CHANGE_SET_ENTRY_TYPE_CREATE
                - CHANGE_SET_ENTRY_TYPE_UPDATE
                - CHANGE_SET_ENTRY_TYPE_DESTROY
                - CHANGE_SET_ENTRY_TYPE_ORPHAN
            description: ChangeSetEntryType selects what the entry does to the targeted component.
        admiral.api.changeset.v1.ChangeSetStatus:
            type: string
            title: ChangeSetStatus
            enum:
                - CHANGE_SET_STATUS_UNSPECIFIED
                - CHANGE_SET_STATUS_OPEN
                - CHANGE_SET_STATUS_DEPLOYED
                - CHANGE_SET_STATUS_DISCARDED
            description: |-
                ChangeSetStatus is the lifecycle state of a change set. Only OPEN change
                 sets can be mutated. DEPLOYED is reached when a run referencing the change
                 set succeeds; DISCARDED is reached via DiscardChangeSet.
        admiral.api.changeset.v1.ChangeSetVariableEntry:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the variable entry (UUID).
                change_set_id:
                    type: string
                    title: change_set_id
                    format: uuid
                    description: The change set this entry belongs to (UUID).
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key (e.g., "TF_VAR_region", "IMAGE_TAG").
                value:
                    type:
                        - string
                        - "null"
                    title: value
                    description: |-
                        The value to set on apply. Absent means "delete this key on apply"
                         (tombstone). Masked in responses when `sensitive` is true.
                type:
                    title: type
                    description: |-
                        How the value should be interpreted by the rendering engine and
                         displayed in the UI.
                    $ref: '#/components/schemas/admiral.api.variable.v1.VariableType'
                sensitive:
                    type: boolean
                    title: sensitive
                    description: When true, the value is encrypted at rest and masked in API responses.
                created_at:
                    title: created_at
                    description: When the variable entry was created or last replaced.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: ChangeSetVariableEntry
            additionalProperties: false
            description: |-
                ChangeSetVariableEntry is a per-key variable proposal within a change set.

                 At deploy time, each variable entry is applied to the change set's
                 environment: an entry with `value` set upserts the key, and an entry with
                 `value` absent (a tombstone) removes the key.
        admiral.api.changeset.v1.CopyChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the source change set to copy. Accepts either the short
                         ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: |-
                        The target environment for the new change set (UUID). Must belong to
                         the source change set's application.
                title:
                    type: string
                    title: title
                    maxLength: 256
                    description: Optional title override. Defaults to the source's title when empty.
                description:
                    type: string
                    title: description
                    maxLength: 4096
                    description: |-
                        Optional description override. Defaults to the source's description
                         when empty.
            title: CopyChangeSetRequest
            required:
                - change_set_id
                - environment_id
            additionalProperties: false
            description: |-
                CopyChangeSetRequest creates a new OPEN change set by copying an existing
                 one to a target environment.
        admiral.api.changeset.v1.CopyChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The new change set with `copied_from_id` set to the source.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
            title: CopyChangeSetResponse
            additionalProperties: false
            description: CopyChangeSetResponse contains the newly created change set.
        admiral.api.changeset.v1.CreateChangeSetRequest:
            type: object
            properties:
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this change set targets (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this change set targets (UUID).
                title:
                    type: string
                    title: title
                    maxLength: 256
                    description: Optional human-readable title (e.g., "Bump database version").
                description:
                    type: string
                    title: description
                    maxLength: 4096
                    description: Optional longer description of what the change set proposes.
            title: CreateChangeSetRequest
            required:
                - application_id
                - environment_id
            additionalProperties: false
            description: |-
                CreateChangeSetRequest opens a new change set for an (application,
                 environment) pair.
        admiral.api.changeset.v1.CreateChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: |-
                        The created change set. Status is OPEN; entries and variable entries
                         are empty.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
            title: CreateChangeSetResponse
            additionalProperties: false
            description: CreateChangeSetResponse contains the newly created change set.
        admiral.api.changeset.v1.DiffChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            title: DiffChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
            description: DiffChangeSetRequest identifies the change set to diff.
        admiral.api.changeset.v1.DiffChangeSetResponse:
            type: object
            properties:
                diff:
                    title: diff
                    description: |-
                        The structural diff. Empty `entries`, `variables`, and `downstream` lists
                         mean the change set proposes no changes relative to current state.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetDiff'
            title: DiffChangeSetResponse
            additionalProperties: false
            description: DiffChangeSetResponse contains the computed diff.
        admiral.api.changeset.v1.DiffChangeType:
            type: string
            title: DiffChangeType
            enum:
                - DIFF_CHANGE_TYPE_UNSPECIFIED
                - DIFF_CHANGE_TYPE_ADDED
                - DIFF_CHANGE_TYPE_CHANGED
                - DIFF_CHANGE_TYPE_REMOVED
            description: |-
                DiffChangeType classifies a single change inside a ChangeSetDiff:
                 per-key value changes inside an entry's values_template, or per-key
                 variable changes.
        admiral.api.changeset.v1.DiscardChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set to discard. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            title: DiscardChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
            description: DiscardChangeSetRequest abandons an OPEN change set.
        admiral.api.changeset.v1.DiscardChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The change set with status set to DISCARDED.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
            title: DiscardChangeSetResponse
            additionalProperties: false
            description: DiscardChangeSetResponse contains the discarded change set.
        admiral.api.changeset.v1.DownstreamImpact:
            type: object
            properties:
                component_name:
                    type: string
                    title: component_name
                    description: Name of the deployed component that will be affected.
                affected_by:
                    type: array
                    items:
                        type: string
                    title: affected_by
                    description: |-
                        Names in this change set whose outputs the deployed component
                         references.
            title: DownstreamImpact
            additionalProperties: false
            description: |-
                DownstreamImpact lists deployed components whose `values_template`
                 references the outputs of a component touched by this change set. Surfaces
                 the "if you apply this, these other components will also re-plan" set.
        admiral.api.changeset.v1.EntryDiff:
            type: object
            properties:
                component_name:
                    type: string
                    title: component_name
                    description: Component name this entry targets.
                change_type:
                    title: change_type
                    description: Change kind.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetEntryType'
                catalog_item:
                    oneOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.CatalogItemVersionDiff'
                        - type: "null"
                    title: catalog_item
                    description: Catalog item / version delta. Absent when neither field changes.
                values:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ValueDiff'
                    title: values
                    description: |-
                        Per-key value-template deltas. Today this contains a single ValueDiff
                         keyed `values_template` carrying the full template text so reviewers
                         can read the new template.
                depends_on_added:
                    type: array
                    items:
                        type: string
                    title: depends_on_added
                    description: Names added to depends_on by this entry.
                depends_on_removed:
                    type: array
                    items:
                        type: string
                    title: depends_on_removed
                    description: Names removed from depends_on by this entry.
                description_old:
                    type:
                        - string
                        - "null"
                    title: description_old
                    description: Old description (UPDATE only, when the entry sets description).
                description_new:
                    type:
                        - string
                        - "null"
                    title: description_new
                    description: New description (CREATE/UPDATE only).
            title: EntryDiff
            additionalProperties: false
            description: |-
                EntryDiff describes a single component entry's effect.

                 For CREATE entries, `catalog_item`/`values`/`depends_on_added` describe the
                 proposed new component; the `_old` halves are absent.
                 For UPDATE entries, only fields the entry actually changes appear; absent
                 patch fields mean "no change."
                 For DESTROY/ORPHAN entries, `catalog_item`/`values`/`depends_on_*` are absent.
        admiral.api.changeset.v1.GetChangeSetRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
            title: GetChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
            description: GetChangeSetRequest identifies a change set to retrieve.
        admiral.api.changeset.v1.GetChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The change set, with `entries` and `variable_entries` populated.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
            title: GetChangeSetResponse
            additionalProperties: false
            description: GetChangeSetResponse contains the change set with all entries inline.
        admiral.api.changeset.v1.ListChangeSetsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `application_id`: change sets for a specific application (UUID).
                           - `environment_id`: change sets for a specific environment (UUID).
                           - `status`: filter by status (OPEN, DEPLOYED, DISCARDED).

                         Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'OPEN'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of change sets to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListChangeSetsRequest
            additionalProperties: false
            description: ListChangeSetsRequest contains pagination and filter parameters.
        admiral.api.changeset.v1.ListChangeSetsResponse:
            type: object
            properties:
                change_sets:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_sets
                    description: |-
                        The list of change sets, ordered from newest to oldest. Each record
                         omits `entries` and `variable_entries`; call GetChangeSet for the
                         full record.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListChangeSetsResponse
            additionalProperties: false
            description: ListChangeSetsResponse contains a page of change sets.
        admiral.api.changeset.v1.RemoveEntryRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                component_name:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Component name of the entry to remove.
            title: RemoveEntryRequest
            required:
                - change_set_id
                - component_name
            additionalProperties: false
            description: RemoveEntryRequest deletes a single entry from an OPEN change set.
        admiral.api.changeset.v1.RemoveEntryResponse:
            type: object
            title: RemoveEntryResponse
            additionalProperties: false
            description: RemoveEntryResponse is empty on success.
        admiral.api.changeset.v1.RemoveVariableRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key to remove on apply.
            title: RemoveVariableRequest
            required:
                - change_set_id
                - key
            additionalProperties: false
            description: |-
                RemoveVariableRequest writes a tombstone variable entry that, when the
                 change set is deployed, removes the key from the target environment.
        admiral.api.changeset.v1.RemoveVariableResponse:
            type: object
            properties:
                variable_entry:
                    title: variable_entry
                    description: The tombstone entry (value absent, marking the key for deletion on apply).
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetVariableEntry'
            title: RemoveVariableResponse
            additionalProperties: false
            description: RemoveVariableResponse contains the tombstone variable entry.
        admiral.api.changeset.v1.SetEntryRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                component_name:
                    type: string
                    title: component_name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: Component name (stable identifier set at creation). Required.
                change_type:
                    not:
                        enum:
                            - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
                    title: change_type
                    description: The change type.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetEntryType'
                catalog_item_id:
                    type:
                        - string
                        - "null"
                    title: catalog_item_id
                    format: uuid
                    description: |-
                        The catalog item to deploy (UUID). Required for CREATE; optional for UPDATE.
                         Not allowed for DESTROY/ORPHAN.
                ref:
                    type:
                        - string
                        - "null"
                    title: ref
                    maxLength: 256
                    description: The git ref / version selector to deploy.
                values_template:
                    type:
                        - string
                        - "null"
                    title: values_template
                    maxLength: 65536
                    description: Values template for catalog item inputs.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: Explicit dependencies (component names). Empty list clears.
                description:
                    type:
                        - string
                        - "null"
                    title: description
                    maxLength: 1024
                    description: Optional description of the proposed change.
                target:
                    title: target
                    description: |-
                        Resolved placement for the component, by kind. Required for CREATE (the
                         component needs a placement); for UPDATE, absent means "no change to
                         placement."
                    $ref: '#/components/schemas/admiral.api.component.v1.ComponentTarget'
            title: SetEntryRequest
            required:
                - change_set_id
                - component_name
                - change_type
            additionalProperties: false
            description: SetEntryRequest creates or replaces a component entry within a change set.
        admiral.api.changeset.v1.SetEntryResponse:
            type: object
            properties:
                entry:
                    title: entry
                    description: The entry as recorded on the change set.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetEntry'
            title: SetEntryResponse
            additionalProperties: false
            description: SetEntryResponse contains the created or replaced entry.
        admiral.api.changeset.v1.SetVariableRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    minLength: 1
                    description: |-
                        Identifier of the change set. Accepts either the short ID
                         (`cs-<suffix>`) or the canonical UUID.
                key:
                    type: string
                    title: key
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
                    description: The variable key.
                value:
                    type: string
                    title: value
                    minLength: 1
                    description: The value to set on apply. For COMPLEX type, must be valid JSON.
                type:
                    title: type
                    description: How the value should be interpreted. Defaults to STRING when unspecified.
                    $ref: '#/components/schemas/admiral.api.variable.v1.VariableType'
                sensitive:
                    type: boolean
                    title: sensitive
                    description: When true, the value is encrypted at rest and masked in API responses.
            title: SetVariableRequest
            required:
                - change_set_id
                - key
                - value
            additionalProperties: false
            description: SetVariableRequest creates or replaces a variable entry within a change set.
        admiral.api.changeset.v1.SetVariableResponse:
            type: object
            properties:
                variable_entry:
                    title: variable_entry
                    description: The variable entry as recorded on the change set.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetVariableEntry'
            title: SetVariableResponse
            additionalProperties: false
            description: SetVariableResponse contains the created or replaced variable entry.
        admiral.api.changeset.v1.UpdateChangeSetRequest:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: |-
                        The change set with updated fields. Its `id` identifies the change set;
                         only fields named in `update_mask` are applied.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `title`,
                         `description`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateChangeSetRequest
            required:
                - change_set
            additionalProperties: false
            description: UpdateChangeSetRequest updates a change set's mutable metadata.
        admiral.api.changeset.v1.UpdateChangeSetResponse:
            type: object
            properties:
                change_set:
                    title: change_set
                    description: The updated change set.
                    $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
            title: UpdateChangeSetResponse
            additionalProperties: false
            description: |-
                UpdateChangeSetResponse contains the updated change set (metadata only;
                 entries are not returned; call GetChangeSet for the full record).
        admiral.api.changeset.v1.ValueDiff:
            type: object
            properties:
                key:
                    type: string
                    title: key
                    description: Key inside the values_template. Always `values_template` today.
                change_type:
                    title: change_type
                    description: The change type (ADDED, CHANGED, REMOVED).
                    $ref: '#/components/schemas/admiral.api.changeset.v1.DiffChangeType'
                old:
                    type:
                        - string
                        - "null"
                    title: old
                    description: Previous value (absent for ADDED, sensitive, or when not tracked).
                new:
                    type:
                        - string
                        - "null"
                    title: new
                    description: New value (absent for REMOVED, sensitive, or when not tracked).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: True when the underlying value is sensitive; old/new must be omitted.
            title: ValueDiff
            additionalProperties: false
            description: |-
                ValueDiff describes a single value change inside an entry's
                 `values_template`. EntryDiff emits at most one ValueDiff per entry, keyed
                 `values_template`, carrying the full template text.

                 Sensitive values are masked: when `sensitive=true`, both `old` and `new`
                 are absent.
        admiral.api.changeset.v1.VariableDiff:
            type: object
            properties:
                key:
                    type: string
                    title: key
                    description: The variable key.
                change_type:
                    title: change_type
                    description: The change type (ADDED, CHANGED, REMOVED).
                    $ref: '#/components/schemas/admiral.api.changeset.v1.DiffChangeType'
                old:
                    type:
                        - string
                        - "null"
                    title: old
                    description: Previous value (absent for ADDED or sensitive).
                new:
                    type:
                        - string
                        - "null"
                    title: new
                    description: New value (absent for REMOVED or sensitive).
                sensitive:
                    type: boolean
                    title: sensitive
                    description: True when either side is sensitive; old/new must be omitted.
            title: VariableDiff
            additionalProperties: false
            description: |-
                VariableDiff describes a per-key change to environment variables.

                 ADDED: the change set sets a key not currently present in the env.
                 CHANGED: the change set sets a key with a different value/type/sensitivity.
                 REMOVED: the change set carries a tombstone (delete-on-apply) for a key
                 that exists in the env.
        admiral.api.component.v1.Component:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the component (UUID).
                application_id:
                    type: string
                    title: application_id
                    format: uuid
                    description: The application this component belongs to (UUID).
                environment_id:
                    type: string
                    title: environment_id
                    format: uuid
                    description: The environment this component is scoped to (UUID).
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        Component identifier within the (application, environment) pair (e.g.,
                         "vpc", "redis", "api-server"). Set at creation; no rename path today.
                         Referenced from peer components' template expressions
                         (`{{ .component.<name>.<output> }}`), `depends_on` lists, and the
                         variable namespace for outputs.
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional description of the component's purpose
                         (e.g., "Primary VPC for all environments" or "Redis cache layer").
                kind:
                    title: kind
                    description: |-
                        Whether this is an infrastructure or workload component. Derived from
                         the referenced module's type when the component is created, but stored
                         explicitly for filtering and to determine execution behavior.
                    $ref: '#/components/schemas/admiral.api.component.v1.ComponentKind'
                deletion_protection:
                    type: boolean
                    title: deletion_protection
                    description: When true, destroy operations are rejected for this component.
                ref:
                    type: string
                    title: ref
                    maxLength: 256
                    description: |-
                        The git ref / version selector this component deploys (branch, tag, or
                         commit SHA for git; version string for package sources). Seeded from the
                         catalog item's ref at create time and owned thereafter (copy-not-link).
                values_template:
                    type: string
                    title: values_template
                    maxLength: 65536
                    description: |-
                        Values template that maps configuration into the module's expected inputs.
                         This is a JSON-encoded object where keys are the module input names and
                         values are either literal values or template expressions.

                         Template expressions can reference:
                           - Variables: `{{ .var.DATABASE_URL }}`
                           - Component outputs: `{{ .component.vpc.vpc_id }}`
                           - Environment metadata: `{{ .env.name }}`

                         Example for a Terraform RDS module:
                           {
                             "vpc_id": "{{ .component.vpc.vpc_id }}",
                             "subnet_ids": "{{ .component.vpc.private_subnet_ids }}",
                             "instance_class": "{{ .var.RDS_INSTANCE_CLASS }}",
                             "engine_version": "15.4"
                           }

                         Example for a Helm chart:
                           {
                             "replicaCount": "{{ .var.REPLICA_COUNT }}",
                             "image.repository": "myorg/api-server",
                             "image.tag": "{{ .var.IMAGE_TAG }}"
                           }

                         The rendering engine resolves all expressions at deployment time using
                         the environment's variables and the outputs of upstream components.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: |-
                        Component names that must complete successfully before this component
                         can be deployed. Must reference components within the same environment.
                         The run engine uses these, combined with implicit dependencies from
                         template expressions, to build the execution DAG.

                         Explicit depends_on is useful when there is a deployment-order dependency
                         that is not captured by output references (e.g., cert-manager must be
                         installed before any workload that uses TLS certificates).
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.component.v1.ComponentOutput'
                    title: outputs
                    description: |-
                        Declared outputs for this component. For infrastructure components
                         (Terraform), outputs are auto-discovered from the module and this field
                         is ignored. For workload components, outputs must be declared here to
                         be available for template expressions in other components.

                         See ComponentOutput for examples.
                created_by:
                    title: created_by
                    description: The user or agent who created this component (server-populated from token).
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the component was created.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the component was last updated.
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.component.v1.ComponentInput'
                    title: inputs
                    description: |-
                        Declared inputs this component consumes -- the symmetric half of outputs.
                         Additive: the edge spec the impact-scoping work reads. Binding still flows
                         through values_template today.
                target:
                    title: target
                    description: |-
                        Resolved placement: where this component deploys. Copied onto the component
                         from the reviewed Change at deploy time (copy-not-link); the run snapshots
                         it onto the revision. Exactly one shape is populated, by `kind`.
                    $ref: '#/components/schemas/admiral.api.component.v1.ComponentTarget'
            title: Component
            additionalProperties: false
            description: |-
                Component represents a named, deployable unit within an application+environment
                 pair. It binds a module to a specific environment with configuration (values
                 template) that maps variables and other component outputs into the module's
                 expected inputs.

                 Components are scoped to (application, environment): each environment has
                 its own set of components. The same name may exist in multiple environments
                 with different module/version/values, supporting both the uniform-fleet case
                 (identical components stamped across envs) and the divergent case (Postgres
                 in cluster for dev, managed service for prod).

                 Components are the nodes in Admiral's dependency graph. Infrastructure
                 components produce auto-discovered outputs (Terraform outputs). Workload
                 components declare outputs explicitly. Other components consume these via
                 template expressions. The run engine resolves this DAG to determine
                 execution order.
            example:
                id: "d4e5f6a7-8901-2bcd-ef34-567890123456"
                application_id: "a1b2c3d4-5678-9abc-def0-1234567890ab"
                environment_id: "e5f6a7b8-9012-3cde-f456-789012345678"
                name: "api-server"
                description: "Main API server deployed via Helm chart."
                kind: "COMPONENT_KIND_WORKLOAD"
                ref: "2.4.1"
                values_template: "{\"replicaCount\": \"{{ .var.REPLICA_COUNT }}\", \"image.tag\": \"{{ .var.IMAGE_TAG }}\"}"
                depends_on:
                    - "vpc"
                    - "redis"
                target:
                    agent_id: "1f2e3d4c-5b6a-7980-1234-567890abcdef"
                    namespace: "inventory-staging"
                created_by:
                    id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                    display_name: "Alex Chen"
                    email: "alex.chen@example.com"
                created_at: "2025-09-16T09:00:00Z"
                updated_at: "2025-10-28T11:30:00Z"
        admiral.api.component.v1.ComponentInput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Input name. Must be a valid identifier (lowercase alphanumeric and
                         underscores, e.g. "database_url", "region").
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that binds this input's value -- typically a reference
                         to an environment variable or an upstream component's output, e.g.
                           "{{ .var.region }}"
                           "{{ .component.db.outputs.connection_string }}"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the input's purpose.
            title: ComponentInput
            additionalProperties: false
            description: |-
                ComponentInput is the symmetric half of ComponentOutput: a declared input
                 the component consumes, with the template expression that binds its value.
                 The declared inputs are the edge spec of the dependency DAG -- they make
                 impact scoping precise (which components reference a changed variable or an
                 upstream output). Today component inputs are bound through the single
                 values_template; this typed declaration is additive.
        admiral.api.component.v1.ComponentKind:
            type: string
            title: ComponentKind
            enum:
                - COMPONENT_KIND_UNSPECIFIED
                - COMPONENT_KIND_INFRASTRUCTURE
                - COMPONENT_KIND_WORKLOAD
            description: |-
                ComponentKind indicates whether the component provisions infrastructure
                 or deploys workloads. This is derived from the referenced module's type but
                 stored explicitly for filtering and to determine rendering and execution
                 behavior.
        admiral.api.component.v1.ComponentOutput:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z][a-z0-9_]{0,62}$
                    description: |-
                        Output name used in template references. Must be a valid identifier
                         (lowercase alphanumeric and underscores, e.g., "service_host",
                         "connection_string"). Other components reference this as
                         `{{ .component.<component_name>.<output_name> }}`.
                value_template:
                    type: string
                    title: value_template
                    maxLength: 4096
                    minLength: 1
                    description: |-
                        Template expression that resolves to the output value after deployment.
                         Can reference environment metadata and the component's own release info.

                         Examples:
                           "{{ .release.name }}-redis-master.{{ .env.namespace }}.svc.cluster.local"
                           "{{ .release.name }}-redis:6379"
                           "http://{{ .release.name }}-grafana.{{ .env.namespace }}:3000"
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the output's purpose.
            title: ComponentOutput
            additionalProperties: false
            description: |-
                ComponentOutput declares a named output value produced by a component.

                 For infrastructure components (Terraform), outputs are auto-discovered from
                 the module's output blocks and this field is ignored. Do not declare
                 outputs manually for Terraform components.

                 For workload components (Helm, Kustomize, manifests), outputs must be
                 declared explicitly here to make them available for template expressions
                 in other components (e.g., `{{ .component.cache.service_host }}`).

                 Output values are template expressions resolved after the component is
                 deployed. They typically reference well-known patterns from the deployed
                 resources (e.g., Kubernetes service DNS names, ConfigMap keys).
        admiral.api.component.v1.ComponentTarget:
            type: object
            properties:
                agent_id:
                    type: string
                    title: agent_id
                    description: |-
                        The agent this component is placed on (UUID). A KUBERNETES agent for
                         WORKLOAD components; a TERRAFORM agent for INFRASTRUCTURE components.
                namespace:
                    type: string
                    title: namespace
                    description: |-
                        WORKLOAD only: the target namespace (defaults to the environment name
                         when empty).
            title: ComponentTarget
            additionalProperties: false
            description: |-
                ComponentTarget is a component's resolved placement on an agent, selected by
                 the component's kind. Authored on a Changeset Change and copied onto the
                 component (it is the source of truth at runtime, not the environment).
        admiral.api.credential.v1.AuthConfig:
            type: object
            oneOf:
                - type: object
                  properties:
                    basic_auth:
                        title: basic_auth
                        $ref: '#/components/schemas/admiral.api.credential.v1.BasicAuth'
                  title: basic_auth
                  required:
                    - basic_auth
                - type: object
                  properties:
                    bearer_token:
                        title: bearer_token
                        $ref: '#/components/schemas/admiral.api.credential.v1.BearerTokenAuth'
                  title: bearer_token
                  required:
                    - bearer_token
                - type: object
                  properties:
                    ssh_key:
                        title: ssh_key
                        $ref: '#/components/schemas/admiral.api.credential.v1.SSHKeyAuth'
                  title: ssh_key
                  required:
                    - ssh_key
            title: AuthConfig
            additionalProperties: false
            description: |-
                AuthConfig is the polymorphic auth configuration attached to a Credential.
                 Exactly one variant is populated, corresponding to the credential's type.
                 Sensitive fields within each variant are write-only.
        admiral.api.credential.v1.BasicAuth:
            type: object
            properties:
                username:
                    type: string
                    title: username
                    minLength: 1
                    description: Username for authentication.
                password:
                    type: string
                    title: password
                    description: |-
                        Password (or PAT / registry-scoped token / app password).
                         Write-only: masked in responses.
                    writeOnly: true
            title: BasicAuth
            additionalProperties: false
            description: |-
                BasicAuth holds HTTP Basic credentials (username + password). Reused across
                 any Source type that accepts HTTP Basic (Helm, OCI, HTTP archive, Git
                 HTTPS).
        admiral.api.credential.v1.BearerTokenAuth:
            type: object
            properties:
                token:
                    type: string
                    title: token
                    description: |-
                        Token value.
                         Write-only: masked in responses.
                    writeOnly: true
            title: BearerTokenAuth
            additionalProperties: false
            description: |-
                BearerTokenAuth holds a single token value. Presentation is per target
                 protocol:
                   - Terraform registries, Helm bearer, OCI bearer, HTTP archives:
                     `Authorization: Bearer <token>`
                   - Git HTTPS (GitHub PAT, GitLab PAT): HTTP Basic with the token as
                     password and a dummy username
        admiral.api.credential.v1.CreateCredentialRequest:
            type: object
            properties:
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "github-org", "ecr-prod").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: Optional description of the credential's purpose.
                type:
                    not:
                        enum:
                            - CREDENTIAL_TYPE_UNSPECIFIED
                    title: type
                    description: The type of external system and authentication mechanism.
                    $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                auth_config:
                    title: auth_config
                    description: Auth material corresponding to `type`.
                    $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: Arbitrary key-value labels for organizing and filtering credentials.
            title: CreateCredentialRequest
            required:
                - name
                - type
                - auth_config
            additionalProperties: false
            description: CreateCredentialRequest contains the parameters for creating a new credential.
        admiral.api.credential.v1.CreateCredentialRequest.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.credential.v1.CreateCredentialResponse:
            type: object
            properties:
                credential:
                    title: credential
                    description: The created credential. Auth config sensitive fields are masked.
                    $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
            title: CreateCredentialResponse
            additionalProperties: false
            description: CreateCredentialResponse contains the newly created credential.
        admiral.api.credential.v1.Credential:
            type: object
            properties:
                id:
                    type: string
                    title: id
                    format: uuid
                    description: Unique identifier for the credential (UUID).
                    readOnly: true
                name:
                    type: string
                    title: name
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                    description: |-
                        URL-safe, human-readable identifier (e.g., "github-org", "ecr-prod").
                         Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                         start with a letter and end with an alphanumeric character (1-63 chars).
                description:
                    type: string
                    title: description
                    maxLength: 1024
                    description: |-
                        Optional longer-form description of what this credential is for
                         (e.g., "Read-only access to the platform team's GitHub org").
                type:
                    title: type
                    description: |-
                        (IMMUTABLE) The type of external system and authentication mechanism.
                         Immutable after creation.
                    $ref: '#/components/schemas/admiral.api.credential.v1.CredentialType'
                auth_config:
                    title: auth_config
                    description: |-
                        Auth material corresponding to `type`. Sensitive fields are write-only
                         and masked in responses.
                    $ref: '#/components/schemas/admiral.api.credential.v1.AuthConfig'
                labels:
                    type: object
                    title: labels
                    maxProperties: 64
                    additionalProperties:
                        type: string
                        title: value
                        maxLength: 256
                    description: |-
                        Arbitrary key-value labels for organizing and filtering credentials
                         (e.g., `{"team": "platform", "environment": "prod"}`).
                created_by:
                    title: created_by
                    description: The user or agent who created this credential (server-populated from token).
                    readOnly: true
                    $ref: '#/components/schemas/admiral.common.v1.ActorRef'
                created_at:
                    title: created_at
                    description: When the credential was created.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
                updated_at:
                    title: updated_at
                    description: When the credential was last updated.
                    readOnly: true
                    $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: Credential
            additionalProperties: false
            description: |-
                Credential represents stored authentication configuration for accessing an
                 external system. Credentials are tenant-scoped and referenced by sources
                 when fetching artifacts.

                 Sensitive fields within auth_config are write-only: accepted on create and
                 update but never returned in API responses.
        admiral.api.credential.v1.Credential.LabelsEntry:
            type: object
            properties:
                key:
                    type: string
                    title: key
                value:
                    type: string
                    title: value
            title: LabelsEntry
            additionalProperties: false
        admiral.api.credential.v1.CredentialType:
            type: string
            title: CredentialType
            enum:
                - CREDENTIAL_TYPE_UNSPECIFIED
                - CREDENTIAL_TYPE_SSH_KEY
                - CREDENTIAL_TYPE_BASIC_AUTH
                - CREDENTIAL_TYPE_BEARER_TOKEN
            description: |-
                CredentialType identifies the shape of the stored auth material (the
                 mechanism), not the system it targets. The target system is determined by
                 the Source that references the credential. One credential can be reused
                 across multiple Sources of different types, provided the Source accepts
                 that credential type (see the Source compatibility matrix).
        admiral.api.credential.v1.DeleteCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    format: uuid
                    description: |-
                        The unique identifier of the credential to delete (UUID).
                         Fails if any sources still reference this credential.
            title: DeleteCredentialRequest
            required:
                - credential_id
            additionalProperties: false
            description: DeleteCredentialRequest identifies a credential to delete.
        admiral.api.credential.v1.DeleteCredentialResponse:
            type: object
            title: DeleteCredentialResponse
            additionalProperties: false
            description: DeleteCredentialResponse is empty on success.
        admiral.api.credential.v1.GetCredentialRequest:
            type: object
            properties:
                credential_id:
                    type: string
                    title: credential_id
                    format: uuid
                    description: The unique identifier of the credential (UUID).
            title: GetCredentialRequest
            required:
                - credential_id
            additionalProperties: false
            description: GetCredentialRequest identifies a credential to retrieve.
        admiral.api.credential.v1.GetCredentialResponse:
            type: object
            properties:
                credential:
                    title: credential
                    description: The retrieved credential. Sensitive fields are masked.
                    $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
            title: GetCredentialResponse
            additionalProperties: false
            description: GetCredentialResponse contains the credential record.
        admiral.api.credential.v1.ListCredentialsRequest:
            type: object
            properties:
                filter:
                    type: string
                    title: filter
                    maxLength: 1024
                    description: |-
                        Filter expression to narrow results. Uses the Admiral filter DSL (see the
                         API documentation for the full operator and predicate reference).

                         Filterable fields:
                           - `name`: filter by credential name.
                           - `type`: filter by credential type (SSH_KEY, BASIC_AUTH, BEARER_TOKEN).
                           - `labels.key`: filter by label key.

                         Example: `field['type'] = 'BEARER_TOKEN'`
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                    description: |-
                        Maximum number of credentials to return per page. Defaults to 50 when
                         omitted or 0; must not exceed 100.
                page_token:
                    type: string
                    title: page_token
                    description: Opaque pagination token from a previous response.
            title: ListCredentialsRequest
            additionalProperties: false
            description: ListCredentialsRequest contains pagination and filter parameters.
        admiral.api.credential.v1.ListCredentialsResponse:
            type: object
            properties:
                credentials:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                    title: credentials
                    description: The list of credentials. Sensitive fields are masked.
                next_page_token:
                    type: string
                    title: next_page_token
                    description: Pagination token for the next page. Empty when there are no more results.
            title: ListCredentialsResponse
            additionalProperties: false
            description: ListCredentialsResponse contains a page of credentials.
        admiral.api.credential.v1.SSHKeyAuth:
            type: object
            properties:
                private_key:
                    type: string
                    title: private_key
                    description: |-
                        PEM-encoded SSH private key.
                         Write-only: masked in responses.
                    writeOnly: true
                passphrase:
                    type: string
                    title: passphrase
                    description: |-
                        Optional passphrase for the private key.
                         Write-only: masked in responses.
                    writeOnly: true
            title: SSHKeyAuth
            additionalProperties: false
            description: SSHKeyAuth holds an SSH private key and optional passphrase.
        admiral.api.credential.v1.UpdateCredentialRequest:
            type: object
            properties:
                credential:
                    title: credential
                    description: |-
                        The credential with updated fields.
                         Only fields specified in `update_mask` are updated.

                         When updating auth_config, the entire auth config is replaced.
                         Omitting auth_config from the update_mask leaves credentials unchanged.
                    $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
                update_mask:
                    title: update_mask
                    description: |-
                        The set of fields to update. Optional; if omitted, all populated fields
                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                         `description`, `auth_config`, `labels`.
                    $ref: '#/components/schemas/google.protobuf.FieldMask'
            title: UpdateCredentialRequest
            required:
                - credential
            additionalProperties: false
            description: UpdateCredentialRequest contains the credential fields to update.
        admiral.api.credential.v1.UpdateCredentialResponse:
            type: object
            properties:
                credential:
                    title: credential
                    description: The updated credential. Sensitive fields are masked.
                    $ref: '#/components/schemas/admiral.api.credential.v1.Credential'
            title: UpdateCredentialResponse
            additionalProperties: false
            description: UpdateCredentialResponse contains the updated credential.
        admiral.api.environment.v1.CreateEnvironmentRequest:

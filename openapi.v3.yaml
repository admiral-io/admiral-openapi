                if_revision:
                    type:
                        - integer
                        - "null"
                    title: if_revision
                    minimum: 0
                    format: int32
                    description: When set, refused unless the head is this revision.
                edits:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.Edit'
                    title: edits
                    maxItems: 100
                    minItems: 1
            title: EditChangeSetRequest
            required:
                - change_set_id
            additionalProperties: false
            description: |
                edit_change_set.upload_needs_if_revision // an upload replaces a whole tree, so it needs if_revision
        admiral.api.changeset.v1.EditChangeSetResponse:
            type: object
            properties:
                change_set:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'

openapi: 3.1.0
info:
    title: Admiral API
    description: The Admiral REST API for managing applications, infrastructure, and runs. See https://admiral.io/docs for complete documentation.
    version: v1
paths:
    /v1/agents:
        get:
            tags:
                - Agents
            summary: List agents
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgents
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `kind`: filter by agent kind (TERRAFORM, KUBERNETES).
                       - `name`: filter by agent name.
                       - `health_status`: filter by health status.
                       - `labels.key`: filter by label key.

                     Example: `field['kind'] = 'KUBERNETES' AND field['health_status'] = 'HEALTHY'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of agents to return per page. Defaults to 50 when omitted or
                     0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListAgentsResponse'
        post:
            tags:
                - Agents
            summary: Create an agent
            description: |-
                The request's `kind` selects the agent's execution plane (TERRAFORM or KUBERNETES)
                 and determines the key's auto-assigned scopes. The kind is immutable.

                 The response includes a `plain_text_key`: the raw API key secret shown
                 exactly once. Deploy this key to the agent binary for authentication.

                 Scope: `agent:write`
            operationId: AgentAPI_CreateAgent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.agent.v1.CreateAgentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateAgentResponse'
    /v1/agents/tokens/{token_id}:
        get:
            tags:
                - Agent Tokens
            summary: Retrieve an agent token
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetApiKey
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the key (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetApiKeyResponse'
    /v1/agents/tokens/{token_id}/revoke:
        post:
            tags:
                - Agent Tokens
            summary: Revoke an agent token
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_RevokeApiKey
            parameters:
                - name: token_id
                  in: path
                  description: The unique identifier of the key to revoke (UUID).
                  required: true
                  schema:
                    type: string
                    title: token_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.RevokeApiKeyResponse'
    /v1/agents/{agent.id}:
        patch:
            tags:
                - Agents
            summary: Update an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_UpdateAgent
            parameters:
                - name: agent.id
                  in: path
                  description: Unique identifier for the agent (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                                         `description`, `labels`.
                            title: UpdateAgentRequest
                            additionalProperties: false
                            description: UpdateAgentRequest contains the agent fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.UpdateAgentResponse'
    /v1/agents/{agent_id}:
        get:
            tags:
                - Agents
            summary: Retrieve an agent
            description: |-
                Returns the Agent record with its server-derived health_status. For detailed
                 telemetry (capacity, node/workload counts), use GetAgentStatus instead.

                 Scope: `agent:read`
            operationId: AgentAPI_GetAgent
            parameters:
                - name: agent_id
                  in: path
                  description: The unique identifier of the agent (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetAgentResponse'
        delete:
            tags:
                - Agents
            summary: Delete an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteAgent
            parameters:
                - name: agent_id
                  in: path
                  description: |-
                    The unique identifier of the agent to delete (UUID). All API keys bound to
                     its service account are revoked.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.DeleteAgentResponse'
    /v1/agents/{agent_id}/clear-identity-binding:
        post:
            tags:
                - Agents
            summary: Clear an agent's identity binding
            description: |-
                Only valid for KUBERNETES agents; TERRAFORM agents have no identity binding.

                 Scope: `agent:write`
            operationId: AgentAPI_ClearAgentIdentityBinding
            parameters:
                - name: agent_id
                  in: path
                  description: The Admiral agent record ID (UUID), not the kube-system UID.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                reason:
                                    type: string
                                    title: reason
                                    minLength: 1
                                    description: Free-text audit reason for the rebind (e.g. "DR rebuild 2026-05-30").
                                grace_window:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.Duration'
                                    title: grace_window
                                    description: How long the grace window stays open. Defaults to 1h server-side if unset.
                            title: ClearAgentIdentityBindingRequest
                            additionalProperties: false
                            description: |-
                                ClearAgentIdentityBindingRequest opens a rebind grace window for a KUBERNETES
                                 agent.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ClearAgentIdentityBindingResponse'
    /v1/agents/{agent_id}/events:
        get:
            tags:
                - Agents
            summary: List workload events
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListWorkloadEvents
            parameters:
                - name: agent_id
                  in: path
                  description: The agent (cluster) whose events to list (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `type`: filter by event type (Normal, Warning).
                       - `reason`: filter by event reason.
                       - `component`: filter by reporting component.
                       - `host`: filter by node.
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of events to return per page. Defaults to 50 when omitted or
                     0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListWorkloadEventsResponse'
    /v1/agents/{agent_id}/jobs:
        get:
            tags:
                - Agents
            summary: List agent jobs
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentJobs
            parameters:
                - name: agent_id
                  in: path
                  description: The agent whose jobs to list (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `status`: filter by job status (PENDING, ASSIGNED, RUNNING, etc.).
                       - `job_type`: filter by job type (PLAN, APPLY, DESTROY_PLAN, DESTROY_APPLY).
                       - `run_id`: jobs for a specific run (UUID).
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of jobs to return per page. Defaults to 50 when omitted or
                     0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListAgentJobsResponse'
    /v1/agents/{agent_id}/status:
        get:
            tags:
                - Agents
            summary: Retrieve agent status
            description: |-
                Returns NOT_FOUND if the agent does not exist. If the agent exists but has
                 not reported yet, health_status will be PENDING and status will be absent.

                 Scope: `agent:read`
            operationId: AgentAPI_GetAgentStatus
            parameters:
                - name: agent_id
                  in: path
                  description: The unique identifier of the agent (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetAgentStatusResponse'
    /v1/agents/{agent_id}/tokens:
        get:
            tags:
                - Agent Tokens
            summary: List agent tokens
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListApiKeys
            parameters:
                - name: agent_id
                  in: path
                  description: The agent to list keys for (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by key name.
                       - `status`: filter by key status (ACTIVE, REVOKED).
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of keys to return per page. Defaults to 50 when omitted or
                     0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListApiKeysResponse'
        post:
            tags:
                - Agent Tokens
            summary: Create an agent token
            description: |-
                Use this to create additional API keys for an existing agent (e.g., for
                 zero-downtime key rotation). The initial key is created automatically by
                 CreateAgent.

                 Scope: `agent:write`
            operationId: AgentAPI_CreateApiKey
            parameters:
                - name: agent_id
                  in: path
                  description: The agent to bind this key to (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    title: name
                                    maxLength: 63
                                    minLength: 1
                                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                                    description: |-
                                        URL-safe, human-readable identifier for the key (e.g., "prod-agent-key").
                                         Unique within the agent's keys. Lowercase alphanumeric and hyphens only,
                                         must start with a letter and end with an alphanumeric character (1-63 chars).
                                expires_at:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.Timestamp'
                                    title: expires_at
                                    description: Optional expiration time. If unset, the key does not expire.
                            title: CreateApiKeyRequest
                            required:
                                - name
                            additionalProperties: false
                            description: |-
                                CreateApiKeyRequest contains the parameters for creating a new API key bound to
                                 an agent.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateApiKeyResponse'
    /v1/agents/{agent_id}/workloads:
        get:
            tags:
                - Agents
            summary: List workloads
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListWorkloads
            parameters:
                - name: agent_id
                  in: path
                  description: The agent (cluster) whose workloads to list (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `namespace`: filter by Kubernetes namespace.
                       - `kind`: filter by workload kind (Deployment, StatefulSet, DaemonSet).
                       - `name`: filter by workload name.
                       - `health_status`: filter by workload health status.
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of workloads to return per page. Defaults to 50 when omitted
                     or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListWorkloadsResponse'
    /v1/agents/{agent_id}/workloads/{workload_id}:
        get:
            tags:
                - Agents
            summary: Retrieve a workload
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetWorkload
            parameters:
                - name: agent_id
                  in: path
                  description: The agent (cluster) the workload belongs to (UUID).
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    format: uuid
                - name: workload_id
                  in: path
                  description: The workload to retrieve (UUID).
                  required: true
                  schema:
                    type: string
                    title: workload_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetWorkloadResponse'
    /v1/applications:
        get:
            tags:
                - Applications
            summary: List applications
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by application name.
                       - `labels.key`: filter by label key.

                     Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of applications to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.ListApplicationsResponse'
        post:
            tags:
                - Applications
            summary: Create an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.application.v1.CreateApplicationRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.CreateApplicationResponse'
    /v1/applications/{application.id}:
        patch:
            tags:
                - Applications
            summary: Update an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            parameters:
                - name: application.id
                  in: path
                  description: Unique identifier for the application (UUID).
                  required: true
                  schema:
                    type: string
                    title: id
                    format: uuid
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                                         `description`, `labels`.
                            title: UpdateApplicationRequest
                            additionalProperties: false
                            description: UpdateApplicationRequest contains the application fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.UpdateApplicationResponse'
    /v1/applications/{application_id}:
        get:
            tags:
                - Applications
            summary: Retrieve an application
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application (UUID).
                  required: true
                  schema:
                    type: string
                    title: application_id
                    format: uuid
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.GetApplicationResponse'
        delete:
            tags:
                - Applications
            summary: Delete an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application to delete (UUID).
                  required: true
                  schema:
                    type: string
                    title: application_id
                    format: uuid
                - name: force
                  in: query
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                     environments and their runs (metadata records only).
                  schema:
                    type: boolean
                    title: force
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.DeleteApplicationResponse'
    /v1/changesets:
        get:
            tags:
                - ChangeSets
            summary: List change sets
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListChangeSets
            parameters:
                - name: environment_id
                  in: query
                  description: The environment_id query parameter.
                  required: true
                  schema:
                    type: string
                    title: environment_id
                    format: uuid
                - name: status
                  in: query
                  description: UNSPECIFIED lists every status.
                  schema:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSetStatus'
                    title: status
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.ListChangeSetsResponse'
        post:
            tags:
                - ChangeSets
            summary: Create a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_CreateChangeSet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetResponse'
    /v1/changesets/{change_set_id}:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a change set
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetChangeSetResponse'
    /v1/changesets/{change_set_id}/components/{component}/values:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a component's values
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetComponentValues
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
                - name: component
                  in: path
                  description: The component path parameter.
                  required: true
                  schema:
                    type: string
                    title: component
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetComponentValuesResponse'
    /v1/changesets/{change_set_id}/diff:
        get:
            tags:
                - ChangeSets
            summary: Diff a change set
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_DiffChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]{12}$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiffChangeSetResponse'
    /v1/changesets/{change_set_id}/discard:
        post:
            tags:
                - ChangeSets
            summary: Discard a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.

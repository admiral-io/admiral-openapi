                revision:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.Revision'
                    title: revision
                warnings:
                    type: array
                    items:
                        type: string
                    title: warnings
            title: EditChangeSetResponse
            additionalProperties: false
        admiral.api.changeset.v1.Entry:
            type: object
            properties:
                component:
                    type: string
                    title: component
                action:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.EntryAction'
                    title: action
                version:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.VersionRef'
                    title: version
                    description: |-
                        The version the component runs after this change set: set on
                         ENTRY_ACTION_CREATE and when the version changes.
                base_digest:
                    type: string
                    title: base_digest
                    description: Empty on ENTRY_ACTION_CREATE.
                result_digest:
                    type: string
                    title: result_digest
                    description: Empty on ENTRY_ACTION_DESTROY.
                ops:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.api.changeset.v1.ValueOp'
                    title: ops
                settings:
                    allOf:
                        - $ref: '#/components/schemas/admiral.api.changeset.v1.ComponentSettings'
                    title: settings
                    description: |-
                        How Admiral deploys the component after this change set. Empty on
                         ENTRY_ACTION_DESTROY.
                depends_on:
                    type: array
                    items:
                        type: string
                    title: depends_on
                    description: Components this one applies after, after this change set.
            title: Entry
            additionalProperties: false
            description: Entry is what one revision does to one component.
        admiral.api.changeset.v1.EntryAction:
            type: string
            title: EntryAction
            enum:
                - ENTRY_ACTION_UNSPECIFIED
                - ENTRY_ACTION_CREATE
                - ENTRY_ACTION_UPDATE
                - ENTRY_ACTION_DESTROY
                - ENTRY_ACTION_ORPHAN

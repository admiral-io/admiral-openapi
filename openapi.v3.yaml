                    description: Opaque pagination token from a previous response.
            title: ListEnvironmentVariablesRequest
            additionalProperties: false
            description: |-
                ListEnvironmentVariablesRequest contains the environment ID, filters, and
                 pagination parameters.
        admiral.environment.v1.ListEnvironmentVariablesResponse:
            type: object
            properties:
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/admiral.variable.v1.Variable'
                    title: variables

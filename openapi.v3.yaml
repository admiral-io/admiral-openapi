    /v1/components/import:
        post:
            tags:
                - Components
            summary: Import an artifact from a registry, repository or URL
            description: 'Scope: `component:publish`'
            operationId: RegistryAPI_ImportComponent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.registry.v1.ImportComponentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.ImportComponentResponse'
    /v1/components/publish:
        post:
            tags:
                - Components
            summary: Publish a component version
            description: |-
                The bundle is a gzipped tar of the component root, carried inline and
                 capped at 64 MiB; a fully vendored tree that exceeds it will get a
                 resumable upload path of its own. The server normalizes the bytes
                 (strips `.git`, canonicalizes entry order and timestamps), digests them,
                 runs the publish gate, stores the blob and answers with the version. If
                 the digest already exists under the name, the existing version is
                 returned with `unchanged` set and nothing is written, which is what makes
                 a publish-everything CI recipe safe.

                 Any tags named in the request are set on the resulting version.
                 Repointing a semver tag is refused with FAILED_PRECONDITION and the whole
                 publish fails; the bytes are not kept.

                 Scope: `component:publish`
            operationId: RegistryAPI_PublishComponent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.registry.v1.PublishComponentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.PublishComponentResponse'
    /v1/components/{component.id}:
        patch:
            tags:
                - Components
            summary: Update a component
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_UpdateComponent
            parameters:
                - name: component.id
                  in: path
                  description: Unique identifier.
                  required: true
                  schema:
                    type: string
                    title: id
                    pattern: ^cmp-[0-9a-z]+$
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: |-
                                        Supported fields: `description`, `labels`. An empty mask updates what
                                         the request populates.
                            title: UpdateComponentRequest
                            additionalProperties: false
                            description: |-
                                UpdateComponentRequest carries the fields to change. Omitted fields are
                                 left as they are.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.registry.v1.UpdateComponentResponse'

                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.environment.v1.ListEnvironmentsResponse'
        post:
            tags:

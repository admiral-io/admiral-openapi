                    pattern: ^cmp-[0-9a-z]+$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.registry.v1.Component.Status'
                                    not:
                                        enum:
                                            - STATUS_UNSPECIFIED
                                    title: status
                                    description: |
                                        enum.defined_only = true
                                reason:
                                    type: string
                                    title: reason
                                    maxLength: 1024
                                    description: Shown wherever the status warns. Required unless the status is ACTIVE.
                                successor_component_id:
                                    type: string

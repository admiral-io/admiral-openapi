openapi: 3.1.0
info:
    title: Admiral API
    description: The Admiral REST API for managing applications, infrastructure, and runs. See https://admiral.io/docs for complete documentation.
    version: v1
paths:
    /v1/agents:
        get:
            tags:
                - Agents
            summary: List agents
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgents
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Filterable fields:
                       - `name`: filter by agent name.
                       - `kind`: filter by agent kind.
                       - `assignable_to`: agents an application's environments may be assigned (an application id).

                     Example: `field['kind'] = 'KIND_KUBERNETES' AND field['assignable_to'] = 'app-4m8q2x7k1p9c'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListAgentsResponse'
        post:
            tags:
                - Agents
            summary: Create an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateAgent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.agent.v1.CreateAgentRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateAgentResponse'
    /v1/agents/{agent.id}:
        patch:
            tags:
                - Agents
            summary: Update an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_UpdateAgent
            parameters:
                - name: agent.id
                  in: path
                  description: The agent.id path parameter.
                  required: true
                  schema:
                    type: string
                    title: id
                    pattern: ^agt-[0-9a-z]+$
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: 'Supported fields: `name`, `settings`, `approval`, `allowed_component_ids`.'
                            title: UpdateAgentRequest
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.UpdateAgentResponse'
    /v1/agents/{agent_id}:
        get:
            tags:
                - Agents
            summary: Retrieve an agent
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetAgent
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GetAgentResponse'
        delete:
            tags:
                - Agents
            summary: Delete an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteAgent
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.DeleteAgentResponse'
    /v1/agents/{agent_id}/enrollment-keys:
        post:
            tags:
                - Agents
            summary: Issue an enrollment key
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateEnrollmentKey
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.CreateEnrollmentKeyResponse'
    /v1/agents/{agent_id}/grants:
        get:
            tags:
                - Agents
            summary: List who may use an agent
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentGrants
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.ListAgentGrantsResponse'
        post:
            tags:
                - Agents
            summary: Grant use of an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_GrantAgentUse
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                grant:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                                    title: grant
                            title: GrantAgentUseRequest
                            required:
                                - grant
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.GrantAgentUseResponse'
    /v1/agents/{agent_id}/grants/revoke:
        post:
            tags:
                - Agents
            summary: Revoke use of an agent
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_RevokeAgentUse
            parameters:
                - name: agent_id
                  in: path
                  description: The agent_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: agent_id
                    pattern: ^agt-[0-9a-z]+$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                grant:
                                    allOf:
                                        - $ref: '#/components/schemas/admiral.api.agent.v1.AgentGrant'
                                    title: grant
                            title: RevokeAgentUseRequest
                            required:
                                - grant
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.agent.v1.RevokeAgentUseResponse'
    /v1/api-keys:
        get:
            tags:
                - API Keys
            summary: List API keys
            description: 'Scope: `apikey:read`'
            operationId: ApiKeyAPI_ListApiKeys
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by key name.
                       - `status`: filter by key status (API_KEY_STATUS_ACTIVE,
                         API_KEY_STATUS_REVOKED).

                     Example: `field['status'] = 'API_KEY_STATUS_ACTIVE'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of keys to return per page. Defaults to 50 when omitted
                     or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.apikey.v1.ListApiKeysResponse'
        post:
            tags:
                - API Keys
            summary: Create an API key
            description: 'Scope: `apikey:write`'
            operationId: ApiKeyAPI_CreateApiKey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.apikey.v1.CreateApiKeyRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.apikey.v1.CreateApiKeyResponse'
    /v1/api-keys/{api_key.id}:
        patch:
            tags:
                - API Keys
            summary: Update an API key
            description: 'Scope: `apikey:write`'
            operationId: ApiKeyAPI_UpdateApiKey
            parameters:
                - name: api_key.id
                  in: path
                  description: Unique identifier for the key.
                  required: true
                  schema:
                    type: string
                    title: id
                    pattern: ^key-[0-9a-z]+$
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: 'The set of fields to update. Supported fields: `name`, `scopes`.'
                            title: UpdateApiKeyRequest
                            additionalProperties: false
                            description: UpdateApiKeyRequest updates one of the caller's keys.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.apikey.v1.UpdateApiKeyResponse'
    /v1/api-keys/{api_key_id}:
        get:
            tags:
                - API Keys
            summary: Retrieve an API key
            description: 'Scope: `apikey:read`'
            operationId: ApiKeyAPI_GetApiKey
            parameters:
                - name: api_key_id
                  in: path
                  description: The unique identifier of the key.
                  required: true
                  schema:
                    type: string
                    title: api_key_id
                    pattern: ^key-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.apikey.v1.GetApiKeyResponse'
    /v1/api-keys/{api_key_id}/revoke:
        post:
            tags:
                - API Keys
            summary: Revoke an API key
            description: 'Scope: `apikey:write`'
            operationId: ApiKeyAPI_RevokeApiKey
            parameters:
                - name: api_key_id
                  in: path
                  description: The unique identifier of the key to revoke.
                  required: true
                  schema:
                    type: string
                    title: api_key_id
                    pattern: ^key-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.apikey.v1.RevokeApiKeyResponse'
    /v1/applications:
        get:
            tags:
                - Applications
            summary: List applications
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                     API documentation for the full operator and predicate reference).

                     Filterable fields:
                       - `name`: filter by application name.
                       - `labels.key`: filter by label key.

                     Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: |-
                    Maximum number of applications to return per page. Defaults to 50 when
                     omitted or 0; must not exceed 100.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: Opaque pagination token from a previous response.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.ListApplicationsResponse'
        post:
            tags:
                - Applications
            summary: Create an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.application.v1.CreateApplicationRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.CreateApplicationResponse'
    /v1/applications/{application.id}:
        patch:
            tags:
                - Applications
            summary: Update an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            parameters:
                - name: application.id
                  in: path
                  description: Unique identifier for the application.
                  required: true
                  schema:
                    type: string
                    title: id
                    pattern: ^app-[0-9a-z]+$
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: |-
                                        The set of fields to update. Optional; if omitted, all populated fields
                                         are updated. Pass `*` for full replacement. Supported fields: `name`,
                                         `description`, `labels`.
                            title: UpdateApplicationRequest
                            additionalProperties: false
                            description: UpdateApplicationRequest contains the application fields to update.
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.UpdateApplicationResponse'
    /v1/applications/{application_id}:
        get:
            tags:
                - Applications
            summary: Retrieve an application
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application.
                  required: true
                  schema:
                    type: string
                    title: application_id
                    pattern: ^app-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.GetApplicationResponse'
        delete:
            tags:
                - Applications
            summary: Delete an application
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            parameters:
                - name: application_id
                  in: path
                  description: The unique identifier of the application to delete.
                  required: true
                  schema:
                    type: string
                    title: application_id
                    pattern: ^app-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.application.v1.DeleteApplicationResponse'
    /v1/changesets:
        get:
            tags:
                - ChangeSets
            summary: List change sets
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListChangeSets
            parameters:
                - name: environment_id
                  in: query
                  description: The environment_id query parameter.
                  required: true
                  schema:
                    type: string
                    title: environment_id
                    pattern: ^env-[0-9a-z]+$
                - name: filter
                  in: query
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                     Filterable fields:
                       - `status`: filter by change set status.
                       - `title`: filter by title.

                     Example: `field['status'] = 'STATUS_OPEN'`
                  schema:
                    type: string
                    title: filter
                    maxLength: 1024
                - name: page_size
                  in: query
                  description: The page_size query parameter.
                  schema:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                - name: page_token
                  in: query
                  description: The page_token query parameter.
                  schema:
                    type: string
                    title: page_token
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.ListChangeSetsResponse'
        post:
            tags:
                - ChangeSets
            summary: Create a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_CreateChangeSet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetRequest'
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.CreateChangeSetResponse'
    /v1/changesets/{change_set.id}:
        patch:
            tags:
                - ChangeSets
            summary: Update a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_UpdateChangeSet
            parameters:
                - name: change_set.id
                  in: path
                  description: '`cs-` and twelve lowercase base36 characters.'
                  required: true
                  schema:
                    type: string
                    title: id
                    pattern: ^cs-[0-9a-z]+$
                    readOnly: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                update_mask:
                                    allOf:
                                        - $ref: '#/components/schemas/google.protobuf.FieldMask'
                                    title: update_mask
                                    description: |-
                                        The fields to update. Optional; if omitted, all populated fields are
                                         updated. Supported fields: `title`, `description`.

                                         `environment_id` is not updatable: a change set never moves between
                                         environments.
                            title: UpdateChangeSetRequest
                            additionalProperties: false
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.UpdateChangeSetResponse'
    /v1/changesets/{change_set_id}:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a change set
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetChangeSetResponse'
    /v1/changesets/{change_set_id}/components/{component}/values:
        get:
            tags:
                - ChangeSets
            summary: Retrieve a component's values
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetComponentValues
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                - name: component
                  in: path
                  description: The component path parameter.
                  required: true
                  schema:
                    type: string
                    title: component
                    maxLength: 53
                    minLength: 1
                    pattern: ^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$
                - name: effective
                  in: query
                  description: |-
                    Return the whole tree the component will receive: its own defaults, the
                     organization's baseline, what the environment runs with, then this
                     change set's edits. An upload never uses this view.
                  schema:
                    type: boolean
                    title: effective
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.GetComponentValuesResponse'
    /v1/changesets/{change_set_id}/diff:
        get:
            tags:
                - ChangeSets
            summary: Diff a change set
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_DiffChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiffChangeSetResponse'
    /v1/changesets/{change_set_id}/discard:
        post:
            tags:
                - ChangeSets
            summary: Discard a change set
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.DiscardChangeSetResponse'
    /v1/changesets/{change_set_id}/edit:
        post:
            tags:
                - ChangeSets
            summary: Edit a change set
            description: |-
                FAILED_PRECONDITION when `if_revision` is not the head (the message names
                 the head), when the change set is not open or its apply is running or
                 holding the environment, when a version is revoked (the message
                 carries the recorded reason), and when a component would land on no
                 agent assignment that may run it and serves its providers (the message
                 names an agent that would, and its owner). ALREADY_EXISTS when a component name is
                 live or held by another open change set (the message names which). A
                 contract violation is accepted: it is stored on the revision and
                 returned.

                 Scope: `changeset:write`
            operationId: ChangeSetAPI_EditChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                if_revision:
                                    type:
                                        - integer
                                        - "null"
                                    title: if_revision
                                    minimum: 0
                                    format: int32
                                    description: When set, refused unless the head is this revision.
                                edits:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/admiral.api.changeset.v1.Edit'
                                    title: edits
                                    maxItems: 100
                                    minItems: 1
                            title: EditChangeSetRequest
                            additionalProperties: false
                            description: |
                                edit_change_set.upload_needs_if_revision // an upload replaces a whole tree, so it needs if_revision
                required: true
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admiral.api.changeset.v1.EditChangeSetResponse'
    /v1/changesets/{change_set_id}/rebase:
        post:
            tags:
                - ChangeSets
            summary: Rebase a change set
            description: |-
                Every conflict needs a resolution, and resolving any dismisses every
                 approval. Without one, an approval carries to the new revision's run when
                 its plan does the same thing to every resource, as ApproveRun says.

                 FAILED_PRECONDITION when it is not behind, when `if_revision` is not the
                 head, when the change set is not open or its apply is running, and when a
                 conflict has no resolution or a resolution matches no conflict (the
                 message names each).

                 Scope: `changeset:write`
            operationId: ChangeSetAPI_RebaseChangeSet
            parameters:
                - name: change_set_id
                  in: path
                  description: The change_set_id path parameter.
                  required: true
                  schema:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
            requestBody:
                content:

                        - required:
                            - replace_values
                        - required:
                            - set_depends_on
                        - required:
                            - set_settings
                        - required:
                            - set_value
                        - required:
                            - set_version
                        - required:
                            - unset_value
                    - not:
                        oneOf:
                            - required:
                                - add_component
                            - required:
                                - orphan_component
                            - required:
                                - remove_component
                            - required:
                                - replace_values
                            - required:
                                - set_depends_on
                            - required:
                                - set_settings
                            - required:
                                - set_value
                            - required:
                                - set_version
                            - required:
                                - unset_value
            title: Edit

                        $ref: '#/components/schemas/admiral.api.changeset.v1.ChangeSet'
                    title: change_sets
                next_page_token:
                    type: string
                    title: next_page_token
            title: ListChangeSetsResponse
            additionalProperties: false
        admiral.api.changeset.v1.ListRevisionsRequest:
            type: object
            properties:
                change_set_id:
                    type: string
                    title: change_set_id
                    pattern: ^cs-[0-9a-z]+$
                page_size:
                    type: integer
                    title: page_size
                    maximum: 100
                    minimum: 0
                    format: int32
                page_token:
                    type: string
                    title: page_token
            title: ListRevisionsRequest
            required:
                - change_set_id
            additionalProperties: false
        admiral.api.changeset.v1.ListRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array

    v1GitHubAppAuth:
        type: object
        properties:
            app_id:
                type: string
                format: int64
                description: The app's numeric id, from the app's settings page.
            installation_id:
                type: string
                format: int64
                description: The installation's numeric id, from the installation's URL.
            private_key:
                type: string
                description: The app's PEM-encoded RSA private key. Write-only.
            api_url:
                type: string
                description: |-
                    The REST API base, for GitHub Enterprise Server:
                    `https://github.acme.example/api/v3`. Empty is `https://api.github.com`.
        description: |-
            GitHubAppAuth identifies a GitHub App installation and holds the app's
            private key, from which the platform mints installation tokens.
    v1GrantAgentUseResponse:
        type: object
    v1Invitation:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier (UUID).
                readOnly: true
            email:
                type: string
                description: The address the invitation was sent to.
                readOnly: true
            role:
                $ref: '#/definitions/v1UserRole'
                description: The role the person holds once they join. ADMIN or MEMBER.
                readOnly: true
            status:
                $ref: '#/definitions/v1InvitationStatus'
                readOnly: true
            invited_by:
                type: string
                description: |-
                    The member who issued it (UUID). Absent when it was issued by an operator
                    from outside the tenant.
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            expires_at:
                type: string
                format: date-time
                description: After this instant the link no longer works.
                readOnly: true
            accepted_at:
                type: string
                format: date-time
                description: |-
                    When it was redeemed, and who it became. Both set together, only on
                    ACCEPTED.
                readOnly: true
            accepted_user_id:
                type: string
                readOnly: true
            revoked_at:
                type: string
                format: date-time
                description: When it was withdrawn or retired. Only on REVOKED.
                readOnly: true
        description: |-
            Invitation is one person invited into the caller's tenant. Never carries
            the link or its token.
    v1InvitationStatus:
        type: string
        enum:
            - INVITATION_STATUS_UNSPECIFIED
            - INVITATION_STATUS_PENDING
            - INVITATION_STATUS_ACCEPTED
            - INVITATION_STATUS_EXPIRED
            - INVITATION_STATUS_REVOKED
        default: INVITATION_STATUS_UNSPECIFIED
        description: |-
            InvitationStatus is where an invitation is in its life.

             - INVITATION_STATUS_UNSPECIFIED: Default value. Must not be used.
             - INVITATION_STATUS_PENDING: Issued and redeemable until expires_at.
             - INVITATION_STATUS_ACCEPTED: Redeemed; accepted_user_id names the member it became.
             - INVITATION_STATUS_EXPIRED: expires_at passed with nobody redeeming it.
             - INVITATION_STATUS_REVOKED: Withdrawn, or retired because a newer invitation was issued for the same
            address.
    v1Job:
        type: object
        properties:
            id:
                type: string
            kind:
                $ref: '#/definitions/v1JobKind'
            status:
                $ref: '#/definitions/v1JobStatus'
            agent_id:
                type: string
            environment_id:
                type: string
            change_set_id:
                type: string
                description: '`cs-` id; empty for a PROBE.'
            revision:
                type: integer
                format: int32
            artifact_digest:
                type: string
                description: '`sha256:<hex>` of the run artifact the job runs.'
            attempt:
                type: integer
                format: int32
            wait_reason:
                $ref: '#/definitions/v1WaitReason'
                description: Set while QUEUED.
            result:
                $ref: '#/definitions/v1JobResult'
            created_at:
                type: string
                format: date-time
            started_at:
                type: string
                format: date-time
            finished_at:
                type: string
                format: date-time
    v1JobKind:
        type: string
        enum:
            - JOB_KIND_UNSPECIFIED
            - PROBE
            - PLAN
            - APPLY
        default: JOB_KIND_UNSPECIFIED
        description: |4-
             - PROBE: Proves an agent can claim, start, renew, fetch and report. Queued when an
            agent first reports, and on request.
    v1JobResult:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1JobStatus'
                description: SUCCEEDED, FAILED or CANCELLED.
            message:
                type: string
            steps:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Step'
            output_json:
                type: string
                description: Kind-specific output as JSON text, e.g. a plan.
    v1JobStatus:
        type: string
        enum:
            - JOB_STATUS_UNSPECIFIED
            - QUEUED
            - OFFERED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
        default: JOB_STATUS_UNSPECIFIED
        description: ' - OFFERED: Offered to an agent, not yet started.'
    v1KubernetesCapabilities:
        type: object
        properties:
            kube_version:
                type: string
                description: e.g. `v1.31.2`.
            api_versions:
                type: array
                items:
                    type: string
                description: Group/version strings, e.g. `monitoring.coreos.com/v1`.
            reported_at:
                type: string
                format: date-time
        description: KubernetesCapabilities is a cluster's version and installed API groups.
    v1KubernetesPlacement:
        type: object
        properties:
            namespace:
                type: string
                description: Empty means the environment's default namespace.
            extra_namespaces:
                type: array
                items:
                    type: string
                description: |-
                    Namespaces the component may also write to, such as `kube-system` for a
                    chart's leader-election Role. The plan refuses an object in any other.
        description: KubernetesPlacement is a workload component's namespace.
    v1KubernetesTarget:
        type: object
        properties:
            namespace:
                type: string
                description: |-
                    The namespace a component renders into unless it names its own. Set to
                    `<application>-<environment>` when the environment is created if left
                    empty; at most 63 characters.
            create_namespaces:
                type: boolean
                description: |-
                    Whether a missing namespace is created at apply. The agent's own
                    setting and its RBAC can still refuse. Defaults to true on create.
            capabilities:
                $ref: '#/definitions/v1KubernetesCapabilities'
                description: |-
                    What the cluster reported, rendered against at prepare. Absent until an
                    agent reports.
                readOnly: true
            agent_id:
                type: string
                description: |-
                    The agent this environment deploys through. It must be one the agent's
                    owner granted to the tenant, a team, or this application. Empty selects
                    none; capabilities then come from no cluster.
        description: KubernetesTarget is where an environment's workload components go.
    v1ListAgentGrantsResponse:
        type: object
        properties:
            grants:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AgentGrant'
    v1ListAgentsResponse:
        type: object
        properties:
            agents:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Agent'
            next_page_token:
                type: string
    v1ListApiKeysResponse:
        type: object
        properties:
            api_keys:
                type: array
                items:

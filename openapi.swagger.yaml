    v1GitHubAppAuth:
        type: object
        properties:
            app_id:
                type: string
                format: int64
                description: The app's numeric id, from the app's settings page.
            installation_id:
                type: string
                format: int64
                description: The installation's numeric id, from the installation's URL.
            private_key:
                type: string
                description: The app's PEM-encoded RSA private key. Write-only.
            api_url:
                type: string
                description: |-
                    The REST API base, for GitHub Enterprise Server:
                    `https://github.acme.example/api/v3`. Empty is `https://api.github.com`.
        description: |-
            GitHubAppAuth identifies a GitHub App installation and holds the app's
            private key, from which the platform mints installation tokens.
    v1GrantAgentUseResponse:
        type: object
    v1HeartbeatRequest:
        type: object
        properties:
            agent_version:
                type: string
            protocol_version:
                type: integer
                format: int32
            jwks:
                type: string
                description: |-
                    The issuer's current keys, when the agent can see them (for Kubernetes,
                    /openid/v1/jwks). Never applied: one stolen agent token could otherwise
                    plant a key. A set that differs from the trusted one is recorded in the
                    provider's `pending_key_ids` for an admin; ignored for a `jwks_uri`
                    provider, whose keys come from the issuer alone.
            profiles:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ProfileReport'
                description: |-
                    The profiles the agent defines and what each serves, read from its
                    config. Names and provider addresses only, never values. An assignment
                    naming a profile the agent has not reported is refused.
            kubernetes:
                $ref: '#/definitions/v1KubernetesReport'
    v1HeartbeatResponse:
        type: object
        properties:
            next_report_seconds:
                type: integer
                format: int32
            keys:
                $ref: '#/definitions/HeartbeatResponseKeys'
    v1Hold:
        type: object
        properties:
            change_set_id:
                type: string
                description: The change set whose partial apply holds the environment.
            held_at:
                type: string
                format: date-time
                description: When the partial apply finished.
        description: Hold is the state a partial apply leaves an environment in.
    v1Invitation:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier.
                readOnly: true
            email:
                type: string
                description: Where the mail goes, and the address the user will be created with.
            role:
                $ref: '#/definitions/v1UserRole'
                description: The role the person holds once they join. ADMIN or MEMBER.
            status:
                $ref: '#/definitions/v1InvitationStatus'
                readOnly: true
            invited_by:
                $ref: '#/definitions/v1ActorRef'
                description: |-
                    The member who issued it. Absent when it was issued by an operator from
                    outside the tenant.
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            expires_at:
                type: string
                format: date-time
                description: After this instant the link no longer works.
                readOnly: true
            accepted_at:
                type: string
                format: date-time
                description: |-
                    When it was redeemed, and the member it became. Both set together, only
                    on ACCEPTED.
                readOnly: true
            accepted_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            revoked_at:
                type: string
                format: date-time
                description: When it was withdrawn or retired. Only on REVOKED.
                readOnly: true
        description: |-
            Invitation is one person invited into the caller's tenant. Never carries
            the link or its token.
    v1InvitationStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_PENDING
            - STATUS_ACCEPTED
            - STATUS_EXPIRED
            - STATUS_REVOKED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is where an invitation is in its life.

             - STATUS_UNSPECIFIED: Default value. Must not be used.
             - STATUS_PENDING: Issued and redeemable until expires_at.
             - STATUS_ACCEPTED: Redeemed; accepted_by names the member it became.
             - STATUS_EXPIRED: expires_at passed with nobody redeeming it.
             - STATUS_REVOKED: Withdrawn, or retired because a newer invitation was issued for the same
            address.
    v1Job:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            kind:
                $ref: '#/definitions/v1JobKind'
            status:
                $ref: '#/definitions/v1JobStatus'
            agent_id:
                type: string
                readOnly: true
            environment_id:
                type: string
                readOnly: true
            run_id:
                type: string
                description: The run this job plans or applies; empty for a PROBE.
                readOnly: true
            assignment_id:
                type: string
                description: The environment assignment it runs on, and the components it covers.
                readOnly: true
            components:
                type: array
                items:
                    type: string
            profile:
                type: string
                description: |-
                    The profile the agent loads for this job, resolved for its phase from
                    the assignment; `default` when the assignment names none. The job starts
                    with a clean environment holding only this profile.
            artifact_digest:
                type: string
                description: '`sha256:<hex>` of the artifact the job runs.'
            attempt:
                type: integer
                format: int32
            wait_reason:
                $ref: '#/definitions/v1WaitReason'
                description: Set while QUEUED.
            result:
                $ref: '#/definitions/v1JobResult'
            created_at:
                type: string
                format: date-time
            started_at:
                type: string
                format: date-time
            finished_at:
                type: string
                format: date-time
    v1JobKind:
        type: string
        enum:
            - JOB_KIND_UNSPECIFIED
            - JOB_KIND_PROBE
            - JOB_KIND_PLAN
            - JOB_KIND_APPLY
        default: JOB_KIND_UNSPECIFIED
        description: |4-
             - JOB_KIND_PROBE: Proves an agent can claim, start, renew, fetch and report. Queued when an
            agent first reports, and on request.
    v1JobResult:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1JobStatus'
                description: SUCCEEDED, FAILED or CANCELLED.
            message:
                type: string
            steps:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Step'
            plan:
                $ref: '#/definitions/v1PlanResult'
                description: Set by a PLAN.
            inventory:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ComponentInventory'
                description: |-
                    Set by an APPLY: what each component it reached left in the cluster,
                    including one that failed partway.
    v1JobStatus:
        type: string
        enum:
            - JOB_STATUS_UNSPECIFIED
            - JOB_STATUS_QUEUED
            - JOB_STATUS_OFFERED
            - JOB_STATUS_RUNNING
            - JOB_STATUS_SUCCEEDED
            - JOB_STATUS_FAILED
            - JOB_STATUS_CANCELLED
        default: JOB_STATUS_UNSPECIFIED
        description: ' - JOB_STATUS_OFFERED: Offered to an agent, not yet started.'
    v1KubernetesAgentSettings:
        type: object
        properties:
            allowed_namespaces:
                type: array
                items:
                    type: string
                description: Glob patterns; empty allows every namespace.
            denied_namespaces:
                type: array
                items:
                    type: string
                description: |-
                    Glob patterns. A namespace that matches is refused even when
                    `allowed_namespaces` matches it too.
            allow_namespace_creation:
                type: boolean
        description: |-
            KubernetesAgentSettings limits where a Kubernetes agent may deploy,
            whatever its RBAC allows. The plan refuses what falls outside them.
    v1KubernetesCapabilities:
        type: object
        properties:
            can_create_namespaces:
                type: boolean
            writable_namespaces:
                type: array
                items:
                    type: string
                description: Namespaces it may write. Empty when `all_namespaces` is set.
            all_namespaces:
                type: boolean
            can_write_cluster_scoped:
                type: boolean
        description: KubernetesCapabilities is what the agent's own RBAC lets it do, as it measured.
    v1KubernetesComponentSettings:
        type: object
        properties:
            namespace:
                type: string
                description: Empty means the environment's default namespace.
            extra_namespaces:
                type: array
                items:
                    type: string
                description: |-
                    Namespaces the component may also write to, such as `kube-system` for a
                    chart's leader-election Role. The plan refuses an object in any other.
        description: KubernetesComponentSettings is where a Kubernetes component's objects go.
    v1KubernetesEnrollment:
        type: object
        properties:
            cluster_uid:
                type: string
                description: 'The kube-system namespace UID: an accident detector, not a proof.'
        description: KubernetesEnrollment is what a Kubernetes agent reports when it enrolls.
    v1KubernetesReport:
        type: object
        properties:
            kube_version:
                type: string
            api_versions:
                type: array
                items:
                    type: string
            capabilities:
                $ref: '#/definitions/v1KubernetesCapabilities'
            cluster_uid:
                type: string
                description: 'The kube-system namespace UID: an accident detector, not a proof.'
        description: KubernetesReport is what a Kubernetes agent reports about its cluster.
    v1KubernetesSettings:
        type: object
        properties:
            default_namespace:
                type: string
                description: |-
                    The namespace a component renders into unless it names its own. Set to
                    `<application>-<environment>` when the environment is created if left
                    empty; at most 63 characters.
            create_namespaces:
                type: boolean
                description: |-
                    Whether a missing namespace is created at apply. The agent's own
                    setting and its RBAC can still refuse. Defaults to true on create.
            prune:
                type: boolean
                description: |-
                    Whether an apply deletes objects a component no longer renders, and the
                    objects of a component it removes. Off, they are orphaned: left in the
                    cluster and no longer managed. An object annotated
                    `admiral.io/prune: "false"` is orphaned either way. Defaults to true on
                    create.
        description: KubernetesSettings is how an environment uses a Kubernetes agent.
    v1LastApply:
        type: object
        properties:
            change_set_id:
                type: string
                description: The change set that was applied.
            revision_id:
                type: string
                description: The change set revision that was applied.
            applied_at:
                type: string
                format: date-time
                description: When the apply finished.
        description: |-
            LastApply points at the apply that produced an environment's current
            generation.

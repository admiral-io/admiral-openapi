swagger: "2.0"
info:
    title: Admiral API
    version: v1
tags:
    - name: AgentAPI
      description: |-
        AgentAPI manages what runs work in a customer's cluster: the clusters
        Admiral trusts, the agents in them, who may use each agent, and the jobs the
        platform hands them.

        A cluster is trusted, not a token. Admiral holds its service-account token
        issuer (a public URL it fetches keys from) or its public keys (uploaded), and
        an agent is one namespace and service account in it. The agent proves who it
        is with the short-lived token its own cluster issues; no long-lived secret
        exists. A cluster without keys yet is PENDING until a person sets them or an
        agent enrolls it with a single-use enrollment key.

        An environment deploys through the agent it selects, and may select only an
        agent whose owner granted use to the whole tenant, one of its teams, or its
        application.
    - name: AgentRuntimeAPI
      description: |-
        AgentRuntimeAPI is what an agent calls while it works. Its routes live
        under /v1/agent (singular: the caller is the agent) and are excluded from
        the public OpenAPI document. The caller is always
        an agent, identified by its token; no request names an agent.

        Work is claimed as an offer, started before anything touches the cluster,
        held by renewing a lease, and reported once per attempt. Every call after
        the claim carries the attempt and its lease token; a call from an attempt
        that is not the current one, or whose lease lapsed, changes nothing.
    - name: ApplicationAPI
      description: |-
        ApplicationAPI manages applications within a tenant.

        An application is the fundamental unit in Admiral. It groups deployment
        manifests, infrastructure dependencies, environment configuration, and
        relationships into a single entity that can be deployed across multiple
        environments. Applications are defined once and promoted explicitly between
        environments.
    - name: ChangeSetAPI
      description: |-
        ChangeSetAPI manages change sets: proposals against the components of one
        environment. Add a component from the registry, move its pin, set or
        remove values, remove it; each request cuts one immutable revision.
        Nothing here plans or applies.

        A change set is addressed by its id, `cs-` and twelve base36 characters.

        Values are JSON text in `*_json` fields, so an integer above 2^53 keeps
        every digit. A map whose only key is `$ref` is a reference to another
        component's output (`{"$ref": "users-db.connection_name"}`); a real value
        of that shape is written with `$$ref`.
    - name: CredentialAPI
      description: |-
        CredentialAPI manages the credentials a tenant registers for reaching
        external systems at publish time: a git host, a Helm repository, an OCI
        registry, a module registry.

        A credential is never selected for the caller. A pull-publish names the
        credentials it may use, chosen by the user from those whose type its
        protocols can present, and the platform presents each only where it fits.
        A credential may carry `allowed_hosts`, a guard that restricts where it is
        ever presented, whatever it is attached to. Credentials exist for publish
        only; nothing on the deploy path reads one.

        Secrets are write-only: accepted on create and update, encrypted at rest,
        decrypted only inside a publish, and never returned. Get and List return
        metadata only.
    - name: RegistryAPI
      description: |-
        RegistryAPI is the component registry: what a tenant has published,
        addressed by digest.

        A component here is a REGISTRY ENTRY -- the thing `admiral component
        publish` creates and later publishes land under -- not an instance running
        in an environment. Both are called component on purpose; the verbs and the
        address forms carry the distinction. Publish, tag and status changes act on
        the registry (this service); add, update and copy act inside a change set.
        `cloud-sql:v1.2.0` is registry-speak, `my-api/prod/users-db` is
        environment-speak.

        Three nouns. A Component is the name row. A Revision is one published
        artifact, identified by the SHA-256 of its normalized bundle; the digest is
        the identity and the source repository is provenance. A Tag is a pointer
        from a name to a revision, in the OCI sense: semver tags (v1.2.0) never move
        once assigned, floating tags (latest, main) may.

        Publishing the same bytes under the same name twice yields the same
        revision. Revisions are never deleted; revoking one refuses new adoption
        while what already pins it keeps running.
    - name: RunAPI
      description: |-
        RunAPI manages runs and their component revisions.

        A run represents a single execution against an application+environment.
        When triggered, Admiral resolves all components for the
        application+environment combination (applying overrides), builds a
        dependency graph, and renders each component into an immutable revision.

        Infrastructure revisions follow a plan -> apply lifecycle, executed by a
        terraform-semantic engine (Terraform or OpenTofu) on the component's
        assigned TERRAFORM agent. Workload revisions (Helm, Kustomize, manifests)
        are applied to the target cluster by the component's KUBERNETES agent. The
        run engine executes the dependency graph in order: independent components
        run in parallel, dependent components wait for their upstream to succeed.

        To roll back to a prior known-good state, create a new run with
        `source_run_id` set to a previous successful run. This re-plans and
        re-applies the prior configuration against the current infrastructure
        state, going through the same plan/approve/apply cycle.
    - name: EnvironmentAPI
      description: |-
        EnvironmentAPI manages environments within an application.

        An environment is a named deployment target (e.g., dev, staging, prod) for an
        application. Each environment carries its own configuration and variables.
        Promotion between environments is explicit; Admiral never auto-promotes.
    - name: HealthcheckAPI
      description: |-
        HealthcheckAPI provides health check operations for monitoring service
        availability. All RPCs in this service are public (no authentication
        required), suitable for load balancer probes.
    - name: UserAPI
      description: |-
        UserAPI provides operations for user profile retrieval, the list of a
        tenant's members, and management of the caller's own API keys.

        An API key here is bound to the calling user (BINDING_TYPE_USER) and lets them
        authenticate from scripts, CI pipelines, and other programmatic contexts. Its
        scopes are selected at creation and it may carry an expiration. Personal
        access token is the same thing said in user-facing words, and the REST routes
        and generated documentation keep that name; the contract has one noun.
    - name: InvitationAPI
      description: |-
        InvitationAPI brings a person into the caller's tenant.

        An invitation is its own resource: it has a lifecycle (PENDING, ACCEPTED,
        EXPIRED, REVOKED) and a user exists only once it is redeemed. Creating one
        sends the mail; the link in it leads to the sign-in service, which is where
        the person proves the address and joins. The token in that link never
        appears on this surface.

        Keyed on the address, one live invitation per address. Creating a second one
        for the same address retires the first and mails a new link, which is also
        how "send it again" works; there is no resend procedure.

        Every request acts on the caller's own tenant; none names one.
    - name: TenantAPI
      description: |-
        TenantAPI exposes the caller's OWN tenant.

        Deliberately narrow. A tenant is an account boundary, not a resource a caller
        browses: there is no list, no create, and no delete here. Provisioning,
        suspension, and deletion are administrative operations and are not part of
        this API.

        No request names a tenant. The caller's tenant comes from their token, so
        there is no id to pass and none to get wrong -- and no shape in which a caller
        could name someone else's.
consumes:
    - application/json
produces:
    - application/json
paths:
    /v1/agents:
        get:
            summary: |-
                ListAgents lists agents, optionally in one cluster or usable by one
                application.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: cluster_id
                  in: query
                  required: false
                  type: string
                - name: application_id
                  description: Only agents this application's environments may select.
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                CreateAgent records an agent: a namespace and service account in a
                cluster. With `enrollment_key` set, the response carries a single-use key
                the agent enrolls the cluster with.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateAgentRequest'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}:
        get:
            summary: GetAgent returns an agent, what it last reported, and its ceiling.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
        delete:
            summary: |-
                DeleteAgent removes an agent. Its leases end in the same transaction, and
                environments that selected it select none.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
        patch:
            summary: |-
                UpdateAgent changes an agent's name and ceiling. The ceiling is set here
                and only here; an agent never reports it.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_UpdateAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIUpdateAgentBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/enrollment-keys:
        post:
            summary: |-
                CreateEnrollmentKey issues a single-use key an agent enrolls its cluster
                with. It can do nothing else, expires within an hour, and is revoked the
                moment it is used.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateEnrollmentKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateEnrollmentKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPICreateEnrollmentKeyBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/grants:
        get:
            summary: ListAgentGrants lists who may use an agent.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentGrants
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentGrantsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                GrantAgentUse lets the whole tenant, a team, or an application's
                environments select an agent. Only the agent's owner or a tenant admin may.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_GrantAgentUse
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GrantAgentUseResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIGrantAgentUseBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/grants/revoke:
        post:
            summary: |-
                RevokeAgentUse withdraws a grant. Environments that selected the agent
                under it keep the selection until they change it, but claim nothing new.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_RevokeAgentUse
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeAgentUseResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIRevokeAgentUseBody'
            tags:
                - AgentAPI
    /v1/applications:
        get:
            summary: |-
                ListApplications returns a paginated list of applications within the
                caller's tenant.
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListApplicationsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by application name.
                      - `labels.key`: filter by label key.

                    Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of applications to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - ApplicationAPI
        post:
            summary: CreateApplication creates a new application within the caller's tenant.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateApplicationRequest contains the parameters for creating a new application.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateApplicationRequest'
            tags:
                - ApplicationAPI
    /v1/applications/{application.id}:
        patch:
            summary: |-
                UpdateApplication updates an application's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: application.id
                  description: Unique identifier for the application (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApplicationAPIUpdateApplicationBody'
            tags:
                - ApplicationAPI
    /v1/applications/{application_id}:
        get:
            summary: GetApplication retrieves an application by ID.
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: application_id
                  description: The unique identifier of the application (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - ApplicationAPI
        delete:
            summary: |-
                DeleteApplication permanently deletes an application. Fails with
                FAILED_PRECONDITION if the application still has environments. Pass
                force = true to cascade-delete all environments and their runs
                (metadata only; no cloud resources are destroyed). This action cannot
                be undone.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: application_id
                  description: The unique identifier of the application to delete (UUID).
                  in: path
                  required: true
                  type: string
                - name: force
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                    environments and their runs (metadata records only).
                  in: query
                  required: false
                  type: boolean
            tags:
                - ApplicationAPI
    /v1/changesets:
        get:
            summary: |-
                ListChangeSets pages through one environment's change sets, oldest
                first.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListChangeSets
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListChangeSetsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  in: query
                  required: true
                  type: string
                - name: status
                  description: UNSPECIFIED lists every status.
                  in: query
                  required: false
                  type: string
                  enum:
                    - CHANGE_SET_STATUS_UNSPECIFIED
                    - DRAFT
                    - DISCARDED
                  default: CHANGE_SET_STATUS_UNSPECIFIED
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - ChangeSetAPI
        post:
            summary: |-
                CreateChangeSet opens a draft against an environment. Edits given here
                cut revision 1 in the same request; with none, the draft has no revision
                until its first edit.
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_CreateChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateChangeSetRequest'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}:
        get:
            summary: GetChangeSet returns a change set and its head revision with entries.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/components/{component}/values:
        get:
            summary: |-
                GetComponentValues returns one component's values as the head revision
                leaves them, with the head's number, which an upload sends back as
                `from_revision`.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetComponentValues
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetComponentValuesResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: component
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/diff:
        get:
            summary: |-
                DiffChangeSet returns, per component the head revision touches, the
                action, the pin before and after, each changed path before and after,
                and the component's violations.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_DiffChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DiffChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/discard:
        post:
            summary: |-
                DiscardChangeSet abandons a draft and releases the component names it
                reserved. FAILED_PRECONDITION when it is already discarded.
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DiscardChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIDiscardChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/edit:
        post:
            summary: EditChangeSet applies the edits in order and cuts exactly one revision.
            description: |-
                FAILED_PRECONDITION when `if_revision` or an upload's `from_revision` is
                not the head (the message names the head), when the change set is not a
                draft, and when a pin names a revoked revision (the message carries the
                recorded reason). ALREADY_EXISTS when a component name is live or held
                by another draft (the message names which). A contract violation is
                accepted: it is stored on the revision and returned.

                Scope: `changeset:write`
            operationId: ChangeSetAPI_EditChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1EditChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIEditChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/plan:
        post:
            summary: |-
                PlanChangeSet asks for a plan of the head revision. The revision is
                prepared first: every component it touches is rendered into one
                content-addressed run artifact. The call queues that work and returns
                at once; GetPrepare reports its progress. Asking again for a revision
                already asked for returns the same prepare, except that a prepare which
                failed for an infrastructure reason is queued again.
            description: |-
                FAILED_PRECONDITION when the change set is not a draft, has no revision,
                or `if_revision` is not the head (the message names the head).

                Scope: `changeset:write`
            operationId: ChangeSetAPI_PlanChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1PlanChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIPlanChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions:
        get:
            summary: |-
                ListRevisions pages through a change set's revisions, oldest first,
                without their entries.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListRevisions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/apiChangesetV1ListRevisionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions/{number}:
        get:
            summary: GetRevision returns one revision with its entries and ops.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/apiChangesetV1GetRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: number
                  in: path
                  required: true
                  type: integer
                  format: int32
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions/{revision}/artifact:
        get:
            summary: |-
                GetArtifact returns a prepared revision's run artifact. Every value
                under a Secret's `data` and `stringData` is replaced by `sha256:` and
                the first twelve hex characters of its digest, so a change stays
                visible and the value does not. FAILED_PRECONDITION when the revision
                is not prepared.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetArtifact
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetArtifactResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: revision
                  in: path
                  required: true
                  type: integer
                  format: int32
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions/{revision}/prepare:
        get:
            summary: |-
                GetPrepare returns the prepare of one revision: its status, findings,
                error and artifact digest. NOT_FOUND when that revision was never
                prepared.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetPrepare
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetPrepareResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: revision
                  in: path
                  required: true
                  type: integer
                  format: int32
            tags:
                - ChangeSetAPI
    /v1/clusters:
        get:
            summary: ListClusters lists the tenant's clusters.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListClusters
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListClustersResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                CreateCluster records a cluster to trust. Give its issuer URL when the
                issuer is public (GKE, EKS), its keys when not (kind, on-prem), or neither
                to leave it PENDING for an agent to enroll.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateCluster
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateClusterResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateClusterRequest'
            tags:
                - AgentAPI
    /v1/clusters/{cluster_id}:
        get:
            summary: GetCluster returns a cluster and the key ids it trusts.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetCluster
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetClusterResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
        delete:
            summary: DeleteCluster removes a cluster and its agents. Their leases end at once.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteCluster
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteClusterResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/clusters/{cluster_id}/trust:
        post:
            summary: |-
                SetClusterTrust replaces how a cluster is trusted: an issuer URL, or keys.
                It is how a person rotates the keys of a cluster whose key was replaced
                outright.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_SetClusterTrust
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetClusterTrustResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPISetClusterTrustBody'
            tags:
                - AgentAPI
    /v1/components:
        get:
            summary: ListComponents pages through the registry.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_ListComponents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListComponentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by name.
                      - `description`: filter by description.
                      - `labels`: filter by label key/value.

                    Example: `field['labels']['team'] = 'payments'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of components to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - RegistryAPI
    /v1/components/publish:
        post:
            summary: |-
                PublishComponent uploads a bundle and records it as a revision, creating
                the component on first use.
            description: |-
                The bundle is a gzipped tar of the component root, carried inline and
                capped at 64 MiB; a fully vendored tree that exceeds it will get a
                resumable upload path of its own. The server normalizes the bytes
                (strips `.git`, canonicalizes entry order and timestamps), digests them,
                runs the publish gate, stores the blob and answers with the revision. If
                the digest already exists under the name, the existing revision is
                returned with `unchanged` set and nothing is written, which is what makes
                a publish-everything CI recipe safe.

                Any tags named in the request are set on the resulting revision.
                Repointing a semver tag is refused with FAILED_PRECONDITION and the whole
                publish fails; the bytes are not kept.

                Scope: `component:publish`
            operationId: RegistryAPI_PublishComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1PublishComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: PublishComponentRequest carries what is being published and the bytes.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1PublishComponentRequest'
            tags:
                - RegistryAPI
    /v1/components/pull:
        post:
            summary: |-
                PullComponent publishes an artifact the tenant does not own: a chart in
                an HTTP repository or an OCI registry, a module in a module registry, a
                git repository at a ref, an archive. Admiral fetches it with the
                credentials named, closes it over what it reaches, scans it, and
                records the revision with provenance saying where it came from. The
                bytes are a copy: upstream may move the tag and the revision does not.
                The same resolution under the same name is the same revision, returned
                with `unchanged` set.
            description: 'Scope: `component:publish`'
            operationId: RegistryAPI_PullComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1PullComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1PullComponentRequest'
            tags:
                - RegistryAPI
    /v1/components/{component_id}:
        delete:
            summary: |-
                DeleteComponent retires a name from the registry. Its revisions are kept
                and anything already pinned to them keeps running; the name no longer
                resolves and cannot be published to. FAILED_PRECONDITION while any
                environment pins one of its revisions.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_DeleteComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
            tags:
                - RegistryAPI
        patch:
            summary: |-
                UpdateComponent changes a component's description or labels. The name is
                immutable: references carry it, and a rename would strand them.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_UpdateComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPIUpdateComponentBody'
            tags:
                - RegistryAPI
    /v1/components/{component_id}/revisions:
        get:
            summary: ListRevisions pages through a component's revisions, newest first.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_ListRevisions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/apiRegistryV1ListRevisionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression. Filterable fields:
                      - `kind`: TERRAFORM, HELM, MANIFESTS.
                      - `status`: PUBLISHED, DEPRECATED, REVOKED.

                    Example: `field['status'] = 'PUBLISHED'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - RegistryAPI
    /v1/components/{component_id}/revisions/{digest}/set-status:
        post:
            summary: |-
                SetRevisionStatus moves a revision between PUBLISHED, DEPRECATED and
                REVOKED, recording why. Any move is allowed, including back to PUBLISHED.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_SetRevisionStatus
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetRevisionStatusResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: digest
                  description: |-
                    `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                    a floating tag might name different bytes by the time anyone reads the
                    reason.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPISetRevisionStatusBody'
            tags:
                - RegistryAPI
    /v1/components/{component_id}/revisions/{reference}:
        get:
            summary: |-
                GetRevision retrieves one revision by reference: a tag name or a
                `sha256:` digest.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_GetRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/apiRegistryV1GetRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: reference
                  description: |-
                    A tag name (`v1.2.0`, `latest`) or a digest (`sha256:<hex>`). A digest
                    is recognised by its prefix; everything else is looked up as a tag.
                  in: path
                  required: true
                  type: string
            tags:
                - RegistryAPI
    /v1/components/{component_id}/tags/{name}:
        delete:
            summary: |-
                DeleteTag removes a floating tag. A semver tag is refused with
                FAILED_PRECONDITION: it is immutable in both directions.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_DeleteTag
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteTagResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: name
                  in: path
                  required: true
                  type: string
            tags:
                - RegistryAPI
        put:
            summary: |-
                SetTag points a tag at a revision, creating it or moving it. A semver tag
                may be created and never moved: FAILED_PRECONDITION on an attempt to
                repoint one, with the rule in the message. Setting a tag to the revision
                it already names succeeds and changes nothing.
            description: 'Scope: `component:publish`'
            operationId: RegistryAPI_SetTag
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetTagResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: name
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPISetTagBody'
            tags:
                - RegistryAPI
    /v1/components/{name}:
        get:
            summary: GetComponent retrieves a component by name, with its tags.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_GetComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: name
                  description: '`cloud-sql`, or `namespace/cloud-sql`.'
                  in: path
                  required: true
                  type: string
                  pattern: .+
            tags:
                - RegistryAPI
    /v1/credentials:
        get:
            summary: |-
                ListCredentials pages through the caller's tenant's credentials.
                Secrets are never included.
            description: 'Scope: `credential:read`'
            operationId: CredentialAPI_ListCredentials
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListCredentialsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: Reserved for a filter expression; nothing reads it yet.
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
                - name: type
                  description: |-
                    Only credentials of this type, when set.

                     - CREDENTIAL_TYPE_SSH_KEY: An SSH private key, for git over ssh.
                     - CREDENTIAL_TYPE_BASIC_AUTH: A username and password: git over https, a Helm repository, an OCI
                    registry, an authenticated archive.
                     - CREDENTIAL_TYPE_BEARER_TOKEN: One token. Presented as `Authorization: Bearer` to a module registry,
                    a Helm repository, an OCI registry or an archive host, and as the
                    basic-auth password with the `x-access-token` username to git over
                    https, which is how GitHub and GitLab take a token.
                     - CREDENTIAL_TYPE_GITHUB_APP: A GitHub App installation. Not a secret that is presented: the platform
                    mints a short-lived installation token from the app's private key at
                    fetch time and presents that as a bearer token. Works for github.com,
                    GitHub Enterprise Cloud and GitHub Enterprise Server.
                  in: query
                  required: false
                  type: string
                  enum:
                    - CREDENTIAL_TYPE_UNSPECIFIED
                    - CREDENTIAL_TYPE_SSH_KEY
                    - CREDENTIAL_TYPE_BASIC_AUTH
                    - CREDENTIAL_TYPE_BEARER_TOKEN
                    - CREDENTIAL_TYPE_GITHUB_APP
                  default: CREDENTIAL_TYPE_UNSPECIFIED
            tags:
                - CredentialAPI
        post:
            summary: CreateCredential registers a credential within the caller's tenant.
            description: |-
                The `type` and the populated `auth_config` variant must agree.

                Scope: `credential:write`
            operationId: CredentialAPI_CreateCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateCredentialRequest'
            tags:
                - CredentialAPI
    /v1/credentials/{credential.id}:
        patch:
            summary: |-
                UpdateCredential changes a credential's description, labels, allowed
                hosts, or secret. The name and type are immutable. A new secret
                replaces the old one whole; a rotation is an update with `auth_config`
                in the mask.
            description: 'Scope: `credential:write`'
            operationId: CredentialAPI_UpdateCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: credential.id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CredentialAPIUpdateCredentialBody'
            tags:
                - CredentialAPI
    /v1/credentials/{credential_id}:
        get:
            summary: |-
                GetCredential retrieves a credential's metadata by id. The secret is
                never included.
            description: 'Scope: `credential:read`'
            operationId: CredentialAPI_GetCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: credential_id
                  in: path
                  required: true
                  type: string
            tags:
                - CredentialAPI
        delete:
            summary: |-
                DeleteCredential removes a credential. A component whose pull-publish
                names it keeps the reference; its next pull fails naming the missing
                credential until it is attached to another.
            description: 'Scope: `credential:write`'
            operationId: CredentialAPI_DeleteCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: credential_id
                  in: path
                  required: true
                  type: string
            tags:
                - CredentialAPI
    /v1/environments:
        get:
            summary: |-
                ListEnvironments returns a paginated list of environments. Use the filter
                to scope by application or labels.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_ListEnvironments
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `application_id`: filter by parent application (UUID).
                      - `name`: filter by environment name.
                      - `labels.key`: filter by label key.

                    Example: `field['application_id'] = '<uuid>' AND field['name'] = 'prod'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of environments to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - EnvironmentAPI
        post:
            summary: CreateEnvironment creates a new environment for the specified application.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_CreateEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateEnvironmentRequest contains the parameters for creating a new environment.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateEnvironmentRequest'
            tags:
                - EnvironmentAPI
    /v1/environments/{environment.id}:
        patch:
            summary: |-
                UpdateEnvironment updates an environment's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_UpdateEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment.id
                  description: Unique identifier for the environment (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/EnvironmentAPIUpdateEnvironmentBody'
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}:
        get:
            summary: GetEnvironment retrieves an environment by ID.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_GetEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The unique identifier of the environment (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - EnvironmentAPI
        delete:
            summary: |-
                DeleteEnvironment permanently deletes an environment. Fails with
                FAILED_PRECONDITION if the environment has any runs. Pass force = true
                to cascade-delete all run records (metadata only; no cloud resources
                are destroyed). This action cannot be undone.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_DeleteEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The unique identifier of the environment to delete (UUID).
                  in: path
                  required: true
                  type: string
                - name: force
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                    run records (metadata only).
                  in: query
                  required: false
                  type: boolean
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}/components:
        get:
            summary: |-
                ListEnvironmentComponents returns the components currently deployed to
                a single environment, with each component's last-succeeded revision
                surfaced as a denormalized status block. Use this to render an
                at-a-glance "what's running here?" view without separate calls per
                component.
            description: |-
                Components without a SUCCEEDED revision (e.g. CREATE entries that
                failed mid-plan) still appear, with `last_revision_status` and
                `last_deployed_at` empty.

                Scope: `env:read`
            operationId: EnvironmentAPI_ListEnvironmentComponents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentComponentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The environment whose components should be listed (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}/variables:
        get:
            summary: |-
                ListEnvironmentVariables returns a paginated list of variables scoped
                to a single environment. Variables are mutated exclusively through
                change sets (ChangeSetAPI.SetVariable / RemoveVariable); this endpoint
                is read-only.
            description: |-
                Sensitive variable values are masked in the response.

                Scope: `var:read`
            operationId: EnvironmentAPI_ListEnvironmentVariables
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentVariablesResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The environment whose variables should be listed (UUID).
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `key`: filter by variable key (supports prefix matching via ~=).
                      - `sensitive`: filter by sensitivity flag.
                      - `type`: filter by variable type (STRING, NUMBER, BOOLEAN, COMPLEX).
                      - `source`: filter by source (USER, INFRASTRUCTURE).

                    Example: `field['source'] = 'USER' AND field['sensitive'] = false`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of variables to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - EnvironmentAPI
    /v1/invitations:
        get:
            summary: |-
                ListInvitations returns a page of the caller's tenant's invitations, every
                status included, so an administrator can see what is outstanding, what
                expired and what was withdrawn.
            description: 'Scope: `user:read`'
            operationId: InvitationAPI_ListInvitations
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListInvitationsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `email`: filter by address.
                      - `status`: filter by lifecycle status.

                    Example: `field['status'] = 'PENDING'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of invitations to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - InvitationAPI
        post:
            summary: |-
                CreateInvitation invites an address into the caller's tenant for a role and
                sends the mail. Returns the invitation; the link is only ever in the mail.
            description: |-
                A live invitation for the same address is retired and replaced, so a retry
                or a "send it again" is this same call. ALREADY_EXISTS when the address is
                already a member. INVALID_ARGUMENT for a role that cannot be granted by
                invitation: OWNER moves by transfer, and APP_CREATOR is a capability
                rather than a role.

                Scope: `user:write`
            operationId: InvitationAPI_CreateInvitation
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateInvitationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateInvitationRequest invites one address into the caller's tenant.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateInvitationRequest'
            tags:
                - InvitationAPI
    /v1/invitations/{invitation_id}/revoke:
        post:
            summary: |-
                RevokeInvitation withdraws a PENDING invitation; the link in the mail stops
                working at once. Idempotent: revoking one already revoked succeeds and
                changes nothing. FAILED_PRECONDITION when it was already accepted: there is
                a member now, and that is a different act.
            description: 'Scope: `user:write`'
            operationId: InvitationAPI_RevokeInvitation
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeInvitationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: invitation_id
                  description: The invitation (UUID), from CreateInvitation or ListInvitations.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/InvitationAPIRevokeInvitationBody'
            tags:
                - InvitationAPI
    /v1/jobs:
        get:
            summary: ListJobs lists jobs for an agent or an environment, newest first.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListJobs
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListJobsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  in: query
                  required: false
                  type: string
                - name: environment_id
                  in: query
                  required: false
                  type: string
                - name: status
                  description: |-
                    UNSPECIFIED lists every status.

                     - OFFERED: Offered to an agent, not yet started.
                  in: query
                  required: false
                  type: string
                  enum:
                    - JOB_STATUS_UNSPECIFIED
                    - QUEUED
                    - OFFERED
                    - RUNNING
                    - SUCCEEDED
                    - FAILED
                    - CANCELLED
                  default: JOB_STATUS_UNSPECIFIED
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
    /v1/jobs/{job_id}:
        get:
            summary: GetJob returns a job, with why it is waiting when it is.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetJob
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetJobResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: job_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/jobs/{job_id}/cancel:
        post:
            summary: |-
                CancelJob asks for a job to stop. A queued job is cancelled at once; a
                running one learns it on its next lease renewal.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CancelJob
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CancelJobResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: job_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPICancelJobBody'
            tags:
                - AgentAPI
    /v1/runs:
        get:
            summary: ListRuns returns a paginated list of runs.
            description: |-
                Common filter fields: `application_id`, `environment_id`, `status`.
                Use to view run history for an environment.

                Scope: `run:read`
            operationId: RunAPI_ListRuns
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListRunsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `application_id`: runs for a specific application (UUID).
                      - `environment_id`: runs to a specific environment (UUID).
                      - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                      - `change_set_id`: runs for a specific change set (UUID).

                    Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of runs to return per page. Defaults to 50 when omitted or
                    0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - RunAPI
        post:
            summary: CreateRun triggers a new run for an application+environment.
            description: |-
                The server resolves all components (with environment overrides applied),
                builds the dependency DAG, and begins rendering and executing revisions.

                Concurrency: only one run can be active per application+environment
                at a time. If a run is already in an active state (PENDING, QUEUED,
                PLANNING, PLANNED, or APPLYING), the new run is queued and will start
                automatically when the current run completes or is canceled.

                Scope: `run:write`
            operationId: RunAPI_CreateRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateRunRequest triggers a new run.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateRunRequest'
            tags:
                - RunAPI
    /v1/runs/{run_id}:
        get:
            summary: |-
                GetRun retrieves a run by ID, including its composite status derived
                from all component revisions.
            description: 'Scope: `run:read`'
            operationId: RunAPI_GetRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run. Either a UUID or a `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/apply:
        post:
            summary: |-
                ApplyRun transitions a run from plan phase to apply phase. Revisions
                currently in PLANNED status get an APPLY job dispatched to their
                assigned TERRAFORM agent. This is the single authorization gate per changeset;
                downstream layers auto-continue plan->apply without re-prompting.
            description: 'Scope: `run:write`'
            operationId: RunAPI_ApplyRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ApplyRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run to apply. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIApplyRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/cancel:
        post:
            summary: |-
                CancelRun cancels an in-progress run. Stops pending and queued
                revisions from proceeding and prevents the queue from advancing; the run
                status becomes CANCELED. APPLYING runs cannot be canceled because
                terraform/apply cannot be interrupted mid-execution; the call is
                rejected with FAILED_PRECONDITION. Wait for the in-flight phase to
                complete before cancellation. Revisions already SUCCEEDED remain
                applied.
            description: 'Scope: `run:write`'
            operationId: RunAPI_CancelRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CancelRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run to cancel. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPICancelRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/revisions:
        get:
            summary: ListRevisions returns all component revisions for a run.
            description: 'Scope: `run:read`'
            operationId: RunAPI_ListRevisions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/apiRunV1ListRevisionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of revisions to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/revisions/{revision_id}:
        get:
            summary: GetRevision retrieves a single component revision within a run.
            description: 'Scope: `run:read`'
            operationId: RunAPI_GetRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/apiRunV1GetRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: The run. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: revision_id
                  description: The revision (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/revisions/{revision_id}/retry:
        post:
            summary: |-
                RetryRevision retries a failed component revision. A new execution
                attempt is made using the same rendered artifacts. The retry count
                is incremented. Only applicable to revisions in FAILED status.
            description: 'Scope: `run:write`'
            operationId: RunAPI_RetryRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RetryRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: The run. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: revision_id
                  description: The revision to retry (UUID). Must be in FAILED status.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIRetryRevisionBody'
            tags:
                - RunAPI
    /v1/tenant:
        get:
            summary: GetTenant returns the caller's own tenant.
            description: 'Scope: `tenant:read`'
            operationId: TenantAPI_GetTenant
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetTenantResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            tags:
                - TenantAPI
        patch:
            summary: UpdateTenant updates the caller's own tenant's mutable settings.
            description: |-
                Only `display_name` and `labels` are mutable. `slug` is part of the
                account's identity and `status` is set by lifecycle operations, neither of
                which a tenant performs on itself.

                Scope: `tenant:write`
            operationId: TenantAPI_UpdateTenant
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateTenantResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: |-
                    UpdateTenantRequest carries only the mutable fields. The tenant is the
                    caller's own, so there is no id here.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1UpdateTenantRequest'
            tags:
                - TenantAPI
    /v1/user/me:
        get:
            summary: |-
                GetMe retrieves the profile of the currently authenticated user.
                The user is identified by the authentication token provided in the request.
            description: 'Scope: any authenticated key (no specific scope required).'
            operationId: UserAPI_GetMe
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetMeResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            tags:
                - UserAPI
    /v1/user/tokens:
        get:
            summary: |-
                ListApiKeys returns a paginated list of the authenticated user's own API
                keys. Secrets are never included.
            description: 'Scope: `token:read`'
            operationId: UserAPI_ListApiKeys
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListApiKeysResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by key name.
                      - `status`: filter by key status (ACTIVE, REVOKED).

                    Example: `field['status'] = 'ACTIVE'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of keys to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - UserAPI
        post:
            summary: |-
                CreateApiKey creates a new API key for the authenticated user.
                The response includes the raw secret, which is shown exactly once
                and cannot be retrieved again.
            description: 'Scope: `token:write`'
            operationId: UserAPI_CreateApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateApiKeyRequest contains the parameters for creating a new API key.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateApiKeyRequest'
            tags:
                - UserAPI
    /v1/user/tokens/{token_id}:
        get:
            summary: |-
                GetApiKey retrieves a single API key by ID.
                Returns metadata only. The key secret is never included.
            description: 'Scope: `token:read`'
            operationId: UserAPI_GetApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the key (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - UserAPI
        patch:
            summary: |-
                UpdateApiKey updates an API key's mutable fields (name, scopes).
                Only active keys can be updated. The secret and expiration are
                immutable after creation.
            description: 'Scope: `token:write`'
            operationId: UserAPI_UpdateApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the key to update (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/UserAPIUpdateApiKeyBody'
            tags:
                - UserAPI
    /v1/user/tokens/{token_id}/revoke:
        post:
            summary: |-
                RevokeApiKey permanently revokes an API key. The key becomes
                immediately unusable and cannot be restored.
            description: 'Scope: `token:write`'
            operationId: UserAPI_RevokeApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the key to revoke (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/UserAPIRevokeApiKeyBody'
            tags:
                - UserAPI
    /v1/users:
        get:
            summary: |-
                ListUsers returns a page of the caller's tenant's members: everyone who
                has joined, whatever their role or status. People who have been invited but
                have not joined are not users yet; they are listed by InvitationAPI.
            description: 'Scope: `user:read`'
            operationId: UserAPI_ListUsers
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListUsersResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `email`: filter by address.
                      - `status`: filter by status.

                    Example: `field['status'] = 'ACTIVE'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of users to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - UserAPI
    /v1/users/{user_id}:
        get:
            summary: GetUser retrieves a user's profile by ID.
            description: 'Scope: `user:read`'
            operationId: UserAPI_GetUser
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetUserResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: user_id
                  description: The unique identifier of the user (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - UserAPI
    /api/v1/state/{component_id}/env/{environment_id}:
        parameters:
            - name: component_id
              in: path
              required: true
              description: The infrastructure component (UUID).
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              description: The environment the state is scoped to (UUID).
              schema:
                type: string
                format: uuid
        get:
            tags:
                - State Backend
            summary: Fetch current Terraform state
            description: >-
                Returns the current `.tfstate` document for the component+environment, or 204 when no state exists yet. Maps to the Terraform HTTP backend GET. Authenticate with a PAT/SAT (HTTP Basic password or Bearer token); requires the `state:read` scope.
            responses:
                "200":
                    description: The current Terraform state document.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                "204":
                    description: No state exists yet.
                "401":
                    description: Unauthorized.
                "404":
                    description: Component or environment not found.
        post:
            tags:
                - State Backend
            summary: Push Terraform state
            description: >-
                Stores a new state version; the body is the full `.tfstate` document. Maps to the Terraform HTTP backend POST. Authenticate with a PAT/SAT; requires the `state:write` scope.
            parameters:
                - name: ID
                  in: query
                  required: false
                  description: The held lock ID, when the state is locked.
                  schema:
                    type: string
                    format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true
            responses:
                "200":
                    description: State stored.
                "400":
                    description: Invalid state document.
                "413":
                    description: State document too large.
                "423":
                    description: State is locked by a different lock ID.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StateLockInfo"
    /api/v1/state/{component_id}/env/{environment_id}/lock:
        description: >-
            Locks and unlocks the component+environment state using Terraform's custom `LOCK` and `UNLOCK` HTTP methods (which OpenAPI cannot express as operations) with a `StateLockInfo` body. Returns 200 on success or 423 (with the currently-held `StateLockInfo`) on conflict. Authenticate with a PAT/SAT; requires the `state:write` scope.
        parameters:
            - name: component_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
definitions:
    AgentAPICancelJobBody:
        type: object
    AgentAPICreateEnrollmentKeyBody:
        type: object
    AgentAPIGrantAgentUseBody:
        type: object
        properties:
            grant:
                $ref: '#/definitions/v1AgentGrant'
        required:
            - grant
    AgentAPIRevokeAgentUseBody:
        type: object
        properties:
            grant:
                $ref: '#/definitions/v1AgentGrant'
        required:
            - grant
    AgentAPISetClusterTrustBody:
        type: object
        properties:
            trust:
                $ref: '#/definitions/v1ClusterTrust'
        required:
            - trust
    AgentAPIUpdateAgentBody:
        type: object
        properties:
            name:
                type: string
            ceiling:
                $ref: '#/definitions/v1AgentCeiling'
                description: Replaces the ceiling when set.
    ApplicationAPIUpdateApplicationBody:
        type: object
        properties:
            application:
                type: object
                properties:
                    name:
                        type: string
                        description: |-
                            URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                            the tenant. Lowercase alphanumeric and hyphens only, must start with a
                            letter and end with an alphanumeric character (1-63 chars).
                    description:
                        type: string
                        description: |-
                            Optional longer-form description of the application's purpose
                            (e.g., "Core inventory service tracking warehouse stock and fulfillment").
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                        description: |-
                            Arbitrary key-value labels for organizing and filtering applications
                            (e.g., `{"team": "logistics", "tier": "critical"}`).
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        description: The user or agent who created this application (server-populated from token).
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        description: When the application was created.
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        description: When the application was last updated.
                        readOnly: true
                description: |-
                    The application with updated fields. Its `id` identifies the application;
                    only fields named in `update_mask` are applied.
            update_mask:
                type: string
                description: |-
                    The set of fields to update. Optional; if omitted, all populated fields
                    are updated. Pass `*` for full replacement. Supported fields: `name`,
                    `description`, `labels`.
        description: UpdateApplicationRequest contains the application fields to update.
        required:
            - application
    ChangeSetAPIDiscardChangeSetBody:
        type: object
    ChangeSetAPIEditChangeSetBody:
        type: object
        properties:
            if_revision:
                type: integer
                format: int32
                description: When set, refused unless the head is this revision.
            edits:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Edit'
            plan:
                type: boolean
                description: Ask for a plan of the revision this cuts, as PlanChangeSet does.
    ChangeSetAPIPlanChangeSetBody:
        type: object
        properties:
            if_revision:
                type: integer
                format: int32
                description: When set, refused unless the head is this revision.
    CredentialAPIUpdateCredentialBody:
        type: object
        properties:
            credential:
                type: object
                properties:
                    name:
                        type: string
                        description: Unique within the tenant.
                    description:
                        type: string
                    type:
                        $ref: '#/definitions/v1CredentialType'
                        description: Immutable after creation.
                    auth_config:
                        $ref: '#/definitions/v1AuthConfig'
                        description: Write-only. Empty in every response.
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        readOnly: true
                    allowed_hosts:
                        type: array
                        items:
                            type: string
                        description: |-
                            Hosts this credential may be presented to, as a guard: empty means any
                            host its type fits; set means the platform refuses to present it
                            anywhere else, whatever it is attached to. Hostnames, optionally with
                            a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                            no path.
                description: |-
                    Credential is a registered credential's metadata. The secret is set
                    through `auth_config` and never read back; responses carry it empty.
            update_mask:
                type: string
                description: |-
                    Paths from `description`, `labels`, `allowed_hosts`, `auth_config`.
                    Empty means every updatable field the message carries.
        required:
            - credential
    EnvironmentAPIUpdateEnvironmentBody:
        type: object
        properties:
            environment:
                type: object
                properties:
                    application_id:
                        type: string
                        description: The application this environment belongs to (UUID).
                        readOnly: true
                    name:
                        type: string
                        description: |-
                            URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                            Unique within the application. Lowercase alphanumeric and hyphens only,
                            must start with a letter and end with an alphanumeric character (1-63 chars).
                    description:
                        type: string
                        description: |-
                            Optional longer-form description of the environment's purpose
                            (e.g., "US East production serving live traffic" or
                            "Shared staging for QA validation before prod promotion").
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                        description: |-
                            Arbitrary key-value labels for organizing and filtering environments
                            (e.g., `{"region": "us-east-1", "tier": "production"}`).
                    has_pending_changes:
                        type: boolean
                        description: |-
                            Whether the environment has configuration changes that have not yet been
                            deployed. Server-derived by comparing current resolved config (variables,
                            component settings, overrides, source versions) against the last
                            successful run's snapshot. False if no successful run exists yet (a
                            fresh environment with no runs returns false; use `last_deployed_at`
                            to distinguish "clean" from "never deployed").
                        readOnly: true
                    last_deployed_at:
                        type: string
                        format: date-time
                        description: |-
                            When the last successful run for this environment completed. Absent if
                            no successful run has occurred yet.
                        readOnly: true
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        description: The user or agent who created this environment (server-populated from token).
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        description: When the environment was created.
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        description: When the environment was last updated.
                        readOnly: true
                    kubernetes:
                        $ref: '#/definitions/v1KubernetesTarget'
                        description: Where workload components go. Omitted fields keep their defaults.
                description: |-
                    The environment with updated fields.
                    Only fields specified in `update_mask` are updated.
            update_mask:
                type: string
                description: |-
                    The set of fields to update. Optional; if omitted, all populated fields
                    are updated. Pass `*` for full replacement. Supported fields: `name`,
                    `description`, `labels`, `kubernetes.namespace`,
                    `kubernetes.create_namespaces`, `kubernetes.agent_id`.
        description: UpdateEnvironmentRequest contains the environment fields to update.
        required:
            - environment
    InvitationAPIRevokeInvitationBody:
        type: object
        description: RevokeInvitationRequest names one invitation in the caller's tenant.
    PullSourceArchive:
        type: object
        properties:
            url:
                type: string
        description: An archive at a URL, unpacked by its extension.
        required:
            - url
    PullSourceGitTree:
        type: object
        properties:
            url:
                type: string
                description: '`https://github.com/acme/infra.git`, `ssh://git@github.com/acme/infra.git`.'
            ref:
                type: string
                description: A branch, tag or commit. Empty is the default branch.
            path:
                type: string
                description: A directory within the repository. Empty is the root.
        description: A git repository at a ref, optionally a directory of it.
        required:
            - url
    PullSourceHelmChart:
        type: object
        properties:
            repository:
                type: string
            chart:
                type: string

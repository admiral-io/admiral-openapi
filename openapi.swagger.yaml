                description: A JSON object.
            sources:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ValueSource'
                description: With `effective`, where each leaf came from; empty otherwise.
            last_apply:
                $ref: '#/definitions/v1LastApply'
                description: The apply that last changed it.
        description: GetEnvironmentComponentValuesResponse is the component's values tree.
    v1GetEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The retrieved environment.
        description: GetEnvironmentResponse contains the environment record.
    v1GetJobArtifactResponse:

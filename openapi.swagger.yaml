            change_set:
                $ref: '#/definitions/v1ChangeSet'
    v1Edit:
        type: object
        properties:
            add_component:
                $ref: '#/definitions/v1AddComponent'
            set_value:
                $ref: '#/definitions/v1SetValue'
            set_null:
                $ref: '#/definitions/v1SetNull'
            unset_value:
                $ref: '#/definitions/v1UnsetValue'
            set_pin:
                $ref: '#/definitions/v1SetPin'
            replace_values:
                $ref: '#/definitions/v1ReplaceValues'
            remove_component:
                $ref: '#/definitions/v1RemoveComponent'
            set_placement:
                $ref: '#/definitions/v1SetPlacement'
        description: |-
            Edit is one change a request makes. A request's edits apply in order and
            become one revision.
    v1EditChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
            revision:
                $ref: '#/definitions/apiChangesetV1Revision'
            warnings:
                type: array
                items:
                    type: string
            prepare:
                $ref: '#/definitions/v1Prepare'
                description: Set when `plan` was asked for.
    v1EnrollRequest:
        type: object
        properties:
            jwks_json:
                type: string
                description: The cluster's keys, as served at /openid/v1/jwks.
            service_account_token:
                type: string
                description: |-
                    A token the cluster issued this agent, audience Admiral. It must verify
                    against `jwks_json` and name the agent's namespace and service account.
            cluster_uid:
                type: string
                description: 'The kube-system namespace UID: an accident detector, not a proof.'
    v1EnrollResponse:
        type: object
        properties:
            cluster:
                $ref: '#/definitions/v1Cluster'
            agent:
                $ref: '#/definitions/v1Agent'
    v1EnrollmentKey:
        type: object
        properties:
            key:
                type: string
            expires_at:
                type: string
                format: date-time
    v1Entry:
        type: object
        properties:
            component_id:
                type: string
            component:
                type: string
            action:
                $ref: '#/definitions/v1EntryAction'
            pin:
                $ref: '#/definitions/apiChangesetV1Pin'
                description: |-
                    The revision the component is pinned to after this change set: set on
                    CREATE and when the pin moves.
            base_digest:
                type: string
                description: Empty on CREATE.
            result_digest:
                type: string
                description: Empty on DESTROY.
            ops:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ValueOp'
            placement:
                $ref: '#/definitions/v1Placement'
                description: Where the component goes after this change set. Empty on DESTROY.
        description: Entry is what one revision does to one component.
    v1EntryAction:
        type: string
        enum:
            - ENTRY_ACTION_UNSPECIFIED
            - CREATE
            - UPDATE
            - DESTROY
        default: ENTRY_ACTION_UNSPECIFIED
    v1Environment:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the environment (UUID).
                readOnly: true
            application_id:
                type: string
                description: The application this environment belongs to (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                    Unique within the application. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the environment's purpose
                    (e.g., "US East production serving live traffic" or
                    "Shared staging for QA validation before prod promotion").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering environments
                    (e.g., `{"region": "us-east-1", "tier": "production"}`).
            has_pending_changes:
                type: boolean
                description: |-
                    Whether the environment has configuration changes that have not yet been
                    deployed. Server-derived by comparing current resolved config (variables,
                    component settings, overrides, source versions) against the last
                    successful run's snapshot. False if no successful run exists yet (a
                    fresh environment with no runs returns false; use `last_deployed_at`
                    to distinguish "clean" from "never deployed").
                readOnly: true
            last_deployed_at:
                type: string
                format: date-time
                description: |-
                    When the last successful run for this environment completed. Absent if
                    no successful run has occurred yet.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this environment (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the environment was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the environment was last updated.
                readOnly: true
            kubernetes:
                $ref: '#/definitions/v1KubernetesTarget'
                description: Where workload components go. Omitted fields keep their defaults.
        description: |-
            Environment represents a named deployment target for an application
            (e.g., dev, staging, prod). Each environment carries its own configuration
            and variables; promotion between environments is explicit.
    v1EnvironmentComponent:
        type: object
        properties:
            name:
                type: string
                description: Component name (stable identifier set at creation).
            kind:
                $ref: '#/definitions/apiRegistryV1ComponentKind'
                description: |-
                    What the component's pinned revision is (TERRAFORM, HELM, MANIFESTS),
                    denormalized from the registry.
            ref:
                type: string
                description: The git ref / version selector the component deploys.
            last_revision_id:
                type: string
                description: |-
                    ID of the last-succeeded revision for this component in this env, if
                    any (UUID). Empty when the component has never reached SUCCEEDED.
            last_revision_status:
                $ref: '#/definitions/apiRunV1RevisionStatus'
                description: |-
                    Status of the last revision (SUCCEEDED when populated). UNSPECIFIED
                    means the component has no last-succeeded revision yet.
            last_deployed_at:
                type: string
                format: date-time
                description: When the last-succeeded revision completed.
        description: |-
            EnvironmentComponent is a denormalized view of a deployed component for
            `ListEnvironmentComponents`. It joins the component's HEAD with the
            component's last-succeeded revision so the CLI can render an at-a-glance
            status row without follow-up calls.
    v1FindingCode:
        type: string
        enum:
            - FINDING_CODE_UNSPECIFIED
            - LOOKUP_USED
            - NONDETERMINISTIC
            - NO_CAPABILITIES
            - SCOPE_GUESSED
        default: FINDING_CODE_UNSPECIFIED
        description: |-
            FindingCode names something a prepare noticed but did not refuse.

             - LOOKUP_USED: The chart calls `lookup`, which sees no cluster at prepare and returns
            nothing.
             - NONDETERMINISTIC: Two renders of identical inputs differ; the details name each object
            and field.
             - NO_CAPABILITIES: No cluster capabilities were reported; resources a chart includes
            conditionally may be missing.
             - SCOPE_GUESSED: A kind with no namespace was not known to be namespaced or cluster
            scoped; it was given the namespace.
    v1FindingSeverity:
        type: string
        enum:
            - FINDING_SEVERITY_UNSPECIFIED
            - INFO
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        default: FINDING_SEVERITY_UNSPECIFIED
        description: FindingSeverity ranks what the publish gate found.

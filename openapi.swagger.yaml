    v1Module:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the module (UUID).
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "billing-vpc", "rds-standard").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the module's purpose
                    (e.g., "Standard VPC module for billing workloads").
            type:
                $ref: '#/definitions/v1ModuleType'
                description: The content type -- what this module contains and how it should be executed.
            source_id:
                type: string
                description: Reference to the Source this module fetches from (UUID).
            ref:
                type: string
                description: |-
                    Git ref, registry version, chart version, or OCI tag to fetch.
                    Optional -- when empty, the backend uses its default (e.g., HEAD for Git,
                    latest for registries). This is an overridable default: Components can
                    override the ref at deploy time.
            root:
                type: string
                description: |-
                    Subdirectory within the fetched tree to treat as the module root.
                    Optional -- when empty, the entire fetched tree is the module root.
                    Example: "modules/vpc" within a monorepo.
            path:
                type: string
                description: |-
                    Working directory within root for execution (e.g., "environments/prod").
                    Optional -- when empty, defaults to root itself.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering modules
                    (e.g., `{"team": "platform", "stack": "networking"}`).
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this module (server-populated from token).
            created_at:
                type: string
                format: date-time
                description: When the module was created.
            updated_at:
                type: string
                format: date-time
                description: When the module was last updated.
        description: |-
            Module represents a named reference to a slice of content within a Source at
            a specific ref. One Source can back many Modules (different refs, different
            subtrees, different working directories).

            The module type identifies what the content is (Terraform, Helm, Kustomize,
            raw manifests) independently of how it is fetched (the Source type). This
            separation allows a single Git source to back Terraform, Helm, and manifest
            modules in different subdirectories.
    v1ModuleType:
        type: string
        enum:
            - MODULE_TYPE_UNSPECIFIED
            - MODULE_TYPE_TERRAFORM
            - MODULE_TYPE_HELM
            - MODULE_TYPE_KUSTOMIZE
            - MODULE_TYPE_MANIFEST
        default: MODULE_TYPE_UNSPECIFIED
        description: |-
            ModuleType identifies the content semantics -- what the fetched content is and
            how it should be executed. This is orthogonal to SourceType, which identifies
            the fetch protocol. A single GIT source can back TERRAFORM, HELM, KUSTOMIZE,
            and MANIFEST modules in different subdirectories.

             - MODULE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - MODULE_TYPE_TERRAFORM: Terraform root module. Contains main.tf, variables.tf, etc. Executed via
            `terraform init/plan/apply`. Works with GIT, TERRAFORM, and HTTP sources.
             - MODULE_TYPE_HELM: Helm chart. Contains Chart.yaml, values.yaml, templates/. Rendered via
            `helm template` or installed via `helm install`. Works with GIT, HELM,
            OCI, and HTTP sources.
             - MODULE_TYPE_KUSTOMIZE: Kustomize overlay. Contains kustomization.yaml. Rendered via
            `kustomize build`. Works with GIT and HTTP sources.
             - MODULE_TYPE_MANIFEST: Raw Kubernetes manifests. Applied directly via `kubectl apply`. Works with
            GIT and HTTP sources.
    v1ObjectReference:
        type: object
        properties:
            kind:
                type: string
                description: Kubernetes resource kind (e.g., "Pod", "ReplicaSet").
            namespace:
                type: string
                description: Kubernetes namespace.
            name:
                type: string
                description: Object name.
        description: ObjectReference is a lightweight reference to a Kubernetes object.
    v1PushStateResponse:

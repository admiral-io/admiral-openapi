                    $ref: '#/definitions/v1ApiKey'
                description: The list of keys. Secrets are never included.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListApiKeysResponse contains a page of API key metadata.
    v1ListApplicationsResponse:
        type: object
        properties:
            applications:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Application'
                description: The list of applications.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListApplicationsResponse contains a page of applications.
    v1ListChangeSetsResponse:
        type: object
        properties:
            change_sets:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ChangeSet'
            next_page_token:
                type: string
    v1ListClustersResponse:
        type: object
        properties:
            clusters:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Cluster'
            next_page_token:
                type: string
    v1ListComponentsResponse:
        type: object
        properties:
            components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiRegistryV1Component'
                description: Listed without their tags; GetComponent carries those.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListComponentsResponse contains a page of components.
    v1ListCredentialsResponse:
        type: object
        properties:
            credentials:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Credential'
            next_page_token:
                type: string
    v1ListEnvironmentComponentsResponse:
        type: object
        properties:
            components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1EnvironmentComponent'
                description: |-
                    Active (not soft-deleted) components attached to the environment, sorted
                    by name.
        description: |-
            ListEnvironmentComponentsResponse returns every active component for the
            environment, ordered by name.
    v1ListEnvironmentVariablesResponse:
        type: object
        properties:
            variables:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Variable'
                description: The variables scoped to this environment. Sensitive values are masked.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListEnvironmentVariablesResponse contains a page of variables.
    v1ListEnvironmentsResponse:
        type: object
        properties:
            environments:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Environment'
                description: The list of environments.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListEnvironmentsResponse contains a page of environments.
    v1ListInvitationsResponse:
        type: object
        properties:
            invitations:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Invitation'
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListInvitationsResponse contains a page of invitations.
    v1ListJobsResponse:
        type: object
        properties:
            jobs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Job'
            next_page_token:
                type: string
    v1ListRunsResponse:
        type: object
        properties:
            runs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Run'
                description: The list of runs, ordered from newest to oldest.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListRunsResponse contains a page of runs.
    v1ListUsersResponse:
        type: object
        properties:
            users:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1User'
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListUsersResponse contains a page of members.
    v1Offer:
        type: object
        properties:
            job:
                $ref: '#/definitions/v1Job'
            attempt:
                type: integer
                format: int32
            lease_token:
                type: string
                description: Presented on every later call for this attempt. Shown once.
            offer_ttl_seconds:
                type: integer
                format: int32
        description: Offer is work claimed for an agent, not yet started.
    v1PathDiff:
        type: object
        properties:
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            display_path:
                type: string
            before_present:
                type: boolean
            before_json:
                type: string
            after_present:
                type: boolean
            after_json:
                type: string
        description: 'PathDiff is one changed path: absent, null or a value on each side.'
    v1PathSegment:
        type: object
        properties:
            key:
                type: string
        description: PathSegment is one step into a values tree. Only map keys exist.
    v1Placement:
        type: object
        properties:
            kubernetes:
                $ref: '#/definitions/v1KubernetesPlacement'
        description: |-
            Placement is where a component's objects go, per kind of target. A
            component carries at most the block for its kind.
    v1PlanChangeSetResponse:
        type: object
        properties:
            prepare:
                $ref: '#/definitions/v1Prepare'
    v1Prepare:
        type: object
        properties:
            revision:
                type: integer
                format: int32
            status:
                $ref: '#/definitions/v1PrepareStatus'
            artifact_digest:
                type: string
                description: '`sha256:<hex>` of the run artifact; set once PREPARED.'
            findings:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiChangesetV1Finding'
            error:
                $ref: '#/definitions/v1PrepareError'
                description: Set when FAILED.
            requested_by:
                $ref: '#/definitions/v1ActorRef'
            requested_by_kind:
                $ref: '#/definitions/v1ActorKind'
            requested_at:
                type: string
                format: date-time
            finished_at:
                type: string
                format: date-time
            attempts:
                type: integer
                format: int32
        description: Prepare is a revision's render into its run artifact.
    v1PrepareError:
        type: object
        properties:
            class:
                $ref: '#/definitions/v1PrepareErrorClass'
            component:
                type: string
                description: Empty when the failure is not one component's.
            message:
                type: string
        description: PrepareError is why a prepare failed.
    v1PrepareErrorClass:
        type: string
        enum:
            - PREPARE_ERROR_CLASS_UNSPECIFIED
            - RENDER
            - INFRA
        default: PREPARE_ERROR_CLASS_UNSPECIFIED
        description: |-
            PrepareErrorClass says whether asking again can help.

             - RENDER: The inputs cannot be rendered: asking again gives the same answer.
             - INFRA: Storage or the database failed: asking again queues it again.
    v1PrepareStatus:
        type: string
        enum:
            - PREPARE_STATUS_UNSPECIFIED
            - QUEUED
            - RUNNING
            - PREPARED
            - FAILED
            - SUPERSEDED
        default: PREPARE_STATUS_UNSPECIFIED
        description: |-
            PrepareStatus is where a revision's prepare stands.

             - SUPERSEDED: A newer revision was asked for before this one was taken up.
    v1PresentedCredential:
        type: object
        properties:
            id:
                type: string
            name:
                type: string
            hosts:
                type: array
                items:
                    type: string
                description: The hosts it was presented to during this pull.
        description: |-
            PresentedCredential is one credential a pull presented, as it was named at
            the time; the credential may since have been renamed or deleted.
    v1Progress:
        type: object
        properties:
            completed_steps:
                type: integer
                format: int32
            total_steps:
                type: integer
                format: int32
            current_component:
                type: string
    v1Provenance:
        type: object
        properties:
            kind:
                $ref: '#/definitions/v1ProvenanceKind'
            uri:
                type: string
                description: |-
                    The repository or location the bytes were read from: a git remote URL, a
                    Helm repository URL, an OCI reference. Empty for a local publish with no
                    remote.
            ref:
                type: string
                description: The ref that was asked for (tag, branch, chart version), when any.
            commit:
                type: string
                description: 'What the ref resolved to: a commit SHA, or the exact chart version.'
            path:
                type: string
                description: |-
                    The path within the source the bundle was taken from. Empty means the
                    root.
            dirty:
                type: boolean
                description: |-
                    The working copy carried uncommitted changes when it was published.
                    Only meaningful for LOCAL, and only ever true when the CLI said so.
            pins:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiRegistryV1Pin'
                description: |-
                    Every remote module or chart the closure step vendored into the bundle,
                    pinned to what it resolved.
            credentials:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PresentedCredential'
                description: |-
                    The credentials the platform presented while fetching, for PULL: which
                    secret reached which hosts. Lineage, not a grant; a later pull attaches
                    its own. Set by the server; ignored on a publish request.
                readOnly: true
            commit_message:
                type: string
                description: |-
                    The message of the commit that produced these bytes, as written, so a
                    reader deciding whether to move to this revision can see what changed.
                    Captured at publish because it cannot be recovered after a force-push or
                    once the source is gone. Empty when there is no commit, or upstream
                    carried no notes.
            commit_author:
                type: string
                description: Who wrote that commit, by name. Not the email address.
        description: |-
            Provenance is where a revision's bytes came from: the audit trail behind
            the digest.
    v1ProvenanceKind:
        type: string
        enum:
            - PROVENANCE_KIND_UNSPECIFIED
            - LOCAL
            - GIT
            - PULL
        default: PROVENANCE_KIND_UNSPECIFIED
        description: |-
            ProvenanceKind is how the bytes arrived.

             - LOCAL: Published from a working copy by the CLI. Recorded honestly as local even
            when the copy is a clean checkout, so policy can later confine local
            publishes to development catalogs without a new mechanism.
             - GIT: Published from a repository at a ref by the GitHub App, or by the CLI in
            remote mode against a registered source.
             - PULL: Pull-published from a third-party source the tenant does not own. The
            upstream identity is recorded; the bytes are frozen here.
    v1PublishComponentRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    The component name to publish under. Created on first use. Bare
                    (`cloud-sql`), which resolves to the default namespace.
            kind:
                $ref: '#/definitions/apiRegistryV1ComponentKind'
                description: |-
                    The kind, when the caller knows better than inspection. UNSPECIFIED
                    means detect.
            tags:
                type: array
                items:
                    type: string
                description: Tags to set on the resulting revision (e.g. `v1.2.0`, `latest`).
            description:
                type: string
                description: |-
                    Description and labels for the component. Applied when the publish
                    creates the component; ignored when it already exists, since a publish is
                    not the place to edit metadata. UpdateComponent is.
            labels:
                type: object
                additionalProperties:
                    type: string
            provenance:
                $ref: '#/definitions/v1Provenance'
                description: |-
                    What the caller knows about where the bytes came from. The server
                    records the kind as LOCAL for a CLI upload whatever is claimed here; the
                    uri, ref, commit, path and dirty flag are kept as the caller's
                    assertion.
            bundle:
                type: string
                format: byte
                description: 'The bundle: a gzipped tar of the component root. At most 64 MiB.'
        description: PublishComponentRequest carries what is being published and the bytes.
        required:
            - name
            - bundle
    v1PublishComponentResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/apiRegistryV1Component'
            revision:
                $ref: '#/definitions/apiRegistryV1Revision'
            unchanged:
                type: boolean
                description: |-
                    True when the digest was already published under this name and nothing
                    was written. Tags in the request were still applied.
        description: PublishComponentResponse is the recorded revision.
    v1PullComponentRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    Empty means the artifact's own name: the chart's, the module's, the
                    repository's or directory's. Bare, which resolves to the default
                    namespace.
            source:
                $ref: '#/definitions/v1PullSource'
            credential_ids:
                type: array
                items:
                    type: string
                description: |-
                    The credentials this pull may present, chosen by the caller. Each is
                    presented only where its type fits and its `allowed_hosts` permit. A
                    fetch that reaches a host none of them covers fails naming the host.
            tags:
                type: array
                items:
                    type: string
                description: |-
                    Tags to set on the resulting revision. A chart's version and a
                    module's resolved version are applied as tags whether or not named.
            description:
                type: string
                description: Applied when the pull creates the component; ignored otherwise.
            labels:
                type: object
                additionalProperties:
                    type: string
        required:
            - source
    v1PullComponentResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/apiRegistryV1Component'
            revision:
                $ref: '#/definitions/apiRegistryV1Revision'
            unchanged:
                type: boolean
                description: The resolution was already published under this name; nothing was written.
    v1PullSource:
        type: object
        properties:
            oci_chart:
                $ref: '#/definitions/PullSourceOCIChart'
            helm_chart:
                $ref: '#/definitions/PullSourceHelmChart'
            registry_module:
                $ref: '#/definitions/PullSourceRegistryModule'
            git_tree:
                $ref: '#/definitions/PullSourceGitTree'
            archive:
                $ref: '#/definitions/PullSourceArchive'
        description: |-
            PullSource names an artifact to pull. One variant. The kind of the
            resulting component follows from it: a chart from OCI or a Helm
            repository, a module from a module registry, whatever inspection finds in
            a git tree or an archive.
    v1RegistryRef:
        type: object
        properties:
            namespace:
                type: string
                description: Empty means the default namespace.
            name:
                type: string
            reference:
                type: string
                description: A tag or a `sha256:` digest.
        description: |-
            RegistryRef is a registry component and a tag or digest in it. A tag is
            resolved when the edit is made; only the revision is stored.
        required:
            - name
            - reference
    v1RemoveComponent:
        type: object
        properties:
            component:
                type: string
        description: |-
            RemoveComponent drops a component this draft adds, or destroys a live
            one.
        required:
            - component
    v1RenewLeaseRequest:
        type: object
        properties:
            attempt:
                $ref: '#/definitions/v1Attempt'
            progress:
                $ref: '#/definitions/v1Progress'
        required:
            - attempt
    v1RenewLeaseResponse:
        type: object
        properties:
            lease_ttl_seconds:
                type: integer
                format: int32
            cancel_requested:
                type: boolean
                description: Stop, clean up, and report CANCELLED. The lease stays valid meanwhile.
    v1ReplaceValues:
        type: object
        properties:
            component:
                type: string
            tree_json:
                type: string
                description: A JSON object.
            from_revision:
                type: integer
                format: int32
                description: The head revision GetComponentValues reported; 0 for a draft with none.
        description: |-
            ReplaceValues makes a component's values exactly this tree: an upload.
            Refused unless `from_revision` is the head the tree was downloaded at.
        required:
            - component
            - tree_json
    v1ReportJobResultRequest:
        type: object
        properties:
            attempt:
                $ref: '#/definitions/v1Attempt'
            report_id:
                type: string
                description: Chosen by the agent; a retry with the same id returns the first answer.
            result:
                $ref: '#/definitions/v1JobResult'
        required:
            - attempt
            - result
    v1ReportJobResultResponse:
        type: object
        properties:
            outcome:
                $ref: '#/definitions/v1ReportOutcome'
    v1ReportOutcome:
        type: string
        enum:
            - REPORT_OUTCOME_UNSPECIFIED
            - ACCEPTED
            - DUPLICATE
            - LATE
        default: REPORT_OUTCOME_UNSPECIFIED
        description: |4-
             - DUPLICATE: The same report_id was already accepted.
             - LATE: The attempt had lost its lease: kept as evidence, no state change.
    v1ReportStatusRequest:
        type: object
        properties:
            agent_version:
                type: string
            protocol_version:
                type: integer
                format: int32
            kube_version:
                type: string
            api_versions:
                type: array
                items:
                    type: string
            capabilities:
                $ref: '#/definitions/v1AgentCapabilities'
            jwks_json:
                type: string
                description: |-
                    The cluster's current keys, when the agent can read them. Never applied:
                    a set that differs from the trusted one is recorded for an admin.
            cluster_uid:
                type: string
    v1ReportStatusResponse:
        type: object
        properties:
            next_report_seconds:
                type: integer
                format: int32
            keys_accepted:
                type: boolean
                description: |-
                    False when the reported key set was not taken as the cluster's keys. The
                    rest of the report is still stored.
    v1RetryRevisionResponse:
        type: object
        properties:
            revision:
                $ref: '#/definitions/apiRunV1Revision'
                description: |-
                    The retried revision. Status resets and retry_count is incremented.
                    Downstream revisions that were BLOCKED will automatically unblock
                    if this revision succeeds.
        description: RetryRevisionResponse contains the updated revision.
    v1RevisionCause:
        type: string
        enum:
            - REVISION_CAUSE_UNSPECIFIED
            - EDIT
            - REBASE
        default: REVISION_CAUSE_UNSPECIFIED
        description: |-
            RevisionCause says why a revision was cut. Only EDIT is written until
            rebase exists.
    v1RevisionChangeType:
        type: string
        enum:
            - REVISION_CHANGE_TYPE_UNSPECIFIED
            - REVISION_CHANGE_TYPE_CREATE
            - REVISION_CHANGE_TYPE_UPDATE
            - REVISION_CHANGE_TYPE_DESTROY
            - REVISION_CHANGE_TYPE_RECREATE
            - REVISION_CHANGE_TYPE_IMPORT
            - REVISION_CHANGE_TYPE_NO_CHANGE
        default: REVISION_CHANGE_TYPE_UNSPECIFIED
        description: |-
            RevisionChangeType classifies the change a revision represents relative to
            the previously deployed state for the same component.

             - REVISION_CHANGE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - REVISION_CHANGE_TYPE_CREATE: First revision for this component (no previous SUCCEEDED revision).
             - REVISION_CHANGE_TYPE_UPDATE: Module/version/values changed in place; same module binding.
             - REVISION_CHANGE_TYPE_DESTROY: Component is being destroyed (the changeset entry was DESTROY).
             - REVISION_CHANGE_TYPE_RECREATE: Module binding changed since the last SUCCEEDED revision; the prior
            resources may need to be recreated under the new module's contract.
             - REVISION_CHANGE_TYPE_IMPORT: Existing infrastructure was imported into management.
             - REVISION_CHANGE_TYPE_NO_CHANGE: Module/version/values match the last SUCCEEDED revision; the revision
            is a re-plan (e.g., to recompute outputs against a refreshed env).
    v1RevisionKind:
        type: string
        enum:
            - REVISION_KIND_UNSPECIFIED
            - REVISION_KIND_INFRASTRUCTURE
            - REVISION_KIND_WORKLOAD
        default: REVISION_KIND_UNSPECIFIED
        description: |-
            RevisionKind mirrors ComponentKind but is stored on the revision to capture
            the effective kind at run time (may differ from the component default
            if an environment override changed the source type).

             - REVISION_KIND_UNSPECIFIED: Default value. Must not be used.
             - REVISION_KIND_INFRASTRUCTURE: Infrastructure revision (IaC). Plan -> apply lifecycle.
             - REVISION_KIND_WORKLOAD: Workload revision (Helm, Kustomize, manifests). Direct apply lifecycle.
    v1RevisionPhase:
        type: string
        enum:
            - REVISION_PHASE_UNSPECIFIED
            - REVISION_PHASE_PLAN
            - REVISION_PHASE_APPLY
        default: REVISION_PHASE_UNSPECIFIED
        description: |-
            RevisionPhase labels which phase of a revision's lifecycle produced a
            retrievable transcript. Plan and apply are the only phases today; future
            phases (e.g., import) extend this enum without changing the storage shape.

             - REVISION_PHASE_UNSPECIFIED: Default value. Must not be used.
             - REVISION_PHASE_PLAN: Plan transcript (terraform plan / tofu plan output).
             - REVISION_PHASE_APPLY: Apply transcript (terraform apply / tofu apply output).
    v1RevisionSummary:
        type: object
        properties:
            total:
                type: integer
                format: int32
                description: Total number of component revisions in this run.
            succeeded:
                type: integer
                format: int32
                description: Number of revisions that completed successfully.
            failed:
                type: integer
                format: int32
                description: Number of revisions that failed.
            blocked:
                type: integer
                format: int32
                description: Number of revisions that are blocked by upstream failures.
            running:
                type: integer
                format: int32
                description: Number of revisions currently running (planning or applying).
            canceled:
                type: integer
                format: int32
                description: Number of revisions that were canceled.
            pending:
                type: integer
                format: int32
                description: Number of revisions that have not started yet.
        description: |-
            RevisionSummary provides aggregate counts of revision statuses within a
            run, enabling quick status display without loading all revisions.
    v1RevokeAgentUseResponse:
        type: object
    v1RevokeApiKeyResponse:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: The key metadata with updated status.
        description: RevokeApiKeyResponse contains the revoked API key metadata.
    v1RevokeInvitationResponse:
        type: object
        properties:
            invitation:
                $ref: '#/definitions/v1Invitation'
        description: RevokeInvitationResponse carries the invitation as it now stands.
    v1Run:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the run (UUID).
            application_id:
                type: string
                description: The application being deployed (UUID).
            environment_id:
                type: string
                description: The target environment (UUID).
            status:
                $ref: '#/definitions/v1RunStatus'
                description: Composite status derived from all component revisions.
            triggered_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent that triggered the run (server-populated from token).
            message:
                type: string
                description: |-
                    Optional message describing the run (e.g., "Deploying v2.1.0
                    with new caching layer" or "Rolling back to stable after API errors").
            source_run_id:
                type: string
                description: |-
                    If this run was created as a rollback from a prior run, this field
                    contains the source run's UUID. Empty for normal runs.
            change_set_id:
                type: string
                description: |-
                    The changeset that was deployed (UUID). Absent for pre-changeset runs
                    and reconcile (no-changeset) runs.
            revision_summary:
                $ref: '#/definitions/v1RevisionSummary'
                description: Summary counts for quick status display.
            completed_at:
                type: string
                format: date-time
                description: |-
                    When the run finished (all revisions completed, failed, or canceled).
                    Absent while the run is in progress.
            display_id:
                type: string
                description: |-
                    Typed display identifier of the form `run-<12-char-suffix>` (e.g.,
                    `run-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                    over `id` for user-facing references; lookups accept either form.
            application_name:
                type: string
                description: |-
                    Display name of the parent application. Denormalized for display.
                    Read-only; ignored on writes.
            environment_name:
                type: string
                description: |-
                    Display name of the parent environment. Denormalized for display.
                    Read-only; ignored on writes.
            change_set_display_id:
                type: string
                description: |-
                    Display ID of the changeset this run deployed (`cs-<suffix>`).
                    Denormalized for display. Empty when `change_set_id` is empty
                    (pre-changeset runs, reconcile runs). Read-only.
            change_set_title:
                type: string
                description: |-
                    Title of the changeset this run deployed. Denormalized for display.
                    Empty when `change_set_id` is empty. Read-only.
            created_at:
                type: string
                format: date-time
                description: When the run was created.
        description: |-
            Run represents a single execution against an application+environment.
            Each run produces one Revision per component. The run tracks the composite
            status across all revisions and provides the audit trail for what was
            executed, when, and by whom.

            Run records are immutable once created. There is no UpdateRun RPC and no
            `updated_at` field. The composite `status`, `revision_summary`, and
            `completed_at` fields are server-maintained as revisions progress;
            everything else is fixed at creation time. To change what is deployed,
            create a new run.
    v1RunStatus:
        type: string
        enum:
            - RUN_STATUS_UNSPECIFIED
            - RUN_STATUS_PENDING
            - RUN_STATUS_QUEUED
            - RUN_STATUS_PLANNING
            - RUN_STATUS_PLANNED
            - RUN_STATUS_APPLYING
            - RUN_STATUS_SUCCEEDED
            - RUN_STATUS_PARTIALLY_FAILED
            - RUN_STATUS_FAILED
            - RUN_STATUS_CANCELED
            - RUN_STATUS_SUPERSEDED
            - RUN_STATUS_STALE
            - RUN_STATUS_AWAITING_APPROVAL
        default: RUN_STATUS_UNSPECIFIED
        description: |-
            RunStatus represents the composite status of a run, derived from the
            statuses of all its component revisions.

             - RUN_STATUS_UNSPECIFIED: Default value. Must not be used.
             - RUN_STATUS_PENDING: The run has been created and is being initialized (resolving
            components, building dependency graph).
             - RUN_STATUS_QUEUED: The run is queued behind another active run for the same
            application+environment. It will start automatically when the preceding
            run completes or is canceled.
             - RUN_STATUS_PLANNING: At least one revision is actively planning (or waiting to plan).
             - RUN_STATUS_PLANNED: All revisions have completed planning and are awaiting approval.
             - RUN_STATUS_APPLYING: At least one revision is actively applying.
             - RUN_STATUS_SUCCEEDED: All revisions completed successfully.
             - RUN_STATUS_PARTIALLY_FAILED: Some revisions succeeded but at least one failed or is blocked. No
            revisions are still running.
             - RUN_STATUS_FAILED: All non-independent revisions failed or were blocked. No revisions are
            still running.
             - RUN_STATUS_CANCELED: The run was canceled by a user. Already-succeeded revisions
            remain applied.
             - RUN_STATUS_SUPERSEDED: The run was superseded by a newer plan for the same change set,
            or invalidated by an edit to the change set's entries / variables. The
            system marked it terminal; the user did not. Distinct from CANCELED to
            keep the audit trail honest about who initiated the transition.
             - RUN_STATUS_STALE: At least one revision's apply stalled with an unknown outcome and requires
            reconciliation before the run can proceed. Not terminal; not auto-advanced.
            (Set by the liveness/STALE reaper; see Phase D.)
             - RUN_STATUS_AWAITING_APPROVAL: At least one revision has planned and is awaiting explicit approval before
            its apply runs (gating policy != auto-continue). Not terminal; the user is
            the gatekeeper. (Set by the gating flow; see the per-env gating policy.)
    v1SSHKeyAuth:
        type: object
        properties:
            private_key:
                type: string
                description: Write-only.
            passphrase:
                type: string
                description: Write-only.
        description: SSHKeyAuth is a PEM-encoded private key and its passphrase, if any.
    v1SetClusterTrustResponse:
        type: object
        properties:
            cluster:
                $ref: '#/definitions/v1Cluster'
    v1SetNull:
        type: object
        properties:
            component:
                type: string
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
        description: SetNull writes null at a path, which clears a chart default.
        required:
            - component
    v1SetPin:
        type: object
        properties:
            component:
                type: string
            reference:
                type: string
                description: A tag or a `sha256:` digest.
        description: |-
            SetPin moves a component to another revision of the same registry
            component.
        required:
            - component
            - reference
    v1SetPlacement:
        type: object
        properties:
            component:
                type: string
            placement:
                $ref: '#/definitions/v1Placement'
        description: SetPlacement replaces where a component goes.
        required:
            - component
            - placement
    v1SetRevisionStatusResponse:
        type: object
        properties:
            revision:
                $ref: '#/definitions/apiRegistryV1Revision'
        description: SetRevisionStatusResponse contains the revision with its new status.
    v1SetTagResponse:
        type: object
        properties:
            tag:
                $ref: '#/definitions/v1Tag'
        description: SetTagResponse contains the tag as it now stands.
    v1SetValue:
        type: object
        properties:
            component:
                type: string
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            value_json:
                type: string
                description: 'JSON text, not null: null is SetNull.'
        description: |-
            SetValue writes a value at a path, creating maps on the way, as
            `helm --set` does. A map value replaces what was there.
        required:
            - component
            - value_json
    v1Slots:
        type: object
        properties:
            kind:
                $ref: '#/definitions/v1JobKind'
            free:
                type: integer
                format: int32
            capacity:
                type: integer
                format: int32
                description: |-
                    The most of this kind the agent runs at once. The server offers no more
                    than this, whatever `free` says.
        description: Slots is how many more jobs of a kind the agent will take now.
    v1StartJobRequest:
        type: object
        properties:
            attempt:
                $ref: '#/definitions/v1Attempt'
        required:
            - attempt
    v1StartJobResponse:
        type: object
        properties:
            lease_ttl_seconds:
                type: integer
                format: int32
                description: Renew before this passes, measured from when the request was sent.
            max_run_seconds:
                type: integer
                format: int32
                description: The job is failed once it has run this long, renewed or not.
    v1Step:
        type: object
        properties:
            component:
                type: string
            status:
                $ref: '#/definitions/v1JobStatus'
            message:
                type: string
        description: Step is one component's part of a job.
    v1Tag:
        type: object
        properties:
            name:
                type: string
                description: As written after the colon in `cloud-sql:v1.2.0`.
                readOnly: true
            digest:
                type: string
                description: The revision it names, as `sha256:<hex>`.
                readOnly: true
            immutable:
                type: boolean
                description: |-
                    True for a semver tag: it never moves once assigned. Decided from the
                    name, so two tags with the same name are always the same class.
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
        description: Tag is a name pointing at a revision.
    v1Tenant:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier (UUID).
                readOnly: true
            slug:
                type: string
                description: URL-safe identifier, unique across Admiral. Fixed at creation.
                readOnly: true
            display_name:
                type: string
                description: Human-readable name.
            status:
                $ref: '#/definitions/v1TenantStatus'
                description: Lifecycle state.
                readOnly: true
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Free-form labels for the customer's own use.
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
        description: |-
            Tenant is the account as its own members see it: its identity, its lifecycle
            state, and the settings they control. Operational detail about how the
            account is run is not part of this view.
    v1TenantStatus:
        type: string
        enum:
            - TENANT_STATUS_UNSPECIFIED
            - TENANT_STATUS_PENDING
            - TENANT_STATUS_ACTIVE
            - TENANT_STATUS_SUSPENDED
        default: TENANT_STATUS_UNSPECIFIED
        description: |-
            TenantStatus is the account's lifecycle state. A caller sees it but cannot
            set it: suspension and reactivation are imposed, not requested.

             - TENANT_STATUS_UNSPECIFIED: Default value. Must not be used.
             - TENANT_STATUS_PENDING: Provisioning has not finished; the tenant is not yet serving.
             - TENANT_STATUS_ACTIVE: Normal operation.
             - TENANT_STATUS_SUSPENDED: Access is withheld, typically for billing or abuse. Data is retained.
    v1UnsetValue:
        type: object
        properties:
            component:
                type: string
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
        description: UnsetValue removes a path, so the default applies.
        required:
            - component
    v1UpdateAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
    v1UpdateApiKeyResponse:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: The updated key metadata.
        description: UpdateApiKeyResponse contains the updated API key metadata.
    v1UpdateApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The updated application.
        description: UpdateApplicationResponse contains the updated application.
    v1UpdateComponentResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/apiRegistryV1Component'
        description: UpdateComponentResponse contains the updated component.
    v1UpdateCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
    v1UpdateEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The updated environment.
        description: UpdateEnvironmentResponse contains the updated environment.
    v1UpdateTenantRequest:
        type: object
        properties:
            display_name:
                type: string
                description: New display name. Omit to leave unchanged.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Replaces all labels when present. Omit to leave unchanged.
            update_mask:
                type: string
                description: |-
                    Which fields to apply. Present for forward compatibility as the mutable
                    surface grows.
        description: |-
            UpdateTenantRequest carries only the mutable fields. The tenant is the
            caller's own, so there is no id here.
    v1UpdateTenantResponse:
        type: object
        properties:
            tenant:
                $ref: '#/definitions/v1Tenant'
    v1User:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the user (UUID).
            email:
                type: string
                description: User's email address.
            email_verified:
                type: boolean
                description: Whether the email has been verified by the IdP.
            display_name:
                type: string
                description: User's display name for UI purposes.
            given_name:
                type: string
                description: User's given (first) name.
            family_name:
                type: string
                description: User's family (last) name.
            avatar_url:
                type: string
                description: URL to the user's avatar image.
            created_at:
                type: string
                format: date-time
                description: When the user was created.
            updated_at:
                type: string
                format: date-time
                description: When the user was last updated.
            role:
                $ref: '#/definitions/v1UserRole'
                description: The user's standing in the tenant.
                readOnly: true
            status:
                $ref: '#/definitions/v1UserStatus'
                description: Whether the user can currently sign in.
                readOnly: true
        description: User represents a user's profile information.
    v1UserRole:
        type: string
        enum:
            - USER_ROLE_UNSPECIFIED
            - USER_ROLE_OWNER
            - USER_ROLE_ADMIN
            - USER_ROLE_MEMBER
            - USER_ROLE_APP_CREATOR
        default: USER_ROLE_UNSPECIFIED
        description: |-
            UserRole is a member's standing in the tenant. The tiers imply one another
            downward: an owner can do everything an administrator can, an administrator
            everything a member can.

             - USER_ROLE_UNSPECIFIED: Default value. Must not be used.
             - USER_ROLE_OWNER: Owns the tenant. Exactly one per tenant; ownership moves by transfer, never
            by invitation.
             - USER_ROLE_ADMIN: Manages members and tenant settings.
             - USER_ROLE_MEMBER: Ordinary membership.
             - USER_ROLE_APP_CREATOR: A member who may also create applications. An additive capability rather
            than a rung on the tier, reported here as the role the platform holds for
            the user.
    v1UserStatus:
        type: string
        enum:
            - USER_STATUS_UNSPECIFIED
            - USER_STATUS_ACTIVE
            - USER_STATUS_SUSPENDED
        default: USER_STATUS_UNSPECIFIED
        description: |-
            UserStatus is whether a member can currently sign in.

             - USER_STATUS_UNSPECIFIED: Default value. Must not be used.
             - USER_STATUS_ACTIVE: Can sign in and act.
             - USER_STATUS_SUSPENDED: Suspended by an administrator; cannot sign in until reactivated.
    v1ValueOp:
        type: object
        properties:
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            op:
                $ref: '#/definitions/v1ValueOpKind'
            value_json:
                type: string
                description: JSON text; empty unless op is SET.
            from_present:
                type: boolean
                description: Whether the base had the key; a null there is present.
            from_value_json:
                type: string
                description: JSON text; empty when from_present is false.
        description: ValueOp is one change at one path, with what the base held there.
    v1ValueOpKind:
        type: string
        enum:
            - VALUE_OP_KIND_UNSPECIFIED
            - SET
            - SET_NULL
            - REMOVE
        default: VALUE_OP_KIND_UNSPECIFIED
        description: |4-
             - SET: Writes a value.
             - SET_NULL: Writes null, which clears a chart default.
             - REMOVE: Makes the key absent, so the default applies.
    v1Variable:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the variable (UUID).
            key:
                type: string
                description: |-
                    The variable name. For user-created variables, must be a valid
                    environment variable identifier (e.g., "DATABASE_URL", "API_KEY").
                    Infrastructure output variables use dot-namespaced keys
                    (e.g., "vpc.vpc_id", "database.endpoint") and are system-managed.
            value:
                type: string
                description: |-
                    The variable value. Always stored as a string; use `type` to indicate
                    how to interpret it. Masked or empty for sensitive variables in responses.

                    For COMPLEX type, this is a JSON-encoded string (e.g., '["a","b"]' or
                    '{"key":"value"}'). The rendering engine converts it to the target format
                    (HCL for Terraform, YAML for Helm).
            sensitive:
                type: boolean
                description: Whether the variable value is encrypted at rest and masked in API responses.
            type:
                $ref: '#/definitions/v1VariableType'
                description: |-
                    How the value should be interpreted by the rendering engine and displayed
                    in the UI. Defaults to STRING if not specified.
            description:
                type: string
                description: |-
                    Optional description of the variable's purpose (e.g., "Maximum replica
                    count for production scaling" or "RDS instance class per environment").
            application_id:
                type: string
                description: |-
                    The application this variable belongs to (UUID). Always set; variables
                    are env-scoped and inherit their app from the environment.
            environment_id:
                type: string
                description: |-
                    The environment this variable is scoped to (UUID). Always set; variables
                    are env-scoped.
            source:
                $ref: '#/definitions/v1VariableSource'
                description: |-
                    How the variable was created. USER for change-set-managed variables,
                    INFRASTRUCTURE for variables produced by engine output capture (Terraform
                    or OpenTofu). Server-populated.
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this variable (server-populated from token).
            created_at:
                type: string
                format: date-time
                description: When the variable was created.
            updated_at:
                type: string
                format: date-time
                description: When the variable was last updated.
        description: |-
            Variable represents a configuration key-value pair scoped to a specific
            environment within an application. Variables are user-managed configuration
            values, distinct from infrastructure outputs which are system-managed values
            produced by apply (e.g., Terraform outputs, namespaced as
            `<component_name>.<output_name>`).

            Variables are mutated exclusively through change sets (ChangeSetAPI.SetVariable
            / RemoveVariable). They are read via EnvironmentAPI.ListEnvironmentVariables.

            Sensitive variables have their values masked in API responses.
    v1VariableSource:
        type: string
        enum:
            - VARIABLE_SOURCE_UNSPECIFIED
            - VARIABLE_SOURCE_USER
            - VARIABLE_SOURCE_INFRASTRUCTURE
        default: VARIABLE_SOURCE_UNSPECIFIED
        description: |-
            VariableSource indicates how the variable was created.

             - VARIABLE_SOURCE_UNSPECIFIED: Default value. Must not be used.
             - VARIABLE_SOURCE_USER: User-managed variable created via change sets (ChangeSetAPI.SetVariable).
             - VARIABLE_SOURCE_INFRASTRUCTURE: System-managed variable produced by a successful infrastructure apply
            (engine outputs from `terraform output` / `tofu output`). These variables
            are written by the output capture pipeline and cannot be created or
            deleted via the public API.
    v1VariableType:
        type: string
        enum:
            - VARIABLE_TYPE_UNSPECIFIED
            - VARIABLE_TYPE_STRING
            - VARIABLE_TYPE_NUMBER
            - VARIABLE_TYPE_BOOLEAN
            - VARIABLE_TYPE_COMPLEX
        default: VARIABLE_TYPE_UNSPECIFIED
        description: |-
            VariableType indicates how the variable value should be interpreted by the
            rendering engine and displayed in the UI. The value is always stored as a
            string regardless of type.

             - VARIABLE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - VARIABLE_TYPE_STRING: Plain text value. Quoted when rendered into HCL for an infrastructure
            engine (Terraform / OpenTofu), passed as-is for Helm and Kustomize.
            Rendered as a text input in the UI.
             - VARIABLE_TYPE_NUMBER: Numeric value (integer or decimal). Unquoted when rendered into HCL.
            Rendered as a number input in the UI.
             - VARIABLE_TYPE_BOOLEAN: Boolean value ("true" or "false"). Unquoted when rendered into HCL.
            Rendered as a toggle in the UI.
             - VARIABLE_TYPE_COMPLEX: Structured value (lists, maps, objects). Stored as a JSON-encoded string
            (e.g., '["us-east-1a","us-east-1b"]' or '{"env":"prod","team":"platform"}').
            Rendered as HCL for infrastructure engines, YAML for Helm, or JSON for
            other consumers. Rendered as a code editor in the UI.
    v1Violation:
        type: object
        properties:
            component:
                type: string
            path:
                type: string
                description: 'Display form: `image.tag`, `ingress."a.b"`.'
            message:
                type: string
        description: |-
            Violation is one way a component's values fail its pinned revision's
            contract.
    v1WaitReason:
        type: string
        enum:
            - WAIT_REASON_UNSPECIFIED
            - NO_AGENT_SELECTED
            - AGENT_NOT_GRANTED
            - AGENT_OFFLINE
            - AGENT_AT_CAPACITY
            - AGENT_TOO_OLD
            - ENVIRONMENT_BUSY
            - BACKOFF
            - CLUSTER_PENDING
        default: WAIT_REASON_UNSPECIFIED
        description: |-
            WaitReason says why a queued job is not running.

             - ENVIRONMENT_BUSY: Another APPLY holds the environment.
             - BACKOFF: Retrying after a failed attempt.
servers:

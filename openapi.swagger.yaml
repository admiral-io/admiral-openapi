                description: |-
                    URL-safe, human-readable identifier for the token (e.g., "ci-deploy-key").
                    Unique within the parent resource. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            token_prefix:
                type: string
                description: |-
                    Non-secret prefix of the token value. The five-character brand
                    (`admp_` for PATs, `adms_` for SATs) followed by a short sample of
                    characters from the secret body (e.g., "adms_pL2m"). URL-safe and safe
                    to log and display. Use for incident response and audit trails without
                    exposing the secret.
            token_type:
                $ref: '#/definitions/v1TokenType'
                description: The category of this token.
            scopes:
                type: array
                items:
                    type: string
                description: |-
                    The scopes granted to this token. For PATs, these are user-selected.
                    For SATs, these are auto-assigned based on the resource type.
            status:
                $ref: '#/definitions/v1AccessTokenStatus'
                description: Current lifecycle status of the token.
            binding_type:
                $ref: '#/definitions/v1BindingType'
                description: The kind of resource this token is bound to.
            binding_id:
                type: string
                description: |-
                    The ID of the resource this token is bound to (UUID): the user ID for
                    PATs, the agent ID for SATs.
            expires_at:
                type: string
                format: date-time
                description: When the token expires. If unset, the token does not expire.
            last_used_at:
                type: string
                format: date-time
                description: When the token was last used to authenticate an API request.
            revoked_at:
                type: string
                format: date-time
                description: When the token was revoked. Only set when status is REVOKED.
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: |-
                    The user who created this token. For PATs, this is the token owner.
                    For SATs, this is the administrator who issued the token.
            created_at:
                type: string
                format: date-time
                description: When the token was created.
        description: |-
            AccessToken contains metadata for an opaque access token issued by Admiral.

            Admiral issues two kinds of tokens, distinguished by `token_type`:

              - **Personal Access Tokens (PATs)**: bound to a user, created by that
                user via UserAPI. Scopes are user-selected at creation time. Intended
                for CLI, CI, and human-driven automation.
              - **Service Access Tokens (SATs)**: bound to an agent, created by
                administrators via AgentAPI. Scopes are auto-assigned from the agent's
                kind. Intended for long-lived agents that authenticate as the agent
                itself.

            The raw token secret is returned exactly once, in the `plain_text_token`
            field of the Create response. This message carries only metadata; the
            original secret is never retrievable after creation. The non-secret
            `token_prefix` is safe to log and display.

            Token CRUD is managed by each parent resource's API:
              - PATs: UserAPI  (/api/v1/user/tokens)
              - SATs: AgentAPI (/api/v1/agents/{id}/tokens)

            IDP-issued JWTs (OAuth2/OIDC sessions) are not represented here; they are
            resolved by separate middleware.
    v1AccessTokenStatus:
        type: string
        enum:
            - ACCESS_TOKEN_STATUS_UNSPECIFIED
            - ACCESS_TOKEN_STATUS_ACTIVE
            - ACCESS_TOKEN_STATUS_REVOKED
        default: ACCESS_TOKEN_STATUS_UNSPECIFIED
        description: |-
            AccessTokenStatus represents the lifecycle state of an access token.

             - ACCESS_TOKEN_STATUS_UNSPECIFIED: Default value. Must not be used.
             - ACCESS_TOKEN_STATUS_ACTIVE: The token is valid and can be used for authentication.
             - ACCESS_TOKEN_STATUS_REVOKED: The token has been permanently revoked and cannot be used.
    v1ActiveJobInfo:
        type: object
        properties:
            job_id:
                type: string
                description: The job being executed (UUID).
            phase:
                $ref: '#/definitions/v1JobPhase'
                description: Current execution phase reported by the worker thread.
            started_at:
                type: string
                format: date-time
                description: When execution of this job started (when the agent claimed it).
        description: |-
            ActiveJobInfo summarizes a job currently being executed by a TERRAFORM agent
            instance. Included in TerraformAgentStatus to provide real-time job progress.
    v1ActorRef:
        type: object
        properties:
            id:
                type: string
                description: UUID of the user or service access token.
            display_name:
                type: string
                description: Human-readable name (e.g., "John Smith", "cluster-prod-agent").
            email:
                type: string
                description: Email address (empty for non-human actors).
        description: |-
            ActorRef is a lightweight reference to the user or agent that performed an action.
            Server-populated on all resource responses. Clients should never send this;
            use the plain string `created_by` UUID on request messages instead.
    v1Agent:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the agent (UUID).
                readOnly: true
            kind:
                $ref: '#/definitions/v1AgentKind'
                description: |-
                    The execution plane this agent serves. Set at creation and immutable
                    (CreateAgentRequest.kind carries the not_in:[0] requirement). Not validated
                    here so a partial Agent in UpdateAgentRequest (which omits kind) passes.
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod-terraform" or "prod-us-east-1").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must start
                    with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional longer-form description of the agent's purpose.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering agents
                    (e.g., `{"cloud": "aws", "team": "platform"}`).
            health_status:
                $ref: '#/definitions/v1AgentHealthStatus'
                description: Derived health status based on reporting recency and kind-specific signals.
                readOnly: true
            cluster_uid:
                type: string
                description: |-
                    (KUBERNETES only) The Kubernetes kube-system namespace UID, bound at agent
                    registration using a first-write-wins strategy. Used to detect when a token
                    is accidentally deployed to a different physical cluster. Empty for TERRAFORM
                    agents.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this agent (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the agent record was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: |-
                    When the agent record was last updated via UpdateAgent. Reports/heartbeats
                    do not bump this field; liveness is exposed separately via GetAgentStatus
                    and health_status.
                readOnly: true
        description: |-
            Agent represents a registered execution agent within a tenant. The `kind`
            selects its execution plane: TERRAFORM agents claim and execute infrastructure
            jobs; KUBERNETES agents report Kubernetes telemetry and apply manifest revisions.
    v1AgentHealthStatus:
        type: string
        enum:
            - AGENT_HEALTH_STATUS_UNSPECIFIED
            - AGENT_HEALTH_STATUS_PENDING
            - AGENT_HEALTH_STATUS_HEALTHY
            - AGENT_HEALTH_STATUS_DEGRADED
            - AGENT_HEALTH_STATUS_ERROR
            - AGENT_HEALTH_STATUS_UNREACHABLE
        default: AGENT_HEALTH_STATUS_UNSPECIFIED
        description: |-
            AgentHealthStatus represents the derived health state of an agent. The status
            is computed from reporting recency and kind-specific signals (capacity for
            TERRAFORM; node readiness and workload health for KUBERNETES). The ERROR state is
            only emitted by KUBERNETES agents.

             - AGENT_HEALTH_STATUS_UNSPECIFIED: Default value. Must not be used.
             - AGENT_HEALTH_STATUS_PENDING: Agent record exists but no report has been received yet.
             - AGENT_HEALTH_STATUS_HEALTHY: Reporting within the expected interval; agent operational.
             - AGENT_HEALTH_STATUS_DEGRADED: Operational but reporting constraints: capacity near limits (TERRAFORM), or some
            nodes not ready / workloads degraded (KUBERNETES).
             - AGENT_HEALTH_STATUS_ERROR: (KUBERNETES only) More than 25% nodes not ready or workloads in error state.
             - AGENT_HEALTH_STATUS_UNREACHABLE: No report received within 3x the expected interval.
    v1AgentKind:
        type: string
        enum:
            - AGENT_KIND_UNSPECIFIED
            - AGENT_KIND_TERRAFORM
            - AGENT_KIND_KUBERNETES
        default: AGENT_KIND_UNSPECIFIED
        description: |-
            AgentKind names the execution contract an agent serves, by its canonical tool.
            The engine is a sub-axis within a kind (TERRAFORM runs terraform/tofu;
            KUBERNETES runs helm/kustomize/raw), so a new tool is a new value, not a refactor.

             - AGENT_KIND_UNSPECIFIED: Default value. Must not be used.
             - AGENT_KIND_TERRAFORM: Terraform-semantic infrastructure agent (plan/apply/destroy jobs; engines:
            terraform, tofu). Managed-service deploys (Lambda/ECS/Cloud Run) also run here
            as terraform components.
             - AGENT_KIND_KUBERNETES: Kubernetes agent (cluster telemetry + manifest revision delivery/reconcile).
    v1Application:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the application (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                    the tenant. Lowercase alphanumeric and hyphens only, must start with a
                    letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the application's purpose
                    (e.g., "Core inventory service tracking warehouse stock and fulfillment").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering applications
                    (e.g., `{"team": "logistics", "tier": "critical"}`).
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this application (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the application was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the application was last updated.
                readOnly: true
        description: |-
            Application represents a deployable unit within a tenant. An application
            groups manifests, dependencies, and environment configuration into a single
            entity that Admiral orchestrates across environments.
    v1ApplicationRef:
        type: object
        properties:
            namespace:
                type: string
                description: Kubernetes namespace of the Application.
            name:
                type: string
                description: Application name.
        description: |-
            ApplicationRef is a lightweight (namespace, name) reference to an Admiral
            Application, used to tag workload metrics with their owning Application.
    v1ApplyRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: |-
                    The run with status advanced to APPLYING. Revisions that were
                    PLANNED are now APPLYING.
        description: ApplyRunResponse contains the run after apply jobs are dispatched.
    v1ArtifactKind:
        type: string
        enum:
            - ARTIFACT_KIND_UNSPECIFIED
            - ARTIFACT_KIND_SOURCE_BUNDLE
            - ARTIFACT_KIND_PLAN
            - ARTIFACT_KIND_MANIFEST_BUNDLE
        default: ARTIFACT_KIND_UNSPECIFIED
        description: |-
            ArtifactKind types an artifact a phase produces or consumes.

             - ARTIFACT_KIND_UNSPECIFIED: Default value. Must not be used.
             - ARTIFACT_KIND_SOURCE_BUNDLE: The packaged source tree a terraform phase executes over.
             - ARTIFACT_KIND_PLAN: The binary plan a terraform plan produces and apply consumes.
             - ARTIFACT_KIND_MANIFEST_BUNDLE: The rendered Kubernetes manifests a workload applies.
    v1ArtifactRef:
        type: object
        properties:
            kind:
                $ref: '#/definitions/v1ArtifactKind'
                description: The kind of artifact.
            key:
                type: string
                description: Storage key (object-storage path) where the artifact bytes live.
            checksum:
                type: string
                description: |-
                    SHA-256 checksum of the artifact for integrity verification. May be empty
                    for artifacts not yet verified.
        description: |-
            ArtifactRef addresses one artifact an execution produced: its kind, the
            storage key where the bytes live, and a checksum for fail-closed
            verification.
    v1AuthConfig:
        type: object
        properties:
            ssh_key:
                $ref: '#/definitions/v1SSHKeyAuth'
            basic_auth:
                $ref: '#/definitions/v1BasicAuth'
            bearer_token:
                $ref: '#/definitions/v1BearerTokenAuth'
        description: |-
            AuthConfig is the polymorphic auth configuration attached to a Credential.
            Exactly one variant is populated, corresponding to the credential's type.
            Sensitive fields within each variant are write-only.
    v1BasicAuth:
        type: object
        properties:
            username:
                type: string
                description: Username for authentication.
            password:
                type: string
                description: |-
                    Password (or PAT / registry-scoped token / app password).
                    Write-only: masked in responses.
        description: |-
            BasicAuth holds HTTP Basic credentials (username + password). Reused across
            any Source type that accepts HTTP Basic (Helm, OCI, HTTP archive, Git
            HTTPS).
    v1BearerTokenAuth:
        type: object
        properties:
            token:
                type: string
                description: |-
                    Token value.
                    Write-only: masked in responses.
        title: |-
            BearerTokenAuth holds a single token value. Presentation is per target
            protocol:
              - Terraform registries, Helm bearer, OCI bearer, HTTP archives:
                `Authorization: Bearer <token>`
              - Git HTTPS (GitHub PAT, GitLab PAT): HTTP Basic with the token as
                password and a dummy username
    v1BindingType:
        type: string
        enum:
            - BINDING_TYPE_UNSPECIFIED
            - BINDING_TYPE_USER
            - BINDING_TYPE_AGENT
        default: BINDING_TYPE_UNSPECIFIED
        description: |-
            BindingType identifies the kind of resource an access token is bound to.

             - BINDING_TYPE_UNSPECIFIED: Default value. Must not be used.
             - BINDING_TYPE_USER: Token is bound to a user (PATs).
             - BINDING_TYPE_AGENT: Token is bound to an agent (SATs). The agent's kind (TERRAFORM or
            KUBERNETES) is carried on the agent itself.
    v1CallbackResponse:
        type: object
        description: |-
            CallbackResponse is empty on success. The server sets a session cookie
            and redirects the browser to the original redirect_url.
    v1CancelRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: The canceled run.
        description: CancelRunResponse contains the updated run.
    v1CatalogItem:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the catalog item (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "billing-vpc", "rds-standard").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the catalog item's purpose
                    (e.g., "Standard VPC module for billing workloads").
            type:
                $ref: '#/definitions/v1CatalogItemType'
                description: |-
                    The content type: what this item contains and how it should be executed.
                    Immutable after creation.
            source_id:
                type: string
                description: Reference to the Source this catalog item fetches from (UUID).
            ref:
                type: string
                description: |-
                    Git ref, registry version, chart version, or OCI tag to fetch.
                    Optional. When empty, the backend uses its default (e.g., HEAD for Git,
                    latest for registries). This is the default a component copies at create
                    time; the component owns its ref thereafter.
            root:
                type: string
                description: |-
                    Subdirectory within the fetched tree to treat as the item root.
                    Optional. When empty, the entire fetched tree is the root.
                    Example: "modules/vpc" within a monorepo.
            path:
                type: string
                description: |-
                    Working directory within root for execution (e.g., "environments/prod").
                    Optional. When empty, defaults to root itself.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering catalog items
                    (e.g., `{"team": "platform", "stack": "networking"}`).
            source_name:
                type: string
                description: Display name of the parent source. Denormalized for display.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this catalog item (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the catalog item was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the catalog item was last updated.
                readOnly: true
        description: |-
            CatalogItem represents a named, reusable reference to a slice of content
            within a Source at a specific ref. One Source can back many catalog items
            (different refs, different subtrees, different working directories).

            The catalog item type identifies what the content is (Terraform, Helm,
            Kustomize, raw manifests) independently of how it is fetched (the Source
            type). This separation allows a single Git source to back Terraform, Helm,
            and manifest items in different subdirectories.

            A catalog item is a starting point: components are instantiated FROM it as
            self-contained copies (copy-not-link), so editing or deleting an item never
            mutates already-placed components.
    v1CatalogItemType:
        type: string
        enum:
            - CATALOG_ITEM_TYPE_UNSPECIFIED
            - CATALOG_ITEM_TYPE_TERRAFORM
            - CATALOG_ITEM_TYPE_HELM
            - CATALOG_ITEM_TYPE_KUSTOMIZE
            - CATALOG_ITEM_TYPE_MANIFEST
        default: CATALOG_ITEM_TYPE_UNSPECIFIED
        description: |-
            CatalogItemType identifies the content semantics: what the fetched content is
            and how it should be executed. This is orthogonal to SourceType, which
            identifies the fetch protocol. A single GIT source can back TERRAFORM, HELM,
            KUSTOMIZE, and MANIFEST items in different subdirectories.

             - CATALOG_ITEM_TYPE_UNSPECIFIED: Default value. Must not be used.
             - CATALOG_ITEM_TYPE_TERRAFORM: Terraform root module. Contains main.tf, variables.tf, etc. Executed via
            `terraform init/plan/apply`. Works with GIT, TERRAFORM, and HTTP sources.
             - CATALOG_ITEM_TYPE_HELM: Helm chart. Contains Chart.yaml, values.yaml, templates/. Rendered via
            `helm template` or installed via `helm install`. Works with GIT, HELM,
            OCI, and HTTP sources.
             - CATALOG_ITEM_TYPE_KUSTOMIZE: Kustomize overlay. Contains kustomization.yaml. Rendered via
            `kustomize build`. Works with GIT and HTTP sources.
             - CATALOG_ITEM_TYPE_MANIFEST: Raw Kubernetes manifests. Applied directly via `kubectl apply`. Works with
            GIT and HTTP sources.
    v1CatalogItemVersionDiff:
        type: object
        properties:
            catalog_item_id_old:
                type: string
                description: Catalog item UUID before the change.
            catalog_item_id_new:
                type: string
                description: Catalog item UUID after the change.
            catalog_item_name_old:
                type: string
                description: Catalog item name before the change (denormalized for display).
            catalog_item_name_new:
                type: string
                description: Catalog item name after the change (denormalized for display).
            ref_old:
                type: string
                description: Ref (git ref / version selector) before the change.
            ref_new:
                type: string
                description: Ref (git ref / version selector) after the change.
        description: |-
            CatalogItemVersionDiff describes a catalog-item-id and/or version change on
            an entry. Absent halves mean "unset." Both halves can be absent for CREATE
            entries whose catalog item fields aren't being changed (caller still emits
            the new values).
    v1ChangeSet:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the change set (UUID).
                readOnly: true
            application_id:
                type: string
                description: The application this change set targets (UUID).
                readOnly: true
            environment_id:
                type: string
                description: The environment this change set targets (UUID).
                readOnly: true
            status:
                $ref: '#/definitions/v1ChangeSetStatus'
                description: Lifecycle status of this change set.
                readOnly: true
            copied_from_id:
                type: string
                description: |-
                    If this change set was created via CopyChangeSet, the UUID of the source
                    change set. Forms the promotion chain (e.g., dev -> staging -> prod).
                    Empty for change sets created directly via CreateChangeSet.
                readOnly: true
            title:
                type: string
                description: Human-readable title for the change set (e.g., "Bump database version").
            description:
                type: string
                description: Optional longer description of what the change set proposes.
            deploy_run_id:
                type: string
                description: |-
                    The run that deployed this change set (UUID). Populated when status
                    transitions to DEPLOYED. Empty otherwise. Note: many runs may target a
                    change set over its life (via runs.change_set_id); this is the single run
                    that closed it.
                readOnly: true
            entries:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ChangeSetEntry'
                description: |-
                    Component entries proposed by this change set. Populated by GetChangeSet;
                    empty in ListChangeSets responses.
                readOnly: true
            variable_entries:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ChangeSetVariableEntry'
                description: |-
                    Variable entries proposed by this change set. Populated by GetChangeSet;
                    empty in ListChangeSets responses.
                readOnly: true
            display_id:
                type: string
                description: |-
                    Typed display identifier of the form `cs-<12-char-suffix>` (e.g.,
                    `cs-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                    over `id` for user-facing references; lookups accept either form.
                readOnly: true
            application_name:
                type: string
                description: Display name of the parent application. Denormalized for display.
                readOnly: true
            environment_name:
                type: string
                description: Display name of the parent environment. Denormalized for display.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: |-
                    The user or agent that created this change set
                    (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the change set was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: |-
                    When the change set was last updated (metadata, entries, variable
                    entries, or status).
                readOnly: true
        description: |-
            ChangeSet is a scoped, isolated proposal to mutate the deployed state of an
            application within a single environment.

            The change set holds two kinds of proposals:
              - Component entries: per-name deltas (CREATE/UPDATE/DESTROY/ORPHAN).
              - Variable entries: per-key set or delete-on-apply.
    v1ChangeSetDiff:
        type: object
        properties:
            entries:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1EntryDiff'
                description: Per-component entry deltas, ordered by component name.
            variables:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1VariableDiff'
                description: Per-key variable deltas, ordered by key.
            downstream:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1DownstreamImpact'
                description: |-
                    Deployed components affected by changes to the entries above (static
                    graph walk over `values_template` references).
        description: |-
            ChangeSetDiff describes what a change set would change relative to current
            environment HEAD: per-component entries, per-key variable changes, and the
            deployed components whose `values_template` references a name touched by
            this change set.
    v1ChangeSetEntry:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the entry (UUID).
            change_set_id:
                type: string
                description: The change set this entry belongs to (UUID).
            component_id:
                type: string
                description: |-
                    The component this entry targets (UUID). Absent for CREATE entries
                    (the component does not exist yet).
            component_name:
                type: string
                description: |-
                    Component name (stable identifier set at creation). Required for all
                    entries. For CREATE entries, this is the name of the component to be
                    created. For UPDATE/DESTROY/ORPHAN entries, this matches an existing
                    component in the application.
            change_type:
                $ref: '#/definitions/v1ChangeSetEntryType'
                description: The change type.
            catalog_item_id:
                type: string
                description: |-
                    The catalog item to deploy (UUID). Required for CREATE; optional for UPDATE
                    (if changing the catalog item); not allowed for DESTROY/ORPHAN.
            ref:
                type: string
                title: |-
                    The git ref / version selector to deploy (e.g., tag, branch, or commit SHA).
                    On CREATE, defaults to the catalog item's ref when absent. For UPDATE
                    entries, absent means "no change to ref."
            values_template:
                type: string
                title: |-
                    Values template for catalog item inputs. For UPDATE entries, absent means
                    "no change to values_template."
            depends_on:
                type: array
                items:
                    type: string
                description: |-
                    Explicit dependencies (component names). Whatever the client sends is
                    recorded; an empty list clears existing dependencies. Not allowed for
                    DESTROY/ORPHAN entries. Names may reference components materialized
                    earlier in the same change set (their UUIDs do not exist until apply).
            description:
                type: string
                title: |-
                    Optional description for the proposed change (e.g., "Bump to v2.1.0
                    for performance fix"). For UPDATE entries, absent means "no change."
            catalog_item_name:
                type: string
                description: |-
                    Display name of the referenced catalog item. Denormalized for display.
                    Read-only; ignored on writes.
            created_at:
                type: string
                format: date-time
                description: When the entry was created.
            updated_at:
                type: string
                format: date-time
                description: When the entry was last replaced.
            target:
                $ref: '#/definitions/v1ComponentTarget'
                description: |-
                    Resolved placement for the component: the agent it deploys on (plus a
                    namespace for WORKLOAD components). Copied onto the component at deploy
                    time; the environment is no longer the source of truth for placement.
        description: |-
            ChangeSetEntry is a per-component proposal within a change set.

            Patch semantics: optional fields that are absent mean "no change relative
            to the component's current state at deploy time." Required fields per
            `change_type`:
              - CREATE: `catalog_item_id` required; `component_id` must be empty.
              - UPDATE: `component_id` required; at least one optional field set.
              - DESTROY / ORPHAN: `component_id` required; no patch fields allowed.
    v1ChangeSetEntryType:
        type: string
        enum:
            - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
            - CHANGE_SET_ENTRY_TYPE_CREATE
            - CHANGE_SET_ENTRY_TYPE_UPDATE
            - CHANGE_SET_ENTRY_TYPE_DESTROY
            - CHANGE_SET_ENTRY_TYPE_ORPHAN
        default: CHANGE_SET_ENTRY_TYPE_UNSPECIFIED
        description: |-
            ChangeSetEntryType selects what the entry does to the targeted component.

             - CHANGE_SET_ENTRY_TYPE_UNSPECIFIED: Default value. Must not be used.
             - CHANGE_SET_ENTRY_TYPE_CREATE: Add a new component. Requires catalog_item_id; rejects if a component with
            the same name already exists in the (application, environment) pair.
             - CHANGE_SET_ENTRY_TYPE_UPDATE: Change an existing component. The name must match an existing component
            in the (application, environment) pair. Only non-empty optional fields
            are recorded as changes.
             - CHANGE_SET_ENTRY_TYPE_DESTROY: Schedule the component for terraform destroy at deploy.
             - CHANGE_SET_ENTRY_TYPE_ORPHAN: Detach from management without destroying infrastructure.
    v1ChangeSetStatus:
        type: string
        enum:
            - CHANGE_SET_STATUS_UNSPECIFIED
            - CHANGE_SET_STATUS_OPEN
            - CHANGE_SET_STATUS_DEPLOYED
            - CHANGE_SET_STATUS_DISCARDED
        default: CHANGE_SET_STATUS_UNSPECIFIED
        description: |-
            ChangeSetStatus is the lifecycle state of a change set. Only OPEN change
            sets can be mutated. DEPLOYED is reached when a run referencing the change
            set succeeds; DISCARDED is reached via DiscardChangeSet.

             - CHANGE_SET_STATUS_UNSPECIFIED: Default value. Must not be used.
             - CHANGE_SET_STATUS_OPEN: Mutable; entries and variable entries may be added/removed; runs may be
            planned and applied against this change set.
             - CHANGE_SET_STATUS_DEPLOYED: Terminal: the change set was successfully applied via a run.
             - CHANGE_SET_STATUS_DISCARDED: Terminal: the change set was discarded by the operator.
    v1ChangeSetVariableEntry:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the variable entry (UUID).
            change_set_id:
                type: string
                description: The change set this entry belongs to (UUID).
            key:
                type: string
                description: The variable key (e.g., "TF_VAR_region", "IMAGE_TAG").
            value:
                type: string
                description: |-
                    The value to set on apply. Absent means "delete this key on apply"
                    (tombstone). Masked in responses when `sensitive` is true.
            type:
                $ref: '#/definitions/v1VariableType'
                description: |-
                    How the value should be interpreted by the rendering engine and
                    displayed in the UI.
            sensitive:
                type: boolean
                description: When true, the value is encrypted at rest and masked in API responses.
            created_at:
                type: string
                format: date-time
                description: When the variable entry was created or last replaced.
        description: |-
            ChangeSetVariableEntry is a per-key variable proposal within a change set.

            At deploy time, each variable entry is applied to the change set's
            environment: an entry with `value` set upserts the key, and an entry with
            `value` absent (a tombstone) removes the key.
    v1ChangeSummary:
        type: object
        properties:
            creates:
                type: integer
                format: int32
                description: Number of resources to be created.
            updates:
                type: integer
                format: int32
                description: Number of resources to be updated in place.
            deletes:
                type: integer
                format: int32
                description: Number of resources to be deleted.
            noops:
                type: integer
                format: int32
                description: Number of resources left unchanged (no-op).
        description: |-
            ChangeSummary is the normalized, executor-agnostic count of what an
            execution does: creates, updates, deletes, and no-ops. Every executor maps
            its native result onto this shape -- terraform's +/~/- plan counts and
            kubernetes server-side-apply created/configured/deleted.
    v1ClaimJobRequest:
        type: object
        description: |-
            ClaimJobRequest is sent by a TERRAFORM agent to poll for available work. The
            agent is identified by the SAT's binding; no agent_id is required.
    v1ClaimJobResponse:
        type: object
        properties:
            job:
                $ref: '#/definitions/v1Job'
                description: |-
                    The job to execute. Absent if no work is available; the agent should wait and
                    poll again after its configured interval.
        description: ClaimJobResponse contains the next job to execute, if any.
    v1ClearAgentIdentityBindingResponse:
        type: object
        properties:
            accepted:
                type: boolean
                description: Whether the rebind grace window was opened.
            expires_at:
                type: string
                format: date-time
                description: When the grace window expires.
        description: ClearAgentIdentityBindingResponse acknowledges the rebind window.
    v1ComponentTarget:
        type: object
        properties:
            agent_id:
                type: string
                description: |-
                    The agent this component is placed on (UUID). A KUBERNETES agent for
                    WORKLOAD components; a TERRAFORM agent for INFRASTRUCTURE components.
            namespace:
                type: string
                description: |-
                    WORKLOAD only: the target namespace (defaults to the environment name
                    when empty).
        description: |-
            ComponentTarget is a component's resolved placement on an agent, selected by
            the component's kind. Authored on a Changeset Change and copied onto the
            component (it is the source of truth at runtime, not the environment).
    v1Condition:
        type: object
        properties:
            type:
                type: string
                description: Condition type (e.g., "Ready", "Healthy").
            status:
                type: string
                description: 'Condition status: "True", "False", or "Unknown".'
            observed_generation:
                type: string
                format: int64
                description: The .metadata.generation the condition was set against.
            reason:
                type: string
                description: Short machine-readable reason for the condition's last transition.
            message:
                type: string
                description: Human-readable detail for the condition's last transition.
            last_transition_time:
                type: string
                format: date-time
                description: When the condition last transitioned.
        description: |-
            Condition mirrors the standard Kubernetes condition shape, carried explicitly
            so the wire shape stays stable across SDK versions.
    v1ContainerStatus:
        type: object
        properties:
            name:
                type: string
                description: Container name within the pod spec.
            image:
                type: string
                description: Container image reference (e.g., "registry.example.com/api:v2.1.4").
            restart_count:
                type: integer
                format: int32
                description: Cumulative number of container restarts.
            state:
                type: string
                description: Current container state (e.g., "running", "waiting", "terminated").
            ready:
                type: boolean
                description: Whether the container's readiness probe is passing.
        description: ContainerStatus describes the current state of a single container.
    v1CopyChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: The new change set with `copied_from_id` set to the source.
        description: CopyChangeSetResponse contains the newly created change set.
    v1CreateAgentRequest:
        type: object
        properties:
            kind:
                $ref: '#/definitions/v1AgentKind'
                description: |-
                    The execution plane this agent serves (TERRAFORM or KUBERNETES). Selects the
                    SAT's auto-assigned scopes and is immutable.
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod-terraform"). Unique within
                    the tenant. Lowercase alphanumeric and hyphens only, must start with a
                    letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional longer-form description of the agent's purpose.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels for organizing and filtering agents.
        description: CreateAgentRequest contains the parameters for creating a new agent.
        required:
            - kind
            - name
    v1CreateAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
                description: The created agent. Health status will be PENDING until it begins reporting.
            plain_text_token:
                type: string
                description: |-
                    The raw Service Access Token secret (e.g., "adms_pL2mN5oQ8rS1..."). Shown
                    exactly once and cannot be retrieved again. Deploy this token to the agent
                    binary for authentication. For additional tokens, use CreateAgentToken.
        description: CreateAgentResponse contains the newly created agent and its initial SAT.
    v1CreateAgentTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The created token metadata. Scopes are auto-assigned from the agent's kind.
            plain_text_token:
                type: string
                description: The raw token secret. Shown exactly once and cannot be retrieved again.
        description: CreateAgentTokenResponse contains the newly created SAT.
    v1CreateApplicationRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                    the tenant. Lowercase alphanumeric and hyphens only, must start with a
                    letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional longer-form description of the application's purpose.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels for organizing and filtering applications.
        description: CreateApplicationRequest contains the parameters for creating a new application.
        required:
            - name
    v1CreateApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The created application.
        description: CreateApplicationResponse contains the newly created application.
    v1CreateCatalogItemRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "billing-vpc", "rds-standard").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional description of the catalog item's purpose.
            type:
                $ref: '#/definitions/v1CatalogItemType'
                description: 'The content type: what this item contains and how it should be executed.'
            source_id:
                type: string
                description: Reference to the Source this catalog item fetches from (UUID).
            ref:
                type: string
                description: |-
                    Git ref, registry version, chart version, or OCI tag to fetch.
                    Optional. When empty, the backend uses its default (e.g., HEAD for Git,
                    latest for registries). This is the default a component copies at create
                    time; the component owns its ref thereafter.
            root:
                type: string
                description: |-
                    Subdirectory within the fetched tree to treat as the item root.
                    Optional. When empty, the entire fetched tree is the root.
                    Example: "modules/vpc" within a monorepo.
            path:
                type: string
                description: |-
                    Working directory within root for execution (e.g., "environments/prod").
                    Optional. When empty, defaults to root itself.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels.
        description: CreateCatalogItemRequest contains the parameters for creating a new item.
        required:
            - name
            - type
            - source_id
    v1CreateCatalogItemResponse:
        type: object
        properties:
            catalog_item:
                $ref: '#/definitions/v1CatalogItem'
                description: The created catalog item.
        description: CreateCatalogItemResponse contains the newly created catalog item.
    v1CreateChangeSetRequest:
        type: object
        properties:
            application_id:
                type: string
                description: The application this change set targets (UUID).
            environment_id:
                type: string
                description: The environment this change set targets (UUID).
            title:
                type: string
                description: Optional human-readable title (e.g., "Bump database version").
            description:
                type: string
                description: Optional longer description of what the change set proposes.
        description: |-
            CreateChangeSetRequest opens a new change set for an (application,
            environment) pair.
        required:
            - application_id
            - environment_id
    v1CreateChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: |-
                    The created change set. Status is OPEN; entries and variable entries
                    are empty.
        description: CreateChangeSetResponse contains the newly created change set.
    v1CreateCredentialRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "github-org", "ecr-prod").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional description of the credential's purpose.
            type:
                $ref: '#/definitions/v1CredentialType'
                description: The type of external system and authentication mechanism.
            auth_config:
                $ref: '#/definitions/v1AuthConfig'
                description: Auth material corresponding to `type`.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels for organizing and filtering credentials.
        description: CreateCredentialRequest contains the parameters for creating a new credential.
        required:
            - name
            - type
            - auth_config
    v1CreateCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
                description: The created credential. Auth config sensitive fields are masked.
        description: CreateCredentialResponse contains the newly created credential.
    v1CreateEnvironmentRequest:
        type: object
        properties:
            application_id:
                type: string
                description: The application to create this environment for (UUID).
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                    Unique within the application. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional longer-form description of the environment's purpose.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels for organizing and filtering environments.
        description: CreateEnvironmentRequest contains the parameters for creating a new environment.
        required:
            - application_id
            - name
    v1CreateEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The created environment.
        description: CreateEnvironmentResponse contains the newly created environment.
    v1CreatePersonalAccessTokenRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier for the token (e.g., "postman-testing").
                    Unique per user within the tenant. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            scopes:
                type: array
                items:
                    type: string
                description: |-
                    The scopes to grant this token. Must be valid scopes allowed for PATs.
                    The server enforces that issued scopes are a subset of the caller's own
                    scopes. A token cannot grant more access than the user holds.
            expires_at:
                type: string
                format: date-time
                description: |-
                    Optional expiration time. If unset, the token does not expire.
                    Tenant policies may enforce a maximum lifetime.
        description: CreatePersonalAccessTokenRequest contains the parameters for creating a new PAT.
        required:
            - name
    v1CreatePersonalAccessTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The created token metadata.
            plain_text_token:
                type: string
                description: |-
                    The raw token secret (e.g., "admp_7kH3mNqR2xFb..."). This value is
                    shown exactly once and cannot be retrieved again. Store it securely.
        description: CreatePersonalAccessTokenResponse contains the newly created PAT.
    v1CreateRunRequest:
        type: object
        properties:
            application_id:
                type: string
                description: The application to run (UUID).
            environment_id:
                type: string
                description: The target environment (UUID).
            message:
                type: string
                description: Optional message describing this run.
            source_run_id:
                type: string
                description: |-
                    Optional: run from a prior run's configuration snapshots instead of
                    from the current component HEAD. When set, each revision is seeded
                    from the source run's revision for the same component (catalog_item_id,
                    version, resolved_values, source_id, working_directory). This is the
                    rollback mechanism: re-plan and re-apply a known-good configuration
                    against the current infrastructure state.
            change_set_id:
                type: string
                description: |-
                    Optional: run the entries and variable changes captured in a change
                    set. When set, the component set and variable overlay are sourced from
                    the change set instead of the application's full component list. The
                    change set must be OPEN and target the same (application, environment).
        description: CreateRunRequest triggers a new run.
        required:
            - application_id
            - environment_id
    v1CreateRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: The created run. Status will be PENDING initially.
        description: CreateRunResponse contains the newly created run.
    v1CreateSourceRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "corporate-rds", "nginx-chart").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional description of the source's purpose.
            type:
                $ref: '#/definitions/v1SourceType'
                description: The kind of artifact and fetch protocol.
            url:
                type: string
                description: Base URL for the source (see Source.url for per-type semantics).
            credential_id:
                type: string
                description: |-
                    Reference to the credential providing authentication (UUID). Optional for
                    public sources.
            source_config:
                $ref: '#/definitions/v1SourceConfig'
                description: |-
                    Type-specific configuration. Only required for TERRAFORM and HELM;
                    omit for GIT, OCI, HTTP.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels.
        description: CreateSourceRequest contains the parameters for creating a new source.
        required:
            - name
            - type
            - url
    v1CreateSourceResponse:
        type: object
        properties:
            source:
                $ref: '#/definitions/v1Source'
                description: The created source.
        description: CreateSourceResponse contains the newly created source.
    v1Credential:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the credential (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "github-org", "ecr-prod").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of what this credential is for
                    (e.g., "Read-only access to the platform team's GitHub org").
            type:
                $ref: '#/definitions/v1CredentialType'
                description: |-
                    The type of external system and authentication mechanism.
                    Immutable after creation.
            auth_config:
                $ref: '#/definitions/v1AuthConfig'
                description: |-
                    Auth material corresponding to `type`. Sensitive fields are write-only
                    and masked in responses.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering credentials
                    (e.g., `{"team": "platform", "environment": "prod"}`).
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this credential (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the credential was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the credential was last updated.
                readOnly: true
        description: |-
            Credential represents stored authentication configuration for accessing an
            external system. Credentials are tenant-scoped and referenced by sources
            when fetching artifacts.

            Sensitive fields within auth_config are write-only: accepted on create and
            update but never returned in API responses.
    v1CredentialType:
        type: string
        enum:
            - CREDENTIAL_TYPE_UNSPECIFIED
            - CREDENTIAL_TYPE_SSH_KEY
            - CREDENTIAL_TYPE_BASIC_AUTH
            - CREDENTIAL_TYPE_BEARER_TOKEN
        default: CREDENTIAL_TYPE_UNSPECIFIED
        description: |-
            CredentialType identifies the shape of the stored auth material (the
            mechanism), not the system it targets. The target system is determined by
            the Source that references the credential. One credential can be reused
            across multiple Sources of different types, provided the Source accepts
            that credential type (see the Source compatibility matrix).

             - CREDENTIAL_TYPE_UNSPECIFIED: Default value. Must not be used.
             - CREDENTIAL_TYPE_SSH_KEY: SSH private key (with optional passphrase). Used for SSH-protocol Git
            sources.
             - CREDENTIAL_TYPE_BASIC_AUTH: HTTP Basic auth (username + password). Used for Helm HTTP repos, OCI
            registries, authenticated HTTP archives, and Git HTTPS.
             - CREDENTIAL_TYPE_BEARER_TOKEN: Single token value. Presented per target protocol: as
            `Authorization: Bearer <token>` for Terraform / Helm / OCI bearer-auth
            endpoints, or as the HTTP Basic password (with a dummy username) for
            Git HTTPS tokens (GitHub PAT, GitLab PAT, Bitbucket app password).
    v1DeleteAgentResponse:
        type: object
        description: DeleteAgentResponse is empty on success.
    v1DeleteApplicationResponse:
        type: object
        description: DeleteApplicationResponse is empty on success.
    v1DeleteCatalogItemResponse:
        type: object
        description: DeleteCatalogItemResponse is empty on success.
    v1DeleteCredentialResponse:
        type: object
        description: DeleteCredentialResponse is empty on success.
    v1DeleteEnvironmentResponse:
        type: object
        description: DeleteEnvironmentResponse is empty on success.
    v1DeleteSourceResponse:
        type: object
        description: DeleteSourceResponse is empty on success.
    v1DiffChangeSetResponse:
        type: object
        properties:
            diff:
                $ref: '#/definitions/v1ChangeSetDiff'
                description: |-
                    The structural diff. Empty `entries`, `variables`, and `downstream` lists
                    mean the change set proposes no changes relative to current state.
        description: DiffChangeSetResponse contains the computed diff.
    v1DiffChangeType:
        type: string
        enum:
            - DIFF_CHANGE_TYPE_UNSPECIFIED
            - DIFF_CHANGE_TYPE_ADDED
            - DIFF_CHANGE_TYPE_CHANGED
            - DIFF_CHANGE_TYPE_REMOVED
        default: DIFF_CHANGE_TYPE_UNSPECIFIED
        description: |-
            DiffChangeType classifies a single change inside a ChangeSetDiff:
            per-key value changes inside an entry's values_template, or per-key
            variable changes.

             - DIFF_CHANGE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - DIFF_CHANGE_TYPE_ADDED: The key is set by this change set; absent from the previous state.
             - DIFF_CHANGE_TYPE_CHANGED: The key has a different value/type/sensitivity in this change set.
             - DIFF_CHANGE_TYPE_REMOVED: The key was present previously and the change set removes it (a
            tombstone for variables; an entry removal for value-template keys).
    v1DiscardChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: The change set with status set to DISCARDED.
        description: DiscardChangeSetResponse contains the discarded change set.
    v1DownstreamImpact:
        type: object
        properties:
            component_name:
                type: string
                description: Name of the deployed component that will be affected.
            affected_by:
                type: array
                items:
                    type: string
                description: |-
                    Names in this change set whose outputs the deployed component
                    references.
        description: |-
            DownstreamImpact lists deployed components whose `values_template`
            references the outputs of a component touched by this change set. Surfaces
            the "if you apply this, these other components will also re-plan" set.
    v1Engine:
        type: string
        enum:
            - ENGINE_UNSPECIFIED
            - ENGINE_TERRAFORM
            - ENGINE_TOFU
        default: ENGINE_UNSPECIFIED
        description: |-
            Engine identifies which infrastructure-as-code binary executes the job.
            Deliberately narrow: only the terraform-semantic engines Admiral manages as
            first-class citizens. Wrapper tools (e.g., terragrunt) and non-terraform-
            semantic engines (Pulumi, CDK) are intentionally out of scope; users shell
            out to them via hooks if needed.

             - ENGINE_UNSPECIFIED: Default value. Must not be used.
             - ENGINE_TERRAFORM: HashiCorp Terraform.
             - ENGINE_TOFU: OpenTofu.
    v1EngineOutput:
        type: object
        properties:
            value:
                type: string
                description: |-
                    The output value, serialized as a string. Complex values (lists, maps)
                    are JSON-encoded.
            type:
                type: string
                description: Engine type descriptor (e.g. "string", "number", "list(string)").
            sensitive:
                type: boolean
                description: Whether the executor marked this output as sensitive.
        description: |-
            EngineOutput is a single output value captured from an executor after a
            successful apply (e.g. `terraform output -json`). Engine-agnostic: the
            (value, type, sensitive) shape generalizes across executors. Lives in run/v1
            so it can be shared by the TERRAFORM and KUBERNETES agent report paths via
            ExecutionReport.
    v1EntryDiff:
        type: object
        properties:
            component_name:
                type: string
                description: Component name this entry targets.
            change_type:
                $ref: '#/definitions/v1ChangeSetEntryType'
                description: Change kind.
            catalog_item:
                $ref: '#/definitions/v1CatalogItemVersionDiff'
                description: Catalog item / version delta. Absent when neither field changes.
            values:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ValueDiff'
                description: |-
                    Per-key value-template deltas. Today this contains a single ValueDiff
                    keyed `values_template` carrying the full template text so reviewers
                    can read the new template.
            depends_on_added:
                type: array
                items:
                    type: string
                description: Names added to depends_on by this entry.
            depends_on_removed:
                type: array
                items:
                    type: string
                description: Names removed from depends_on by this entry.
            description_old:
                type: string
                description: Old description (UPDATE only, when the entry sets description).
            description_new:
                type: string
                description: New description (CREATE/UPDATE only).
        description: |-
            EntryDiff describes a single component entry's effect.

            For CREATE entries, `catalog_item`/`values`/`depends_on_added` describe the
            proposed new component; the `_old` halves are absent.
            For UPDATE entries, only fields the entry actually changes appear; absent
            patch fields mean "no change."
            For DESTROY/ORPHAN entries, `catalog_item`/`values`/`depends_on_*` are absent.
    v1Environment:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the environment (UUID).
                readOnly: true
            application_id:
                type: string
                description: The application this environment belongs to (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                    Unique within the application. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the environment's purpose
                    (e.g., "US East production serving live traffic" or
                    "Shared staging for QA validation before prod promotion").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering environments
                    (e.g., `{"region": "us-east-1", "tier": "production"}`).
            has_pending_changes:
                type: boolean
                description: |-
                    Whether the environment has configuration changes that have not yet been
                    deployed. Server-derived by comparing current resolved config (variables,
                    component settings, overrides, source versions) against the last
                    successful run's snapshot. False if no successful run exists yet (a
                    fresh environment with no runs returns false; use `last_deployed_at`
                    to distinguish "clean" from "never deployed").
                readOnly: true
            last_deployed_at:
                type: string
                format: date-time
                description: |-
                    When the last successful run for this environment completed. Absent if
                    no successful run has occurred yet.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this environment (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the environment was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the environment was last updated.
                readOnly: true
        description: |-
            Environment represents a named deployment target for an application
            (e.g., dev, staging, prod). Each environment carries its own configuration
            and variables; promotion between environments is explicit.
    v1EnvironmentComponent:
        type: object
        properties:
            name:
                type: string
                description: Component name (stable identifier set at creation).
            catalog_item_type:
                $ref: '#/definitions/v1CatalogItemType'
                description: |-
                    Engine type the component renders against (TERRAFORM, HELM, etc),
                    denormalized from the component's own deploy spec.
            ref:
                type: string
                description: The git ref / version selector the component deploys.
            last_revision_id:
                type: string
                description: |-
                    ID of the last-succeeded revision for this component in this env, if
                    any (UUID). Empty when the component has never reached SUCCEEDED.
            last_revision_status:
                $ref: '#/definitions/v1RevisionStatus'
                description: |-
                    Status of the last revision (SUCCEEDED when populated). UNSPECIFIED
                    means the component has no last-succeeded revision yet.
            last_deployed_at:
                type: string
                format: date-time
                description: When the last-succeeded revision completed.
        description: |-
            EnvironmentComponent is a denormalized view of a deployed component for
            `ListEnvironmentComponents`. It joins the component's HEAD with the
            component's last-succeeded revision so the CLI can render an at-a-glance
            status row without follow-up calls.
    v1ExecutionReport:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1ExecutionStatus'
                description: Terminal status of the phase.
            error_message:
                type: string
                description: Error message if the phase failed. Empty on success.
            summary:
                $ref: '#/definitions/v1ChangeSummary'
                description: Normalized change counts (create/update/delete/noop).
            outputs:
                type: object
                additionalProperties:
                    $ref: '#/definitions/v1EngineOutput'
                description: Outputs captured after a successful apply. Keys are output names.
            artifact:
                $ref: '#/definitions/v1ArtifactRef'
                description: |-
                    Optional reference to an artifact this phase produced (e.g. a terraform
                    PLAN). Recorded into the revision's artifact set when present.
            transcript:
                type: string
                title: |-
                    The phase's human-readable execution log (e.g. terraform plan/apply
                    output). Persisted as the phase transcript. (Interim: live log streaming
                    moves to a dedicated channel in a later phase.)
            detail:
                type: string
                format: byte
                description: |-
                    Opaque, per-executor richness, never branched on by the orchestration
                    layer. JSON-encoded.
        description: |-
            ExecutionReport is the executor-agnostic outcome of one revision phase --
            the single report shape every executor maps its native result onto. It
            supersedes the terraform-shaped JobResult and the kubernetes RevisionResult:
            the TERRAFORM and KUBERNETES agents both report via this message.
    v1ExecutionStatus:
        type: string
        enum:
            - EXECUTION_STATUS_UNSPECIFIED
            - EXECUTION_STATUS_SUCCEEDED
            - EXECUTION_STATUS_FAILED
        default: EXECUTION_STATUS_UNSPECIFIED
        description: |-
            ExecutionStatus is the terminal outcome an executor reports for a phase.
            Non-terminal progress (RUNNING) is observed server-side, not reported here.

             - EXECUTION_STATUS_UNSPECIFIED: Default value. Must not be used.
             - EXECUTION_STATUS_SUCCEEDED: The phase completed successfully.
             - EXECUTION_STATUS_FAILED: The phase failed. See error_message.
    v1GetAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
                description: The retrieved agent, including its server-derived health_status.
        description: GetAgentResponse contains the agent record.
    v1GetAgentStatusResponse:
        type: object
        properties:
            health_status:
                $ref: '#/definitions/v1AgentHealthStatus'
                description: Server-derived health status based on reporting recency and kind signals.
            terraform:
                $ref: '#/definitions/v1TerraformAgentStatus'
                description: Capacity snapshot for a TERRAFORM agent.
            kubernetes:
                $ref: '#/definitions/v1KubernetesAgentStatus'
                description: Cluster telemetry snapshot for a KUBERNETES agent.
            reported_at:
                type: string
                format: date-time
                description: When the latest report was received.
        description: |-
            GetAgentStatusResponse contains the server-derived health status and the latest
            kind-specific status snapshot. If the agent has not reported yet, health_status
            will be PENDING and status will be absent.
    v1GetAgentTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The token metadata. The token secret is never included.
        description: GetAgentTokenResponse contains the requested agent SAT metadata.
    v1GetApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The retrieved application.
        description: GetApplicationResponse contains the application record.
    v1GetCatalogItemResponse:
        type: object
        properties:
            catalog_item:
                $ref: '#/definitions/v1CatalogItem'
                description: The retrieved catalog item.
        description: GetCatalogItemResponse contains the catalog item record.
    v1GetChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: The change set, with `entries` and `variable_entries` populated.
        description: GetChangeSetResponse contains the change set with all entries inline.
    v1GetCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
                description: The retrieved credential. Sensitive fields are masked.
        description: GetCredentialResponse contains the credential record.
    v1GetEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The retrieved environment.
        description: GetEnvironmentResponse contains the environment record.
    v1GetJobBundleResponse:
        type: object
        properties:
            bundle:
                $ref: '#/definitions/v1JobBundle'
                description: The artifact bundle with everything needed to execute the operation.
        description: GetJobBundleResponse contains the rendered artifacts for execution.
    v1GetMeResponse:
        type: object
        properties:
            user:
                $ref: '#/definitions/v1User'
                description: The user profile.
        description: GetMeResponse contains the authenticated user's profile.
    v1GetPersonalAccessTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The token metadata. The token secret is never included.
        description: GetPersonalAccessTokenResponse contains the requested PAT metadata.
    v1GetRevisionBundleResponse:
        type: object
        properties:
            bundle:
                $ref: '#/definitions/v1RevisionBundle'
                description: The artifact bundle with everything needed to apply the workload.
        description: GetRevisionBundleResponse contains the rendered manifests for the revision.
    v1GetRevisionResponse:
        type: object
        properties:
            revision:
                $ref: '#/definitions/v1Revision'
                description: The revision record with current status and artifacts.
        description: GetRevisionResponse contains the revision record.
    v1GetRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: The run record with current status.
        description: GetRunResponse contains the run record.
    v1GetSourceResponse:
        type: object
        properties:
            source:
                $ref: '#/definitions/v1Source'
                description: The retrieved source.
        description: GetSourceResponse contains the source record.
    v1GetUserResponse:
        type: object
        properties:
            user:
                $ref: '#/definitions/v1User'
                description: The user profile.
        description: GetUserResponse contains the requested user's profile.
    v1GetWorkloadResponse:
        type: object
        properties:
            workload:
                $ref: '#/definitions/v1Workload'
                description: The workload with full detail.
        description: GetWorkloadResponse contains the workload with full detail.
    v1HeartbeatRequest:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1TerraformAgentStatus'
                description: Current capacity and telemetry metrics.
            instance_id:
                type: string
                description: |-
                    Random UUID generated at process startup to distinguish multiple agent
                    instances sharing the same SAT. The server tracks heartbeats per instance and
                    aggregates capacity across instances. Not persisted across restarts.
        description: |-
            HeartbeatRequest contains a TERRAFORM agent's alive signal and current capacity.
            The agent is identified by the SAT's binding; no agent_id is required.
        required:
            - status
    v1HeartbeatResponse:
        type: object
        properties:
            ack:
                type: boolean
                description: Whether the heartbeat was accepted.
            next_heartbeat_seconds:
                type: integer
                format: int32
                description: Server-controlled interval (seconds) before the next heartbeat.
        description: HeartbeatResponse acknowledges the heartbeat.
    v1HelmConfig:
        type: object
        properties:
            chart_name:
                type: string
                description: The chart name within the repository (e.g., "nginx-ingress", "redis").
        description: |-
            HelmConfig identifies which chart within a Helm HTTP repository the source
            points to. A single Helm repository hosts many charts; the chart name
            selects one.
        required:
            - chart_name
    v1Hook:
        type: object
        properties:
            script:
                type: string
                description: |-
                    The script body to execute, passed to the selected interpreter. The agent
                    closes stdin (/dev/null) so interactive prompts cannot block execution.
            timeout_seconds:
                type: integer
                format: int32
                description: |-
                    Per-script timeout in seconds. If 0, the agent applies its built-in default
                    (currently 300s). A hook that exceeds its timeout is killed and fails.
            name:
                type: string
                description: |-
                    Optional human-friendly name used in log lines (e.g., "vault-login"). Not
                    required to be unique.
            interpreter:
                $ref: '#/definitions/v1HookInterpreter'
                description: |-
                    Required. Which interpreter runs `script`. Server populates from the hook
                    config; UNSPECIFIED is rejected.
        description: |-
            Hook is a single script hook delivered with a JobBundle. Scripts are inlined by
            the server; the agent never fetches them from elsewhere.
    v1HookInterpreter:
        type: string
        enum:
            - HOOK_INTERPRETER_UNSPECIFIED
            - HOOK_INTERPRETER_BASH
        default: HOOK_INTERPRETER_UNSPECIFIED
        description: |-
            HookInterpreter selects which language the agent uses to execute a hook's
            script body. Deliberately narrow today; the enum exists primarily as forward
            plumbing so non-shell interpreters (Python, Node, etc.) can be added without a
            breaking change. Server-side SetDefaults() applies HOOK_INTERPRETER_BASH when a
            hook is created with the field unset; UNSPECIFIED on the wire is rejected.

             - HOOK_INTERPRETER_UNSPECIFIED: Default value. Must not be used.
             - HOOK_INTERPRETER_BASH: Script is executed via `bash -c`. Requires bash in the agent image.
    v1Hooks:
        type: object
        properties:
            before_init:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: Scripts to run before the init phase. Fail-fast.
            after_init:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: Scripts to run after init succeeded. Run-all; skipped if init failed.
            before_plan:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: Scripts to run before the plan phase. Fail-fast.
            after_plan:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: Scripts to run after plan succeeded. Run-all; skipped if plan failed.
            before_apply:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: Scripts to run before the apply phase. Fail-fast.
            after_apply:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: Scripts to run after apply succeeded. Run-all; skipped if apply failed.
            after_run:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Hook'
                description: |-
                    Scripts to run after the job completes, regardless of outcome. Always
                    executed (finally-semantics). Run-all.
        description: |-
            Hooks groups the seven lifecycle extension points. Scripts within a list run in
            list order. Failure behavior differs by phase:
              - `before_*` hooks are fail-fast: the first non-zero exit aborts the phase.
              - `after_*` hooks run ONLY when the corresponding engine command succeeded;
                they are run-all (individual failures are logged, not fatal).
              - `after_run` always runs (the agent's `finally`). Also run-all.
    v1Job:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the job (UUID).
            agent_id:
                type: string
                description: The agent this job is assigned to (UUID).
            revision_id:
                type: string
                description: The revision this job belongs to (UUID).
            run_id:
                type: string
                description: The run this job belongs to (UUID). Denormalized for convenience.
            job_type:
                $ref: '#/definitions/v1JobType'
                description: The type of infrastructure operation to execute.
            status:
                $ref: '#/definitions/v1JobStatus'
                description: Current lifecycle status of the job.
            started_at:
                type: string
                format: date-time
                description: When the agent started executing the job.
            completed_at:
                type: string
                format: date-time
                description: When the job finished (succeeded, failed, or canceled).
            created_at:
                type: string
                format: date-time
                description: When the job was created.
        description: |-
            Job represents an infrastructure execution job assigned to a TERRAFORM agent.
            Jobs bridge the Run/Revision system and the agent execution plane.
    v1JobBundle:
        type: object
        properties:
            artifact_url:
                type: string
                description: |-
                    Signed URL to download the rendered artifact bundle (tar.gz of the rendered
                    infrastructure source tree). Time-limited.
            artifact_checksum:
                type: string
                description: SHA-256 checksum of the artifact bundle for integrity verification.
            variables:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Resolved variable values written to the workspace as an auto-loaded tfvars
                    file. Sensitive values are included (the agent is a trusted execution
                    context). Encoding contract: the agent writes the map verbatim as HCL
                    `key = value` lines; the server produces the correct HCL literal per type.
            provider_configs:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Provider configuration blocks (JSON-encoded). Keys are provider names, values
                    are JSON objects with provider config.
            backend_config:
                type: string
                description: |-
                    Backend configuration (JSON-encoded). Contains the backend type and its
                    configuration for state storage. Engine-agnostic in shape.
            engine:
                $ref: '#/definitions/v1Engine'
                description: |-
                    Required. The infrastructure-as-code engine the agent should execute. Server
                    populates from the catalog item's declared engine; UNSPECIFIED is rejected.
            engine_version:
                type: string
                description: |-
                    Version of the selected engine (e.g., "1.7.5"). Empty means the agent uses
                    its pre-installed default. When set, the agent writes the appropriate version
                    file so tfenv/tofuenv dispatches to the matching binary. If it cannot provide
                    the requested version, the job fails fast; the server does not re-route.
            working_directory:
                type: string
                description: |-
                    Subdirectory within the extracted archive where the executor should run
                    (e.g., "modules/cloudsql"). Empty means the archive root. The broader tree is
                    preserved so relative module references resolve.
            plan_file_url:
                type: string
                description: |-
                    (Apply/destroy-apply jobs only) URL to download the binary plan file produced
                    by the preceding plan job, passed to `apply <plan_file>` so the exact reviewed
                    plan is applied. Empty for plan jobs.
            hooks:
                $ref: '#/definitions/v1Hooks'
                description: |-
                    Shell-script hooks that run before and after each engine phase. The agent
                    invokes each hook via its selected interpreter in the execution directory.
        description: |-
            JobBundle contains everything a TERRAFORM agent needs to execute an
            infrastructure operation. Fetched separately from ClaimJob to keep the claim
            response light.
    v1JobPhase:
        type: string
        enum:
            - JOB_PHASE_UNSPECIFIED
            - JOB_PHASE_INITIALIZING
            - JOB_PHASE_PLANNING
            - JOB_PHASE_APPLYING
            - JOB_PHASE_FINALIZING
        default: JOB_PHASE_UNSPECIFIED
        description: |-
            JobPhase represents the current execution phase of a job as reported by the
            TERRAFORM agent's worker thread. Used in heartbeat payloads to give the server
            visibility into job progress between ClaimJob and ReportJobResult.

             - JOB_PHASE_UNSPECIFIED: Default value. Must not be used.
             - JOB_PHASE_INITIALIZING: Downloading artifact bundle and setting up the workspace.
             - JOB_PHASE_PLANNING: Running `terraform plan` (or `tofu plan`).
             - JOB_PHASE_APPLYING: Running `terraform apply` (or `tofu apply`).
             - JOB_PHASE_FINALIZING: Uploading results and cleaning up the workspace.
    v1JobStatus:
        type: string
        enum:
            - JOB_STATUS_UNSPECIFIED
            - JOB_STATUS_PENDING
            - JOB_STATUS_ASSIGNED
            - JOB_STATUS_RUNNING
            - JOB_STATUS_SUCCEEDED
            - JOB_STATUS_FAILED
            - JOB_STATUS_CANCELED
        default: JOB_STATUS_UNSPECIFIED
        description: |-
            JobStatus represents the lifecycle state of a TERRAFORM agent job.

             - JOB_STATUS_UNSPECIFIED: Default value. Must not be used.
             - JOB_STATUS_PENDING: Job has been created but not yet assigned to an agent.
             - JOB_STATUS_ASSIGNED: Job has been assigned to an agent and is waiting to be claimed.
             - JOB_STATUS_RUNNING: Job has been claimed by the agent and is actively executing.
             - JOB_STATUS_SUCCEEDED: Job completed successfully.
             - JOB_STATUS_FAILED: Job failed. See ExecutionReport for details.
             - JOB_STATUS_CANCELED: Job was canceled (e.g., parent run was canceled).
    v1JobType:
        type: string
        enum:
            - JOB_TYPE_UNSPECIFIED
            - JOB_TYPE_PLAN
            - JOB_TYPE_APPLY
            - JOB_TYPE_DESTROY_PLAN
            - JOB_TYPE_DESTROY_APPLY
        default: JOB_TYPE_UNSPECIFIED
        description: |-
            JobType identifies the kind of infrastructure operation a job executes. The
            concrete engine (Terraform or OpenTofu) is selected per job via
            JobBundle.engine; the semantics of each type are identical across engines.

             - JOB_TYPE_UNSPECIFIED: Default value. Must not be used.
             - JOB_TYPE_PLAN: Generate an execution plan (e.g., `terraform plan` / `tofu plan`).
             - JOB_TYPE_APPLY: Apply a previously generated plan.
             - JOB_TYPE_DESTROY_PLAN: Generate a destroy plan.
             - JOB_TYPE_DESTROY_APPLY: Apply a destroy plan (tear down resources).
    v1KubernetesAgentStatus:
        type: object
        properties:
            k8s_version:
                type: string
                description: Kubernetes version reported by the agent (e.g., "1.29.2").
            node_count:
                type: integer
                format: int32
                description: Total number of nodes in the cluster.
            nodes_ready:
                type: integer
                format: int32
                description: Number of nodes in Ready condition.
            pod_capacity:
                type: integer
                format: int32
                description: Maximum number of pods the cluster can schedule.
            pod_count:
                type: integer
                format: int32
                description: Total number of pods across all namespaces.
            pods_running:
                type: integer
                format: int32
                description: Number of pods in Running phase.
            pods_pending:
                type: integer
                format: int32
                description: Number of pods in Pending phase.
            pods_failed:
                type: integer
                format: int32
                description: Number of pods in Failed phase.
            cpu_capacity_millicores:
                type: string
                format: int64
                description: Total CPU capacity across all nodes, in millicores.
            cpu_used_millicores:
                type: string
                format: int64
                description: Current CPU usage across all nodes, in millicores.
            memory_capacity_bytes:
                type: string
                format: int64
                description: Total memory capacity across all nodes, in bytes.
            memory_used_bytes:
                type: string
                format: int64
                description: Current memory usage across all nodes, in bytes.
            workloads_total:
                type: integer
                format: int32
                description: Total number of tracked workloads.
            workloads_healthy:
                type: integer
                format: int32
                description: Number of workloads in healthy state.
            workloads_degraded:
                type: integer
                format: int32
                description: Number of workloads in degraded state.
            workloads_error:
                type: integer
                format: int32
                description: Number of workloads in error state.
            metrics_available:
                type: boolean
                description: |-
                    Whether the metrics.k8s.io API is available in this cluster. When false,
                    per-workload CPU/memory collection is disabled and the UI can surface an
                    "install metrics-server" affordance.
            namespace_count:
                type: integer
                format: int32
                description: Total number of namespaces in the cluster.
        description: |-
            KubernetesAgentStatus contains cluster-level telemetry for a KUBERNETES agent,
            as reported via ReportAgentStatus. Used in both the push payload and the read
            response (GetAgentStatusResponse).

            (Successor to the former admiral.cluster.v1.ClusterStatus.)
    v1ListAgentJobsResponse:
        type: object
        properties:
            jobs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Job'
                description: The list of jobs, ordered from newest to oldest.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListAgentJobsResponse contains a page of jobs.
    v1ListAgentTokensResponse:
        type: object
        properties:
            access_tokens:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AccessToken'
                description: The list of tokens. Token secrets are never included.
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListAgentTokensResponse contains a page of agent SAT metadata.
    v1ListAgentsResponse:
        type: object
        properties:
            agents:
                type: array
                items:
                    type: object

    /v1/workload-identity-providers:
        get:
            summary: ListWorkloadIdentityProviders lists the tenant's providers.
            description: 'Scope: `agent:read`'
            operationId: WorkloadIdentityProviderAPI_ListWorkloadIdentityProviders
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListWorkloadIdentityProvidersResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `name`: filter by provider name.
                      - `status`: filter by trust status.

                    Example: `field['status'] = 'STATUS_PENDING'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - WorkloadIdentityProviderAPI
        post:
            summary: |-
                CreateWorkloadIdentityProvider records an issuer to trust: GitHub
                Actions, Google, an AWS account, or a Kubernetes cluster. Give a
                `jwks_uri` when its keys are public (GKE, EKS, GitHub, Google, AWS), the
                keys themselves when not, or neither to leave it PENDING for an agent to
                enroll (kind, minikube, on-prem).
            description: 'Scope: `agent:write`'
            operationId: WorkloadIdentityProviderAPI_CreateWorkloadIdentityProvider
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateWorkloadIdentityProviderResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateWorkloadIdentityProviderRequest'
            tags:
                - WorkloadIdentityProviderAPI
    /v1/workload-identity-providers/{provider_id}:
        get:
            summary: GetWorkloadIdentityProvider returns a provider and the key ids it trusts.
            description: 'Scope: `agent:read`'
            operationId: WorkloadIdentityProviderAPI_GetWorkloadIdentityProvider
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetWorkloadIdentityProviderResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: provider_id
                  in: path
                  required: true
                  type: string
            tags:
                - WorkloadIdentityProviderAPI
        delete:
            summary: |-
                DeleteWorkloadIdentityProvider removes a provider and the agents that authenticate
                through it. Their leases end at once.
            description: 'Scope: `agent:write`'
            operationId: WorkloadIdentityProviderAPI_DeleteWorkloadIdentityProvider
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteWorkloadIdentityProviderResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: provider_id
                  in: path
                  required: true
                  type: string
            tags:
                - WorkloadIdentityProviderAPI
    /v1/workload-identity-providers/{provider_id}/keys:
        post:
            summary: |-
                SetWorkloadIdentityProviderKeys replaces where a provider's keys come
                from, or accepts the keys an agent last reported.
            description: 'Scope: `agent:write`'
            operationId: WorkloadIdentityProviderAPI_SetWorkloadIdentityProviderKeys
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetWorkloadIdentityProviderKeysResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: provider_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/WorkloadIdentityProviderAPISetWorkloadIdentityProviderKeysBody'
            tags:
                - WorkloadIdentityProviderAPI
definitions:
    AgentAPICreateEnrollmentKeyBody:
        type: object
    AgentAPIGrantAgentUseBody:
        type: object
        properties:
            grant:
                $ref: '#/definitions/v1AgentGrant'
        required:
            - grant
    AgentAPIRevokeAgentUseBody:
        type: object
        properties:
            grant:
                $ref: '#/definitions/v1AgentGrant'
        required:
            - grant
    AgentAPIUpdateAgentBody:
        type: object
        properties:
            agent:
                type: object
                properties:
                    name:
                        type: string
                    health:
                        $ref: '#/definitions/AgentHealth'
                        readOnly: true
                    report:
                        $ref: '#/definitions/v1AgentReport'
                        description: What the agent last reported. Absent until it does.
                        readOnly: true
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        readOnly: true
                    kind:
                        $ref: '#/definitions/v1AgentKind'
                    identity:
                        $ref: '#/definitions/v1AgentIdentity'
                    settings:
                        $ref: '#/definitions/v1AgentSettings'
                    approval:
                        $ref: '#/definitions/v1ApprovalRule'
                        description: |-
                            What every apply on this agent needs from people, in every environment
                            that uses it, on top of the environment's own rule. Only the agent's
                            owner sets it, so a team using the agent cannot loosen it.
                    allowed_component_ids:
                        type: array
                        items:
                            type: string
                        description: |-
                            The components that may run on this agent, as `cmp-` ids. Empty allows
                            any. Only the agent's owner sets it; Admiral refuses to place a component
                            outside it and checks again before each job.
                description: |-
                    The agent with updated fields. Its `id` identifies the agent; only fields
                    named in `update_mask` are applied.
            update_mask:
                type: string
                description: 'Supported fields: `name`, `settings`, `approval`, `allowed_component_ids`.'
        required:
            - agent
    AgentGrantOrganization:
        type: object
        description: Organization marks a grant to every environment in the organization.
    AgentHealth:
        type: string
        enum:
            - HEALTH_UNSPECIFIED
            - HEALTH_NEW
            - HEALTH_ONLINE
            - HEALTH_OFFLINE
        default: HEALTH_UNSPECIFIED
        description: |4-
             - HEALTH_NEW: Never reported.
             - HEALTH_OFFLINE: Has not reported for longer than twice its reporting interval.
    AgentRuntimeAPIAppendJobLogBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
            offset:
                type: string
                format: int64
                description: Where this chunk starts, in bytes from the start of the log.
            chunk:
                type: string
                format: byte
                description: Output, already masked. At most 256 KiB per chunk.
        required:
            - attempt
    AgentRuntimeAPICheckJobPlanBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
            plan:
                $ref: '#/definitions/v1PlanResult'
        required:
            - attempt
            - plan
    AgentRuntimeAPIFinishJobBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
            finish_request_id:
                type: string
                description: Chosen by the agent; a retry with the same id returns the first answer.
            result:
                $ref: '#/definitions/v1JobResult'
        required:
            - attempt
            - result
    AgentRuntimeAPIGetJobArtifactBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
        required:
            - attempt
    AgentRuntimeAPIRenewJobBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
            progress:
                $ref: '#/definitions/v1Progress'
        required:
            - attempt
    AgentRuntimeAPIStartJobBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
        required:
            - attempt
    AgentRuntimeAPIUploadJobPlanDiffBody:
        type: object
        properties:
            attempt:
                type: object
                properties:
                    attempt:
                        type: integer
                        format: int32
                    lease_token:
                        type: string
                description: Attempt names the attempt a call belongs to.
            diff:
                $ref: '#/definitions/v1PlanDiff'
        required:
            - attempt
            - diff
    ApiKeyAPIRevokeApiKeyBody:
        type: object
        description: RevokeApiKeyRequest identifies an API key to revoke.
    ApiKeyAPIUpdateApiKeyBody:
        type: object
        properties:
            api_key:
                type: object
                properties:
                    name:
                        type: string
                        description: |-
                            URL-safe, human-readable identifier (e.g., "ci-deploy-key"), unique among
                            the caller's keys.
                    scopes:
                        type: array
                        items:
                            type: string
                        description: |-
                            The scopes granted to this key, and the ceiling on any access token minted
                            from it. Must be a subset of the caller's own scopes.
                    status:
                        $ref: '#/definitions/v1ApiKeyStatus'
                        readOnly: true
                    expires_at:
                        type: string
                        format: date-time
                        description: |-
                            When the key expires. Unset never expires. Fixed at creation; tenant
                            policy may cap it.
                    last_used_at:
                        type: string
                        format: date-time
                        description: |-
                            When the key was last exchanged for an access token. Minted tokens are
                            reused for their lifetime, so this reads as "still in use" at that
                            granularity, not as the time of the last request.
                        readOnly: true
                    revoked_at:
                        type: string
                        format: date-time
                        description: Set when the key was revoked.
                        readOnly: true
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        readOnly: true
                description: |-
                    The key with updated fields. Its `id` identifies the key; only fields
                    named in `update_mask` are applied.
            update_mask:
                type: string
                description: 'The set of fields to update. Supported fields: `name`, `scopes`.'
        description: UpdateApiKeyRequest updates one of the caller's keys.
        required:
            - api_key
    ApplicationAPIUpdateApplicationBody:
        type: object
        properties:
            application:
                type: object
                properties:
                    name:
                        type: string
                        description: |-
                            URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                            the tenant. Lowercase alphanumeric and hyphens only, must start with a
                            letter and end with an alphanumeric character (1-63 chars).
                    description:
                        type: string
                        description: |-
                            Optional longer-form description of the application's purpose
                            (e.g., "Core inventory service tracking warehouse stock and fulfillment").
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                        description: |-
                            Arbitrary key-value labels for organizing and filtering applications
                            (e.g., `{"team": "logistics", "tier": "critical"}`).
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        description: The user or agent who created this application (server-populated from token).
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        description: When the application was created.
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        description: When the application was last updated.
                        readOnly: true
                description: |-
                    The application with updated fields. Its `id` identifies the application;
                    only fields named in `update_mask` are applied.
            update_mask:
                type: string
                description: |-
                    The set of fields to update. Optional; if omitted, all populated fields
                    are updated. Pass `*` for full replacement. Supported fields: `name`,
                    `description`, `labels`.
        description: UpdateApplicationRequest contains the application fields to update.
        required:
            - application
    ApprovalRuleGroupApproval:
        type: object
        properties:
            group_id:
                type: string
            approvals:
                type: integer
                format: int32
        description: GroupApproval is how many members of one group must approve.
        required:
            - group_id
    ChangeSetAPIDiscardChangeSetBody:
        type: object
    ChangeSetAPIEditChangeSetBody:
        type: object
        properties:
            if_revision:
                type: integer
                format: int32
                description: When set, refused unless the head is this revision.
            edits:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Edit'
    ChangeSetAPIRebaseChangeSetBody:
        type: object
        properties:
            if_revision:
                type: integer
                format: int32
                description: When set, refused unless the head is this revision.
            resolutions:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Resolution'
                description: One for each conflict GetChangeSet lists.
    ChangeSetAPIRevertChangeSetBody:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: |-
                    The new change set's title and description. An empty title becomes
                    "Revert" and the reverted change set's title.
    ChangeSetAPIUpdateChangeSetBody:
        type: object
        properties:
            change_set:
                type: object
                properties:
                    application_id:
                        type: string
                        readOnly: true
                    environment_id:
                        type: string
                        readOnly: true
                    title:
                        type: string
                    description:
                        type: string
                    status:
                        $ref: '#/definitions/v1ChangeSetStatus'
                        readOnly: true
                    head_revision:
                        type: integer
                        format: int32
                        description: 0 until the first edit.
                        readOnly: true
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        readOnly: true
                    reverts_change_set_id:
                        type: string
                        description: |-
                            Set on a change set made by RevertChangeSet: the change set it reverts.
                            It may apply while that change set's partial apply holds the environment.
                        readOnly: true
                    behind:
                        type: boolean
                        description: |-
                            The environment moved since the head revision's base. It cannot apply
                            until RebaseChangeSet brings it up to date.
                        readOnly: true
                    latest_run_id:
                        type: string
                        description: |-
                            The change set's newest run; empty before its first. Its status is the
                            change set's progress: planning, awaiting approval, applying, failed.
                        readOnly: true
                description: |-
                    The change set with updated fields. Its `id` identifies it; only fields
                    named in `update_mask` are applied.
            update_mask:
                type: string
                description: |-
                    The fields to update. Optional; if omitted, all populated fields are
                    updated. Supported fields: `title`, `description`.

                    `environment_id` is not updatable: a change set never moves between
                    environments.
        required:
            - change_set
    CredentialAPIUpdateCredentialBody:
        type: object
        properties:
            credential:
                type: object
                properties:
                    name:
                        type: string
                        description: Unique within the tenant.
                    description:
                        type: string
                    type:
                        $ref: '#/definitions/v1CredentialType'
                        description: Immutable after creation.
                    auth_config:
                        $ref: '#/definitions/v1AuthConfig'
                        description: Write-only. Empty in every response.
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        readOnly: true
                    allowed_hosts:
                        type: array
                        items:
                            type: string
                        description: |-
                            Hosts this credential may be presented to, as a guard: empty means any
                            host its type fits; set means the platform refuses to present it
                            anywhere else, whatever it is attached to. Hostnames, optionally with
                            a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                            no path.
                    last_used_at:
                        type: string
                        format: date-time
                        description: |-
                            When a publish last decrypted this credential to present to a host,
                            whether or not the host accepted it. Updated at most every few minutes.
                            Absent if it has never been used.
                        readOnly: true
                description: |-
                    Credential is a registered credential's metadata. The secret is set
                    through `auth_config` and never read back; responses carry it empty.
            update_mask:
                type: string
                description: |-
                    Paths from `description`, `labels`, `allowed_hosts`, `auth_config`.
                    Empty means every updatable field the message carries.
        required:
            - credential
    DesiredMode:
        type: string
        enum:
            - MODE_UNSPECIFIED
            - MODE_DRIFT_CHECK
            - MODE_REAPPLY
        default: MODE_UNSPECIFIED
        description: |-
            Mode is what the run does with it.

             - MODE_DRIFT_CHECK: Check for drift: a refresh-only plan of every component, never applied.
             - MODE_REAPPLY: Reapply: a full plan of the chosen components, then apply. Its content
            was approved before, so the environment's rule does not apply; the rule
            of each agent it touches still does, since it uses their credentials.
    EnvironmentAPIUpdateEnvironmentBody:
        type: object
        properties:
            environment:
                type: object
                properties:
                    application_id:
                        type: string
                        description: The application this environment belongs to.
                        readOnly: true
                    name:
                        type: string
                        description: |-
                            URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                            Unique within the application. Lowercase alphanumeric and hyphens only,
                            must start with a letter and end with an alphanumeric character (1-63 chars).
                    description:
                        type: string
                        description: |-
                            Optional longer-form description of the environment's purpose
                            (e.g., "US East production serving live traffic" or
                            "Shared staging for QA validation before prod promotion").
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                        description: |-
                            Arbitrary key-value labels for organizing and filtering environments
                            (e.g., `{"region": "us-east-1", "tier": "production"}`).
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        description: The user or agent who created this environment (server-populated from token).
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        description: When the environment was created.
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        description: When the environment was last updated.
                        readOnly: true
                    agents:
                        type: array
                        items:
                            type: object
                            $ref: '#/definitions/v1AgentAssignment'
                        description: |-
                            The agents this environment deploys through, each with how this
                            environment uses it. Several of one kind are allowed: an IAM agent beside
                            an ordinary one, say. A component runs on the assignment its settings
                            name, or on the only one of its kind. Two environments can share an agent
                            and differ in settings, such as dev and staging in one cluster under
                            different namespaces.
                    approval:
                        $ref: '#/definitions/v1ApprovalRule'
                        description: What an apply here needs before it runs. Unset needs nothing.
                    generation:
                        type: string
                        format: int64
                        description: |-
                            Moves each time an apply changes the environment. A change set records
                            the generation it was cut from.
                        readOnly: true
                    hold:
                        $ref: '#/definitions/v1Hold'
                        description: |-
                            Set while a partial apply holds the environment. Nothing else applies
                            until the holding change set is reverted or accepted.
                        readOnly: true
                    last_apply:
                        $ref: '#/definitions/v1LastApply'
                        description: |-
                            The apply that produced the current generation. Absent until the first
                            apply changes the environment.
                        readOnly: true
                description: |-
                    The environment with updated fields.
                    Only fields specified in `update_mask` are updated.
            update_mask:
                type: string
                description: |-
                    The set of fields to update. Optional; if omitted, all populated fields
                    are updated. Pass `*` for full replacement. Supported fields: `name`,
                    `description`, `labels`, `agents`, `approval`.
        description: UpdateEnvironmentRequest contains the environment fields to update.
        required:
            - environment
    FindingCode:
        type: string
        enum:
            - CODE_UNSPECIFIED
            - CODE_LOOKUP_USED
            - CODE_NONDETERMINISTIC
            - CODE_NO_CAPABILITIES
            - CODE_SCOPE_GUESSED
        default: CODE_UNSPECIFIED
        description: |-
            Code names something a prepare noticed but did not refuse.

             - CODE_LOOKUP_USED: The chart calls `lookup`, which sees no cluster at prepare and returns
            nothing.
             - CODE_NONDETERMINISTIC: Two renders of identical inputs differ; the details name each object
            and field.
             - CODE_NO_CAPABILITIES: No cluster capabilities were reported; resources a chart includes
            conditionally may be missing.
             - CODE_SCOPE_GUESSED: A kind with no namespace was not known to be namespaced or cluster
            scoped; it was given the namespace.
    FinishJobResponseOutcome:
        type: string
        enum:
            - OUTCOME_UNSPECIFIED
            - OUTCOME_ACCEPTED
            - OUTCOME_DUPLICATE
            - OUTCOME_LATE
        default: OUTCOME_UNSPECIFIED
        description: |4-
             - OUTCOME_DUPLICATE: The same finish_request_id was already accepted.
             - OUTCOME_LATE: The attempt had lost its lease: kept as evidence, no state change.
    HeartbeatResponseKeys:
        type: string
        enum:
            - KEYS_UNSPECIFIED
            - KEYS_TRUSTED
            - KEYS_PENDING
            - KEYS_FROM_ISSUER
        default: KEYS_UNSPECIFIED
        description: |-
            Keys is how Admiral treated the keys the agent reported.

             - KEYS_UNSPECIFIED: The agent reported no keys.
             - KEYS_TRUSTED: They are the keys Admiral trusts.
             - KEYS_PENDING: They differ, and are recorded in the provider's `pending_key_ids` for
            an admin to accept.
             - KEYS_FROM_ISSUER: Not compared: this provider fetches its keys from its issuer, which
            Admiral refetches when a token names a key it has not seen.
    InvitationAPIRevokeInvitationBody:
        type: object
        description: RevokeInvitationRequest names one invitation in the caller's tenant.
    JobAPICancelJobBody:
        type: object
    PrepareErrorClass:
        type: string
        enum:
            - CLASS_UNSPECIFIED
            - CLASS_INPUT
            - CLASS_INTERNAL
        default: CLASS_UNSPECIFIED
        description: |-
            Class says whose problem it is, and so whether asking again can help.

             - CLASS_INPUT: The change set's inputs cannot be rendered: asking again gives the
            same answer, so fix the change set.
             - CLASS_INTERNAL: Admiral failed (storage, the database): asking again can succeed.
    PullSourceArchive:
        type: object
        properties:
            url:
                type: string
        description: An archive at a URL, unpacked by its extension.
        required:
            - url
    PullSourceGitTree:
        type: object
        properties:
            url:
                type: string
                description: '`https://github.com/acme/infra.git`, `ssh://git@github.com/acme/infra.git`.'
            ref:
                type: string
                description: A branch, tag or commit. Empty is the default branch.
            path:
                type: string
                description: A directory within the repository. Empty is the root.
        description: A git repository at a ref, optionally a directory of it.
        required:
            - url
    PullSourceHelmChart:
        type: object
        properties:
            repository:
                type: string
            chart:
                type: string
            version:
                type: string
        description: |-
            A chart in an HTTP repository: the repository URL, the chart's name in
            its index, and an exact version.
        required:
            - repository
            - chart
            - version
    PullSourceOCIChart:
        type: object
        properties:
            reference:
                type: string
            version:
                type: string
        description: |-
            A chart in an OCI registry: `oci://ghcr.io/argoproj/argo-helm/argo-cd`
            at a version, which is its tag.
        required:
            - reference
            - version
    PullSourceRegistryModule:
        type: object
        properties:
            address:
                type: string
            version:
                type: string
        description: |-
            A module in a module registry: the address as a module call would
            write it (`GoogleCloudPlatform/cloud-armor/google`, optionally
            host-qualified, optionally `//subdir`) and an exact version. A range is
            what a Source tracks, not what a pull takes.
        required:
            - address
            - version
    RegistryAPISetComponentStatusBody:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1ComponentStatus'
            reason:
                type: string
                description: Shown wherever the status warns. Required unless the status is ACTIVE.
            successor_component_id:
                type: string
                description: The component to use instead, for DEPRECATED.
        description: SetComponentStatusRequest names a component, its new status, and why.
        required:
            - status
    RegistryAPISetTagBody:
        type: object
        properties:
            digest:
                type: string
                description: The version to name, as `sha256:<hex>`.
        description: SetTagRequest points a tag at a version.
        required:
            - digest
    RegistryAPISetVersionStatusBody:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1VersionStatus'
            reason:
                type: string
                description: |-
                    Shown to anyone who adopts or tries to adopt the version, and to every
                    environment running it.
        description: |-
            SetVersionStatusRequest names a version by digest, its new status, and
            why.
        required:
            - status
            - reason
    RegistryAPIUpdateComponentBody:
        type: object
        properties:
            component:
                type: object
                properties:
                    name:
                        type: string
                        description: |-
                            Unique within the tenant, never changed: `cloud-sql`. Team grouping,
                            when it lands, is a `team/` segment of the name (`payments/cloud-sql`);
                            moving a component means publishing under the new name and deprecating
                            the old one with it as the successor.
                        readOnly: true
                    description:
                        type: string
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                        description: |-
                            Key-value metadata for filtering (e.g. `{"team": "payments",
                            "runtime": "terraform"}`), the same labels every Admiral resource carries.
                    tags:
                        type: array
                        items:
                            type: object
                            $ref: '#/definitions/v1Tag'
                        description: Every tag on the component, by name.
                        readOnly: true
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        readOnly: true
                    created_at:
                        type: string
                        format: date-time
                        readOnly: true
                    updated_at:
                        type: string
                        format: date-time
                        readOnly: true
                    status:
                        $ref: '#/definitions/v1ComponentStatus'
                        readOnly: true
                    status_reason:
                        type: string
                        description: |-
                            Why, and when, the status last changed. Unset on a component that has
                            only ever been ACTIVE.
                        readOnly: true
                    status_changed_at:
                        type: string
                        format: date-time
                        readOnly: true
                    successor_component_id:
                        type: string
                        description: The component to use instead, `cmp-`; set only while DEPRECATED.
                        readOnly: true
                description: |-
                    The component with updated fields. Its `id` identifies it; only fields
                    named in `update_mask` are applied.
            update_mask:
                type: string
                description: |-
                    Supported fields: `description`, `labels`. An empty mask updates what
                    the request populates.
        description: |-
            UpdateComponentRequest carries the fields to change. Omitted fields are
            left as they are.
        required:
            - component
    ResolutionKeep:
        type: string
        enum:
            - KEEP_UNSPECIFIED
            - KEEP_CHANGE_SET
            - KEEP_ENVIRONMENT
        default: KEEP_UNSPECIFIED
        description: |4-
             - KEEP_CHANGE_SET: The change set's value or version replaces the environment's.
             - KEEP_ENVIRONMENT: The environment's stands, and the change set drops its own.
    ResourceChangeAction:
        type: string
        enum:
            - ACTION_UNSPECIFIED
            - ACTION_NO_OP
            - ACTION_CREATE
            - ACTION_UPDATE
            - ACTION_REPLACE
            - ACTION_DESTROY
            - ACTION_ORPHAN
        default: ACTION_UNSPECIFIED
        description: |-
            Action is what applying a plan does to one object.

             - ACTION_REPLACE: Deleted and created again: an immutable field changed.
             - ACTION_ORPHAN: Left in the cluster and no longer managed: pruning is off for it, or it
            is a Namespace, which is never deleted.
    RevisionCause:
        type: string
        enum:
            - CAUSE_UNSPECIFIED
            - CAUSE_EDIT
            - CAUSE_REBASE
        default: CAUSE_UNSPECIFIED
        description: |-
            Cause is why a revision was cut: an edit, or a rebase onto the
            environment as it now is.
    RunAPIAcceptRunBody:
        type: object
        properties:
            reason:
                type: string
        required:
            - reason
    RunAPIApplyRunBody:
        type: object
        properties:
            plan_digest:
                type: string
                description: The plan being applied; refused unless it is the run's plan.
        required:
            - plan_digest
    RunAPIApproveRunBody:
        type: object
        properties:
            plan_digest:
                type: string
                description: The plan being approved; refused unless it is the run's plan.
            reason:
                type: string
                description: An optional note shown with the approval.
        required:
            - plan_digest
    RunAPICancelRunBody:
        type: object
    RunTrigger:
        type: string
        enum:
            - TRIGGER_UNSPECIFIED
            - TRIGGER_USER
            - TRIGGER_SCHEDULE
            - TRIGGER_GATE
        default: TRIGGER_UNSPECIFIED
        description: |-
            Trigger is what started the run.

             - TRIGGER_USER: A person or an API call.
             - TRIGGER_SCHEDULE: A drift check on the environment's schedule.
             - TRIGGER_GATE: A drift check the environment requires right before an apply.
    SetWorkloadIdentityProviderKeysRequestAcceptPending:
        type: object
        description: AcceptPending marks accepting the keys in `pending_key_ids`.
    TerraformEngineSupportEngine:
        type: string
        enum:
            - ENGINE_UNSPECIFIED
            - ENGINE_TERRAFORM
            - ENGINE_OPENTOFU
        default: ENGINE_UNSPECIFIED
        description: Engine is a Terraform-compatible binary.
    ValueSourceOrigin:
        type: string
        enum:
            - ORIGIN_UNSPECIFIED
            - ORIGIN_COMPONENT_DEFAULT
            - ORIGIN_BASELINE
            - ORIGIN_ENVIRONMENT
            - ORIGIN_CHANGE_SET
        default: ORIGIN_UNSPECIFIED
        description: |-
            Origin is the layer a value came from, lowest first: each layer is laid
            over the ones before it.

             - ORIGIN_COMPONENT_DEFAULT: The artifact's own default: a chart's values.yaml, a module's variable
            default.
             - ORIGIN_BASELINE: The organization's defaults stored with the version.
             - ORIGIN_ENVIRONMENT: What the environment already runs with.
             - ORIGIN_CHANGE_SET: This change set's edits.
    WorkloadIdentityProviderAPISetWorkloadIdentityProviderKeysBody:
        type: object
        properties:
            keys:
                $ref: '#/definitions/v1WorkloadIdentityProviderKeys'
                description: Replace where the keys come from.
            accept_pending:
                $ref: '#/definitions/SetWorkloadIdentityProviderKeysRequestAcceptPending'
                description: Trust the keys an agent last reported.
    WorkloadIdentityProviderKeysEnrollment:
        type: object
        description: |-
            Keys an agent supplies from inside the issuer's environment, for an issuer
            Admiral cannot reach (kind, minikube, k3s, on-prem, private clusters).
    apiChangesetV1Finding:
        type: object
        properties:
            component:
                type: string
            code:
                $ref: '#/definitions/FindingCode'
            message:
                type: string
            details:
                type: array
                items:
                    type: string
                description: For CODE_NONDETERMINISTIC, each `Kind/namespace/name field` that differs.
        description: Finding is something a prepare noticed about one component.
    apiRegistryV1Finding:
        type: object
        properties:
            severity:
                $ref: '#/definitions/v1FindingSeverity'
            source:
                type: string
                description: 'What produced it: `provider-constraint`, `checkov`, `trivy`, `image-ref`.'
            code:
                type: string
                description: |-
                    The producer's own identifier for the rule, when it has one
                    (e.g. `CKV_AWS_18`).
            message:
                type: string
            path:
                type: string
                description: Where in the bundle, when it applies.
        description: Finding is one thing the publish gate noticed.
    googleRpcStatus:
        type: object
        properties:
            code:
                type: integer
                format: int32
            message:
                type: string
            details:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/protobufAny'
    protobufAny:
        type: object
        properties:
            '@type':
                type: string
                description: |-
                    A URL/resource name that uniquely identifies the type of the serialized
                    protocol buffer message. This string must contain at least
                    one "/" character. The last segment of the URL's path must represent
                    the fully qualified name of the type (as in
                    `path/google.protobuf.Duration`). The name should be in a canonical form
                    (e.g., leading "." is not accepted).

                    In practice, teams usually precompile into the binary all types that they
                    expect it to use in the context of Any. However, for URLs which use the
                    scheme `http`, `https`, or no scheme, one can optionally set up a type
                    server that maps type URLs to message definitions as follows:

                    * If no scheme is provided, `https` is assumed.
                    * An HTTP GET on the URL must yield a [google.protobuf.Type][]
                      value in binary format, or produce an error.
                    * Applications are allowed to cache lookup results based on the
                      URL, or have them precompiled into a binary to avoid any
                      lookup. Therefore, binary compatibility needs to be preserved
                      on changes to types. (Use versioned type names to manage
                      breaking changes.)

                    Note: this functionality is not currently available in the official
                    protobuf release, and it is not used for type URLs beginning with
                    type.googleapis.com. As of May 2023, there are no widely used type server
                    implementations and no plans to implement one.

                    Schemes other than `http`, `https` (or the empty scheme) might be
                    used with implementation specific semantics.
        additionalProperties: {}
        description: |-
            `Any` contains an arbitrary serialized protocol buffer message along with a
            URL that describes the type of the serialized message.

            Protobuf library provides support to pack/unpack Any values in the form
            of utility functions or additional generated methods of the Any type.

            Example 1: Pack and unpack a message in C++.

                Foo foo = ...;
                Any any;
                any.PackFrom(foo);
                ...
                if (any.UnpackTo(&foo)) {
                  ...
                }

            Example 2: Pack and unpack a message in Java.

                Foo foo = ...;
                Any any = Any.pack(foo);
                ...
                if (any.is(Foo.class)) {
                  foo = any.unpack(Foo.class);
                }
                // or ...
                if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                  foo = any.unpack(Foo.getDefaultInstance());
                }

             Example 3: Pack and unpack a message in Python.

                foo = Foo(...)
                any = Any()
                any.Pack(foo)
                ...
                if any.Is(Foo.DESCRIPTOR):
                  any.Unpack(foo)
                  ...

             Example 4: Pack and unpack a message in Go

                 foo := &pb.Foo{...}
                 any, err := anypb.New(foo)
                 if err != nil {
                   ...
                 }
                 ...
                 foo := &pb.Foo{}
                 if err := any.UnmarshalTo(foo); err != nil {
                   ...
                 }

            The pack methods provided by protobuf library will by default use
            'type.googleapis.com/full.type.name' as the type URL and the unpack
            methods only use the fully qualified type name after the last '/'
            in the type URL, for example "foo.bar.com/x/y.z" will yield type
            name "y.z".

            JSON
            ====
            The JSON representation of an `Any` value uses the regular
            representation of the deserialized, embedded message, with an
            additional field `@type` which contains the type URL. Example:

                package google.profile;
                message Person {
                  string first_name = 1;
                  string last_name = 2;
                }

                {
                  "@type": "type.googleapis.com/google.profile.Person",
                  "firstName": <string>,
                  "lastName": <string>
                }

            If the embedded message type is well-known and has a custom JSON
            representation, that representation will be embedded adding a field
            `value` which holds the custom JSON in addition to the `@type`
            field. Example (for message [google.protobuf.Duration][]):

                {
                  "@type": "type.googleapis.com/google.protobuf.Duration",
                  "value": "1.212s"
                }
    protobufNullValue:
        type: string
        enum:
            - NULL_VALUE
        default: NULL_VALUE
        description: |-
            `NullValue` is a singleton enumeration to represent the null value for the
            `Value` type union.

            The JSON representation for `NullValue` is JSON `null`.

             - NULL_VALUE: Null value.
    v1AcceptRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
    v1ActorRef:
        type: object
        properties:
            id:
                type: string
                description: 'The actor''s typed id: a `usr-` user id or an `sa-` service account id.'
            display_name:
                type: string
                description: Human-readable name (e.g., "John Smith", "deploy-bot").
            email:
                type: string
                description: Email address (empty for non-human actors).
        description: |-
            ActorRef is a lightweight reference to the user or agent that performed an action.
            Server-populated on all resource responses. Clients should never send this.
    v1AddComponent:
        type: object
        properties:
            name:
                type: string
            version:
                $ref: '#/definitions/v1RegistryRef'
                description: The registry component and the tag or digest to run.
            values_json:
                type: string
                description: A JSON object. Empty means no values.
        description: |-
            AddComponent creates a component instance from the registry. The name is
            reserved in the environment until the change set closes or the component
            is removed from it.
        required:
            - name
            - version
    v1Agent:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            name:
                type: string
            health:
                $ref: '#/definitions/AgentHealth'
                readOnly: true
            report:
                $ref: '#/definitions/v1AgentReport'
                description: What the agent last reported. Absent until it does.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            kind:
                $ref: '#/definitions/v1AgentKind'
            identity:
                $ref: '#/definitions/v1AgentIdentity'
            settings:
                $ref: '#/definitions/v1AgentSettings'
            approval:
                $ref: '#/definitions/v1ApprovalRule'
                description: |-
                    What every apply on this agent needs from people, in every environment
                    that uses it, on top of the environment's own rule. Only the agent's
                    owner sets it, so a team using the agent cannot loosen it.
            allowed_component_ids:
                type: array
                items:
                    type: string
                description: |-
                    The components that may run on this agent, as `cmp-` ids. Empty allows
                    any. Only the agent's owner sets it; Admiral refuses to place a component
                    outside it and checks again before each job.
    v1AgentAssignment:
        type: object
        properties:
            agent_id:
                type: string
                description: |-
                    The agent. Its owner must have granted it to the organization, a team,
                    this application or this environment.
            id:
                type: string
                description: |-
                    `asg-` and twelve base36 characters, what a component's settings name to
                    run on this assignment. Empty on an assignment being added, which gets
                    one; send it back unchanged when updating the list, or the assignment is
                    treated as new and components placed on the old one are refused.
            plan_profile:
                type: string
                description: |-
                    The agent profiles a plan and an apply get: named sets of environment
                    variables, with an optional identity to assume, that the agent's owner
                    defines in the agent's own config, such as a read-only and an edit
                    Cloudflare token. Admiral holds the names, never the values. Empty means
                    the agent's `default` profile. A profile must be one the agent reports
                    and its grants cover for this environment.
            apply_profile:
                type: string
            kubernetes:
                $ref: '#/definitions/v1KubernetesSettings'
        description: |-
            AgentAssignment binds an agent to an environment, with the settings for
            how this environment uses it.
        required:
            - agent_id
    v1AgentGrant:
        type: object
        properties:
            organization:
                $ref: '#/definitions/AgentGrantOrganization'
                description: Every environment in the organization.
            group_id:
                type: string
                description: |-
                    Any member of the group can assign the agent to an environment they
                    can edit.
            application_id:
                type: string
            environment_id:
                type: string
            profiles:
                type: array
                items:
                    type: string
                description: |-
                    The agent profiles this grant covers, by name. Empty covers every
                    profile; otherwise `default` is covered only when listed. Grants reaching
                    one environment add up.
        description: |-
            AgentGrant lets environments be assigned an agent, and which of its
            profiles they may name. Set exactly one target; an agent can hold several
            grants, one per target.
    v1AgentIdentity:
        type: object
        properties:
            workload:
                $ref: '#/definitions/v1WorkloadIdentity'
        description: AgentIdentity is who an agent is and how it proves it.
    v1AgentKind:
        type: string
        enum:
            - KIND_UNSPECIFIED
            - KIND_KUBERNETES
            - KIND_TERRAFORM
        default: KIND_UNSPECIFIED
        description: |-
            Kind is what an agent runs.

             - KIND_KUBERNETES: Applies Kubernetes manifests and Helm charts in its cluster.
             - KIND_TERRAFORM: Runs Terraform or OpenTofu.
    v1AgentReport:
        type: object
        properties:
            agent_version:
                type: string
            protocol_version:
                type: integer
                format: int32
            profiles:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ProfileReport'
                description: |-
                    The profiles the agent defines and what each serves. Names and
                    provider addresses only, never values.
            kubernetes:
                $ref: '#/definitions/v1KubernetesReport'
            reported_at:
                type: string
                format: date-time
    v1AgentSettings:
        type: object
        properties:
            kubernetes:
                $ref: '#/definitions/v1KubernetesAgentSettings'
            terraform:
                $ref: '#/definitions/v1TerraformAgentSettings'
        description: |-
            AgentSettings is what the agent's owner allows it, one block per kind.
            Environments that use the agent choose within these; they cannot exceed
            them.
    v1ApiKey:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the key.
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "ci-deploy-key"), unique among
                    the caller's keys.
            scopes:
                type: array
                items:
                    type: string
                description: |-
                    The scopes granted to this key, and the ceiling on any access token minted
                    from it. Must be a subset of the caller's own scopes.
            status:
                $ref: '#/definitions/v1ApiKeyStatus'
                readOnly: true
            expires_at:
                type: string
                format: date-time
                description: |-
                    When the key expires. Unset never expires. Fixed at creation; tenant
                    policy may cap it.
            last_used_at:
                type: string
                format: date-time
                description: |-
                    When the key was last exchanged for an access token. Minted tokens are
                    reused for their lifetime, so this reads as "still in use" at that
                    granularity, not as the time of the last request.
                readOnly: true
            revoked_at:
                type: string
                format: date-time
                description: Set when the key was revoked.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
        description: |-
            ApiKey is one of the caller's own API keys. The secret itself is returned
            once, by CreateApiKey, and never again.
    v1ApiKeyStatus:
        type: string
        enum:
            - API_KEY_STATUS_UNSPECIFIED
            - API_KEY_STATUS_ACTIVE
            - API_KEY_STATUS_REVOKED
        default: API_KEY_STATUS_UNSPECIFIED
        description: |-
            ApiKeyStatus represents the lifecycle state of an API key.

             - API_KEY_STATUS_UNSPECIFIED: Default value. Must not be used.
             - API_KEY_STATUS_ACTIVE: The key is valid and can be used to authenticate.
             - API_KEY_STATUS_REVOKED: The key has been permanently revoked and cannot be used.
    v1AppendJobLogResponse:
        type: object
        properties:
            next_offset:
                type: string
                format: int64
                description: Where the next chunk starts.
    v1Application:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the application.
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                    the tenant. Lowercase alphanumeric and hyphens only, must start with a
                    letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the application's purpose
                    (e.g., "Core inventory service tracking warehouse stock and fulfillment").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering applications
                    (e.g., `{"team": "logistics", "tier": "critical"}`).
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this application (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the application was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the application was last updated.
                readOnly: true
        description: |-
            Application represents a deployable unit within a tenant. An application
            groups environments.
    v1ApplyPhase:
        type: object
        properties:
            jobs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1RunJob'
            components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ComponentApply'
            message:
                type: string
                description: Why the apply failed or stopped, when it did.
            applied_by:
                $ref: '#/definitions/v1ActorRef'
            generation:
                type: string
                format: int64
                description: |-
                    The environment's generation this apply left; absent when it changed
                    nothing.
            started_at:
                type: string
                format: date-time
            finished_at:
                type: string
                format: date-time
            accepted_by:
                $ref: '#/definitions/v1ActorRef'
                description: Set when a partial apply was accepted as the environment's new state.
            accepted_reason:
                type: string
            accepted_at:
                type: string
                format: date-time
        description: ApplyPhase is the apply of a run's plan.
    v1ApplyRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
    v1Approval:
        type: object
        properties:
            plan_digest:
                type: string
            approved_by:
                $ref: '#/definitions/v1ActorRef'
            reason:
                type: string
            approved_at:
                type: string
                format: date-time
            carried_from_run_id:
                type: string
                description: The run it was given on, when it was carried from an earlier run.
        description: Approval is a sign-off on one plan.
    v1ApprovalRule:
        type: object
        properties:
            required_approvals:
                type: integer
                format: int32
                description: |-
                    Distinct people who must approve the planned revision, from anyone
                    allowed to. 0 needs none.
            groups:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/ApprovalRuleGroupApproval'
                description: |-
                    Groups that must each approve, all of them. One person's approval counts
                    for every group they belong to; to need two people, also set
                    required_approvals to 2.
        description: |-
            ApprovalRule is what an apply needs from people before it runs. A plan
            that changes dismisses its approvals, and the author never counts. When an
            environment's and its agents' rules all apply, their groups add up (the
            higher count for a group named twice) and the largest required_approvals
            wins.
    v1ApproveRunResponse:
        type: object
        properties:
            approval:
                $ref: '#/definitions/v1Approval'
    v1Attempt:
        type: object
        properties:
            job_id:
                type: string
            attempt:
                type: integer
                format: int32
            lease_token:
                type: string
        description: Attempt names the attempt a call belongs to.
        required:
            - job_id
    v1AuthConfig:
        type: object
        properties:
            ssh_key:
                $ref: '#/definitions/v1SSHKeyAuth'
            basic_auth:
                $ref: '#/definitions/v1BasicAuth'
            bearer_token:
                $ref: '#/definitions/v1BearerTokenAuth'
            github_app:
                $ref: '#/definitions/v1GitHubAppAuth'
        description: AuthConfig is the secret, one variant matching the credential's type.
    v1BasicAuth:
        type: object
        properties:
            username:
                type: string
            password:
                type: string
                description: Write-only.
        description: |-
            BasicAuth is a username and password, or a username and a token that the
            host takes as a password (a registry-scoped token, an app password).
    v1BearerTokenAuth:
        type: object
        properties:
            token:
                type: string
                description: Write-only.
        description: BearerTokenAuth is one token.
    v1CancelJobResponse:
        type: object
        properties:
            job:
                $ref: '#/definitions/v1Job'
    v1CancelRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
    v1ChangeSet:
        type: object
        properties:
            id:
                type: string
                description: '`cs-` and twelve lowercase base36 characters.'
                readOnly: true
            application_id:
                type: string
                readOnly: true
            environment_id:
                type: string
                readOnly: true
            title:
                type: string
            description:
                type: string
            status:
                $ref: '#/definitions/v1ChangeSetStatus'
                readOnly: true
            head_revision:
                type: integer
                format: int32
                description: 0 until the first edit.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
            reverts_change_set_id:
                type: string
                description: |-
                    Set on a change set made by RevertChangeSet: the change set it reverts.
                    It may apply while that change set's partial apply holds the environment.
                readOnly: true
            behind:
                type: boolean
                description: |-
                    The environment moved since the head revision's base. It cannot apply
                    until RebaseChangeSet brings it up to date.
                readOnly: true
            latest_run_id:
                type: string
                description: |-
                    The change set's newest run; empty before its first. Its status is the
                    change set's progress: planning, awaiting approval, applying, failed.
                readOnly: true
    v1ChangeSetStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_OPEN
            - STATUS_APPLIED
            - STATUS_CLOSED
        default: STATUS_UNSPECIFIED
        description: |4-
             - STATUS_OPEN: Being proposed: edited, planned, approved, applied. What is happening
            to it right now (planning, applying, holding the environment) is on
            its runs, not here.
             - STATUS_APPLIED: It took effect: its apply succeeded, or a partial apply was accepted.
             - STATUS_CLOSED: It ended without taking effect: discarded, or its partial apply was
            reverted.
    v1CheckJobPlanResponse:
        type: object
        properties:
            proceed:
                type: boolean
            message:
                type: string
                description: Why not, when `proceed` is false.
    v1ClaimJobRequest:
        type: object
        properties:
            claim_request_id:
                type: string
                description: |-
                    Chosen by the agent per claim, with at least 128 random bits (22
                    base64url characters); a retry with the same id returns the same offer.
                    The lease token derives from it, so it is as secret as the token.
            protocol_version:
                type: integer
                format: int32
            artifact_schema:
                type: integer
                format: int32
                description: The newest artifact schema the agent reads.
            slots:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Slots'
            wait_seconds:
                type: integer
                format: int32
                description: How long to wait for work. At most 20; the server may answer sooner.
    v1ClaimJobResponse:
        type: object
        properties:
            offer:
                $ref: '#/definitions/v1Offer'
                description: Absent when there was nothing to offer.
    v1Component:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier.
                readOnly: true
            name:
                type: string
                description: |-
                    Unique within the tenant, never changed: `cloud-sql`. Team grouping,
                    when it lands, is a `team/` segment of the name (`payments/cloud-sql`);
                    moving a component means publishing under the new name and deprecating
                    the old one with it as the successor.
                readOnly: true
            description:
                type: string
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Key-value metadata for filtering (e.g. `{"team": "payments",
                    "runtime": "terraform"}`), the same labels every Admiral resource carries.
            tags:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Tag'
                description: Every tag on the component, by name.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
            status:
                $ref: '#/definitions/v1ComponentStatus'
                readOnly: true
            status_reason:
                type: string
                description: |-
                    Why, and when, the status last changed. Unset on a component that has
                    only ever been ACTIVE.
                readOnly: true
            status_changed_at:
                type: string
                format: date-time
                readOnly: true
            successor_component_id:
                type: string
                description: The component to use instead, `cmp-`; set only while DEPRECATED.
                readOnly: true
        description: |-
            Component is a registry entry: a name, and the versions and tags beneath
            it.
    v1ComponentApply:
        type: object
        properties:
            component:
                type: string
            status:
                $ref: '#/definitions/v1ComponentApplyStatus'
            message:
                type: string
        description: ComponentApply is one component in an apply, in apply order.
    v1ComponentApplyStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_QUEUED
            - STATUS_APPLYING
            - STATUS_SUCCEEDED
            - STATUS_FAILED
            - STATUS_SKIPPED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is where one component's apply stands.

             - STATUS_QUEUED: Not reached yet.
             - STATUS_SKIPPED: Not attempted: the apply stopped before reaching it.
    v1ComponentDiff:
        type: object
        properties:
            component:
                type: string
            action:
                $ref: '#/definitions/v1EntryAction'
            old_version:
                $ref: '#/definitions/v1VersionRef'
                description: Absent on ENTRY_ACTION_CREATE.
            new_version:
                $ref: '#/definitions/v1VersionRef'
                description: Absent on ENTRY_ACTION_DESTROY.
            paths:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathDiff'
            violations:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Violation'
    v1ComponentInventory:
        type: object
        properties:
            component:
                type: string
            resources:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ResourceRef'
        description: |-
            ComponentInventory is what the last apply of a component left in the
            cluster.
    v1ComponentKind:
        type: string
        enum:
            - COMPONENT_KIND_UNSPECIFIED
            - COMPONENT_KIND_TERRAFORM
            - COMPONENT_KIND_HELM
            - COMPONENT_KIND_MANIFESTS
        default: COMPONENT_KIND_UNSPECIFIED
        description: |-
            ComponentKind is what a version's bundle is, detected by inspection at
            publish: a Chart.yaml means HELM, .tf files mean TERRAFORM, anything else
            that is Kubernetes YAML means MANIFESTS.
    v1ComponentPlan:
        type: object
        properties:
            component:
                type: string
            changes:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ResourceChange'
    v1ComponentSettings:
        type: object
        properties:
            assignment_id:
                type: string
                description: |-
                    The environment's agent assignment it runs on. Empty means the one
                    assignment left after the agent's grants, allowed components and the
                    providers its profiles serve rule the others out; required on a tie.
                    A placement nothing covers is refused, naming an agent that would.
            kubernetes:
                $ref: '#/definitions/v1KubernetesComponentSettings'
        description: |-
            ComponentSettings is how Admiral deploys one component in an environment,
            as opposed to its values, which are what the component receives. Only the
            block for the component's kind is accepted.
    v1ComponentStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_ACTIVE
            - STATUS_DEPRECATED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is whether a component is still recommended. Removing one is
            DeleteComponent.

             - STATUS_DEPRECATED: Still usable; adding it, moving it to another version, and planning it
            warn and name the successor.
    v1Conflict:
        type: object
        properties:
            component:
                type: string
            kind:
                $ref: '#/definitions/v1ConflictKind'
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
                description: The change set's path, for KIND_VALUE.
            change_set_value_json:
                type: string
                description: JSON text, for KIND_VALUE; empty where the key is absent.
            environment_value_json:
                type: string
            change_set_version:
                $ref: '#/definitions/v1VersionRef'
                description: For KIND_VERSION.
            environment_version:
                $ref: '#/definitions/v1VersionRef'
            environment_change_set_id:
                type: string
                description: |-
                    The change set that changed the environment's side; empty when no
                    change set did, as with a state change outside a run.
        description: |-
            Conflict is a setting both this change set and its environment changed
            since the change set's base.
    v1ConflictKind:
        type: string
        enum:
            - KIND_UNSPECIFIED
            - KIND_VALUE
            - KIND_VERSION
            - KIND_REMOVED
        default: KIND_UNSPECIFIED
        description: |4-
             - KIND_VALUE: Both set a value at `path`, or one path contains the other.
             - KIND_VERSION: Both moved the component's version.
             - KIND_REMOVED: The environment no longer has the component.
    v1Contract:
        type: object
        properties:
            inputs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContractInput'
            outputs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContractOutput'
        description: |-
            Contract is what a bundle takes and gives. The shape here is what static
            inspection can produce from any Terraform module or Helm chart; the curated
            format adds to it without removing anything.
    v1ContractInput:
        type: object
        properties:
            name:
                type: string
            type:
                type: string
                description: |-
                    The type as the bundle declares it: a Terraform type expression, or for a
                    chart one of bool, number, string, list, object or null. A chart's full
                    constraint is in schema.
            description:
                type: string
            required:
                type: boolean
                description: True when the bundle gives it no default.
            default:
                description: The declared default, when there is one.
            sensitive:
                type: boolean
                description: |-
                    The bundle marks the value sensitive: it is masked in artifacts and
                    review, as GetArtifact describes.
            ephemeral:
                type: boolean
                description: |-
                    The value must not land in plan or state (Terraform 1.10+ ephemeral
                    inputs). Implies sensitive.
            nullable:
                type: boolean
                description: |-
                    Whether null is an accepted value. Unset when the bundle does not say,
                    which is a chart input with no schema.
            deprecated:
                type: string
                description: The bundle's own deprecation message for this input.
            validations:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContractValidation'
                description: A Terraform variable's validation blocks, in declaration order.
            schema:
                type: object
                description: |-
                    The JSON Schema a chart's values.schema.json declares for this input,
                    verbatim, so a value can be checked the way Helm will check it.
        description: ContractInput is one value the bundle accepts.
    v1ContractOutput:
        type: object
        properties:
            name:
                type: string
            description:
                type: string
            sensitive:
                type: boolean
        description: ContractOutput is one value the bundle produces.
    v1ContractValidation:
        type: object
        properties:
            condition:
                type: string
            error_message:
                type: string
        description: |-
            ContractValidation is one validation block on a Terraform variable, as
            written. Evaluating the condition needs the Terraform language runtime,
            which the registry does not run.
    v1CreateAgentRequest:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
                description: |-
                    The agent to create: `name`, `kind`, `identity`, and optionally
                    `settings`, `approval` and `allowed_component_ids`.
            grants:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AgentGrant'
                description: |-
                    Who may use it. Absent grants the organization when this is its first
                    agent, and nobody otherwise.
        required:
            - agent
    v1CreateAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
            grants:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AgentGrant'
            enrollment_key:
                $ref: '#/definitions/v1EnrollmentKey'
                description: |-
                    Set when, and only when, the agent's provider is PENDING for
                    enrollment: the single-use key the agent enrolls the provider's keys
                    with. Shown once.
    v1CreateApiKeyRequest:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: 'The key to create: `name`, `scopes`, and optionally `expires_at`.'
        description: CreateApiKeyRequest creates an API key for the caller.
        required:
            - api_key
    v1CreateApiKeyResponse:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: The created key metadata.
            secret:
                type: string
                description: |-
                    The raw secret, shown exactly once and never again. It reads
                    `admp_<id suffix>_<secret>`: the key `key-8r3t6w1y4n9z` has a secret
                    starting `admp_8r3t6w1y4n9z_`, so a secret found anywhere names its key.
        description: CreateApiKeyResponse contains the newly created API key.
    v1CreateApplicationRequest:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The application to create. Server-populated fields are ignored.
        description: CreateApplicationRequest creates an application in the caller's tenant.
        required:
            - application
    v1CreateApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The created application.
        description: CreateApplicationResponse contains the newly created application.
    v1CreateChangeSetRequest:
        type: object
        properties:
            environment_id:
                type: string
                description: The environment the change set proposes against. It never changes.
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: |-
                    The change set to open: its title and description. Server-populated
                    fields are ignored.
            edits:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Edit'
        required:
            - environment_id
            - change_set
    v1CreateChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
            revision:
                $ref: '#/definitions/v1Revision'
                description: Absent when the request carried no edits.
            warnings:
                type: array
                items:
                    type: string
                description: |-
                    Accepted, but worth saying: a deprecated version, a check the contract could
                    not make.
    v1CreateCredentialRequest:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
                description: |-
                    The credential to create: `name`, `type`, `auth_config`, and optionally
                    `description`, `labels` and `allowed_hosts`. `type` and the populated
                    `auth_config` variant must agree.
        description: CreateCredentialRequest registers a credential in the caller's tenant.
        required:
            - credential
    v1CreateCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
    v1CreateEnrollmentKeyResponse:
        type: object
        properties:
            enrollment_key:
                $ref: '#/definitions/v1EnrollmentKey'
    v1CreateEnvironmentRequest:
        type: object
        properties:
            application_id:
                type: string
                description: The application the environment belongs to.
            environment:
                $ref: '#/definitions/v1Environment'
                description: The environment to create. Server-populated fields are ignored.
        description: CreateEnvironmentRequest creates an environment under an application.
        required:
            - application_id
            - environment
    v1CreateEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The created environment.
        description: CreateEnvironmentResponse contains the newly created environment.
    v1CreateInvitationRequest:
        type: object
        properties:
            invitation:
                $ref: '#/definitions/v1Invitation'
                description: 'The invitation to issue: `email` and `role`.'
        description: CreateInvitationRequest invites one address into the caller's tenant.
        required:
            - invitation
    v1CreateInvitationResponse:
        type: object
        properties:
            invitation:
                $ref: '#/definitions/v1Invitation'
        description: CreateInvitationResponse carries the invitation, without its link.
    v1CreateRunRequest:
        type: object
        properties:
            environment_id:
                type: string
                description: |-
                    The environment, for a desired run. A revision's run takes its
                    environment from the change set.
            run:
                $ref: '#/definitions/v1Run'
                description: 'The run to start: its `revision_id`, or `desired` with a mode.'
        description: CreateRunRequest starts a run.
        required:
            - run
    v1CreateRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
    v1CreateWorkloadIdentityProviderRequest:
        type: object
        properties:
            workload_identity_provider:
                $ref: '#/definitions/v1WorkloadIdentityProvider'
                description: |-
                    The provider to create: `name`, `issuer`, and `keys` (absent leaves it
                    PENDING for an agent to enroll).
        required:
            - workload_identity_provider
    v1CreateWorkloadIdentityProviderResponse:
        type: object
        properties:
            workload_identity_provider:
                $ref: '#/definitions/v1WorkloadIdentityProvider'
    v1Credential:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            name:
                type: string
                description: Unique within the tenant.
            description:
                type: string
            type:
                $ref: '#/definitions/v1CredentialType'
                description: Immutable after creation.
            auth_config:
                $ref: '#/definitions/v1AuthConfig'
                description: Write-only. Empty in every response.
            labels:
                type: object
                additionalProperties:
                    type: string
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
            allowed_hosts:
                type: array
                items:
                    type: string
                description: |-
                    Hosts this credential may be presented to, as a guard: empty means any
                    host its type fits; set means the platform refuses to present it
                    anywhere else, whatever it is attached to. Hostnames, optionally with
                    a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                    no path.
            last_used_at:
                type: string
                format: date-time
                description: |-
                    When a publish last decrypted this credential to present to a host,
                    whether or not the host accepted it. Updated at most every few minutes.
                    Absent if it has never been used.
                readOnly: true
        description: |-
            Credential is a registered credential's metadata. The secret is set
            through `auth_config` and never read back; responses carry it empty.
    v1CredentialType:
        type: string
        enum:
            - TYPE_UNSPECIFIED
            - TYPE_SSH_KEY
            - TYPE_BASIC_AUTH
            - TYPE_BEARER_TOKEN
            - TYPE_GITHUB_APP
        default: TYPE_UNSPECIFIED
        description: |-
            Type is the protocol family a credential is presented as. Each
            fetch takes the families its protocol speaks: a module registry, an
            archive and an OCI token take a bearer token; git over https, a Helm
            repository and an OCI login take basic auth; git over ssh takes a key.

             - TYPE_SSH_KEY: An SSH private key, for git over ssh.
             - TYPE_BASIC_AUTH: A username and password: git over https, a Helm repository, an OCI
            registry, an authenticated archive.
             - TYPE_BEARER_TOKEN: One token. Presented as `Authorization: Bearer` to a module registry,
            a Helm repository, an OCI registry or an archive host, and as the
            basic-auth password with the `x-access-token` username to git over
            https, which is how GitHub and GitLab take a token.
             - TYPE_GITHUB_APP: A GitHub App installation. Not a secret that is presented: the platform
            mints a short-lived installation token from the app's private key at
            fetch time and presents that as a bearer token. Works for github.com,
            GitHub Enterprise Cloud and GitHub Enterprise Server.
    v1DeleteAgentResponse:
        type: object
    v1DeleteApplicationResponse:
        type: object
        description: DeleteApplicationResponse is empty on success.
    v1DeleteComponentResponse:
        type: object
        description: DeleteComponentResponse is empty.
    v1DeleteCredentialResponse:
        type: object
    v1DeleteEnvironmentResponse:
        type: object
        description: DeleteEnvironmentResponse is empty on success.
    v1DeleteTagResponse:
        type: object
        description: DeleteTagResponse is empty.
    v1DeleteWorkloadIdentityProviderResponse:
        type: object
    v1Dependency:
        type: object
        properties:
            source:
                type: string
                description: The source as the bundle declared it, before rewriting.
            constraint:
                type: string
                description: The constraint that was asked for, when any.
            resolved:
                type: string
                description: 'What it resolved to: an exact version or commit.'
        description: |-
            Dependency is one remote module or chart the closure step resolved and
            copied into the bundle.
    v1Desired:
        type: object
        properties:
            mode:
                $ref: '#/definitions/DesiredMode'
            components:
                type: array
                items:
                    type: string
                description: |-
                    For a reapply, the components to reapply. A drift check covers every
                    component and ignores this.
            generation:
                type: string
                format: int64
                description: The environment's generation when the run started.
                readOnly: true
            desired_components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1DesiredComponent'
                description: |-
                    Each component and the revision that last applied it, frozen when the
                    run started.
                readOnly: true
        description: |-
            Desired is a run of what the environment desires: each component as the
            revision that last applied it left it.
    v1DesiredComponent:
        type: object
        properties:
            component:
                type: string
            revision_id:
                type: string
                description: The change set revision that last applied it.
        description: DesiredComponent is one component as a desired run found it.
    v1DiffChangeSetResponse:
        type: object
        properties:
            revision:
                type: integer
                format: int32
                description: The head revision diffed; 0 when there is none.
            components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ComponentDiff'
    v1DiscardChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
    v1Edit:
        type: object
        properties:
            add_component:
                $ref: '#/definitions/v1AddComponent'
            set_value:
                $ref: '#/definitions/v1SetValue'
            unset_value:
                $ref: '#/definitions/v1UnsetValue'
            set_version:
                $ref: '#/definitions/v1SetVersion'
            replace_values:
                $ref: '#/definitions/v1ReplaceValues'
            remove_component:
                $ref: '#/definitions/v1RemoveComponent'
            set_settings:
                $ref: '#/definitions/v1SetSettings'
            set_depends_on:
                $ref: '#/definitions/v1SetDependsOn'
            orphan_component:
                $ref: '#/definitions/v1OrphanComponent'
        description: |-
            Edit is one change a request makes. A request's edits apply in order and
            become one revision.
    v1EditChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
            revision:
                $ref: '#/definitions/v1Revision'
            warnings:
                type: array
                items:
                    type: string
    v1EnrollRequest:
        type: object
        properties:
            jwks:
                type: string
                description: |-
                    The issuer's keys, as the agent sees them from inside (for Kubernetes,
                    served at /openid/v1/jwks).
            token:
                type: string
                description: |-
                    A token the issuer issued this agent, audience Admiral. It must verify
                    against `jwks` and carry the agent's subject; its `iss` becomes the
                    provider's issuer when none was set.
            kubernetes:
                $ref: '#/definitions/v1KubernetesEnrollment'
    v1EnrollResponse:
        type: object
        properties:
            workload_identity_provider:
                $ref: '#/definitions/v1WorkloadIdentityProvider'
            agent:
                $ref: '#/definitions/v1Agent'
    v1EnrollmentKey:
        type: object
        properties:
            secret:
                type: string
                description: Shown once. Spent the moment an agent enrolls with it.
            expires_at:
                type: string
                format: date-time
    v1Entry:
        type: object
        properties:
            component:
                type: string
            action:
                $ref: '#/definitions/v1EntryAction'
            version:
                $ref: '#/definitions/v1VersionRef'
                description: |-
                    The version the component runs after this change set: set on
                    ENTRY_ACTION_CREATE and when the version changes.
            base_digest:
                type: string
                description: Empty on ENTRY_ACTION_CREATE.
            result_digest:
                type: string
                description: Empty on ENTRY_ACTION_DESTROY.
            ops:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ValueOp'
            settings:
                $ref: '#/definitions/v1ComponentSettings'
                description: |-
                    How Admiral deploys the component after this change set. Empty on
                    ENTRY_ACTION_DESTROY.
            depends_on:
                type: array
                items:
                    type: string
                description: Components this one applies after, after this change set.
        description: Entry is what one revision does to one component.
    v1EntryAction:
        type: string
        enum:
            - ENTRY_ACTION_UNSPECIFIED
            - ENTRY_ACTION_CREATE
            - ENTRY_ACTION_UPDATE
            - ENTRY_ACTION_DESTROY
            - ENTRY_ACTION_ORPHAN
        default: ENTRY_ACTION_UNSPECIFIED
        description: |-
            EntryAction is what a change set does to one component.

             - ENTRY_ACTION_ORPHAN: Stop managing it without tearing it down: what it created stays where it
            is and Admiral forgets it. Needs no agent to apply.
    v1Environment:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the environment.
                readOnly: true
            application_id:
                type: string
                description: The application this environment belongs to.
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                    Unique within the application. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the environment's purpose
                    (e.g., "US East production serving live traffic" or
                    "Shared staging for QA validation before prod promotion").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering environments
                    (e.g., `{"region": "us-east-1", "tier": "production"}`).
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this environment (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the environment was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the environment was last updated.
                readOnly: true
            agents:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AgentAssignment'
                description: |-
                    The agents this environment deploys through, each with how this
                    environment uses it. Several of one kind are allowed: an IAM agent beside
                    an ordinary one, say. A component runs on the assignment its settings
                    name, or on the only one of its kind. Two environments can share an agent
                    and differ in settings, such as dev and staging in one cluster under
                    different namespaces.
            approval:
                $ref: '#/definitions/v1ApprovalRule'
                description: What an apply here needs before it runs. Unset needs nothing.
            generation:
                type: string
                format: int64
                description: |-
                    Moves each time an apply changes the environment. A change set records
                    the generation it was cut from.
                readOnly: true
            hold:
                $ref: '#/definitions/v1Hold'
                description: |-
                    Set while a partial apply holds the environment. Nothing else applies
                    until the holding change set is reverted or accepted.
                readOnly: true
            last_apply:
                $ref: '#/definitions/v1LastApply'
                description: |-
                    The apply that produced the current generation. Absent until the first
                    apply changes the environment.
                readOnly: true
        description: |-
            Environment is a named place an application deploys to (dev, staging,
            prod).
    v1EnvironmentComponent:
        type: object
        properties:
            name:
                type: string
                description: Component name, unique within the environment.
            environment_id:
                type: string
                description: The environment it is live in.
                readOnly: true
            kind:
                $ref: '#/definitions/v1ComponentKind'
                description: 'What its version is: Terraform, Helm or manifests.'
            version:
                $ref: '#/definitions/v1VersionRef'
                description: The registry version it runs.
            last_apply:
                $ref: '#/definitions/v1LastApply'
                description: The apply that last changed this component.
        description: |-
            EnvironmentComponent is one component live in an environment: the version
            it runs and the apply that last changed it.
    v1FindingSeverity:
        type: string
        enum:

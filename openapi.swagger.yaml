            new_pin:
                $ref: '#/definitions/apiChangesetV1Pin'
                description: Absent on DESTROY.
            paths:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathDiff'
            violations:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Violation'
    v1ComponentLabels:
        type: object
        properties:
            labels:
                type: object
                additionalProperties:
                    type: string
        description: |-
            ComponentLabels wraps a label map so its presence in an update can be told
            from an empty map: present and empty clears the labels.
    v1Contract:
        type: object
        properties:
            inputs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContractInput'
            outputs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContractOutput'
        description: |-
            Contract is what a bundle takes and gives. The shape here is what static
            inspection can produce from any Terraform module or Helm chart; the curated
            format adds to it without removing anything.
    v1ContractInput:
        type: object
        properties:
            name:
                type: string
            type:
                type: string
                description: |-
                    The type as the bundle declares it: a Terraform type expression, or for a
                    chart one of bool, number, string, list, object or null. A chart's full
                    constraint is in schema.
            description:
                type: string
            required:
                type: boolean
                description: True when the bundle gives it no default.
            default:
                description: The declared default, when there is one.
            sensitive:
                type: boolean
                description: |-
                    The value is a secret: never rendered in review, and resolved by the
                    runner from a reference rather than stored in the change set.
            ephemeral:
                type: boolean
                description: |-
                    The value must not land in plan or state (Terraform 1.10+ ephemeral
                    inputs). Implies sensitive.
            nullable:
                type: boolean
                description: |-
                    Whether null is an accepted value. Unset when the bundle does not say,
                    which is a chart input with no schema.
            deprecated:
                type: string
                description: The bundle's own deprecation message for this input.
            validations:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContractValidation'
                description: A Terraform variable's validation blocks, in declaration order.
            schema:
                type: object
                description: |-
                    The JSON Schema a chart's values.schema.json declares for this input,
                    verbatim, so a value can be checked the way Helm will check it.
        description: ContractInput is one value the bundle accepts.
    v1ContractOutput:
        type: object
        properties:
            name:
                type: string
            description:
                type: string
            sensitive:
                type: boolean
        description: ContractOutput is one value the bundle produces.
    v1ContractValidation:
        type: object
        properties:
            condition:
                type: string
            error_message:
                type: string
        description: |-
            ContractValidation is one validation block on a Terraform variable, as
            written. Evaluating the condition needs the Terraform language runtime,
            which the registry does not run.
    v1CreateAgentRequest:
        type: object
        properties:
            cluster_id:
                type: string
            name:
                type: string
            namespace:
                type: string
                description: The namespace and service account the agent runs as.
            service_account:
                type: string
            ceiling:
                $ref: '#/definitions/v1AgentCeiling'
            grants:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AgentGrant'
                description: |-
                    Who may use it. Absent grants the whole tenant when this is the tenant's
                    first agent, and nobody otherwise.
            enrollment_key:
                type: boolean
                description: Issue a single-use enrollment key with the agent.
        required:
            - cluster_id
            - name
            - namespace
            - service_account
    v1CreateAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
            grants:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1AgentGrant'
            enrollment_key:
                $ref: '#/definitions/v1EnrollmentKey'
                description: Set when asked for. Shown once.
    v1CreateApiKeyRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier for the key (e.g., "postman-testing").
                    Unique per user within the tenant. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            scopes:
                type: array
                items:
                    type: string
                description: |-
                    The scopes to grant this key. Must be scopes assignable to a user-bound key.
                    The server enforces that issued scopes are a subset of the caller's own
                    scopes. A key cannot grant more access than the user holds.
            expires_at:
                type: string
                format: date-time
                description: |-
                    Optional expiration time. If unset, the key does not expire.
                    Tenant policies may enforce a maximum lifetime.
        description: CreateApiKeyRequest contains the parameters for creating a new API key.
        required:
            - name
    v1CreateApiKeyResponse:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: The created key metadata.
            plain_text_key:
                type: string
                description: |-
                    The raw secret (e.g., "admp_7kH3mNqR2xFb..."). This value is
                    shown exactly once and cannot be retrieved again. Store it securely.
        description: CreateApiKeyResponse contains the newly created API key.
    v1CreateApplicationRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                    the tenant. Lowercase alphanumeric and hyphens only, must start with a
                    letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional longer-form description of the application's purpose.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels for organizing and filtering applications.
        description: CreateApplicationRequest contains the parameters for creating a new application.
        required:
            - name
    v1CreateApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The created application.
        description: CreateApplicationResponse contains the newly created application.
    v1CreateChangeSetRequest:
        type: object
        properties:
            environment_id:
                type: string
            title:
                type: string
            description:
                type: string
            edits:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Edit'
            plan:
                type: boolean
                description: Ask for a plan of the revision the edits cut, as PlanChangeSet does.
        required:
            - environment_id
    v1CreateChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
            revision:
                $ref: '#/definitions/apiChangesetV1Revision'
                description: Absent when the request carried no edits.
            warnings:
                type: array
                items:
                    type: string
                description: |-
                    Accepted, but worth saying: a deprecated pin, a check the contract could
                    not make.
            prepare:
                $ref: '#/definitions/v1Prepare'
                description: Set when `plan` was asked for.
    v1CreateClusterRequest:
        type: object
        properties:
            name:
                type: string
            trust:
                $ref: '#/definitions/v1ClusterTrust'
                description: Absent leaves the cluster PENDING for an agent to enroll.
        required:
            - name
    v1CreateClusterResponse:
        type: object
        properties:
            cluster:
                $ref: '#/definitions/v1Cluster'
    v1CreateCredentialRequest:
        type: object
        properties:
            name:
                type: string
            description:
                type: string
            type:
                $ref: '#/definitions/v1CredentialType'
            auth_config:
                $ref: '#/definitions/v1AuthConfig'
            labels:
                type: object
                additionalProperties:
                    type: string
            allowed_hosts:
                type: array
                items:
                    type: string
        required:
            - name
            - type
            - auth_config
    v1CreateCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
    v1CreateEnrollmentKeyResponse:
        type: object
        properties:
            enrollment_key:
                $ref: '#/definitions/v1EnrollmentKey'
    v1CreateEnvironmentRequest:
        type: object
        properties:
            application_id:
                type: string
                description: The application to create this environment for (UUID).
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "prod", "staging-us-east").
                    Unique within the application. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: Optional longer-form description of the environment's purpose.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Arbitrary key-value labels for organizing and filtering environments.
            kubernetes:
                $ref: '#/definitions/v1KubernetesTarget'
                description: Where workload components go.
        description: CreateEnvironmentRequest contains the parameters for creating a new environment.
        required:
            - application_id
            - name
    v1CreateEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The created environment.
        description: CreateEnvironmentResponse contains the newly created environment.
    v1CreateInvitationRequest:
        type: object
        properties:
            email:
                type: string
                description: Where the mail goes, and the address the user will be created with.
            role:
                $ref: '#/definitions/v1UserRole'
                description: The role to hold on joining. ADMIN or MEMBER.
        description: CreateInvitationRequest invites one address into the caller's tenant.
        required:
            - email
            - role
    v1CreateInvitationResponse:
        type: object
        properties:
            invitation:
                $ref: '#/definitions/v1Invitation'
        description: CreateInvitationResponse carries the invitation, without its link.
    v1CreateRunRequest:
        type: object
        properties:
            application_id:
                type: string
                description: The application to run (UUID).
            environment_id:
                type: string
                description: The target environment (UUID).
            message:
                type: string
                description: Optional message describing this run.
            source_run_id:
                type: string
                description: |-
                    Optional: run from a prior run's configuration snapshots instead of
                    from the current component HEAD. When set, each revision is seeded
                    from the source run's revision for the same component (catalog_item_id,
                    version, resolved_values, source_id, working_directory). This is the
                    rollback mechanism: re-plan and re-apply a known-good configuration
                    against the current infrastructure state.
            change_set_id:
                type: string
                description: |-
                    Optional: run the entries and variable changes captured in a change
                    set. When set, the component set and variable overlay are sourced from
                    the change set instead of the application's full component list. The
                    change set must be OPEN and target the same (application, environment).
        description: CreateRunRequest triggers a new run.
        required:
            - application_id
            - environment_id
    v1CreateRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: The created run. Status will be PENDING initially.
        description: CreateRunResponse contains the newly created run.
    v1Credential:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            name:
                type: string
                description: Unique within the tenant.
            description:
                type: string
            type:
                $ref: '#/definitions/v1CredentialType'
                description: Immutable after creation.
            auth_config:
                $ref: '#/definitions/v1AuthConfig'
                description: Write-only. Empty in every response.
            labels:
                type: object
                additionalProperties:
                    type: string
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
            allowed_hosts:
                type: array
                items:
                    type: string
                description: |-
                    Hosts this credential may be presented to, as a guard: empty means any
                    host its type fits; set means the platform refuses to present it
                    anywhere else, whatever it is attached to. Hostnames, optionally with
                    a port: `github.acme.example`, `harbor.acme.example:8443`. No scheme,
                    no path.
        description: |-
            Credential is a registered credential's metadata. The secret is set
            through `auth_config` and never read back; responses carry it empty.
    v1CredentialType:
        type: string
        enum:
            - CREDENTIAL_TYPE_UNSPECIFIED
            - CREDENTIAL_TYPE_SSH_KEY
            - CREDENTIAL_TYPE_BASIC_AUTH
            - CREDENTIAL_TYPE_BEARER_TOKEN
            - CREDENTIAL_TYPE_GITHUB_APP
        default: CREDENTIAL_TYPE_UNSPECIFIED
        description: |-
            CredentialType is the protocol family a credential is presented as. Each
            fetch takes the families its protocol speaks: a module registry, an
            archive and an OCI token take a bearer token; git over https, a Helm
            repository and an OCI login take basic auth; git over ssh takes a key.

             - CREDENTIAL_TYPE_SSH_KEY: An SSH private key, for git over ssh.
             - CREDENTIAL_TYPE_BASIC_AUTH: A username and password: git over https, a Helm repository, an OCI
            registry, an authenticated archive.
             - CREDENTIAL_TYPE_BEARER_TOKEN: One token. Presented as `Authorization: Bearer` to a module registry,
            a Helm repository, an OCI registry or an archive host, and as the
            basic-auth password with the `x-access-token` username to git over
            https, which is how GitHub and GitLab take a token.
             - CREDENTIAL_TYPE_GITHUB_APP: A GitHub App installation. Not a secret that is presented: the platform
            mints a short-lived installation token from the app's private key at
            fetch time and presents that as a bearer token. Works for github.com,
            GitHub Enterprise Cloud and GitHub Enterprise Server.
    v1DeleteAgentResponse:
        type: object
    v1DeleteApplicationResponse:

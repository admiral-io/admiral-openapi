    v1ResolveCatalogItemResponse:
        type: object
        properties:
            revision:
                type: string
                description: |-
                    The resolved revision identifier. For Git sources, this is the commit SHA.
                    For registry sources, the canonical version string. For HTTP, a content hash.
            digest:
                type: string
                description: |-
                    Content-addressing digest of the fetched content (e.g., "sha1:<commit>",
                    "sha256:<hash>").
            catalog_item:
                $ref: '#/definitions/v1CatalogItem'
                description: The catalog item that was resolved, with current field values.
        description: |-
            ResolveCatalogItemResponse contains the resolved metadata from fetching the
            catalog item's content via its Source.
    v1ResourceSnapshot:
        type: object
        properties:
            group:
                type: string
                description: API group; empty for core resources (Pod, Service, ...).
            version:
                type: string
                description: API version (e.g., "v1").
            kind:
                type: string
                description: Kubernetes resource kind.
            namespace:
                type: string
                description: Kubernetes namespace; empty for cluster-scoped resources.
            name:
                type: string
                description: Object name.
            sync:
                $ref: '#/definitions/v1SyncState'
                description: Whether this resource matches the bundle.
            health:
                $ref: '#/definitions/v1WorkloadHealthStatus'
                description: Derived health of this resource.
            message:
                type: string
                description: |-
                    Short human-readable detail (e.g., "ready: 2/3", "ImagePullBackOff"). Empty
                    for healthy resources.
            field_owners:
                type: array
                items:
                    type: string
                description: |-
                    Field managers other than the agent that have touched this resource (from
                    .metadata.managedFields). Empty when the agent is the sole writer; non-empty
                    is the "known drift" signal (HPA, VPA, kubectl edits).
        description: |-
            ResourceSnapshot is the per-managed-resource entry inside a WorkloadStatus.
            Identity is structured (group/version/kind/namespace/name) so the server does
            not parse an encoded ID.
    v1RetryRevisionResponse:
        type: object
        properties:
            revision:
                $ref: '#/definitions/v1Revision'
                description: |-
                    The retried revision. Status resets and retry_count is incremented.
                    Downstream revisions that were BLOCKED will automatically unblock
                    if this revision succeeds.
        description: RetryRevisionResponse contains the updated revision.
    v1Revision:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the revision (UUID).
            run_id:
                type: string
                description: The run this revision belongs to (UUID).
            component_id:
                type: string
                description: The component this revision is for (UUID).
            component_name:
                type: string
                description: Component name at the time of run (immutable semantic key).
            kind:
                $ref: '#/definitions/v1RevisionKind'
                description: Component kind at the time of run (after override resolution).
            status:
                $ref: '#/definitions/v1RevisionStatus'
                description: Lifecycle status of this revision.
            change_type:
                $ref: '#/definitions/v1RevisionChangeType'
                description: |-
                    What type of change this revision represents relative to the previously
                    deployed state.
            previous_revision_id:
                type: string
                description: |-
                    The last succeeded revision for this (component, environment) at the
                    time this revision was created. Null for CREATE revisions.
            source_id:
                type: string
                description: |-
                    The source the module pointed to at the time of this revision (UUID).
                    Snapshotted so a rollback can re-fetch from the original source even if
                    the module's source binding is later edited. Execution today resolves
                    fetch location through the live module; this field is the audit anchor.
            ref:
                type: string
                description: The git ref / version selector deployed (the component's ref at snapshot).
            resolved_values:
                type: string
                description: |-
                    The resolved values template snapshot: the values_template with all
                    variable references and component output references fully resolved.
                    Stored for audit: shows exactly what inputs were used. Sensitive
                    variable values are masked in API responses.
            depends_on:
                type: array
                items:
                    type: string
                description: |-
                    Component IDs that this revision depends on. Populated from the resolved
                    depends_on list plus implicit dependencies from template expressions.
            blocked_by:
                type: array
                items:
                    type: string
                description: |-
                    Component IDs that are blocking this revision. Only populated when
                    status is BLOCKED; indicates which upstream components failed.
            plan_summary:
                $ref: '#/definitions/v1ChangeSummary'
                description: |-
                    The normalized change counts (creates/updates/deletes/noops) this
                    revision's plan computed. Populated after planning. Engine-agnostic.
            available_phases:
                type: array
                items:
                    $ref: '#/definitions/v1RevisionPhase'
                description: |-
                    Phase labels for which a transcript has been stored, in the order they
                    ran. Populated as each phase completes (a revision that planned and then
                    applied carries `[REVISION_PHASE_PLAN, REVISION_PHASE_APPLY]`). Fetch a
                    phase's transcript via
                    `GET /api/v1/runs/{run_id}/revisions/{revision_id}/{phase}`.
            error_message:
                type: string
                description: Error message if the revision failed. Empty on success.
            retry_count:
                type: integer
                format: int32
                description: Number of retry attempts. Starts at 0 for the initial attempt.
            started_at:
                type: string
                format: date-time
                description: When the revision started execution (transitioned from PENDING/QUEUED).
            completed_at:
                type: string
                format: date-time
                description: When the revision finished (succeeded, failed, or canceled).
            working_directory:
                type: string
                description: |-
                    Subdirectory within the delivered archive where the executor runs.
                    Empty means the archive root. Populated from the catalog item's path field
                    at snapshot time so that relative references resolve correctly.
            created_at:
                type: string
                format: date-time
                description: When the revision was created (same as run created_at).
            resolved_commit:
                type: string
                description: |-
                    The concrete commit this revision resolved its ref to and pinned -- the
                    reproducibility anchor. `ref` is the intent (e.g. `main`); this is what
                    actually deployed. Populated when resolution is wired (a later WP).
            type:
                type: string
                description: |-
                    The deploy/engine type this revision runs (TERRAFORM/HELM/KUSTOMIZE/
                    MANIFEST), denormalized from the component at snapshot. Selects the
                    executor: the orchestration layer routes by this type, not by kind.
        description: |-
            Revision represents an immutable, rendered artifact for a single component
            within a run. Each revision tracks the full lifecycle from rendering
            through execution, and stores references to the produced artifacts
            (rendered manifests, binary plan files, etc.).

            For infrastructure components (terraform-semantic engine, Terraform or
            OpenTofu):
              - Rendering produces the infrastructure source tree (.tf files and
                auto-loaded tfvars) with resolved variable values.
              - The engine's plan and apply phases are executed by the assigned
                TERRAFORM agent (see JobBundle.engine for engine selection).
              - The plan output is stored for visibility.
              - Each component has its own state, stored via the configured backend.

            For workload components (Helm, Kustomize, manifests):
              - Rendering produces Kubernetes manifests (via helm template, kustomize
                build, or raw file collection).
              - Manifests are ordered (CRDs before resources, namespaces first).
              - The rendered bundle is sent to the K8s agent for application.
    v1RevisionBundle:
        type: object
        properties:
            artifact_url:
                type: string
                description: |-
                    Signed URL to download the rendered manifest bundle (tar.gz of ordered
                    Kubernetes YAML manifests). Time-limited.
            artifact_checksum:
                type: string
                description: SHA-256 checksum of the artifact bundle for integrity verification.
            namespace:
                type: string
                description: |-
                    The Kubernetes namespace to apply manifests into. Resolved from the
                    component's target namespace (defaults to the environment name when empty).
            component_name:
                type: string
                description: Component name for logging and status tracking.
            ref:
                type: string
                description: The git ref / version selector being deployed (chart version, git ref).
        description: |-
            RevisionBundle contains pre-rendered Kubernetes manifests for a workload
            revision, ready for server-side apply by a KUBERNETES agent.
    v1RevisionChangeType:
        type: string
        enum:
            - REVISION_CHANGE_TYPE_UNSPECIFIED
            - REVISION_CHANGE_TYPE_CREATE
            - REVISION_CHANGE_TYPE_UPDATE
            - REVISION_CHANGE_TYPE_DESTROY
            - REVISION_CHANGE_TYPE_RECREATE
            - REVISION_CHANGE_TYPE_IMPORT
            - REVISION_CHANGE_TYPE_NO_CHANGE
        default: REVISION_CHANGE_TYPE_UNSPECIFIED
        description: |-
            RevisionChangeType classifies the change a revision represents relative to
            the previously deployed state for the same component.

             - REVISION_CHANGE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - REVISION_CHANGE_TYPE_CREATE: First revision for this component (no previous SUCCEEDED revision).
             - REVISION_CHANGE_TYPE_UPDATE: Module/version/values changed in place; same module binding.
             - REVISION_CHANGE_TYPE_DESTROY: Component is being destroyed (the changeset entry was DESTROY).
             - REVISION_CHANGE_TYPE_RECREATE: Module binding changed since the last SUCCEEDED revision; the prior
            resources may need to be recreated under the new module's contract.
             - REVISION_CHANGE_TYPE_IMPORT: Existing infrastructure was imported into management.
             - REVISION_CHANGE_TYPE_NO_CHANGE: Module/version/values match the last SUCCEEDED revision; the revision
            is a re-plan (e.g., to recompute outputs against a refreshed env).
    v1RevisionKind:
        type: string
        enum:
            - REVISION_KIND_UNSPECIFIED
            - REVISION_KIND_INFRASTRUCTURE
            - REVISION_KIND_WORKLOAD
        default: REVISION_KIND_UNSPECIFIED
        description: |-
            RevisionKind mirrors ComponentKind but is stored on the revision to capture
            the effective kind at run time (may differ from the component default
            if an environment override changed the source type).

             - REVISION_KIND_UNSPECIFIED: Default value. Must not be used.
             - REVISION_KIND_INFRASTRUCTURE: Infrastructure revision (IaC). Plan -> apply lifecycle.
             - REVISION_KIND_WORKLOAD: Workload revision (Helm, Kustomize, manifests). Direct apply lifecycle.
    v1RevisionPhase:
        type: string
        enum:
            - REVISION_PHASE_UNSPECIFIED
            - REVISION_PHASE_PLAN
            - REVISION_PHASE_APPLY
        default: REVISION_PHASE_UNSPECIFIED
        description: |-
            RevisionPhase labels which phase of a revision's lifecycle produced a
            retrievable transcript. Plan and apply are the only phases today; future
            phases (e.g., import) extend this enum without changing the storage shape.

             - REVISION_PHASE_UNSPECIFIED: Default value. Must not be used.
             - REVISION_PHASE_PLAN: Plan transcript (terraform plan / tofu plan output).
             - REVISION_PHASE_APPLY: Apply transcript (terraform apply / tofu apply output).
    v1RevisionStatus:
        type: string
        enum:
            - REVISION_STATUS_UNSPECIFIED
            - REVISION_STATUS_PENDING
            - REVISION_STATUS_QUEUED
            - REVISION_STATUS_PLANNING
            - REVISION_STATUS_PLANNED
            - REVISION_STATUS_APPLYING
            - REVISION_STATUS_SUCCEEDED
            - REVISION_STATUS_FAILED
            - REVISION_STATUS_BLOCKED
            - REVISION_STATUS_CANCELED
            - REVISION_STATUS_SUPERSEDED
            - REVISION_STATUS_DEFERRED
            - REVISION_STATUS_STALE
            - REVISION_STATUS_AWAITING_APPROVAL
        default: REVISION_STATUS_UNSPECIFIED
        description: |-
            RevisionStatus represents the lifecycle status of a single component
            revision within a run.

             - REVISION_STATUS_UNSPECIFIED: Default value. Must not be used.
             - REVISION_STATUS_PENDING: The revision has been created but execution has not started. Waiting for
            its turn in the dependency graph.
             - REVISION_STATUS_QUEUED: The revision is queued for execution. Its upstream dependencies have
            completed and it will begin shortly.
             - REVISION_STATUS_PLANNING: (Infrastructure only) The engine's plan is being generated
            (`terraform plan` / `tofu plan`). Transitions to PLANNED on success
            or FAILED on error.
             - REVISION_STATUS_PLANNED: (Infrastructure only) Plan completed successfully. Under the Option B
            auto-continue model, this state is transient: the apply is dispatched
            immediately if the parent run is already APPLYING (user authorized at
            the changeset level). The plan output is available for review.
             - REVISION_STATUS_APPLYING: The revision is being applied. For infrastructure, this is the engine's
            apply phase (`terraform apply` / `tofu apply`). For workloads, this is
            applying manifests to the target cluster.
             - REVISION_STATUS_SUCCEEDED: The revision completed successfully. For infrastructure, the engine's
            apply phase succeeded. For workloads, the manifests were applied and the
            resources reached a healthy state.
             - REVISION_STATUS_FAILED: The revision failed. See `error_message` for details.
             - REVISION_STATUS_BLOCKED: The revision is blocked because an upstream dependency failed. See
            `blocked_by` for the component(s) that caused the block.
             - REVISION_STATUS_CANCELED: The revision was canceled by user action (parent run canceled).
             - REVISION_STATUS_SUPERSEDED: The revision was superseded because its parent run was replaced
            (a newer plan landed for the same change set, or the change set was
            edited). System-driven; distinct from CANCELED.
             - REVISION_STATUS_DEFERRED: The revision cannot plan yet because its values_template references
            outputs of an upstream revision that has not been applied. Analogous to
            terraform's "(known after apply)": the inputs to this plan are
            unknowable until upstream apply completes. Transitions to QUEUED once
            the upstream apply lands and outputs are captured.
             - REVISION_STATUS_STALE: The revision's apply stalled with an unknown outcome (never started, still
            running, or done-but-unreported). Cannot auto-retry; requires
            reconciliation against real state or an audited operator override. (Set by
            the liveness/STALE reaper; see Phase D.)
             - REVISION_STATUS_AWAITING_APPROVAL: The revision has planned and is awaiting explicit approval before its
            apply runs (gating policy != auto-continue). (Set by the gating flow.)
    v1RevisionSummary:
        type: object
        properties:
            total:
                type: integer
                format: int32
                description: Total number of component revisions in this run.
            succeeded:
                type: integer
                format: int32
                description: Number of revisions that completed successfully.
            failed:
                type: integer
                format: int32
                description: Number of revisions that failed.
            blocked:
                type: integer
                format: int32
                description: Number of revisions that are blocked by upstream failures.
            running:
                type: integer
                format: int32
                description: Number of revisions currently running (planning or applying).
            canceled:
                type: integer
                format: int32
                description: Number of revisions that were canceled.
            pending:
                type: integer
                format: int32
                description: Number of revisions that have not started yet.
        description: |-
            RevisionSummary provides aggregate counts of revision statuses within a
            run, enabling quick status display without loading all revisions.
    v1RevokeAgentTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The token metadata with updated status.
        description: RevokeAgentTokenResponse contains the revoked agent SAT metadata.
    v1RevokePersonalAccessTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The token metadata with updated status.
        description: RevokePersonalAccessTokenResponse contains the revoked PAT metadata.
    v1Run:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the run (UUID).
            application_id:
                type: string
                description: The application being deployed (UUID).
            environment_id:
                type: string
                description: The target environment (UUID).
            status:
                $ref: '#/definitions/v1RunStatus'
                description: Composite status derived from all component revisions.
            triggered_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent that triggered the run (server-populated from token).
            message:
                type: string
                description: |-
                    Optional message describing the run (e.g., "Deploying v2.1.0
                    with new caching layer" or "Rolling back to stable after API errors").
            source_run_id:
                type: string
                description: |-
                    If this run was created as a rollback from a prior run, this field
                    contains the source run's UUID. Empty for normal runs.
            change_set_id:
                type: string
                description: |-
                    The changeset that was deployed (UUID). Absent for pre-changeset runs
                    and reconcile (no-changeset) runs.
            revision_summary:
                $ref: '#/definitions/v1RevisionSummary'
                description: Summary counts for quick status display.
            completed_at:
                type: string
                format: date-time
                description: |-
                    When the run finished (all revisions completed, failed, or canceled).
                    Absent while the run is in progress.
            display_id:
                type: string
                description: |-
                    Typed display identifier of the form `run-<12-char-suffix>` (e.g.,
                    `run-3k7m9p2q4rvw`). Server-generated, indexed, and stable. Prefer this
                    over `id` for user-facing references; lookups accept either form.
            application_name:
                type: string
                description: |-
                    Display name of the parent application. Denormalized for display.
                    Read-only; ignored on writes.
            environment_name:
                type: string
                description: |-
                    Display name of the parent environment. Denormalized for display.
                    Read-only; ignored on writes.
            change_set_display_id:
                type: string
                description: |-
                    Display ID of the changeset this run deployed (`cs-<suffix>`).
                    Denormalized for display. Empty when `change_set_id` is empty
                    (pre-changeset runs, reconcile runs). Read-only.
            change_set_title:
                type: string
                description: |-
                    Title of the changeset this run deployed. Denormalized for display.
                    Empty when `change_set_id` is empty. Read-only.
            created_at:
                type: string
                format: date-time
                description: When the run was created.
        description: |-
            Run represents a single execution against an application+environment.
            Each run produces one Revision per component. The run tracks the composite
            status across all revisions and provides the audit trail for what was
            executed, when, and by whom.

            Run records are immutable once created. There is no UpdateRun RPC and no
            `updated_at` field. The composite `status`, `revision_summary`, and
            `completed_at` fields are server-maintained as revisions progress;
            everything else is fixed at creation time. To change what is deployed,
            create a new run.
    v1RunStatus:
        type: string
        enum:
            - RUN_STATUS_UNSPECIFIED
            - RUN_STATUS_PENDING
            - RUN_STATUS_QUEUED
            - RUN_STATUS_PLANNING
            - RUN_STATUS_PLANNED
            - RUN_STATUS_APPLYING
            - RUN_STATUS_SUCCEEDED
            - RUN_STATUS_PARTIALLY_FAILED
            - RUN_STATUS_FAILED
            - RUN_STATUS_CANCELED
            - RUN_STATUS_SUPERSEDED
            - RUN_STATUS_STALE
            - RUN_STATUS_AWAITING_APPROVAL
        default: RUN_STATUS_UNSPECIFIED
        description: |-
            RunStatus represents the composite status of a run, derived from the
            statuses of all its component revisions.

             - RUN_STATUS_UNSPECIFIED: Default value. Must not be used.
             - RUN_STATUS_PENDING: The run has been created and is being initialized (resolving
            components, building dependency graph).
             - RUN_STATUS_QUEUED: The run is queued behind another active run for the same
            application+environment. It will start automatically when the preceding
            run completes or is canceled.
             - RUN_STATUS_PLANNING: At least one revision is actively planning (or waiting to plan).
             - RUN_STATUS_PLANNED: All revisions have completed planning and are awaiting approval.
             - RUN_STATUS_APPLYING: At least one revision is actively applying.
             - RUN_STATUS_SUCCEEDED: All revisions completed successfully.
             - RUN_STATUS_PARTIALLY_FAILED: Some revisions succeeded but at least one failed or is blocked. No
            revisions are still running.
             - RUN_STATUS_FAILED: All non-independent revisions failed or were blocked. No revisions are
            still running.
             - RUN_STATUS_CANCELED: The run was canceled by a user. Already-succeeded revisions
            remain applied.
             - RUN_STATUS_SUPERSEDED: The run was superseded by a newer plan for the same change set,
            or invalidated by an edit to the change set's entries / variables. The
            system marked it terminal; the user did not. Distinct from CANCELED to
            keep the audit trail honest about who initiated the transition.
             - RUN_STATUS_STALE: At least one revision's apply stalled with an unknown outcome and requires
            reconciliation before the run can proceed. Not terminal; not auto-advanced.
            (Set by the liveness/STALE reaper; see Phase D.)
             - RUN_STATUS_AWAITING_APPROVAL: At least one revision has planned and is awaiting explicit approval before
            its apply runs (gating policy != auto-continue). Not terminal; the user is
            the gatekeeper. (Set by the gating flow; see the per-env gating policy.)
    v1SSHKeyAuth:
        type: object
        properties:
            private_key:
                type: string
                description: |-
                    PEM-encoded SSH private key.
                    Write-only: masked in responses.
            passphrase:
                type: string
                description: |-
                    Optional passphrase for the private key.
                    Write-only: masked in responses.
        description: SSHKeyAuth holds an SSH private key and optional passphrase.
    v1SetEntryResponse:
        type: object
        properties:
            entry:
                $ref: '#/definitions/v1ChangeSetEntry'
                description: The entry as recorded on the change set.
        description: SetEntryResponse contains the created or replaced entry.
    v1SetVariableResponse:
        type: object
        properties:
            variable_entry:
                $ref: '#/definitions/v1ChangeSetVariableEntry'
                description: The variable entry as recorded on the change set.
        description: SetVariableResponse contains the created or replaced variable entry.
    v1Source:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the source (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "corporate-rds", "nginx-chart").
                    Unique within the tenant. Lowercase alphanumeric and hyphens only, must
                    start with a letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the source's purpose
                    (e.g., "Corporate-approved RDS module with encryption and backups").
            type:
                $ref: '#/definitions/v1SourceType'
                description: The kind of artifact and fetch protocol. Immutable after creation.
            url:
                type: string
                description: |-
                    Base URL for the source. The meaning varies by source type:
                      - GIT: Git repo URL (https:// or git@host:...)
                      - TERRAFORM: registry hostname (e.g., "registry.terraform.io")
                      - HELM: chart repo URL (e.g., "https://charts.bitnami.com/bitnami")
                      - OCI: OCI repository URL (e.g., "oci://ghcr.io/myorg/charts/my-app")
                      - HTTP: full HTTP(S) URL to the archive (tar/zip). Covers plain
                        HTTP hosts and presigned S3/GCS/Azure Blob URLs.
            credential_id:
                type: string
                description: |-
                    Reference to the credential providing authentication for this source (UUID).
                    Optional. Null for public sources that require no authentication
                    (e.g., public Terraform registry, public Helm repos).
            source_config:
                $ref: '#/definitions/v1SourceConfig'
                description: |-
                    Type-specific configuration. Only set for source types whose location is
                    not fully expressed by `url` alone (currently TERRAFORM and HELM, which
                    both host multiple artifacts and need a selector). Other source types
                    (GIT, OCI, HTTP) carry all location information in `url`.
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering sources
                    (e.g., `{"team": "platform", "category": "database"}`).
            last_test_status:
                $ref: '#/definitions/v1SourceTestStatus'
                description: |-
                    Outcome of the most recent TestSource invocation. Reflects whether the
                    attached credential successfully authenticated against `url` the last time
                    a test was run. UNSPECIFIED if the source has never been tested.
                readOnly: true
            last_test_error:
                type: string
                description: |-
                    Human-readable error message from the most recent failed TestSource.
                    Empty when `last_test_status` is SUCCESS or unset.
                readOnly: true
            last_tested_at:
                type: string
                format: date-time
                description: |-
                    When TestSource was last explicitly invoked against this source. Absent if
                    never tested. This reflects the last on-demand test, not the last time the
                    source was used in a deployment fetch/render.
                readOnly: true
            credential_name:
                type: string
                description: |-
                    Display name of the attached credential. Denormalized for display.
                    Empty when `credential_id` is unset (public sources).
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this source (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the source was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the source was last updated.
                readOnly: true
        description: |-
            Source represents a fetchable artifact definition: a pointer to an external
            module, chart, or manifest set that Admiral can fetch, inspect, and render
            into deployment snapshots.

            Sources are tenant-scoped.
    v1SourceConfig:
        type: object
        properties:
            terraform:
                $ref: '#/definitions/v1TerraformConfig'
                description: Terraform Registry Protocol config (for SOURCE_TYPE_TERRAFORM).
            helm:
                $ref: '#/definitions/v1HelmConfig'
                description: Helm HTTP repository config (for SOURCE_TYPE_HELM).
        description: |-
            SourceConfig is the type-specific configuration attached to a Source. Only
            source types whose location is not fully expressed by `url` alone (TERRAFORM,
            HELM) populate a variant. Source types whose URL is self-contained (GIT, OCI,
            HTTP) leave this message unset.
    v1SourceRefKind:
        type: string
        enum:
            - SOURCE_REF_KIND_UNSPECIFIED
            - SOURCE_REF_KIND_TAG
            - SOURCE_REF_KIND_BRANCH
            - SOURCE_REF_KIND_SEMVER
            - SOURCE_REF_KIND_DIGEST
        default: SOURCE_REF_KIND_UNSPECIFIED
        description: |-
            SourceRefKind classifies a discovered ref by what it is, so a single
            version list can carry branches, tags, and registry versions together and
            the consumer can bucket them. The kind also signals mutability: BRANCH is a
            moving pointer that re-resolves over time, while TAG, SEMVER, and DIGEST are
            conventionally stable.

             - SOURCE_REF_KIND_UNSPECIFIED: Default. The backend did not classify the ref.
             - SOURCE_REF_KIND_TAG: A Git tag. Conventionally immutable.
             - SOURCE_REF_KIND_BRANCH: A Git branch. A moving pointer; resolves to a different commit over time.
             - SOURCE_REF_KIND_SEMVER: A registry semantic version (Terraform module or Helm chart). Immutable.
             - SOURCE_REF_KIND_DIGEST: An OCI content digest. Immutable and content-addressed.
    v1SourceTestStatus:
        type: string
        enum:
            - SOURCE_TEST_STATUS_UNSPECIFIED
            - SOURCE_TEST_STATUS_SUCCESS
            - SOURCE_TEST_STATUS_FAILURE
        default: SOURCE_TEST_STATUS_UNSPECIFIED
        description: |-
            SourceTestStatus reports the outcome of the last TestSource invocation.

             - SOURCE_TEST_STATUS_UNSPECIFIED: Default. Used when no test has been recorded.
             - SOURCE_TEST_STATUS_SUCCESS: The credential authenticated successfully against the source URL.
             - SOURCE_TEST_STATUS_FAILURE: The credential failed to authenticate or the URL was unreachable. See
            `last_test_error` for details.
    v1SourceType:
        type: string
        enum:
            - SOURCE_TYPE_UNSPECIFIED
            - SOURCE_TYPE_GIT
            - SOURCE_TYPE_TERRAFORM
            - SOURCE_TYPE_HELM
            - SOURCE_TYPE_OCI
            - SOURCE_TYPE_HTTP
        default: SOURCE_TYPE_UNSPECIFIED
        description: |-
            SourceType identifies the fetch protocol: how Admiral's Fetcher layer
            retrieves content from the source URL. Types are carved by wire protocol,
            not by content semantics. "This is a Terraform module" vs "this is a Helm
            chart" is a Catalog/Component concern, not a Source concern.

             - SOURCE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - SOURCE_TYPE_GIT: Git repository over smart HTTP(S) or SSH. Any repo regardless of what
            it contains: Terraform modules, Helm charts, Kustomize overlays, raw
            manifests, plain source code. Catalog/Component decides how to interpret.
             - SOURCE_TYPE_TERRAFORM: Terraform Module/Provider Registry Protocol. A JSON HTTP API for version
            discovery and download (public registry.terraform.io, HCP Terraform,
            GitLab module registries, etc.).
             - SOURCE_TYPE_HELM: Helm HTTP chart repository (index.yaml-based). Served over HTTP(S).
             - SOURCE_TYPE_OCI: OCI Distribution Spec registry. Covers container images, OCI-wrapped Helm
            charts, and any other artifact pushed to an OCI registry. The content
            interpretation is a Component concern.
             - SOURCE_TYPE_HTTP: Bare HTTP(S) GET against a URL returning a tar/zip archive, which is
            extracted by the Fetcher. No discovery protocol on top; the URL is the
            artifact. Covers presigned S3/GCS/Azure Blob URLs as well as plain
            artifact hosts.
    v1SourceVersion:
        type: object
        properties:
            version:
                type: string
                description: |-
                    Version identifier. For registry sources, this is a semver string
                    (e.g., "1.2.3"). For Git sources, this is a branch or tag name
                    (e.g., "main", "v1.2.3"). For OCI, this is a tag.
            published_at:
                type: string
                format: date-time
                description: |-
                    When this version was published or tagged. May not be available for all
                    source types.
            description:
                type: string
                description: |-
                    Optional description or release notes for this version. Typically only
                    available from registry sources.
            kind:
                $ref: '#/definitions/v1SourceRefKind'
                description: |-
                    What kind of ref this is. Lets a single list carry mixed kinds (branches,
                    tags, registry versions) so consumers can bucket them.
            resolved:
                type: string
                description: |-
                    The immutable handle this ref currently points to: a Git commit SHA for
                    BRANCH and TAG, an OCI digest for a tag. Empty when not applicable (registry
                    SEMVER, where `version` is already the immutable identifier) or not cheaply
                    resolvable. For a BRANCH this is a snapshot that changes as the branch
                    moves; pinning by `resolved` captures an exact, reproducible point.
        description: |-
            SourceVersion represents an available ref of a source artifact, as reported
            by the external system (registry versions, Git branches and tags, OCI tags).
    v1SyncState:
        type: string
        enum:
            - SYNC_STATE_UNSPECIFIED
            - SYNC_STATE_SYNCED
            - SYNC_STATE_OUT_OF_SYNC
            - SYNC_STATE_UNKNOWN
            - SYNC_STATE_IGNORED
        default: SYNC_STATE_UNSPECIFIED
        description: |-
            SyncState describes whether the live cluster state matches the desired bundle
            for a workload's current revision.

             - SYNC_STATE_UNSPECIFIED: Default value. Must not be used.
             - SYNC_STATE_SYNCED: Every managed resource matches the bundle.
             - SYNC_STATE_OUT_OF_SYNC: At least one managed resource has drifted from the bundle, and the drift is
            not attributable to a known foreign field manager.
             - SYNC_STATE_UNKNOWN: Sync state could not be determined (bundle unreachable, comparison failed).
             - SYNC_STATE_IGNORED: The operator paused reconciliation of this resource (admiral.io/reconcile =
            disabled), so the agent does not apply or prune it. Drift is not a failure
            here; the resource is intentionally under manual control.
    v1TerraformAgentStatus:
        type: object
        properties:
            version:
                type: string
                description: The agent binary version (e.g., "1.2.0").
            active_jobs:
                type: integer
                format: int32
                description: Number of jobs currently being executed by this agent.
            max_concurrent_jobs:
                type: integer
                format: int32
                description: Maximum number of concurrent jobs this agent supports.
            active_job_details:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ActiveJobInfo'
                description: |-
                    Details of jobs currently being executed by this agent instance. The worker
                    thread updates job phase in shared memory; the heartbeat thread reads and
                    includes it on each tick. `len(active_job_details)` equals `active_jobs` on
                    every heartbeat (not capped or sampled).
        description: |-
            TerraformAgentStatus contains capacity and telemetry metrics for a TERRAFORM
            agent, as reported via Heartbeat. Used in both the push payload
            (HeartbeatRequest) and the read response (GetAgentStatusResponse).

            (Successor to the former admiral.runner.v1.RunnerStatus.)
    v1TerraformConfig:
        type: object
        properties:
            namespace:
                type: string
                description: Module namespace in the registry (e.g., "hashicorp", "myorg").
            module_name:
                type: string
                description: Module name in the registry (e.g., "consul", "rds").
            system:
                type: string
                description: Target system / provider (e.g., "aws", "azurerm", "google").
        description: TerraformConfig identifies a module within a Terraform registry.
        required:
            - namespace
            - module_name
            - system
    v1TestSourceResponse:
        type: object
        properties:
            status:
                $ref: '#/definitions/v1SourceTestStatus'
                description: The outcome of the test.
            error:
                type: string
                description: Human-readable error message when `status` is FAILURE. Empty on success.
            source:
                $ref: '#/definitions/v1Source'
                description: The source with test status fields refreshed.
        description: |-
            TestSourceResponse reports the outcome of the test against the external
            system. The same outcome is persisted on the Source (`last_test_status`,
            `last_test_error`, `last_tested_at`).
    v1TokenType:
        type: string
        enum:
            - TOKEN_TYPE_UNSPECIFIED
            - TOKEN_TYPE_PAT
            - TOKEN_TYPE_SAT
        default: TOKEN_TYPE_UNSPECIFIED
        description: |-
            TokenType identifies the category of an access token issued by Admiral's token system.
            IDP-issued JWTs (OAuth2/OIDC sessions) are NOT represented here. They are
            resolved by separate middleware and can be referenced as "session" in
            AuthRule.allowed_token_types when needed.

             - TOKEN_TYPE_UNSPECIFIED: Default value. Must not be used.
             - TOKEN_TYPE_PAT: Personal Access Token, bound to a user.
             - TOKEN_TYPE_SAT: Service Access Token, bound to an agent.
    v1UpdateAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
                description: The updated agent.
        description: UpdateAgentResponse contains the updated agent.
    v1UpdateApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The updated application.
        description: UpdateApplicationResponse contains the updated application.
    v1UpdateCatalogItemResponse:
        type: object
        properties:
            catalog_item:
                $ref: '#/definitions/v1CatalogItem'
                description: The updated catalog item.
        description: UpdateCatalogItemResponse contains the updated catalog item.
    v1UpdateChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
                description: The updated change set.
        description: |-
            UpdateChangeSetResponse contains the updated change set (metadata only;
            entries are not returned; call GetChangeSet for the full record).
    v1UpdateCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
                description: The updated credential. Sensitive fields are masked.
        description: UpdateCredentialResponse contains the updated credential.
    v1UpdateEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The updated environment.
        description: UpdateEnvironmentResponse contains the updated environment.
    v1UpdatePersonalAccessTokenResponse:
        type: object
        properties:
            access_token:
                $ref: '#/definitions/v1AccessToken'
                description: The updated token metadata.
        description: UpdatePersonalAccessTokenResponse contains the updated PAT metadata.
    v1UpdateSourceResponse:
        type: object
        properties:
            source:
                $ref: '#/definitions/v1Source'
                description: The updated source.
        description: UpdateSourceResponse contains the updated source.
    v1User:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the user (UUID).
            email:
                type: string
                description: User's email address.
            email_verified:
                type: boolean
                description: Whether the email has been verified by the IdP.
            display_name:
                type: string
                description: User's display name for UI purposes.
            given_name:
                type: string
                description: User's given (first) name.
            family_name:
                type: string
                description: User's family (last) name.
            avatar_url:
                type: string
                description: URL to the user's avatar image.
            created_at:
                type: string
                format: date-time
                description: When the user was created.
            updated_at:
                type: string
                format: date-time
                description: When the user was last updated.
        description: User represents a user's profile information.
    v1ValueDiff:
        type: object
        properties:
            key:
                type: string
                description: Key inside the values_template. Always `values_template` today.
            change_type:
                $ref: '#/definitions/v1DiffChangeType'
                description: The change type (ADDED, CHANGED, REMOVED).
            old:
                type: string
                description: Previous value (absent for ADDED, sensitive, or when not tracked).
            new:
                type: string
                description: New value (absent for REMOVED, sensitive, or when not tracked).
            sensitive:
                type: boolean
                description: True when the underlying value is sensitive; old/new must be omitted.
        description: |-
            ValueDiff describes a single value change inside an entry's
            `values_template`. EntryDiff emits at most one ValueDiff per entry, keyed
            `values_template`, carrying the full template text.

            Sensitive values are masked: when `sensitive=true`, both `old` and `new`
            are absent.
    v1Variable:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the variable (UUID).
            key:
                type: string
                description: |-
                    The variable name. For user-created variables, must be a valid
                    environment variable identifier (e.g., "DATABASE_URL", "API_KEY").
                    Infrastructure output variables use dot-namespaced keys
                    (e.g., "vpc.vpc_id", "database.endpoint") and are system-managed.
            value:
                type: string
                description: |-
                    The variable value. Always stored as a string; use `type` to indicate
                    how to interpret it. Masked or empty for sensitive variables in responses.

                    For COMPLEX type, this is a JSON-encoded string (e.g., '["a","b"]' or
                    '{"key":"value"}'). The rendering engine converts it to the target format
                    (HCL for Terraform, YAML for Helm).
            sensitive:
                type: boolean
                description: Whether the variable value is encrypted at rest and masked in API responses.
            type:
                $ref: '#/definitions/v1VariableType'
                description: |-
                    How the value should be interpreted by the rendering engine and displayed
                    in the UI. Defaults to STRING if not specified.
            description:
                type: string
                description: |-
                    Optional description of the variable's purpose (e.g., "Maximum replica
                    count for production scaling" or "RDS instance class per environment").
            application_id:
                type: string
                description: |-
                    The application this variable belongs to (UUID). Always set; variables
                    are env-scoped and inherit their app from the environment.
            environment_id:
                type: string
                description: |-
                    The environment this variable is scoped to (UUID). Always set; variables
                    are env-scoped.
            source:
                $ref: '#/definitions/v1VariableSource'
                description: |-
                    How the variable was created. USER for change-set-managed variables,
                    INFRASTRUCTURE for variables produced by engine output capture (Terraform
                    or OpenTofu). Server-populated.
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this variable (server-populated from token).
            created_at:
                type: string
                format: date-time
                description: When the variable was created.
            updated_at:
                type: string
                format: date-time
                description: When the variable was last updated.
        description: |-
            Variable represents a configuration key-value pair scoped to a specific
            environment within an application. Variables are user-managed configuration
            values, distinct from infrastructure outputs which are system-managed values
            produced by apply (e.g., Terraform outputs, namespaced as
            `<component_name>.<output_name>`).

            Variables are mutated exclusively through change sets (ChangeSetAPI.SetVariable
            / RemoveVariable). They are read via EnvironmentAPI.ListEnvironmentVariables.

            Sensitive variables have their values masked in API responses.
    v1VariableDiff:
        type: object
        properties:
            key:
                type: string
                description: The variable key.
            change_type:
                $ref: '#/definitions/v1DiffChangeType'
                description: The change type (ADDED, CHANGED, REMOVED).
            old:
                type: string
                description: Previous value (absent for ADDED or sensitive).
            new:
                type: string
                description: New value (absent for REMOVED or sensitive).
            sensitive:
                type: boolean
                description: True when either side is sensitive; old/new must be omitted.
        description: |-
            VariableDiff describes a per-key change to environment variables.

            ADDED: the change set sets a key not currently present in the env.
            CHANGED: the change set sets a key with a different value/type/sensitivity.
            REMOVED: the change set carries a tombstone (delete-on-apply) for a key
            that exists in the env.
    v1VariableSource:
        type: string
        enum:
            - VARIABLE_SOURCE_UNSPECIFIED
            - VARIABLE_SOURCE_USER
            - VARIABLE_SOURCE_INFRASTRUCTURE
        default: VARIABLE_SOURCE_UNSPECIFIED
        description: |-
            VariableSource indicates how the variable was created.

             - VARIABLE_SOURCE_UNSPECIFIED: Default value. Must not be used.
             - VARIABLE_SOURCE_USER: User-managed variable created via change sets (ChangeSetAPI.SetVariable).
             - VARIABLE_SOURCE_INFRASTRUCTURE: System-managed variable produced by a successful infrastructure apply
            (engine outputs from `terraform output` / `tofu output`). These variables
            are written by the output capture pipeline and cannot be created or
            deleted via the public API.
    v1VariableType:
        type: string
        enum:
            - VARIABLE_TYPE_UNSPECIFIED
            - VARIABLE_TYPE_STRING
            - VARIABLE_TYPE_NUMBER
            - VARIABLE_TYPE_BOOLEAN
            - VARIABLE_TYPE_COMPLEX
        default: VARIABLE_TYPE_UNSPECIFIED
        description: |-
            VariableType indicates how the variable value should be interpreted by the
            rendering engine and displayed in the UI. The value is always stored as a
            string regardless of type.

             - VARIABLE_TYPE_UNSPECIFIED: Default value. Must not be used.
             - VARIABLE_TYPE_STRING: Plain text value. Quoted when rendered into HCL for an infrastructure
            engine (Terraform / OpenTofu), passed as-is for Helm and Kustomize.
            Rendered as a text input in the UI.
             - VARIABLE_TYPE_NUMBER: Numeric value (integer or decimal). Unquoted when rendered into HCL.
            Rendered as a number input in the UI.
             - VARIABLE_TYPE_BOOLEAN: Boolean value ("true" or "false"). Unquoted when rendered into HCL.
            Rendered as a toggle in the UI.
             - VARIABLE_TYPE_COMPLEX: Structured value (lists, maps, objects). Stored as a JSON-encoded string
            (e.g., '["us-east-1a","us-east-1b"]' or '{"env":"prod","team":"platform"}').
            Rendered as HCL for infrastructure engines, YAML for Helm, or JSON for
            other consumers. Rendered as a code editor in the UI.
    v1Workload:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the workload within Admiral (UUID).
            agent_id:
                type: string
                description: The agent (cluster) this workload belongs to (UUID).
            namespace:
                type: string
                description: Kubernetes namespace.
            name:
                type: string
                description: Workload name.
            kind:
                type: string
                description: Kubernetes resource kind (e.g., "Deployment", "StatefulSet", "DaemonSet").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Kubernetes labels on the workload.
            health_status:
                $ref: '#/definitions/v1WorkloadHealthStatus'
                description: Derived health status.
            status_reason:
                type: string
                description: Human-readable reason for the current status (e.g., "MinimumReplicasUnavailable").
            replicas_desired:
                type: integer
                format: int32
                description: Number of desired replicas.
            replicas_ready:
                type: integer
                format: int32
                description: Number of ready replicas.
            replicas_available:
                type: integer
                format: int32
                description: Number of available replicas.
            cpu_requests_millicores:
                type: string
                format: int64
                description: CPU requests across all containers, in millicores.
            cpu_limits_millicores:
                type: string
                format: int64
                description: CPU limits across all containers, in millicores.
            cpu_used_millicores:
                type: string
                format: int64
                description: Current CPU usage across all containers, in millicores.
            memory_requests_bytes:
                type: string
                format: int64
                description: Memory requests across all containers, in bytes.
            memory_limits_bytes:
                type: string
                format: int64
                description: Memory limits across all containers, in bytes.
            memory_used_bytes:
                type: string
                format: int64
                description: Current memory usage across all containers, in bytes.
            containers:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContainerStatus'
                description: Status of individual containers in this workload.
            last_updated_at:
                type: string
                format: date-time
                description: When this workload's status was last updated.
            uid:
                type: string
                description: |-
                    Rich detail (populated by GetWorkload; omitted from ListWorkloads). Mirrors
                    the agent-reported WorkloadStatus.
            generation:
                type: string
                format: int64
            revision_id:
                type: string
            sync:
                $ref: '#/definitions/v1SyncState'
            suspended:
                type: boolean
            resources:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ResourceSnapshot'
            conditions:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Condition'
            observed_at:
                type: string
                format: date-time
            last_reconciled_at:
                type: string
                format: date-time
            last_applied_revision:
                type: string
        description: |-
            Workload represents a Kubernetes workload (Deployment, StatefulSet, DaemonSet,
            etc.) as observed by a KUBERNETES agent.
    v1WorkloadEvent:
        type: object
        properties:
            uid:
                type: string
                description: Kubernetes event UID, used for deduplication.
            type:
                type: string
                description: 'Event type: "Normal" or "Warning".'
            reason:
                type: string
                description: Short machine-readable reason (e.g., "BackOff", "FailedScheduling").
            regarding:
                $ref: '#/definitions/v1ObjectReference'
                description: The Kubernetes object this event is about.
            message:
                type: string
                description: Human-readable event message.
            first_seen:
                type: string
                format: date-time
                description: When this event was first observed.
            last_seen:
                type: string
                format: date-time
                description: When this event was most recently observed.
            count:
                type: integer
                format: int32
                description: Number of times this event has occurred.
            component:
                type: string
                description: Reporting component (event source), e.g. "kubelet", "default-scheduler".
            host:
                type: string
                description: Node the reporting component ran on. Empty for cluster-level sources.
        description: |-
            WorkloadEvent represents a Kubernetes event related to a workload or its child
            objects. Events are deduplicated by their K8s UID.
    v1WorkloadHealthStatus:
        type: string
        enum:
            - WORKLOAD_HEALTH_STATUS_UNSPECIFIED
            - WORKLOAD_HEALTH_STATUS_HEALTHY
            - WORKLOAD_HEALTH_STATUS_DEGRADED
            - WORKLOAD_HEALTH_STATUS_ERROR
            - WORKLOAD_HEALTH_STATUS_PROGRESSING
            - WORKLOAD_HEALTH_STATUS_SUSPENDED
            - WORKLOAD_HEALTH_STATUS_MISSING
        default: WORKLOAD_HEALTH_STATUS_UNSPECIFIED
        description: |-
            WorkloadHealthStatus represents the derived health state of a single workload.

             - WORKLOAD_HEALTH_STATUS_UNSPECIFIED: Default value. Must not be used.
             - WORKLOAD_HEALTH_STATUS_HEALTHY: All desired replicas ready, no CrashLoopBackOff, restarts stable.
             - WORKLOAD_HEALTH_STATUS_DEGRADED: Some replicas not ready, restarts increasing, or pods pending over 5 minutes.
             - WORKLOAD_HEALTH_STATUS_ERROR: Zero ready replicas, all containers CrashLoopBackOff, or deployment stuck.
             - WORKLOAD_HEALTH_STATUS_PROGRESSING: Moving toward Healthy: rollout in progress, scheduling, or image pulls.
             - WORKLOAD_HEALTH_STATUS_SUSPENDED: Deliberately paused (e.g. Application suspend, CronJob suspend=true).
            Not an alert condition.
             - WORKLOAD_HEALTH_STATUS_MISSING: Declared in the bundle but absent from the cluster.
    v1WorkloadMetric:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1ApplicationRef'
                description: The Application that owns the pod's top-level controller.
            pod:
                $ref: '#/definitions/v1ObjectReference'
                description: The pod this sample was taken from.
            node:
                type: string
                description: Name of the node the pod is scheduled on.
            cpu_millicores:
                type: string
                format: int64
                description: CPU usage summed across all containers in the pod, in millicores.
            memory_bytes:
                type: string
                format: int64
                description: Memory usage summed across all containers in the pod, in bytes.
            window:
                type: string
                description: The metrics-server scrape window this sample represents (typically ~30s).
            timestamp:
                type: string
                format: date-time
                description: When metrics-server recorded the sample.
        description: |-
            WorkloadMetric is a single per-pod CPU/memory sample from metrics-server,
            tagged with the Application that owns the pod's top-level controller. Admiral
            aggregates samples pod -> workload -> cluster server-side.
    v1WorkloadStatus:
        type: object
        properties:
            namespace:
                type: string
                description: Kubernetes namespace.
            name:
                type: string
                description: Workload name.
            kind:
                type: string
                description: Kubernetes resource kind (e.g., "Deployment", "StatefulSet").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: Kubernetes labels on the workload.
            replicas_desired:
                type: integer
                format: int32
                description: Number of desired replicas.
            replicas_ready:
                type: integer
                format: int32
                description: Number of ready replicas.
            replicas_available:
                type: integer
                format: int32
                description: Number of available replicas.
            cpu_requests_millicores:
                type: string
                format: int64
                description: CPU requests across all containers, in millicores.
            cpu_limits_millicores:
                type: string
                format: int64
                description: CPU limits across all containers, in millicores.
            cpu_used_millicores:
                type: string
                format: int64
                description: Current CPU usage across all containers, in millicores.
            memory_requests_bytes:
                type: string
                format: int64
                description: Memory requests across all containers, in bytes.
            memory_limits_bytes:
                type: string
                format: int64
                description: Memory limits across all containers, in bytes.
            memory_used_bytes:
                type: string
                format: int64
                description: Current memory usage across all containers, in bytes.
            health_status:
                $ref: '#/definitions/v1WorkloadHealthStatus'
                description: Derived health status.
            containers:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ContainerStatus'
                description: Status of individual containers.
            uid:
                type: string
                description: |-
                    Kubernetes object UID. Stable identity across rename (rename is delete +
                    recreate, so a changed UID means a different workload).
            generation:
                type: string
                format: int64
                description: The .metadata.generation observed for this workload.
            revision_id:
                type: string
                description: The Admiral revision this workload was reconciled against.
            sync:
                $ref: '#/definitions/v1SyncState'
                description: Whether the live cluster state matches the bundle.
            suspended:
                type: boolean
                description: Whether the workload is deliberately paused (Application suspend).
            resources:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ResourceSnapshot'
                description: Per-managed-resource inventory with sync/health and foreign field owners.
            conditions:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Condition'
                description: Typed observations on the workload as a whole.
            observed_at:
                type: string
                format: date-time
                description: When the agent took this observation.
            last_reconciled_at:
                type: string
                format: date-time
                description: When the workload was last reconciled.
            last_applied_revision:
                type: string
                description: The last revision the agent successfully applied.
        description: |-
            WorkloadStatus is the agent-reported status for a single workload within a
            telemetry push payload.
servers:
    - url: "{baseUrl}"
      description: Admiral API server
      variables:
        baseUrl:
            default: https://api.admiral.io
            description: The base URL of your Admiral instance.
host: api.admiral.io
schemes:
    - https
    - http
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: PAT
            description: >-
                Personal Access Token (PAT) or Service Access Token (SAT). Pass the token in the Authorization header: `Bearer admp_...`
security:
    - bearerAuth: []
x-tagGroups:
    - name: Applications
      tags:
        - Applications
        - Environments
    - name: Deployments
      tags:
        - ChangeSets
        - Runs
        - Run Revisions
    - name: Catalog & Sources
      tags:
        - Catalog
        - Sources
        - Credentials
    - name: Agents
      tags:
        - Agents
        - Agent Tokens
    - name: Identity & Access
      tags:
        - User
        - Personal Access Tokens
    - name: Integrations
      tags:
        - State Backend

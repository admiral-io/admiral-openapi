            entries:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Entry'
                description: Empty in a listing.
    apiRegistryV1Component:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    The name as it is written: `cloud-sql`, or `payments/cloud-sql` once
                    team namespaces exist. Unique within the tenant. Immutable.
                readOnly: true
            description:
                type: string
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Key-value metadata for filtering (e.g. `{"team": "payments",
                    "runtime": "terraform"}`), the same labels every Admiral resource carries.
            tags:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Tag'
                description: Every tag on the component, by name.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
        description: |-
            Component is a registry entry: a name, and the revisions and tags beneath
            it.
    apiRegistryV1ComponentKind:
        type: string
        enum:
            - COMPONENT_KIND_UNSPECIFIED
            - TERRAFORM
            - HELM
            - MANIFESTS
        default: COMPONENT_KIND_UNSPECIFIED
        description: |-
            ComponentKind is what a revision's bundle is, detected by inspection at
            publish: a Chart.yaml means HELM, .tf files mean TERRAFORM, anything else
            that is Kubernetes YAML means MANIFESTS.
    apiRegistryV1Finding:
        type: object
        properties:
            severity:
                $ref: '#/definitions/v1FindingSeverity'
            source:
                type: string
                description: 'What produced it: `provider-constraint`, `checkov`, `trivy`, `image-ref`.'
            code:
                type: string
                description: |-
                    The producer's own identifier for the rule, when it has one
                    (e.g. `CKV_AWS_18`).
            message:
                type: string
            path:
                type: string
                description: Where in the bundle, when it applies.
        description: Finding is one thing the publish gate noticed.
    apiRegistryV1GetRevisionResponse:
        type: object
        properties:
            revision:
                $ref: '#/definitions/apiRegistryV1Revision'
        description: GetRevisionResponse contains the revision.
    apiRegistryV1ListRevisionsResponse:
        type: object
        properties:
            revisions:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiRegistryV1Revision'
            next_page_token:
                type: string
        description: ListRevisionsResponse contains a page of revisions, newest first.
    apiRegistryV1Pin:
        type: object
        properties:
            source:
                type: string
                description: The source as the bundle declared it, before rewriting.
            constraint:
                type: string
                description: The constraint that was asked for, when any.
            resolved:
                type: string
                description: 'What it resolved to: an exact version or commit.'
        description: Pin is one dependency the closure step resolved and vendored.
    apiRegistryV1Revision:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier (UUID). Internal handle; references use the digest.
                readOnly: true
            component_id:
                type: string
                description: The component this revision belongs to (UUID).
                readOnly: true
            digest:
                type: string
                description: 'The identity: SHA-256 of the normalized bundle, as `sha256:<hex>`.'
                readOnly: true
            kind:
                $ref: '#/definitions/apiRegistryV1ComponentKind'
                readOnly: true
            size_bytes:
                type: string
                format: int64
                description: Size of the stored bundle in bytes.
                readOnly: true
            contract:
                $ref: '#/definitions/v1Contract'
                description: |-
                    The inputs and outputs the bundle exposes. Inferred from the bundle at
                    publish; curated by a publisher once the contract format lands.
                readOnly: true
            provenance:
                $ref: '#/definitions/v1Provenance'
                description: Where the bytes came from.
                readOnly: true
            findings:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiRegistryV1Finding'
                description: |-
                    What the publish gate found. Informational findings do not block a
                    publish; a revision with findings is published with them attached, and
                    the findings delta between two revisions is what an upgrade review reads.
                readOnly: true
            status:
                $ref: '#/definitions/apiRegistryV1RevisionStatus'
                readOnly: true
            status_changed_at:
                type: string
                format: date-time
                description: |-
                    When and why the status last changed. Unset on a revision that has only
                    ever been PUBLISHED.
                readOnly: true
            status_reason:
                type: string
                readOnly: true
            tags:
                type: array
                items:
                    type: string
                description: The tags currently naming this revision.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
        description: Revision is one published artifact. Immutable except for its status.
    apiRegistryV1RevisionStatus:
        type: string
        enum:
            - REVISION_STATUS_UNSPECIFIED
            - PUBLISHED
            - DEPRECATED
            - REVOKED
        default: REVISION_STATUS_UNSPECIFIED
        description: |-
            RevisionStatus is a revision's lifecycle. There is no deleted state.

             - PUBLISHED: Adoptable: a change set may pin it.
             - DEPRECATED: Still adoptable, with a warning; what already pins it warns too.
             - REVOKED: Refuses new adoption; what already pins it keeps running with a warning.
    apiRunV1GetRevisionResponse:
        type: object
        properties:
            revision:
                $ref: '#/definitions/apiRunV1Revision'
                description: The revision record with current status and artifacts.
        description: GetRevisionResponse contains the revision record.
    apiRunV1ListRevisionsResponse:
        type: object
        properties:
            revisions:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiRunV1Revision'
                description: The list of revisions, ordered by dependency graph (upstream first).
            next_page_token:
                type: string
                description: Pagination token for the next page. Empty when there are no more results.
        description: ListRevisionsResponse contains all revisions for a run.
    apiRunV1Revision:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the revision (UUID).
            run_id:
                type: string
                description: The run this revision belongs to (UUID).
            component_id:
                type: string
                description: The component this revision is for (UUID).
            component_name:
                type: string
                description: Component name at the time of run (immutable semantic key).
            kind:
                $ref: '#/definitions/v1RevisionKind'
                description: Component kind at the time of run (after override resolution).
            status:
                $ref: '#/definitions/apiRunV1RevisionStatus'
                description: Lifecycle status of this revision.
            change_type:
                $ref: '#/definitions/v1RevisionChangeType'
                description: |-
                    What type of change this revision represents relative to the previously
                    deployed state.
            previous_revision_id:
                type: string
                description: |-
                    The last succeeded revision for this (component, environment) at the
                    time this revision was created. Null for CREATE revisions.
            source_id:
                type: string
                description: |-
                    The source the module pointed to at the time of this revision (UUID).
                    Snapshotted so a rollback can re-fetch from the original source even if
                    the module's source binding is later edited. Execution today resolves
                    fetch location through the live module; this field is the audit anchor.
            ref:
                type: string
                description: The git ref / version selector deployed (the component's ref at snapshot).
            resolved_values:
                type: string
                description: |-
                    The resolved values template snapshot: the values_template with all
                    variable references and component output references fully resolved.
                    Stored for audit: shows exactly what inputs were used. Sensitive
                    variable values are masked in API responses.
            depends_on:
                type: array
                items:
                    type: string
                description: |-
                    Component IDs that this revision depends on. Populated from the resolved
                    depends_on list plus implicit dependencies from template expressions.
            blocked_by:
                type: array
                items:
                    type: string
                description: |-
                    Component IDs that are blocking this revision. Only populated when
                    status is BLOCKED; indicates which upstream components failed.
            plan_summary:
                $ref: '#/definitions/v1ChangeSummary'
                description: |-
                    The normalized change counts (creates/updates/deletes/noops) this
                    revision's plan computed. Populated after planning. Engine-agnostic.
            available_phases:
                type: array
                items:
                    $ref: '#/definitions/v1RevisionPhase'
                description: |-
                    Phase labels for which a transcript has been stored, in the order they
                    ran. Populated as each phase completes (a revision that planned and then
                    applied carries `[REVISION_PHASE_PLAN, REVISION_PHASE_APPLY]`). Fetch a
                    phase's transcript via
                    `GET /api/v1/runs/{run_id}/revisions/{revision_id}/{phase}`.
            error_message:
                type: string
                description: Error message if the revision failed. Empty on success.
            retry_count:
                type: integer
                format: int32
                description: Number of retry attempts. Starts at 0 for the initial attempt.
            started_at:
                type: string
                format: date-time
                description: When the revision started execution (transitioned from PENDING/QUEUED).
            completed_at:
                type: string
                format: date-time
                description: When the revision finished (succeeded, failed, or canceled).
            working_directory:
                type: string
                description: |-
                    Subdirectory within the delivered archive where the executor runs.
                    Empty means the archive root. Populated from the catalog item's path field
                    at snapshot time so that relative references resolve correctly.
            created_at:
                type: string
                format: date-time
                description: When the revision was created (same as run created_at).
            resolved_commit:
                type: string
                description: |-
                    The concrete commit this revision resolved its ref to and pinned -- the
                    reproducibility anchor. `ref` is the intent (e.g. `main`); this is what
                    actually deployed. Populated when resolution is wired (a later WP).
            type:
                type: string
                description: |-
                    The deploy/engine type this revision runs (TERRAFORM/HELM/KUSTOMIZE/
                    MANIFEST), denormalized from the component at snapshot. Selects the
                    executor: the orchestration layer routes by this type, not by kind.
        description: |-
            Revision represents an immutable, rendered artifact for a single component
            within a run. Each revision tracks the full lifecycle from rendering
            through execution, and stores references to the produced artifacts
            (rendered manifests, binary plan files, etc.).

            For infrastructure components (terraform-semantic engine, Terraform or
            OpenTofu):
              - Rendering produces the infrastructure source tree (.tf files and
                auto-loaded tfvars) with resolved variable values.
              - The engine's plan and apply phases are executed by the assigned
                TERRAFORM agent (see JobBundle.engine for engine selection).
              - The plan output is stored for visibility.
              - Each component has its own state, stored via the configured backend.

            For workload components (Helm, Kustomize, manifests):
              - Rendering produces Kubernetes manifests (via helm template, kustomize
                build, or raw file collection).
              - Manifests are ordered (CRDs before resources, namespaces first).
              - The rendered bundle is sent to the K8s agent for application.
    apiRunV1RevisionStatus:
        type: string
        enum:
            - REVISION_STATUS_UNSPECIFIED
            - REVISION_STATUS_PENDING
            - REVISION_STATUS_QUEUED
            - REVISION_STATUS_PLANNING
            - REVISION_STATUS_PLANNED
            - REVISION_STATUS_APPLYING
            - REVISION_STATUS_SUCCEEDED
            - REVISION_STATUS_FAILED
            - REVISION_STATUS_BLOCKED
            - REVISION_STATUS_CANCELED
            - REVISION_STATUS_SUPERSEDED
            - REVISION_STATUS_DEFERRED
            - REVISION_STATUS_STALE
            - REVISION_STATUS_AWAITING_APPROVAL
        default: REVISION_STATUS_UNSPECIFIED
        description: |-
            RevisionStatus represents the lifecycle status of a single component
            revision within a run.

             - REVISION_STATUS_UNSPECIFIED: Default value. Must not be used.
             - REVISION_STATUS_PENDING: The revision has been created but execution has not started. Waiting for
            its turn in the dependency graph.
             - REVISION_STATUS_QUEUED: The revision is queued for execution. Its upstream dependencies have
            completed and it will begin shortly.
             - REVISION_STATUS_PLANNING: (Infrastructure only) The engine's plan is being generated
            (`terraform plan` / `tofu plan`). Transitions to PLANNED on success
            or FAILED on error.
             - REVISION_STATUS_PLANNED: (Infrastructure only) Plan completed successfully. Under the Option B
            auto-continue model, this state is transient: the apply is dispatched
            immediately if the parent run is already APPLYING (user authorized at
            the changeset level). The plan output is available for review.
             - REVISION_STATUS_APPLYING: The revision is being applied. For infrastructure, this is the engine's
            apply phase (`terraform apply` / `tofu apply`). For workloads, this is
            applying manifests to the target cluster.
             - REVISION_STATUS_SUCCEEDED: The revision completed successfully. For infrastructure, the engine's
            apply phase succeeded. For workloads, the manifests were applied and the
            resources reached a healthy state.
             - REVISION_STATUS_FAILED: The revision failed. See `error_message` for details.
             - REVISION_STATUS_BLOCKED: The revision is blocked because an upstream dependency failed. See
            `blocked_by` for the component(s) that caused the block.
             - REVISION_STATUS_CANCELED: The revision was canceled by user action (parent run canceled).
             - REVISION_STATUS_SUPERSEDED: The revision was superseded because its parent run was replaced
            (a newer plan landed for the same change set, or the change set was
            edited). System-driven; distinct from CANCELED.
             - REVISION_STATUS_DEFERRED: The revision cannot plan yet because its values_template references
            outputs of an upstream revision that has not been applied. Analogous to
            terraform's "(known after apply)": the inputs to this plan are
            unknowable until upstream apply completes. Transitions to QUEUED once
            the upstream apply lands and outputs are captured.
             - REVISION_STATUS_STALE: The revision's apply stalled with an unknown outcome (never started, still
            running, or done-but-unreported). Cannot auto-retry; requires
            reconciliation against real state or an audited operator override. (Set by
            the liveness/STALE reaper; see Phase D.)
             - REVISION_STATUS_AWAITING_APPROVAL: The revision has planned and is awaiting explicit approval before its
            apply runs (gating policy != auto-continue). (Set by the gating flow.)
    protobufAny:
        type: object
        properties:
            '@type':
                type: string
                description: |-
                    A URL/resource name that uniquely identifies the type of the serialized
                    protocol buffer message. This string must contain at least
                    one "/" character. The last segment of the URL's path must represent
                    the fully qualified name of the type (as in
                    `path/google.protobuf.Duration`). The name should be in a canonical form
                    (e.g., leading "." is not accepted).

                    In practice, teams usually precompile into the binary all types that they
                    expect it to use in the context of Any. However, for URLs which use the
                    scheme `http`, `https`, or no scheme, one can optionally set up a type
                    server that maps type URLs to message definitions as follows:

                    * If no scheme is provided, `https` is assumed.
                    * An HTTP GET on the URL must yield a [google.protobuf.Type][]
                      value in binary format, or produce an error.
                    * Applications are allowed to cache lookup results based on the
                      URL, or have them precompiled into a binary to avoid any
                      lookup. Therefore, binary compatibility needs to be preserved
                      on changes to types. (Use versioned type names to manage
                      breaking changes.)

                    Note: this functionality is not currently available in the official
                    protobuf release, and it is not used for type URLs beginning with
                    type.googleapis.com. As of May 2023, there are no widely used type server
                    implementations and no plans to implement one.

                    Schemes other than `http`, `https` (or the empty scheme) might be
                    used with implementation specific semantics.
        additionalProperties: {}
        description: |-
            `Any` contains an arbitrary serialized protocol buffer message along with a
            URL that describes the type of the serialized message.

            Protobuf library provides support to pack/unpack Any values in the form
            of utility functions or additional generated methods of the Any type.

            Example 1: Pack and unpack a message in C++.

                Foo foo = ...;
                Any any;
                any.PackFrom(foo);
                ...
                if (any.UnpackTo(&foo)) {
                  ...
                }

            Example 2: Pack and unpack a message in Java.

                Foo foo = ...;
                Any any = Any.pack(foo);
                ...
                if (any.is(Foo.class)) {
                  foo = any.unpack(Foo.class);
                }
                // or ...
                if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                  foo = any.unpack(Foo.getDefaultInstance());
                }

             Example 3: Pack and unpack a message in Python.

                foo = Foo(...)
                any = Any()
                any.Pack(foo)
                ...
                if any.Is(Foo.DESCRIPTOR):
                  any.Unpack(foo)
                  ...

             Example 4: Pack and unpack a message in Go

                 foo := &pb.Foo{...}
                 any, err := anypb.New(foo)
                 if err != nil {
                   ...
                 }
                 ...
                 foo := &pb.Foo{}
                 if err := any.UnmarshalTo(foo); err != nil {
                   ...
                 }

            The pack methods provided by protobuf library will by default use
            'type.googleapis.com/full.type.name' as the type URL and the unpack
            methods only use the fully qualified type name after the last '/'
            in the type URL, for example "foo.bar.com/x/y.z" will yield type
            name "y.z".

            JSON
            ====
            The JSON representation of an `Any` value uses the regular
            representation of the deserialized, embedded message, with an
            additional field `@type` which contains the type URL. Example:

                package google.profile;
                message Person {
                  string first_name = 1;
                  string last_name = 2;
                }

                {
                  "@type": "type.googleapis.com/google.profile.Person",
                  "firstName": <string>,
                  "lastName": <string>
                }

            If the embedded message type is well-known and has a custom JSON
            representation, that representation will be embedded adding a field
            `value` which holds the custom JSON in addition to the `@type`
            field. Example (for message [google.protobuf.Duration][]):

                {
                  "@type": "type.googleapis.com/google.protobuf.Duration",
                  "value": "1.212s"
                }
    protobufNullValue:
        type: string
        enum:
            - NULL_VALUE
        default: NULL_VALUE
        description: |-
            `NullValue` is a singleton enumeration to represent the null value for the
            `Value` type union.

            The JSON representation for `NullValue` is JSON `null`.

             - NULL_VALUE: Null value.
    rpcStatus:
        type: object
        properties:
            code:
                type: integer
                format: int32
            message:
                type: string
            details:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/protobufAny'
    v1ActorKind:
        type: string
        enum:
            - ACTOR_KIND_UNSPECIFIED
            - USER
            - SERVICE_ACCOUNT
            - SYSTEM
        default: ACTOR_KIND_UNSPECIFIED
        description: |-
            ActorKind is what cut a revision: a person, a machine's key, or Admiral
            itself.
    v1ActorRef:
        type: object
        properties:
            id:
                type: string
                description: UUID of the user or service access token.
            display_name:
                type: string
                description: Human-readable name (e.g., "John Smith", "cluster-prod-agent").
            email:
                type: string
                description: Email address (empty for non-human actors).
        description: |-
            ActorRef is a lightweight reference to the user or agent that performed an action.
            Server-populated on all resource responses. Clients should never send this;
            use the plain string `created_by` UUID on request messages instead.
    v1AddComponent:
        type: object
        properties:
            name:
                type: string
            source:
                $ref: '#/definitions/v1RegistryRef'
            values_json:
                type: string
                description: A JSON object. Empty means no values.
        description: |-
            AddComponent creates a component instance from the registry. The name is
            reserved in the environment until the draft is discarded or the component
            is removed from it.
        required:
            - name
            - source
    v1Agent:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            cluster_id:
                type: string
                readOnly: true
            name:
                type: string
            namespace:
                type: string
                readOnly: true
            service_account:
                type: string
                readOnly: true
            ceiling:
                $ref: '#/definitions/v1AgentCeiling'
            health:
                $ref: '#/definitions/v1AgentHealth'
                readOnly: true
            report:
                $ref: '#/definitions/v1AgentReport'
                description: What the agent last reported. Absent until it does.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
    v1AgentCapabilities:
        type: object
        properties:
            can_create_namespaces:
                type: boolean
            writable_namespaces:
                type: array
                items:
                    type: string
                description: Namespaces it may write; empty with `all_namespaces` means everywhere.
            all_namespaces:
                type: boolean
            can_write_cluster_scoped:
                type: boolean
        description: AgentCapabilities is what the agent's own RBAC lets it do, as it measured.
    v1AgentCeiling:
        type: object
        properties:
            allow_namespace_creation:
                type: boolean
            allowed_namespaces:
                type: array
                items:
                    type: string
                description: Glob patterns; empty allows every namespace.
            denied_namespaces:
                type: array
                items:
                    type: string
        description: |-
            AgentCeiling is what the agent's owner allows it, whatever its RBAC allows.
            The plan refuses what falls outside it.
    v1AgentGrant:
        type: object
        properties:
            tenant:
                type: boolean
                description: Every environment in the tenant. Only `true` means anything.
            group_id:
                type: string
            application_id:
                type: string
        description: AgentGrant is who may select an agent.
    v1AgentHealth:
        type: string
        enum:
            - AGENT_HEALTH_UNSPECIFIED
            - NEW
            - ONLINE
            - OFFLINE
        default: AGENT_HEALTH_UNSPECIFIED
        description: |4-
             - NEW: Never reported.
             - OFFLINE: Has not reported for longer than twice its reporting interval.
    v1AgentReport:
        type: object
        properties:
            agent_version:
                type: string
            protocol_version:
                type: integer
                format: int32
            kube_version:
                type: string
            api_versions:
                type: array
                items:
                    type: string
            capabilities:
                $ref: '#/definitions/v1AgentCapabilities'
            reported_at:
                type: string
                format: date-time
    v1ApiKey:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the key (UUID).
            tenant_id:
                type: string
                description: |-
                    The tenant this key belongs to (UUID), and the `tid` of every access token
                    minted from it.

                    Load-bearing on the resolve path and an echo everywhere else: resolving a
                    raw key is the one lookup that has no tenant in hand and must return one,
                    where every lifecycle call already knows the tenant from the caller. The
                    key belongs to one tenant for its whole life, so the two can never disagree.
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier for the key (e.g., "ci-deploy-key").
                    Unique within the parent resource. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            key_prefix:
                type: string
                description: |-
                    Non-secret prefix of the key. The five-character brand (`admp_` when bound
                    to a user, `adms_` when bound to a service account) followed by a short
                    sample of characters from the secret body (e.g., "adms_pL2m"). URL-safe and
                    safe to log and display. Use for incident response and audit trails without
                    exposing the secret.
            scopes:
                type: array
                items:
                    type: string
                description: |-
                    The scopes granted to this key, and the ceiling on any access token minted
                    from it. A mint request may narrow them and may never widen them.
            status:
                $ref: '#/definitions/v1ApiKeyStatus'
                description: Current lifecycle status of the key.
            binding_type:
                $ref: '#/definitions/v1BindingType'
                description: The kind of resource this key is bound to.
            binding_id:
                type: string
                description: |-
                    The ID of the resource this key is bound to (UUID): a user id or a service
                    account id, per `binding_type`. Access tokens minted from this key carry it
                    as their `sub`.
            expires_at:
                type: string
                format: date-time
                description: When the key expires. If unset, the key does not expire.
            last_used_at:
                type: string
                format: date-time
                description: |-
                    When this key was last exchanged for an access token.

                    NOT the time of the last API request made with it: minted tokens are cached
                    and reused for their lifetime, so a key in continuous use is exchanged only
                    when the token minted from it runs out. Reads as "still in use", at a
                    granularity of the access-token lifetime, which is the question this field
                    exists to answer before revoking one.
            revoked_at:
                type: string
                format: date-time
                description: When the key was revoked. Only set when status is REVOKED.
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: |-
                    The user who created this key. When bound to a user, this is the key's
                    owner; when bound to a service account, the administrator who issued it.
            created_at:
                type: string
                format: date-time
                description: When the key was created.
        description: |-
            ApiKey contains metadata for an opaque, long-lived credential issued by
            Admiral and presented by a caller to authenticate.

            A key is bound to exactly one subject for its whole life -- see
            `binding_type` and `binding_id` -- and to exactly one tenant. Presenting one
            is exchanged for a short-lived access token whose `sub` is the binding and
            whose scopes are bounded by this key's.

            The raw secret is returned exactly once, in the `plain_text_key` field of the
            Create response. This message carries only metadata; the secret is never
            retrievable afterwards. The non-secret `key_prefix` is safe to log and
            display.

            Key lifecycle is managed by each parent resource's API:
              - user-bound:            UserAPI  (/v1/user/tokens)
              - service-account-bound: AgentAPI (/v1/agents/{id}/tokens)
    v1ApiKeyStatus:
        type: string
        enum:
            - API_KEY_STATUS_UNSPECIFIED
            - API_KEY_STATUS_ACTIVE
            - API_KEY_STATUS_REVOKED
        default: API_KEY_STATUS_UNSPECIFIED
        description: |-
            ApiKeyStatus represents the lifecycle state of an API key.

             - API_KEY_STATUS_UNSPECIFIED: Default value. Must not be used.
             - API_KEY_STATUS_ACTIVE: The key is valid and can be used to authenticate.
             - API_KEY_STATUS_REVOKED: The key has been permanently revoked and cannot be used.
    v1Application:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the application (UUID).
                readOnly: true
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier (e.g., "inventory-api"). Unique within
                    the tenant. Lowercase alphanumeric and hyphens only, must start with a
                    letter and end with an alphanumeric character (1-63 chars).
            description:
                type: string
                description: |-
                    Optional longer-form description of the application's purpose
                    (e.g., "Core inventory service tracking warehouse stock and fulfillment").
            labels:
                type: object
                additionalProperties:
                    type: string
                description: |-
                    Arbitrary key-value labels for organizing and filtering applications
                    (e.g., `{"team": "logistics", "tier": "critical"}`).
            created_by:
                $ref: '#/definitions/v1ActorRef'
                description: The user or agent who created this application (server-populated from token).
                readOnly: true
            created_at:
                type: string
                format: date-time
                description: When the application was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the application was last updated.
                readOnly: true
        description: |-
            Application represents a deployable unit within a tenant. An application
            groups manifests, dependencies, and environment configuration into a single
            entity that Admiral orchestrates across environments.
    v1ApplyRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: |-
                    The run with status advanced to APPLYING. Revisions that were
                    PLANNED are now APPLYING.
        description: ApplyRunResponse contains the run after apply jobs are dispatched.
    v1Attempt:
        type: object
        properties:
            job_id:
                type: string
            attempt:
                type: integer
                format: int32
            lease_token:
                type: string
        description: Attempt names the attempt a call belongs to.
        required:
            - job_id
    v1AuthConfig:
        type: object
        properties:
            ssh_key:
                $ref: '#/definitions/v1SSHKeyAuth'
            basic_auth:
                $ref: '#/definitions/v1BasicAuth'
            bearer_token:
                $ref: '#/definitions/v1BearerTokenAuth'
            github_app:
                $ref: '#/definitions/v1GitHubAppAuth'
        description: AuthConfig is the secret, one variant matching the credential's type.
    v1BasicAuth:
        type: object
        properties:
            username:
                type: string
            password:
                type: string
                description: Write-only.
        description: |-
            BasicAuth is a username and password, or a username and a token that the
            host takes as a password (a registry-scoped token, an app password).
    v1BearerTokenAuth:
        type: object
        properties:
            token:
                type: string
                description: Write-only.
        description: BearerTokenAuth is one token.
    v1BindingType:
        type: string
        enum:
            - BINDING_TYPE_UNSPECIFIED
            - BINDING_TYPE_USER
            - BINDING_TYPE_SERVICE_ACCOUNT
        default: BINDING_TYPE_UNSPECIFIED
        description: |-
            BindingType identifies the kind of resource an API key is bound to.

            This is the ONLY discriminator the contract carries. What a key is bound to
            decides the subject it authenticates as, and every other distinction that used
            to be modelled separately -- which surface created it, which brand its prefix
            carries, whether its scopes were chosen or assigned -- follows from the
            binding rather than varying independently of it.

             - BINDING_TYPE_UNSPECIFIED: Default value. Must not be used.
             - BINDING_TYPE_USER: Bound to a user, and created by that user. Scopes are selected at creation.
             - BINDING_TYPE_SERVICE_ACCOUNT: Bound to a service account, and created by an administrator. Scopes are
            assigned from a profile rather than chosen. An agent has a service account;
            which agent, if any, is resolved from the service account record.
    v1CancelJobResponse:
        type: object
        properties:
            job:
                $ref: '#/definitions/v1Job'
    v1CancelRunResponse:
        type: object
        properties:
            run:
                $ref: '#/definitions/v1Run'
                description: The canceled run.
        description: CancelRunResponse contains the updated run.
    v1ChangeSet:
        type: object
        properties:
            id:
                type: string
                description: '`cs-` and twelve lowercase base36 characters.'
                readOnly: true
            application_id:
                type: string
                readOnly: true
            environment_id:
                type: string
                readOnly: true
            title:
                type: string
                readOnly: true
            description:
                type: string
                readOnly: true
            status:
                $ref: '#/definitions/v1ChangeSetStatus'
                readOnly: true
            head_revision:
                type: integer
                format: int32
                description: 0 until the first edit.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_by_kind:
                $ref: '#/definitions/v1ActorKind'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
    v1ChangeSetStatus:
        type: string
        enum:
            - CHANGE_SET_STATUS_UNSPECIFIED
            - DRAFT
            - DISCARDED
        default: CHANGE_SET_STATUS_UNSPECIFIED
    v1ChangeSummary:
        type: object
        properties:
            creates:
                type: integer
                format: int32
                description: Number of resources to be created.
            updates:
                type: integer
                format: int32
                description: Number of resources to be updated in place.
            deletes:
                type: integer
                format: int32
                description: Number of resources to be deleted.
            noops:
                type: integer
                format: int32
                description: Number of resources left unchanged (no-op).
        description: |-
            ChangeSummary is the normalized, executor-agnostic count of what an
            execution does: creates, updates, deletes, and no-ops. Every executor maps
            its native result onto this shape -- terraform's +/~/- plan counts and
            kubernetes server-side-apply created/configured/deleted.
    v1ClaimJobRequest:
        type: object
        properties:
            claim_request_id:
                type: string
                description: |-
                    Chosen by the agent per claim, with at least 128 random bits (22
                    base64url characters); a retry with the same id returns the same offer.
                    The lease token derives from it, so it is as secret as the token.
            protocol_version:
                type: integer
                format: int32
            artifact_schema:
                type: integer
                format: int32
                description: The newest run artifact schema the agent reads.
            slots:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Slots'
            wait_seconds:
                type: integer
                format: int32
                description: How long to wait for work. At most 20; the server may answer sooner.
    v1ClaimJobResponse:
        type: object
        properties:
            offer:
                $ref: '#/definitions/v1Offer'
                description: Absent when there was nothing to offer.
    v1Cluster:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            name:
                type: string
            status:
                $ref: '#/definitions/v1ClusterStatus'
                readOnly: true
            issuer_url:
                type: string
                description: Set when the cluster's issuer is public; keys are fetched from it.
                readOnly: true
            key_ids:
                type: array
                items:
                    type: string
                description: The key ids trusted now.
                readOnly: true
            keys_updated_at:
                type: string
                format: date-time
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            reported_key_ids:
                type: array
                items:
                    type: string
                description: |-
                    Key ids an agent reported that are not trusted. An agent's report is never
                    applied; an admin reviews it and accepts with SetClusterTrust.
                readOnly: true
            keys_reported_at:
                type: string
                format: date-time
                readOnly: true
    v1ClusterStatus:
        type: string
        enum:
            - CLUSTER_STATUS_UNSPECIFIED
            - PENDING
            - TRUSTED
        default: CLUSTER_STATUS_UNSPECIFIED
        description: ' - PENDING: No keys yet: an agent may enroll it.'
    v1ClusterTrust:
        type: object
        properties:
            issuer_url:
                type: string
                description: An https URL whose /.well-known/openid-configuration names the keys.
            jwks_json:
                type: string
                description: A JSON Web Key Set, as the cluster serves it at /openid/v1/jwks.
            accept_reported:
                type: boolean
                description: Trust the key set an agent last reported. Only on SetClusterTrust.
        description: ClusterTrust is how a cluster's tokens are verified.
    v1ComponentDiff:
        type: object
        properties:
            component:
                type: string
            action:
                $ref: '#/definitions/v1EntryAction'
            old_pin:
                $ref: '#/definitions/apiChangesetV1Pin'

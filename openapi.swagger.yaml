swagger: "2.0"
info:
    title: Admiral API
    version: v1
tags:
    - name: RegistryAPI
      description: |-
        RegistryAPI is the component registry: what a tenant has published,
        addressed by digest.

        A component here is a REGISTRY ENTRY -- the thing `admiral component
        publish` creates and later publishes land under -- not an instance running
        in an environment. Both are called component on purpose; the verbs and the
        address forms carry the distinction. Publish, tag and status changes act on
        the registry (this service); adding, moving to another version, setting
        values and removing act inside a change set.
        `cloud-sql:v1.2.0` is registry-speak, `my-api/prod/users-db` is
        environment-speak.

        Three nouns. A Component is the name row. A Version is one published
        artifact, identified by the SHA-256 of its normalized bundle; the digest is
        the identity and the source repository is provenance. A Tag is a pointer
        from a name to a version, in the OCI sense: semver tags (v1.2.0) never move
        once assigned, floating tags (latest, main) may.

        Publishing the same bytes under the same name twice yields the same
        version. Versions are never deleted; revoking one refuses new adoption
        while what already runs it keeps running.
    - name: ChangeSetAPI
      description: |-
        ChangeSetAPI manages change sets: proposals against the components of one
        environment. Add a component from the registry, change its version, set or
        remove values, remove it; each request cuts one immutable revision.
        Nothing here plans or applies.

        A change set is addressed by its id, `cs-` and twelve base36 characters.

        Values are JSON text in `*_json` fields, so an integer above 2^53 keeps
        every digit. A map whose only key is `$ref` is a reference to another
        component's output (`{"$ref": "users-db.connection_name"}`); a real value
        of that shape is written with `$$ref`.
    - name: EnvironmentAPI
      description: |-
        EnvironmentAPI manages environments within an application.

        An environment is a named place an application deploys to (dev, staging,
        prod). What it runs changes only through change sets.
    - name: AgentAPI
      description: |-
        AgentAPI manages agents: what runs work in a customer's environment, how
        each proves who it is, who may use it, and its enrollment keys.

        An environment deploys through the agents assigned to it, and may be assigned
        only an agent granted to the organization, a team, its application, or the
        environment itself.
    - name: WorkloadIdentityProviderAPI
      description: |-
        WorkloadIdentityProviderAPI manages the token issuers Admiral trusts for
        agents to prove who they are, such as a Kubernetes cluster's
        service-account issuer.

        A provider is an issuer Admiral trusts, not a token: a public URL Admiral
        fetches keys from, or its public keys (uploaded). An agent authenticates
        with the short-lived token its provider issues; no long-lived secret
        exists. A provider without keys yet is PENDING until a person sets them or
        an agent enrolls it with a single-use enrollment key.
    - name: JobAPI
      description: JobAPI reads and cancels the jobs the platform hands agents.
    - name: AgentRuntimeAPI
      description: |-
        AgentRuntimeAPI is what an agent calls while it works. Its routes live
        under /v1/agent (singular: the caller is the agent) and are excluded from
        the public OpenAPI document. The caller is always
        an agent, identified by its token; no request names an agent.

        Work is claimed as an offer, started before anything touches the target,
        held by renewing a lease, and finished once per attempt. Every call after
        the claim carries the attempt and its lease token; a call from an attempt
        that is not the current one, or whose lease lapsed, changes nothing.
    - name: ApiKeyAPI
      description: |-
        ApiKeyAPI manages the caller's own API keys.

        An API key here is bound to the calling user and lets them authenticate
        from scripts, CI pipelines, and other programmatic contexts. Its scopes are
        selected at creation and it may carry an expiration. An API key is the long-lived secret a caller presents; the
        short-lived access token minted in exchange for it is a different thing and
        never appears here.
    - name: ApplicationAPI
      description: |-
        ApplicationAPI manages applications within a tenant.

        An application is the fundamental unit in Admiral. It groups the
        environments one system is deployed to, such as dev, staging and prod.
    - name: CredentialAPI
      description: |-
        CredentialAPI manages the credentials a tenant registers for reaching
        external systems at publish time: a git host, a Helm repository, an OCI
        registry, a module registry.

        A credential is never selected for the caller. A pull-publish names the
        credentials it may use, chosen by the user from those whose type its
        protocols can present, and the platform presents each only where it fits.
        A credential may carry `allowed_hosts`, a guard that restricts where it is
        ever presented, whatever it is attached to. Credentials exist for publish
        only; nothing on the deploy path reads one.

        Secrets are write-only: accepted on create and update, encrypted at rest,
        decrypted only inside a publish, and never returned. Get and List return
        metadata only.
    - name: HealthcheckAPI
      description: |-
        HealthcheckAPI provides health check operations for monitoring service
        availability. All RPCs in this service are public (no authentication
        required), suitable for load balancer probes.
    - name: UserAPI
      description: |-
        UserAPI provides user profile retrieval and the list of a tenant's members.
        The caller's own API keys are managed through ApiKeyAPI.
    - name: InvitationAPI
      description: |-
        InvitationAPI brings a person into the caller's tenant.

        An invitation is its own resource: it has a lifecycle (PENDING, ACCEPTED,
        EXPIRED, REVOKED) and a user exists only once it is redeemed. Creating one
        sends the mail; the link in it leads to the sign-in service, which is where
        the person proves the address and joins. The token in that link never
        appears on this surface.

        Keyed on the address, one live invitation per address. Creating a second one
        for the same address retires the first and mails a new link, which is also
        how "send it again" works; there is no resend procedure.

        Every request acts on the caller's own tenant; none names one.
    - name: RunAPI
      description: |-
        RunAPI plans and applies. A run belongs to an environment and has one plan
        phase and, when its plan is approved and applied, one apply phase.

        A run's source is either a change set revision, which proposes a change,
        or what the environment desires, the configuration each component was last
        applied with. A desired run checks for drift (refresh-only, never applied)
        or reapplies it (a full plan of the chosen components, then apply).

        When the environment moves, an open change set falls behind and its
        planned run cannot apply; the run of its rebased revision supersedes it.
        Every plan is a new run, so a change set's runs are the history of how it
        reached what was approved.
    - name: TenantAPI
      description: |-
        TenantAPI exposes the caller's OWN tenant.

        Deliberately narrow. A tenant is an account boundary, not a resource a caller
        browses: there is no list, no create, and no delete here. Provisioning,
        suspension, and deletion are administrative operations and are not part of
        this API.

        No request names a tenant. The caller's tenant comes from their token, so
        there is no id to pass and none to get wrong -- and no shape in which a caller
        could name someone else's.
consumes:
    - application/json
produces:
    - application/json
paths:
    /v1/agents:
        get:
            summary: |-
                ListAgents lists agents. Narrow it with `filter`, by provider or by what an
                agent may be assigned to.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `name`: filter by agent name.
                      - `kind`: filter by agent kind.
                      - `provider_id`: agents whose workload identity is from this provider.
                      - `assignable_to`: agents an application's environments may be assigned (an application id).

                    Example: `field['kind'] = 'KIND_KUBERNETES' AND field['assignable_to'] = 'app-4m8q2x7k1p9c'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                CreateAgent records an agent: what it runs, and the workload identity it
                signs in with. When its provider is PENDING for enrollment, the response
                carries a single-use key the agent enrolls the provider's keys with.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateAgentRequest'
            tags:
                - AgentAPI
    /v1/agents/{agent.id}:
        patch:
            summary: |-
                UpdateAgent changes an agent's name, settings, approval rule and allowed
                components. Settings are set here and only here; an agent never reports
                them.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_UpdateAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent.id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIUpdateAgentBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}:
        get:
            summary: GetAgent returns an agent, what it last reported, and its settings.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
        delete:
            summary: |-
                DeleteAgent removes an agent. Its leases end at once. FAILED_PRECONDITION
                while any environment has it assigned (the message names them); remove
                those assignments first.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/enrollment-keys:
        post:
            summary: |-
                CreateEnrollmentKey issues a single-use key an agent enrolls its
                provider's keys with. It can do nothing else, expires within an hour, and is revoked the
                moment it is used.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_CreateEnrollmentKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateEnrollmentKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPICreateEnrollmentKeyBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/grants:
        get:
            summary: ListAgentGrants lists who may use an agent.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentGrants
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentGrantsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                GrantAgentUse lets the organization, a team, an application's
                environments, or one environment be assigned an agent. Only the agent's owner
                or a tenant admin may. Granting a target again replaces its profiles.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_GrantAgentUse
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GrantAgentUseResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIGrantAgentUseBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/grants/revoke:
        post:
            summary: |-
                RevokeAgentUse withdraws the grant to a target, whatever its profiles.
                Environments assigned the agent
                under it keep the assignment until they change it, and their new jobs wait
                with WAIT_REASON_AGENT_NOT_GRANTED.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_RevokeAgentUse
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeAgentUseResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIRevokeAgentUseBody'
            tags:
                - AgentAPI
    /v1/api-keys:
        get:
            summary: |-
                ListApiKeys returns a paginated list of the authenticated user's own API
                keys. Secrets are never included.
            description: 'Scope: `apikey:read`'
            operationId: ApiKeyAPI_ListApiKeys
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListApiKeysResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by key name.
                      - `status`: filter by key status (API_KEY_STATUS_ACTIVE,
                        API_KEY_STATUS_REVOKED).

                    Example: `field['status'] = 'API_KEY_STATUS_ACTIVE'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of keys to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - ApiKeyAPI
        post:
            summary: |-
                CreateApiKey creates a new API key for the authenticated user.
                The response includes the raw secret, which is shown exactly once
                and cannot be retrieved again.
            description: 'Scope: `apikey:write`'
            operationId: ApiKeyAPI_CreateApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: CreateApiKeyRequest creates an API key for the caller.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateApiKeyRequest'
            tags:
                - ApiKeyAPI
    /v1/api-keys/{api_key.id}:
        patch:
            summary: |-
                UpdateApiKey updates an API key's name or scopes. Only active keys can
                be updated. The secret and expiration are fixed at creation.
            description: 'Scope: `apikey:write`'
            operationId: ApiKeyAPI_UpdateApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: api_key.id
                  description: Unique identifier for the key.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApiKeyAPIUpdateApiKeyBody'
            tags:
                - ApiKeyAPI
    /v1/api-keys/{api_key_id}:
        get:
            summary: |-
                GetApiKey retrieves a single API key by ID.
                Returns metadata only. The key secret is never included.
            description: 'Scope: `apikey:read`'
            operationId: ApiKeyAPI_GetApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: api_key_id
                  description: The unique identifier of the key.
                  in: path
                  required: true
                  type: string
            tags:
                - ApiKeyAPI
    /v1/api-keys/{api_key_id}/revoke:
        post:
            summary: |-
                RevokeApiKey permanently revokes an API key. The key becomes
                immediately unusable and cannot be restored.
            description: 'Scope: `apikey:write`'
            operationId: ApiKeyAPI_RevokeApiKey
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeApiKeyResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: api_key_id
                  description: The unique identifier of the key to revoke.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApiKeyAPIRevokeApiKeyBody'
            tags:
                - ApiKeyAPI
    /v1/applications:
        get:
            summary: |-
                ListApplications returns a paginated list of applications within the
                caller's tenant.
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListApplicationsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by application name.
                      - `labels.key`: filter by label key.

                    Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of applications to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - ApplicationAPI
        post:
            summary: CreateApplication creates a new application within the caller's tenant.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: CreateApplicationRequest creates an application in the caller's tenant.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateApplicationRequest'
            tags:
                - ApplicationAPI
    /v1/applications/{application.id}:
        patch:
            summary: |-
                UpdateApplication updates an application's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: application.id
                  description: Unique identifier for the application.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApplicationAPIUpdateApplicationBody'
            tags:
                - ApplicationAPI
    /v1/applications/{application_id}:
        get:
            summary: GetApplication retrieves an application by ID.
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: application_id
                  description: The unique identifier of the application.
                  in: path
                  required: true
                  type: string
            tags:
                - ApplicationAPI
        delete:
            summary: |-
                DeleteApplication permanently deletes an application. Fails with
                FAILED_PRECONDITION while the application has environments: delete them
                first, each of which refuses while it manages anything. This action
                cannot be undone.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: application_id
                  description: The unique identifier of the application to delete.
                  in: path
                  required: true
                  type: string
            tags:
                - ApplicationAPI
    /v1/changesets:
        get:
            summary: |-
                ListChangeSets pages through one environment's change sets, newest
                first.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListChangeSets
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListChangeSetsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: environment_id
                  in: query
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `status`: filter by change set status.
                      - `title`: filter by title.

                    Example: `field['status'] = 'STATUS_OPEN'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - ChangeSetAPI
        post:
            summary: |-
                CreateChangeSet opens a change set against an environment. Edits given here
                cut revision 1 in the same request; with none, it has no revision
                until its first edit.
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_CreateChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateChangeSetRequest'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set.id}:
        patch:
            summary: |-
                UpdateChangeSet changes a change set's title and description. It cuts no
                revision and dismisses no approval: it describes the proposal, it is not
                part of it. FAILED_PRECONDITION when the change set is not open.
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_UpdateChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set.id
                  description: '`cs-` and twelve lowercase base36 characters.'
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIUpdateChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}:
        get:
            summary: GetChangeSet returns a change set and its head revision with entries.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/components/{component}/values:
        get:
            summary: |-
                GetComponentValues returns one component's values as the head revision
                leaves them, with the head's number, which an upload sends back as
                `if_revision`. By default only the values set on it, which is what review
                and diff show; with `effective`, the whole tree the component will
                receive, each value labelled with where it came from.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetComponentValues
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetComponentValuesResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: component
                  in: path
                  required: true
                  type: string
                - name: effective
                  description: |-
                    Return the whole tree the component will receive: its own defaults, the
                    organization's baseline, what the environment runs with, then this
                    change set's edits. An upload never uses this view.
                  in: query
                  required: false
                  type: boolean
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/diff:
        get:
            summary: |-
                DiffChangeSet returns, per component the head revision touches, the
                action, the version before and after, each changed path before and after,
                and the component's violations.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_DiffChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DiffChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/discard:
        post:
            summary: |-
                DiscardChangeSet closes an open change set and releases the component
                names it reserved. FAILED_PRECONDITION when it is not open.
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DiscardChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIDiscardChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/edit:
        post:
            summary: EditChangeSet applies the edits in order and cuts exactly one revision.
            description: |-
                FAILED_PRECONDITION when `if_revision` is not the head (the message names
                the head), when the change set is not open or its apply is running or
                holding the environment, when a version is revoked (the message
                carries the recorded reason), and when a component would land on no
                agent assignment that may run it and serves its providers (the message
                names an agent that would, and its owner). ALREADY_EXISTS when a component name is
                live or held by another open change set (the message names which). A
                contract violation is accepted: it is stored on the revision and
                returned.

                Scope: `changeset:write`
            operationId: ChangeSetAPI_EditChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1EditChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIEditChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/rebase:
        post:
            summary: |-
                RebaseChangeSet re-applies the change set onto its environment as it is
                now and cuts one revision with cause CAUSE_REBASE. A change set falls behind
                whenever its environment moves, and cannot apply until it is rebased.
            description: |-
                Every conflict needs a resolution, and resolving any dismisses every
                approval. Without one, an approval carries to the new revision's run when
                its plan does the same thing to every resource, as ApproveRun says.

                FAILED_PRECONDITION when it is not behind, when `if_revision` is not the
                head, when the change set is not open or its apply is running, and when a
                conflict has no resolution or a resolution matches no conflict (the
                message names each).

                Scope: `changeset:write`
            operationId: ChangeSetAPI_RebaseChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RebaseChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIRebaseChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revert:
        post:
            summary: |-
                RevertChangeSet opens a new change set that returns every component the
                given change set's apply changed to its state before that apply. History
                moves forward: the revert is planned, approved and applied like any other
                change set, and may apply while the reverted apply holds the environment.
            description: 'Scope: `changeset:write`'
            operationId: ChangeSetAPI_RevertChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevertChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIRevertChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions:
        get:
            summary: |-
                ListRevisions pages through a change set's revisions, oldest first,
                without their entries.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_ListRevisions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListRevisionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions/{revision}:
        get:
            summary: GetRevision returns one revision with its entries and ops.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: revision
                  description: 'The revision: its number, or its `rev-` id.'
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions/{revision}/artifact:
        get:
            summary: |-
                GetArtifact returns a prepared revision's artifact, with every value the
                component marks sensitive replaced by `sha256:` and the first twelve hex
                characters of its digest, so a change stays visible and the value does
                not: a Kubernetes Secret's `data` and `stringData`, and a Terraform
                variable declared `sensitive`. FAILED_PRECONDITION when the revision is
                not prepared.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetArtifact
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetArtifactResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: revision
                  description: 'The revision: its number, or its `rev-` id.'
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/revisions/{revision}/prepare:
        get:
            summary: |-
                GetPrepare returns the prepare of one revision: its status, findings,
                error and artifact digest. NOT_FOUND when that revision was never
                prepared.
            description: 'Scope: `changeset:read`'
            operationId: ChangeSetAPI_GetPrepare
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetPrepareResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: change_set_id
                  in: path
                  required: true
                  type: string
                - name: revision
                  description: 'The revision: its number, or its `rev-` id.'
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/components:
        get:
            summary: ListComponents pages through the registry.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_ListComponents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListComponentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by name.
                      - `description`: filter by description.
                      - `labels`: filter by label key/value.
                      - `status`: STATUS_ACTIVE, STATUS_DEPRECATED.

                    Example: `field['labels']['team'] = 'payments'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of components to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - RegistryAPI
    /v1/components/publish:
        post:
            summary: |-
                PublishComponent uploads a bundle and records it as a version, creating
                the component on first use.
            description: |-
                The bundle is a gzipped tar of the component root, carried inline and
                capped at 64 MiB; a fully vendored tree that exceeds it will get a
                resumable upload path of its own. The server normalizes the bytes
                (strips `.git`, canonicalizes entry order and timestamps), digests them,
                runs the publish gate, stores the blob and answers with the version. If
                the digest already exists under the name, the existing version is
                returned with `unchanged` set and nothing is written, which is what makes
                a publish-everything CI recipe safe.

                Any tags named in the request are set on the resulting version.
                Repointing a semver tag is refused with FAILED_PRECONDITION and the whole
                publish fails; the bytes are not kept.

                Scope: `component:publish`
            operationId: RegistryAPI_PublishComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1PublishComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: PublishComponentRequest carries what is being published and the bytes.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1PublishComponentRequest'
            tags:
                - RegistryAPI
    /v1/components/pull:
        post:
            summary: |-
                PullComponent publishes an artifact the tenant does not own: a chart in
                an HTTP repository or an OCI registry, a module in a module registry, a
                git repository at a ref, an archive. Admiral fetches it with the
                credentials named, closes it over what it reaches, scans it, and
                records the version with provenance saying where it came from. The
                bytes are a copy: upstream may move the tag and the version does not.
                The same resolution under the same name is the same version, returned
                with `unchanged` set.
            description: 'Scope: `component:publish`'
            operationId: RegistryAPI_PullComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1PullComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1PullComponentRequest'
            tags:
                - RegistryAPI
    /v1/components/{component.id}:
        patch:
            summary: |-
                UpdateComponent changes a component's description or labels. The name is
                immutable: references carry it, and a rename would strand them.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_UpdateComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component.id
                  description: Unique identifier.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPIUpdateComponentBody'
            tags:
                - RegistryAPI
    /v1/components/{component_id}:
        delete:
            summary: |-
                DeleteComponent removes a component. FAILED_PRECONDITION while any
                environment runs one of its versions or an open change set uses it (the
                message names them). The change sets and runs that used it still read
                its versions. The name is then free: a later publish under it creates a
                new component with a new id.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_DeleteComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
            tags:
                - RegistryAPI
    /v1/components/{component_id}/set-status:
        post:
            summary: |-
                SetComponentStatus moves a component between ACTIVE and DEPRECATED,
                recording why. DEPRECATED warns, naming the successor, wherever the
                component is added, moved to another version or planned; nothing is
                refused. FAILED_PRECONDITION when the successor is itself or is not
                ACTIVE.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_SetComponentStatus
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetComponentStatusResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPISetComponentStatusBody'
            tags:
                - RegistryAPI
    /v1/components/{component_id}/tags/{name}:
        delete:
            summary: |-
                DeleteTag removes a floating tag. A semver tag is refused with
                FAILED_PRECONDITION: it is immutable in both directions.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_DeleteTag
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteTagResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: name
                  in: path
                  required: true
                  type: string
            tags:
                - RegistryAPI
        put:
            summary: |-
                SetTag points a tag at a version, creating it or moving it. A semver tag
                may be created and never moved: FAILED_PRECONDITION on an attempt to
                repoint one, with the rule in the message. Setting a tag to the version
                it already names succeeds and changes nothing.
            description: 'Scope: `component:publish`'
            operationId: RegistryAPI_SetTag
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetTagResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: name
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPISetTagBody'
            tags:
                - RegistryAPI
    /v1/components/{component_id}/versions:
        get:
            summary: ListVersions pages through a component's versions, newest first.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_ListVersions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListVersionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression. Filterable fields:
                      - `kind`: COMPONENT_KIND_TERRAFORM, COMPONENT_KIND_HELM,
                        COMPONENT_KIND_MANIFESTS.
                      - `status`: STATUS_PUBLISHED, STATUS_DEPRECATED, STATUS_REVOKED.

                    Example: `field['status'] = 'STATUS_PUBLISHED'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - RegistryAPI
    /v1/components/{component_id}/versions/{digest}/set-status:
        post:
            summary: |-
                SetVersionStatus moves a version between PUBLISHED, DEPRECATED and
                REVOKED, recording why. Any move is allowed, including back to PUBLISHED.
            description: 'Scope: `component:write`'
            operationId: RegistryAPI_SetVersionStatus
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetVersionStatusResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: digest
                  description: |-
                    `sha256:<hex>`. A digest, not a tag: the status belongs to the bytes, and
                    a floating tag might name different bytes by the time anyone reads the
                    reason.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegistryAPISetVersionStatusBody'
            tags:
                - RegistryAPI
    /v1/components/{component_id}/versions/{reference}:
        get:
            summary: |-
                GetVersion retrieves one version by reference: a tag name, a `sha256:`
                digest or a `ver-` id.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_GetVersion
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetVersionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component_id
                  in: path
                  required: true
                  type: string
                - name: reference
                  description: |-
                    A tag (`v1.2.0`, `latest`), a digest (`sha256:<hex>`) or a version id
                    (`ver-…`). A digest and an id are recognised by their prefix; anything
                    else is a tag, and no tag starts with `ver-`.
                  in: path
                  required: true
                  type: string
            tags:
                - RegistryAPI
    /v1/components/{component}:
        get:
            summary: |-
                GetComponent retrieves a component by name or by `cmp-` id, with its
                tags. A name never starts with `cmp-`, so the two cannot collide.
            description: 'Scope: `component:read`'
            operationId: RegistryAPI_GetComponent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetComponentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: component
                  description: '`cloud-sql`, or `cmp-7q2k9m4x8p1c`.'
                  in: path
                  required: true
                  type: string
                  pattern: .+
            tags:
                - RegistryAPI
    /v1/credentials:
        get:
            summary: |-
                ListCredentials pages through the caller's tenant's credentials.
                Secrets are never included.
            description: 'Scope: `credential:read`'
            operationId: CredentialAPI_ListCredentials
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListCredentialsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `name`: filter by credential name.
                      - `type`: filter by credential type.
                      - `labels.key`: filter by label key.

                    Example: `field['type'] = 'TYPE_GITHUB_APP'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - CredentialAPI
        post:
            summary: CreateCredential registers a credential within the caller's tenant.
            description: |-
                The `type` and the populated `auth_config` variant must agree.

                Scope: `credential:write`
            operationId: CredentialAPI_CreateCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: CreateCredentialRequest registers a credential in the caller's tenant.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateCredentialRequest'
            tags:
                - CredentialAPI
    /v1/credentials/{credential.id}:
        patch:
            summary: |-
                UpdateCredential changes a credential's description, labels, allowed
                hosts, or secret. The name and type are immutable. A new secret
                replaces the old one whole; a rotation is an update with `auth_config`
                in the mask.
            description: 'Scope: `credential:write`'
            operationId: CredentialAPI_UpdateCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: credential.id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CredentialAPIUpdateCredentialBody'
            tags:
                - CredentialAPI
    /v1/credentials/{credential_id}:
        get:
            summary: |-
                GetCredential retrieves a credential's metadata by id. The secret is
                never included.
            description: 'Scope: `credential:read`'
            operationId: CredentialAPI_GetCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: credential_id
                  in: path
                  required: true
                  type: string
            tags:
                - CredentialAPI
        delete:
            summary: |-
                DeleteCredential removes a credential and destroys its secret. Nothing
                stores a reference to it: versions already published are unaffected,
                their provenance keeps the credential's id and name as history, and the
                next pull that names it fails naming the missing credential.
            description: 'Scope: `credential:write`'
            operationId: CredentialAPI_DeleteCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: credential_id
                  in: path
                  required: true
                  type: string
            tags:
                - CredentialAPI
    /v1/environment-components:
        get:
            summary: |-
                ListEnvironmentComponents returns live components: the version each runs
                and the apply that last changed it. In one environment, or, without one,
                across every environment, which is how "who runs this component, at which
                version" is answered. Only environments the caller can read are listed;
                the rest are counted.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_ListEnvironmentComponents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentComponentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: environment_id
                  description: The environment to list. Omitted lists across every environment.
                  in: query
                  required: false
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `name`: filter by component name.
                      - `kind`: filter by component kind.
                      - `component_id`: the registry component (`cmp-`) it runs.
                      - `version_id`: the registry version (`ver-`) it runs.

                    Example: `field['component_id'] = 'cmp-7q2k9m4x8p1c' AND field['version_id'] = 'ver-3k9x2m7qpl0a'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of components to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - EnvironmentAPI
    /v1/environments:
        get:
            summary: |-
                ListEnvironments returns a paginated list of environments, in one
                application or across all of them. Use the filter to narrow by name or
                labels.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_ListEnvironments
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: application_id
                  description: |-
                    The application to list environments of. Omitted lists every
                    environment the caller can see, across applications.
                  in: query
                  required: false
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by environment name.
                      - `labels.key`: filter by label key.

                    Example: `field['name'] = 'prod' AND field['labels.region'] = 'us-east-1'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of environments to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - EnvironmentAPI
        post:
            summary: CreateEnvironment creates a new environment for the specified application.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_CreateEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: CreateEnvironmentRequest creates an environment under an application.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateEnvironmentRequest'
            tags:
                - EnvironmentAPI
    /v1/environments/{environment.id}:
        patch:
            summary: |-
                UpdateEnvironment updates an environment's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_UpdateEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: environment.id
                  description: Unique identifier for the environment.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/EnvironmentAPIUpdateEnvironmentBody'
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}:
        get:
            summary: GetEnvironment retrieves an environment by ID.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_GetEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: environment_id
                  description: The unique identifier of the environment.
                  in: path
                  required: true
                  type: string
            tags:
                - EnvironmentAPI
        delete:
            summary: |-
                DeleteEnvironment permanently deletes an environment and discards its
                open change sets. Fails with FAILED_PRECONDITION while the environment
                manages anything: a live component, a running apply, or a hold. Apply a
                change set that destroys or orphans every component first. This action
                cannot be undone.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_DeleteEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: environment_id
                  description: The unique identifier of the environment to delete.
                  in: path
                  required: true
                  type: string
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}/components/{component}/values:
        get:
            summary: |-
                GetEnvironmentComponentValues returns the values a live component runs
                with, without opening a change set: by default only the values set on
                it, with `effective` the whole tree it receives, each value labelled with
                where it came from.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_GetEnvironmentComponentValues
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetEnvironmentComponentValuesResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: environment_id
                  in: path
                  required: true
                  type: string
                - name: component
                  in: path
                  required: true
                  type: string
                - name: effective
                  description: Return the whole tree it receives, not only the values set on it.
                  in: query
                  required: false
                  type: boolean
            tags:
                - EnvironmentAPI
    /v1/invitations:
        get:
            summary: |-
                ListInvitations returns a page of the caller's tenant's invitations, every
                status included, so an administrator can see what is outstanding, what
                expired and what was withdrawn.
            description: 'Scope: `user:read`'
            operationId: InvitationAPI_ListInvitations
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListInvitationsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `email`: filter by address.
                      - `status`: filter by lifecycle status.

                    Example: `field['status'] = 'STATUS_PENDING'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of invitations to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - InvitationAPI
        post:
            summary: |-
                CreateInvitation invites an address into the caller's tenant for a role and
                sends the mail. Returns the invitation; the link is only ever in the mail.
            description: |-
                A live invitation for the same address is retired and replaced, so a retry
                or a "send it again" is this same call. ALREADY_EXISTS when the address is
                already a member. INVALID_ARGUMENT for OWNER, which moves by transfer, never by
                invitation.

                Scope: `user:write`
            operationId: InvitationAPI_CreateInvitation
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateInvitationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: CreateInvitationRequest invites one address into the caller's tenant.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateInvitationRequest'
            tags:
                - InvitationAPI
    /v1/invitations/{invitation_id}/revoke:
        post:
            summary: |-
                RevokeInvitation withdraws a PENDING invitation; the link in the mail stops
                working at once. Idempotent: revoking one already revoked succeeds and
                changes nothing. FAILED_PRECONDITION when it was already accepted: there is
                a member now, and that is a different act.
            description: 'Scope: `user:write`'
            operationId: InvitationAPI_RevokeInvitation
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeInvitationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: invitation_id
                  description: The invitation, from CreateInvitation or ListInvitations.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/InvitationAPIRevokeInvitationBody'
            tags:
                - InvitationAPI
    /v1/jobs:
        get:
            summary: ListJobs lists jobs for an agent or an environment, newest first.
            description: 'Scope: `agent:read`'
            operationId: JobAPI_ListJobs
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListJobsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: agent_id
                  description: The agent whose queue to list. Name this, `environment_id`, or both.
                  in: query
                  required: false
                  type: string
                - name: environment_id
                  description: The environment whose jobs to list.
                  in: query
                  required: false
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `status`: filter by job status.
                      - `kind`: filter by job kind.

                    Example: `field['status'] = 'JOB_STATUS_QUEUED'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - JobAPI
    /v1/jobs/{job_id}:
        get:
            summary: GetJob returns a job, with why it is waiting when it is.
            description: 'Scope: `agent:read`'
            operationId: JobAPI_GetJob
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetJobResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: job_id
                  in: path
                  required: true
                  type: string
            tags:
                - JobAPI
    /v1/jobs/{job_id}/cancel:
        post:
            summary: |-
                CancelJob asks for a job to stop. A queued job is cancelled at once; a
                running one learns it on its next lease renewal.
            description: 'Scope: `agent:write`'
            operationId: JobAPI_CancelJob
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CancelJobResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: job_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/JobAPICancelJobBody'
            tags:
                - JobAPI
    /v1/jobs/{job_id}/log:
        get:
            summary: |-
                GetJobLog returns a job's output from `offset`: the whole log from 0,
                or what is new since the last read, which is how a console follows a
                running job. `complete` is set once the job has finished and nothing
                more will be written.
            description: 'Scope: `agent:read`'
            operationId: JobAPI_GetJobLog
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetJobLogResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: job_id
                  in: path
                  required: true
                  type: string
                - name: offset
                  description: Read from here, in bytes. 0 reads from the start.
                  in: query
                  required: false
                  type: string
                  format: int64
                - name: max_bytes
                  description: Return at most this many bytes. Defaults to 1 MiB when 0.
                  in: query
                  required: false
                  type: integer
                  format: int32
            tags:
                - JobAPI
    /v1/runs:
        get:
            summary: |-
                ListRuns lists runs, newest first. Without a `kind` in the filter it
                lists change set runs.
            description: 'Scope: `run:read`'
            operationId: RunAPI_ListRuns
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListRunsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL.

                    Filterable fields:
                      - `id`: runs by id, for fetching several at once (`field['id'] IN [...]`).
                      - `environment_id`: runs of one environment.
                      - `change_set_id`: runs of one change set.
                      - `status`: filter by run status.
                      - `kind`: `change_set`, `drift_check` or `reapply`, which is what
                        started the run (a revision, or `desired` with its mode).

                    Example: `field['environment_id'] = 'env-7q2k9m4x8p1c' AND field['kind'] = 'change_set'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  in: query
                  required: false
                  type: string
            tags:
                - RunAPI
        post:
            summary: |-
                CreateRun starts a run. For a change set revision it prepares the
                revision if needed, then plans it. For what is desired it checks for
                drift or plans a reapply.
            description: |-
                FAILED_PRECONDITION when the revision is not its change set's head, or
                the change set is not open.

                Scope: `run:write`
            operationId: RunAPI_CreateRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: body
                  description: CreateRunRequest starts a run.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateRunRequest'
            tags:
                - RunAPI
    /v1/runs/{run_id}:
        get:
            summary: |-
                GetRun returns a run: where it is, its plan and apply phases, and its
                approvals.
            description: 'Scope: `run:read`'
            operationId: RunAPI_GetRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: run_id
                  in: path
                  required: true
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/accept:
        post:
            summary: |-
                AcceptRun takes a PARTIAL run's apply as the environment's new state and
                releases the hold. It is recorded with its reason, and a change set run's
                change set becomes APPLIED.
            description: 'Scope: `run:write`'
            operationId: RunAPI_AcceptRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1AcceptRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: run_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIAcceptRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/apply:
        post:
            summary: |-
                ApplyRun applies a run's plan. It takes the environment's lock. The agent
                checks the plan is still current before it changes anything.
            description: |-
                FAILED_PRECONDITION when the run is not PLANNED, an approval in
                `required_approval` is missing, the change set is behind, the environment is held, or the run is a
                drift check.

                Scope: `run:write`
            operationId: RunAPI_ApplyRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ApplyRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: run_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIApplyRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/approve:
        post:
            summary: |-
                ApproveRun approves a run's plan. Only a person approves, and not one who
                revised the change set: the author never counts toward an approval rule,
                and an environment that needs no approval needs none of this. An
                approval carries to a later run of the same revision, or of a revision a
                rebase cut without resolving a conflict, when its plan gives every
                resource the same action and the same new value for each attribute the
                apply changes.
            description: |-
                FAILED_PRECONDITION when `plan_digest` is not the run's plan, or the run
                is not PLANNED.

                Scope: `run:write`
            operationId: RunAPI_ApproveRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ApproveRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: run_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIApproveRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/cancel:
        post:
            summary: |-
                CancelRun stops a run that is preparing, queued, planning or applying.
                An apply already changing the environment stops at the next component
                and ends PARTIAL.
            description: 'Scope: `run:write`'
            operationId: RunAPI_CancelRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CancelRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: run_id
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPICancelRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/plan/diff:
        get:
            summary: |-
                GetRunPlanDiff returns a finished plan's full diffs, with every value
                the component marks sensitive masked: a Kubernetes Secret's `data` and
                `stringData`, a Terraform value declared `sensitive`. FAILED_PRECONDITION until the plan has succeeded.
            description: 'Scope: `run:read`'
            operationId: RunAPI_GetRunPlanDiff
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetRunPlanDiffResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/googleRpcStatus'
            parameters:
                - name: run_id
                  in: path
                  required: true
                  type: string
            tags:
                - RunAPI
    /v1/tenant:
        get:
            summary: GetTenant returns the caller's own tenant.
            description: 'Scope: `tenant:read`'
            operationId: TenantAPI_GetTenant
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetTenantResponse'

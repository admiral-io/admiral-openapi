                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: deployment_id
                  description: Unique identifier of the deployment to list revisions for (UUID).
                  in: path
                  required: true
                  type: string
                - name: page_size
                  description: Maximum number of revisions to return per page.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token

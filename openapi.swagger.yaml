            component:
                type: string
        description: OrphanComponent stops managing a live component without tearing it down.
        required:
            - component
    v1PathDiff:
        type: object
        properties:
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            display_path:
                type: string
            before_present:
                type: boolean
            before_json:
                type: string
            after_present:
                type: boolean
            after_json:
                type: string
        description: 'PathDiff is one changed path: absent, null or a value on each side.'
    v1PathSegment:
        type: object
        properties:
            key:
                type: string
        description: PathSegment is one step into a values tree. Only map keys exist.
    v1PlanDiff:
        type: object
        properties:
            resources:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ResourceDiff'
        description: PlanDiff is a plan's full diffs, stored apart from the job.
    v1PlanPhase:
        type: object
        properties:
            jobs:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1RunJob'
                description: |-
                    One per agent job; a change set touching an IAM component and an
                    ordinary one plans on two.
            plan_digest:
                type: string
                description: '`sha256:<hex>` of the changes: identical plans have identical digests.'
            components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ComponentPlan'
            message:
                type: string
                description: Why the plan failed, when it did.
            started_at:
                type: string
                format: date-time
            finished_at:
                type: string
                format: date-time
        description: PlanPhase is a run's plan.
    v1PlanResult:
        type: object
        properties:
            components:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1ComponentPlan'
            diff_digest:
                type: string
                description: '`sha256:<hex>` of the PlanDiff uploaded for this attempt.'
        description: |-
            PlanResult is a PLAN job's typed outcome. Its digest is the plan's
            identity: two plans with the same changes have the same digest.
    v1Prepare:
        type: object
        properties:
            revision:
                type: integer
                format: int32
                description: 'The revision prepared: its number and its `rev-` id.'
            revision_id:
                type: string
            status:
                $ref: '#/definitions/v1PrepareStatus'
            artifact_digest:
                type: string
                description: '`sha256:<hex>` of the artifact; set once STATUS_PREPARED.'
            findings:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiChangesetV1Finding'
            error:
                $ref: '#/definitions/v1PrepareError'
                description: Set when STATUS_FAILED.
            requested_by:
                $ref: '#/definitions/v1ActorRef'
            requested_at:
                type: string
                format: date-time
            finished_at:
                type: string
                format: date-time
            attempts:
                type: integer
                format: int32
        description: Prepare is a revision's render into its artifact.
    v1PrepareError:
        type: object
        properties:
            class:
                $ref: '#/definitions/PrepareErrorClass'
            component:
                type: string
                description: Empty when the failure is not one component's.
            message:
                type: string
        description: PrepareError is why a prepare failed.
    v1PrepareStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_QUEUED
            - STATUS_RUNNING
            - STATUS_PREPARED
            - STATUS_FAILED
            - STATUS_SUPERSEDED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is where a revision's prepare stands.

             - STATUS_SUPERSEDED: A run of a newer revision started before this one was taken up.
    v1PresentedCredential:
        type: object
        properties:
            id:
                type: string
            name:
                type: string
            hosts:
                type: array
                items:
                    type: string
                description: The hosts it was presented to during this pull.
        description: |-
            PresentedCredential is one credential a pull presented, as it was named at
            the time; the credential may since have been renamed or deleted.
    v1ProfileReport:
        type: object
        properties:
            name:
                type: string
            serves:
                type: array
                items:
                    type: string
                description: |-
                    The providers this profile can authenticate, as `namespace/type`
                    addresses without a registry host, such as `cloudflare/cloudflare`. A
                    provider becomes a need once some agent in the tenant serves it; a
                    component that needs one is placed only where the profiles serve it.
        description: ProfileReport is one profile an agent defines, as its config declares it.
    v1Progress:
        type: object
        properties:
            completed_steps:
                type: integer
                format: int32
            total_steps:
                type: integer
                format: int32
            current_component:
                type: string
    v1Provenance:
        type: object
        properties:
            kind:
                $ref: '#/definitions/v1ProvenanceKind'
            uri:
                type: string
                description: |-
                    The repository or location the bytes were read from: a git remote URL, a
                    Helm repository URL, an OCI reference. For a push, as the publisher
                    reported it; empty when it named no remote.
            ref:
                type: string
                description: The ref that was asked for (tag, branch, chart version), when any.
            commit:
                type: string
                description: 'What the ref resolved to: a commit SHA, or the exact chart version.'
            path:
                type: string
                description: |-
                    The path within the source the bundle was taken from. Empty means the
                    root.
            dependencies:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Dependency'
                description: |-
                    Every remote module or chart the closure step copied into the bundle,
                    at what it resolved to.
            credentials:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PresentedCredential'
                description: |-
                    The credentials the platform presented while fetching, for PULL: which
                    secret reached which hosts. Lineage, not a grant; a later pull attaches
                    its own. Set by the server; ignored on a publish request.
                readOnly: true
            commit_message:
                type: string
                description: |-
                    The message of the commit that produced these bytes, as written, so a
                    reader deciding whether to move to this version can see what changed.
                    Captured at publish because it cannot be recovered after a force-push or
                    once the source is gone. Empty when there is no commit, or upstream
                    carried no notes.
            commit_author:
                type: string
                description: Who wrote that commit, by name. Not the email address.
        description: |-
            Provenance is where a version's bytes came from: the audit trail behind
            the digest.
    v1ProvenanceKind:
        type: string
        enum:
            - KIND_UNSPECIFIED
            - KIND_PUSH
            - KIND_PULL
        default: KIND_UNSPECIFIED
        description: |-
            Kind is the on-ramp a version arrived by: whose code it is and who
            triggered the publish, not which way the bytes travelled.

             - KIND_PUSH: The tenant's own code, published because they pushed it. Today that is
            the CLI uploading a directory, from CI or a laptop; the repository,
            ref and commit are what the publisher reported.
             - KIND_PULL: A copy of an artifact the tenant does not own (a chart, a registry
            module, a git tree, an archive), fetched by Admiral. The upstream
            identity is recorded; the bytes are frozen here.
    v1PublishComponentRequest:
        type: object
        properties:
            name:
                type: string
                description: The component name to publish under. Created on first use.
            kind:
                $ref: '#/definitions/v1ComponentKind'
                description: |-
                    The kind, when the caller knows better than inspection. UNSPECIFIED
                    means detect.
            tags:
                type: array
                items:
                    type: string
                description: Tags to set on the resulting version (e.g. `v1.2.0`, `latest`).
            description:
                type: string
                description: |-
                    Description and labels for the component. Applied when the publish
                    creates the component; ignored when it already exists, since a publish is
                    not the place to edit metadata. UpdateComponent is.
            labels:
                type: object
                additionalProperties:
                    type: string
            provenance:
                $ref: '#/definitions/v1Provenance'
                description: |-
                    What the caller knows about where the bytes came from. The server
                    records the kind as PUSH whatever is claimed here; the uri, ref,
                    commit and path are kept as the caller's assertion.
            bundle:
                type: string
                format: byte
                description: 'The bundle: a gzipped tar of the component root. At most 64 MiB.'
        description: PublishComponentRequest carries what is being published and the bytes.
        required:
            - name
            - bundle
    v1PublishComponentResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/v1Component'
            version:
                $ref: '#/definitions/v1Version'
            unchanged:
                type: boolean
                description: |-
                    True when the digest was already published under this name and nothing
                    was written. Tags in the request were still applied.
        description: PublishComponentResponse is the recorded version.
    v1PullComponentRequest:
        type: object
        properties:
            name:
                type: string
                description: |-
                    Empty means the artifact's own name: the chart's, the module's, the
                    repository's or directory's.
            source:
                $ref: '#/definitions/v1PullSource'
            credential_ids:
                type: array
                items:
                    type: string
                description: |-
                    The credentials this pull may present, chosen by the caller. Each is
                    presented only where its type fits and its `allowed_hosts` permit. A
                    fetch that reaches a host none of them covers fails naming the host.
            tags:
                type: array
                items:
                    type: string
                description: |-
                    Tags to set on the resulting version. A chart's version and a
                    module's version are applied as tags whether or not named.
            description:
                type: string
                description: Applied when the pull creates the component; ignored otherwise.
            labels:
                type: object
                additionalProperties:
                    type: string
            baseline_values_json:
                type: string
                description: |-
                    The organization's defaults for this artifact, as a JSON object: values
                    laid over the artifact's own defaults (a chart's values.yaml, a module's
                    variable defaults) before any environment's values. Stored with the
                    artifact as one version under one digest, so changing them is a new
                    version, which environments move to like any other. Empty means the
                    artifact's own defaults.
        required:
            - source
    v1PullComponentResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/v1Component'
            version:
                $ref: '#/definitions/v1Version'
            unchanged:
                type: boolean
                description: The resolution was already published under this name; nothing was written.
    v1PullSource:
        type: object
        properties:
            oci_chart:
                $ref: '#/definitions/PullSourceOCIChart'
            helm_chart:
                $ref: '#/definitions/PullSourceHelmChart'
            registry_module:
                $ref: '#/definitions/PullSourceRegistryModule'
            git_tree:
                $ref: '#/definitions/PullSourceGitTree'
            archive:
                $ref: '#/definitions/PullSourceArchive'
        description: |-
            PullSource names an artifact to pull. One variant. The kind of the
            resulting component follows from it: a chart from OCI or a Helm
            repository, a module from a module registry, whatever inspection finds in
            a git tree or an archive.
    v1RebaseChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
            revision:
                $ref: '#/definitions/v1Revision'
            warnings:
                type: array
                items:
                    type: string
    v1RegistryRef:
        type: object
        properties:
            name:
                type: string
                description: The component's name in the registry.
            reference:
                type: string
                description: A tag or a `sha256:` digest.
        description: |-
            RegistryRef is a registry component and a tag or digest in it. A tag is
            resolved when the edit is made; the change set keeps the digest and the
            reference as given (VersionRef).
        required:
            - name
            - reference
    v1RemoveComponent:
        type: object
        properties:
            component:
                type: string
        description: |-
            RemoveComponent drops a component this change set adds, or destroys a live
            one.
        required:
            - component
    v1RenewJobResponse:
        type: object
        properties:
            lease_ttl_seconds:
                type: integer
                format: int32
            cancel_requested:
                type: boolean
                description: Stop, clean up, and report CANCELLED. The lease stays valid meanwhile.
    v1ReplaceValues:
        type: object
        properties:
            component:
                type: string
            tree_json:
                type: string
                description: A JSON object.
        description: |-
            ReplaceValues makes a component's values exactly this tree: an upload.
            The request must carry `if_revision`, the head the tree was downloaded at.
        required:
            - component
            - tree_json
    v1Resolution:
        type: object
        properties:
            component:
                type: string
            kind:
                $ref: '#/definitions/v1ConflictKind'
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            keep:
                $ref: '#/definitions/ResolutionKeep'
        description: Resolution settles one Conflict, matched by component, kind and path.
        required:
            - component
    v1ResourceChange:
        type: object
        properties:
            resource:
                $ref: '#/definitions/v1ResourceRef'
            action:
                $ref: '#/definitions/ResourceChangeAction'
            diff_digest:
                type: string
                description: '`sha256:<hex>` of this resource''s diff in the PlanDiff. Empty for ACTION_NO_OP.'
    v1ResourceDiff:
        type: object
        properties:
            component:
                type: string
            resource:
                $ref: '#/definitions/v1ResourceRef'
            diff:
                type: string
                description: |-
                    Unified diff from the live object to the desired one, both normalized.
                    A Secret's data shows each key as added, changed or removed, never a
                    value.
    v1ResourceRef:
        type: object
        properties:
            api_version:
                type: string
            kind:
                type: string
            namespace:
                type: string
                description: Empty for a cluster-scoped object.
            name:
                type: string
        description: ResourceRef names one Kubernetes object.
    v1RevertChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
    v1Revision:
        type: object
        properties:
            id:
                type: string
                description: |-
                    `rev-` and twelve base36 characters. `number` is the human ordinal
                    within its change set.
                readOnly: true
            number:
                type: integer
                format: int32
            change_set_id:
                type: string
            base_generation:
                type: string
                format: int64
                description: The environment's generation when the base was taken.
            cause:
                $ref: '#/definitions/RevisionCause'
            violations:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Violation'
            created_by:
                $ref: '#/definitions/v1ActorRef'
            created_at:
                type: string
                format: date-time
            entries:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Entry'
                description: Empty in a listing.
    v1RevokeAgentUseResponse:
        type: object
    v1RevokeApiKeyResponse:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: The key metadata with updated status.
        description: RevokeApiKeyResponse contains the revoked API key metadata.
    v1RevokeInvitationResponse:
        type: object
        properties:
            invitation:
                $ref: '#/definitions/v1Invitation'
        description: RevokeInvitationResponse carries the invitation as it now stands.
    v1Run:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            environment_id:
                type: string
                readOnly: true
            revision_id:
                type: string
                description: A change set revision.
            desired:
                $ref: '#/definitions/v1Desired'
                description: What the environment desires.
            change_set_id:
                type: string
                description: The change set of `revision_id`. Absent for a desired run.
                readOnly: true
            status:
                $ref: '#/definitions/v1RunStatus'
                readOnly: true
            trigger:
                $ref: '#/definitions/RunTrigger'
                readOnly: true
            wait_reason:
                $ref: '#/definitions/v1WaitReason'
                description: |-
                    While QUEUED, the reason of the first job still waiting; each job in the
                    phases carries its own.
                readOnly: true
            plan:
                $ref: '#/definitions/v1PlanPhase'
                readOnly: true
            apply:
                $ref: '#/definitions/v1ApplyPhase'
                description: Absent until the run is applied.
                readOnly: true
            approvals:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1Approval'
                description: |-
                    Approvals of this run's plan, including ones carried from an earlier run
                    of the same revision.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            finished_at:
                type: string
                format: date-time
                readOnly: true
            required_approval:
                $ref: '#/definitions/v1ApprovalRule'
                description: |-
                    What an apply needs from people: the environment's rule combined with the
                    rule of every agent the run touches, fixed when the plan finishes so an
                    edited rule never changes a run under its reviewers. Absent before then,
                    and when nothing is required.
                readOnly: true
        description: |-
            Run is one plan of an environment, and the apply of that plan when it is
            approved and applied.
    v1RunJob:
        type: object
        properties:
            job_id:
                type: string
                readOnly: true
            components:
                type: array
                items:
                    type: string
            assignment_id:
                type: string
                readOnly: true
            agent_id:
                type: string
                readOnly: true
            status:
                $ref: '#/definitions/v1JobStatus'
                description: Where the job stands, and why it waits while QUEUED.
                readOnly: true
            wait_reason:
                $ref: '#/definitions/v1WaitReason'
                readOnly: true
        description: |-
            RunJob is one agent job within a phase: the components it covers and the
            assignment it ran on.
    v1RunStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_PREPARING
            - STATUS_QUEUED
            - STATUS_PLANNING
            - STATUS_PLANNED
            - STATUS_NO_CHANGES
            - STATUS_APPLYING
            - STATUS_APPLIED
            - STATUS_PARTIAL
            - STATUS_SUPERSEDED
            - STATUS_FAILED
            - STATUS_CANCELLED
            - STATUS_CLEAN
            - STATUS_DRIFTED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is where the run is. A change set run or a reapply ends APPLIED,
            PARTIAL, NO_CHANGES, SUPERSEDED, FAILED or CANCELLED; a drift check ends
            CLEAN, DRIFTED, FAILED or CANCELLED.

             - STATUS_PREPARING: The revision is being rendered into its artifact.
             - STATUS_QUEUED: Waiting for an agent; `wait_reason` says why.
             - STATUS_PLANNED: The plan has changes and can be approved and applied.
             - STATUS_NO_CHANGES: The plan found nothing to change.
             - STATUS_PARTIAL: The apply stopped partway; the environment is held until this run is
            accepted, or, for a change set run, its change set is reverted.
             - STATUS_SUPERSEDED: A newer plan replaced this one before it was applied.
             - STATUS_FAILED: The plan or the apply failed; the phase says which.
             - STATUS_CLEAN: A drift check found the environment as desired.
             - STATUS_DRIFTED: A drift check found changes made outside Admiral.
    v1SSHKeyAuth:
        type: object
        properties:
            private_key:
                type: string
                description: Write-only.
            passphrase:
                type: string
                description: Write-only.
        description: SSHKeyAuth is a PEM-encoded private key and its passphrase, if any.
    v1SetComponentStatusResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/v1Component'
        description: SetComponentStatusResponse contains the component with its new status.
    v1SetDependsOn:
        type: object
        properties:
            component:
                type: string
            depends_on:
                type: array
                items:
                    type: string
        description: |-
            SetDependsOn replaces the components a component applies after. Empty
            clears it. A cycle is refused.
        required:
            - component
    v1SetSettings:
        type: object
        properties:
            component:
                type: string
            settings:
                $ref: '#/definitions/v1ComponentSettings'
        description: |-
            SetSettings replaces how a component is deployed. FAILED_PRECONDITION
            when the settings are for another kind than the component's.
        required:
            - component
            - settings
    v1SetTagResponse:
        type: object
        properties:
            tag:
                $ref: '#/definitions/v1Tag'
        description: SetTagResponse contains the tag as it now stands.
    v1SetValue:
        type: object
        properties:
            component:
                type: string
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            value_json:
                type: string
                description: |-
                    JSON text. `null` clears a chart default, as a values file's
                    `key: null` does; UnsetValue makes the key absent so the default applies.
        description: |-
            SetValue writes a value at a path, creating maps on the way, as
            `helm --set` does. A map value replaces what was there.
        required:
            - component
            - value_json
    v1SetVersion:
        type: object
        properties:
            component:
                type: string
            reference:
                type: string
                description: A tag or a `sha256:` digest.
        description: |-
            SetVersion moves a component to another version of the same registry
            component. The reference resolves to a digest when the edit is made.
        required:
            - component
            - reference
    v1SetVersionStatusResponse:
        type: object
        properties:
            version:
                $ref: '#/definitions/v1Version'
        description: SetVersionStatusResponse contains the version with its new status.
    v1SetWorkloadIdentityProviderKeysResponse:
        type: object
        properties:
            workload_identity_provider:
                $ref: '#/definitions/v1WorkloadIdentityProvider'
    v1Slots:
        type: object
        properties:
            kind:
                $ref: '#/definitions/v1JobKind'
            free:
                type: integer
                format: int32
            capacity:
                type: integer
                format: int32
                description: |-
                    The most of this kind the agent runs at once. The server offers no more
                    than this, whatever `free` says.
        description: Slots is how many more jobs of a kind the agent will take now.
    v1StartJobResponse:
        type: object
        properties:
            lease_ttl_seconds:
                type: integer
                format: int32
                description: Renew before this passes, measured from when the request was sent.
            max_run_seconds:
                type: integer
                format: int32
                description: The job is failed once it has run this long, renewed or not.
    v1Step:
        type: object
        properties:
            component:
                type: string
            status:
                $ref: '#/definitions/v1JobStatus'
            message:
                type: string
        description: Step is one component's part of a job.
    v1Tag:
        type: object
        properties:
            name:
                type: string
                description: As written after the colon in `cloud-sql:v1.2.0`.
                readOnly: true
            digest:
                type: string
                description: The version it names, as `sha256:<hex>`.
                readOnly: true
            immutable:
                type: boolean
                description: |-
                    True for a semver tag: it never moves once assigned. Decided from the
                    name, so two tags with the same name are always the same class.
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
        description: Tag is a name pointing at a version.
    v1Tenant:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier.
                readOnly: true
            slug:
                type: string
                description: URL-safe identifier, unique across Admiral. Fixed at creation.
                readOnly: true
            display_name:
                type: string
                description: Human-readable name.
            status:
                $ref: '#/definitions/v1TenantStatus'
                description: Lifecycle state.
                readOnly: true
            avatar_url:
                type: string
                description: |-
                    The organization's logo, shown on its sign-in page and in the console.
                    Absent when none is set.
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            updated_at:
                type: string
                format: date-time
                readOnly: true
        description: |-
            Tenant is the account as its own members see it: its identity, its lifecycle
            state, and the settings they control. Operational detail about how the
            account is run is not part of this view.
    v1TenantStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_ACTIVE
            - STATUS_SUSPENDED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is the account's lifecycle state. A caller sees it but cannot
            set it: suspension and reactivation are imposed, not requested.

             - STATUS_UNSPECIFIED: Default value. Must not be used.
             - STATUS_ACTIVE: Normal operation.
             - STATUS_SUSPENDED: Access is withheld, typically for billing or abuse. Data is retained.
    v1TerraformAgentSettings:
        type: object
        properties:
            engines:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1TerraformEngineSupport'
                description: |-
                    The engines this agent runs. Placing a component that needs an engine or
                    version outside them is refused when the change set is edited, naming an
                    agent that runs it, so no job waits on it.
        description: TerraformAgentSettings is what a Terraform agent will run.
    v1TerraformEngineSupport:
        type: object
        properties:
            engine:
                $ref: '#/definitions/TerraformEngineSupportEngine'
            versions:
                type: string
                description: |-
                    A version constraint in Terraform's syntax, e.g. `>= 1.8, < 2.0`. Empty
                    allows every version.
        description: TerraformEngineSupport is one engine an agent runs, and which versions.
    v1UnsetValue:
        type: object
        properties:
            component:
                type: string
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
        description: UnsetValue removes a path, so the default applies.
        required:
            - component
    v1UpdateAgentResponse:
        type: object
        properties:
            agent:
                $ref: '#/definitions/v1Agent'
    v1UpdateApiKeyResponse:
        type: object
        properties:
            api_key:
                $ref: '#/definitions/v1ApiKey'
                description: The updated key metadata.
        description: UpdateApiKeyResponse contains the updated API key metadata.
    v1UpdateApplicationResponse:
        type: object
        properties:
            application:
                $ref: '#/definitions/v1Application'
                description: The updated application.
        description: UpdateApplicationResponse contains the updated application.
    v1UpdateChangeSetResponse:
        type: object
        properties:
            change_set:
                $ref: '#/definitions/v1ChangeSet'
    v1UpdateComponentResponse:
        type: object
        properties:
            component:
                $ref: '#/definitions/v1Component'
        description: UpdateComponentResponse contains the updated component.
    v1UpdateCredentialResponse:
        type: object
        properties:
            credential:
                $ref: '#/definitions/v1Credential'
    v1UpdateEnvironmentResponse:
        type: object
        properties:
            environment:
                $ref: '#/definitions/v1Environment'
                description: The updated environment.
        description: UpdateEnvironmentResponse contains the updated environment.
    v1UpdateTenantRequest:
        type: object
        properties:
            tenant:
                $ref: '#/definitions/v1Tenant'
                description: |-
                    The tenant with updated fields. Only fields named in `update_mask` are
                    applied.
            update_mask:
                type: string
                description: |-
                    The set of fields to update. Optional; if omitted, all populated fields
                    are updated. Supported fields: `display_name`.
        description: UpdateTenantRequest updates the caller's own tenant, so it names no id.
        required:
            - tenant
    v1UpdateTenantResponse:
        type: object
        properties:
            tenant:
                $ref: '#/definitions/v1Tenant'
    v1UploadJobPlanDiffResponse:
        type: object
        properties:
            diff_digest:
                type: string
                description: '`sha256:<hex>` of the diff as stored.'
    v1User:
        type: object
        properties:
            id:
                type: string
                description: Unique identifier for the user.
                readOnly: true
            email:
                type: string
                description: User's email address.
            email_verified:
                type: boolean
                description: Whether the email has been verified by the IdP.
                readOnly: true
            display_name:
                type: string
                description: User's display name for UI purposes.
            given_name:
                type: string
                description: User's given (first) name.
            family_name:
                type: string
                description: User's family (last) name.
            avatar_url:
                type: string
                description: URL to the user's avatar image.
            created_at:
                type: string
                format: date-time
                description: When the user was created.
                readOnly: true
            updated_at:
                type: string
                format: date-time
                description: When the user was last updated.
                readOnly: true
            role:
                $ref: '#/definitions/v1UserRole'
                description: The user's standing in the tenant.
                readOnly: true
            status:
                $ref: '#/definitions/v1UserStatus'
                description: Whether the user can currently sign in.
                readOnly: true
        description: User represents a user's profile information.
    v1UserRole:
        type: string
        enum:
            - USER_ROLE_UNSPECIFIED
            - USER_ROLE_OWNER
            - USER_ROLE_ADMIN
            - USER_ROLE_MEMBER
        default: USER_ROLE_UNSPECIFIED
        description: |-
            UserRole is a member's standing in the tenant. The tiers imply one another
            downward: an owner can do everything an administrator can, an administrator
            everything a member can.

             - USER_ROLE_UNSPECIFIED: Default value. Must not be used.
             - USER_ROLE_OWNER: Owns the tenant. Exactly one per tenant; ownership moves by transfer, never
            by invitation.
             - USER_ROLE_ADMIN: Manages members and tenant settings.
             - USER_ROLE_MEMBER: Ordinary membership.
    v1UserStatus:
        type: string
        enum:
            - USER_STATUS_UNSPECIFIED
            - USER_STATUS_ACTIVE
            - USER_STATUS_SUSPENDED
        default: USER_STATUS_UNSPECIFIED
        description: |-
            UserStatus is whether a member can currently sign in.

             - USER_STATUS_UNSPECIFIED: Default value. Must not be used.
             - USER_STATUS_ACTIVE: Can sign in and act.
             - USER_STATUS_SUSPENDED: Suspended by an administrator; cannot sign in until reactivated.
    v1ValueOp:
        type: object
        properties:
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            op:
                $ref: '#/definitions/v1ValueOpKind'
            value_json:
                type: string
                description: JSON text; empty unless op is KIND_SET.
            from_present:
                type: boolean
                description: Whether the base had the key; a null there is present.
            from_value_json:
                type: string
                description: JSON text; empty when from_present is false.
        description: ValueOp is one change at one path, with what the base held there.
    v1ValueOpKind:
        type: string
        enum:
            - KIND_UNSPECIFIED
            - KIND_SET
            - KIND_UNSET
        default: KIND_UNSPECIFIED
        description: |4-
             - KIND_SET: Writes a value. A null value deletes a chart default (Helm's
            documented way to drop a default key).
             - KIND_UNSET: Makes the key absent, so the default applies.
    v1ValueSource:
        type: object
        properties:
            path:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/v1PathSegment'
            origin:
                $ref: '#/definitions/ValueSourceOrigin'
        description: ValueSource says where one value in an effective tree came from.
    v1Version:
        type: object
        properties:
            id:
                type: string
                description: |-
                    `ver-` and twelve base36 characters. A change set holds it beside the
                    digest, which is the identity of the bytes.
                readOnly: true
            component_id:
                type: string
                description: The component this version belongs to, `cmp-`.
                readOnly: true
            digest:
                type: string
                description: 'The identity: SHA-256 of the normalized bundle, as `sha256:<hex>`.'
                readOnly: true
            kind:
                $ref: '#/definitions/v1ComponentKind'
                readOnly: true
            size_bytes:
                type: string
                format: int64
                description: Size of the stored bundle in bytes.
                readOnly: true
            contract:
                $ref: '#/definitions/v1Contract'
                description: |-
                    The inputs and outputs the bundle exposes. Inferred from the bundle at
                    publish; curated by a publisher once the contract format lands.
                readOnly: true
            provenance:
                $ref: '#/definitions/v1Provenance'
                description: Where the bytes came from.
                readOnly: true
            findings:
                type: array
                items:
                    type: object
                    $ref: '#/definitions/apiRegistryV1Finding'
                description: |-
                    What the publish gate found. Informational findings do not block a
                    publish; a version with findings is published with them attached, and
                    the findings delta between two versions is what an upgrade review reads.
                readOnly: true
            status:
                $ref: '#/definitions/v1VersionStatus'
                readOnly: true
            status_changed_at:
                type: string
                format: date-time
                description: |-
                    When and why the status last changed. Unset on a version that has only
                    ever been PUBLISHED.
                readOnly: true
            status_reason:
                type: string
                readOnly: true
            tags:
                type: array
                items:
                    type: string
                description: The tags currently naming this version.
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
            providers:
                type: array
                items:
                    type: string
                description: |-
                    The Terraform providers the bundle's root and vendored modules require,
                    as `namespace/type` addresses without a registry host, read offline at
                    publish. Empty for a Kubernetes component. A provider some agent in the
                    tenant serves is a need: adding the component, setting its version or
                    settings, or changing an assignment is refused unless the plan and apply
                    profiles serve every need.
                readOnly: true
            baseline_values_json:
                type: string
                description: |-
                    The organization's defaults stored with this version, as a JSON object;
                    empty when there are none. The contract's defaults already include them.
                readOnly: true
        description: Version is one published artifact. Immutable except for its status.
    v1VersionRef:
        type: object
        properties:
            component_id:
                type: string
                description: The registry component.
            version_id:
                type: string
                description: The registry version.
            digest:
                type: string
                description: '`sha256:<hex>` of the bundle.'
            reference:
                type: string
                description: The tag or `sha256:` digest as given, such as `5.5.0` or `latest`.
        description: |-
            VersionRef is one registry version, as a change set or an environment
            holds it: the digest it resolved to, and the reference a person asked for.
            A tag is resolved once, when the edit is made; if it moves later, nothing
            changes until the version is set again.
    v1VersionStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_PUBLISHED
            - STATUS_DEPRECATED
            - STATUS_REVOKED
        default: STATUS_UNSPECIFIED
        description: |-
            Status is a version's lifecycle. There is no deleted state.

             - STATUS_PUBLISHED: Adoptable: a change set may set it.
             - STATUS_DEPRECATED: Still adoptable, with a warning; what already runs it warns too.
             - STATUS_REVOKED: Refuses new adoption; what already runs it keeps running with a warning.
    v1Violation:
        type: object
        properties:
            component:
                type: string
            path:
                type: string
                description: 'Display form: `image.tag`, `ingress."a.b"`.'
            message:
                type: string
        description: |-
            Violation is one way a component's values fail its version's
            contract.
    v1WaitReason:
        type: string
        enum:
            - WAIT_REASON_UNSPECIFIED
            - WAIT_REASON_NO_AGENT_ASSIGNED
            - WAIT_REASON_AGENT_NOT_GRANTED
            - WAIT_REASON_AGENT_OFFLINE
            - WAIT_REASON_AGENT_AT_CAPACITY
            - WAIT_REASON_AGENT_TOO_OLD
            - WAIT_REASON_ENVIRONMENT_BUSY
            - WAIT_REASON_BACKOFF
            - WAIT_REASON_PROVIDER_PENDING
            - WAIT_REASON_PROFILE_MISSING
            - WAIT_REASON_COMPONENT_NOT_ALLOWED
        default: WAIT_REASON_UNSPECIFIED
        description: |-
            WaitReason says why a queued job is not running.

             - WAIT_REASON_ENVIRONMENT_BUSY: Another APPLY holds the environment.
             - WAIT_REASON_BACKOFF: Retrying after a failed attempt.
             - WAIT_REASON_PROFILE_MISSING: The agent has not reported the profile the job needs.
             - WAIT_REASON_COMPONENT_NOT_ALLOWED: The agent's owner no longer allows a component this job covers.
    v1WorkloadIdentity:
        type: object
        properties:
            provider_id:
                type: string
            subject:
                type: string
        description: |-
            WorkloadIdentity is an agent that proves who it is with a token from a
            provider Admiral trusts: the provider, and the subject its token must carry,
            matched exactly. For a Kubernetes service account the subject is
            `system:serviceaccount:<namespace>:<name>`; for GitHub Actions,
            `repo:<owner>/<repo>:ref:<ref>`; for a GCP service account, its numeric id.
            The exact match is what secures a shared issuer, which anyone can get a
            token from.
        required:
            - provider_id
            - subject
    v1WorkloadIdentityProvider:
        type: object
        properties:
            id:
                type: string
                readOnly: true
            name:
                type: string
            status:
                $ref: '#/definitions/v1WorkloadIdentityProviderStatus'
                readOnly: true
            issuer:
                type: string
                description: |-
                    The `iss` every token must carry, exactly, e.g.
                    `https://token.actions.githubusercontent.com`. Required on create for
                    `jwks_uri` and `jwks`. For enrollment it may be left out: enrolling
                    records it from the enrolling agent's verified token. Fixed once set.
            keys:
                $ref: '#/definitions/v1WorkloadIdentityProviderKeys'
                description: Where the verifying keys come from. Absent on create means enrollment.
            key_ids:
                type: array
                items:
                    type: string
                description: The key ids currently trusted.
                readOnly: true
            keys_updated_at:
                type: string
                format: date-time
                readOnly: true
            pending_key_ids:
                type: array
                items:
                    type: string
                description: |-
                    Key ids an agent reported that are not trusted yet. They are never
                    applied on their own: an admin accepts them with
                    SetWorkloadIdentityProviderKeys.
                readOnly: true
            pending_keys_at:
                type: string
                format: date-time
                readOnly: true
            created_by:
                $ref: '#/definitions/v1ActorRef'
                readOnly: true
            created_at:
                type: string
                format: date-time
                readOnly: true
        description: |-
            WorkloadIdentityProvider is a token issuer Admiral trusts for agents to
            prove who they are: a Kubernetes cluster's service-account issuer, GitHub
            Actions, Google, an AWS account. A token must carry this `issuer` as its
            `iss`, be issued for Admiral as its audience, and verify against the
            provider's keys. Which workload it is comes from its subject, which each
            agent names.
    v1WorkloadIdentityProviderKeys:
        type: object
        properties:
            jwks_uri:
                type: string
                description: |-
                    Fetched and refreshed when a token names a key not yet seen. Rotation
                    needs no action.
            jwks:
                type: string
                description: |-
                    A JSON Web Key Set, pasted in for a private issuer. It replaces the
                    trusted set, so paste the whole set the issuer serves: during a
                    rotation that holds the old key and the new one.
            enrollment:
                $ref: '#/definitions/WorkloadIdentityProviderKeysEnrollment'
                description: |-
                    The agents inside keep the keys current. On a PENDING provider the
                    first keys arrive when an agent enrolls with a single-use key. On a
                    TRUSTED one, switching here keeps the keys it has and stops fetching or
                    expecting a paste; from then on, keys agents report wait in
                    `pending_key_ids` for an admin to accept.
        description: |-
            WorkloadIdentityProviderKeys is where Admiral gets the keys that verify a
            provider's tokens.
    v1WorkloadIdentityProviderStatus:
        type: string
        enum:
            - STATUS_UNSPECIFIED
            - STATUS_PENDING
            - STATUS_TRUSTED
        default: STATUS_UNSPECIFIED
        description: ' - STATUS_PENDING: No keys yet: an agent may enroll it.'
servers:
    - url: "{baseUrl}"
      description: Admiral API server
      variables:
        baseUrl:
            default: https://api.admiral.io
            description: The base URL of your Admiral instance.
host: api.admiral.io
schemes:
    - https
    - http
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: >-
                An API key, or an access token minted from one. Pass it in the Authorization header: `Bearer admp_...`
security:
    - bearerAuth: []
x-tagGroups:
    - name: Applications
      tags:
        - Applications
        - Environments
    - name: Deployments
      tags:
        - ChangeSets
        - Runs
    - name: Registry
      tags:
        - Components
        - Credentials
    - name: Agents
      tags:
        - Workload Identity Providers
        - Agents
        - Jobs
    - name: Identity & Access
      tags:
        - Tenant
        - User
        - Invitations
        - API Keys

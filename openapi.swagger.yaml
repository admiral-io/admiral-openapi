swagger: "2.0"
info:
    title: Admiral API
    version: v1
tags:
    - name: RunAPI
    - name: AgentAPI
    - name: AgentRuntimeAPI
    - name: ApplicationAPI
    - name: AuthenticationAPI
    - name: CatalogAPI
    - name: ChangeSetAPI
    - name: CredentialAPI
    - name: EnvironmentAPI
    - name: HealthcheckAPI
    - name: SourceAPI
    - name: UserAPI
consumes:
    - application/json
produces:
    - application/json
paths:
    /v1/agents:
        get:
            summary: |-
                ListAgents returns a paginated list of agents within the caller's tenant.
                Filter by `kind` to list only TERRAFORM or KUBERNETES agents.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `kind`: filter by agent kind (TERRAFORM, KUBERNETES).
                      - `name`: filter by agent name.
                      - `health_status`: filter by health status.
                      - `labels.key`: filter by label key.

                    Example: `field['kind'] = 'KUBERNETES' AND field['health_status'] = 'HEALTHY'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of agents to return per page. Defaults to 50 when omitted or
                    0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                ---------------------------------------------------------------------------
                Admin CRUD
                ---------------------------------------------------------------------------
                CreateAgent creates a new agent record within the caller's tenant and
                generates an initial Service Access Token (SAT). The agent starts in PENDING
                health status until it begins reporting.
            description: |-
                The request's `kind` selects the agent's execution plane (TERRAFORM or KUBERNETES)
                and determines the SAT's auto-assigned scopes. The kind is immutable.

                The response includes a `plain_text_token`: the raw SAT secret shown
                exactly once. Deploy this token to the agent binary for authentication.

                Scope: `agent:write`
            operationId: AgentAPI_CreateAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateAgentRequest contains the parameters for creating a new agent.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateAgentRequest'
            tags:
                - AgentAPI
    /v1/agents/tokens/{token_id}:
        get:
            summary: |-
                GetAgentToken retrieves a single SAT by ID. Returns metadata only; the token
                secret is never included. Token IDs are globally unique, so no agent scoping
                is required in the path; the server resolves the parent agent from the token
                ID. Authorization is enforced via the `agent:read` scope, not by path prefix.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetAgentToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetAgentTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the token (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/agents/tokens/{token_id}/revoke:
        post:
            summary: |-
                RevokeAgentToken permanently revokes an SAT bound to this agent. The agent
                will receive a 401 on its next request. If this is the only active SAT for
                the agent, the agent will become disconnected. Token IDs are globally unique,
                so no agent scoping is required in the path; authorization is enforced via
                the `agent:write` scope, not by path prefix.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_RevokeAgentToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokeAgentTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the token to revoke (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIRevokeAgentTokenBody'
            tags:
                - AgentAPI
    /v1/agents/{agent.id}:
        patch:
            summary: |-
                UpdateAgent updates an agent's mutable fields.
                Use `update_mask` to specify which fields to update.
                The `kind` is immutable and cannot be updated.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_UpdateAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent.id
                  description: Unique identifier for the agent (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIUpdateAgentBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}:
        get:
            summary: GetAgent retrieves an agent by ID.
            description: |-
                Returns the Agent record with its server-derived health_status. For detailed
                telemetry (capacity, node/workload counts), use GetAgentStatus instead.

                Scope: `agent:read`
            operationId: AgentAPI_GetAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The unique identifier of the agent (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
        delete:
            summary: |-
                DeleteAgent permanently deletes an agent record and revokes all associated
                service access tokens. For TERRAFORM agents, any not-yet-completed jobs assigned
                to this agent will be failed. This action cannot be undone.
            description: 'Scope: `agent:write`'
            operationId: AgentAPI_DeleteAgent
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteAgentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: |-
                    The unique identifier of the agent to delete (UUID). All associated service
                    access tokens will be revoked.
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/clear-identity-binding:
        post:
            summary: |-
                ClearAgentIdentityBinding opens a bounded grace window during which the next
                KUBERNETES agent telemetry push that reports a different kube-system UID will
                re-pin the agent's identity. Use for DR, cluster rebuilds, or a mistaken
                initial binding. The existing pin is left intact, so if no agent reconnects
                before the window expires the original binding stands. Audit-logged.
            description: |-
                Only valid for KUBERNETES agents; TERRAFORM agents have no identity binding.

                Scope: `agent:write`
            operationId: AgentAPI_ClearAgentIdentityBinding
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ClearAgentIdentityBindingResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The Admiral agent record ID (UUID), not the kube-system UID.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPIClearAgentIdentityBindingBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/events:
        get:
            summary: |-
                ListWorkloadEvents returns a paginated list of Kubernetes events observed for
                a KUBERNETES agent's managed resources, deduplicated by event UID.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListWorkloadEvents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListWorkloadEventsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The agent (cluster) whose events to list (UUID).
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `type`: filter by event type (Normal, Warning).
                      - `reason`: filter by event reason.
                      - `component`: filter by reporting component.
                      - `host`: filter by node.
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of events to return per page. Defaults to 50 when omitted or
                    0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/jobs:
        get:
            summary: |-
                ---------------------------------------------------------------------------
                Read-only observability. Messages: jobs.proto, workloads.proto.
                ---------------------------------------------------------------------------
                ListAgentJobs returns a paginated list of jobs assigned to a TERRAFORM agent.
                Provides admin read-only visibility into agent workload.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentJobs
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentJobsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The agent whose jobs to list (UUID).
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `status`: filter by job status (PENDING, ASSIGNED, RUNNING, etc.).
                      - `job_type`: filter by job type (PLAN, APPLY, DESTROY_PLAN, DESTROY_APPLY).
                      - `run_id`: jobs for a specific run (UUID).
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of jobs to return per page. Defaults to 50 when omitted or
                    0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/status:
        get:
            summary: |-
                GetAgentStatus retrieves the current telemetry snapshot for an agent.
                Returns the server-derived health status plus the latest kind-specific
                status: capacity metrics for TERRAFORM agents, cluster telemetry for KUBERNETES
                agents.
            description: |-
                Returns NOT_FOUND if the agent does not exist. If the agent exists but has
                not reported yet, health_status will be PENDING and status will be absent.

                Scope: `agent:read`
            operationId: AgentAPI_GetAgentStatus
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetAgentStatusResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The unique identifier of the agent (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/tokens:
        get:
            summary: |-
                ListAgentTokens returns a paginated list of SATs bound to the specified
                agent. Token secrets are never included.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListAgentTokens
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListAgentTokensResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The agent to list tokens for (UUID).
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by token name.
                      - `status`: filter by token status (ACTIVE, REVOKED).
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of tokens to return per page. Defaults to 50 when omitted or
                    0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
        post:
            summary: |-
                ---------------------------------------------------------------------------
                Agent tokens
                ---------------------------------------------------------------------------
                CreateAgentToken creates a new Service Access Token (SAT) bound to the
                specified agent. Scopes are auto-assigned from the agent's kind and cannot
                be overridden. The response includes the raw token secret, shown exactly once.
            description: |-
                Use this to create additional SATs for an existing agent (e.g., for
                zero-downtime token rotation). The initial SAT is created automatically by
                CreateAgent.

                Scope: `agent:write`
            operationId: AgentAPI_CreateAgentToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateAgentTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The agent to bind this token to (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AgentAPICreateAgentTokenBody'
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/workloads:
        get:
            summary: |-
                ListWorkloads returns a paginated list of workloads running on a KUBERNETES
                agent's cluster.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_ListWorkloads
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListWorkloadsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The agent (cluster) whose workloads to list (UUID).
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `namespace`: filter by Kubernetes namespace.
                      - `kind`: filter by workload kind (Deployment, StatefulSet, DaemonSet).
                      - `name`: filter by workload name.
                      - `health_status`: filter by workload health status.
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of workloads to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - AgentAPI
    /v1/agents/{agent_id}/workloads/{workload_id}:
        get:
            summary: |-
                GetWorkload returns a single workload with its full detail: the rich snapshot
                (sync, per-resource inventory with field owners, conditions) that ListWorkloads
                omits.
            description: 'Scope: `agent:read`'
            operationId: AgentAPI_GetWorkload
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetWorkloadResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: agent_id
                  description: The agent (cluster) the workload belongs to (UUID).
                  in: path
                  required: true
                  type: string
                - name: workload_id
                  description: The workload to retrieve (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - AgentAPI
    /v1/applications:
        get:
            summary: |-
                ListApplications returns a paginated list of applications within the
                caller's tenant.
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_ListApplications
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListApplicationsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by application name.
                      - `labels.key`: filter by label key.

                    Example: `field['name'] = 'inventory-api' AND field['labels.team'] = 'logistics'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of applications to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - ApplicationAPI
        post:
            summary: CreateApplication creates a new application within the caller's tenant.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_CreateApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateApplicationRequest contains the parameters for creating a new application.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateApplicationRequest'
            tags:
                - ApplicationAPI
    /v1/applications/{application.id}:
        patch:
            summary: |-
                UpdateApplication updates an application's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_UpdateApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: application.id
                  description: Unique identifier for the application (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApplicationAPIUpdateApplicationBody'
            tags:
                - ApplicationAPI
    /v1/applications/{application_id}:
        get:
            summary: GetApplication retrieves an application by ID.
            description: 'Scope: `app:read`'
            operationId: ApplicationAPI_GetApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: application_id
                  description: The unique identifier of the application (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - ApplicationAPI
        delete:
            summary: |-
                DeleteApplication permanently deletes an application. Fails with
                FAILED_PRECONDITION if the application still has environments. Pass
                force = true to cascade-delete all environments and their runs
                (metadata only; no cloud resources are destroyed). This action cannot
                be undone.
            description: 'Scope: `app:write`'
            operationId: ApplicationAPI_DeleteApplication
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteApplicationResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: application_id
                  description: The unique identifier of the application to delete (UUID).
                  in: path
                  required: true
                  type: string
                - name: force
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                    environments and their runs (metadata records only).
                  in: query
                  required: false
                  type: boolean
            tags:
                - ApplicationAPI
    /v1/catalog-items:
        get:
            summary: |-
                ListCatalogItems returns a paginated list of catalog items within the
                caller's tenant. Use the filter to scope by name, source, or labels.
            description: 'Scope: `catalog:read`'
            operationId: CatalogAPI_ListCatalogItems
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListCatalogItemsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by catalog item name.
                      - `type`: filter by item type (TERRAFORM, HELM, KUSTOMIZE, MANIFEST).
                      - `source_id`: filter by source reference.

                    Example: `field['type'] = 'TERRAFORM'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of catalog items to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - CatalogAPI
        post:
            summary: CreateCatalogItem registers a new catalog item within the caller's tenant.
            description: |-
                The referenced source must exist. The item's ref, root, and path are
                optional and default to empty (meaning: the source's default ref, the
                repository root, and the root itself as working directory).

                Scope: `catalog:write`
            operationId: CatalogAPI_CreateCatalogItem
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateCatalogItemResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateCatalogItemRequest contains the parameters for creating a new item.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateCatalogItemRequest'
            tags:
                - CatalogAPI
    /v1/catalog-items/{catalog_item.id}:
        patch:
            summary: |-
                UpdateCatalogItem updates a catalog item's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `catalog:write`'
            operationId: CatalogAPI_UpdateCatalogItem
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateCatalogItemResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: catalog_item.id
                  description: Unique identifier for the catalog item (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CatalogAPIUpdateCatalogItemBody'
            tags:
                - CatalogAPI
    /v1/catalog-items/{catalog_item_id}:
        get:
            summary: GetCatalogItem retrieves a catalog item by ID.
            description: 'Scope: `catalog:read`'
            operationId: CatalogAPI_GetCatalogItem
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetCatalogItemResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: catalog_item_id
                  description: Unique identifier of the catalog item (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - CatalogAPI
        delete:
            summary: |-
                DeleteCatalogItem permanently deletes a catalog item. Components are
                self-contained copies and hold no back-reference, so this never fails on
                existing components. This action cannot be undone.
            description: 'Scope: `catalog:write`'
            operationId: CatalogAPI_DeleteCatalogItem
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteCatalogItemResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: catalog_item_id
                  description: Unique identifier of the catalog item to delete (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - CatalogAPI
    /v1/catalog-items/{catalog_item_id}/resolve:
        post:
            summary: |-
                ResolveCatalogItem fetches the item via its Source and returns the resolved
                revision and content digest. Does NOT stream content; content delivery
                to agents is handled separately.
            description: |-
                This operation fetches from the external system in real time and may take
                several seconds depending on the source type and size.

                Scope: `catalog:read`
            operationId: CatalogAPI_ResolveCatalogItem
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ResolveCatalogItemResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: catalog_item_id
                  description: Unique identifier of the catalog item to resolve (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CatalogAPIResolveCatalogItemBody'
            tags:
                - CatalogAPI
    /v1/changesets:
        get:
            summary: ListChangeSets returns a paginated list of change sets.
            description: |-
                Common filter fields: `application_id`, `environment_id`, `status`. The
                returned `ChangeSet` records do not include entries or variable entries;
                call GetChangeSet for the full record.

                Scope: `app:read`
            operationId: ChangeSetAPI_ListChangeSets
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListChangeSetsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `application_id`: change sets for a specific application (UUID).
                      - `environment_id`: change sets for a specific environment (UUID).
                      - `status`: filter by status (OPEN, DEPLOYED, DISCARDED).

                    Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'OPEN'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of change sets to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - ChangeSetAPI
        post:
            summary: |-
                CreateChangeSet opens a new change set for an (application, environment)
                pair.
            description: |-
                Multiple change sets can be open against the same target simultaneously.
                Conflicts are detected at deploy time, not at create time.

                Scope: `app:write`
            operationId: ChangeSetAPI_CreateChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: |-
                    CreateChangeSetRequest opens a new change set for an (application,
                    environment) pair.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateChangeSetRequest'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set.id}:
        patch:
            summary: |-
                UpdateChangeSet updates a change set's mutable metadata.
                Use `update_mask` to specify which fields to update. Only `title` and
                `description` are mutable; all other fields are immutable or transitioned
                via dedicated RPCs.
            description: |-
                Rejected when the change set is not OPEN.

                Scope: `app:write`
            operationId: ChangeSetAPI_UpdateChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set.id
                  description: Unique identifier for the change set (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIUpdateChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}:
        get:
            summary: |-
                GetChangeSet retrieves a change set by ID, including all of its component
                entries and variable entries inline.
            description: 'Scope: `app:read`'
            operationId: ChangeSetAPI_GetChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/copy:
        post:
            summary: |-
                CopyChangeSet creates a new OPEN change set in a target environment by
                copying every entry and variable entry from the source. The new change
                set's `copied_from_id` points back to the source for audit (promotion
                chain). The source change set is not modified.
            description: |-
                The target application is the source's application; only the environment
                can be retargeted. After copying, the resulting change set can be
                modified (entries added, removed, or rewritten) before being deployed.

                Scope: `app:write`
            operationId: ChangeSetAPI_CopyChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CopyChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the source change set to copy. Accepts either the short
                    ID (`cs-<suffix>`) or the canonical UUID. Can be in any status.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPICopyChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/diff:
        get:
            summary: |-
                DiffChangeSet computes a structural diff for an OPEN change set: the
                per-entry deltas relative to current env HEAD, the per-variable deltas
                relative to current env variables, and the deployed components whose
                `values_template` references a name touched by this change set ("if you
                apply this, these other components will also re-plan").
            description: |-
                Sensitive values are never returned. Changed-but-masked entries set
                `sensitive=true` and omit `old`/`new` so the reviewer knows a change is
                present without seeing the value.

                Available for change sets in any status; for non-OPEN change sets the
                result reflects the diff against the env's CURRENT HEAD, not the env's
                state at the time the change set was deployed.

                Scope: `app:read`
            operationId: ChangeSetAPI_DiffChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DiffChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/discard:
        post:
            summary: |-
                DiscardChangeSet abandons an OPEN change set. The record is preserved for
                audit but no entries can be added or modified. Status becomes DISCARDED
                (terminal). Rejected when the change set is not OPEN.
            description: 'Scope: `app:write`'
            operationId: ChangeSetAPI_DiscardChangeSet
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DiscardChangeSetResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set to discard. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPIDiscardChangeSetBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/entries/{component_name}:
        delete:
            summary: |-
                RemoveEntry deletes a single component entry from an OPEN change set.
                Removes the proposal entirely; this does NOT mark the component for
                destruction. To destroy a component, use SetEntry with `change_type =
                DESTROY`.
            description: |-
                Rejected when the change set is not OPEN.

                Scope: `app:write`
            operationId: ChangeSetAPI_RemoveEntry
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RemoveEntryResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
                - name: component_name
                  description: Component name of the entry to remove.
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
        put:
            summary: |-
                SetEntry creates or replaces an entry for a component name within the
                change set. One name = one entry; calling SetEntry for an existing name
                overwrites the prior entry.
            description: |-
                The `change_type` field selects the operation:
                  - CREATE: add a new component. Requires `catalog_item_id`. Rejects if a
                    component with the same name already exists in the application.
                  - UPDATE: change an existing component. The name must match an
                    existing component in the application. Only non-empty optional
                    fields are recorded as changes.
                  - DESTROY: schedule the component for terraform destroy at deploy.
                  - ORPHAN: detach from management without destroying infrastructure.

                Rejected when the change set is not OPEN.

                Scope: `app:write`
            operationId: ChangeSetAPI_SetEntry
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetEntryResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
                - name: component_name
                  description: Component name (stable identifier set at creation). Required.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPISetEntryBody'
            tags:
                - ChangeSetAPI
    /v1/changesets/{change_set_id}/variables/{key}:
        delete:
            summary: |-
                RemoveVariable records the intent to delete a variable on apply. Writes
                a tombstone variable entry (value absent) so the apply phase removes the
                key from the target environment.
            description: |-
                To withdraw the deletion intent before deploy, call SetVariable for the
                same key with the desired value (which overwrites the tombstone).

                Rejected when the change set is not OPEN.

                Scope: `app:write`
            operationId: ChangeSetAPI_RemoveVariable
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RemoveVariableResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
                - name: key
                  description: The variable key to remove on apply.
                  in: path
                  required: true
                  type: string
            tags:
                - ChangeSetAPI
        put:
            summary: |-
                SetVariable creates or replaces a variable entry for a key within the
                change set. One key = one entry. At deploy time, the variable's value is
                upserted in the target environment.
            description: |-
                To delete a variable on apply, use RemoveVariable; it writes a
                tombstone entry on the change set so the apply phase removes the key.

                Rejected when the change set is not OPEN.

                Scope: `app:write`
            operationId: ChangeSetAPI_SetVariable
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1SetVariableResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: change_set_id
                  description: |-
                    Identifier of the change set. Accepts either the short ID
                    (`cs-<suffix>`) or the canonical UUID.
                  in: path
                  required: true
                  type: string
                - name: key
                  description: The variable key.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChangeSetAPISetVariableBody'
            tags:
                - ChangeSetAPI
    /v1/credentials:
        get:
            summary: |-
                ListCredentials returns a paginated list of credentials within the caller's
                tenant. Sensitive fields are never included.
            description: 'Scope: `credential:read`'
            operationId: CredentialAPI_ListCredentials
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListCredentialsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by credential name.
                      - `type`: filter by credential type (SSH_KEY, BASIC_AUTH, BEARER_TOKEN).
                      - `labels.key`: filter by label key.

                    Example: `field['type'] = 'BEARER_TOKEN'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of credentials to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - CredentialAPI
        post:
            summary: CreateCredential creates a new credential within the caller's tenant.
            description: |-
                The credential type and auth config must match. For example, a GIT_TOKEN
                credential requires a matching auth_config (e.g. BEARER_TOKEN → bearer_token).

                Scope: `credential:write`
            operationId: CredentialAPI_CreateCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateCredentialRequest contains the parameters for creating a new credential.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateCredentialRequest'
            tags:
                - CredentialAPI
    /v1/credentials/{credential.id}:
        patch:
            summary: |-
                UpdateCredential updates a credential's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: |-
                When updating auth_config, the entire auth config is replaced. Partial
                updates within the auth config oneof are not supported. Omitting auth_config
                from the update_mask leaves credentials unchanged.

                Scope: `credential:write`
            operationId: CredentialAPI_UpdateCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: credential.id
                  description: Unique identifier for the credential (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CredentialAPIUpdateCredentialBody'
            tags:
                - CredentialAPI
    /v1/credentials/{credential_id}:
        get:
            summary: GetCredential retrieves a credential by ID.
            description: |-
                Returns credential metadata only. Sensitive fields are never included
                in the response.

                Scope: `credential:read`
            operationId: CredentialAPI_GetCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: credential_id
                  description: The unique identifier of the credential (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - CredentialAPI
        delete:
            summary: |-
                DeleteCredential permanently deletes a credential. Fails if any sources
                still reference this credential. Remove or reassign those sources first.
                This action cannot be undone.
            description: 'Scope: `credential:write`'
            operationId: CredentialAPI_DeleteCredential
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteCredentialResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: credential_id
                  description: |-
                    The unique identifier of the credential to delete (UUID).
                    Fails if any sources still reference this credential.
                  in: path
                  required: true
                  type: string
            tags:
                - CredentialAPI
    /v1/environments:
        get:
            summary: |-
                ListEnvironments returns a paginated list of environments. Use the filter
                to scope by application or labels.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_ListEnvironments
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `application_id`: filter by parent application (UUID).
                      - `name`: filter by environment name.
                      - `labels.key`: filter by label key.

                    Example: `field['application_id'] = '<uuid>' AND field['name'] = 'prod'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of environments to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - EnvironmentAPI
        post:
            summary: CreateEnvironment creates a new environment for the specified application.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_CreateEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateEnvironmentRequest contains the parameters for creating a new environment.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateEnvironmentRequest'
            tags:
                - EnvironmentAPI
    /v1/environments/{environment.id}:
        patch:
            summary: |-
                UpdateEnvironment updates an environment's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_UpdateEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment.id
                  description: Unique identifier for the environment (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/EnvironmentAPIUpdateEnvironmentBody'
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}:
        get:
            summary: GetEnvironment retrieves an environment by ID.
            description: 'Scope: `env:read`'
            operationId: EnvironmentAPI_GetEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The unique identifier of the environment (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - EnvironmentAPI
        delete:
            summary: |-
                DeleteEnvironment permanently deletes an environment. Fails with
                FAILED_PRECONDITION if the environment has any runs. Pass force = true
                to cascade-delete all run records (metadata only; no cloud resources
                are destroyed). This action cannot be undone.
            description: 'Scope: `env:write`'
            operationId: EnvironmentAPI_DeleteEnvironment
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteEnvironmentResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The unique identifier of the environment to delete (UUID).
                  in: path
                  required: true
                  type: string
                - name: force
                  description: |-
                    When true, bypass the children-exist check and cascade-delete all
                    run records (metadata only).
                  in: query
                  required: false
                  type: boolean
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}/components:
        get:
            summary: |-
                ListEnvironmentComponents returns the components currently deployed to
                a single environment, with each component's last-succeeded revision
                surfaced as a denormalized status block. Use this to render an
                at-a-glance "what's running here?" view without separate calls per
                component.
            description: |-
                Components without a SUCCEEDED revision (e.g. CREATE entries that
                failed mid-plan) still appear, with `last_revision_status` and
                `last_deployed_at` empty.

                Scope: `env:read`
            operationId: EnvironmentAPI_ListEnvironmentComponents
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentComponentsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The environment whose components should be listed (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - EnvironmentAPI
    /v1/environments/{environment_id}/variables:
        get:
            summary: |-
                ListEnvironmentVariables returns a paginated list of variables scoped
                to a single environment. Variables are mutated exclusively through
                change sets (ChangeSetAPI.SetVariable / RemoveVariable); this endpoint
                is read-only.
            description: |-
                Sensitive variable values are masked in the response.

                Scope: `var:read`
            operationId: EnvironmentAPI_ListEnvironmentVariables
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListEnvironmentVariablesResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: environment_id
                  description: The environment whose variables should be listed (UUID).
                  in: path
                  required: true
                  type: string
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `key`: filter by variable key (supports prefix matching via ~=).
                      - `sensitive`: filter by sensitivity flag.
                      - `type`: filter by variable type (STRING, NUMBER, BOOLEAN, COMPLEX).
                      - `source`: filter by source (USER, INFRASTRUCTURE).

                    Example: `field['source'] = 'USER' AND field['sensitive'] = false`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of variables to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - EnvironmentAPI
    /v1/runs:
        get:
            summary: ListRuns returns a paginated list of runs.
            description: |-
                Common filter fields: `application_id`, `environment_id`, `status`.
                Use to view run history for an environment.

                Scope: `run:read`
            operationId: RunAPI_ListRuns
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListRunsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `application_id`: runs for a specific application (UUID).
                      - `environment_id`: runs to a specific environment (UUID).
                      - `status`: filter by run status (PENDING, PLANNING, APPLYING, SUCCEEDED, ...).
                      - `change_set_id`: runs for a specific change set (UUID).

                    Example: `field['environment_id'] = '<uuid>' AND field['status'] = 'SUCCEEDED'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of runs to return per page. Defaults to 50 when omitted or
                    0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - RunAPI
        post:
            summary: CreateRun triggers a new run for an application+environment.
            description: |-
                The server resolves all components (with environment overrides applied),
                builds the dependency DAG, and begins rendering and executing revisions.

                Concurrency: only one run can be active per application+environment
                at a time. If a run is already in an active state (PENDING, QUEUED,
                PLANNING, PLANNED, or APPLYING), the new run is queued and will start
                automatically when the current run completes or is canceled.

                Scope: `run:write`
            operationId: RunAPI_CreateRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateRunRequest triggers a new run.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateRunRequest'
            tags:
                - RunAPI
    /v1/runs/{run_id}:
        get:
            summary: |-
                GetRun retrieves a run by ID, including its composite status derived
                from all component revisions.
            description: 'Scope: `run:read`'
            operationId: RunAPI_GetRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run. Either a UUID or a `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/apply:
        post:
            summary: |-
                ApplyRun transitions a run from plan phase to apply phase. Revisions
                currently in PLANNED status get an APPLY job dispatched to their
                assigned TERRAFORM agent. This is the single authorization gate per changeset;
                downstream layers auto-continue plan->apply without re-prompting.
            description: 'Scope: `run:write`'
            operationId: RunAPI_ApplyRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ApplyRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run to apply. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIApplyRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/cancel:
        post:
            summary: |-
                CancelRun cancels an in-progress run. Stops pending and queued
                revisions from proceeding and prevents the queue from advancing; the run
                status becomes CANCELED. APPLYING runs cannot be canceled because
                terraform/apply cannot be interrupted mid-execution; the call is
                rejected with FAILED_PRECONDITION. Wait for the in-flight phase to
                complete before cancellation. Revisions already SUCCEEDED remain
                applied.
            description: 'Scope: `run:write`'
            operationId: RunAPI_CancelRun
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CancelRunResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run to cancel. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPICancelRunBody'
            tags:
                - RunAPI
    /v1/runs/{run_id}/revisions:
        get:
            summary: ListRevisions returns all component revisions for a run.
            description: 'Scope: `run:read`'
            operationId: RunAPI_ListRevisions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListRevisionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: Identifier of the run. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of revisions to return per page. Defaults to 50 when
                    omitted or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/revisions/{revision_id}:
        get:
            summary: GetRevision retrieves a single component revision within a run.
            description: 'Scope: `run:read`'
            operationId: RunAPI_GetRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: The run. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: revision_id
                  description: The revision (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - RunAPI
    /v1/runs/{run_id}/revisions/{revision_id}/retry:
        post:
            summary: |-
                RetryRevision retries a failed component revision. A new execution
                attempt is made using the same rendered artifacts. The retry count
                is incremented. Only applicable to revisions in FAILED status.
            description: 'Scope: `run:write`'
            operationId: RunAPI_RetryRevision
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RetryRevisionResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: run_id
                  description: The run. UUID or `run-<suffix>` display ID.
                  in: path
                  required: true
                  type: string
                - name: revision_id
                  description: The revision to retry (UUID). Must be in FAILED status.
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RunAPIRetryRevisionBody'
            tags:
                - RunAPI
    /v1/sources:
        get:
            summary: |-
                ListSources returns a paginated list of sources within the caller's tenant.
                Use the filter to scope by type or labels.
            description: 'Scope: `source:read`'
            operationId: SourceAPI_ListSources
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListSourcesResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by source name.
                      - `type`: filter by source type (GIT, TERRAFORM, HELM, OCI, HTTP).
                      - `labels.key`: filter by label key.

                    Example: `field['type'] = 'TERRAFORM' AND field['labels.team'] = 'platform'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of sources to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - SourceAPI
        post:
            summary: CreateSource creates a new source definition within the caller's tenant.
            description: |-
                The source type and source_config must match. For example, a
                TERRAFORM source requires a TerraformConfig.

                Scope: `source:write`
            operationId: SourceAPI_CreateSource
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreateSourceResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreateSourceRequest contains the parameters for creating a new source.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreateSourceRequest'
            tags:
                - SourceAPI
    /v1/sources/{source.id}:
        patch:
            summary: |-
                UpdateSource updates a source's mutable fields.
                Use the `update_mask` to specify which fields to update.
            description: 'Scope: `source:write`'
            operationId: SourceAPI_UpdateSource
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdateSourceResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: source.id
                  description: Unique identifier for the source (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/SourceAPIUpdateSourceBody'
            tags:
                - SourceAPI
    /v1/sources/{source_id}:
        get:
            summary: GetSource retrieves a source by ID.
            description: 'Scope: `source:read`'
            operationId: SourceAPI_GetSource
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetSourceResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: source_id
                  description: Unique identifier of the source (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - SourceAPI
        delete:
            summary: |-
                DeleteSource permanently deletes a source definition. Fails if any
                application components still reference this source. Remove or reassign
                those components first. This action cannot be undone.
            description: 'Scope: `source:write`'
            operationId: SourceAPI_DeleteSource
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1DeleteSourceResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: source_id
                  description: |-
                    Unique identifier of the source to delete (UUID).
                    Fails if any components still reference this source.
                  in: path
                  required: true
                  type: string
            tags:
                - SourceAPI
    /v1/sources/{source_id}/test:
        post:
            summary: |-
                TestSource validates the attached credential against the source URL by
                performing an authenticated probe against the external system. Writes the
                outcome (success or failure) and timestamp to the source record.
            description: |-
                A credential in isolation cannot be meaningfully tested. A GitHub PAT is
                just a string until a target URL is known. TestSource is where the
                "attach credential, verify it works" flow lives.

                This operation queries the external system in real time and may take
                several seconds.

                Scope: `source:write`
            operationId: SourceAPI_TestSource
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1TestSourceResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: source_id
                  description: Unique identifier of the source to test (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/SourceAPITestSourceBody'
            tags:
                - SourceAPI
    /v1/sources/{source_id}/versions:
        get:
            summary: |-
                ListSourceVersions queries the external system for available versions of
                this source's artifact.
            description: |-
                For Terraform registry sources, this calls the Module Registry Protocol's
                version listing endpoint. For Helm repositories, it parses the index.yaml.
                For OCI sources, it lists tags. For Git sources, it lists branches and
                tags via ls-remote, each annotated with the commit it currently resolves
                to.

                This operation queries the external system in real time and may take
                several seconds.

                Scope: `source:read`
            operationId: SourceAPI_ListSourceVersions
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListSourceVersionsResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: source_id
                  description: Unique identifier of the source to query versions for (UUID).
                  in: path
                  required: true
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of versions to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token for fetching additional versions.
                  in: query
                  required: false
                  type: string
            tags:
                - SourceAPI
    /v1/user/me:
        get:
            summary: |-
                GetMe retrieves the profile of the currently authenticated user.
                The user is identified by the authentication token provided in the request.
            description: 'Scope: any authenticated token (no specific scope required).'
            operationId: UserAPI_GetMe
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetMeResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            tags:
                - UserAPI
    /v1/user/tokens:
        get:
            summary: |-
                ListPersonalAccessTokens returns a paginated list of the authenticated
                user's PATs. Token secrets are never included.
            description: 'Scope: `token:read`'
            operationId: UserAPI_ListPersonalAccessTokens
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1ListPersonalAccessTokensResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: filter
                  description: |-
                    Filter expression to narrow results. Uses the Admiral filter DSL (see the
                    API documentation for the full operator and predicate reference).

                    Filterable fields:
                      - `name`: filter by token name.
                      - `status`: filter by token status (ACTIVE, REVOKED).

                    Example: `field['status'] = 'ACTIVE'`
                  in: query
                  required: false
                  type: string
                - name: page_size
                  description: |-
                    Maximum number of tokens to return per page. Defaults to 50 when omitted
                    or 0; must not exceed 100.
                  in: query
                  required: false
                  type: integer
                  format: int32
                - name: page_token
                  description: Opaque pagination token from a previous response.
                  in: query
                  required: false
                  type: string
            tags:
                - UserAPI
        post:
            summary: |-
                CreatePersonalAccessToken creates a new PAT for the authenticated user.
                The response includes the raw token secret, which is shown exactly once
                and cannot be retrieved again.
            description: 'Scope: `token:write`'
            operationId: UserAPI_CreatePersonalAccessToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1CreatePersonalAccessTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: body
                  description: CreatePersonalAccessTokenRequest contains the parameters for creating a new PAT.
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/v1CreatePersonalAccessTokenRequest'
            tags:
                - UserAPI
    /v1/user/tokens/{token_id}:
        get:
            summary: |-
                GetPersonalAccessToken retrieves a single PAT by ID.
                Returns metadata only. The token secret is never included.
            description: 'Scope: `token:read`'
            operationId: UserAPI_GetPersonalAccessToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetPersonalAccessTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the token (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - UserAPI
        patch:
            summary: |-
                UpdatePersonalAccessToken updates a PAT's mutable fields (name, scopes).
                Only active tokens can be updated. The token secret and expiration are
                immutable after creation.
            description: 'Scope: `token:write`'
            operationId: UserAPI_UpdatePersonalAccessToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1UpdatePersonalAccessTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the token to update (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/UserAPIUpdatePersonalAccessTokenBody'
            tags:
                - UserAPI
    /v1/user/tokens/{token_id}/revoke:
        post:
            summary: |-
                RevokePersonalAccessToken permanently revokes a PAT. The token becomes
                immediately unusable and cannot be restored.
            description: 'Scope: `token:write`'
            operationId: UserAPI_RevokePersonalAccessToken
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1RevokePersonalAccessTokenResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: token_id
                  description: The unique identifier of the token to revoke (UUID).
                  in: path
                  required: true
                  type: string
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/UserAPIRevokePersonalAccessTokenBody'
            tags:
                - UserAPI
    /v1/users/{user_id}:
        get:
            summary: GetUser retrieves a user's profile by ID.
            description: 'Scope: `user:read`'
            operationId: UserAPI_GetUser
            responses:
                "200":
                    description: A successful response.
                    schema:
                        $ref: '#/definitions/v1GetUserResponse'
                default:
                    description: An unexpected error response.
                    schema:
                        $ref: '#/definitions/rpcStatus'
            parameters:
                - name: user_id
                  description: The unique identifier of the user (UUID).
                  in: path
                  required: true
                  type: string
            tags:
                - UserAPI
    /api/v1/state/{component_id}/env/{environment_id}:
        parameters:
            - name: component_id
              in: path
              required: true
              description: The infrastructure component (UUID).
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              description: The environment the state is scoped to (UUID).
              schema:
                type: string
                format: uuid
        get:
            tags:
                - State Backend
            summary: Fetch current Terraform state
            description: >-
                Returns the current `.tfstate` document for the component+environment, or 204 when no state exists yet. Maps to the Terraform HTTP backend GET. Authenticate with a PAT/SAT (HTTP Basic password or Bearer token); requires the `state:read` scope.
            responses:
                "200":
                    description: The current Terraform state document.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                "204":
                    description: No state exists yet.
                "401":
                    description: Unauthorized.
                "404":
                    description: Component or environment not found.
        post:
            tags:
                - State Backend
            summary: Push Terraform state
            description: >-
                Stores a new state version; the body is the full `.tfstate` document. Maps to the Terraform HTTP backend POST. Authenticate with a PAT/SAT; requires the `state:write` scope.
            parameters:
                - name: ID
                  in: query
                  required: false
                  description: The held lock ID, when the state is locked.
                  schema:
                    type: string
                    format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true
            responses:
                "200":
                    description: State stored.
                "400":
                    description: Invalid state document.
                "413":
                    description: State document too large.
                "423":
                    description: State is locked by a different lock ID.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StateLockInfo"
    /api/v1/state/{component_id}/env/{environment_id}/lock:
        description: >-
            Locks and unlocks the component+environment state using Terraform's custom `LOCK` and `UNLOCK` HTTP methods (which OpenAPI cannot express as operations) with a `StateLockInfo` body. Returns 200 on success or 423 (with the currently-held `StateLockInfo`) on conflict. Authenticate with a PAT/SAT; requires the `state:write` scope.
        parameters:
            - name: component_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
            - name: environment_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
definitions:
    AgentAPIClearAgentIdentityBindingBody:
        type: object
        properties:
            reason:
                type: string
                description: Free-text audit reason for the rebind (e.g. "DR rebuild 2026-05-30").
            grace_window:
                type: string
                description: How long the grace window stays open. Defaults to 1h server-side if unset.
        description: |-
            ClearAgentIdentityBindingRequest opens a rebind grace window for a KUBERNETES
            agent.
    AgentAPICreateAgentTokenBody:
        type: object
        properties:
            name:
                type: string
                description: |-
                    URL-safe, human-readable identifier for the token (e.g., "prod-agent-key").
                    Unique within the agent's tokens. Lowercase alphanumeric and hyphens only,
                    must start with a letter and end with an alphanumeric character (1-63 chars).
            expires_at:
                type: string
                format: date-time
                description: Optional expiration time. If unset, the token does not expire.
        description: |-
            CreateAgentTokenRequest contains the parameters for creating a new SAT bound to
            an agent.
        required:
            - name
    AgentAPIRevokeAgentTokenBody:
        type: object
        description: |-
            RevokeAgentTokenRequest identifies an agent SAT to revoke. Token IDs are
            globally unique; the server resolves the parent agent from the token ID.
    AgentAPIUpdateAgentBody:
        type: object
        properties:
            agent:
                type: object
                properties:
                    kind:
                        $ref: '#/definitions/v1AgentKind'
                        description: |-
                            The execution plane this agent serves. Set at creation and immutable
                            (CreateAgentRequest.kind carries the not_in:[0] requirement). Not validated
                            here so a partial Agent in UpdateAgentRequest (which omits kind) passes.
                    name:
                        type: string
                        description: |-
                            URL-safe, human-readable identifier (e.g., "prod-terraform" or "prod-us-east-1").
                            Unique within the tenant. Lowercase alphanumeric and hyphens only, must start
                            with a letter and end with an alphanumeric character (1-63 chars).
                    description:
                        type: string
                        description: Optional longer-form description of the agent's purpose.
                    labels:
                        type: object
                        additionalProperties:
                            type: string
                        description: |-
                            Arbitrary key-value labels for organizing and filtering agents
                            (e.g., `{"cloud": "aws", "team": "platform"}`).
                    health_status:
                        $ref: '#/definitions/v1AgentHealthStatus'
                        description: Derived health status based on reporting recency and kind-specific signals.
                        readOnly: true
                    cluster_uid:
                        type: string
                        description: |-
                            (KUBERNETES only) The Kubernetes kube-system namespace UID, bound at agent
                            registration using a first-write-wins strategy. Used to detect when a token
                            is accidentally deployed to a different physical cluster. Empty for TERRAFORM
                            agents.
                        readOnly: true
                    created_by:
                        $ref: '#/definitions/v1ActorRef'
                        description: The user or agent who created this agent (server-populated from token).
                        readOnly: true
                    created_at:
                        type: string
